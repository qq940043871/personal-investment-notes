<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能体 · 业务设计库</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#7C3AED',
                        secondary: '#64748B',
                        accent: '#10B981'
                    }
                }
            }
        }
    </script>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .portal-container {
            height: calc(100vh - 64px);
            overflow: hidden;
        }

        .nav-item:hover {
            background-color: #F5F3FF;
        }

        .active-nav {
            background-color: #EDE9FE;
            border-left: 4px solid #7C3AED;
        }

        #mainFrame {
            width: 100%;
            height: 100%;
            border: 0;
            overflow: auto;
        }

        .submenu {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }

        .submenu.expanded {
            max-height: 2000px;
        }

        .rotate-90 {
            transform: rotate(90deg);
        }

        /* 优化侧边栏滚动 */
        aside {
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #CBD5E1 #F1F5F9;
        }

        /* 自定义滚动条样式 */
        aside::-webkit-scrollbar {
            width: 6px;
        }

        aside::-webkit-scrollbar-track {
            background: #F1F5F9;
        }

        aside::-webkit-scrollbar-thumb {
            background-color: #CBD5E1;
            border-radius: 3px;
        }

        aside::-webkit-scrollbar-thumb:hover {
            background-color: #94A3B8;
        }

        /* 响应式样式 */
        @media (max-width: 768px) {
            aside {
                position: fixed;
                top: 64px;
                left: 0;
                width: 80%;
                max-width: 300px;
                height: calc(100vh - 64px);
                z-index: 1000;
                box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
                background-color: white;
            }

            .portal-container {
                padding: 0;
            }

            iframe {
                border-radius: 0 !important;
            }
        }

        /* 背景遮罩 */
        .sidebar-overlay {
            position: fixed;
            top: 64px;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 999;
            display: none;
        }

        .sidebar-overlay.active {
            display: block;
        }
    </style>
</head>

<body class="bg-gray-50">
    <header class="bg-white shadow-sm h-16 flex items-center px-6">
        <button id="menu-toggle" class="md:hidden mr-4 text-gray-600 hover:text-primary">
            <i class="fas fa-bars text-xl"></i>
        </button>
        <div class="flex items-center">
            <i class="fas fa-robot text-primary text-2xl mr-3"></i>
            <h1 class="text-xl font-bold text-gray-800">AI 智能体 · 业务设计库</h1>
        </div>
        <div class="ml-auto flex items-center space-x-4">
            <a href="../index.html" class="text-sm text-gray-600 hover:text-primary">
                <i class="fas fa-arrow-left mr-1"></i>工作台
            </a>
            <a href="../02-现货贸易/index.html" class="text-sm text-gray-600 hover:text-primary">
                <i class="fas fa-boxes-stacked mr-1"></i>现货贸易
            </a>
            <div class="flex items-center">
                <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-white mr-2">
                    <i class="fas fa-user"></i>
                </div>
                <span class="text-gray-700">架构师</span>
            </div>
        </div>
    </header>

    <div class="flex flex-col min-h-screen">
        <div class="flex flex-1">
            <div id="sidebar-overlay" class="sidebar-overlay"></div>
            <aside id="sidebar" class="w-64 bg-white shadow-md h-screen sticky top-16 overflow-y-auto md:block hidden">
                <nav class="py-4">
                    <div class="px-4 py-2 text-xs font-semibold text-gray-500 uppercase tracking-wider mt-2">总览</div>

                    <div class="nav-item">
                        <a href="#" onclick="loadPage('README.md')"
                            class="flex items-center px-4 py-3 text-gray-700 hover:text-primary">
                            <i class="fas fa-book mr-3"></i>
                            <span>目录说明 · README</span>
                        </a>
                    </div>

                    <div class="nav-item">
                        <a href="#" onclick="loadPage('00-导航.md')"
                            class="flex items-center px-4 py-3 text-gray-700 hover:text-primary">
                            <i class="fas fa-compass mr-3"></i>
                            <span>总导航 · 主题与权威源</span>
                        </a>
                    </div>

                    <div class="px-4 py-2 text-xs font-semibold text-gray-500 uppercase tracking-wider mt-4">业务设计</div>

                    <div class="nav-item">
                        <a href="#" onclick="toggleMainMenu('design')"
                            class="flex items-center justify-between px-4 py-3 text-gray-700 hover:text-primary">
                            <div class="flex items-center">
                                <i class="fas fa-sitemap mr-3"></i>
                                <span>03 业务设计</span>
                            </div>
                            <i class="fas fa-chevron-right transition-transform duration-200 rotate-90" id="design-chevron"></i>
                        </a>
                        <div class="submenu ml-8 expanded" id="design-submenu">
                            <a href="#" onclick="loadPage('03-业务设计/AI智能体企业级应用平台-定位与项目价值.md')"
                                class="block px-4 py-2 text-gray-600 hover:text-primary">平台定位与项目价值</a>
                            <a href="#" onclick="loadPage('03-业务设计/政策解读Agent-通用设计.md')"
                                class="block px-4 py-2 text-gray-600 hover:text-primary">政策解读 Agent（通用底座）</a>
                            <a href="#" onclick="loadPage('03-业务设计/电力政策解读Agent-完整设计.md')"
                                class="block px-4 py-2 text-gray-600 hover:text-primary">电力政策解读 Agent</a>
                            <a href="#" onclick="loadPage('03-业务设计/政策解读Agent-面试问题与回答要点.md')"
                                class="block px-4 py-2 text-gray-600 hover:text-primary">政策解读 Agent · 面试问答</a>
                            <a href="#" onclick="loadPage('03-业务设计/智能客服-完整流程设计.md')"
                                class="block px-4 py-2 text-gray-600 hover:text-primary">智能客服完整流程</a>
                            <a href="#" onclick="loadPage('03-业务设计/08-Dify与自研业务中台-技术选型复盘.md')"
                                class="block px-4 py-2 text-gray-600 hover:text-primary">Dify 与自研中台 · 选型复盘</a>
                        </div>
                    </div>
                </nav>
            </aside>

            <main class="flex-1 p-6 portal-container">
                <iframe id="mainFrame" src="md-viewer.html?file=00-导航.md" class="w-full h-full border-0 rounded-lg shadow"></iframe>
            </main>
        </div>

        <footer class="bg-white border-t border-gray-200 py-4 px-6">
            <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center">
                <div class="text-gray-600 text-sm mb-2 md:mb-0">
                    © 2026 架构师学习笔记 · AI 智能体. 保留所有权利.
                </div>
                <div class="flex space-x-4">
                    <a href="../index.html" class="text-gray-600 hover:text-primary text-sm">工作台</a>
                    <a href="../02-现货贸易/index.html" class="text-gray-600 hover:text-primary text-sm">现货贸易</a>
                    <a href="00-导航.md" class="text-gray-600 hover:text-primary text-sm">目录导航</a>
                </div>
            </div>
        </footer>
    </div>

    <script>
        function toggleMainMenu(menuId) {
            const submenu = document.getElementById(menuId + '-submenu');
            const chevron = document.getElementById(menuId + '-chevron');

            if (submenu && chevron) {
                submenu.classList.toggle('expanded');
                chevron.classList.toggle('rotate-90');
            }
        }

        function loadPage(page) {
            const mainFrame = document.getElementById('mainFrame');
            if (mainFrame) {
                // 检查是否为MD文件
                if (page.endsWith('.md')) {
                    // 使用md-viewer.html来渲染MD文件
                    mainFrame.src = `md-viewer.html?file=${encodeURIComponent(page)}`;
                } else {
                    mainFrame.src = page;
                }
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            // 汉堡菜单切换
            const menuToggle = document.getElementById('menu-toggle');
            const sidebar = document.getElementById('sidebar');
            const sidebarOverlay = document.getElementById('sidebar-overlay');

            function toggleSidebar() {
                sidebar.classList.toggle('hidden');
                sidebarOverlay.classList.toggle('active');
            }

            if (menuToggle && sidebar && sidebarOverlay) {
                menuToggle.addEventListener('click', toggleSidebar);

                // 点击背景遮罩关闭侧边栏
                sidebarOverlay.addEventListener('click', function () {
                    if (!sidebar.classList.contains('hidden')) {
                        toggleSidebar();
                    }
                });

                // 在小屏幕上点击菜单项后关闭菜单
                const navLinks = document.querySelectorAll('aside a');
                navLinks.forEach(link => {
                    link.addEventListener('click', function () {
                        if (window.innerWidth < 768 && !sidebar.classList.contains('hidden')) {
                            toggleSidebar();
                        }
                    });
                });
            }
        });
    </script>
</body>

</html>
