                    # 读上游响应头缓冲\nproxy_buffers 8 4k;                        # 响应体缓冲块数与大小\nproxy_busy_buffers_size 8k;                # 正在发送给客户端时的缓冲上限\nproxy_temp_path /var/tmp/nginx_proxy;      # 大响应落盘目录\nproxy_max_temp_file_size 1024m;            # 落盘上限<\/code><\/pre>\n<p>原理与取舍：<\/p>\n<ul><li><strong>开启缓冲<\/strong>：Nginx 先<strong>收完上游响应<\/strong>（或收满缓冲）再发给客户端 → 上游可以快速释放连接，<strong>保护上游<\/strong>；适合大响应、慢客户端。<\/li><li><strong>关闭缓冲<\/strong>（<code>proxy_buffering off<\/code>）：边收边发 → 客户端首字节更快，适合 <strong>SSE（Server-Sent Events）、WebSocket、直播流<\/strong>等实时场景。<\/li><li>大响应超过 <code>proxy_busy_buffers_size<\/code> 会<strong>临时落盘<\/strong>（temp 文件），影响性能，可调大内存缓冲。<\/li><\/ul>\n<blockquote>追问：为什么 SSE 必须关缓冲？因为开启缓冲时 Nginx 会等上游响应满缓冲才推送，事件流会卡住；同时还要关闭 gzip、设置长超时。<\/blockquote>"}, {"q": "3.6 反向代理如何传递真实 IP？", "tag": "高频", "body": "<p>核心是三个头：<code>X-Real-IP<\/code>、<code>X-Forwarded-For<\/code>、<code>X-Forwarded-Proto<\/code>。<\/p>\n<pre><code class=\"lang-nginx\">location / {\n    proxy_set_header X-Real-IP $remote_addr;\n    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n    proxy_set_header X-Forwarded-Proto $scheme;\n}<\/code><\/pre>\n<p>后端获取方式：<\/p>\n<ul><li><strong>Nginx 层<\/strong>：<code>$remote_addr<\/code> 就是直连客户端 IP（无前置代理时）。<\/li><li><strong>Java<\/strong>：<code>request.getHeader(\"X-Forwarded-For\")<\/code> 取第一个 IP。<\/li><li><strong>Go<\/strong>：<code>X-Forwarded-For<\/code> 头解析。<\/li><li><strong>Python（Django/Flask）<\/strong>：需配置 <code>REMOTE_ADDR<\/code> 信任代理或使用 <code>ProxyFix<\/code> 中间件。<\/li><\/ul>\n<blockquote>加分点：安全要点——XFF 是客户端可伪造的，<strong>最左边 IP 不一定可信<\/strong>。如果 Nginx 直连客户端，后端应优先信任 <code>$remote_addr<\/code>；若前面有可信 CDN，配置 CDN 白名单后取 CDN 写入的 XFF 最右（或倒数第二）个 IP。<\/blockquote>"}, {"q": "3.7 反向代理 WebSocket", "tag": "高频", "body": "<p>WebSocket 是<strong>长连接双向通信<\/strong>（基于 HTTP Upgrade），反向代理必须支持协议升级：<\/p>\n<pre><code class=\"lang-nginx\">location /ws/ {\n    proxy_pass http://ws_backend;\n    proxy_http_version 1.1;                    # 必须 HTTP/1.1（Upgrade 只在 1.1）\n    proxy_set_header Upgrade $http_upgrade;    # 透传 Upgrade 头\n    proxy_set_header Connection \"upgrade\";     # 固定为 upgrade\n    proxy_read_timeout 3600s;                  # 长连接超时调大（默认 60s 会断）\n    proxy_send_timeout 3600s;\n}<\/code><\/pre>\n<p>关键点：<\/p>\n<ol><li><strong>HTTP/1.1<\/strong>：HTTP/1.0 不支持 Upgrade。<\/li><li><strong>Connection \"upgrade\"<\/strong>：<code>$http_upgrade<\/code> 有值时必须固定为 upgrade，否则 Nginx 默认转发 \"close\"。<\/li><li><strong>超时<\/strong>：WebSocket 是长连接，<code>proxy_read_timeout<\/code> 必须大于心跳间隔，否则 Nginx 会掐断空闲连接。<\/li><li><strong>会话保持<\/strong>：WebSocket 不支持 HTTP 层面的会话保持（无 Cookie 重定向），必须用 <strong>ip_hash / sticky<\/strong> 保证同一客户端始终连同一后端（或后端做广播/Redis 同步状态）。<\/li><\/ol>\n<blockquote>追问：WebSocket 负载均衡怎么做？用 <code>ip_hash<\/code> 或第三方 <code>sticky<\/code> 模块按来源 IP/会话粘滞；后端是多实例时还要考虑<strong>跨节点消息同步<\/strong>（Redis Pub/Sub、MQ）或改造为<strong>无状态<\/strong>（状态放 Redis/DB）。<\/blockquote>\n<hr>"}]}, {"title": "04 负载均衡", "questions": [{"q": "4.1 Nginx 负载均衡原理", "tag": "高频", "body": "<p>Nginx 通过 <code>upstream<\/code> 定义<strong>后端服务器池<\/strong>，<code>proxy_pass http://池名<\/code> 将请求按策略分发给池内服务器。<\/p>\n<pre><code class=\"lang-nginx\">upstream backend {\n    server 10.0.0.1:8080;\n    server 10.0.0.2:8080;\n    server 10.0.0.3:8080;\n}\nserver {\n    listen 80;\n    location / {\n        proxy_pass http://backend;\n    }\n}<\/code><\/pre>\n<ul><li>默认算法：<strong>加权轮询<\/strong>（round-robin，按权重依次分发）。<\/li><li>支持<strong>健康检查<\/strong>（被动：连续失败 N 次标记 down，自动剔除）。<\/li><li>每个 upstream 池还有<strong>会话保持<\/strong>（ip_hash）、<strong>最少连接<\/strong>（least_conn）等策略。<\/li><\/ul>\n<blockquote>加分点：upstream 是\"逻辑池\"，server 可以动态增删（配合 lua-upstream / DNS 动态解析），实现<strong>无损扩缩容<\/strong>——这是 Nginx 作为网关的核心能力之一。<\/blockquote>"}, {"q": "4.2 五大负载均衡算法对比", "tag": "高频", "body": "<table><thead><tr><th>算法<\/th><th>指令<\/th><th>原理<\/th><th>适用场景<\/th><\/tr><\/thead><tbody><tr><td>轮询<\/td><td>（默认）<\/td><td>按顺序逐个分发，权重高的多分<\/td><td>后端性能均衡时<\/td><\/tr><tr><td>加权轮询<\/td><td><code>weight=N<\/code><\/td><td>按权重比例分发（权重=处理能力）<\/td><td>后端配置不一时<\/td><\/tr><tr><td>IP 哈希<\/td><td><code>ip_hash<\/code><\/td><td>按客户端 IP 哈希固定到后端<\/td><td>需要<strong>会话保持<\/strong>（无共享 Session）<\/td><\/tr><tr><td>最少连接<\/td><td><code>least_conn<\/code><\/td><td>分配给当前活跃连接最少的后端<\/td><td>长连接/耗时差异大的接口<\/td><\/tr><tr><td>URL 哈希<\/td><td><code>hash $request_uri<\/code>（第三方/1.7+）<\/td><td>按 URL 哈希固定后端<\/td><td>缓存命中（同一 URL 固定一台）<\/td><\/tr><tr><td>随机<\/td><td><code>random<\/code><\/td><td>随机选择（可配 weight）<\/td><td>大流量下近似均匀<\/td><\/tr><\/tbody><\/table>\n<p>示例：<\/p>\n<pre><code class=\"lang-nginx\">upstream backend {\n    least_conn;\n    server 10.0.0.1:8080 weight=3 max_fails=3 fail_timeout=30s;\n    server 10.0.0.2:8080 weight=1;\n    server 10.0.0.3:8080 backup;   # 备用，仅当主全部不可用时启用\n}<\/code><\/pre>\n<blockquote>追问：ip_hash 的坑？① 上游 server 变更（增删）会导致大量用户会话\"漂移\"；② 若后端走的是 CDN/网关统一出口，客户端 IP 会集中在少数几个，哈希分布不均；③ 无法应对 NAT 场景。现代方案：<strong>Redis 集中式 Session 或 JWT 无状态化<\/strong>，负载均衡就不需要会话保持。<\/blockquote>"}, {"q": "4.3 upstream server 参数详解", "tag": "高频", "body": "<table><thead><tr><th>参数<\/th><th>说明<\/th><th>默认<\/th><\/tr><\/thead><tbody><tr><td><code>weight<\/code><\/td><td>权重，越大分到的请求越多<\/td><td>1<\/td><\/tr><tr><td><code>max_fails<\/code><\/td><td>允许连续失败次数，超过则标记不可用<\/td><td>1<\/td><\/tr><tr><td><code>fail_timeout<\/code><\/td><td>失败统计时间窗 + 标记不可用后的<strong>冷却时间<\/strong><\/td><td>10s<\/td><\/tr><tr><td><code>backup<\/code><\/td><td>标记为备用服务器，主全部不可用时才启用<\/td><td>-<\/td><\/tr><tr><td><code>down<\/code><\/td><td>手动下线（配合平滑摘除）<\/td><td>-<\/td><\/tr><tr><td><code>max_conns<\/code><\/td><td>到该上游的最大并发连接数（限流保护上游）<\/td><td>0（不限）<\/td><\/tr><tr><td><code>resolve<\/code><\/td><td>配合 resolver 动态解析域名<\/td><td>-<\/td><\/tr><\/tbody><\/table>\n<blockquote>加分点：<code>max_fails=0<\/code> 表示<strong>不检查健康<\/strong>（永不标记不可用）。注意 max_fails/fail_timeout 是<strong>被动健康检查<\/strong>，只对实际转发过的请求计数——没有流量就不会发现故障。<\/blockquote>"}, {"q": "4.4 健康检查：被动 vs 主动", "tag": "进阶", "body": "<ul><li><strong>被动检查<\/strong>（内置）：基于 <code>max_fails + fail_timeout<\/code>，对失败请求计数，超阈值把节点摘除，冷却后自动恢复。<strong>缺点<\/strong>：没流量就不检查，无法提前发现故障。<\/li><li><strong>主动检查<\/strong>（需 <code>nginx_upstream_check_module<\/code> 第三方模块或 Nginx Plus）：<\/li><\/ul>\n<pre><code class=\"lang-nginx\">  upstream backend {\n      server 10.0.0.1:8080;\n      check interval=3000 rise=2 fall=3 timeout=1000 type=http;\n      check_http_send \"GET /health HTTP/1.0\\r\\n\\r\\n\";\n      check_http_expect_alive http_2xx http_3xx;\n  }<\/code><\/pre>\n<p>定时主动探测 <code>/health<\/code> 接口，<strong>rise 次成功视为恢复，fall 次失败视为挂掉<\/strong>，无需流量即可发现故障。<\/p>\n<ul><li><strong>实践<\/strong>：后端自己暴露健康检查接口（如 Spring Boot Actuator <code>/actuator/health<\/code>），Nginx 主动探测；中间件加一层即可实现<strong>优雅上下线<\/strong>。<\/li><\/ul>"}, {"q": "4.5 负载均衡的会话保持方案", "tag": "进阶", "body": "<ol><li><strong>ip_hash<\/strong>：按来源 IP 固定，简单但有 NAT/CDN 出口集中问题。<\/li><li><strong>sticky cookie<\/strong>（第三方 <code>nginx-sticky-module<\/code>）：首次请求下发 cookie，后续按 cookie 值路由到同一后端，<strong>比 ip_hash 更精确<\/strong>。<\/li><li><strong>URL hash<\/strong>：按 URL 固定，适合缓存场景。<\/li><li><strong>推荐<\/strong>：后端用 <strong>Redis 共享 Session / JWT 无状态<\/strong>，Nginx 层无需会话保持，任意分发，故障节点摘除不影响用户。<\/li><\/ol>\n<blockquote>追问：为什么不建议依赖 ip_hash？当后端扩容/缩容时哈希结果变化，用户 Session 大面积失效（惊群重登）；且经过 L4 负载均衡后源 IP 可能相同，导致后端负载不均。<\/blockquote>"}, {"q": "4.6 灰度发布怎么用 Nginx 实现？", "tag": "高频", "body": "<p><strong>场景<\/strong>：新版本先放给少量用户验证，再逐步放量。<\/p>\n<p>方案一：<strong>按 IP/参数分流<\/strong>（if + upstream 池）<\/p>\n<pre><code class=\"lang-nginx\">upstream v1 { server 10.0.0.1:8080; }\nupstream v2 { server 10.0.0.2:8080; }\nserver {\n    location / {\n        set $upstream v1;\n        if ($remote_addr ~ \"^(192\\.168\\.1\\.100|10\\.0\\.0\\.8)$\") { set $upstream v2; }  # 内测 IP 走新版\n        if ($arg_ver = \"2\") { set $upstream v2; }   # 带参数走新版\n        proxy_pass http://$upstream;\n    }\n}<\/code><\/pre>\n<p>方案二：<strong>权重渐进放量<\/strong>（推荐，平滑可控）<\/p>\n<pre><code class=\"lang-nginx\">upstream backend {\n    server 10.0.0.1:8080 weight=9;   # 90% 旧版\n    server 10.0.0.2:8080 weight=1;   # 10% 新版 → 逐步调高权重\n}<\/code><\/pre>\n<p>方案三：<strong>A/B / 金丝雀<\/strong>：配合 OpenResty/Lua 按用户特征（uid hash、地域、UA）动态路由；或使用 APISIX/Kong 等网关的灰度插件。<\/p>\n<blockquote>加分点：灰度发布的关键不是\"转发\"，而是<strong>可观测 + 可回滚<\/strong>——灰度期间要监控新版本错误率/耗时，异常时立即把权重调回或摘除节点（<code>down<\/code> 参数或从 upstream 移除）。<\/blockquote>"}, {"q": "4.7 upstream 长连接（keepalive）", "tag": "进阶", "body": "<p>HTTP/1.0 时代每次请求都新建 TCP 连接，开销大。配置上游长连接：<\/p>\n<pre><code class=\"lang-nginx\">upstream backend {\n    server 10.0.0.1:8080;\n    keepalive 32;          # 每个 worker 保留 32 个空闲长连接复用\n}\nserver {\n    location / {\n        proxy_http_version 1.1;          # 上游必须 HTTP/1.1 才能 keepalive\n        proxy_set_header Connection \"\";  # 清空 Connection 头（不传 close）\n        proxy_pass http://backend;\n    }\n}<\/code><\/pre>\n<p>效果：避免频繁 TCP 三次握手 + TLS 握手，<strong>高并发下 QPS 提升明显（尤其 TLS 场景）<\/strong>。<br>注意：<\/p>\n<ul><li><code>keepalive N<\/code> 是<strong>空闲连接缓存数<\/strong>，不是并发数；请求多时自然创建更多连接。<\/li><li>若上游是 HTTP/1.0（老服务），keepalive 无效。<\/li><li>Nginx 作为服务端时用 <code>keepalive_timeout<\/code>（默认 75s）控制<strong>客户端长连接<\/strong>的空闲超时。<\/li><\/ul>\n<blockquote>加分点：为什么 TCP 连接建立成本高？三次握手 1 个 RTT + 慢启动；HTTPS 再加 1-2 个 RTT 的 TLS 握手。连接复用能省掉这几轮网络往返，对跨机房调用收益巨大。<\/blockquote>\n<hr>"}]}, {"title": "05 静态资源与缓存", "questions": [{"q": "5.1 静态资源服务与 root/alias 的区别", "tag": "高频", "body": "<pre><code class=\"lang-nginx\">server {\n    listen 80;\n    server_name example.com;\n    location /static/ {\n        root /data/www;      # root: 完整拼接  → /data/www/static/xxx\n    }\n    location /images/ {\n        alias /data/img/;    # alias: 替换匹配部分 → /data/img/xxx\n    }\n}<\/code><\/pre>\n<p><strong>root vs alias 核心区别<\/strong>：<\/p>\n<table><thead><tr><th>指令<\/th><th>拼接规则<\/th><th>示例（请求 /static/a.png）<\/th><\/tr><\/thead><tbody><tr><td><code>root /data/www;<\/code><\/td><td>root + 完整 URI<\/td><td>/data/www/static/a.png<\/td><\/tr><tr><td><code>alias /data/img/;<\/code><\/td><td>alias + 去除匹配前缀后的 URI<\/td><td>/data/img/a.png<\/td><\/tr><\/tbody><\/table>\n<blockquote>关键坑：① alias 后<strong>路径结尾的斜杠<\/strong>与 location 前缀要保持一致（<code>location /images/<\/code> 配 <code>alias /data/img/;<\/code>）；② alias 用于 location 中不能带变量（早期版本）；③ 默认索引 <code>index<\/code> 指令在 root 下才生效；④ alias 通常用于<strong>目录名与磁盘路径不一致<\/strong>的场景（对外 /static/ 映射到磁盘 /data/www/）。<\/blockquote>"}, {"q": "5.2 静态资源缓存策略（浏览器缓存 + 服务端）", "tag": "高频", "body": "<p><strong>浏览器缓存<\/strong>（协商/强缓存）：<\/p>\n<pre><code class=\"lang-nginx\">location ~* \\.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {\n    expires 30d;                          # 强缓存 30 天：Cache-Control: max-age=2592000\n    add_header Cache-Control \"public, immutable\";  # 不可变，配合 hash 文件名\n}<\/code><\/pre>\n<ul><li><code>expires 30d<\/code>：自动生成 <code>Expires<\/code> 与 <code>Cache-Control: max-age<\/code>。<\/li><li><code>expires -1<\/code>：禁用强缓存，每次走协商缓存。<\/li><li>文件名带 <strong>内容 hash<\/strong>（如 app.a1b2c3.js）时配 <code>immutable<\/code>，发布新版本文件名变化即可。<\/li><\/ul>\n<p><strong>服务端缓存<\/strong>（Nginx 代理缓存，见 5.4）与 <strong>CDN<\/strong>：静态资源最标准的架构是 <strong>CDN + 源站（Nginx 静态服务）<\/strong>，浏览器 → CDN 边缘 → 回源 Nginx。<\/p>\n<blockquote>追问：缓存更新怎么破？发布时<strong>文件名带 hash<\/strong>，新版本自动新 URL 不冲突；若接口动态数据，用 <code>Cache-Control: no-cache<\/code>（每次协商）或短 max-age + ETag。<\/blockquote>"}, {"q": "5.3 gzip 压缩配置详解", "tag": "高频", "body": "<pre><code class=\"lang-nginx\">gzip on;\ngzip_comp_level 5;                       # 1-9，5 是性价比折中（越高越耗 CPU）\ngzip_min_length 1k;                      # 小于 1k 不压缩（压缩收益低）\ngzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;\ngzip_vary on;                            # 返回 Vary: Accept-Encoding，配合 CDN\ngzip_buffers 16 8k;                      # 压缩缓冲\ngzip_disable \"msie6\";                    # 老浏览器不压缩<\/code><\/pre>\n<p>要点：<\/p>\n<ul><li>只压缩<strong>文本类<\/strong>资源（JS/CSS/JSON/HTML/SVG）；图片/视频本身已压缩，再压无效还费 CPU（WebP/AVIF 除外）。<\/li><li><code>gzip_static on<\/code>：若磁盘上已预生成 <code>.gz<\/code> 文件，直接发送<strong>零成本压缩<\/strong>（配合构建时压缩）。<\/li><li>现代替代：<strong>Brotli<\/strong>（<code>ngx_http_brotli_module<\/code>，压缩率比 gzip 高 15%~25%，需编译或第三方包）。<\/li><li>注意：<strong>已压缩内容不能二次压缩<\/strong>（如 HTTP 传输层 TLS 已压缩的场景），会产生额外开销甚至安全风险（BREACH 攻击）。<\/li><\/ul>\n<blockquote>追问：gzip 与 HTTPS 的坑？开启 TLS 后若再 gzip 敏感数据，存在 <strong>BREACH 攻击<\/strong>风险；常规做法是不对包含敏感信息（token、CSRF）的响应开启压缩。<\/blockquote>"}, {"q": "5.4 Nginx 代理缓存（proxy_cache）", "tag": "进阶", "body": "<p>把上游响应缓存到 Nginx 本地，后续相同请求直接返回，<strong>大幅降低上游压力<\/strong>：<\/p>\n<pre><code class=\"lang-nginx\">proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=mycache:10m max_size=10g inactive=60m use_temp_path=off;\n\nserver {\n    location / {\n        proxy_cache mycache;\n        proxy_cache_key $scheme$proxy_host$request_uri;   # 缓存 key\n        proxy_cache_valid 200 302 60m;   # 2xx/302 缓存 60 分钟\n        proxy_cache_valid 404 1m;        # 404 只缓存 1 分钟\n        proxy_cache_min_uses 1;          # 至少被请求 1 次才缓存\n        proxy_cache_use_stale error timeout http_502;  # 上游故障时用过期缓存兜底\n        add_header X-Cache-Status $upstream_cache_status;  # 查看命中情况 HIT/MISS/BYPASS\n        proxy_pass http://backend;\n    }\n}<\/code><\/pre>\n<p>关键概念：<\/p>\n<ul><li><code>keys_zone<\/code>：缓存 key 的共享内存区（10m 大约可存 8 万个 key）。<\/li><li><code>levels=1:2<\/code>：缓存文件目录层级，避免单目录文件过多。<\/li><li><strong>缓存穿透<\/strong>风险：恶意构造不同 URL 会生成海量缓存文件，需配合 <code>proxy_cache_key<\/code> 精简 + 限流。<\/li><li><code>proxy_cache_use_stale<\/code>：上游宕机时返回<strong>过期缓存<\/strong>（stale-while-error），是提高可用性的利器。<\/li><\/ul>\n<blockquote>加分点：静态资源场景，Nginx 做<strong>边缘缓存<\/strong>（CDN 思路）：<code>proxy_cache<\/code> + <code>Cache-Control<\/code> 头配合，命中率可达 90%+，后端 QPS 骤降。<\/blockquote>"}, {"q": "5.5 open_file_cache 文件缓存", "tag": "进阶", "body": "<p>缓存<strong>打开过的文件描述符、文件大小、修改时间<\/strong>，减少重复 open/stat 系统调用：<\/p>\n<pre><code class=\"lang-nginx\">open_file_cache max=10000 inactive=30s;   # 最多缓存 1 万条，30s 无访问淘汰\nopen_file_cache_valid 60s;                # 检查文件是否变化的周期\nopen_file_cache_min_uses 2;               # 访问 2 次以上才缓存（过滤一次性请求）\nopen_file_cache_errors on;                # 缓存\"文件不存在\"的结果，减少 ENOENT 探测<\/code><\/pre>\n<p>适用：大量静态文件（图片、JS/CSS）的服务器，能显著降低磁盘 I/O 与 CPU。<\/p>\n<blockquote>追问：为什么静态文件服务器要开 sendfile + tcp_nopush？<code>sendfile<\/code> 把文件从磁盘直接拷到 socket（<strong>零拷贝<\/strong>，不经用户态）；<code>tcp_nopush<\/code> 合并小包、攒满一个包再发，减少小包数量；大文件再加 <code>aio on<\/code> 用异步 I/O。<\/blockquote>"}, {"q": "5.6 大文件下载 / 断点续传", "tag": "进阶", "body": "<pre><code class=\"lang-nginx\">location /download/ {\n    root /data;\n    sendfile on;            # 零拷贝\n    tcp_nopush on;          # 攒包发送，大文件吞吐更高\n    tcp_nodelay on;\n    limit_rate 1m;          # 限速 1MB/s（防占满带宽）\n    limit_rate_after 10m;   # 前 10MB 不限速，之后限速\n    add_header Accept-Ranges bytes;   # 支持 Range 断点续传\n}<\/code><\/pre>\n<ul><li><strong>断点续传<\/strong>基于 HTTP Range：<code>Accept-Ranges: bytes<\/code> + 客户端 <code>Range: bytes=0-1023<\/code> 请求 → 206 Partial Content。<\/li><li>大文件建议用 <strong>CDN 分发<\/strong> + 分片；Nginx 直接吐大文件时要关注磁盘 I/O 与带宽。<\/li><\/ul>"}, {"q": "5.7 静态资源性能优化全清单", "tag": "进阶", "body": "<ol><li><strong>缓存<\/strong>：浏览器强缓存（hash 文件名 + immutable）+ Nginx 代理缓存 + CDN。<\/li><li><strong>压缩<\/strong>：gzip/brotli + gzip_static 预压缩。<\/li><li><strong>零拷贝<\/strong>：sendfile on + tcp_nopush on。<\/li><li><strong>文件缓存<\/strong>：open_file_cache。<\/li><li><strong>连接优化<\/strong>：keepalive_timeout、keepalive_requests（单连接最大请求数）。<\/li><li><strong>HTTP/2<\/strong>：多路复用，减少连接数。<\/li><li><strong>图片优化<\/strong>：WebP/AVIF 格式、响应式尺寸、懒加载。<\/li><li><strong>磁盘<\/strong>：缓存放 SSD；<code>access_log off<\/code>（静态资源不记日志或走 syslog）。<\/li><\/ol>\n<hr>"}]}, {"title": "06 location 与 rewrite", "questions": [{"q": "6.1 location 匹配规则与优先级", "tag": "高频", "body": "<pre><code class=\"lang-nginx\">location = /exact { }        # ① 精确匹配（=）\nlocation ^~ /prefix/ { }     # ② 前缀匹配，命中即停（^~）\nlocation ~ /regex/ { }       # ③ 正则匹配（~ 区分大小写）\nlocation ~* \\.(jpg|png)$ { } # ④ 正则忽略大小写（~*）\nlocation /prefix/ { }        # ⑤ 普通前缀匹配\nlocation / { }               # ⑥ 兜底前缀<\/code><\/pre>\n<p><strong>匹配流程（优先级从高到低）<\/strong>：<\/p>\n<ol><li><strong>精确匹配 <code>=<\/code><\/strong>：完全等于，命中直接使用，停止。<\/li><li><strong>前缀匹配 <code>^~<\/code><\/strong>：最长匹配的前缀，命中直接使用，<strong>不再查正则<\/strong>。<\/li><li>**正则匹配 <code>~<\/code>/<code>~*<\/code><strong>：按<\/strong>配置文件出现顺序**第一个匹配生效。<\/li><li><strong>普通前缀匹配<\/strong>：最长匹配（没有 <code>=<\/code>/<code>^~<\/code>/正则命中时使用）。<\/li><\/ol>\n<pre><code>请求 /static/img/a.png\n① = 无命中\n② ^~ /static/ 命中 → 直接使用（不再查正则）\n③~⑥ 跳过<\/code><\/pre>\n<pre><code>请求 /api/user\n① 无 = 命中\n② 无 ^~ 命中（假设只配了 /api 普通前缀）\n③ 正则 ~ /user 命中 → 用正则（正则优先于普通前缀！）<\/code><\/pre>\n<blockquote>经典陷阱：<strong>普通前缀的\"最长匹配\"优先级高于短的，但正则永远优先于普通前缀<\/strong>（除非 ^~）。面试必考。<\/blockquote>"}, {"q": "6.2 root vs alias 再次深挖", "tag": "高频", "body": "<p>回顾第 5 章，这里强调易错点：<\/p>\n<ul><li><code>root<\/code> 可以出现在 http/server/location 任意层级；<code>alias<\/code> <strong>只能出现在 location 中<\/strong>。<\/li><li><code>alias<\/code> 与 location 前缀配合时，<strong>目录映射关系<\/strong>：<\/li><\/ul>\n<pre><code class=\"lang-nginx\">  location /i/ { alias /data/w3/images/; }  # /i/top.gif → /data/w3/images/top.gif<\/code><\/pre>\n<ul><li>正则 location 里<strong>不能使用 alias<\/strong>（1.9.2 前），会报错。<\/li><li>需求\"URL 路径与磁盘路径完全一致\"时用 root（最省事）；不一致时用 alias。<\/li><\/ul>\n<blockquote>追问：<code>location / { root /app/dist; }<\/code> 与 <code>location / { alias /app/dist; }<\/code> 有区别吗？有！root 会把完整 URI 拼到 /app/dist 后（/app/dist/xxx），alias 则直接用 /app/dist 替换匹配部分（/app/dist 本身被当作静态目录）。SPA 部署用 root 更常见。<\/blockquote>"}, {"q": "6.3 rewrite 指令与四个 flag", "tag": "高频", "body": "<pre><code class=\"lang-nginx\">rewrite ^/old/(.*)$ /new/$1 permanent;   # 301 永久重定向\nrewrite ^/user/(\\d+)$ /profile?id=$1 break;<\/code><\/pre>\n<p><strong>四个 flag<\/strong>：<\/p>\n<table><thead><tr><th>flag<\/th><th>行为<\/th><th>后续处理<\/th><\/tr><\/thead><tbody><tr><td><code>last<\/code><\/td><td>停止 rewrite，<strong>重新进入 location 匹配<\/strong><\/td><td>用新 URI 重新找 location（类似重走流程）<\/td><\/tr><tr><td><code>break<\/code><\/td><td>停止 rewrite，<strong>不再重新匹配 location<\/strong><\/td><td>用当前已改写 URI 直接执行剩余指令<\/td><\/tr><tr><td><code>redirect<\/code><\/td><td>返回 <strong>302<\/strong> 临时重定向<\/td><td>客户端重新请求新地址<\/td><\/tr><tr><td><code>permanent<\/code><\/td><td>返回 <strong>301<\/strong> 永久重定向<\/td><td>浏览器/搜索引擎缓存新地址<\/td><\/tr><\/tbody><\/table>\n<p>典型用例：<\/p>\n<pre><code class=\"lang-nginx\">server {\n    listen 80;\n    server_name example.com;\n    return 301 https://$host$request_uri;\n}\nrewrite ^/news/(\\d+)$ /news-detail.html?id=$1 permanent;<\/code><\/pre>\n<blockquote>陷阱：<code>last<\/code> 与 <code>break<\/code> 区别是面试必问——<strong>last 会重新匹配 location（可能再次触发 rewrite 造成循环），break 不会<\/strong>。rewrite 在 location 内与 server 内的行为也不同（server 内默认隐式 last 语义）。<\/blockquote>"}, {"q": "6.4 if 指令的使用与陷阱", "tag": "进阶", "body": "<p>Nginx 的 <code>if<\/code> 是 <strong>rewrite 模块的指令<\/strong>，只能在 location 中使用（且官方文档警告：<strong>if 是邪恶的，不要在里面用非 rewrite 指令<\/strong>）。<\/p>\n<pre><code class=\"lang-nginx\">location / {\n    if ($request_method = POST) { return 405; }          # 可以用（return 是 rewrite 指令）\n    if ($http_user_agent ~* \"curl\") { return 403; }      # 可用\n    # if ($request_uri ~ ...) { proxy_pass ...; }        # 危险！if 里用 proxy_pass 行为不可控\n}<\/code><\/pre>\n<p>正确姿势：<\/p>\n<ul><li>if 内<strong>只用 return / rewrite / set<\/strong>。<\/li><li>需要按条件转发到不同上游时，用 <code>set<\/code> 设置变量 + <code>proxy_pass http://$var<\/code>（见 4.6 灰度方案）。<\/li><li>判断存在性：<code>if ($args) {}<\/code>、<code>if (-f $request_filename) {}<\/code>（文件是否存在）。<\/li><li>官方替代：try_files 已覆盖多数\"文件是否存在\"场景。<\/li><\/ul>\n<blockquote>加分点：为什么 if 里不能用 proxy_pass？因为 Nginx 的 if 是\"配置期指令\"，在 location 匹配后再执行，改变 proxy_pass 会导致<strong>选择上游的时机与 location 解析不一致<\/strong>，产生不可预期行为。复杂逻辑请用 Lua（OpenResty）或拆分 location。<\/blockquote>"}, {"q": "6.5 try_files 原理", "tag": "高频", "body": "<pre><code class=\"lang-nginx\">location / {\n    try_files $uri $uri/ /index.html;   # 依次尝试，全部失败则内部重定向到 /index.html\n}<\/code><\/pre>\n<p>执行逻辑：按顺序检查：<\/p>\n<ol><li><code>$uri<\/code>：磁盘上是否有该文件 → 有则返回。<\/li><li><code>$uri/<\/code>：是否有该目录（找 index）→ 有则返回目录索引。<\/li><li><code>/index.html<\/code>：<strong>内部重定向<\/strong>（类似 last，重新匹配 location）。<\/li><\/ol>\n<p>经典场景：<\/p>\n<ul><li><strong>SPA history 路由<\/strong>：刷新 <code>/user/123<\/code> 时磁盘无此文件 → 兜底到 <code>/index.html<\/code>，由前端路由接管。<\/li><li><strong>前端资源 + 后端 API 分离<\/strong>：<\/li><\/ul>\n<pre><code class=\"lang-nginx\">  location /api/ { proxy_pass http://backend; }\n  location / {\n      try_files $uri $uri/ /index.html;\n  }<\/code><\/pre>\n<ul><li><strong>多级 fallback<\/strong>：<code>try_files $uri $uri/ @fallback;<\/code>（@命名 location）。<\/li><\/ul>\n<blockquote>追问：try_files 的坑？① 最后的 fallback 若写成普通路径 <code>/index.html<\/code> 会内部重定向（可能循环）；② 对<strong>动态接口<\/strong>不要用 try_files 兜底到 index.html（会返回 HTML 而不是 404）；③ <code>$uri<\/code> 是解码后的路径，包含中文文件名要注意。<\/blockquote>"}, {"q": "6.6 Nginx 常用正则速查", "tag": "基础", "body": "<table><thead><tr><th>元字符<\/th><th>含义<\/th><th>示例<\/th><\/tr><\/thead><tbody><tr><td><code>^<\/code><\/td><td>开头<\/td><td><code>^/api<\/code> 以 /api 开头<\/td><\/tr><tr><td><code>$<\/code><\/td><td>结尾<\/td><td><code>\\.js$<\/code> 以 .js 结尾<\/td><\/tr><tr><td><code>.<\/code><\/td><td>任意字符<\/td><td><code>a.c<\/code> 匹配 abc/adc<\/td><\/tr><tr><td><code>*<\/code><\/td><td>前一个字符 0 次以上<\/td><td><code>ab*c<\/code> 匹配 ac/abbc<\/td><\/tr><tr><td><code>+<\/code><\/td><td>前一个字符 1 次以上<\/td><td><code>ab+c<\/code> 匹配 abc/abbc<\/td><\/tr><tr><td><code>?<\/code><\/td><td>前一个字符 0 或 1 次<\/td><td><code>colou?r<\/code> 匹配 color/colour<\/td><\/tr><tr><td><code>()<\/code><\/td><td>分组捕获<\/td><td><code>(\\d+)<\/code> 捕获数字<\/td><\/tr><tr><td>`\\<\/td><td>`<\/td><td>或<\/td><td>`(jpg\\<\/td><td>png\\<\/td><td>gif)$`<\/td><\/tr><tr><td><code>[abc]<\/code><\/td><td>字符集<\/td><td><code>[0-9]<\/code> 数字<\/td><\/tr><tr><td><code>\\d<\/code> <code>\\w<\/code> <code>\\s<\/code><\/td><td>数字/单词/空白<\/td><td><code>\\d+<\/code> 数字串<\/td><\/tr><tr><td><code>(?i)<\/code><\/td><td>忽略大小写（等价 ~*）<\/td><td>-<\/td><\/tr><\/tbody><\/table>\n<blockquote>注意：Nginx 正则基于 <strong>PCRE<\/strong>，与 grep/Java 正则基本一致；<code>~<\/code> 区分大小写、<code>~*<\/code> 不区分。<\/blockquote>"}, {"q": "6.7 实战：SPA history 路由刷新 404", "tag": "高频", "body": "<p><strong>问题<\/strong>：Vue/React 用 history 模式，用户直接访问 <code>/user/123<\/code> 或刷新时，Nginx 找不到该文件返回 404。<\/p>\n<p><strong>解决<\/strong>：try_files 兜底到 index.html + API 与静态资源分离：<\/p>\n<pre><code class=\"lang-nginx\">server {\n    listen 80;\n    server_name example.com;\n    root /usr/share/nginx/html;   # 前端构建产物目录\n\n    location /api/ {                     # 后端接口先行匹配\n        proxy_pass http://backend;\n        proxy_set_header Host $host;\n    }\n    location /assets/ {                  # 带 hash 的静态资源，长缓存\n        expires 30d;\n        add_header Cache-Control \"public, immutable\";\n    }\n    location / {\n        try_files $uri $uri/ /index.html;  # 前端路由兜底\n    }\n}<\/code><\/pre>\n<p>要点：<\/p>\n<ul><li><code>try_files $uri $uri/ /index.html<\/code> 中 <code>/index.html<\/code> 是<strong>内部重定向<\/strong>，不会 301，URL 保持 <code>/user/123<\/code>。<\/li><li>必须保证 <code>/index.html<\/code> 本身可访问；若 index.html 也找不到，会 500 而非 404（可加 <code>=404<\/code> 兜底）。<\/li><li>接口与页面分离部署时，<code>location /api/<\/code> 必须写在通用 <code>location /<\/code> 之前（前缀匹配按最长优先其实无顺序要求，但正则必须有序）。<\/li><\/ul>\n<hr>"}]}, {"title": "07 限流与访问控制", "questions": [{"q": "7.1 限流算法：漏桶 vs 令牌桶", "tag": "高频", "body": "<table><thead><tr><th>算法<\/th><th>原理<\/th><th>特点<\/th><th>典型实现<\/th><\/tr><\/thead><tbody><tr><td><strong>漏桶<\/strong><\/td><td>请求进入桶，按<strong>固定速率<\/strong>流出；桶满则拒绝<\/td><td>输出<strong>绝对平滑<\/strong>（严格速率），但无法应对突发<\/td><td>Nginx limit_req、Guava RateLimiter<\/td><\/tr><tr><td><strong>令牌桶<\/strong><\/td><td>桶内按速率<strong>生成令牌<\/strong>，请求需拿令牌；桶可积累令牌<\/td><td>允许<strong>一定突发<\/strong>（桶内积累的令牌），平滑且灵活<\/td><td>阿里 Sentinel、API 网关常见<\/td><\/tr><\/tbody><\/table>\n<ul><li><strong>漏桶<\/strong>：无论来多少请求，处理速率恒定 → 适合<strong>保护下游<\/strong>（如限上游调用）。<\/li><li><strong>令牌桶<\/strong>：空闲时可攒令牌，突发时一次消耗 → 适合<strong>允许业务突刺<\/strong>的入口。<\/li><\/ul>\n<blockquote>加分点：Nginx 的 <code>limit_req<\/code> 实现的是<strong>漏桶<\/strong>（rate 是流出速率，burst 是桶容量）；<code>limit_conn<\/code> 是连接数限流（类似\"最大并发\"）；令牌桶在 Nginx 里没有内置，但可用 Lua（OpenResty）实现。<\/blockquote>"}, {"q": "7.2 limit_req 限流配置与原理", "tag": "高频", "body": "<pre><code class=\"lang-nginx\">http {\n    # 定义限流区：按客户端 IP 计数，10m 共享内存，速率 1r/s\n    limit_req_zone $binary_remote_addr zone=req_zone:10m rate=1r/s;\n\n    server {\n        location /api/ {\n            limit_req zone=req_zone burst=5 nodelay;   # 桶容量 5，nodelay 不延迟\n            proxy_pass http://backend;\n        }\n    }\n}<\/code><\/pre>\n<p>参数拆解：<\/p>\n<ul><li><code>rate=1r/s<\/code>：每秒 1 个请求（也可 <code>10r/m<\/code> 每分钟 10 个）。<\/li><li><code>burst=5<\/code>：<strong>桶容量<\/strong>，超过速率的请求先排队（最多 5 个），超过桶容量的直接 <strong>503<\/strong>。<\/li><li><code>nodelay<\/code>：排队请求<strong>不延迟<\/strong>直接放行（瞬时打满 burst）；不带 nodelay 则按速率\"排队延迟\"放行（漏桶的平滑流出）。<\/li><li>不带 nodelay 时，超出 rate 的请求会<strong>排队等待<\/strong>（延迟返回），体验不好但平滑；生产常见 <code>burst + nodelay<\/code>。<\/li><\/ul>\n<p>响应码：默认超限返回 <strong>503 Service Unavailable<\/strong>；可自定义：<\/p>\n<pre><code class=\"lang-nginx\">limit_req_status 429;   # 返回 429 Too Many Requests<\/code><\/pre>\n<blockquote>追问：<code>limit_req_zone $binary_remote_addr<\/code> 为什么用 binary 而不是字符串 IP？<code>$binary_remote_addr<\/code> 是 4 字节二进制 IP，10m 内存能存约 <strong>16 万个 IP<\/strong>；<code>$remote_addr<\/code> 是字符串形式，同样内存只能存约 1.6 万个，且占用 CPU。<\/blockquote>"}, {"q": "7.3 limit_conn 并发连接限流", "tag": "高频", "body": "<pre><code class=\"lang-nginx\">http {\n    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;\n    server {\n        location /download/ {\n            limit_conn conn_zone 10;      # 每个 IP 最多 10 个并发连接\n            limit_conn_status 429;\n            limit_rate 1m;                # 配合限速\n        }\n    }\n}<\/code><\/pre>\n<p>与 limit_req 的区别：<\/p>\n<table><thead><tr><th>指令<\/th><th>限制对象<\/th><th>场景<\/th><\/tr><\/thead><tbody><tr><td><code>limit_req<\/code><\/td><td><strong>请求速率<\/strong>（个/秒）<\/td><td>防刷、防爬虫、API 限流<\/td><\/tr><tr><td><code>limit_conn<\/code><\/td><td><strong>并发连接数<\/strong><\/td><td>防下载占满连接、防 CC 攻击<\/td><\/tr><\/tbody><\/table>\n<blockquote>追问：CC 攻击怎么防？CC 攻击是\"高频请求耗尽资源\"，需要 <strong>limit_req（速率）+ limit_conn（并发）+ 请求特征识别（UA/Referer/行为分析）+ WAF<\/strong> 组合；单靠一个指令不够。<\/blockquote>"}, {"q": "7.4 访问控制：allow/deny", "tag": "基础", "body": "<pre><code class=\"lang-nginx\">location /admin/ {\n    allow 192.168.1.0/24;   # 内网放行\n    deny  all;              # 其余拒绝（403）\n}<\/code><\/pre>\n<ul><li>判断顺序：<strong>从上到下，第一个匹配的规则生效<\/strong>。<\/li><li>支持 IP 段：<code>allow 10.0.0.0/8;<\/code>、<code>allow 114.114.114.114;<\/code>。<\/li><li>按国家/地区封禁（需第三方模块 geoip2）：<code>geoip2<\/code> + <code>map<\/code> 结合。<\/li><\/ul>\n<blockquote>注意：allow/deny 是<strong>源 IP<\/strong> 维度，若前面有 CDN/代理，需配合 <code>real_ip<\/code> 模块（set_real_ip_from）还原真实 IP 后再判断。<\/blockquote>"}, {"q": "7.5 防盗链配置", "tag": "高频", "body": "<p><strong>原理<\/strong>：通过检查 <code>Referer<\/code> 头判断请求来源是否合法。<\/p>\n<pre><code class=\"lang-nginx\">location ~* \\.(gif|jpg|jpeg|png|webp|mp4|zip|rar)$ {\n    valid_referers none blocked server_names *.example.com www.example.com;\n    if ($invalid_referer) {\n        return 403;                       # 或重定向到防盗链图\n        # rewrite ^/.*$ /hotlink.png redirect;\n    }\n}<\/code><\/pre>\n<ul><li><code>none<\/code>：无 Referer（直接输 URL/部分 APP）→ 放行。<\/li><li><code>blocked<\/code>：Referer 被浏览器/代理去掉（不以 http 开头）→ 放行。<\/li><li><code>server_names<\/code>：本机域名放行。<\/li><li><code>*.example.com<\/code>：指定来源域名放行。<\/li><li><code>$invalid_referer<\/code>：valid_referers 未匹配时自动为 1。<\/li><\/ul>\n<blockquote>局限：Referer <strong>可以伪造<\/strong>，防盗链只是\"防君子不防小人\"；严格场景需<strong>签名 URL<\/strong>（带过期时间戳的 token）或鉴权。<\/blockquote>"}, {"q": "7.6 接口防刷实战", "tag": "进阶", "body": "<p>组合方案：<\/p>\n<pre><code class=\"lang-nginx\">http {\n    limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;\n    limit_conn_zone $binary_remote_addr zone=conn:10m;\n\n    server {\n        location /api/send-sms/ {         # 高价值接口重点防护\n            limit_req zone=api burst=2 nodelay;\n            limit_conn conn 3;\n            proxy_pass http://backend;\n        }\n        location /api/ {\n            limit_req zone=api burst=10 nodelay;   # 通用接口宽松些\n            proxy_pass http://backend;\n        }\n    }\n}<\/code><\/pre>\n<p>更高阶（配合 Lua / 网关）：<\/p>\n<ol><li><strong>滑动窗口<\/strong>：Redis 记录固定时间窗请求数（比漏桶更精确的\"X 秒 N 次\"）。<\/li><li><strong>验证码<\/strong>：同 IP 失败 N 次后强制滑块/图形验证码。<\/li><li><strong>用户维度限流<\/strong>：登录态 uid 维度（不只是 IP，防多 IP 绕过）。<\/li><li><strong>风控联动<\/strong>：设备指纹、行为分析（OpenResty + 规则引擎）。<\/li><\/ol>\n<blockquote>追问：IP 限流被多 IP 攻击绕过怎么办？结合 <strong>uid + 设备指纹<\/strong> 维度限流，配合验证码升级、云 WAF（大禹、阿里云盾）做整体防护。<\/blockquote>\n<hr>"}]}, {"title": "08 HTTPS 与安全", "questions": [{"q": "8.1 HTTPS 完整配置", "tag": "高频", "body": "<pre><code class=\"lang-nginx\">server {\n    listen 443 ssl http2;                  # http2 需 Nginx ≥1.25.1（或 listen 443 ssl; 加 http2 on;）\n    server_name example.com;\n\n    ssl_certificate     /etc/nginx/cert/example.com.pem;   # 证书（含证书链）\n    ssl_certificate_key /etc/nginx/cert/example.com.key;   # 私钥\n\n    ssl_protocols TLSv1.2 TLSv1.3;         # 禁用 SSLv3/TLSv1.0/1.1（有漏洞）\n    ssl_ciphers HIGH:!aNULL:!MD5;          # 或现代套件推荐\n    ssl_prefer_server_ciphers on;\n\n    ssl_session_cache shared:SSL:10m;      # TLS 会话缓存（省握手）\n    ssl_session_timeout 10m;\n    ssl_session_tickets on;                # 会话票据（集群可共享）\n\n    ssl_stapling on;                       # OCSP Stapling\n    ssl_stapling_verify on;\n    resolver 8.8.8.8 114.114.114.114 valid=300s;\n\n    # HTTP 自动跳 HTTPS\n    # 另写一个 server { listen 80; return 301 https://$host$request_uri; }\n}<\/code><\/pre>\n<p>要点：<\/p>\n<ul><li>证书 = <strong>证书链<\/strong>（服务器证书 + 中间 CA 证书），必须按顺序拼接，否则移动端/部分客户端报错。<\/li><li>私钥权限要收紧（<code>chmod 600<\/code>），<strong>私钥泄露=HTTPS 失效<\/strong>。<\/li><li>证书到期监控（Let's Encrypt 自动续期、腾讯云/阿里云托管）。<\/li><\/ul>\n<blockquote>追问：证书链为什么要包含中间证书？因为客户端只内置根证书，服务器证书由中间 CA 签发，客户端必须收到中间证书才能验出完整的信任链；缺少中间证书会导致 <strong>SSL_ERROR_BAD_CERT_DOMAIN / unable to verify<\/strong>。<\/blockquote>"}, {"q": "8.2 HTTP 与 HTTPS 的区别", "tag": "基础", "body": "<table><thead><tr><th>维度<\/th><th>HTTP<\/th><th>HTTPS<\/th><\/tr><\/thead><tbody><tr><td>端口<\/td><td>80<\/td><td>443<\/td><\/tr><tr><td>传输层<\/td><td>TCP<\/td><td><strong>TLS/SSL 加密<\/strong><\/td><\/tr><tr><td>安全性<\/td><td>明文，可窃听/篡改/冒充<\/td><td>加密 + 完整性 + 身份认证<\/td><\/tr><tr><td>性能<\/td><td>快（无握手）<\/td><td>有 TLS 握手开销（可优化）<\/td><\/tr><tr><td>SEO<\/td><td>一般<\/td><td>搜索引擎更友好（权重加成）<\/td><\/tr><tr><td>适用<\/td><td>内网、非敏感<\/td><td>一切对外公网服务（已是默认要求）<\/td><\/tr><\/tbody><\/table>\n<p>TLS 握手（简版）：<\/p>\n<ol><li>ClientHello（支持的版本/套件/随机数）→ ServerHello（选定套件/随机数）+ 证书。<\/li><li>客户端<strong>验证证书链<\/strong>，生成预主密钥，用服务器公钥加密发送。<\/li><li>双方各自计算会话密钥，发送 Finished，开始对称加密通信。<\/li><\/ol>\n<ul><li><strong>RSA 握手<\/strong>：2 个 RTT；<strong>TLS 1.3<\/strong>：1-RTT（0-RTT 可恢复，但有重放风险）。<\/li><\/ul>"}, {"q": "8.3 HTTPS 性能优化", "tag": "进阶", "body": "<ol><li><strong>会话复用<\/strong>：<code>ssl_session_cache shared:SSL:10m<\/code>（内存缓存会话）+ <code>ssl_session_tickets<\/code>（票据方式，<strong>无状态可跨实例<\/strong>，适合集群）。10m ≈ 4 万个会话。<\/li><li><strong>TLS 1.3<\/strong>：握手 1-RTT，比 1.2 少一个 RTT。<\/li><li><strong>OCSP Stapling<\/strong>：Nginx <strong>代查证书吊销状态并缓存<\/strong>，客户端无需自己访问 OCSP 服务器（省一次网络请求 + 更可靠）。<\/li><li><strong>HTTP/2<\/strong>：多路复用，并发请求共享连接。<\/li><li><strong>硬件加速<\/strong>：<code>ssl_engine<\/code> 使用 AES-NI 指令集、支持硬件 SSL 加速卡。<\/li><li><strong>减少证书链大小<\/strong>：ECC 证书比 RSA 证书小、握手更快。<\/li><\/ol>\n<blockquote>加分点：全站 HTTPS + HTTP/2 是现代 Web 标配；性能上 TLS 握手成本可通过<strong>会话复用<\/strong>大幅摊薄，TLS 1.3 后 HTTPS 与 HTTP 性能差距已很小。<\/blockquote>"}, {"q": "8.4 HTTP/2 与 HTTP/3 特性", "tag": "进阶", "body": "<p><strong>HTTP/2<\/strong>（Nginx 1.9.5+，需要 <code>--with-http_v2_module<\/code>）：<\/p>\n<ul><li><strong>多路复用<\/strong>：一个 TCP 连接并发多个请求，解决队头阻塞（应用层）。<\/li><li><strong>头部压缩<\/strong>：HPACK 压缩头（首部表 + 哈夫曼编码）。<\/li><li><strong>二进制分帧<\/strong>：数据以二进制帧传输，解析更高效。<\/li><li><strong>服务器推送<\/strong>（Server Push，已废弃/不推荐）。<\/li><li><strong>必须配 HTTPS<\/strong>（主流浏览器强制 h2 仅限 TLS）。<\/li><\/ul>\n<p><strong>HTTP/3<\/strong>（QUIC，基于 UDP，Nginx 1.25+ 实验支持）：<\/p>\n<ul><li>基于 <strong>UDP 的 QUIC<\/strong> 协议，连接建立 0-1 RTT。<\/li><li>解决<strong>传输层队头阻塞<\/strong>（TCP 丢包导致整条流阻塞）。<\/li><li>更适合弱网、移动端。<\/li><\/ul>\n<pre><code class=\"lang-nginx\">server {\n    listen 443 ssl http2;         # HTTP/2\n    listen 443 quic reuseport;    # HTTP/3（QUIC，Nginx 1.25+）\n    add_header Alt-Svc 'h3=\":443\"; ma=86400';  # 告知浏览器支持 h3\n}<\/code><\/pre>"}, {"q": "8.5 HSTS 与安全响应头", "tag": "基础", "body": "<pre><code class=\"lang-nginx\">add_header Strict-Transport-Security \"max-age=31536000; includeSubDomains; preload\" always;\nadd_header X-Content-Type-Options \"nosniff\" always;         # 防 MIME 嗅探\nadd_header X-Frame-Options \"SAMEORIGIN\" always;             # 防点击劫持（frame 嵌入）\nadd_header X-XSS-Protection \"1; mode=block\" always;\nadd_header Referrer-Policy \"strict-origin-when-cross-origin\" always;\nadd_header Content-Security-Policy \"default-src 'self'\" always;   # CSP（按需收紧）<\/code><\/pre>\n<ul><li><strong>HSTS<\/strong>：告诉浏览器<strong>强制 HTTPS 访问<\/strong>（连首次 http 请求都不发，直接内部跳 https），杜绝\"降级攻击\"；<code>preload<\/code> 表示申请加入浏览器 HSTS 预加载列表。<\/li><li>注意：<code>add_header<\/code> 在<strong>有响应的 location<\/strong> 中会覆盖 server 级的同名头（Nginx 的继承陷阱），建议用 <code>always<\/code> 并在每层确认。<\/li><\/ul>"}, {"q": "8.6 安全加固清单", "tag": "高频", "body": "<ol><li><strong>隐藏版本号<\/strong>：<code>server_tokens off;<\/code>（防针对特定版本漏洞扫描）。<\/li><li><strong>最小权限<\/strong>：worker 用低权限用户运行（<code>user nginx;<\/code>），root 启动仅用于绑定 80/443。<\/li><li><strong>禁用危险方法<\/strong>：<code>if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|OPTIONS)$) { return 405; }<\/code>。<\/li><li><strong>限制请求体<\/strong>：<code>client_max_body_size 10m;<\/code>（防恶意大包）。<\/li><li><strong>超时收紧<\/strong>：<code>client_body_timeout<\/code>、<code>client_header_timeout<\/code> 调小（防慢速攻击 slowloris）。<\/li><li><strong>TLS 配置加固<\/strong>：禁用 TLSv1.0/1.1、弱密码套件。<\/li><li><strong>目录安全<\/strong>：拒绝访问隐藏文件/敏感路径：<\/li><\/ol>\n<pre><code class=\"lang-nginx\">   location ~ /\\. { deny all; }            # 防 .git/.env 泄露\n   location ~ \\.(sql|log|bak|sh|py)$ { deny all; }<\/code><\/pre>\n<ol><li><strong>限流防刷<\/strong>：limit_req / limit_conn（见第 7 章）。<\/li><li><strong>WAF<\/strong>：ModSecurity（开源）或云 WAF。<\/li><li><strong>日志<\/strong>：access_log 全量记录 + 定期分析异常。<\/li><\/ol>\n<hr>"}]}, {"title": "09 高可用架构", "questions": [{"q": "9.1 Nginx 高可用方案：Keepalived + VIP", "tag": "高频", "body": "<p><strong>问题<\/strong>：Nginx 单点故障 → 服务全挂。<strong>方案<\/strong>：多台 Nginx + <strong>Keepalived（VRRP 协议）<\/strong> 提供虚拟 IP（VIP）。<\/p>\n<p>架构：<\/p>\n<pre><code>        客户端\n          │  访问 VIP（如 192.168.1.100）\n   ┌──────┴──────┐\n Nginx-Master    Nginx-Backup   ← Keepalived 心跳互检（VRRP 组播）\n (VIP 绑定)      (随时接管)\n   │  │  │\n 后端1 后端2 后端3<\/code><\/pre>\n<p>原理：<\/p>\n<ul><li><strong>VRRP<\/strong>：Master 周期发送 VRRP 通告（组播），Backup 收不到（超时，默认 3 个通告周期约 3s）则判定 Master 挂掉 → <strong>抢占 VIP<\/strong> 继续服务。<\/li><li>VIP 只在 Master 的网卡上；切换时 VIP 漂移到 Backup，<strong>客户端无感知<\/strong>（IP 没变）。<\/li><li>健康检查脚本：Keepalived 定期检查 Nginx 进程/端口，Nginx 挂掉则<strong>主动降级<\/strong>（或重启）。<\/li><\/ul>\n<p>关键配置（keepalived.conf）：<\/p>\n<pre><code>vrrp_instance VI_1 {\n    state MASTER            # Backup 上写 BACKUP\n    interface eth0\n    virtual_router_id 51    # 同一组必须一致\n    priority 100            # Master 高（如 100），Backup 低（如 90）\n    advert_int 1            # 通告间隔 1s\n    virtual_ipaddress {\n        192.168.1.100/24    # VIP\n    }\n    track_script { chk_nginx }   # 健康检查脚本\n}<\/code><\/pre>\n<blockquote>加分点：Keepalived 解决的是<strong>入口高可用<\/strong>（VIP 漂移），不是负载均衡——两台 Nginx 是<strong>主备（热备）<\/strong>关系，同一时刻只有一台工作；若要<strong>双活<\/strong>，用 DNS 轮询、LVS+多组、或上云 SLB。<\/blockquote>"}, {"q": "9.2 主备切换的细节与脑裂", "tag": "进阶", "body": "<ul><li><strong>抢占模式 vs 非抢占<\/strong>：<code>nopreempt<\/code> 配置可让 Backup 不自动抢回 VIP（避免频繁切换抖动）。<\/li><li><strong>脑裂（split-brain）<\/strong>：两台都认为自己是 Master，都绑定 VIP → 请求可能打到两台，后端数据不一致。<\/li><li>原因：VRRP 心跳被隔离（网络抖动/防火墙）。<\/li><li>防御：<strong>仲裁机制<\/strong>（如检查网关连通性、共享存储锁）、心跳走<strong>独立网卡/独立网络<\/strong>、配置 <code>unicast_peer<\/code> 单播。<\/li><li><strong>服务探测<\/strong>：<code>track_script<\/code> 里检查 Nginx 进程 + <code>curl 127.0.0.1/health<\/code>，双保险。<\/li><\/ul>"}, {"q": "9.3 四层 vs 七层：LVS + Nginx 分层架构", "tag": "进阶", "body": "<p><strong>为什么分层<\/strong>：Nginx（七层）做负载均衡时每个请求都要解析 HTTP，海量连接下成为瓶颈；LVS（四层）在内核态转发，吞吐极高。<\/p>\n<p>典型大型架构（三层）：<\/p>\n<pre><code>客户端 → DNS/GSLB → LVS(四层, 内核态转发) → Nginx(七层, 反向代理/网关) → 应用服务\n                     VIP 负载均衡            负载均衡+路由+限流+缓存     业务逻辑<\/code><\/pre>\n<ul><li><strong>LVS 三种模式<\/strong>：NAT（改 IP，回程也走 LVS）、DR（改 MAC，回程直连客户端，性能最好）、TUN（IP 隧道）。<\/li><li><strong>Nginx 四层代理<\/strong>（stream 模块）也可做 L4：<code>stream { upstream tcp_backend { server ...; } server { listen 3306; proxy_pass tcp_backend; } }<\/code>（适合 MySQL/Redis 等 TCP 服务的负载均衡）。<\/li><li>选型：<strong>四层<\/strong>性能高但无法做 HTTP 层路由/限流；<strong>七层<\/strong>功能丰富但性能上限低。二者组合是互联网标配。<\/li><\/ul>\n<blockquote>追问：四层和七层的判断依据？四层只认 IP:端口（TCP/UDP），不看内容；七层解析 HTTP 头/URL/Cookie，能做路由、重写、限流、灰度。<\/blockquote>"}, {"q": "9.4 多级缓存架构与 CDN", "tag": "进阶", "body": "<pre><code>浏览器缓存 → CDN 边缘节点 → Nginx 边缘缓存 → 应用服务器 → 数据库\n   (强缓存)   (静态就近)     (proxy_cache)    (业务)      (数据)<\/code><\/pre>\n<ul><li><strong>CDN<\/strong>：把静态资源分发到离用户最近的节点，回源到 Nginx。<\/li><li><strong>Nginx 边缘缓存<\/strong>：<code>proxy_cache<\/code> 缓存动态接口/未命中 CDN 的资源，减轻应用压力。<\/li><li>配合 <code>Cache-Control<\/code> 头做<strong>多级缓存一致性<\/strong>：CDN 依据源站响应头决定缓存时长。<\/li><\/ul>"}, {"q": "9.5 平滑升级与回滚", "tag": "高频", "body": "<p>回顾 2.7 的信号机制，补充<strong>回滚<\/strong>：<\/p>\n<ul><li>升级前备份旧二进制：<code>cp nginx nginx.old<\/code>。<\/li><li>升级失败回滚：发送 <strong>USR2<\/strong> 重新启动旧版 master（新老并存）→ <strong>WINCH<\/strong> 关闭新 worker → <strong>QUIT<\/strong> 退出新 master。<\/li><li>配置回滚：<code>nginx -t<\/code> 校验通过才 <code>kill -HUP<\/code>；出错则直接改回旧配置再 HUP。<\/li><\/ul>\n<blockquote>加分点：<code>nginx -t<\/code>（测试配置）是发布前<strong>必须<\/strong>的步骤，语法错误会导致 reload 失败（但不会中断运行中的服务）；<code>nginx -s reload<\/code> 等价于发 HUP。<\/blockquote>\n<hr>"}]}, {"title": "10 日志与监控", "questions": [{"q": "10.1 access_log 格式与字段", "tag": "高频", "body": "<pre><code class=\"lang-nginx\">http {\n    log_format main '$remote_addr - $remote_user [$time_local] \"$request\" '\n                    '$status $body_bytes_sent \"$http_referer\" '\n                    '\"$http_user_agent\" \"$http_x_forwarded_for\" '\n                    'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time';\n    access_log /var/log/nginx/access.log main;   # 格式 + 路径\n    # access_log off;   # 静态资源可关闭日志\n}<\/code><\/pre>\n<p>常用变量：<\/p>\n<ul><li><code>$remote_addr<\/code> 客户端 IP、<code>$request<\/code> 请求行、<code>$status<\/code> 状态码、<code>$body_bytes_sent<\/code> 响应字节数。<\/li><li><code>$request_time<\/code> <strong>整个请求耗时<\/strong>（含上游）、<code>$upstream_response_time<\/code> 上游响应耗时 → 定位是 Nginx 慢还是后端慢。<\/li><li><code>$http_referer<\/code>、<code>$http_user_agent<\/code>、<code>$http_x_forwarded_for<\/code>。<\/li><li><code>$upstream_addr<\/code> 实际命中的上游地址（多上游排查用）。<\/li><\/ul>\n<blockquote>加分点：<code>rt<\/code> 与 <code>urt<\/code> 对比是排查手段——<code>rt ≈ urt<\/code> 说明慢在后端；<code>rt >> urt<\/code> 说明慢在 Nginx 到客户端的传输（如带宽/大响应）。<\/blockquote>"}, {"q": "10.2 error_log 级别", "tag": "基础", "body": "<pre><code class=\"lang-nginx\">error_log /var/log/nginx/error.log warn;   # 全局\nerror_log /var/log/nginx/error_http.log info;  # 可按 http/server 覆盖<\/code><\/pre>\n<p>级别（从低到高）：<code>debug<\/code> → <code>info<\/code> → <code>notice<\/code> → <code>warn<\/code> → <code>error<\/code> → <code>crit<\/code> → <code>alert<\/code> → <code>emerg<\/code>。<\/p>\n<ul><li>生产默认 <strong>warn<\/strong>；排查疑难问题开 <strong>debug<\/strong>（注意 debug 日志量巨大，且需编译时开启 <code>--with-debug<\/code>）。<\/li><li>常见错误定位：<code>connect() failed (111: Connection refused)<\/code> → 上游没起来；<code>worker_connections are not enough<\/code> → 连接数不够。<\/li><\/ul>"}, {"q": "10.3 日志切割方案", "tag": "高频", "body": "<p>Nginx 默认日志无限增长。标准方案：<\/p>\n<p>方案一：<strong>logrotate<\/strong>（Linux 标配）<\/p>\n<pre><code>/var/log/nginx/*.log {\n    daily\n    rotate 30\n    compress\n    dateext\n    missingok\n    notifempty\n    sharedscripts\n    postrotate\n        /usr/sbin/nginx -s reopen    # USR1 信号：重新打开日志文件\n    endscript\n}<\/code><\/pre>\n<p>方案二：手动（USR1 信号）<\/p>\n<pre><code class=\"lang-bash\">mv /var/log/nginx/access.log /var/log/nginx/access.log.20260824\nkill -USR1 $(cat /var/run/nginx.pid)   # 让 Nginx 重新打开新文件<\/code><\/pre>\n<ul><li>原理：USR1 信号让 Nginx <strong>重新打开日志文件<\/strong>，旧文件可任意压缩归档。<\/li><li>注意：<strong>直接删日志文件不重启<\/strong>会导致 Nginx 继续写已删除的 inode（磁盘空间不释放），必须用 USR1 reopen。<\/li><\/ul>"}, {"q": "10.4 监控指标：stub_status / vts", "tag": "进阶", "body": "<pre><code class=\"lang-nginx\">server {\n    location /nginx_status {\n        stub_status on;          # 内置指标（Nginx 开源版）\n        access_log off;\n        allow 127.0.0.1;         # 只允许内网访问\n        deny all;\n    }\n}<\/code><\/pre>\n<p>输出指标：<\/p>\n<pre><code>Active connections: 100          # 当前活跃连接数\nserver accepts handled requests\n 1234 1234 5678                  # 累计接受连接 / 处理连接 / 请求数\nReading: 1 Writing: 3 Waiting: 99   # 读请求头 / 写响应 / 空闲 keepalive 连接<\/code><\/pre>\n<p>进阶方案：<\/p>\n<ul><li><strong>ngx_http_stub_status_module<\/strong>：上述基础指标。<\/li><li><strong>nginx-module-vts<\/strong>（第三方）：提供 JSON 格式的详细指标（各 server/upstream 请求数、响应码、耗时分布）。<\/li><li><strong>Prometheus + nginx-prometheus-exporter<\/strong>：导出指标到监控体系。<\/li><li><strong>ELK/Loki<\/strong>：日志采集分析（Filebeat → ES / Promtail → Loki）。<\/li><\/ul>\n<blockquote>加分点：<code>Waiting<\/code> 数量大说明<strong>长连接复用好<\/strong>（keepalive 生效）；<code>Reading<\/code> 长期大说明有慢请求/慢速攻击，需检查 <code>client_header_timeout<\/code>。<\/blockquote>"}, {"q": "10.5 通过日志做业务分析", "tag": "进阶", "body": "<ul><li><strong>QPS/状态码统计<\/strong>（awk）：<\/li><\/ul>\n<pre><code class=\"lang-bash\">  awk '{print $9}' access.log | sort | uniq -c | sort -rn     # 状态码分布<\/code><\/pre>\n<ul><li><strong>Top IP<\/strong>：<code>awk '{print $1}' access.log | sort | uniq -c | sort -rn | head -10<\/code><\/li><li><strong>慢请求<\/strong>：<code>awk '$NF > 3 {print}' access.log<\/code>（rt 字段 > 3s）。<\/li><li><strong>4xx/5xx 趋势<\/strong>：配合 Grafana 按时间聚合。<\/li><li>规范做法：接入 <strong>Loki/ES + Grafana<\/strong> 做实时监控大盘；日志结构化（JSON 格式）便于检索。<\/li><\/ul>"}, {"q": "10.6 常见故障排查：502 / 504 / 499", "tag": "高频", "body": "<table><thead><tr><th>错误<\/th><th>含义<\/th><th>排查方向<\/th><\/tr><\/thead><tbody><tr><td><strong>502 Bad Gateway<\/strong><\/td><td>Nginx 无法连接上游<\/td><td>上游进程挂了？端口错？防火墙？<code>proxy_connect_timeout<\/code> 内未建立连接<\/td><\/tr><tr><td><strong>504 Gateway Timeout<\/strong><\/td><td>上游响应超时<\/td><td>上游处理慢？<code>proxy_read_timeout<\/code> 太小？数据库慢？<\/td><\/tr><tr><td><strong>499 Client Closed<\/strong><\/td><td>客户端提前断开<\/td><td>客户端超时设置比 Nginx 小（如浏览器/网关 60s）；大响应被客户端丢弃<\/td><\/tr><tr><td><strong>499 大量<\/strong><\/td><td>客户端/中间层超时<\/td><td>检查 CDN/客户端超时配置、响应大小、是否日志记录慢<\/td><\/tr><\/tbody><\/table>\n<p>排查命令：<\/p>\n<pre><code class=\"lang-bash\">nginx -t                          # 配置检查\ntail -f /var/log/nginx/error.log  # 错误日志\ncurl -v http://127.0.0.1:8080/health   # 直连上游验证\nss -tnlp | grep :8080             # 端口监听<\/code><\/pre>\n<hr>"}]}, {"title": "11 性能优化实战", "questions": [{"q": "11.1 Nginx 常规性能优化清单", "tag": "高频", "body": "<p><strong>配置层面<\/strong>：<\/p>\n<pre><code class=\"lang-nginx\">worker_processes auto;\nworker_cpu_affinity auto;\nworker_rlimit_nofile 65535;\nevents {\n    use epoll;\n    worker_connections 65535;\n    accept_mutex off;        # reuseport 时关\n}\nhttp {\n    sendfile on;\n    tcp_nopush on;\n    tcp_nodelay on;\n    keepalive_timeout 65;\n    keepalive_requests 1000;\n    gzip on; gzip_comp_level 5; gzip_min_length 1k; gzip_types ...;\n    open_file_cache max=10000 inactive=30s;\n    client_header_buffer_size 1k;\n    large_client_header_buffers 4 8k;\n}<\/code><\/pre>\n<p><strong>系统层面<\/strong>：<\/p>\n<pre><code class=\"lang-bash\">net.core.somaxconn = 65535        # accept 队列\nnet.ipv4.ip_local_port_range = 1024 65535   # 本地端口范围（出站连接）\nnet.ipv4.tcp_tw_reuse = 1         # TIME_WAIT 复用\nnet.ipv4.tcp_fin_timeout = 15\nnet.ipv4.tcp_max_syn_backlog = 65535\nfs.file-max = 655350\nulimit -n 65535                   # 进程 fd 上限<\/code><\/pre>\n<p><strong>业务层面<\/strong>：<\/p>\n<ul><li>静态资源走 CDN / 独立静态域名。<\/li><li>开 HTTP/2、上 TLS 1.3。<\/li><li>配置 <code>access_log off<\/code> 于高流量静态资源。<\/li><\/ul>"}, {"q": "11.2 缓冲与超时参数精调", "tag": "进阶", "body": "<pre><code class=\"lang-nginx\">http {\n    client_body_buffer_size 8k;        # 请求体缓冲（小于此值内存，大于落盘）\n    client_max_body_size 10m;          # 最大请求体（上传限制）\n    client_header_buffer_size 1k;      # 请求头缓冲\n    large_client_header_buffers 4 8k;  # 大请求头（Cookie/长 URL）缓冲\n\n    proxy_buffer_size 4k;              # 上游响应头缓冲\n    proxy_buffers 8 4k;                # 上游响应体缓冲\n    proxy_busy_buffers_size 8k;\n    proxy_temp_path /data/nginx_tmp;   # 大响应落盘路径（放 SSD）\n}<\/code><\/pre>\n<ul><li>请求头太大报 <strong>414<\/strong>：调大 <code>large_client_header_buffers<\/code>。<\/li><li>请求体太大报 <strong>413<\/strong>：调大 <code>client_max_body_size<\/code>。<\/li><li>缓冲过多会<strong>吃内存<\/strong>：每个并发连接 × 缓冲大小，估算内存上限。<\/li><\/ul>"}, {"q": "11.3 压测与指标解读", "tag": "进阶", "body": "<p>常用工具：<\/p>\n<ul><li><strong>ab<\/strong>（ApacheBench）：<code>ab -n 100000 -c 1000 http://host/<\/code> → RPS、平均延迟、失败率。<\/li><li><strong>wrk<\/strong>：支持脚本、更精确：<code>wrk -t8 -c1000 -d30s --latency http://host/<\/code>。<\/li><li><strong>siege / hey / Vegeta<\/strong>。<\/li><\/ul>\n<p>核心指标：<\/p>\n<ul><li><strong>QPS/TPS<\/strong>、<strong>RT（P50/P95/P99）<\/strong>、<strong>错误率<\/strong>、<strong>连接成功率<\/strong>。<\/li><li>关注 P99 而非平均值（均值掩盖长尾）。<\/li><\/ul>\n<p>压测注意：<strong>先压 Nginx 直连静态<\/strong>，再压动态链路，区分 Nginx 与后端瓶颈；压测机与目标机<strong>分开<\/strong>，避免本机资源干扰。<\/p>"}, {"q": "11.4 优化案例：单机性能怎么提上去", "tag": "进阶", "body": "<p><strong>案例<\/strong>：8 核 16G 单机，静态资源 + 少量反向代理，目标 10w QPS。<\/p>\n<ol><li><code>worker_processes 8<\/code> + <code>worker_cpu_affinity auto<\/code>（每核一个 worker）。<\/li><li><code>worker_connections 65535<\/code> + <code>worker_rlimit_nofile 65535<\/code> + 系统 fd 调大。<\/li><li><code>sendfile on; tcp_nopush on;<\/code>（静态文件零拷贝）。<\/li><li>静态资源 <code>expires 30d<\/code> + 开 CDN 把压力下沉。<\/li><li>动态接口 <code>proxy_cache<\/code> 缓存热点 + 上游 keepalive 长连接。<\/li><li>gzip 预压缩（gzip_static）减少实时压缩 CPU。<\/li><li>日志：静态路径 <code>access_log off<\/code>。<\/li><li>压测验证：<code>ab -c 1000<\/code>，观察 <code>nginx -s<\/code> 指标（Reading/Writing 无堆积、无 <code>worker_connections are not enough<\/code> 报错）。<\/li><\/ol>"}, {"q": "11.5 慢客户端与慢速攻击防护", "tag": "进阶", "body": "<ul><li><strong>慢速攻击（Slowloris）<\/strong>：客户端只发不读，占用连接不释放 → 拖垮 worker。<\/li><li>防护：<\/li><\/ul>\n<pre><code class=\"lang-nginx\">  client_body_timeout 10s;    # 读请求体超时\n  client_header_timeout 10s;  # 读请求头超时\n  send_timeout 10s;           # 写响应超时\n  limit_conn conn 10;         # 限制单 IP 连接数<\/code><\/pre>\n<ul><li>另外：<code>http2_max_concurrent_streams<\/code>、<code>keepalive_timeout<\/code> 配合；高防场景前置 <strong>LVS/云 WAF<\/strong>。<\/li><\/ul>"}, {"q": "11.6 缓存类性能问题定位", "tag": "进阶", "body": "<ul><li>命中率低：检查 <code>proxy_cache_key<\/code> 是否太细（带时间戳参数导致 key 爆炸）、<code>proxy_cache_min_uses<\/code> 是否过高。<\/li><li>缓存击穿：热点 key 过期瞬间大量请求穿透 → 用 <code>proxy_cache_use_stale<\/code>（stale-while-revalidate）或后端加锁。<\/li><li>缓存雪崩：大量 key 同时过期 → 过期时间加<strong>随机抖动<\/strong>。<\/li><li>验证缓存：<code>add_header X-Cache-Status $upstream_cache_status;<\/code> 看 HIT/MISS/EXPIRED/BYPASS/STALE。<\/li><\/ul>\n<hr>"}]}, {"title": "12 深入原理（源码级）", "questions": [{"q": "12.1 master-worker 的信号与生命周期", "tag": "进阶", "body": "<ul><li>master 启动流程：解析配置 → 初始化模块 → <strong>fork worker<\/strong> → 进入事件循环等待信号。<\/li><li>信号处理（回顾 2.7）：HUP reload、USR1 reopen log、USR2 升级、QUIT 优雅退出、TERM/INT 立即退出、WINCH 优雅关 worker。<\/li><li>worker 生命周期：初始化（各模块 init_process）→ 进入 <code>ngx_worker_process_cycle<\/code> 事件循环 → 退出时清理。<\/li><li>关键点：<strong>reload 是\"新 fork 一组 worker + 旧 worker 优雅退出\"<\/strong>，不是复用旧 worker。<\/li><\/ul>"}, {"q": "12.2 内存池设计（ngx_pool_t）", "tag": "进阶", "body": "<ul><li>为什么用内存池：请求处理中大量小对象（字符串、头结构、缓冲区），频繁 malloc/free 慢且碎片化。<\/li><li>设计：<\/li><li><code>ngx_pool_t<\/code> 由多个 <strong>ngx_pool_data_t 块<\/strong>（默认 4KB 起步）组成链表。<\/li><li>分配小内存：在当前块剩余空间分配（线性分配，O(1)）；大内存（> max_size）单独 malloc。<\/li><li><strong>请求结束统一销毁整个池<\/strong>，无需逐个 free。<\/li><li>好处：分配快（指针移动）、释放快（整池回收）、无碎片。<\/li><li>代价：内存不能单独释放，长生命周期对象（如 upstream 缓存）需要独立池。<\/li><\/ul>"}, {"q": "12.3 核心数据结构速览", "tag": "进阶", "body": "<ul><li><strong>ngx_cycle_t<\/strong>：全局配置周期（所有模块配置、连接池、监听端口）。<\/li><li><strong>ngx_connection_t<\/strong>：连接对象（socket fd、读写事件、发送缓冲）。<\/li><li><strong>ngx_event_t<\/strong>：事件对象（读/写事件、handler、超时红黑树节点）。<\/li><li><strong>ngx_http_request_t<\/strong>：HTTP 请求对象（请求行、头、URI 解析、各阶段处理函数指针）。<\/li><li><strong>ngx_rbtree_t<\/strong>：红黑树（定时器、epoll 注册管理）。<\/li><li><strong>ngx_queue_t<\/strong>：侵入式双向链表。<\/li><li>设计哲学：<strong>对象复用<\/strong>（连接池、buffer 池）+ <strong>池化分配<\/strong>，减少系统调用。<\/li><\/ul>"}, {"q": "12.4 HTTP 请求处理全流程（阶段钩子）", "tag": "进阶", "body": "<pre><code>读请求头 → 解析请求行/头 → 11 个 HTTP 阶段 → 生成响应 → 过滤链 → 写响应<\/code><\/pre>\n<p>HTTP 阶段的 11 个钩子（NGX_HTTP_*_PHASE）：<\/p>\n<ol><li><code>post_read<\/code>：读完后钩子。<\/li><li><code>server_rewrite<\/code>：server 级 rewrite。<\/li><li><code>find_config<\/code>：<strong>location 匹配<\/strong>。<\/li><li><code>rewrite<\/code>：location 内 rewrite。<\/li><li><code>post_rewrite<\/code>：rewrite 后处理（last 重新匹配）。<\/li><li><code>preaccess<\/code>：limit_req/limit_conn。<\/li><li><code>access<\/code>：allow/deny。<\/li><li><code>post_access<\/code>：访问控制后。<\/li><li><code>try_files<\/code>：try_files 阶段。<\/li><li><code>content<\/code>：<strong>生成响应<\/strong>（static/proxy/fastcgi 都挂这）。<\/li><li><code>log<\/code>：记录日志。<\/li><\/ol>\n<ul><li><strong>Filter 链<\/strong>：响应内容依次经过各 filter（header_filter 处理响应头，body_filter 处理响应体——gzip、sub_filter 都在 body_filter）。<\/li><li>掌握这个流程，就能解释\"为什么 limit_req 在 location 匹配后执行\"、\"为什么 try_files 会重新走 location\"。<\/li><\/ul>"}, {"q": "12.5 为什么 Nginx 能支撑高并发（源码角度汇总）", "tag": "高频", "body": "<ol><li><strong>事件驱动 + 非阻塞<\/strong>：<code>ngx_event_core_module<\/code> 基于 epoll，连接状态机驱动，一个 worker 处理数十万连接。<\/li><li><strong>进程模型<\/strong>：worker 无共享内存（除少量共享区），<strong>无锁或少锁<\/strong>，多核线性扩展。<\/li><li><strong>连接池 + 内存池<\/strong>：<code>ngx_connection_t<\/code> 预分配复用，request 内存池随请求回收。<\/li><li><strong>零拷贝<\/strong>：<code>sendfile()<\/code> 系统调用，静态文件不走用户态。<\/li><li><strong>定时器红黑树<\/strong>：海量连接的超时管理 O(logN)。<\/li><li><strong>模块化阶段处理<\/strong>：每个请求在固定阶段流转，处理逻辑高度内聚。<\/li><\/ol>"}, {"q": "12.6 常见源码级追问", "tag": "进阶", "body": "<ul><li><strong>epoll 的 LT 与 ET 在 Nginx 中如何选择<\/strong>？Nginx 默认 LT（<code>ngx_epoll_module<\/code> 支持 ET 但默认 LT），因为 ET 要求一次性读完，处理不当易丢数据；性能差异在高并发下可忽略。<\/li><li><strong>accept_mutex 的实现<\/strong>？基于<strong>原子锁 + 尝试获取<\/strong>（ngx_trylock_accept_mutex），抢到锁的 worker 调用 accept；获取锁失败则让出 CPU（ngx_sched_yield），并设置 accept 延迟事件。<\/li><li><strong>为什么 worker 数超过 CPU 核数反而慢<\/strong>？进程切换（context switch）开销增大、缓存亲和性变差；对 I/O 密集型，超配一点点可弥补阻塞，但 Nginx 几乎不阻塞。<\/li><li><strong>Nginx 如何实现限流计数共享<\/strong>？<code>limit_req_zone<\/code> 用<strong>共享内存<\/strong>（mmap 的 ngx_shm_zone_t）存 IP→计数，worker 间通过共享内存同步（加锁/原子操作）。<\/li><\/ul>\n<hr>"}]}, {"title": "13 高频场景题与快问快答", "questions": [{"q": "13.1 场景：前端项目部署（Vue/React + history 路由）", "tag": "高频", "body": "<pre><code class=\"lang-nginx\">server {\n    listen 80;\n    server_name www.example.com;\n    root /data/www/dist;               # 构建产物\n    index index.html;\n\n    location /api/ {\n        proxy_pass http://backend;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n    }\n    location / {\n        try_files $uri $uri/ /index.html;    # 前端路由兜底\n    }\n    location ~* \\.(js|css|png|jpg|svg|woff2?)$ {\n        expires 30d;\n        add_header Cache-Control \"public, immutable\";\n    }\n}<\/code><\/pre>\n<p>发布流程：构建（npm run build）→ 产物上传服务器 → <strong>hash 文件名<\/strong>保证缓存正确 → 无需重启 Nginx（纯静态文件）。<\/p>"}, {"q": "13.2 场景：跨域配置（CORS）", "tag": "高频", "body": "<pre><code class=\"lang-nginx\">location /api/ {\n    if ($request_method = 'OPTIONS') {          # 预检请求\n        add_header Access-Control-Allow-Origin $http_origin;\n        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS';\n        add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-Requested-With';\n        add_header Access-Control-Max-Age 86400;\n        add_header Access-Control-Allow-Credentials true;\n        return 204;\n    }\n    add_header Access-Control-Allow-Origin $http_origin;   # 动态回显来源（支持多域名/带凭证）\n    add_header Access-Control-Allow-Credentials true;\n    add_header Access-Control-Expose-Headers 'Content-Disposition';\n    proxy_pass http://backend;\n}<\/code><\/pre>\n<ul><li>带 <code>credentials<\/code>（Cookie）时 <code>Access-Control-Allow-Origin<\/code> **不能为 <code>*<\/code>**，必须回显具体来源。<\/li><li>预检（OPTIONS）通常由浏览器自动发起，Nginx 直接返回 204 短路，减少后端负担。<\/li><\/ul>"}, {"q": "13.3 场景：大文件上传/下载", "tag": "进阶", "body": "<pre><code class=\"lang-nginx\">server {\n    client_max_body_size 500m;             # 上传上限\n    client_body_timeout 300s;              # 大文件上传超时调大\n    proxy_read_timeout 300s;\n\n    location /upload/ {\n        proxy_pass http://upload_backend;\n        proxy_request_buffering off;       # 边传边转（默认会先缓整个 body）\n    }\n    location /download/ {\n        alias /data/files/;\n        sendfile on;\n        limit_rate_after 100m;             # 超过 100MB 后限速\n        limit_rate 2m;\n    }\n}<\/code><\/pre>\n<ul><li>大上传建议：<code>proxy_request_buffering off<\/code> 流式转发，避免 Nginx 临时落盘整个请求体。<\/li><li>超大文件（GB 级）走 <strong>对象存储（COS/OSS）+ 分片上传 + 预签名 URL<\/strong>，Nginx 只做静态下载。<\/li><\/ul>"}, {"q": "13.4 场景：图片服务与 CDN 回源", "tag": "进阶", "body": "<pre><code class=\"lang-nginx\">location ~* ^/(avatars|uploads)/.*\\.(png|jpg|jpeg|gif|webp)$ {\n    root /data/images;\n    expires 7d;\n    add_header Cache-Control \"public\";\n    access_log off;                        # 图片高流量不记日志\n    open_file_cache max=10000 inactive=60s;\n}<\/code><\/pre>\n<ul><li>CDN 回源时，源站 Nginx 要<strong>正确处理条件请求<\/strong>（If-Modified-Since/ETag → 304），避免重复回源全量。<\/li><li>图片实时裁剪：Nginx + <strong>image_filter<\/strong> 模块（<code>image_filter resize 200 200;<\/code>）或对象存储图片处理。<\/li><li>WebP 协商：根据 <code>Accept<\/code> 头返回 WebP 格式（<code>map $http_accept $webp_suffix { ... }<\/code>）。<\/li><\/ul>"}, {"q": "13.5 场景：WebSocket + SSE + 直播流", "tag": "进阶", "body": "<ul><li>WebSocket：见 3.7（Upgrade + http1.1 + 长超时）。<\/li><li>SSE：<\/li><\/ul>\n<pre><code class=\"lang-nginx\">  location /sse/ {\n      proxy_pass http://backend;\n      proxy_buffering off;                 # 关键：关缓冲，边收边推\n      proxy_cache off;\n      proxy_read_timeout 3600s;\n      add_header Cache-Control no-cache;\n  }<\/code><\/pre>\n<ul><li>HLS 直播（.m3u8 分片）：<\/li><\/ul>\n<pre><code class=\"lang-nginx\">  location ~ \\.m3u8$  { root /data/hls; add_header Cache-Control no-cache; }\n  location ~ \\.ts$    { root /data/hls; expires 10s; }   # 分片短缓存<\/code><\/pre>\n<ul><li>直播推流（RTMP）需编译 <strong>nginx-rtmp-module<\/strong>；现代方案更多用 SRS/云直播，Nginx 只做分发。<\/li><\/ul>"}, {"q": "13.6 场景：网关能力组合（鉴权 + 限流 + 灰度 + 日志）", "tag": "进阶", "body": "<pre><code class=\"lang-nginx\">server {\n    listen 443 ssl http2;\n\n    # 全局限流\n    limit_req zone=api burst=50 nodelay;\n    limit_conn conn 100;\n\n    location /open/ {                     # 开放接口：轻限流\n        limit_req zone=open burst=20 nodelay;\n        proxy_pass http://open_backend;\n    }\n    location /inner/ {                    # 内网接口：IP 白名单\n        allow 10.0.0.0/8;\n        deny all;\n        proxy_pass http://inner_backend;\n    }\n    location / {                          # 默认走灰度池\n        set $gw_pool main;\n        if ($cookie_version = \"beta\") { set $gw_pool beta; }\n        proxy_pass http://$gw_pool;\n        proxy_set_header X-Gateway-Host $host;   # 链路追踪信息\n    }\n}<\/code><\/pre>\n<blockquote>生产更推荐 <strong>OpenResty/APISIX/Kong<\/strong>：Lua 脚本实现复杂鉴权（JWT 校验）、动态路由、灰度、熔断，比纯 nginx.conf 可维护性好得多。<\/blockquote>"}, {"q": "13.7 快问快答 20 连", "tag": "高频", "body": "<ol><li><strong>Nginx 默认端口<\/strong>？80（HTTP）、443（HTTPS）。<\/li><li><strong>Nginx 用什么事件模型<\/strong>？Linux 用 epoll，FreeBSD 用 kqueue。<\/li><li><strong>worker_processes 最佳值<\/strong>？CPU 核数（auto）。<\/li><li><strong>最大并发怎么算<\/strong>？worker_processes × worker_connections（反向代理约一半）。<\/li><li><strong>502 是什么<\/strong>？上游连接失败/无响应。<\/li><li><strong>504 是什么<\/strong>？上游响应超时。<\/li><li><strong>location 优先级<\/strong>？= > ^~ > 正则 > 普通前缀。<\/li><li><strong>root 与 alias 区别<\/strong>？root 拼接完整 URI，alias 替换匹配前缀。<\/li><li><strong>rewrite last 与 break<\/strong>？last 重新匹配 location，break 不匹配。<\/li><li><strong>正向与反向代理<\/strong>？正向代理隐藏客户端，反向代理隐藏服务器。<\/li><li><strong>Nginx 高可用<\/strong>？Keepalived + VIP（VRRP 主备）。<\/li><li><strong>平滑 reload 信号<\/strong>？HUP。<\/li><li><strong>日志切割信号<\/strong>？USR1。<\/li><li><strong>限流算法<\/strong>？Nginx limit_req 是漏桶。<\/li><li><strong>keepalive 作用<\/strong>？连接复用省握手。<\/li><li><strong>HTTPS 为什么慢<\/strong>？TLS 握手 + 加解密（可会话复用、TLS1.3、HTTP/2 优化）。<\/li><li><strong>防爬虫<\/strong>？limit_req + UA 识别 + 验证码 + 风控。<\/li><li><strong>四层与七层<\/strong>？四层 IP:端口（LVS/stream），七层 HTTP 内容（Nginx http 模块）。<\/li><li><strong>Nginx 能否处理 UDP<\/strong>？可以，stream 模块支持 TCP/UDP。<\/li><li><strong>Nginx 与 Tomcat 区别<\/strong>？Nginx 是 Web 服务器/反向代理，Tomcat 是 Java Servlet 容器（应用服务器）。<\/li><\/ol>"}, {"q": "13.8 面试官追问：Nginx 与 OpenResty / API 网关", "tag": "进阶", "body": "<ul><li><strong>OpenResty<\/strong>：Nginx + LuaJIT + 官方/第三方模块。在 Nginx 各阶段注入 Lua 逻辑（access_by_lua、content_by_lua、balancer_by_lua），实现<strong>动态路由、限流、灰度、鉴权、自定义负载均衡算法<\/strong>。<\/li><li><strong>Kong / APISIX<\/strong>：基于 OpenResty 的成熟 API 网关，插件化（认证、限流、熔断、可观测），支持<strong>动态配置<\/strong>（配置中心同步，无需 reload）。<\/li><li>对比纯 Nginx：<\/li><li>Nginx 配置是<strong>静态文件<\/strong>，改配置要 reload；网关支持<strong>动态下发<\/strong>。<\/li><li>Nginx 的限流/灰度能力有限（IP/权重），Lua 可做<strong>任意维度<\/strong>（uid、设备、参数）。<\/li><li>复杂网关逻辑推荐 APISIX/Kong；简单场景原生 Nginx 足够。<\/li><\/ul>\n<blockquote>总结：Nginx 是\"发动机\"，OpenResty 是\"发动机 + 可编程变速箱\"，API 网关是\"整车\"。面试回答要体现<strong>由浅入深<\/strong>：先讲 Nginx 本身，再讲如何扩展，最后落到生产架构选型。<\/blockquote>"}]}], "qcount": 86}]}, {"id": "linux", "name": "Linux", "icon": "🐧", "color": "#eab308", "docs": [{"sub": "题库深度版", "chapters": [{"title": "01 启动流程与系统管理", "questions": [{"q": "1.1 Linux 开机启动的完整流程？", "tag": "", "body": "<p><strong>流程<\/strong>：<code>加电 → BIOS/UEFI 自检 → 引导介质 → GRUB2 → 加载内核 → 挂载根文件系统 → 启动 systemd(PID=1) → 按 target 并行启动服务 → 登录<\/code><\/p>\n<ul><li><strong>BIOS/UEFI<\/strong>：POST 自检硬件，UEFI 支持 GPT 磁盘与安全启动，比传统 BIOS 更快。<\/li><li><strong>GRUB2<\/strong>：引导程序，从磁盘读取 <code>/boot/grub2/grub.cfg<\/code>，支持多内核多系统选择。<\/li><li><strong>内核<\/strong>：解压并初始化，挂载根文件系统（只读）→ 切换为读写，启动 <code>/sbin/init<\/code>。<\/li><li><strong>systemd<\/strong>：作为 1 号进程，读取默认 target（<code>default.target<\/code> → 通常软链到 <code>multi-user.target<\/code> 或 <code>graphical.target<\/code>），<strong>并行启动依赖单元<\/strong>。<\/li><li>传统 SysVinit 是串行执行 <code>/etc/rc.d/rc*.d/<\/code> 下的脚本，系统越大启动越慢，这也是 systemd 取代它的核心理由。<\/li><\/ul>\n<blockquote>加分点：内核启动参数可在 GRUB 界面按 e 编辑，如追加 <code>single<\/code> 进入单用户模式（忘记 root 密码时用）。<\/blockquote>"}, {"q": "1.2 MBR vs GPT 区别？", "tag": "", "body": "<table><thead><tr><th>维度<\/th><th>MBR<\/th><th>GPT<\/th><\/tr><\/thead><tbody><tr><td>分区表位置<\/td><td>磁盘第一个扇区<\/td><td>磁盘头尾各一份（冗余）<\/td><\/tr><tr><td>最大容量<\/td><td>2TB<\/td><td>9.4ZB<\/td><\/tr><tr><td>主分区数<\/td><td>4 个（逻辑分区扩展）<\/td><td>128 个<\/td><\/tr><tr><td>引导<\/td><td>BIOS/传统模式<\/td><td>UEFI 模式<\/td><\/tr><tr><td>校验<\/td><td>无<\/td><td>CRC32 校验<\/td><\/tr><\/tbody><\/table>"}, {"q": "1.3 systemd 核心概念？", "tag": "", "body": "<ul><li><strong>Unit<\/strong>：最小管理单元，类型有 <code>.service<\/code> <code>.socket<\/code> <code>.target<\/code> <code>.mount<\/code> <code>.timer<\/code> 等，位于 <code>/usr/lib/systemd/system<\/code>（发行版）与 <code>/etc/systemd/system<\/code>（自定义，优先级高）。<\/li><li><strong>target<\/strong>：一组 unit 的组合，等价于运行级别：<code>multi-user.target<\/code>（3）、<code>graphical.target<\/code>（5）。<\/li><li><strong>关键命令<\/strong>：<\/li><\/ul>\n<pre><code>systemctl start/stop/restart/reload/status  服务名\nsystemctl enable/disable                    设置开机自启\nsystemctl list-units --type=service --state=running\nsystemctl daemon-reload                     修改 unit 文件后重载\njournalctl -u 服务名 -f                     查看服务日志\nsystemctl is-enabled 服务名                 查看是否开机自启<\/code><\/pre>\n<ul><li><strong>unit 文件关键字段<\/strong>：<code>[Unit]<\/code> 里 <code>After=<\/code> 定义依赖顺序、<code>[Service]<\/code> 里 <code>ExecStart=<\/code> <code>Restart=<\/code>（on-failure 崩溃自动拉起）、<code>[Install]<\/code> 里 <code>WantedBy=multi-user.target<\/code>。<\/li><\/ul>"}, {"q": "1.4 运行级别 runlevel？", "tag": "", "body": "<ul><li>0 关机、1 单用户、2 无网络多用户、3 命令行多用户、5 图形界面、6 重启。<\/li><li>systemd 中对应 target：<code>runlevel3.target → multi-user.target<\/code>、<code>runlevel5.target → graphical.target<\/code>。<\/li><li>切换：<code>init 3<\/code> / <code>systemctl isolate multi-user.target<\/code>；查看：<code>runlevel<\/code> / <code>systemctl get-default<\/code>。<\/li><\/ul>"}, {"q": "1.5 /etc/fstab 关键字段？", "tag": "", "body": "<pre><code>设备       挂载点  类型   选项                 dump  fsck\n/dev/sda1  /boot   xfs    defaults            0     1\nUUID=xxx   /       xfs    defaults            0     0\n/dev/sdb1  /data   ext4   defaults,noatime    0     2<\/code><\/pre>\n<ul><li><strong>noatime<\/strong>：不更新访问时间，减少写 IO（数据库服务器常用）。<\/li><li><strong>fsck 列<\/strong>：根分区 1，其他数据分区 2，0 表示开机不检查。<\/li><li>建议挂载数据盘用 UUID 而非设备名（设备名重启后可能变化）。<\/li><\/ul>\n<hr>"}]}, {"title": "02 文件系统与文件管理", "questions": [{"q": "2.1 \"一切皆文件\"如何理解？", "tag": "", "body": "<ul><li>普通文件、目录、设备（<code>/dev<\/code>）、管道、socket、符号链接、<code>/proc<\/code> 与 <code>/sys<\/code> 下的内核信息都以文件形式暴露。<\/li><li>好处：统一操作接口（open/read/write/close），可以用重定向、管道、重定向等方式操作设备与内核参数。<\/li><li>例：<code>echo 1 > /proc/sys/net/ipv4/ip_forward<\/code> 开启 IP 转发；<code>/proc/cpuinfo<\/code> 查看 CPU 信息。<\/li><\/ul>"}, {"q": "2.2 inode 是什么？索引节点的作用？", "tag": "", "body": "<ul><li><strong>inode<\/strong> 保存文件的元数据：权限、属主属组、大小、时间戳（atime/mtime/ctime）、数据块指针，<strong>不包含文件名<\/strong>。<\/li><li>文件名存在<strong>目录项 dentry<\/strong> 中，dentry 是\"文件名 → inode 号\"的映射，目录本质是存 dentry 的特殊文件。<\/li><li>一个文件由三部分组成：<strong>dentry（文件名）+ inode（元数据）+ data block（数据）<\/strong>。<\/li><li>查看：<code>ls -i<\/code>、<code>stat 文件<\/code>；<code>df -i<\/code> 查看 inode 使用率（<strong>inode 耗尽但磁盘有空间<\/strong>是经典故障）。<\/li><li>文件操作过程：open() 先按路径逐级找到 dentry → inode → 数据块，涉及路径缓存（dcache）与 inode 缓存。<\/li><\/ul>"}, {"q": "2.3 硬链接 vs 软链接？", "tag": "", "body": "<table><thead><tr><th>维度<\/th><th>硬链接<\/th><th>软链接（符号链接）<\/th><\/tr><\/thead><tbody><tr><td>本质<\/td><td>同一 inode 的多个文件名<\/td><td>独立文件，内容是指向目标的路径<\/td><\/tr><tr><td>inode<\/td><td>相同<\/td><td>不同<\/td><\/tr><tr><td>跨文件系统<\/td><td>不支持<\/td><td>支持<\/td><\/tr><tr><td>链接目录<\/td><td>不支持<\/td><td>支持<\/td><\/tr><tr><td>目标删除<\/td><td>原文件不受影响<\/td><td>失效（红底闪烁）<\/td><\/tr><tr><td>命令<\/td><td><code>ln a b<\/code><\/td><td><code>ln -s a b<\/code><\/td><\/tr><\/tbody><\/table>\n<ul><li>硬链接原理：inode 有 <code>nlink<\/code> 引用计数，删除一个硬链接只是 <code>nlink-1<\/code>，为 0 才真正释放数据块。<\/li><li>经典题：<code>cp<\/code> vs <code>mv<\/code> 对硬链接的影响——<code>cp<\/code> 会创建新 inode 破坏硬链接关系，<code>mv<\/code> 只改 dentry 不影响。<\/li><\/ul>"}, {"q": "2.4 FHS 标准目录结构？", "tag": "", "body": "<ul><li><code>/bin<\/code> <code>/sbin<\/code>：基本命令（现代发行版软链到 <code>/usr/bin<\/code>）。<\/li><li><code>/etc<\/code>：配置文件；<code>/var<\/code>：可变数据（日志、缓存、锁）；<code>/tmp<\/code>：临时文件。<\/li><li><code>/home<\/code>：普通用户家目录；<code>/root<\/code>：root 家目录。<\/li><li><code>/dev<\/code>：设备文件；<code>/proc<\/code>：进程与内核虚拟文件系统；<code>/sys<\/code>：设备与驱动信息。<\/li><li><code>/usr<\/code>：只读的应用程序与库（类似 Windows 的 Program Files）；<code>/opt<\/code>：第三方软件。<\/li><li><code>/boot<\/code>：内核与引导文件；<code>/mnt<\/code> <code>/media<\/code>：挂载点。<\/li><\/ul>"}, {"q": "2.5 文件权限与 ACL？", "tag": "", "body": "<ul><li>权限位：<code>rwx<\/code> 三组（属主/属组/其他），<code>r=4 w=2 x=1<\/code>，可用数字表示。<\/li><li><strong>目录权限要点<\/strong>：目录的 r 决定能否 <code>ls<\/code> 列出文件名，w 决定能否增删文件，x 决定能否 <code>cd<\/code> 进入并访问内部文件。目录没有 x 权限时，即使有 r 也列不出 inode 信息。<\/li><li><strong>umask<\/strong>：默认权限 = 666/777 - umask。如 umask=022 → 文件 644、目录 755。<\/li><li><strong>ACL<\/strong>：<code>setfacl -m u:tom:rwx file<\/code> 给指定用户/组单独授权，解决\"一个用户属于多个组但权限不匹配\"的问题；查看 <code>getfacl<\/code>。<\/li><\/ul>"}, {"q": "2.6 特殊权限 setuid / setgid / sticky？", "tag": "", "body": "<ul><li><strong>setuid（SUID，4）<\/strong>：<code>chmod u+s 文件<\/code>——执行时以<strong>属主身份<\/strong>运行，如 <code>/usr/bin/passwd<\/code> 以 root 身份改密码。<code>ls -l<\/code> 显示 <code>rws<\/code>。<\/li><li><strong>setgid（SGID，2）<\/strong>：对可执行文件以属组身份运行；对目录则新文件继承目录属组（常用于共享目录）。<\/li><li><strong>sticky（1）<\/strong>：<code>/tmp<\/code> 目录有 t 位，只有<strong>文件属主或 root<\/strong> 才能删除目录内的文件，防止互相删文件。显示 <code>drwxrwxrwt<\/code>。<\/li><li>数字法：<code>chmod 4755<\/code>（SUID）、<code>chmod 2755<\/code>（SGID）、<code>chmod 1777<\/code>（sticky）。<\/li><li>安全风险：SUID 文件若属主是 root 且可写，是提权漏洞，排查：<code>find / -perm -4000 2>/dev/null<\/code>。<\/li><\/ul>"}, {"q": "2.7 磁盘满了怎么排查？", "tag": "", "body": "<ol><li><code>df -h<\/code> 看哪个分区满；<code>df -i<\/code> 看 inode 是否耗尽。<\/li><li><code>du -sh /*<\/code> 逐层定位大目录：<code>du -h --max-depth=1 /var | sort -rh | head<\/code>。<\/li><li>文件被删除但进程仍占用 → <code>lsof | grep deleted<\/code>，确认后重启该进程或 <code>> 文件<\/code> 清空。<\/li><li>日志膨胀：检查 <code>/var/log<\/code>，配置 logrotate 轮转。<\/li><li>定位大文件：<code>find / -type f -size +1G -exec ls -lh {} \\;<\/code>。<\/li><\/ol>"}, {"q": "2.8 RAID 与 LVM 概念？", "tag": "", "body": "<ul><li><strong>RAID0<\/strong>：条带，读写快、无冗余，一块坏全坏。<strong>RAID1<\/strong>：镜像，容量减半、安全性最高。<strong>RAID5<\/strong>：分布式校验，至少 3 块盘，允许坏 1 块。<strong>RAID10<\/strong>：先镜像再条带，性能与安全兼顾，至少 4 块。<\/li><li><strong>LVM<\/strong>（逻辑卷管理）：PV（物理卷）→ VG（卷组）→ LV（逻辑卷）。核心优势：<strong>容量可在线扩展/缩减<\/strong>（<code>lvextend -L +10G /dev/vg0/data && xfs_growfs /<\/code>），而传统分区扩容麻烦。<\/li><li>查看：<code>pvdisplay<\/code> <code>vgdisplay<\/code> <code>lvdisplay<\/code>、<code>lsblk<\/code>、<code>blkid<\/code>。<\/li><\/ul>\n<hr>"}]}, {"title": "03 进程与线程", "questions": [{"q": "3.1 进程与线程的区别？", "tag": "", "body": "<ul><li><strong>进程<\/strong>：资源分配的最小单位，有独立地址空间、文件描述符表、信号处理器；进程间通信需 IPC 机制，切换开销大。<\/li><li><strong>线程<\/strong>：CPU 调度的最小单位，共享进程的地址空间与资源（堆、全局变量、fd），各自拥有栈、寄存器、程序计数器；切换开销小。<\/li><li>Linux 里两者都用 <code>clone()<\/code> 创建，线程是通过共享地址空间标志的\"轻量级进程\"。<\/li><li>多进程优势：隔离性好、一个崩溃不影响其他；多线程优势：共享数据方便、创建切换快。<\/li><\/ul>"}, {"q": "3.2 fork 的写时拷贝（COW）原理？", "tag": "", "body": "<ul><li><code>fork()<\/code> 后子进程<strong>不复制父进程全部内存<\/strong>，而是共享页表并标记为只读。<\/li><li>只有一方写入时才触发缺页异常，复制该页（写时拷贝），大幅减少 fork 开销。<\/li><li><strong>COW 解决了\"fork 后立刻 exec\"的场景<\/strong>：exec 会完全替换地址空间，若 fork 时全量复制就是纯浪费。<\/li><li>追问：为什么 fork 不直接复制？——大进程 fork 慢且浪费内存，COW 让 fork 近乎 O(1)。<\/li><\/ul>"}, {"q": "3.3 孤儿进程与僵尸进程？", "tag": "", "body": "<ul><li><strong>孤儿进程<\/strong>：父进程先退出，子进程被 <strong>init/systemd（PID=1）收养<\/strong>，继续正常运行，无害。<\/li><li><strong>僵尸进程<\/strong>：子进程先退出，但父进程没调用 <code>wait()<\/code> 回收，进程变成 <strong>Z 状态<\/strong>——保留 PCB 供父进程读取退出状态，但不占内存只占进程表项。<\/li><li>危害：大量僵尸进程会耗尽进程号（<code>pid_max<\/code>）与进程表，导致无法创建新进程。<\/li><li><strong>处理<\/strong>：定位父进程 <code>ps -ef | awk '$3==父PID'<\/code>；父进程是代码问题——需修改代码调用 wait()；临时手段：杀掉父进程让其变孤儿，由 init 统一回收；<code>kill -SIGCHLD 父进程<\/code> 通知父进程收尸（对不写 wait 的无效）。<\/li><\/ul>"}, {"q": "3.4 进程状态？", "tag": "", "body": "<pre><code>R  running    运行/就绪\nS  sleeping   可中断睡眠（等 IO）\nD  uninterruptible sleep  不可中断睡眠（等磁盘IO，kill 不掉）\nT  stopped    停止（Ctrl+Z 或 kill -STOP）\nZ  zombie     僵尸\nX  dead       已退出（瞬时）<\/code><\/pre>\n<ul><li><strong>D 状态<\/strong>：正在等待磁盘 IO 的内核路径，无法被信号杀死，只能等 IO 完成；NFS 挂掉时常见，排查 <code>ps -eo stat,pid,comm | grep ^D<\/code>。<\/li><\/ul>"}, {"q": "3.5 进程调度？", "tag": "", "body": "<ul><li>Linux 默认调度器 <strong>CFS（完全公平调度）<\/strong>：按\"虚拟运行时间\"维护红黑树，每次选 vruntime 最小的进程运行，保证公平。<\/li><li><strong>优先级<\/strong>：普通进程 nice 值 -20~19（越小优先级越高）；实时进程（SCHED_FIFO/SCHED_RR）优先级 1~99 高于普通进程。<\/li><li>调整：<code>nice -n -5 命令<\/code>（启动时）、<code>renice -n -5 -p PID<\/code>（运行中）；<code>top<\/code> 里按 r 可调。<\/li><li>交互式进程 vs 批处理进程：CFS 通过 sleep 时间补偿，保证交互式响应快。<\/li><\/ul>"}, {"q": "3.6 守护进程（daemon）？", "tag": "", "body": "<ul><li>特点：后台运行、无控制终端、通常以 root 启动、独立会话。<\/li><li>创建步骤：fork 一次或两次 → 子进程 setsid() 创建新会话 → 忽略 SIGHUP → 切换工作目录到 / → 重定向 stdin/stdout/stderr 到 /dev/null → 设置 umask。<\/li><li>现代做法：直接写 systemd unit 文件，由 systemd 管理（<code>Type=forking<\/code> 或 <code>Type=simple<\/code>），不需要手工 daemon 化。<\/li><\/ul>"}, {"q": "3.7 进程间通信 IPC 有哪些？", "tag": "", "body": "<table><thead><tr><th>方式<\/th><th>特点<\/th><th>适用<\/th><\/tr><\/thead><tbody><tr><td>管道 pipe<\/td><td>半双工、血缘关系进程<\/td><td>命令间<\/td><\/tr><tr><td>命名管道 FIFO<\/td><td>无血缘进程<\/td><td>简单消息<\/td><\/tr><tr><td>信号<\/td><td>异步通知<\/td><td>控制进程<\/td><\/tr><tr><td>消息队列<\/td><td>内核管理、可带类型<\/td><td>结构化消息<\/td><\/tr><tr><td>共享内存<\/td><td>最快、需同步<\/td><td>大数据量<\/td><\/tr><tr><td>信号量<\/td><td>计数器同步<\/td><td>互斥/资源数<\/td><\/tr><tr><td>Socket<\/td><td>跨主机<\/td><td>分布式<\/td><\/tr><\/tbody><\/table>\n<ul><li>经典追问：共享内存为什么最快？——无需内核拷贝，进程直接映射同一物理内存。<\/li><li>追问：它有什么问题？——需要自己加锁（信号量/互斥锁）保证同步。<\/li><\/ul>"}, {"q": "3.8 文件描述符（fd）？", "tag": "", "body": "<ul><li>fd 是进程打开文件的整数索引，指向内核的文件表（含文件偏移、打开模式）。<\/li><li>限制：<code>ulimit -n<\/code>（默认 1024，高并发服务需调大）；查看进程占用：<code>ls /proc/PID/fd<\/code>、<code>lsof -p PID<\/code>。<\/li><li><strong>经典故障<\/strong>：fd 耗尽 → \"Too many open files\"，排查 <code>lsof | wc -l<\/code>、<code>cat /proc/PID/limits<\/code>。<\/li><li>调整：<code>ulimit -n 65535<\/code>（临时）；<code>/etc/security/limits.conf<\/code> 加 <code>* soft nofile 65535<\/code>（永久）。<\/li><\/ul>\n<hr>"}]}, {"title": "04 内存管理", "questions": [{"q": "4.1 虚拟内存与地址空间？", "tag": "", "body": "<ul><li>每个进程看到独立的 4GB（32 位）/ 128TB（64 位）虚拟地址空间，通过<strong>页表<\/strong>映射到物理内存。<\/li><li>好处：进程隔离（互不干扰）、地址统一（编译期无需关心物理地址）、允许超卖（虚拟 > 物理）。<\/li><li>64 位进程地址空间布局（从高到低）：栈 → 共享库/内存映射 → 堆 → BSS → 数据段 → 代码段。<\/li><li><strong>栈 vs 堆<\/strong>：栈由编译器管理、自动分配释放、容量小（8MB，<code>ulimit -s<\/code>）、访问快；堆由 malloc 管理、需手动释放、容量大（受虚拟内存限制）、易碎片化。<\/li><\/ul>"}, {"q": "4.2 分页、缺页中断、页面置换？", "tag": "", "body": "<ul><li><strong>分页<\/strong>：物理内存按固定大小页（4KB）管理，虚拟页 → 物理页框映射。<\/li><li><strong>缺页中断<\/strong>：访问的页不在物理内存时触发，分为：① 有效缺页（页表项无效，需加载）；② 无效缺页（非法访问 → segment fault）。<\/li><li><strong>页面置换算法<\/strong>：LRU、LFU、Clock（改进型 LRU）；Linux 用近似 LRU。<\/li><li><strong>thrashing（颠簸）<\/strong>：物理内存不足时频繁换页，系统性能骤降——现象是 load 高但 CPU 空闲等待 IO，解决靠加内存或减少进程。<\/li><\/ul>"}, {"q": "4.3 swap 的作用与调优？", "tag": "", "body": "<ul><li>swap 是磁盘上的交换分区/文件，内存不足时把冷页换出。<\/li><li><code>swapon -s<\/code>、<code>/etc/fstab<\/code> 中配置；<strong>swap 不是越多越好<\/strong>：过量 swap 会导致频繁磁盘交换、延迟激增。<\/li><li><code>vm.swappiness<\/code>（0-100，默认 60）：值越小越倾向用物理内存。数据库服务器常设 0~10 避免 swap 抖动。<\/li><li>经典题：swap 使用率高一定内存不足吗？——可能只是内存充足但内核按策略提前换出冷页，需结合 <code>free<\/code> 的 available 判断。<\/li><\/ul>"}, {"q": "4.4 OOM Killer 原理？", "tag": "", "body": "<ul><li>内存严重不足时，内核启动 OOM Killer 选择进程杀掉，依据 <code>oom_score<\/code>（内存占用大 + 分值高）。<\/li><li><code>/proc/PID/oom_score<\/code> 查看分值、<code>oom_score_adj<\/code> 可调（-1000 表示永不杀）。<\/li><li>常见误杀：数据库/缓存服务被 OOM，解决：保证内存冗余、限制单进程内存、给关键进程调低 oom_score_adj。<\/li><li>查看被杀记录：<code>dmesg | grep -i oom<\/code> 或 <code>journalctl -k | grep -i oom<\/code>。<\/li><\/ul>"}, {"q": "4.5 free 命令详解（buffer vs cache）？", "tag": "", "body": "<pre><code>              total    used    free   shared  buff/cache   available\nMem:          15Gi    6.2Gi   1.1Gi   120Mi     7.7Gi       8.6Gi<\/code><\/pre>\n<ul><li><strong>buffer<\/strong>：块设备写缓存（攒批落盘）。<\/li><li><strong>cache<\/strong>：文件页缓存（读加速），用 <code>page cache<\/code> 统一管理。<\/li><li><strong>available ≈ free + 可回收 cache<\/strong>——判断内存是否紧张应看 available 而非 free。<\/li><li>经典题：cache 占用大要不要清理？——不需要，page cache 会被自动回收；<code>echo 3 > /proc/sys/vm/drop_caches<\/code> 仅用于压测前清缓存。<\/li><\/ul>"}, {"q": "4.6 内存泄漏如何排查？", "tag": "", "body": "<ol><li><code>top<\/code> 看 RES 持续增长的进程（<code>ps aux --sort=-%mem<\/code>）。<\/li><li><code>pmap -x PID<\/code> 看进程各段内存；<code>/proc/PID/status<\/code> 的 <code>VmRSS<\/code>。<\/li><li>Java：jmap/jstat；C/C++：valgrind memcheck、ASAN。<\/li><li>监控工具：<code>free -s 2<\/code> 持续观察、Prometheus + cAdvisor。<\/li><li>确认泄漏：重启后内存回落再观察是否缓慢爬升。<\/li><\/ol>\n<hr>"}]}, {"title": "05 CPU 与性能分析", "questions": [{"q": "5.1 top 各字段含义？", "tag": "", "body": "<ul><li><code>load average<\/code>：1/5/15 分钟平均运行队列长度（含 D 状态），<strong>单核 >1、多核 >核数<\/strong>即超载，应除以核数判断。<\/li><li><code>%CPU<\/code>：进程占用；<code>RES<\/code>：物理内存；<code>SHR<\/code>：共享内存。<\/li><li>按 <code>P<\/code> 按 CPU 排序、<code>M<\/code> 按内存排序、<code>1<\/code> 展开多核。<\/li><li><code>us<\/code> 用户态 / <code>sy<\/code> 内核态 / <code>ni<\/code> 优先级调整 / <code>id<\/code> 空闲 / <code>wa<\/code> IO等待 / <code>hi<\/code> 硬中断 / <code>si<\/code> 软中断 / <code>st<\/code> 被虚拟机偷走（宿主机超卖）。<\/li><\/ul>"}, {"q": "5.2 CPU 100% 如何排查？（高频实战）", "tag": "", "body": "<pre><code>top -c                        # 找到 CPU 最高的 PID\ntop -Hp PID                   # 找到该进程内最耗 CPU 的线程 TID\nprintf \"%x\\n\" TID             # 转 16 进制\njstack PID | grep -A10 TID十六进制   # Java 场景看线程栈\nstrace -p PID -f              # C/C++ 场景跟踪系统调用\nperf top / perf record        # 内核级采样<\/code><\/pre>\n<ul><li>死循环 vs 频繁 GC：Java 看 GC 日志；业务代码看线程栈；内核态高（sy）看系统调用是否异常。<\/li><\/ul>"}, {"q": "5.3 load average 高但 CPU 空闲？", "tag": "", "body": "<ul><li>说明大量进程处于 <strong>D 状态<\/strong>（等磁盘/网络 IO）或 R 队列排长队。<\/li><li>排查：<code>vmstat 1<\/code> 看 <code>b<\/code>（阻塞进程）、<code>wa<\/code>；<code>iostat -x 1<\/code> 看磁盘 <code>%util<\/code>；NFS 挂载是否卡住。<\/li><li>结论：load 高不一定 CPU 忙，可能是 IO 瓶颈。<\/li><\/ul>"}, {"q": "5.4 上下文切换与中断？", "tag": "", "body": "<ul><li><strong>上下文切换<\/strong>：内核在不同进程/线程间切换，保存恢复寄存器、页表、栈。切换太频繁浪费 CPU，<code>vmstat<\/code> 的 <code>cs<\/code> 列查看，<code>pidstat -w<\/code> 看每个进程自愿/非自愿切换。<\/li><li><strong>硬中断<\/strong>：硬件设备通知 CPU（网卡、磁盘），<code>/proc/interrupts<\/code> 查看；<strong>软中断<\/strong>：内核延迟处理的任务（网络收包、定时器），<code>/proc/softirqs<\/code> 查看。<\/li><li>高并发网络场景：软中断（si）高是正常的，可开启 RPS 把软中断分散到多核。<\/li><\/ul>"}, {"q": "5.5 常用性能命令全家桶？", "tag": "", "body": "<ul><li><code>vmstat 1<\/code>：r（运行队列）b（阻塞）swpd si so bi bo cs us sy wa id。<\/li><li><code>iostat -x 1<\/code>：%util（磁盘忙）、await（IO 等待）、svctm。<\/li><li><code>mpstat -P ALL 1<\/code>：各核使用率；<code>pidstat -u -r -d 1<\/code>：按进程统计。<\/li><li><code>sar<\/code>：历史性能数据（/var/log/sa）；<code>uptime<\/code>：load；<code>dstat<\/code>：综合。<\/li><li>排查顺序建议：uptime → vmstat → iostat → pidstat → 定位进程。<\/li><\/ul>\n<hr>"}]}, {"title": "06 网络", "questions": [{"q": "6.1 网络排查命令体系？", "tag": "", "body": "<ul><li><code>ip addr<\/code> / <code>ifconfig<\/code>：网卡与 IP；<code>ip route<\/code> / <code>route -n<\/code>：路由。<\/li><li><code>ss -tlnp<\/code> / <code>netstat -tlnp<\/code>：监听端口与进程（<strong>ss 更快，netstat 已废弃<\/strong>）。<\/li><li><code>ss -ant<\/code>：查看 TCP 连接状态统计（TIME_WAIT 等）。<\/li><li><code>ping<\/code>：连通性与延迟；<code>traceroute<\/code>：路由路径；<code>curl -v<\/code>：HTTP 层排错。<\/li><li><code>dig<\/code> / <code>nslookup<\/code>：DNS 解析；<code>hostname -I<\/code>：本机 IP。<\/li><li>排查顺序：先 ping（通不通）→ 再 telnet/curl 端口（服务在不在）→ 再抓包（内容对不对）。<\/li><\/ul>"}, {"q": "6.2 TCP 三次握手、四次挥手？", "tag": "", "body": "<ul><li><strong>握手<\/strong>：SYN → SYN+ACK → ACK；<strong>挥手<\/strong>：FIN → ACK → FIN → ACK。<\/li><li>为什么握手三次？——防止历史重复 SYN 建立无效连接，双方确认收发能力。<\/li><li>为什么挥手四次？——半关闭，一方发 FIN 只代表\"我的数据发完了\"，另一方可能还有数据要发，需分开确认。<\/li><li><strong>TIME_WAIT<\/strong>：主动关闭方进入，持续 2MSL（约 60s），作用：① 保证最后一个 ACK 到达；② 防止旧连接数据串扰。大量 TIME_WAIT 常见于短连接高并发。<\/li><li>处理：复用连接（连接池/HTTP keep-alive）；调 <code>net.ipv4.tcp_tw_reuse<\/code>（仅出方向）+ <code>tcp_fin_timeout<\/code>；服务端是被动方一般不会大量 TW。<\/li><\/ul>"}, {"q": "6.3 DNS 解析流程？", "tag": "", "body": "<p><code>浏览器缓存 → 系统 hosts → 本地 DNS 缓存(nscd/systemd-resolved) → 递归 DNS 服务器 → 根服务器 → 顶级域服务器 → 权威服务器<\/code>。<\/p>\n<ul><li>常用文件：<code>/etc/hosts<\/code>、<code>/etc/resolv.conf<\/code>（nameserver 配置）。<\/li><li>排错：<code>dig 域名<\/code> 看响应、<code>getent hosts 域名<\/code> 测解析、<code>nslookup<\/code>。<\/li><li>经典题：ping 域名通但 curl 不通？——可能代理、防火墙 80/443、DNS 返回不同 IP。<\/li><\/ul>"}, {"q": "6.4 防火墙 iptables / firewalld？", "tag": "", "body": "<ul><li><strong>iptables<\/strong>：四表五链——filter（过滤）/ nat（地址转换）/ mangle（修改）/ raw；PREROUTING、INPUT、FORWARD、OUTPUT、POSTROUTING。<\/li><li>常用命令：<\/li><\/ul>\n<pre><code>iptables -L -n                        # 查看\niptables -A INPUT -p tcp --dport 22 -j ACCEPT\niptables -A INPUT -s 10.0.0.0/8 -j ACCEPT\niptables -A INPUT -j DROP             # 默认拒绝（放最后）\niptables -I INPUT 1 -p tcp --dport 8080 -s 1.2.3.4 -j ACCEPT<\/code><\/pre>\n<ul><li><strong>firewalld<\/strong>：zone 概念（public/trusted），<code>firewall-cmd --permanent --add-port=8080/tcp && firewall-cmd --reload<\/code>。<\/li><li><strong>nftables<\/strong>：iptables 的继任者，语法统一。<\/li><li>注意：改防火墙前先确认自己有控制台/其他通道，防止把自己锁外面。<\/li><\/ul>"}, {"q": "6.5 SSH 原理与安全加固？", "tag": "", "body": "<ul><li>原理：非对称加密握手（RSA/ECDSA 交换密钥）+ 对称加密传输（AES）+ HMAC 完整性校验。<\/li><li>流程：客户端连接 → 服务器发公钥 → 密钥协商（Diffie-Hellman）→ 认证（密码/公钥）→ 加密会话。<\/li><li>免密登录：<code>ssh-keygen -t ed25519<\/code> → <code>ssh-copy-id user@host<\/code>。<\/li><li><strong>加固<\/strong>：禁用 root 登录（<code>PermitRootLogin no<\/code>）、禁用密码登录用密钥（<code>PasswordAuthentication no<\/code>）、改端口（<code>Port 2222<\/code>）、<code>fail2ban<\/code> 防爆破、<code>AllowUsers<\/code> 白名单。<\/li><li>排错：<code>ssh -vvv<\/code> 详细日志、<code>/var/log/secure<\/code> 查看认证记录、<code>ss -tlnp | grep 22<\/code>。<\/li><\/ul>"}, {"q": "6.6 tcpdump 抓包？", "tag": "", "body": "<pre><code>tcpdump -i eth0 -nn port 80          # 抓 80 端口\ntcpdump -i any host 1.2.3.4          # 按 IP\ntcpdump -i eth0 -w /tmp/a.pcap       # 存文件用 Wireshark 看\ntcpdump -i eth0 'tcp[tcpflags] &amp; tcp-syn != 0'  # 只抓 SYN<\/code><\/pre>\n<ul><li>经典排查：应用连不上数据库 → 抓包看 SYN 是否重传、是否被 RST（防火墙拦截/服务未监听）。<\/li><\/ul>"}, {"q": "6.7 端口与进程互查？", "tag": "", "body": "<ul><li>端口 → 进程：<code>lsof -i :8080<\/code>、<code>ss -tlnp | grep 8080<\/code>、<code>fuser 8080/tcp<\/code>。<\/li><li>进程 → 端口：<code>ss -tlnp | grep PID<\/code>、<code>lsof -p PID | grep TCP<\/code>。<\/li><li>经典故障：端口被占 → <code>lsof -i :8080<\/code> 找到 PID → 确认是否可杀 → <code>kill -9<\/code>。<\/li><\/ul>"}, {"q": "6.8 HTTP 与 curl 常用？", "tag": "", "body": "<ul><li>状态码：2xx 成功、3xx 重定向、4xx 客户端错误（401 未认证、403 无权限、404 不存在、429 限流）、5xx 服务端错误（500、502 网关错误、503 不可用、504 超时）。<\/li><li><code>curl -v<\/code>（详细）、<code>curl -I<\/code>（只看头）、<code>curl -X POST -d '{}' -H 'Content-Type: application/json' url<\/code>、<code>curl -k<\/code>（跳过证书校验）、<code>curl -o file<\/code>、<code>curl -w '%{http_code} %{time_total}'<\/code>。<\/li><\/ul>\n<hr>"}]}, {"title": "07 文本处理三剑客", "questions": [{"q": "7.1 grep 高频用法？", "tag": "", "body": "<ul><li><code>grep -E 'a|b'<\/code> 扩展正则、<code>grep -P<\/code> Perl 正则（支持 \\d \\s 等）、<code>grep -i<\/code> 忽略大小写、<code>grep -v<\/code> 取反、<code>grep -c<\/code> 计数、<code>grep -l<\/code> 只列文件名、<code>grep -r<\/code> 递归、<code>grep -A2 -B2<\/code> 上下文。<\/li><li>经典：<code>grep -rn \"关键字\" /目录/<\/code>、<code>ps aux | grep [j]ava<\/code>（反斜杠技巧防匹配自身）。<\/li><\/ul>"}, {"q": "7.2 sed 高频用法？", "tag": "", "body": "<pre><code>sed -n '5p' file                  # 打印第 5 行\nsed -n '10,20p' file              # 打印 10-20 行\nsed -i 's/old/new/g' file         # 全局替换并写回\nsed -i '/pattern/d' file          # 按模式删行\nsed 's/^/前缀/' file              # 行首加前缀\nsed '$a 新增行' file              # 末尾追加<\/code><\/pre>\n<ul><li>注意：<code>-i<\/code> 直接改文件，建议先不加 -i 预览。<\/li><\/ul>"}, {"q": "7.3 awk 高频用法？", "tag": "", "body": "<pre><code>awk '{print $1, $NF}' file        # 打印第 1 列和最后一列\nawk -F: '{print $1}' /etc/passwd  # 指定分隔符\nawk '$3 &gt; 100 {print $1}'         # 条件过滤\nawk '{sum += $1} END {print sum}' # 求和\nawk 'NR==FNR{a[$1]=1} NR&gt;FNR{...}' # 文件关联（类似 join）<\/code><\/pre>\n<ul><li>内置变量：<code>$0<\/code> 整行、<code>NF<\/code> 列数、<code>NR<\/code> 行号、<code>FS/OFS<\/code> 分隔符、<code>BEGIN/END<\/code> 块。<\/li><li>经典统计：<code>awk '{print $1}' access.log | sort | uniq -c | sort -rn | head<\/code> 统计 top IP。<\/li><\/ul>"}, {"q": "7.4 三剑客综合实战？", "tag": "", "body": "<ul><li>统计 access.log 各状态码数量：<code>awk '{print $9}' access.log | sort | uniq -c | sort -rn<\/code>。<\/li><li>提取 IP 并去重：<code>awk '{print $1}' access.log | sort -u | wc -l<\/code>。<\/li><li>统计 500 错误最多的 URL：<code>awk '$9==500 {print $7}' access.log | sort | uniq -c | sort -rn | head<\/code>。<\/li><li>找出日志中某个时间段：<code>sed -n '/2026-08-24 10:00/,/2026-08-24 11:00/p' app.log<\/code>。<\/li><\/ul>\n<hr>"}]}, {"title": "08 Shell 脚本", "questions": [{"q": "8.1 变量与特殊变量？", "tag": "", "body": "<ul><li><code>$0<\/code> 脚本名、<code>$1-$9<\/code> 位置参数、<code>$#<\/code> 参数个数、<code>$@<\/c
