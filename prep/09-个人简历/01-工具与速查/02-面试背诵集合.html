ode> 全部参数（独立）、<code>$*<\/code> 全部参数（一个字符串）、<code>$?<\/code> 上条命令退出码（0 成功）、<code>$$<\/code> 当前 PID。<\/li><li><code>$VAR<\/code> vs <code>${VAR}<\/code>：花括号用于拼接边界，如 <code>${name}_file<\/code>。<\/li><li>变量默认值：<code>${var:-默认值}<\/code>（未设/空时用）、<code>${var:=默认值}<\/code>（顺带赋值）、<code>${var:?报错}<\/code>。<\/li><li>只读变量、环境变量：<code>export<\/code> 导出给子进程；<code>env<\/code> 查看。<\/li><\/ul>"}, {"q": "8.2 引号区别？", "tag": "", "body": "<ul><li><strong>单引号<\/strong>：所见即所得，不解析变量。<\/li><li><strong>双引号<\/strong>：解析变量与命令替换，推荐优先用。<\/li><li><strong>反引号<\/strong> `<code> <\/code>cmd<code> <\/code><code> 与 <\/code>$(cmd)`：命令替换（推荐后者，可嵌套）。<\/li><li><code>(( ))<\/code>：算术运算 <code>$((1+2))<\/code>；<code>[ ]<\/code> 与 <code>[[ ]]<\/code>：条件测试（<code>[[ ]]<\/code> 支持 <code>&&<\/code> <code>||<\/code> 和正则 <code>=~<\/code>，更推荐）。<\/li><\/ul>"}, {"q": "8.3 数组与关联数组？", "tag": "", "body": "<pre><code>arr=(a b c)                     # 普通数组\necho ${arr[0]} ${arr[@]} ${#arr[@]}   # 首元素/全部/个数\ndeclare -A map=([k1]=v1 [k2]=v2)      # 关联数组（Bash4+）\necho ${map[k1]}<\/code><\/pre>\n<ul><li>遍历：<code>for i in \"${arr[@]}\"<\/code>（注意引号防止空格分词）。<\/li><\/ul>"}, {"q": "8.4 条件判断与流程控制？", "tag": "", "body": "<pre><code>if [ -f \"$file\" ]; then ... fi   # -f 文件存在 -d 目录 -z 空串 -n 非空\nif [ \"$a\" = \"$b\" ]; then ... fi  # 字符串比较（= 而非 ==）\nif [ \"$n\" -gt 10 ]; then ... fi  # 数字比较 -gt -lt -ge -le -eq -ne\ncase \"$1\" in\n  start) ... ;;\n  stop)  ... ;;\n  *) echo \"unknown\"; exit 1 ;;\nesac<\/code><\/pre>\n<ul><li>逻辑：<code>[ a ] && [ b ]<\/code>（POSIX）、<code>[[ a && b ]]<\/code>（Bash）、<code>!<\/code> 取反。<\/li><li><strong>注意坑<\/strong>：<code>[<\/code> 后面必须有空格；变量必须加引号防止空值报错。<\/li><\/ul>"}, {"q": "8.5 循环？", "tag": "", "body": "<pre><code>for i in {1..10}; do echo $i; done\nfor f in *.log; do echo $f; done\nwhile read line; do echo \"$line\"; done &lt; file.txt\nwhile IFS= read -r line; do ... done &lt; file   # 保留空格/反斜杠的标准写法\nuntil [ 条件 ]; do ... done<\/code><\/pre>\n<ul><li><code>break<\/code> / <code>continue<\/code>；<code>for i in $(seq 1 10)<\/code> 慢于 <code>{1..10}<\/code>。<\/li><\/ul>"}, {"q": "8.6 函数与陷阱？", "tag": "", "body": "<pre><code>func() { local x=1; echo $x; return 0; }<\/code><\/pre>\n<ul><li><code>local<\/code> 局部变量；函数需先定义再调用；<code>return<\/code> 返回值是退出码而非值。<\/li><li>脚本健壮性：<code>set -e<\/code>（出错即停）、<code>set -u<\/code>（未定义变量报错）、<code>set -o pipefail<\/code>（管道中任一失败算失败）。<\/li><li>调试：<code>bash -x script.sh<\/code>、<code>set -x<\/code>。<\/li><\/ul>"}, {"q": "8.7 常用组合命令？", "tag": "", "body": "<ul><li><code>find / -name \"*.conf\" -mtime -7<\/code>（7 天内修改）；<code>find /tmp -type f -size +100M -delete<\/code>。<\/li><li><code>xargs<\/code>：<code>find . -name \"*.log\" | xargs rm -f<\/code>（注意文件名带空格用 <code>-0<\/code>/<code>-d '\\n'<\/code>）；<code>echo '1 2 3' | xargs -n1 echo<\/code>。<\/li><li><code>sort -k2 -n -r<\/code>（按第 2 列数值倒序）、<code>uniq -c<\/code>（去重计数，需先 sort）、<code>wc -l<\/code>、<code>head/tail -n<\/code>、<code>tail -f<\/code>（跟踪日志）。<\/li><li><code>tee<\/code>：输出同时写文件和终端；<code>tr 'a-z' 'A-Z'<\/code> 大小写转换；<code>cut -d: -f1<\/code> 取列。<\/li><\/ul>"}, {"q": "8.8 I/O 重定向？", "tag": "", "body": "<ul><li><code>><\/code> 覆盖、<code>>><\/code> 追加、<code>2><\/code> 错误、<code>2>&1<\/code> 合并（顺序有讲究）、<code>&><\/code> 全部、<code><<\/code> 输入。<\/li><li><code>/dev/null<\/code> 丢弃；<code>/dev/zero<\/code> 造零、<code>/dev/random<\/code> 随机数。<\/li><li>经典：<code>nohup cmd > /tmp/a.log 2>&1 &<\/code> 后台运行不随终端退出；<code>setsid<\/code> 摆脱会话。<\/li><\/ul>\n<hr>"}]}, {"title": "09 权限与安全", "questions": [{"q": "9.1 用户与组管理？", "tag": "", "body": "<ul><li>用户：<code>useradd<\/code> / <code>usermod<\/code> / <code>userdel<\/code>；组：<code>groupadd<\/code> / <code>groupmod<\/code> / <code>groupdel<\/code>；<code>passwd<\/code> 改密码、<code>id<\/code> 查看身份、<code>whoami<\/code>、<code>su<\/code> 切换用户、<code>sudo<\/code> 提权。<\/li><li><code>useradd -m -s /bin/bash -G wheel tom<\/code>：创建用户并指定 shell 和附加组。<\/li><li><strong>wheel 组<\/strong>：sudo 白名单组（CentOS/RHEL 系列）。<\/li><li>文件：<code>/etc/passwd<\/code>（用户信息）、<code>/etc/shadow<\/code>（加密密码，仅 root 可读）、<code>/etc/group<\/code>。<\/li><\/ul>"}, {"q": "9.2 sudo 配置？", "tag": "", "body": "<ul><li><code>visudo<\/code> 编辑 <code>/etc/sudoers<\/code>。<\/li><li><code>tom ALL=(ALL) ALL<\/code>：tom 可执行所有命令；<code>tom ALL=(ALL) NOPASSWD: /usr/bin/systemctl<\/code>：免密执行指定命令。<\/li><li>原理：sudo 有 5 分钟时间戳缓存；日志记录在 <code>/var/log/secure<\/code>。<\/li><li>安全：尽量用 <code>NOPASSWD<\/code> + 最小命令集，避免 <code>ALL ALL=(ALL) ALL<\/code>。<\/li><\/ul>"}, {"q": "9.3 SELinux 与 AppArmor？", "tag": "", "body": "<ul><li><strong>SELinux<\/strong>（强制访问控制 MAC）：主体（进程）对客体（文件/端口）的安全上下文强制校验，三种模式：Enforcing / Permissive / Disabled。<\/li><li>经典故障：服务端口被 SELinux 拦截（<code>Permission denied<\/code> 但权限没问题）→ <code>getenforce<\/code>、<code>ausearch -m avc<\/code> 查日志、<code>semanage port -a -t http_port_t -p tcp 8080<\/code> 放行，或临时 <code>setenforce 0<\/code>。<\/li><li><strong>AppArmor<\/strong>：基于路径的 MAC（Ubuntu 默认），配置简单；SELinux 基于标签更精细但学习成本高。<\/li><\/ul>"}, {"q": "9.4 chroot 与容器隔离？", "tag": "", "body": "<ul><li><code>chroot<\/code> 把进程的根目录切换到指定目录，限制其可见文件系统。<\/li><li>局限：chroot 只隔离文件系统视图，进程仍可访问网络、共享内核资源，配合权限限制使用。<\/li><li>现代容器 = <strong>namespace（隔离视图）+ cgroup（限制资源）+ 联合文件系统（镜像）<\/strong>，比 chroot 隔离更全面。<\/li><\/ul>"}, {"q": "9.5 密码安全与爆破防护？", "tag": "", "body": "<ul><li>密码哈希：shadow 文件存哈希（SHA512/yescrypt），带随机 salt。<\/li><li>爆破防护：<code>fail2ban<\/code>（封禁多次失败 IP）、<code>pam_tally2<\/code>（登录失败锁定）、密钥登录替代密码。<\/li><li>审计：<code>last<\/code>（登录历史）、<code>lastb<\/code>（失败登录）、<code>/var/log/secure<\/code>。<\/li><\/ul>\n<hr>"}]}, {"title": "10 磁盘与 IO", "questions": [{"q": "10.1 五种 IO 模型？", "tag": "", "body": "<ol><li><strong>阻塞 IO<\/strong>：read 没数据就一直等，占用线程。<\/li><li><strong>非阻塞 IO<\/strong>：立即返回，轮询检查（忙等浪费 CPU）。<\/li><li><strong>IO 多路复用<\/strong>：select/poll/epoll 一个线程监控大量 fd。<\/li><li><strong>信号驱动 IO<\/strong>：数据就绪发信号通知。<\/li><li><strong>异步 IO（AIO）<\/strong>：内核完成全部操作后通知，如 io_uring。<\/li><\/ol>\n<ul><li><strong>epoll 优势<\/strong>（对比 select/poll）：无 1024 上限、O(1) 就绪通知、mmap 共享内核事件表、水平/边缘触发。<\/li><li>经典追问：为什么 Redis/Nginx 高并发用 epoll？——单线程处理万级连接，靠事件驱动避免线程切换开销。<\/li><\/ul>"}, {"q": "10.2 page cache 与脏页回写？", "tag": "", "body": "<ul><li>读文件先到 page cache，命中免磁盘 IO；写文件先写 cache 标记脏页，后台按策略回写。<\/li><li>回写触发：<code>vm.dirty_ratio<\/code>（脏页占内存比例，默认 20%）触发后台回写；<code>vm.dirty_background_ratio<\/code>（默认 10%）触发前台阻塞。<\/li><li>刷盘：<code>sync<\/code> 手动；<code>/proc/sys/vm/dirty_expire_centisecs<\/code> 超时回写。<\/li><li>追问：为什么 MySQL 需要 <code>innodb_flush_log_at_trx_commit=1<\/code> 且不依赖 OS 缓存？——OS 缓存掉电丢数据，InnoDB 自己控制 fsync。<\/li><\/ul>"}, {"q": "10.3 磁盘性能排查？", "tag": "", "body": "<ul><li><code>iostat -x 1<\/code>：<code>%util<\/code>（磁盘繁忙度）、<code>await<\/code>（平均 IO 等待，含队列）、<code>svctm<\/code>（实际服务时间）、<code>rrqm/s wrqm/s<\/code>（合并率）。<\/li><li><code>iotop<\/code>：按进程看 IO 占用；<code>pidstat -d 1<\/code>。<\/li><li>判断：<code>%util<\/code> 接近 100% 且 await 大 → 磁盘瓶颈；await 大但 %util 低 → 可能是单盘随机 IO 或内存不足引起换页。<\/li><li>优化：SSD、RAID 条带、顺序 IO、批量写入、合并小文件。<\/li><\/ul>"}, {"q": "10.4 大文件处理？", "tag": "", "body": "<ul><li>创建：<code>dd if=/dev/zero of=/tmp/big bs=1M count=1024<\/code>；查看大小：<code>ls -lh<\/code>、<code>du -h<\/code>、<code>stat<\/code>。<\/li><li>切割：<code>split -b 100M file part_<\/code>（按大小）、<code>split -l 10000 file part_<\/code>（按行数）；合并：<code>cat part_* > file<\/code>。<\/li><li>只看开头结尾：<code>head -100<\/code>、<code>tail -100<\/code>、<code>tail -f<\/code>。<\/li><li>大文件搜日志：避免 <code>cat<\/code> 整文件，用 <code>grep<\/code>/<code>sed<\/code> 直接流式处理；超大文件先 <code>split<\/code> 并行处理。<\/li><\/ul>\n<hr>"}]}, {"title": "11 信号与调试", "questions": [{"q": "11.1 常见信号？", "tag": "", "body": "<table><thead><tr><th>信号<\/th><th>值<\/th><th>含义<\/th><\/tr><\/thead><tbody><tr><td>SIGHUP<\/td><td>1<\/td><td>终端挂断/重新加载配置（Nginx reload）<\/td><\/tr><tr><td>SIGINT<\/td><td>2<\/td><td>Ctrl+C 中断<\/td><\/tr><tr><td>SIGQUIT<\/td><td>3<\/td><td>Ctrl+\\ 退出并 core dump（Java 用它打线程栈）<\/td><\/tr><tr><td>SIGKILL<\/td><td>9<\/td><td>强制杀死，不可捕获/忽略<\/td><\/tr><tr><td>SIGTERM<\/td><td>15<\/td><td>优雅终止，可捕获做清理（kill 默认）<\/td><\/tr><tr><td>SIGCHLD<\/td><td>17<\/td><td>子进程退出通知父进程<\/td><\/tr><tr><td>SIGSTOP<\/td><td>19<\/td><td>暂停，不可捕获<\/td><\/tr><tr><td>SIGTSTP<\/td><td>20<\/td><td>Ctrl+Z 暂停<\/td><\/tr><\/tbody><\/table>\n<ul><li>原则：优先 SIGTERM（优雅退出），实在不行才 SIGKILL（可能丢数据、不落盘）。<\/li><li>经典题：<code>kill -9<\/code> 的危害？——进程无法清理临时文件、释放锁、落盘，可能留下脏数据或半成品文件。<\/li><\/ul>"}, {"q": "11.2 信号操作命令？", "tag": "", "body": "<ul><li><code>kill -l<\/code> 列出所有信号；<code>kill -TERM PID<\/code>、<code>kill -9 PID<\/code>；<code>killall 进程名<\/code>（按名）；<code>pkill -f 模式<\/code>（按命令行匹配）。<\/li><li>按端口杀：<code>fuser -k 8080/tcp<\/code>、<code>lsof -i :8080 | awk 'NR>1{print $2}' | xargs kill -9<\/code>。<\/li><li><strong>trap<\/strong>：脚本里捕获信号做清理：<code>trap 'echo 清理; exit' TERM INT<\/code>。<\/li><li>例：<code>kill -HUP $(cat /var/run/nginx.pid)<\/code> 优雅 reload。<\/li><\/ul>"}, {"q": "11.3 strace / ltrace / gdb？", "tag": "", "body": "<ul><li><strong>strace<\/strong>：跟踪系统调用与信号，<code>strace -p PID<\/code>（附加）、<code>strace -f -e trace=network ./app<\/code>（只看网络调用）、<code>strace -c<\/code>（统计）。<\/li><li>经典排查：程序卡住 → <code>strace -p PID<\/code> 看到卡在哪个系统调用（connect/read）。<\/li><li><strong>ltrace<\/strong>：跟踪库函数调用（malloc/free 等）。<\/li><li><strong>gdb<\/strong>：调试器，<code>gdb -p PID<\/code> 附加、<code>bt<\/code> 看调用栈、<code>info threads<\/code>。<\/li><li>Java 替代：<code>jstack<\/code>、<code>jmap<\/code>、<code>jcmd<\/code>。<\/li><\/ul>"}, {"q": "11.4 dmesg 与内核日志？", "tag": "", "body": "<ul><li><code>dmesg<\/code> 查看内核环形缓冲区：硬件错误、OOM、段错误、磁盘 IO 错误。<\/li><li><code>dmesg -T<\/code> 显示人类可读时间；<code>journalctl -k<\/code>（systemd 系统）。<\/li><li>经典：程序崩溃 → <code>dmesg | grep -i segfault<\/code> 看是否访问非法内存。<\/li><li>core dump：<code>ulimit -c unlimited<\/code> 开启，<code>gdb 程序 core文件<\/code> 分析崩溃现场。<\/li><\/ul>\n<hr>"}]}, {"title": "12 容器与虚拟化", "questions": [{"q": "12.1 Docker 核心原理？", "tag": "", "body": "<ul><li><strong>namespace<\/strong>：隔离视图——PID（进程号）、NET（网络栈）、MNT（挂载）、UTS（主机名）、IPC、USER（用户）。<\/li><li><strong>cgroup<\/strong>：限制资源——CPU、内存、IO、PID 数，防止单个容器吃光宿主。<\/li><li><strong>联合文件系统（OverlayFS）<\/strong>：镜像分层，只读底层 + 可写顶层，写时拷贝，节省磁盘。<\/li><li>与传统虚拟机区别：<strong>共享宿主内核<\/strong>、无硬件虚拟化、启动毫秒级；虚拟机有独立内核，隔离更彻底。<\/li><\/ul>"}, {"q": "12.2 Docker 常用命令？", "tag": "", "body": "<pre><code>docker ps -a                          # 所有容器\ndocker images                         # 镜像\ndocker exec -it 容器 bash             # 进入容器\ndocker logs -f 容器                   # 日志\ndocker build -t app:v1 .              # 构建\ndocker run -d -p 8080:80 --name web nginx\ndocker stop/start/rm 容器\ndocker inspect 容器                   # 查看配置\ndocker rmi 镜像 / docker system prune # 清理<\/code><\/pre>\n<ul><li><code>-v /data:/data<\/code> 挂载卷、<code>--restart=always<\/code> 崩溃自启、<code>--network host/bridge/none<\/code>。<\/li><\/ul>"}, {"q": "12.3 Dockerfile 最佳实践？", "tag": "", "body": "<pre><code>FROM openjdk:17-jre-slim\nWORKDIR /app\nCOPY target/app.jar app.jar          # 先拷贝依赖再拷贝代码，利用层缓存\nEXPOSE 8080\nCMD [\"java\", \"-jar\", \"app.jar\"]<\/code><\/pre>\n<ul><li>层缓存：<strong>变更频率低的指令放前面<\/strong>（依赖 → 代码），改动代码只重建最后一层。<\/li><li>多阶段构建：builder 阶段编译，runtime 阶段只拷贝产物，镜像更小。<\/li><li><code>.dockerignore<\/code> 排除无用文件；尽量用 slim 基础镜像；单进程原则。<\/li><\/ul>"}, {"q": "12.4 容器网络模式？", "tag": "", "body": "<ul><li><strong>bridge（默认）<\/strong>：容器经 docker0 网桥 NAT 出网，端口映射 -p。<\/li><li><strong>host<\/strong>：直接使用宿主网络栈，无 NAT，性能好但端口冲突风险。<\/li><li><strong>none<\/strong>：无网络。<\/li><li><strong>container<\/strong>：与指定容器共享网络栈。<\/li><li>容器间通信：自定义 bridge 网络（<code>docker network create<\/code>）内用服务名互访；k8s 中 Pod 内共享网络。<\/li><\/ul>"}, {"q": "12.5 容器故障排查？", "tag": "", "body": "<ul><li>启动失败：<code>docker logs 容器<\/code> 看报错；<code>docker inspect<\/code> 看 ExitCode。<\/li><li>进不去：<code>docker run --entrypoint sh 镜像<\/code> 覆盖入口。<\/li><li>资源占用：<code>docker stats<\/code> 实时监控。<\/li><li>宿主机被容器拖垮：设置 <code>--memory<\/code>、<code>--cpus<\/code> 限制；<code>pids-limit<\/code>。<\/li><li>文件系统：容器删除后数据丢失 → 用 volume 持久化。<\/li><\/ul>\n<hr>"}]}, {"title": "13 日志与监控", "questions": [{"q": "13.1 日志体系？", "tag": "", "body": "<ul><li><strong>syslog/rsyslog<\/strong>：系统日志 <code>/var/log/messages<\/code>（CentOS）、<code>/var/log/syslog<\/code>（Ubuntu）。<\/li><li><strong>journald<\/strong>：systemd 的二进制日志，<code>journalctl -u 服务名 -f<\/code>、<code>journalctl --since \"1 hour ago\"<\/code>、<code>journalctl -k<\/code>（内核）。<\/li><li>其他：<code>/var/log/secure<\/code>（认证/安全）、<code>/var/log/cron<\/code>（定时任务）、<code>/var/log/dmesg<\/code>。<\/li><li>应用日志规范：统一格式（时间/级别/请求ID）、分级（DEBUG/INFO/WARN/ERROR）、按天/按大小切分。<\/li><\/ul>"}, {"q": "13.2 logrotate 日志轮转？", "tag": "", "body": "<pre><code>/etc/logrotate.conf + /etc/logrotate.d/ 配置：\n/var/log/nginx/*.log {\n    daily\n    rotate 30          # 保留 30 份\n    compress           # 压缩旧日志\n    missingok\n    notifempty\n    postrotate\n        /bin/kill -USR1 $(cat /var/run/nginx.pid)   # 通知应用重开日志\n    endscript\n}<\/code><\/pre>\n<ul><li>触发：cron 每天执行 <code>logrotate -f<\/code>（-f 强制）；<code>logrotate -d<\/code> 调试模式预览。<\/li><li>经典故障：日志不轮转 → 磁盘写满；应用持有已删除 fd 仍写盘（<code>lsof | grep deleted<\/code>）。<\/li><\/ul>"}, {"q": "13.3 定时任务 crontab？", "tag": "", "body": "<ul><li><code>crontab -e<\/code> 编辑、<code>crontab -l<\/code> 查看、<code>crontab -r<\/code> 删除；系统级 <code>/etc/crontab<\/code>、<code>/etc/cron.d/<\/code>。<\/li><li>格式：<code>分 时 日 月 周 命令<\/code>；<code>*/5 * * * *<\/code> 每 5 分钟；<code>0 2 * * *<\/code> 每天 2 点。<\/li><li>环境坑：cron 环境变量少（无 PATH），命令用绝对路径；输出重定向到日志：<code>>> /var/log/cron.log 2>&1<\/code>。<\/li><li>日志：<code>/var/log/cron<\/code> 看是否执行；检查服务：<code>systemctl status crond<\/code>。<\/li><\/ul>"}, {"q": "13.4 监控告警思路？", "tag": "", "body": "<ul><li>采集：Prometheus node_exporter（CPU/内存/磁盘/网络）、Telegraf、脚本 + crontab。<\/li><li>告警：阈值（CPU>80%、内存 available<10%、磁盘>85%、load>核数、fd 使用率>90%）+ 通知（企业微信/钉钉/SMTP）。<\/li><li>看板：Grafana。<\/li><li>自建简单监控脚本：<code>df -h | awk '$5+0 > 85 {print}'<\/code> 配合 cron 发邮件。<\/li><\/ul>\n<hr>"}]}, {"title": "14 高频场景题（实战排查）", "questions": [{"q": "14.1 线上 CPU 100% 怎么办？", "tag": "", "body": "<pre><code>top -c → 找 PID\ntop -Hp PID → 找线程 TID\nprintf '%x\\n' TID → 转十六进制\njstack PID | grep -A30 十六进制TID   # Java\nstrace -p PID -f                     # 系统调用\nperf top -p PID                      # 采样热点<\/code><\/pre>\n<ul><li>常见原因：死循环、正则回溯、GC 频繁、线程池打满、JIT 编译期（瞬态）。<\/li><li>处置：先保留现场（jstack 快照）→ 再决定重启还是修复。<\/li><\/ul>"}, {"q": "14.2 内存不足 / OOM 怎么排查？", "tag": "", "body": "<ol><li><code>free -h<\/code> 看 available、<code>dmesg | grep -i oom<\/code> 确认被杀进程。<\/li><li><code>ps aux --sort=-%mem | head<\/code> 找内存大户。<\/li><li>判断是正常峰值（加内存/限流）还是泄漏（持续增长）。<\/li><li>处置：调大内存、限制单进程（<code>ulimit -v<\/code>）、优化代码/连接池、调 <code>oom_score_adj<\/code> 保护关键进程。<\/li><\/ol>"}, {"q": "14.3 磁盘空间满（含 inode 满）？", "tag": "", "body": "<ul><li><code>df -h<\/code> vs <code>df -i<\/code> 区分：空间满清大文件（见 2.7）；<strong>inode 满<\/strong>通常是大量小文件/缓存目录，用 <code>find / -xdev -type f | wc -l<\/code> 定位目录。<\/li><li>经典：<code>/tmp<\/code> 下大量 session 文件、<code>/var/spool<\/code> 邮件队列、Docker 容器日志未轮转。<\/li><li>处置：<code>du -sh /var/*<\/code> 逐层定位 → 清日志/清缓存/扩容。<\/li><\/ul>"}, {"q": "14.4 大量 TIME_WAIT 怎么处理？", "tag": "", "body": "<ul><li>现象：<code>ss -ant | grep TIME_WAIT | wc -l<\/code> 上万。<\/li><li>原因：短连接高并发（服务端主动关闭或客户端大量短连）。<\/li><li>处理：<\/li><\/ul>\n<pre><code>net.ipv4.tcp_tw_reuse = 1      # 出方向复用（3.6+ 安全）\nnet.ipv4.tcp_fin_timeout = 30  # 缩短 TIME_WAIT\nnet.ipv4.tcp_max_tw_buckets   # 上限<\/code><\/pre>\n<ul><li>根本方案：<strong>连接池/HTTP keep-alive 复用连接<\/strong>，从源头减少建连。<\/li><li>注意：<code>tcp_tw_recycle<\/code> 已废弃（NAT 环境会导致丢包），勿用。<\/li><\/ul>"}, {"q": "14.5 文件删了但磁盘空间不释放？", "tag": "", "body": "<ul><li>原因：进程仍持有已删除文件的 fd。<\/li><li>排查：<code>lsof | grep deleted<\/code> → 找到 PID 与文件大小。<\/li><li>处置：能重启就重启；不能重启可 <code>> /proc/PID/fd/N<\/code> 清空（注意 N 是 fd 号）。<\/li><li>预防：日志服务正确轮转、应用打开文件后及时 close。<\/li><\/ul>"}, {"q": "14.6 僵尸进程怎么清理？", "tag": "", "body": "<ul><li><code>ps -eo stat,pid,ppid,cmd | grep ^Z<\/code> 定位。<\/li><li>处置：<code>kill -SIGCHLD 父PID<\/code> 提示父进程收尸；杀父进程（若可）由 init 收养回收；根治需修代码 <code>wait()<\/code>/<code>waitpid()<\/code>。<\/li><li>注：僵尸进程无法用 kill -9 杀死（已死），只能清父进程或父进程正确 wait。<\/li><\/ul>"}, {"q": "14.7 SSH 连接慢？", "tag": "", "body": "<ul><li>原因：DNS 反向解析（<code>UseDNS no<\/code>）、GSSAPI 认证（<code>GSSAPIAuthentication no<\/code>）、网络延迟、密码认证慢。<\/li><li>排查：<code>ssh -vvv user@host<\/code> 看卡在哪一步；<code>tail -f /var/log/secure<\/code>。<\/li><li>加固同时优化：<code>vim /etc/ssh/sshd_config<\/code> 设 <code>UseDNS no<\/code> + <code>GSSAPIAuthentication no<\/code> + 密钥认证，重启 sshd。<\/li><\/ul>"}, {"q": "14.8 端口被占用？", "tag": "", "body": "<ul><li><code>lsof -i :8080<\/code> 或 <code>ss -tlnp | grep 8080<\/code> → 拿到 PID。<\/li><li><code>ps -p PID -o pid,cmd<\/code> 确认是什么程序 → 决定 kill 或换端口。<\/li><li>排查 TIME_WAIT 大量占用端口的假象：<code>ss -ant state time-wait<\/code> 单独看。<\/li><\/ul>"}, {"q": "14.9 服务启动失败排查路径？", "tag": "", "body": "<ol><li><code>systemctl status 服务<\/code> 看报错与 ExitCode。<\/li><li><code>journalctl -u 服务 -n 100 --no-pager<\/code> 看最近日志。<\/li><li>二进制直接前台运行看输出：<code>/usr/bin/服务 -c 配置<\/code>。<\/li><li>常见原因：端口被占、配置语法错（<code>nginx -t<\/code>）、权限不足、依赖服务未起（数据库没连上）、内存不足。<\/li><li>验证配置：多数服务有 <code>-t<\/code>（测试）参数，先测后重启。<\/li><\/ol>"}, {"q": "14.10 系统整体变慢排查思路？", "tag": "", "body": "<pre><code>uptime        # load 是否高\nvmstat 1 5    # us/sy/wa、r/b、cs 上下文切换\nfree -h       # 内存 available\niostat -x 1   # 磁盘 %util/await\nss -ant       # 连接数、队列\ndmesg -T | tail   # 内核报错、OOM、软锁定<\/code><\/pre>\n<ul><li>结论分支：CPU 瓶颈（加核/优化代码）、IO 瓶颈（换 SSD/合并写）、内存瓶颈（加内存/减少进程）、网络瓶颈（带宽/连接数）、系统调用风暴（strace 定位）。<\/li><\/ul>"}, {"q": "14.11 找大文件 / 占空间排行？", "tag": "", "body": "<pre><code>du -h --max-depth=1 / | sort -rh | head -20\nfind / -xdev -type f -size +500M -exec ls -lh {} \\;\ndu -sh /var/log/* 2&gt;/dev/null | sort -rh | head\nfind . -name \"*.log\" -size +100M -exec ls -lh {} \\;<\/code><\/pre>\n<ul><li>配合 <code>df -h<\/code> 先锁定分区，再往下钻，避免全盘扫太慢。<\/li><\/ul>"}, {"q": "14.12 应用连接数据库超时？", "tag": "", "body": "<ol><li><code>ping<\/code> 网络通不通、<code>telnet DB_IP 3306<\/code> 端口通不通。<\/li><li><code>ss -ant | grep 3306<\/code> 看连接建立情况、是否 SYN_SENT 堆积（防火墙丢包）。<\/li><li>数据库侧：<code>show processlist<\/code> 看连接数、<code>max_connections<\/code> 是否打满。<\/li><li>应用侧：连接池配置（初始/最大/超时）、是否 fd 耗尽。<\/li><li>防火墙/SELinux 是否拦截：临时 <code>setenforce 0<\/code> 验证、检查 iptables。<\/li><\/ol>\n<hr>"}]}, {"title": "15 常考概念辨析", "questions": [{"q": "15.1 软链接 vs 硬链接？", "tag": "", "body": "<p>见 2.3 表格。一句话：<strong>硬链接同一 inode 多名字，软链接是存路径的指针<\/strong>。<\/p>"}, {"q": "15.2 静态库 vs 动态库？", "tag": "", "body": "<ul><li>静态库（.a）：编译时打入可执行文件，独立部署但体积大、升级需重新编译。<\/li><li>动态库（.so）：运行时加载，多个进程共享一份、可单独升级（<code>ldd<\/code> 查看依赖、<code>LD_LIBRARY_PATH<\/code> 指定路径）。<\/li><li>经典故障：<code>error while loading shared libraries<\/code> → <code>ldconfig<\/code> 刷新缓存、<code>LD_LIBRARY_PATH<\/code>、或 <code>rpath<\/code>。<\/li><\/ul>"}, {"q": "15.3 阻塞/非阻塞 vs 同步/异步？", "tag": "", "body": "<ul><li><strong>阻塞/非阻塞<\/strong>：描述调用方在等待结果时是否挂起（read 是否立即返回）。<\/li><li><strong>同步/异步<\/strong>：描述结果由谁通知（调用方自己取 vs 内核主动通知）。<\/li><li>组合：同步阻塞（传统 read）、同步非阻塞（轮询）、异步阻塞（少见）、异步非阻塞（epoll + io_uring、AIO）。<\/li><\/ul>"}, {"q": "15.4 用户态 vs 内核态、系统调用？", "tag": "", "body": "<ul><li>内核态：有完整硬件访问权限；用户态：受限（通过系统调用进入内核）。<\/li><li>划分目的：<strong>安全隔离<\/strong>，防止用户程序破坏系统。<\/li><li>切换代价：涉及特权级切换、栈切换、上下文保存，<strong>频繁系统调用是性能杀手<\/strong>（所以有 epoll、sendfile、零拷贝优化）。<\/li><li>查看系统调用：strace；<code>/usr/include<\/code> 查看接口。<\/li><\/ul>"}, {"q": "15.5 中断 vs 异常 vs 系统调用？", "tag": "", "body": "<ul><li><strong>中断<\/strong>：外部硬件异步触发（网卡收包）。<\/li><li><strong>异常<\/strong>：CPU 执行指令时同步触发（缺页、除零）。<\/li><li><strong>系统调用<\/strong>：用户程序主动请求内核服务（int 0x80 / syscall 指令）。<\/li><li>共同点：都要切换到内核态处理。<\/li><\/ul>"}, {"q": "15.6 buffer vs cache？", "tag": "", "body": "<ul><li>buffer：块设备缓冲（写合并）；cache：文件页缓存（读加速）；现代内核统一为 page cache 管理。<\/li><li>追问见 4.5：判断内存看 <code>available<\/code> 而非 <code>free<\/code>。<\/li><\/ul>"}, {"q": "15.7 进程 vs 线程 vs 协程？", "tag": "", "body": "<table><thead><tr><th>维度<\/th><th>进程<\/th><th>线程<\/th><th>协程<\/th><\/tr><\/thead><tbody><tr><td>调度者<\/td><td>内核<\/td><td>内核<\/td><td>用户态自己<\/td><\/tr><tr><td>切换开销<\/td><td>大（页表/上下文）<\/td><td>中<\/td><td>极小（函数级）<\/td><\/tr><tr><td>共享<\/td><td>不共享<\/td><td>共享进程资源<\/td><td>共享线程栈外的变量<\/td><\/tr><tr><td>适用<\/td><td>隔离要求高<\/td><td>计算密集/并行<\/td><td>IO 密集高并发（如 Go goroutine）<\/td><\/tr><\/tbody><\/table>\n<ul><li>追问：协程为什么快？——用户态调度，无内核陷阱，切换只换寄存器上下文；单线程内跑成千上万协程。<\/li><\/ul>\n<hr>\n<blockquote>面试心法：Linux 八股背结论（命令、参数、原理一句话），但<strong>高分全靠场景题<\/strong>——把 14 章的排查思路背成自己的\"肌肉记忆\"，追问时能\"先确认现象 → 再给命令 → 再给处置\"三层递进回答。<\/blockquote>"}]}], "qcount": 93}]}, {"id": "tomcat", "name": "Tomcat", "icon": "🐱", "color": "#a855f7", "docs": [{"sub": "题库深度版", "chapters": [{"title": "01 基础认知与架构", "questions": [{"q": "1.1 Tomcat 是什么？和 Web 服务器、Servlet 容器的关系是什么？", "tag": "高频", "body": "<p><strong>Tomcat<\/strong> 是 Apache 基金会下的开源项目，是一个 <strong>Servlet 容器（Servlet Container）<\/strong> + <strong>HTTP 服务器<\/strong>。它实现了 Java EE（现 Jakarta EE）的 Servlet 规范、JSP 规范、EL 规范和 WebSocket 规范。<\/p>\n<p>三者关系：<\/p>\n<ul><li><strong>Web 服务器<\/strong>：只负责处理静态资源 + HTTP 协议（如 Nginx、Apache）。<\/li><li><strong>Servlet 容器<\/strong>：负责管理 Servlet 生命周期、请求分发、Session、类加载等，是 Web 服务器能力的\"Java 化\"扩展。<\/li><li><strong>Tomcat = 两者合一<\/strong>：既能处理静态资源，又能运行动态 Servlet/JSP 应用。<\/li><\/ul>\n<blockquote>加分点：Tomcat 不是完整 Java EE 服务器——它<strong>不包含 EJB、JTA、JMS<\/strong> 等企业级组件。需要时配 GlassFish / WildFly 或把 EJB 替换为 Spring。<\/blockquote>"}, {"q": "1.2 Tomcat 的整体架构：Coyote + Catalina 分别是什么？", "tag": "高频", "body": "<p>Tomcat 由两大部分组成：<\/p>\n<table><thead><tr><th>组件<\/th><th>职责<\/th><th>本质<\/th><\/tr><\/thead><tbody><tr><td><strong>Coyote<\/strong><\/td><td>连接器框架，负责 HTTP/AJP 协议解析、Socket 管理<\/td><td>与协议打交道，不关心业务<\/td><\/tr><tr><td><strong>Catalina<\/strong><\/td><td>Servlet 容器，负责 Servlet 生命周期、请求路由、Session<\/td><td>与业务规范打交道<\/td><\/tr><\/tbody><\/table>\n<ul><li>Coyote 处理完协议后，把 Request/Response 交给 <strong>CoyoteAdapter<\/strong> 适配成 HttpServletRequest/Response，再进入 Catalina。<\/li><li>二者通过 <strong>Connector<\/strong>（连接器）衔接。<\/li><\/ul>\n<blockquote>加分点：这种\"协议层与容器层解耦\"的设计让 Tomcat 能灵活切换协议——HTTP/1.1、HTTP/2、AJP 甚至自定义协议，而 Catalina 完全无感。<\/blockquote>"}, {"q": "1.3 server.xml 的核心组件层级：Server / Service / Connector / Engine / Host / Context", "tag": "高频", "body": "<p>server.xml 是一个<strong>树形结构<\/strong>，层级如下：<\/p>\n<pre><code>Server（整个 Tomcat 实例，监听 8005 shutdown 端口）\n └── Service（逻辑服务分组，可多个）\n      ├── Connector（连接器：8080 HTTP、8009 AJP）\n      └── Engine（引擎，处理该 Service 的所有请求）\n           └── Host（虚拟主机：localhost，对应域名）\n                └── Context（Web 应用上下文，对应一个 webapp）\n                     └── Wrapper（Servlet 包装器，一个 Servlet 一个 Wrapper）<\/code><\/pre>\n<ul><li><strong>Server<\/strong>：最顶层，负责管理全局资源、生命周期，通过 shutdown 端口接收关闭指令。<\/li><li><strong>Service<\/strong>：由 1+ 个 Connector 和 1 个 Engine 组成，Connector 接收的请求都交给这个 Engine。<\/li><li><strong>Engine<\/strong>：请求处理入口，做虚拟主机路由。<\/li><li><strong>Host<\/strong>：虚拟主机，按 Host 请求头匹配，对应域名和 appBase 目录。<\/li><li><strong>Context<\/strong>：一个 Web 应用，对应 <code>webapps/xxx<\/code> 目录或一个 war 包。<\/li><li><strong>Wrapper<\/strong>：每个 Servlet 一个，管理 Servlet 实例。<\/li><\/ul>\n<blockquote>追问：请求进来是怎么定位到 Context 的？→ 由 <strong>Mapper<\/strong> 组件根据 URL + Host 头做匹配，见 4.3 题。<\/blockquote>"}, {"q": "1.4 一次请求在容器中的完整\"旅程\"分哪几步？", "tag": "高频", "body": "<ol><li>客户端发起 HTTP 请求到 8080 端口。<\/li><li><strong>Connector<\/strong> 的 Acceptor 线程 accept 连接。<\/li><li>Poller 检测到可读事件，把任务交给工作线程。<\/li><li><strong>Http11Processor<\/strong> 解析请求行/请求头/请求体，生成 Request/Response 对象。<\/li><li><strong>CoyoteAdapter.service()<\/strong> 把 Coyote 的 Request/Response 转换为 Servlet 规范的 Request/Response。<\/li><li><strong>Engine → Host → Context → Wrapper<\/strong> 逐级 Pipeline/Valve 处理。<\/li><li>Mapper 定位到具体的 Servlet。<\/li><li>执行 <strong>Filter 链<\/strong>，最后调用 <strong>Servlet.service()<\/strong>。<\/li><li>响应逆序返回，连接按 keep-alive 策略复用或关闭。<\/li><\/ol>\n<blockquote>加分点：第 2~4 步属于 <strong>Coyote 层<\/strong>，第 6~8 步属于 <strong>Catalina 层<\/strong>，面试时分层描述会显得体系清晰。<\/blockquote>"}, {"q": "1.5 Tomcat 与 Jetty、Undertow 的对比", "tag": "进阶", "body": "<table><thead><tr><th>维度<\/th><th>Tomcat<\/th><th>Jetty<\/th><th>Undertow<\/th><\/tr><\/thead><tbody><tr><td>重量级<\/td><td>较重，功能全<\/td><td>轻量，可裁剪<\/td><td>最轻量，性能极致<\/td><\/tr><tr><td>Servlet 规范<\/td><td>最权威的参考实现<\/td><td>支持较新<\/td><td>支持较新<\/td><\/tr><tr><td>默认 IO<\/td><td>NIO<\/td><td>NIO<\/td><td>NIO（XNIO）<\/td><\/tr><tr><td>内存占用<\/td><td>较大<\/td><td>中等<\/td><td>最小<\/td><\/tr><tr><td>典型场景<\/td><td>企业级传统应用<\/td><td>嵌入式/微服务<\/td><td>高并发微服务<\/td><\/tr><\/tbody><\/table>\n<ul><li>Spring Boot 默认内嵌 <strong>Tomcat<\/strong>，可一键切换为 Jetty/Undertow。<\/li><li>Undertow 在极限压测下吞吐常优于 Tomcat，但 Tomcat 生态和兼容性最稳。<\/li><\/ul>\n<blockquote>加分点：Spring Boot 2.x 默认 Tomcat 9（Servlet 4.0），Spring Boot 3.x 默认 Tomcat 10.1（Servlet 6.0 / jakarta）。<\/blockquote>\n<hr>"}]}, {"title": "02 生命周期与启动流程", "questions": [{"q": "2.1 Tomcat 的启动流程（Bootstrap → Catalina → 容器）", "tag": "高频", "body": "<ol><li>入口脚本 <code>startup.sh<\/code> → 执行 <code>org.apache.catalina.startup.Bootstrap#main<\/code>。<\/li><li>Bootstrap 创建 <strong>Catalina<\/strong> 实例，通过反射加载（类加载器初始化）。<\/li><li>Catalina 解析 <strong>server.xml<\/strong>（Digester 解析成对象树）。<\/li><li>触发 Server 的 <code>init()<\/code> → 层层向下初始化 Service → Engine → Host → Context（<strong>自上而下 init<\/strong>）。<\/li><li>再触发 <code>start()<\/code>（<strong>同样自上而下 start<\/strong>）。<\/li><li>等待请求；JVM 注册 shutdown hook 用于优雅停机。<\/li><\/ol>\n<blockquote>加分点：整个容器实现统一的 <strong>Lifecycle 接口<\/strong>（见 2.2），所以 init/start/stop/destroy 的顺序天然一致——先父后子初始化，先子后父销毁。<\/blockquote>"}, {"q": "2.2 Lifecycle 接口与状态机", "tag": "进阶", "body": "<p>Tomcat 所有核心组件都实现 <code>org.apache.catalina.Lifecycle<\/code>：<\/p>\n<ul><li>核心方法：<code>init()<\/code> → <code>start()<\/code> → <code>stop()<\/code> → <code>destroy()<\/code>。<\/li><li>状态机：NEW → INITIALIZING → INITIALIZED → STARTING_PREP → STARTING → STARTED → STOPPING_PREP → STOPPING → STOPPED → DESTROYING → DESTROYED → FAILED。<\/li><li>状态变更会广播 <strong>LifecycleEvent<\/strong>，组件通过实现 <code>LifecycleListener<\/code> 监听并做出响应（如 Context 启动后触发 Web 应用部署）。<\/li><\/ul>\n<blockquote>加分点：启动失败时状态会进入 FAILED 并抛出 LifecycleException，这是\"为什么 Tomcat 启动报错时能看到一大串 Caused by\"的原因——每层组件都在 init/start 上包了异常。<\/blockquote>"}, {"q": "2.3 Digester 如何把 server.xml 变成对象？", "tag": "进阶", "body": "<ul><li>Tomcat 使用 Apache Commons <strong>Digester<\/strong> 解析 server.xml。<\/li><li>规则（rule）定义在 <code>conf/server.xml<\/code> 旁边的 <code>catalina<\/code> 的 digester 规则中，如 <code>addObjectCreate(\"Server\", \"org.apache.catalina.core.StandardServer\")<\/code>。<\/li><li>每遇到一个元素就创建对应对象、调用 setter、按父子关系组装。<\/li><li>好处：<strong>无需手工写解析代码<\/strong>，新增配置元素只需加规则。<\/li><\/ul>\n<blockquote>追问：为什么不用 JAXB？→ 历史原因 + Digester 对\"多个同名元素按不同规则处理\"更灵活；现代版本内部逻辑依然沿用该设计。<\/blockquote>"}, {"q": "2.4 Tomcat 9 / 10 / 10.1 的区别与 jakarta 迁移", "tag": "高频", "body": "<table><thead><tr><th>版本<\/th><th>Servlet 规范<\/th><th>关键变化<\/th><\/tr><\/thead><tbody><tr><td>Tomcat 8.5<\/td><td>Servlet 3.1<\/td><td>默认 NIO，移除 BIO（9.0 正式移除）<\/td><\/tr><tr><td>Tomcat 9.0<\/td><td>Servlet 4.0<\/td><td>支持 HTTP/2，支持 WebSocket 1.1<\/td><\/tr><tr><td>Tomcat 10.0<\/td><td>Servlet 5.0<\/td><td><strong>javax.servlet → jakarta.servlet<\/strong> 命名空间迁移<\/td><\/tr><tr><td>Tomcat 10.1<\/td><td>Servlet 6.0<\/td><td>要求 Java 11+，Spring Boot 3 内置<\/td><\/tr><\/tbody><\/table>\n<ul><li>Tomcat 10 起不再兼容旧 <code>javax.*<\/code> 包名，老项目迁移需全局替换 import 或使用迁移工具。<\/li><li>Spring Boot 3.x 必须用 Tomcat 10.1+，因为已全面切换到 jakarta。<\/li><\/ul>\n<blockquote>加分点：<code>javax.servlet<\/code> 属于 Java EE（Oracle 维护），<code>jakarta.servlet<\/code> 属于 Jakarta EE（Eclipse 基金会维护）。Oracle 收回 javax 命名空间后，整个 Java EE 生态迁往 jakarta。<\/blockquote>"}, {"q": "2.5 Spring Boot 内嵌 Tomcat 与独立 Tomcat 部署的区别", "tag": "高频", "body": "<table><thead><tr><th>维度<\/th><th>独立 Tomcat<\/th><th>内嵌 Tomcat（Spring Boot）<\/th><\/tr><\/thead><tbody><tr><td>部署物<\/td><td>war 包丢 webapps<\/td><td>可执行 fat jar<\/td><\/tr><tr><td>启动<\/td><td>启动脚本<\/td><td>java -jar<\/td><\/tr><tr><td>类加载器<\/td><td>独立 WebappClassLoader<\/td><td>单一应用类加载器<\/td><\/tr><tr><td>配置<\/td><td>server.xml / web.xml<\/td><td>application.yml（server.xxx）<\/td><\/tr><tr><td>运维<\/td><td>独立进程管理<\/td><td>进程即应用，便于容器化<\/td><\/tr><\/tbody><\/table>\n<ul><li>Spring Boot 内嵌 Tomcat 时，<code>TomcatServletWebServerFactory<\/code> 以编程方式创建 Connector/Context。<\/li><li>war 包方式部署时，需实现 <code>SpringBootServletInitializer<\/code>，由外部 Tomcat 启动。<\/li><\/ul>\n<blockquote>加分点：内嵌模式没有标准 WebappClassLoader 的多应用隔离，所以一个 JVM 只能跑一个应用——这也是微服务\"一个进程一个应用\"的天然基础。<\/blockquote>\n<hr>"}]}, {"title": "03 Connector 与线程模型", "questions": [{"q": "3.1 四种 I/O 模型：BIO / NIO / NIO2 / APR", "tag": "高频", "body": "<p>Tomcat Connector 支持四种协议处理器（protocol）：<\/p>\n<table><thead><tr><th>协议<\/th><th>全称<\/th><th>特点<\/th><th>状态<\/th><\/tr><\/thead><tbody><tr><td>BIO<\/td><td>Blocking IO<\/td><td>一个连接一个线程，高并发下线程爆炸<\/td><td>8.5 废弃，9.0 移除<\/td><\/tr><tr><td>NIO<\/td><td>Non-blocking IO<\/td><td>多路复用，Poller 轮询，默认<\/td><td><strong>8.5+ 默认<\/strong><\/td><\/tr><tr><td>NIO2<\/td><td>Async IO<\/td><td>AIO 回调模型，Windows 上支持较好<\/td><td>可选（非默认）<\/td><\/tr><tr><td>APR<\/td><td>Apache Portable Runtime<\/td><td>基于 C 原生库（tcnative），sendfile/SSL 加速<\/td><td>需装 native 库<\/td><\/tr><\/tbody><\/table>\n<ul><li>8.5 之前默认 BIO（每连接一线程），8.5 起默认 NIO。<\/li><li>配置方式：<code>protocol=\"org.apache.coyote.http11.Http11NioProtocol\"<\/code> 或简写 <code>protocol=\"HTTP/1.1\"<\/code>。<\/li><\/ul>\n<blockquote>加分点：NIO 之所以成为主流，是因为<strong>连接数可以远大于线程数<\/strong>——线程只在线程池内复用，连接由 Poller 统一监听就绪事件。<\/blockquote>"}, {"q": "3.2 NIO 的 Acceptor / Poller / Worker 三线程模型详解", "tag": "高频", "body": "<p>这是 Tomcat 面试的<strong>必考源码点<\/strong>。NioEndpoint 内部有三类线程：<\/p>\n<pre><code>Acceptor（默认1个）  accept 新连接\n      │  注册 SocketChannel\n      ▼\nPoller（默认2个）    Selector 多路复用，监听 OP_READ/OP_WRITE\n      │  就绪事件 → 包装成 SocketProcessor\n      ▼\nWorker（线程池）    Http11Processor 解析请求并调用 Servlet<\/code><\/pre>\n<ol><li><strong>Acceptor<\/strong>：一个循环线程，<code>ServerSocketChannel.accept()<\/code> 接收新 TCP 连接，把 SocketChannel 注册进 Poller 的事件队列（PollerEvent）。<\/li><li><strong>Poller<\/strong>：每个 Poller 持有一个 Selector，<code>select(1000)<\/code> 轮询就绪事件，把可读/可写的 Socket 包装成 <code>SocketProcessor<\/code> 提交给 Worker 线程池。<\/li><li><strong>Worker<\/strong>：线程池中的线程执行 SocketProcessor.run()，即走 Http11Processor 解析请求 → 容器处理 → 写响应。<\/li><\/ol>\n<blockquote>加分点：<strong>Acceptor 只负责 accept，Poller 只负责\"监听就绪\"，真正的协议解析和业务都在 Worker 线程池<\/strong>。三者通过无锁队列/并发队列解耦，这是 Tomcat 支撑高并发的核心设计。<\/blockquote>"}, {"q": "3.3 maxThreads / maxConnections / acceptCount 三者的区别", "tag": "高频", "body": "<p>这是最容易混淆的一组参数：<\/p>\n<table><thead><tr><th>参数<\/th><th>默认值<\/th><th>含义<\/th><th>超限表现<\/th><\/tr><\/thead><tbody><tr><td><code>maxThreads<\/code><\/td><td>200<\/td><td>工作线程池最大线程数<\/td><td>线程耗尽 → 任务排队<\/td><\/tr><tr><td><code>maxConnections<\/code><\/td><td>8192（NIO）<\/td><td>连接器同时接受的最大连接数<\/td><td>新连接进 accept 队列等待<\/td><\/tr><tr><td><code>acceptCount<\/code><\/td><td>100<\/td><td>OS 层 accept 队列（backlog）长度<\/td><td>队列满 → 拒绝连接（Connection refused）<\/td><\/tr><\/tbody><\/table>\n<ul><li><strong>maxConnections 是\"连接\"层面的闸门，maxThreads 是\"处理\"层面的闸门<\/strong>。连接数可以远大于线程数（NIO 下连接不占线程）。<\/li><li>请求流程：连接数 < maxConnections 直接接受；≥ maxConnections 时新连接排入 acceptCount 队列；队列满后内核拒绝。<\/li><\/ul>\n<blockquote>追问：BIO 下三者关系？→ BIO 一个连接占一个线程，所以 maxConnections 实际受 maxThreads 限制，这也是 BIO 必须被淘汰的原因。<\/blockquote>"}, {"q": "3.4 Tomcat 为什么不用 JDK 自带 ThreadPoolExecutor？", "tag": "进阶", "body": "<p>Tomcat 自己实现了 <code>org.apache.tomcat.util.threads.ThreadPoolExecutor<\/code>，核心区别在<strong>任务队列<\/strong>：<\/p>\n<ul><li>JDK 默认策略：core 线程满 → <strong>先入队<\/strong>（无界/有界队列）→ 队列满才扩线程。Web 场景下会导致<strong>排队延迟被放大<\/strong>。<\/li><li>Tomcat 的 <code>TaskQueue<\/code>（继承 LinkedBlockingQueue）重写了 <code>offer()<\/code>：<\/li><li>当前线程数 < maxThreads 时 → <strong>返回 false，强制线程池新建线程<\/strong>；<\/li><li>线程数达到 maxThreads 后 → 才真正入队等待。<\/li><li>效果：<strong>先用满线程，再排队<\/strong>。这是 Tomcat 为了降低请求延迟的刻意设计。<\/li><\/ul>\n<blockquote>加分点：如果线程池满且队列满，会抛 RejectedExecutionException，Tomcat 对连接返回 503 并断开——压测时看到大量 503，先查这三个参数。<\/blockquote>"}, {"q": "3.5 keep-alive 的原理与参数", "tag": "高频", "body": "<p>HTTP keep-alive 让<strong>同一个 TCP 连接复用处理多个请求<\/strong>，避免反复三次握手/慢启动。<\/p>\n<p>关键参数：<\/p>\n<ul><li><code>keepAliveTimeout<\/code>：空闲连接多久关闭，默认等于 connectionTimeout（8.5+ 默认 60s）。<\/li><li><code>maxKeepAliveRequests<\/code>：一个连接最多处理多少个请求后关闭，默认 100（HTTP/1.1）。<\/li><li><code>connectionTimeout<\/code>：建立连接后等待首个请求的时间，默认 60s。<\/li><\/ul>\n<blockquote>加分点：keep-alive 能显著提升 HTTPS 性能（省去 TLS 握手）；但<strong>长连接会占用连接数上限<\/strong>，maxConnections 需要相应调大。大量 keep-alive 空闲连接被 NIO 的 Poller 挂起（不占线程），这也是 NIO 能扛高连接数的原因。<\/blockquote>"}, {"q": "3.6 NIO 与 BIO 在\"一个请求一个线程\"上的本质差异", "tag": "进阶", "body": "<ul><li>BIO：Socket 阻塞读 → 每 accept 一个连接就必须分配一个线程 → 10000 连接 = 10000 线程，线程切换开销 + 栈内存爆炸（默认线程栈 1MB，10000 线程 ≈ 10GB 虚拟内存）。<\/li><li>NIO：连接不阻塞线程，只有\"数据就绪\"的 Socket 才被提交给线程池 → <strong>10000 连接 ≈ 几十个线程<\/strong>。<\/li><\/ul>\n<blockquote>追问：那 NIO 下为什么还会线程打满？→ 线程打满说明<strong>同时就绪且处理中的请求太多<\/strong>，即业务处理太慢（慢 SQL、外部调用阻塞），而不是连接太多。排查方向完全不同。<\/blockquote>"}, {"q": "3.7 NIO2（AIO）与 NIO 的区别，为什么 Tomcat 默认不用 NIO2？", "tag": "进阶", "body": "<ul><li>NIO2 基于操作系统异步 IO 回调：发起读后线程立即返回，内核完成后再回调。<\/li><li>优势：读写阶段也不占用线程。<\/li><li>劣势：Linux 上 AIO 实现（io_uring 之前）表现不稳定，JDK 的 AIO 在 Linux 下常退化为阻塞模拟；API 复杂。<\/li><li>Tomcat 默认 NIO 的原因：<strong>NIO 的多路复用已经足够高效<\/strong>（就绪事件驱动的阻塞读只占线程极短时间），且生态最成熟。<\/li><\/ul>\n<blockquote>加分点：现代高并发服务端（如 Netty）同样默认 NIO 多路复用而非 AIO，原因一致。<\/blockquote>"}, {"q": "3.8 Connector 常用属性总览", "tag": "基础", "body": "<pre><code class=\"lang-xml\">&lt;Connector port=\"8080\"\n           protocol=\"org.apache.coyote.http11.Http11NioProtocol\"\n           connectionTimeout=\"30000\"\n           maxThreads=\"400\"\n           minSpareThreads=\"40\"\n           maxConnections=\"10000\"\n           acceptCount=\"200\"\n           keepAliveTimeout=\"15000\"\n           maxKeepAliveRequests=\"100\"\n           maxHttpHeaderSize=\"8192\"\n           compression=\"on\"\n           compressionMinSize=\"2048\"\n           URIEncoding=\"UTF-8\"/&gt;<\/code><\/pre>\n<ul><li><code>minSpareThreads<\/code>：核心线程数（默认 10）。<\/li><li><code>maxHttpHeaderSize<\/code>：请求头上限 8KB，防止恶意超大请求头。<\/li><li><code>compression<\/code>：响应压缩（gzip），CPU 换带宽。<\/li><\/ul>\n<blockquote>加分点：配置 Connector 时记住\"<strong>连接参数（maxConnections/acceptCount/connectionTimeout）与线程参数（maxThreads/minSpareThreads）分开调<\/strong>\"的思维模型，面试回答更有层次。<\/blockquote>\n<hr>"}]}, {"title": "04 HTTP 请求处理完整流程", "questions": [{"q": "4.1 从 Socket 到 Servlet 的完整源码级链路", "tag": "高频", "body": "<pre><code>SocketChannel (OS)\n  → Acceptor.accept()                       // NioEndpoint\n  → PollerEvent 入队 → Poller.select()      // 多路复用\n  → SocketProcessor.run() → 提交 Worker 线程池\n  → Http11Processor.service()               // Coyote: 协议解析\n  → Http11InputBuffer 解析请求行/头/体\n  → CoyoteAdapter.service(request, response)// 适配 Servlet API\n  → Mapper.map()                            // 路由定位\n  → Engine.pipeline → Host.pipeline → Context.pipeline → Wrapper.pipeline\n  → ApplicationFilterChain.doFilter()       // Filter 链\n  → Servlet.service() → 业务代码\n  → 响应逆序写回 → NioSocketWrapper 注册 OP_WRITE → 完成<\/code><\/pre>\n<blockquote>加分点：面试能一口气说出这条链上每个环节的类名（Acceptor、Poller、Http11Processor、CoyoteAdapter、Mapper、Pipeline、ApplicationFilterChain），是\"真看过源码\"的最有力证明。<\/blockquote>"}, {"q": "4.2 Http11Processor 是如何解析 HTTP 请求的？", "tag": "进阶", "body": "<ul><li>复用 <code>Http11InputBuffer<\/code>，通过 <strong><code>HttpParser<\/code><\/strong> 逐个字符解析：请求行（方法+URI+版本）→ 请求头（到 <code>\\r\\n\\r\\n<\/code>）→ 请求体（按 Content-Length 或 chunked 编码）。<\/li><li>解析完请求头后立即回调 <code>prepareRequest()<\/code> 填充 Request 对象；请求体<strong>懒加载<\/strong>（需要时才读取）。<\/li><li>解析失败（如 400 非法请求行）直接返回错误并关闭连接。<\/li><li><code>maxHttpHeaderSize<\/code> 超限 → 431/400。<\/li><li>解析采用<strong>直接操作字节数组<\/strong>的方式，避免不必要的 String 转换，性能优化到极致。<\/li><\/ul>\n<blockquote>加分点：Header 解析是逐字节扫描冒号分隔，请求体支持 chunked 分块传输，都发生在进入 Servlet 之前——所以自定义 Filter 里读 body 时其实已经\"消费\"过一次了。<\/blockquote>"}, {"q": "4.3 Mapper 路由：如何根据 URL 定位到 Servlet？", "tag": "高频", "body": "<p>Mapper 是 Tomcat 的高性能路由组件：<\/p>\n<ol><li>根据 <strong>Host 请求头<\/strong> 匹配虚拟主机（MappedHost）。<\/li><li>解析 URI 的 <strong>Context Path<\/strong> 前缀匹配 Web 应用。<\/li><li>在 Context 内按规则匹配 Wrapper（Servlet 映射）：<\/li><\/ol>\n<ul><li><strong>精确匹配<\/strong> <code>/login<\/code>；<\/li><li><strong>最长路径前缀<\/strong> <code>/user/*<\/code>；<\/li><li><strong>扩展名匹配<\/strong> <code>*.do<\/code>；<\/li><li><strong>默认 Servlet<\/strong> <code>/<\/code>（兜底）。<\/li><\/ul>\n<ol><li>匹配过程使用<strong>排序数组 + 二分查找<\/strong>（不是 Map 遍历），O(logN) 级别。<\/li><\/ol>\n<blockquote>追问：找不到匹配时怎么办？→ 走默认 Servlet（DefaultServlet 返回 404）；若连默认都没有则 404。Context 未部署则 404。<\/blockquote>"}, {"q": "4.4 Pipeline / Valve 责任链模式", "tag": "进阶", "body": "<ul><li>每个容器（Engine/Host/Context/Wrapper）内部有一条 <strong>Pipeline<\/strong>（管道），管道上有多个 <strong>Valve<\/strong>（阀门）。<\/li><li>请求按 <code>Engine Valve → Host Valve → Context Valve → Wrapper Valve → 目标 Servlet<\/code> 依次经过。<\/li><li>核心 Valve：<\/li><li><strong>AccessLogValve<\/strong>：访问日志。<\/li><li><strong>ErrorReportValve<\/strong>：错误页。<\/li><li><strong>RemoteAddrValve / RemoteHostValve<\/strong>：IP 访问控制。<\/li><li><strong>StandardWrapperValve<\/strong>：真正加载并调用 Servlet 的阀门。<\/li><li>每个 Valve 执行后可以决定 <code>continue<\/code> 或中断（比如拒绝访问直接返回）。<\/li><\/ul>\n<blockquote>加分点：Valve 是<strong>容器级<\/strong>的拦截，Filter 是<strong>应用级<\/strong>的拦截——Valve 在 Filter 之前执行，且不依赖 Servlet 规范，可做容器层的鉴权/限流。<\/blockquote>"}, {"q": "4.5 Filter 的执行时机与责任链细节", "tag": "高频", "body": "<ul><li>Filter 在 Servlet 之前执行，按 <strong>web.xml 声明顺序<\/strong>（或 <code>@WebFilter<\/code> + FilterRegistrationBean 顺序）组成链。<\/li><li>每个 Filter 调用 <code>chain.doFilter()<\/code> 放行，否则中断（可做鉴权短路）。<\/li><li>Filter 可以<strong>包装 request/response<\/strong>（如 <code>HttpServletRequestWrapper<\/code> 实现 body 缓存、XSS 过滤）。<\/li><li>生命周期：<code>init()<\/code>（应用启动）→ 每次请求 <code>doFilter()<\/code> → 应用卸载 <code>destroy()<\/code>。<\/li><\/ul>\n<blockquote>加分点：Filter 的典型用途：日志、鉴权、编码设置、GZIP、XSS/SQL 注入过滤、请求日志。它与 Spring MVC 的 Interceptor 的区别：Filter 在 Servlet 容器层（Servlet 之前），Interceptor 在 Spring MVC 层（Handler 之前）。<\/blockquote>\n<hr>"}]}, {"title": "05 Catalina 容器体系", "questions": [{"q": "5.1 Engine / Host / Context / Wrapper 四级容器各自的职责", "tag": "高频", "body": "<table><thead><tr><th>容器<\/th><th>职责<\/th><th>典型配置<\/th><\/tr><\/thead><tbody><tr><td>Engine<\/td><td>请求总入口，路由到 Host<\/td><td>name=\"Catalina\"<\/td><\/tr><tr><td>Host<\/td><td>虚拟主机，按域名分流<\/td><td>name=\"localhost\" appBase=\"webapps\"<\/td><\/tr><tr><td>Context<\/td><td>Web 应用边界，类加载器/ Session 管理器/资源都在此<\/td><td>path=\"/app\" docBase=\"xxx\"<\/td><\/tr><tr><td>Wrapper<\/td><td>单个 Servlet 的包装，管理实例与映射<\/td><td>load-on-startup、asyncSupported<\/td><\/tr><\/tbody><\/table>\n<ul><li>一个请求只会经过<strong>一条<\/strong>确定的容器链：Engine → 某个 Host → 某个 Context → 某个 Wrapper。<\/li><li>每级容器都有自己独立的 Pipeline（见 4.4）。<\/li><\/ul>\n<blockquote>加分点：Context 是资源隔离的最小单元——<strong>每个 Context 有独立的 WebappClassLoader、SessionManager、ServletContext<\/strong>，这也是为什么两个应用部署在同一个 Tomcat 里互不干扰。<\/blockquote>"}, {"q": "5.2 Context 的配置方式与部署", "tag": "基础", "body": "<ul><li>目录式部署：<code>webapps/xxx/<\/code> 或 <code>webapps/xxx.war<\/code>（自动解压）。<\/li><li><code>conf/server.xml<\/code> 中显式 <code><Context path docBase><\/code>。<\/li><li><code>conf/Catalina/localhost/xxx.xml<\/code> 配置文件（推荐，热部署友好）。<\/li><li>参数：<code>autoDeploy=\"true\"<\/code>、<code>reloadable=\"true\"<\/code>（类变更自动重载）、<code>unpackWAR<\/code>、<code>sessionCookiePath<\/code>。<\/li><\/ul>\n<blockquote>加分点：生产环境<strong>不要<\/strong>开 reloadable（重载会触发类加载器重建，易造成内存泄漏与请求中断），用热部署工具（如 Spring Boot DevTools / 构建脚本）替代。<\/blockquote>"}, {"q": "5.3 Web 应用目录结构与 web.xml 的作用", "tag": "基础", "body": "<pre><code>webapp/\n├── WEB-INF/\n│   ├── web.xml          # 部署描述符（Servlet/Filter/Listener 声明）\n│   ├── classes/         # 编译后的 class\n│   └── lib/             # 应用依赖 jar\n├── META-INF/\n└── 静态资源（html/js/css/图片）<\/code><\/pre>\n<ul><li>Servlet 3.0+ 支持<strong>注解扫描<\/strong>（<code>@WebServlet<\/code>/<code>@WebFilter<\/code>/<code>@WebListener<\/code>），web.xml 可部分省略。<\/li><li><code>metadata-complete=\"true\"<\/code> 时跳过注解扫描，加速启动。<\/li><li>现代 Spring Boot 项目已基本不使用 web.xml，改用编程式注册。<\/li><\/ul>\n<blockquote>加分点：<code>WEB-INF<\/code> 下的文件<strong>对外不可直接访问<\/strong>，只能通过 Servlet 内部转发——这是安全边界。<\/blockquote>"}, {"q": "5.4 虚拟主机（Host）与多域名部署", "tag": "进阶", "body": "<ul><li>一个 Engine 下可配置多个 Host，通过请求的 Host 头区分。<\/li><li>例：<\/li><\/ul>\n<pre><code class=\"lang-xml\">&lt;Engine name=\"Catalina\" defaultHost=\"localhost\"&gt;\n  &lt;Host name=\"localhost\" appBase=\"webapps\"/&gt;\n  &lt;Host name=\"www.example.com\" appBase=\"webapps2\"/&gt;\n&lt;/Engine&gt;<\/code><\/pre>\n<ul><li>未匹配到任何 Host 时走 <code>defaultHost<\/code>。<\/li><li>配合 Nginx 时，通常由 Nginx 按 server_name 分流，Tomcat 只需一个 Host。<\/li><\/ul>\n<blockquote>加分点：Host 的 name 匹配发生在 <strong>Mapper 层<\/strong>，基于请求头而非 DNS——所以用 IP + Host 头也能命中指定虚拟主机（常用于压测时指定 Host 头）。<\/blockquote>"}, {"q": "5.5 StandardEngine / StandardHost 等核心实现类", "tag": "进阶", "body": "<ul><li><code>StandardServer<\/code> → <code>StandardService<\/code> → <code>StandardEngine<\/code> → <code>StandardHost<\/code> → <code>StandardContext<\/code> → <code>StandardWrapper<\/code>。<\/li><li>每个容器都有对应 Manager：Context 有 <code>Manager<\/code>（Session 管理）、<code>Loader<\/code>（类加载）、<code>Resources<\/code>（静态资源）、<code>Realm<\/code>（认证）。<\/li><\/ul>\n<blockquote>加分点：看到\"Standard\"前缀的类基本就是 Tomcat 对规范接口的标准实现；面试提到 <code>StandardContext<\/code> 的 reloadable 重载原理、<code>StandardWrapperValve<\/code> 的 Servlet 实例化逻辑，都能体现源码功底。<\/blockquote>\n<hr>"}]}, {"title": "06 Servlet 生命周期与线程安全", "questions": [{"q": "6.1 Servlet 的生命周期：init / service / destroy", "tag": "高频", "body": "<pre><code>加载 → 实例化（构造）→ init() → 处理请求 service() ×N → destroy() → 卸载<\/code><\/pre>\n<ul><li><strong>init()<\/strong>：只调用一次。首次请求时触发，或 <code>load-on-startup<\/code> 指定启动时加载。可读取配置、初始化连接池。<\/li><li><strong>service()<\/strong>：每次请求调用。按方法分发到 <code>doGet/doPost/doPut/doDelete<\/code>。<\/li><li><strong>destroy()<\/strong>：容器关闭/应用卸载时调用一次，释放资源。<\/li><li>一个 Servlet 默认<strong>只有一个实例<\/strong>（单例多线程模型）。<\/li><\/ul>\n<blockquote>追问：为什么 Servlet 是单例？→ Servlet 规范规定容器为每个 Servlet 只维护一个实例以节省内存，多线程并发调用 service()，所以 Servlet 默认<strong>线程不安全<\/strong>，实例字段要慎用。<\/blockquote>"}, {"q": "6.2 load-on-startup 的作用", "tag": "基础", "body": "<ul><li>web.xml：<code><load-on-startup>1<\/load-on-startup><\/code>。<\/li><li>正数：启动时按数值<strong>从小到大<\/strong>依次初始化；负数或不配置：首次访问时才初始化。<\/li><li>用途：启动时预加载重量级 Servlet（如初始化数据、连接池）。<\/li><\/ul>\n<blockquote>加分点：Spring MVC 的 DispatcherServlet 配置 load-on-startup=1，就是为了让 Spring 容器在启动阶段就初始化完毕。<\/blockquote>"}, {"q": "6.3 Servlet 线程安全问题如何解决？", "tag": "高频", "body": "<p>Servlet 单例 + 多线程并发调用，出现线程安全问题的根源是<strong>实例字段<\/strong>（成员变量）。<\/p>\n<p>解决方式：<\/p>\n<ol><li><strong>不要用可变实例字段<\/strong>——局部变量是线程安全的。<\/li><li>必须共享状态时用 <strong>ThreadLocal<\/strong>（注意 remove 防泄漏）或原子类。<\/li><li>用锁/同步块（降低并发度，慎用）。<\/li><li>把状态放到 Session/Request 作用域（本身按用户隔离）。<\/li><\/ol>\n<blockquote>加分点：典型面试陷阱——\"Servlet 是线程安全的吗？\"答案：<strong>Servlet 本身线程安全（容器保证实例唯一且方法调用不共享），但业务代码若用了共享可变状态则不安全<\/strong>。<\/blockquote>"}, {"q": "6.4 三大作用域：request / session / application", "tag": "基础", "body": "<table><thead><tr><th>作用域<\/th><th>存活时间<\/th><th>实现<\/th><th>典型用途<\/th><\/tr><\/thead><tbody><tr><td>request<\/td><td>一次请求<\/td><td>HttpServletRequest<\/td><td>请求内传递参数<\/td><\/tr><tr><td>session<\/td><td>一个会话<\/td><td>HttpSession<\/td><td>登录态、购物车<\/td><\/tr><tr><td>application<\/td><td>应用生命周期<\/td><td>ServletContext<\/td><td>全局配置、缓存<\/td><\/tr><\/tbody><\/table>\n<ul><li>传递方向：request 可向上读 session/application；反之不行。<\/li><\/ul>\n<blockquote>加分点：Spring 的 Bean Scope（singleton/prototype/request/session）就是在这个体系上的扩展——Spring MVC 中 request/session 作用域 Bean 底层用 AOP 代理从当前请求中取。<\/blockquote>"}, {"q": "6.5 Servlet 3.0 异步处理（AsyncContext）", "tag": "进阶", "body": "<p>Servlet 3.0 引入异步处理，解决<strong>长耗时任务占用工作线程<\/strong>的问题：<\/p>\n<pre><code class=\"lang-java\">AsyncContext ctx = request.startAsync();\n// 释放当前请求线程，另开线程处理\nexecutor.execute(() -&gt; {\n    // 耗时业务\n    ctx.dispatch(\"/result\");  // 或直接 getResponse().getWriter().write(...)\n    ctx.complete();\n});<\/code><\/pre>\n<ul><li>配合 <code>asyncSupported=true<\/code>（注解或 web.xml）。<\/li><li>注意：<strong>不是给业务并发加速<\/strong>，而是让 Servlet 线程不被长任务占死，提高连接利用率。<\/li><\/ul>\n<blockquote>追问：和消息队列/异步框架的区别？→ AsyncContext 只是\"释放容器线程\"，真正的异步处理仍需要自己管理线程池；更现代的方案是用 Spring MVC 的 <code>@Async<\/code> + <code>Callable<\/code>/<code>DeferredResult<\/code>，或直接上响应式 WebFlux。<\/blockquote>"}, {"q": "6.6 Servlet 3.1 非阻塞 IO：ReadListener / WriteListener", "tag": "进阶", "body": "<ul><li>传统：<code>getInputStream().read()<\/code> 是阻塞的，读不完会占用线程。<\/li><li>3.1 非阻塞 IO：注册 <code>ReadListener<\/code>/<code>WriteListener<\/code>，数据就绪时回调，线程不被 IO 阻塞。<\/li><li>适用于<strong>流式大请求体<\/strong>（上传）、SSE 等场景。<\/li><\/ul>\n<blockquote>加分点：这和 NIO 的 Poller 思路一致——\"数据就绪才干活\"。但代码复杂度高，普通项目用 Spring 的流式处理（如 <code>StreamingResponseBody<\/code>）更省心。<\/blockquote>\n<hr>"}]}, {"title": "07 Session 机制", "questions": [{"q": "7.1 Session 的创建时机与原理", "tag": "高频", "body": "<ul><li>服务器为每个\"会话\"分配唯一 <strong>SessionId<\/strong>（默认 32 位随机串，<code>ManagerBase<\/code> 生成）。<\/li><li><strong>不是一建立连接就创建 Session<\/strong>——只有第一次调用 <code>request.getSession(true)<\/code> 时才创建。<\/li><li>Session 对象存在服务器内存中（StandardManager 的 Map<sessionId, StandardSession>）。<\/li><li>SessionId 通过 <strong>Cookie<\/strong>（默认名 JSESSIONID）或 URL 重写传给客户端。<\/li><\/ul>\n<blockquote>追问：SessionId 怎么保证唯一且不可预测？→ Tomcat 使用 SecureRandom 生成，包含时间戳+随机数；同时校验 SessionId 格式，防 Session Fixation 攻击。<\/blockquote>"}, {"q": "7.2 Cookie 与 URL 重写两种会话传递方式", "tag": "基础", "body": "<ul><li><strong>Cookie<\/strong>：<code>Set-Cookie: JSESSIONID=xxx; Path=/<\/code>，后续请求自动携带。<\/li><li><strong>URL 重写<\/strong>：<code>response.encodeURL(url)<\/code> → <code>http://host/app;jsessionid=xxx<\/code>（浏览器禁 Cookie 时的兜底）。<\/li><li>Cookie 相关属性：<code>HttpOnly<\/code>（防 JS 读取）、<code>Secure<\/code>（仅 HTTPS）、<code>SameSite<\/code>、<code>Path<\/code>、<code>Max-Age<\/code>。<\/li><\/ul>\n<blockquote>加分点：URL 重写会把 SessionId 暴露在 URL 里（容易泄漏/被 Referer 带出），生产环境默认用 Cookie；<code>SameSite=Strict/Lax<\/code> 可缓解 CSRF。<\/blockquote>"}, {"q": "7.3 Session 超时与销毁", "tag": "基础", "body": "<ul><li>默认超时 30 分钟（web.xml <code><session-config><session-timeout>30<\/session-timeout><\/code>）。<\/li><li>超时判定：StandardManager 的<strong>后台线程<\/strong>（backgroundProcess）周期性扫描，超过 maxInactiveInterval 的 Session 被过期删除。<\/li><li>主动销毁：<code>session.invalidate()<\/code>。<\/li><li>过期事件触发 <code>HttpSessionListener.sessionDestroyed()<\/code>。<\/li><\/ul>\n<blockquote>加分点：Session 过期是<strong>惰性+定期扫描<\/strong>双机制——访问时检查是否过期（惰性），Manager 后台线程定期清理（定期），兼顾准确性与性能。<\/blockquote>"}, {"q": "7.4 Session 持久化：StandardManager 与 PersistentManager", "tag": "进阶", "body": "<ul><li><strong>StandardManager<\/strong>：Session 全在内存，Tomcat 关闭时（正常 shutdown）会序列化保存到 <code>SESSIONS.ser<\/code>，重启恢复；异常退出则丢失。<\/li><li><strong>PersistentManager<\/strong>：按需将不活跃 Session 换出（swap out）到 Store：<\/li><li><code>FileStore<\/code>：序列化到文件。<\/li><li><code>JDBCStore<\/code>：存到数据库表。<\/li><li>适用场景：Session 内存占用大、需要跨重启保持登录态。<\/li><\/ul>\n<blockquote>加分点：<code>maxActiveSessions<\/code> 控制内存中最大 Session 数，超限的新 Session 创建会失败——生产上要监控这个指标，防止 Session 无上限导致内存涨。<\/blockquote>"}, {"q": "7.5 集群环境下 Session 共享的四种方案对比", "tag": "高频", "body": "<table><thead><tr><th>方案<\/th><th>原理<\/th><th>优点<\/th><th>缺点<\/th><\/tr><\/thead><tbody><tr><td>Sticky Session（粘性会话）<\/td><td>负载均衡按 SessionId 固定转发到同一节点<\/td><td>零改造、性能最好<\/td><td>节点故障时会话丢失、扩容缩容需重连<\/td><\/tr><tr><td>Session 复制（DeltaManager）<\/td><td>节点间广播 Session 变更<\/td><td>故障转移好<\/td><td>网络带宽/内存消耗大，节点多时性能差<\/td><\/tr><tr><td>集中式存储（Redis）<\/td><td>Session 数据放 Redis<\/td><td>水平扩展、故障转移好<\/td><td>多一次网络 IO、需引入中间件<\/td><\/tr><tr><td>无状态化（JWT 等）<\/td><td>服务端不存会话<\/td><td>完全无状态、天然水平扩展<\/td><td>退出/吊销困难、Token 体积大<\/td><\/tr><\/tbody><\/table>\n<ul><li>生产主流：<strong>Sticky + Redis Session<\/strong> 或<strong>纯无状态 JWT<\/strong>。<\/li><li>Spring Session 把 Session 无缝搬到 Redis，对业务代码几乎透明。<\/li><\/ul>\n<blockquote>加分点：Tomcat 自带 DeltaManager/BackupManager 做集群 Session 复制，但只适合 2~4 个节点的小集群；大规模场景必须外部化。<\/blockquote>"}, {"q": "7.6 Session 相关的经典坑", "tag": "进阶", "body": "<ol><li><strong>Cookie 丢失/失效<\/strong>：Path 不一致（多个 Context 不同 cookiePath）、Secure 属性在 HTTPS 下调到 HTTP 请求丢失、浏览器隐私模式。<\/li><li><strong>SessionId 不一致<\/strong>：跨域（不同域名 Cookie 不共享）需 SSO 方案。<\/li><li><strong>Session 未序列化<\/strong>：往 Session 放对象后，若做持久化/复制需实现 Serializable，否则报 NotSerializableException。<\/li><li><strong>并发修改<\/strong>：同一 Session 被多线程同时访问可能抛 IllegalStateException（已失效）。<\/li><li><strong>Session 泄漏<\/strong>：登录用户无上限，Session 数量膨胀 → 内存溢出，需要控制 maxActiveSessions 与超时时间。<\/li><\/ol>\n<hr>"}]}, {"title": "08 类加载器体系", "questions": [{"q": "8.1 Tomcat 的类加载器架构", "tag": "高频", "body": "<pre><code>          Bootstrap ClassLoader (JDK 核心 java.*)\n                  ↑\n          Ext/Platform ClassLoader\n                  ↑\n          System/App ClassLoader (Tomcat 自身 lib)\n                  ↑\n   ┌──────────────┼──────────────┐\n   │                              │\nCommon ClassLoader ──────────────┘   (common.loader: conf 与 lib)\n   │              │\nShared(Webapp共享)    （默认与 Common 合并）\n   │\nWebapp ClassLoader（每个 Web 应用一个）\n   │\nJSP ClassLoader（每个 JSP 一个，继承 Webapp）<\/code><\/pre>\n<ul><li>默认配置下 Common = Shared = App 的类路径（<code>common.loader<\/code> 指向 <code>lib<\/code>）。<\/li><li><strong>每个 Context（Web 应用）拥有独立的 WebappClassLoader<\/strong>，实现应用间类隔离。<\/li><\/ul>\n<blockquote>加分点：Tomcat 类加载体系 = 标准的双亲委派（上层）+ 对 Webapp 破坏双亲委派（下层），见 8.2。<\/blockquote>"}, {"q": "8.2 WebappClassLoader 为什么要破坏双亲委派？", "tag": "高频", "body": "<p>标准双亲委派：类加载先交给父加载器。但 Web 应用需要\"<strong>应用自己的类优先<\/strong>\"，否则：<\/p>\n<ol><li><strong>版本冲突<\/strong>：不同应用依赖不同版本的同一个 jar（如 log4j 1.x vs 2.x），若都由父加载器加载，只能存在一个版本。<\/li><li><strong>重载能力<\/strong>：reloadable=true 时 Tomcat 需要重建类加载器来\"卸载旧类\"，若类都由父加载器加载则无法实现。<\/li><li><strong>隔离<\/strong>：一个应用的类不能污染另一个应用。<\/li><\/ol>\n<p>所以 WebappClassLoader 的策略是：<\/p>\n<ul><li><code>java.*<\/code>、<code>javax.servlet.*<\/code> 等<strong>容器基础类<\/strong>仍由父加载器加载（保证规范一致性）；<\/li><li><strong>其余类优先自己加载<\/strong>，找不到再委托父加载器。<\/li><\/ul>\n<blockquote>加分点：这被称为\"<strong>逆向委派<\/strong>\"。但 JVM 加载类时是用\"全限定名 + 加载器实例\"做缓存，两个 Webapp 加载器各自持有同名类的不同副本，互不可见——这就是应用隔离的本质。<\/blockquote>"}, {"q": "8.3 classes/ 与 lib/ 的加载优先级", "tag": "基础", "body": "<ul><li>同一 Web 应用内：<code>WEB-INF/classes<\/code> <strong>优先于<\/strong> <code>WEB-INF/lib<\/code>。<\/li><li>用途：把某个 jar 里的类以 class 形式覆盖（打补丁、替换版本）。<\/li><li>优先级链：JVM 基础类 > 容器 lib（common/shared）> WEB-INF/classes > WEB-INF/lib。<\/li><\/ul>\n<blockquote>追问：为什么 classes 优先？→ 开发时无需打包 jar 即可直接覆盖类，方便调试与热更新。<\/blockquote>"}, {"q": "8.4 JSP 为什么需要独立的类加载器？热加载原理", "tag": "进阶", "body": "<ul><li>JSP 是动态编译的，编译出的 Servlet 类需要<strong>可卸载、可重新编译<\/strong>（JSP 修改后无需重启应用）。<\/li><li>因此 JSP 编译产物由 <strong>JspClassLoader<\/strong>（继承 WebappClassLoader）加载。<\/li><li>JspServlet 每次请求检查 JSP 文件<strong>修改时间戳<\/strong>，变了就重新编译 → 新类由<strong>新的类加载器<\/strong>加载 → 旧类自然可被 GC。<\/li><\/ul>\n<blockquote>加分点：热加载的核心不是\"重新加载同一个类\"，而是<strong>创建新的类加载器去加载新副本<\/strong>，旧类与旧加载器一起被 GC——这也是\"热加载后内存短暂上涨\"的原因。<\/blockquote>"}, {"q": "8.5 类加载相关的经典报错与排查", "tag": "高频", "body": "<table><thead><tr><th>报错<\/th><th>原因<\/th><th>排查方向<\/th><\/tr><\/thead><tbody><tr><td><code>ClassNotFoundException<\/code><\/td><td>类不存在或没打进包<\/td><td>检查依赖、构建产物<\/td><\/tr><tr><td><code>NoClassDefFoundError<\/code><\/td><td>编译期存在、运行期类缺失（或静态初始化失败）<\/td><td>检查运行期 classpath、依赖冲突<\/td><\/tr><tr><td><code>NoSuchMethodError<\/code><\/td><td>依赖版本冲突（编译版本和运行版本不一致）<\/td><td><code>mvn dependency:tree<\/code> 排查<\/td><\/tr><tr><td><code>java.lang.ClassCastException<\/code><\/td><td>同一个类被不同加载器加载了两份<\/td><td>检查是否在容器 lib 和应用 lib 重复放 jar<\/td><\/tr><tr><td>内存泄漏（PermGen/Metaspace 涨）<\/td><td>Webapp 类被 JVM 类引用导致加载器无法 GC<\/td><td>ThreadLocal、static、JDBC Driver、Quartz 等<\/td><\/tr><\/tbody><\/table>\n<blockquote>加分点：\"同一个类名却是 ClassCastException\"是类加载器隔离的经典面试题——对象由应用加载器加载，却和容器加载器加载的同名类做强转。<strong>容器 lib 里尽量不要重复放应用依赖<\/strong>。<\/blockquote>\n<hr>"}]}, {"title": "09 JSP 原理", "questions": [{"q": "9.1 JSP 的编译运行流程", "tag": "高频", "body": "<pre><code>JSP 文件（xxx.jsp）\n  → 首次访问由 Jasper 引擎解析（JspCompilationContext）\n  → 生成 Java 源码（xxx_jsp.java，本质是一个 HttpJspBase 子类）\n  → javac 编译为 class（xxx_jsp.class）\n  → 由 JspClassLoader 加载实例化\n  → 每次请求调用 _jspService(request, response)<\/code><\/pre>\n<ul><li>编译产物默认在 <code>work/Catalina/localhost/<app>/org/apache/jsp/<\/code>。<\/li><li>JSP 修改后重新编译（按时间戳）。<\/li><\/ul>\n<blockquote>加分点：<strong>JSP 本质就是 Servlet<\/strong>——<code>_jspService()<\/code> 等价于 Servlet 的 <code>service()<\/code>，页面 HTML 被封装成 <code>out.write()<\/code> 输出。这是面试最常用的\"一句话点破 JSP 本质\"。<\/blockquote>"}, {"q": "9.2 JSP 九大内置对象", "tag": "基础", "body": "<table><thead><tr><th>对象<\/th><th>类型<\/th><th>作用域<\/th><\/tr><\/thead><tbody><tr><td>request<\/td><td>HttpServletRequest<\/td><td>请求<\/td><\/tr><tr><td>response<\/td><td>HttpServletResponse<\/td><td>请求<\/td><\/tr><tr><td>out<\/td><td>JspWriter<\/td><td>请求（页面输出）<\/td><\/tr><tr><td>session<\/td><td>HttpSession<\/td><td>会话<\/td><\/tr><tr><td>application<\/td><td>ServletContext<\/td><td>应用<\/td><\/tr><tr><td>config<\/td><td>ServletConfig<\/td><td>应用（页面配置）<\/td><\/tr><tr><td>pageContext<\/td><td>PageContext<\/td><td>页面（可访问其他所有对象）<\/td><\/tr><tr><td>page<\/td><td>this（当前 Servlet）<\/td><td>页面<\/td><\/tr><tr><td>exception<\/td><td>Throwable<\/td><td>仅 errorPage 中可用<\/td><\/tr><\/tbody><\/table>\n<blockquote>加分点：九大对象中最容易漏的是 <code>pageContext<\/code>——它是页面作用域的入口，也能 <code>findAttribute()<\/code> 按 request→session→application 顺序查找。<\/blockquote>"}, {"q": "9.3 JSP 与 Servlet、模板引擎（Thymeleaf/Freemarker）的对比", "tag": "进阶", "body": "<table><thead><tr><th>维度<\/th><th>JSP<\/th><th>模板引擎<\/th><\/tr><\/thead><tbody><tr><td>编译方式<\/td><td>运行时编译为 Servlet<\/td><td>编译为模板类/解释执行<\/td><\/tr><tr><td>与 Java 耦合<\/td><td>可写 <code><% %><\/code> 脚本（耦合高）<\/td><td>强制模板语法，禁止脚本<\/td><\/tr><tr><td>前后端分离<\/td><td>适合服务端渲染旧项目<\/td><td>更适合 MVC 分离<\/td><\/tr><tr><td>现状<\/td><td>新项目基本不用<\/td><td>主流（Thymeleaf 与 Spring Boot 集成好）<\/td><\/tr><\/tbody><\/table>\n<blockquote>加分点：JSP 被淘汰的核心原因：<strong>前后端分离趋势 + JSP 脚本元素破坏了 MVC 分层<\/strong>。现代项目要么后端模板引擎，要么纯静态 + REST API。<\/blockquote>"}, {"q": "9.4 JSP 性能与安全注意点", "tag": "进阶", "body": "<ol><li><strong>禁用脚本元素<\/strong>：<code><jsp-property-group><\/code> 设置 <code>scripting-invalid=\"true\"<\/code>，强制 EL/JSTL。<\/li><li><strong>使用 JSTL + EL<\/strong>：避免 <code><% %><\/code> 混写。<\/li><li><strong>page 指令<\/strong>：<code><%@ page import session=\"false\" %><\/code> 可避免 JSP 自动创建 Session。<\/li><li><strong>缓存<\/strong>：JSP include 是编译期静态包含（jsp:include 是请求期动态包含，性能更差）。<\/li><li><strong>XSS<\/strong>：EL 输出默认不转义，用 JSTL <code><c:out><\/code> 或 fn:escapeXml。<\/li><\/ol>\n<hr>"}]}, {"title": "10 性能调优", "questions": [{"q": "10.1 高并发场景的完整调优清单", "tag": "高频", "body": "<ol><li><strong>线程池<\/strong>：maxThreads 按 CPU 密集/IO 密集调整（IO 密集可调高至 400~800，配合压测验证）。<\/li><li><strong>连接参数<\/strong>：maxConnections（NIO 下可 10000+）、acceptCount、connectionTimeout。<\/li><li><strong>内存<\/strong>：-Xms=-Xmx 固定堆（防抖动）、合理 MetaspaceSize。<\/li><li><strong>JVM GC<\/strong>：优先 G1，年轻代大小与 Tomcat 线程数匹配。<\/li><li><strong>压缩<\/strong>：compression=\"on\"，减带宽。<\/li><li><strong>静态资源分离<\/strong>：交给 Nginx/CDN，Tomcat 只处理动态。<\/li><li><strong>连接器缓冲<\/strong>：<code>socket.txBufSize<\/code>/<code>socket.rxBufSize<\/code> 按需调整。<\/li><li><strong>禁用 reloadable<\/strong>、<code>metadata-complete=\"true\"<\/code> 跳过注解扫描加速启动。<\/li><\/ol>\n<blockquote>加分点：调优必须<strong>以压测数据为准<\/strong>——先定目标 QPS/RT，再用 JMeter/wrk 压测，观察线程池、连接数、GC、CPU 四个指标联动调整，不要盲调参数。<\/blockquote>"}, {"q": "10.2 JVM 内存参数配置建议", "tag": "高频", "body": "<pre><code class=\"lang-bash\">JAVA_OPTS=\"-server -Xms2g -Xmx2g -XX:MetaspaceSize=256m -XX:MaxMetaspaceSize=512m \\\n-XX:+UseG1GC -XX:MaxGCPauseMillis=100 -Xss512k \\\n-XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/data/logs/heap.hprof\"<\/code><\/pre>\n<ul><li><code>-Xms = -Xmx<\/code>：避免堆动态伸缩导致 Full GC 与抖动。<\/li><li>G1 适合大堆（4G+）与低延迟场景。<\/li><li><code>-Xss<\/code> 调小可支持更多线程（但过小易栈溢出，递归深度大的别调）。<\/li><li>生产必须开 <strong>OOM Dump<\/strong>，否则 OOM 后无从排查。<\/li><\/ul>\n<blockquote>加分点：Tomcat 每个请求线程默认栈 1MB → 400 线程约 400MB 虚拟内存；<code>-Xss512k<\/code> 能显著降低线程内存开销。<\/blockquote>"}, {"q": "10.3 压测中\"连接数打满 / 线程打满\"的现象与对策", "tag": "高频", "body": "<table><thead><tr><th>现象<\/th><th>特征<\/th><th>对策<\/th><\/tr><\/thead><tbody><tr><td>连接数打满<\/td><td>大量 Connection refused / 超时<\/td><td>调大 maxConnections + acceptCount；检查 keep-alive 长连接占用；增加实例<\/td><\/tr><tr><td>线程打满<\/td><td>CPU 不高但请求排队、RT 飙升<\/td><td>说明业务阻塞（慢 SQL/外部调用），优化业务或用异步化；临时调大 maxThreads 只是拖延<\/td><\/tr><tr><td>CPU 打满<\/td><td>CPU 100%，吞吐上不去<\/td><td>业务计算密集/死循环/GC 频繁，用 jstack 定位热点<\/td><\/tr><\/tbody><\/table>\n<blockquote>加分点：<strong>线程打满 ≠ 参数不够，而是业务太慢<\/strong>——先 jstack 看线程在等什么（锁/IO/DB），再决定是加机器还是改代码。调参是最后手段。<\/blockquote>"}, {"q": "10.4 慢请求定位：jstack 线程 dump 分析", "tag": "进阶", "body": "<ol><li><code>jstack <pid> > dump.txt<\/code>（可连续抓 3~5 次间隔 2s）。<\/li><li>找 <code>http-nio-8080-exec-N<\/code> 线程的栈。<\/li><li>看卡点：<code>java.net.SocketInputStream.socketRead0<\/code>（等网络）、<code>Object.wait<\/code>（等锁）、<code>MySQL 驱动 waiting for connection<\/code>（DB 连接池满）、<code>GC<\/code> 线程（Full GC 频繁）。<\/li><li>用 <code>top -Hp<\/code> 找 CPU 高的线程 nid，在 dump 中对应定位。<\/li><\/ol>\n<blockquote>加分点：Tomcat 工作线程名 <code>http-nio-8080-exec-*<\/code> 里直接带协议、端口、编号，dump 里一眼可辨；连续 dump 对比线程栈是否变化可判断\"真阻塞还是偶发慢\"。<\/blockquote>"}, {"q": "10.5 常见 OOM 类型与排查", "tag": "进阶", "body": "<table><thead><tr><th>OOM 类型<\/th><th>含义<\/th><th>常见原因<\/th><\/tr><\/thead><tbody><tr><td>Java heap space<\/td><td>堆满<\/td><td>对象泄漏、Session 无上限、缓存无限增长<\/td><\/tr><tr><td>Metaspace<\/td><td>元空间满<\/td><td>热部署/动态代理生成类过多、类加载器泄漏<\/td><\/tr><tr><td>Direct buffer memory<\/td><td>堆外满<\/td><td>NIO 缓冲区泄漏<\/td><\/tr><tr><td>unable to create new native thread<\/td><td>线程数超 OS 限制<\/td><td>线程池泄漏、每连接一线程<\/td><\/tr><\/tbody><\/table>\n<p>排查套路：<code>jmap -dump<\/code> 拿堆 → MAT/Eclipse 分析支配树 → 找大对象与 GC Roots 引用链。<\/p>\n<blockquote>加分点：Tomcat 经典 OOM 场景之一：<strong>反复热部署 + ThreadLocal 未 remove<\/strong>，Webapp 类被线程池线程的 ThreadLocalMap 强引用 → 类加载器泄漏 → Metaspace 涨。排查时重点看 static 集合、ThreadLocal、JDBC Driver 注册。<\/blockquote>"}, {"q": "10.6 静态资源与缓存优化", "tag": "进阶", "body": "<ul><li>静态资源默认由 <strong>DefaultServlet<\/strong> 处理，支持 Range 请求、gzip、ETag/Last-Modified。<\/li><li><code>resources<\/code> 缓存：<code><Resources cachingAllowed=\"true\" cacheMaxSize=\"10240\"/><\/code>（缓存静态文件解析结果，减少磁盘 IO）。<\/li><li><code>cacheTtl<\/code>、<code>cacheObjectMaxSize<\/code> 控制缓存条目。<\/li><li>最佳实践：静态资源<strong>外置到 Nginx/CDN<\/strong>，Tomcat 专注动态。<\/li><\/ul>\n<blockquote>加分点：DefaultServlet 支持 <strong>sendfile<\/strong>（APR 下）直接把文件从磁盘送网卡，零拷贝，性能极高。<\/blockquote>"}, {"q": "10.7 开启 HTTP 响应压缩", "tag": "基础", "body": "<pre><code class=\"lang-xml\">&lt;Connector ... compression=\"on\" compressionMinSize=\"2048\"\n           compressibleMimeType=\"text/html,text/xml,text/plain,text/css,application/javascript,application/json\"/&gt;<\/code><\/pre>\n<ul><li>默认只压缩文本类 MIME，图片/视频不要压（已压缩格式再压无收益还耗 CPU）。<\/li><li>也可以完全交给 Nginx 层压缩，Tomcat 不压。<\/li><\/ul>\n<blockquote>加分点：压缩以 CPU 换带宽，内网服务一般不用；<strong>前端 gzip 由 Nginx 做更划算<\/strong>（缓存压缩结果、支持 brotli）。<\/blockquote>"}, {"q": "10.8 keep-alive 与大并发下的连接治理", "tag": "进阶", "body": "<ul><li>keep-alive 复用连接省握手，但<strong>占用 maxConnections 额度<\/strong>。<\/li><li>调优思路：<code>maxKeepAliveRequests<\/code> 限制单连接请求数（防个别连接长期霸占）；<code>keepAliveTimeout<\/code> 缩短空闲连接存活。<\/li><li>配合 Nginx：Nginx 与客户端保持长连接，<strong>与 Tomcat 的 upstream 也开 keepalive<\/strong>（<code>upstream<\/code> 块配 <code>keepalive 100<\/code>），避免每个请求都重建后端连接。<\/li><\/ul>\n<blockquote>加分点：压测时若用短连接（无 keep-alive）测得的结果和长连接差异巨大——<strong>测试模型必须贴近真实流量<\/strong>，否则调优方向会错。<\/blockquote>\n<hr>"}]}, {"title": "11 故障排查与监控", "questions": [{"q": "11.1 CPU 100% 的排查流程", "tag": "高频", "body": "<ol><li><code>top<\/code> 看哪个进程 CPU 高 → 确定是 Java 进程。<\/li><li><code>top -Hp <pid><\/code> 找出 CPU 最高的线程的 <strong>nid<\/strong>（十六进制）。<\/li><li><code>jstack <pid> | grep -A20 <nid十六进制><\/code> 定位线程栈。<\/li><li>分析热点：<\/li><\/ol>\n<ul><li>业务死循环/大计算 → 优化代码；<\/li><li><strong>GC 线程忙<\/strong> → 堆太小/对象分配太快，用 <code>jstat -gcutil<\/code> 看 GC 频率；<\/li><li><code>jmap -dump<\/code> 分析对象。<\/li><\/ul>\n<blockquote>加分点：<code>printf \"%x\\n\" <nid十进制><\/code> 转十六进制再 grep，是面试官爱考的细节。GC 导致 CPU 高的标志：线程栈顶部是 <code>G1YoungRemSetSamplingThread<\/code>/<code>VM Thread<\/code> 且 <code>jstat<\/code> 显示 FGC 频繁。<\/blockquote>"}, {"q": "11.2 内存泄漏的经典场景（Webapp 类加载器泄漏）", "tag": "进阶", "body": "<p>Tomcat 特有的泄漏模式：<strong>WebappClassLoader 无法被 GC<\/strong>。<\/p>\n<p>常见原因（都有\"引用逃出应用\"的特征）：<\/p>\n<ol><li>ThreadLocal 里存了应用类对象，线程未清理。<\/li><li>静态变量持有了应用对象（<code>static Map<\/code> 缓存）。<\/li><li>JDBC Driver 注册在容器级 DriverManager。<\/li><li>第三方库启动了独立线程（Quartz、Timer、Netty boss 线程）持有应用 Context。<\/li><li>Tomcat 官方提供 <code>manager<\/code> 应用的\"Find Leaks\"功能扫描。<\/li><\/ol>\n<blockquote>加分点：Leak 检测原理是创建<strong>新的<\/strong> WebappClassLoader 再比对旧加载器加载的类实例——如果有实例仍存活，说明有外部引用，即泄漏。<\/blockquote>"}, {"q": "11.3 线程池满 / 连接数打满的快速确认", "tag": "基础", "body": "<ul><li>查看线程数：<code>jstack<\/code> 数 <code>http-nio-8080-exec-*<\/code> 个数是否达到 maxThreads。<\/li><li>查看连接数：<code>netstat -an | grep 8080 | grep ESTABLISHED | wc -l<\/code> 对比 maxConnections。<\/li><li>查看队列：Tomcat 日志中的 <code>RejectedExecutionException<\/code>。<\/li><li>监控端点：JMX 的 <code>Catalina:type=ThreadPool,name=\"http-nio-8080\"<\/code> 的 currentThreadsBusy / maxThreads。<\/li><\/ul>\n<blockquote>加分点：<code>currentThreadsBusy == maxThreads<\/code> 持续饱和 → 业务瓶颈；<code>connectionCount == maxConnections<\/code> 持续饱和 → 连接参数或 keep-alive 策略问题。<\/blockquote>"}, {"q": "11.4 日志体系：catalina.out 与各日志文件", "tag": "基础", "body": "<table><thead><tr><th>文件<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>catalina.out<\/td><td>控制台输出（System.out/err、启动信息）<\/td><\/tr><tr><td>localhost.log<\/td><td>应用级日志（localhost 虚拟主机）<\/td><\/tr><tr><td>localhost_access_log.*.txt<\/td><td>访问日志（AccessLogValve 开启后）<\/td><\/tr><tr><td>manager.log / host-manager.log<\/td><td>管理应用日志<\/td><\/tr><\/tbody><\/table>\n<ul><li>生产建议：<strong>catalina.out 一定要做日志轮转<\/strong>（logrotate），否则磁盘写满导致服务挂掉。<\/li><li>访问日志配置：<code><Valve className=\"org.apache.catalina.valves.AccessLogValve\" pattern=\"%h %l %u %t \"%r\" %s %b %D\"/><\/code>，<code>%D<\/code> 是耗时毫秒，可用于慢请求统计。<\/li><\/ul>\n<blockquote>加分点：<code>%D<\/code>（耗时）结合 <code>%s<\/code>（状态码）可以快速统计\"哪些 URL 慢、哪些 5xx 多\"，是运维定位问题的第一手数据。<\/blockquote>"}, {"q": "11.5 常用排查命令速查", "tag": "基础", "body": "<pre><code class=\"lang-bash\">jstack &lt;pid&gt; &gt; dump.txt\njmap -heap &lt;pid&gt;\njmap -dump:format=b,file=heap.hprof &lt;pid&gt;\njstat -gcutil &lt;pid&gt; 1000\ntop -Hp &lt;pid&gt;\nnetstat -ant | grep :8080 | awk '{print $6}' | sort | uniq -c<\/code><\/pre>\n<blockquote>加分点：jmap -dump 会<strong>触发 STW<\/strong>，大堆生产环境慎用，可换 Arthas 的 heapdump 或加 <code>-XX:+HeapDumpOnOutOfMemoryError<\/code> 自动导出。<\/blockquote>\n<hr>"}]}, {"title": "12 安全加固", "questions": [{"q": "12.1 常见安全加固项", "tag": "高频", "body": "<ol><li><strong>禁用 shutdown 端口<\/strong>：<code><Server port=\"8005\" shutdown=\"SHUTDOWN\"><\/code> → 改为随机口令或 <code>port=\"-1\"<\/code> 彻底禁用。<\/li><li><strong>隐藏版本号<\/strong>：<code>server.xml<\/code> 中 Server 加 <code>server=\"自定义字符串\"<\/code>；<code>/conf/web.xml<\/code> 或错误页处理。<\/li><li><strong>关闭目录列表<\/strong>：DefaultServlet 的 <code>listings=\"false\"<\/code>（默认就是 false）。<\/li><li><strong>删除默认应用<\/strong>：移除 webapps 下的 ROOT/examples/docs/manager/host-manager（生产只留自己的应用）。<\/li><li><strong>最小权限<\/strong>：Tomcat 进程用专用低权限用户运行；<code>catalina.sh<\/code> 加 <code>-Djava.security.manager<\/code>（需要配置策略文件，慎用）。<\/li><li><strong>开启 HTTPS<\/strong>，禁用 TLSv1/1.1，配 HSTS。<\/li><\/ol>\n<blockquote>加分点：版本号隐藏的本质是<strong>信息暴露<\/strong>——攻击者扫描到 Tomcat 8.0 可针对性利用已知 CVE；<code>server=\" \"<\/code> 会把响应头的 Server 字段置空。<\/blockquote>"}, {"q": "12.2 HTTPS 配置与 TLS 优化", "tag": "进阶", "body": "<pre><code class=\"lang-xml\">&lt;Connector port=\"8443\" protocol=\"org.apache.coyote.http11.Http11NioProtocol\"\n           SSLEnabled=\"true\" scheme=\"https\" secure=\"true\"\n           keystoreFile=\"conf/keystore.p12\" keystoreType=\"PKCS12\" keystorePass=\"***\"&gt;\n&lt;/Connector&gt;<\/code><\/pre>\n<ul><li>证书链：<code>keystoreFile<\/code> + <code>keystorePass<\/code>（PKCS12 推荐，JKS 已废弃）。<\/li><li>调优：<code>sslProtocol=\"TLS\"<\/code>、指定 <code>ciphers<\/code>（禁用弱套件如 3DES/RC4）、<code>maxThreads<\/code> 配合。<\/li><li>TLS 握手是 CPU 密集操作，SSL 卸载到 Nginx/硬件加速卡更优。<\/li><li>HTTP/2 需要 TLS 的 <strong>ALPN<\/strong> 协商。<\/li><\/ul>\n<blockquote>加分点：<code>SSLEnabled=\"true\"<\/code> 的 Connector 端口一般用 8443；生产更常见的是 <strong>Nginx 终结 TLS<\/strong>，Tomcat 只收 HTTP 内网流量，安全且性能好。<\/blockquote>"}, {"q": "12.3 常见的容器层防护手段", "tag": "进阶", "body": "<ul><li><strong>请求头限制<\/strong>：maxHttpHeaderSize、RelaxedPathChars 限制特殊字符（防路径穿越/注入）。<\/li><li><strong>IP 白名单<\/strong>：RemoteAddrValve/RemoteHostValve 控制访问来源。<\/li><li><strong>限流<\/strong>：自定义 Valve 或接入网关限流。<\/li><li><strong>CSRF<\/strong>：SameSite Cookie + Token。<\/li><li><strong>XSS<\/strong>：Filter 层统一转义输出。<\/li><li><strong>上传安全<\/strong>：<code>maxPostSize<\/code>/<code>maxSwallowSize<\/code> 限制请求体，校验文件类型（防上传恶意脚本）。<\/li><\/ul>\n<blockquote>加分点：安全是<strong>分层防御<\/strong>——容器层（Valve/Filter）+ 应用层（Spring Security）+ 网关层（WAF）。Tomcat 只做基础防线，别指望它挡应用漏洞。<\/blockquote>"}, {"q": "12.4 AJP 协议与安全", "tag": "进阶", "body": "<ul><li>AJP 是 Tomcat 与 Apache/前端之间用的<strong>二进制协议<\/strong>（端口 8009），比 HTTP 头开销小。<\/li><li><strong>Ghostcat 漏洞（CVE-2020-1938）<\/strong>：AJP 端口未设认证时可读任意文件（含 WEB-INF）→ 危害极大。<\/li><li>加固：<strong>不用 AJP 就直接禁用<\/strong>（注释掉 8009 Connector）；必须用时设置 <code>requiredSecret<\/code>，且只监听内网。<\/li><\/ul>\n<blockquote>加分点：2020 年 Ghostcat 是 Tomcat 最有名的漏洞——凡问\"Tomcat 安全\"几乎必提它。回答\"禁用未使用的 AJP + 配置 requiredSecret + 防火墙限制来源\"即满分。<\/blockquote>\n<hr>"}]}, {"title": "13 集群与高可用", "questions": [{"q": "13.1 常见的 Tomcat 集群部署形态", "tag": "基础", "body": "<ol><li><strong>单体 + Nginx 负载均衡<\/strong>（最常见）：Nginx 按 ip_hash/least_conn 分发，Tomcat 多实例。<\/li><li><strong>多机多实例<\/strong>：每台机器跑多个 Tomcat 实例（端口不同），提高单机利用率。<\/li><li><strong>容器化<\/strong>：Docker/K8s 下每个 Pod 一个内嵌 Tomcat，水平扩缩容。<\/li><li><strong>Session 集群<\/strong>：见 7.5，配合粘性或外部存储。<\/li><\/ol>\n<blockquote>加分点：部署形态的核心是\"<strong>无状态化<\/strong>\"——应用尽量不依赖本地 Session/本地文件，才可能水平扩容。<\/blockquote>"}, {"q": "13.2 Nginx 负载均衡 + 粘性会话的配置要点", "tag": "进阶", "body": "<pre><code class=\"lang-nginx\">upstream backend {\n    ip_hash;                 # 按 IP 固定节点（粘性）\n    server 10.0.0.1:8080 max_fails=3 fail_timeout=10s;\n    server 10.0.0.2:8080 max_fails=3 fail_timeout=10s;\n    keepalive 32;            # 与后端的长连接池\n}<\/code><\/pre>\n<ul><li><code>ip_hash<\/code> 对 NAT 后的用户不友好（同出口 IP 集中到一台）；更好的是按 Cookie 粘性（<code>sticky<\/code> 模块）。<\/li><li>故障转移：节点挂掉后健康检查剔除；Session 会丢（粘性的代价）——所以粘性 + Redis Session 组合最稳。<\/li><\/ul>\n<blockquote>加分点：粘性会话下<strong>单个节点故障 = 该节点用户掉登录<\/strong>，这往往不可接受，所以生产主流还是\"无状态 JWT + Redis\"或\"Redis Session 共享\"。<\/blockquote>"}, {"q": "13.3 Tomcat 自带的 Session 集群方案", "tag": "进阶", "body": "<ul><li><strong>DeltaManager<\/strong>：主节点 Session 变化（创建/更新/过期）<strong>广播<\/strong>给所有节点，任意节点都有完整会话。节点多时广播风暴。<\/li><li><strong>BackupManager<\/strong>：只备份到一个备用节点，减少广播量，但故障恢复不如 DeltaManager 完整。<\/li><li>配置：<code><Cluster className=\"org.apache.catalina.ha.tcp.SimpleTcpCluster\"><\/code>，需要 <code><Manager><\/code> 替换为 DeltaManager。<\/li><\/ul>\n<blockquote>加分点：Tomcat 自带集群基于 <strong>Multicast 组播 + TCP 备份<\/strong>，只适合小规模；这是\"Tomcat 集群\"面试题的标准答法——先讲方案对比（见 7.5），再讲自带实现，最后给生产建议。<\/blockquote>"}, {"q": "13.4 分布式 Session 的选型建议", "tag": "高频", "body": "<table><thead><tr><th>场景<\/th><th>推荐<\/th><\/tr><\/thead><tbody><tr><td>中小规模、已有 Redis<\/td><td>Spring Session + Redis（首选）<\/td><\/tr><tr><td>无状态 API 服务<\/td><td>JWT/Token，不做 Session<\/td><\/tr><tr><td>老系统改造<\/td><td>Nginx 粘性 + Session 复制兜底<\/td><\/tr><tr><td>高可用要求极高<\/td><td>Redis Cluster + Spring Session + 会话续期<\/td><\/tr><\/tbody><\/table>\n<ul><li>Spring Session 原理：实现 <code>HttpSession<\/code> 接口，把 Session 数据读写到 Redis（序列化 + TTL 自动过期），对业务代码透明。<\/li><li>注意：Session 中的对象必须<strong>可序列化<\/strong>；Redis 故障要有降级策略。<\/li><\/ul>\n<blockquote>加分点：选型的关键判断是\"<strong>Session 里到底存了什么<\/strong>\"——如果能瘦身成\"只存 userId\"甚至 JWT，问题直接消失；方案从简到繁逐步演进。<\/blockquote>\n<hr>"}]}, {"title": "14 生产场景题", "questions": [{"q": "14.1 双十一大促，Tomcat 怎么扛？", "tag": "高频", "body": "<p>分层回答（体现架构思维）：<\/p>\n<ol><li><strong>流量入口<\/strong>：Nginx/网关 + CDN + WAF，静态资源全部外置。<\/li><li><strong>应用层<\/strong>：Tomcat 多实例水平扩容；容器化后按 QPS 指标自动扩缩容。<\/li><li><strong>单实例调优<\/strong>：maxThreads/maxConnections/keep-alive/压缩按压测调。<\/li><li><strong>依赖治理<\/strong>：Redis 扛热点读、MQ 削峰填谷、DB 连接池限量、缓存防止击穿。<\/li><li><strong>容量规划<\/strong>：先压测得出单机 QPS，再算实例数，留 30% 冗余。<\/li><li><strong>兜底<\/strong>：限流（网关）、降级（开关）、熔断（Sentinel/Hystrix）。<\/li><\/ol>\n<blockquote>加分点：大促题考察的不是\"Tomcat 参数\"，而是<strong>全链路容量思维<\/strong>——Tomcat 只是其中一环，先问清业务模型（读写比、热点占比、可缓存性）。<\/blockquote>"}, {"q": "14.2 连接数被占满，所有请求超时，怎么排查处理？", "tag": "高频", "body": "<p>排查步骤：<\/p>\n<ol><li><code>netstat -ant | grep :8080<\/code> 看连接状态分布：大量 ESTABLISHED 长时间空闲 → keep-alive 连接占满；大量 TIME_WAIT → 短连接过多。<\/li><li>看 <code>currentThreadsBusy<\/code>：线程忙则查业务卡点（jstack）；线程闲但连接满 → 就是连接参数/长连接策略问题。<\/li><li>处理：临时调大 maxConnections/acceptCount；缩短 keepAliveTimeout、限制 maxKeepAliveRequests；把长连接交给 Nginx 管理；扩容实例。<\/li><li>根因预防：压测复现、监控连接数指标、告警。<\/li><\/ol>\n<blockquote>加分点：注意<strong>先分清楚是\"连接多\"还是\"线程忙\"<\/strong>——两者对策完全不同（一个是参数，一个是业务），这是这道题的核心考点。<\/blockquote>"}, {"q": "14.3 上传大文件（1GB）导致连接长时间占用怎么办？", "tag": "进阶", "body": "<ul><li>参数：<code>maxPostSize=\"-1\"<\/code>（不限请求体大小，默认 2MB）、<code>maxSwallowSize<\/code> 调大。<\/li><li>超时：<code>connectionUploadTimeout<\/code> 针对上传的慢客户端放宽。<\/li><li>架构解法：<\/li><\/ul>\n<ol><li><strong>直传 OSS/对象存储<\/strong>：前端签名直传，Tomcat 只拿 URL，完全不碰文件流。<\/li><li><strong>分片上传<\/strong>：客户端切片 + 服务端合并。<\/li><li><strong>异步处理<\/strong>：上传后立刻返回，后台任务处理。<\/li><\/ol>\n<blockquote>加分点：大文件上传的最优解永远是<strong>别让应用服务器碰文件<\/strong>——签名直传 OSS + 回调通知，Tomcat 只做元数据。回答这一点会明显加分。<\/blockquote>"}, {"q": "14.4 请求偶发 503 / Connection reset 怎么查？", "tag": "进阶", "body": "<p>可能原因：<\/p>\n<ol><li><strong>RejectedExecutionException<\/strong>：线程池满 + 队列满 → 503（看 catalina 日志）。<\/li><li><strong>maxConnections 打满<\/strong>：连接拒绝。<\/li><li><strong>连接被重置（RST）<\/strong>：客户端/中间层超时后关闭（Nginx proxy_read_timeout、防火墙）、后端处理超时。<\/li><li><strong>响应超时<\/strong>：处理超过连接器/前端超时时间，连接被断开，客户端读到 Connection reset。<\/li><\/ol>\n<p>排查：看 access log 状态码、<code>%D<\/code> 耗时、catalina 日志异常栈、网络层抓包（tcpdump 看 RST 来源）。<\/p>\n<blockquote>加分点：<code>Connection reset by peer<\/code> 大多是<strong>对端先关的连接<\/strong>——要先分清是\"我们主动关\"还是\"客户端/中间层主动关\"，方向对了问题就解决一半。<\/blockquote>"}, {"q": "14.5 Tomcat 单机能扛多少并发？如何突破？", "tag": "进阶", "body": "<ul><li>单机 NIO 下<strong>连接数<\/strong>轻松上万，但<strong>吞吐瓶颈<\/strong>在：线程数（CPU 核数）、业务耗时、GC、网络。<\/li><li>经验值：普通 IO 业务单机 <strong>1000~5000 QPS<\/strong> 量级（取决于业务复杂度），纯静态或缓存命中场景更高。<\/li><li>突破手段：水平扩容（加实例）+ 负载均衡；缓存与异步化降低平均耗时；必要时换 Undertow/Netty。<\/li><\/ul>\n<blockquote>加分点：面试官真正想听的是\"<strong>并发是一个系统问题不是 Tomcat 问题<\/strong>\"——单机压到极限后唯一的正确解法是水平扩展。<\/blockquote>\n<hr>"}]}, {"title": "15 源码级进阶", "questions": [{"q": "15.1 NioEndpoint 的内部结构", "tag": "进阶", "body": "<p>NioEndpoint 继承 AbstractEndpoint，核心成员：<\/p>\n<ul><li><code>Acceptor<\/code>（1 个）：accept 循环。<\/li><li><code>Poller[] pollers<\/code>（默认 2 个）：每个 Poller 一个 Selector + 一个线程。<\/li><li><code>PollerEvent<\/code>：SocketChannel 注册事件的封装（可复用，减少对象创建）。<\/li><li><code>SocketProcessor<\/code>：连接 + 请求处理任务（实现 Runnable，提交线程池）。<\/li><li><code>NioSocketWrapper<\/code>：Socket 状态包装（interestOps、readLatch 等）。<\/li><li><code>SelectorPool<\/code> / <code>BlockPoller<\/code>：阻塞读的辅助。<\/li><\/ul>\n<blockquote>加分点：Tomcat 的 PollerEvent 是<strong>对象池复用<\/strong>的（EventCache），这是它在高连接数下 GC 压力小的细节设计。<\/blockquote>"}, {"q": "15.2 Http11Processor 处理请求的伪代码流程", "tag": "进阶", "body": "<pre><code>service(SocketWrapperBase socketWrapper):\n  // 1. 解析请求行与请求头（循环直到读完整）\n  inputBuffer.parseRequestLine()\n  inputBuffer.parseHeaders()\n  // 2. 校验请求（协议版本、host 头等）\n  prepareRequest()\n  // 3. 交给容器\n  getAdapter().service(request, response)\n  // 4. 写响应：flush → 检查 keep-alive\n  outputBuffer.flush()\n  // 5. 决定连接状态：KEEP_ALIVE / CLOSE / 出错\n  checkKeepAlive()<\/code><\/pre>\n<ul><li>响应写完检查 <code>keepAlive<\/code>：可复用则进入下一轮解析，否则 <code>endRequest()<\/code> 关闭。<\/li><li>特殊处理：<code>Expect: 100-continue<\/code>、<code>Upgrade<\/code>（WebSocket/HTTP2）、<code>maxKeepAliveRequests<\/code> 计数。<\/li><\/ul>\n<blockquote>加分点：Http11Processor 是<strong>有状态对象<\/strong>（持有 InputBuffer/OutputBuffer），Tomcat 会对它做<strong>回收复用<\/strong>（Processor 缓存），减少创建开销。<\/blockquote>"}, {"q": "15.3 CoyoteAdapter 做了什么适配？", "tag": "进阶", "body": "<ul><li>把 Coyote 层的 <code>org.apache.coyote.Request/Response<\/code>（面向协议）转换为 Servlet 规范的 <code>org.apache.catalina.connector.Request/Response<\/code>（面向容器）。<\/li><li>设置 URI 解码（URIEncoding）、CharacterEncoding、SessionId 解析（从 Cookie/URL）。<\/li><li>调用 <code>connector.getService().getContainer().getPipeline().getFirst().invoke(request, response)<\/code> 进入容器 Pipeline。<\/li><li>响应完成时把结果回填到 Coyote Response（状态码、头、字节）。<\/li><\/ul>\n<blockquote>加分点：<strong>Coyote 不依赖 Servlet API<\/strong>——这是 Tomcat 分层解耦的关键；Adapter 是两层之间的\"翻译官\"。<\/blockquote>"}, {"q": "15.4 Tomcat 线程池的内部实现（TaskQueue + ThreadPoolExecutor）", "tag": "进阶", "body": "<pre><code class=\"lang-java\">// 重写 offer：线程未满时不入队，强制创建线程\npublic boolean offer(Runnable o) {\n    if (parent.getPoolSize() == parent.getMaximumPoolSize())\n        return super.offer(o);          // 线程已满，正常入队\n    if (parent.getSubmittedCount() &lt; parent.getPoolSize())\n        return super.offer(o);          // 提交数少于线程数，入队\n    if (parent.getPoolSize() &lt; parent.getMaximumPoolSize())\n        return false;                   // 有空闲容量，拒绝入队 → 建新线程\n    return super.offer(o);\n}<\/code><\/pre>\n<ul><li><code>ThreadPoolExecutor<\/code> 在 <code>execute()<\/code> 时还会对 <strong>rejected 任务做重试<\/strong>（若线程池状态允许），并记录 submittedCount 统计。<\/li><li>线程空闲超过 <code>keepAliveTime<\/code>（默认 60s）回收至 minSpareThreads。<\/li><\/ul>\n<blockquote>加分点：这是 Tomcat 与 JDK 默认线程池策略差异的源码证据，面试背出这段 offer 逻辑基本就是\"源码级理解\"。<\/blockquote>"}, {"q": "15.5 Tomcat 的优雅关闭（Graceful Shutdown）", "tag": "进阶", "body": "<ul><li>传统关闭：shutdown 端口发字符串 → stop() → 立即断开连接（进行中的请求可能被中断）。<\/li><li><strong>9.0.31+<\/strong> 引入优雅关闭：<\/li><\/ul>\n<ol><li>停止 accept 新连接。<\/li><li>等待已建立连接在超时窗口内处理完（<code>connectionTimeout<\/code> 内），或等待运行中的任务结束。<\/li><li>再 stop/destroy。<\/li><\/ol>\n<ul><li>实现：<code>Tomcat 9<\/code> 的 <code>StandardServer<\/code> 支持通过 <code>stop()<\/code> 前等待；Spring Boot 也有 <code>server.shutdown=graceful<\/code>。<\/li><\/ul>\n<blockquote>加分点：优雅关闭的本质是\"<strong>先摘流量，再排空存量，最后销毁<\/strong>\"——与 K8s 的 preStop hook + terminationGracePeriodSeconds 配合，实现零中断发布。这是把容器知识串起来的加分点。<\/blockquote>\n<hr>\n<blockquote><strong>面试心法<\/strong>：Tomcat 面试题的三个层次——① 会说（参数、流程、概念）② 会算（线程模型、容量估算、调优逻辑）③ 会查（源码类名、异常定位、排查命令）。能把这 15 章内容按\"架构 → 请求链路 → 线程模型 → 调优 → 排查\"的脉络讲下来，基本可以覆盖面试官 80% 的追问。<\/blockquote>"}]}], "qcount": 80}]}, {"id": "net", "name": "网络连接", "icon": "🕸️", "color": "#38bdf8", "docs": [{"sub": "考前背诵版", "chapters": [{"title": "01 连接的本质与分类", "questions": [{"q": "1.1 什么是网络连接？物理连接与逻辑连接的区别？", "tag": "基础", "body": "<p><strong>标准答案（三步法）<\/strong>：<\/p>\n<ol><li><strong>物理连接<\/strong>：真实的硬件链路（网线、光纤、交换机端口），是\"线\"的存在。<\/li><li><strong>逻辑连接<\/strong>：协议栈维护的虚拟通路状态（TCP 四元组+状态机、HTTP 会话、VPN 隧道），是\"状态\"的存在。<\/li><li><strong>关系<\/strong>：逻辑连接建立在物理连接之上，物理连接共享、逻辑连接复用——千条 TCP 连接可共享一根光纤（分组交换）。<\/li><\/ol>\n<blockquote>记忆口诀：<strong>\"物理是线、逻辑是状态；线共享、状态复用。\"<\/strong> 答出\"分组交换让逻辑连接在共享介质上抽象出隔离会话\"是加分句。<\/blockquote>"}, {"q": "1.2 TCP 与 UDP 的本质区别？", "tag": "高频", "body": "<p><strong>标准答案（六维对比表）<\/strong>：<\/p>\n<table><thead><tr><th>维度<\/th><th>TCP<\/th><th>UDP<\/th><\/tr><\/thead><tbody><tr><td>连接<\/td><td>面向连接，三次握手<\/td><td>无连接，直接发包<\/td><\/tr><tr><td>可靠性<\/td><td>确认/重传/排序/去重<\/td><td>尽最大努力<\/td><\/tr><tr><td>流量/拥塞控制<\/td><td>有<\/td><td>无<\/td><\/tr><tr><td>报文边界<\/td><td>字节流（粘包）<\/td><td>保留边界<\/td><\/tr><tr><td>首部<\/td><td>20 字节<\/td><td>8 字节<\/td><\/tr><tr><td>场景<\/td><td>HTTP、DB、文件、RPC<\/td><td>DNS、音视频、游戏、QUIC<\/td><\/tr><\/tbody><\/table>\n<blockquote>记忆口诀：<strong>\"TCP 是可靠的双向管道，UDP 是 IP 上加 8 字节端口复用层，其他一概不管。\"<\/strong> \"连接的本质 = 两端协同维护的会话状态\"。<\/blockquote>"}, {"q": "1.3 单播、广播、组播、任播的区别？", "tag": "基础", "body": "<p><strong>标准答案<\/strong>：<\/p>\n<ol><li><strong>单播<\/strong>：一对一（TCP、绝大多数 HTTP）。<\/li><li><strong>广播<\/strong>：一对本网段全部，IPv4 独有（IPv6 用组播代替）。<\/li><li><strong>组播<\/strong>：一对订阅了组地址的多个主机（直播、IPTV、OSPF 用 224.0.0.5）。<\/li><li><strong>任播<\/strong>：多机共享一地址，路由送到最近的一台（DNS 8.8.8.8、CDN）。<\/li><\/ol>\n<blockquote>记忆口诀：<strong>\"TCP 只能单播（要端到端状态），UDP 能播组任；任播+TCP 在 CDN 里是'路由先选中一台，再和那一台建连'，不矛盾。\"<\/strong><\/blockquote>"}, {"q": "1.4 电路交换 vs 分组交换；虚电路 vs 数据报？", "tag": "进阶", "body": "<p><strong>标准答案<\/strong>：<\/p>\n<ol><li><strong>电路交换<\/strong>：先建立独占物理通路（老电话），带宽独占、利用率低、时延稳定。<\/li><li><strong>分组交换<\/strong>：分组独立路由转发，链路共享、利用率高、可能乱序（互联网本质）。<\/li><li>分组交换分两种连接形态：<\/li><\/ol>\n<ul><li><strong>虚电路<\/strong>：发前建逻辑通路，分组同路径（ATM、MPLS、X.25），网络层有状态。<\/li><li><strong>数据报<\/strong>：每包独立选路（IP），无连接无状态可能乱序。<\/li><\/ul>\n<blockquote>记忆口诀：<strong>\"TCP 是端到端有状态，跑在无状态的数据报 IP 之上——这就是端到端原则：可靠性放终端，网络只管转发。\"<\/strong><\/blockquote>"}, {"q": "1.5 \"连接\"在 OSI/TCP-IP 各层分别是什么形态？", "tag": "进阶", "body": "<p><strong>标准答案（五层对照）<\/strong>：<\/p>\n<ul><li><strong>应用层<\/strong>：应用会话/逻辑连接（HTTP Keep-Alive、WebSocket、TLS Session）。<\/li><li><strong>传输层<\/strong>：端到端连接（四元组+状态机，TCP/SCTP）。<\/li><li><strong>网络层<\/strong>：无连接数据报（IP、MPLS LSP）。<\/li><li><strong>链路层<\/strong>：点到点/局域网连接（以太网、PPP、Wi-Fi）。<\/li><li><strong>物理层<\/strong>：物理链路/信道（铜缆、光纤）。<\/li><\/ul>\n<blockquote>记忆口诀：<strong>\"一条网页请求从上到下五层连接：TLS 会话 → TCP → IP 路由 → 以太网 → 光纤。\"能一口气对应完 = 真懂网络。<\/strong><\/blockquote>\n<hr>"}]}, {"title": "02 TCP 三次握手", "questions": [{"q": "2.1 三次握手的过程与每个报文的作用？", "tag": "高频", "body": "<p><strong>标准答案（三步背法）<\/strong>：<\/p>\n<ol><li><strong>客户端 → 服务端<\/strong>：<code>SYN=1, seq=x<\/code>（客户端进 SYN_SENT）。含义：我想连，起始序号 x。<\/li><li><strong>服务端 → 客户端<\/strong>：<code>SYN=1, ACK=1, seq=y, ack=x+1<\/code>（服务端进 SYN_RCVD）。含义：同意，我的起始序号 y，期望你从 x+1 发。<\/li><li><strong>客户端 → 服务端<\/strong>：<code>ACK=1, seq=x+1, ack=y+1<\/code>（双方 ESTABLISHED）。含义：收到，连接建立。<\/li><\/ol>\n<blockquote>记忆口诀：<strong>\"SYN 我来了，SYN+ACK 我同意你来了，ACK 我确认你也收到了我。\"本质是双向确认收发能力 + 序号同步。<\/strong><\/blockquote>"}, {"q": "2.2 为什么是三次握手，不是两次或四次？", "tag": "高频", "body": "<p><strong>标准答案（防失效历史连接）<\/strong>：<\/p>\n<ol><li><strong>为什么不是两次<\/strong>：防<strong>失效的历史 SYN 突然到达<\/strong>。客户端超时重传的 SYN 已建立成功，旧 SYN 才到达——两次握手时服务器会为旧 SYN 分配资源，而客户端根本不认，白占资源。三次握手时服务器回 SYN+ACK，客户端发现不是自己期望的连接，<strong>回 RST 拒绝<\/strong>，服务器识别出失效连接。<\/li><li><strong>为什么不用四次<\/strong>：三次已完成双向收发能力确认 + 序号同步，第四次冗余。<\/li><\/ol>\n<blockquote>记忆口诀：<strong>\"两次握手防不了旧包诈尸；第三次 ACK 是给服务器'确认客户端还活着'的机会，把确认成本前置给发起方。\"<\/strong><\/blockquote>"}, {"q": "2.3 SYN Flood 攻击原理与防护？", "tag": "高频", "body": "<p><strong>标准答案<\/strong>：<\/p>\n<ol><li><strong>原理<\/strong>：伪造大量源 IP 发 SYN，服务器回 SYN+ACK 后等不到 ACK，<strong>半连接队列被占满<\/strong>，正常客户连不上。<\/li><li><strong>防护（四板斧）<\/strong>：<\/li><\/ol>\n<ul><li><strong>SYN Cookie<\/strong>（核心）：不分配半连接资源，把握手信息哈希进 ISN，收到 ACK 现场校验建连。<\/li><li><strong>缩短 SYN 超时<\/strong>：<code>tcp_synack_retries<\/code> 降到 1~2。<\/li><li><strong>网关限速/黑白名单<\/strong>：DDoS 清洗。<\/li><li><strong>调大 <code>tcp_max_syn_backlog<\/code><\/strong>：扩容缓解不治本。<\/li><\/ul>\n<blockquote>记忆口诀：<strong>\"Cookie 是溢出时的兜底，队列容量是第一道防线。\"代价：SYN Cookie 下窗口缩放/SACK 等选项无法协商。<\/strong><\/blockquote>"}, {"q": "2.4 三次握手可以携带数据吗？", "tag": "进阶", "body": "<p><strong>标准答案<\/strong>：<\/p>\n<ol><li><strong>第一次 SYN<\/strong>：不能带（服务端未确认客户端身份，带数据会放大 SYN Flood 攻击面）。<\/li><li><strong>第二次 SYN+ACK<\/strong>：不能带。<\/li><li><strong>第三次 ACK<\/strong>：<strong>可以带<\/strong>（已确认服务器可达，捎带首包数据省一个 RTT）。<\/li><\/ol>\n<blockquote>记忆口诀：<strong>\"前两次不带防伪造，第三次捎带是合法操作。TCP Fast Open 更进一步：Cookie 认证后 SYN 直接带数据，实现 0-RTT。\"<\/strong><\/blockquote>"}, {"q": "2.5 TCP 初始序列号（ISN）为什么不能固定？", "tag": "进阶", "body": "<p><strong>标准答案<\/strong>：<\/p>\n<ol><li>固定 ISN 可被<strong>预测伪造<\/strong>，实施会话劫持（TCP Spoofing）。<\/li><li>固定 ISN 会让旧连接遗留报文与新连接序号<strong>重叠污染<\/strong>。<\/li><li>现代实现（RFC 1948）：ISN = 时钟 + 四元组相关随机哈希（Linux <code>secure_tcp_seq()<\/code>）。<\/li><\/ol>\n<blockquote>记忆口诀：<strong>\"ISN 随机化防预测、防新旧串扰；也解释了 TIME_WAIT 2MSL 后旧报文必然消亡——随机序号+时间窗双重保险。\"<\/strong><\/blockquote>\n<hr>"}]}, {"title": "03 TCP 四次挥手", "questions": [{"q": "3.1 四次挥手的过程？", "tag": "高频", "body": "<p><strong>标准答案（A 主动关闭）<\/strong>：<\/p>\n<ol><li><strong>A → B<\/strong>：<code>FIN=1, seq=u<\/code>（A 进 FIN_WAIT_1）。我发完了，关发送方向。<\/li><li><strong>B → A<\/strong>：<code>ACK=1, ack=u+1<\/code>（B 进 CLOSE_WAIT，A 进 FIN_WAIT_2）。收到，我还有数据。<\/li><li><strong>B → A<\/strong>：<code>FIN=1, seq=w<\/code>（B 进 LAST_ACK）。我也发完了。<\/li><li><strong>A → B<\/strong>：<code>ACK=1, ack=w+1<\/code>（A 进 TIME_WAIT，等 2MSL；B 收到即 CLOSED）。<\/li><\/ol>\n<blockquote>记忆口诀：<st
