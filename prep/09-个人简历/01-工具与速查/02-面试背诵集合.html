eption（checked 异常默认不回滚，需 <code>rollbackFor = Exception.class<\/code>）。<\/li><li>数据库引擎不支持事务（MyISAM）。<\/li><li>传播行为配置错误（REQUIRES_NEW 内层回滚不影响外层等）。<\/li><li><code>final<\/code> 方法/类被 CGLIB 代理后无法覆盖。<\/li><\/ol>\n<blockquote>加分点：默认传播 REQUIRED（加入当前事务）；默认回滚规则 = RuntimeException/Error 回滚、checked 异常不回滚（Spring 设计哲学：checked 异常表示可预期业务异常，不该回滚）。<\/blockquote>"}, {"q": "9.6 事务传播行为有哪几种？", "tag": "进阶", "body": "<ul><li><strong>REQUIRED<\/strong>（默认）：有则加入，无则新建。<\/li><li><strong>REQUIRES_NEW<\/strong>：总是新建，挂起外层事务（常用于日志、MQ 发送）。<\/li><li><strong>SUPPORTS<\/strong>：有则加入，无则非事务执行。<\/li><li><strong>NOT_SUPPORTED<\/strong>：非事务执行，挂起外层。<\/li><li><strong>MANDATORY<\/strong>：必须有事务，否则抛异常。<\/li><li><strong>NEVER<\/strong>：必须无事务，有则抛异常。<\/li><li><strong>NESTED<\/strong>：嵌套事务（savepoint 回滚点，外层回滚内层必回滚，内层回滚不影响外层）——<strong>只对 DataSourceTransactionManager 有效<\/strong>。<\/li><\/ul>"}, {"q": "9.7 Spring 中单例 Bean 的线程安全问题", "tag": "高频", "body": "<ul><li>单例 Bean 默认线程不安全：有状态字段（非 final 的 mutable 字段）并发读写。<\/li><li>解决：① 无状态设计（Controller/Service 只放方法参数）；② ThreadLocal 存有状态数据；③ 加锁；④ 换成原型作用域（@Scope(\"prototype\")，如非线程安全的 SimpleDateFormat）。<\/li><\/ul>"}, {"q": "9.8 @Autowired 与 @Resource 的区别", "tag": "基础", "body": "<table><thead><tr><th>维度<\/th><th>@Autowired<\/th><th>@Resource<\/th><\/tr><\/thead><tbody><tr><td>来源<\/td><td>Spring<\/td><td>JSR-250（JDK 标准）<\/td><\/tr><tr><td>装配方式<\/td><td><strong>byType<\/strong> 优先<\/td><td><strong>byName<\/strong> 优先（name 缺省用字段名）<\/td><\/tr><tr><td>存在多个同类型<\/td><td>按字段名找，找不到报错（需 @Qualifier）<\/td><td>按 name 找<\/td><\/tr><tr><td>required<\/td><td>可配 required=false<\/td><td>无<\/td><\/tr><\/tbody><\/table>\n<blockquote>加分点：构造器注入优先（final + 不可变 + 循环依赖提前暴露）；字段注入虽方便但破坏封装、难单测。<\/blockquote>\n<hr>"}]}, {"title": "10 Spring Boot 与微服务", "questions": [{"q": "10.1 Spring Boot 自动装配原理", "tag": "高频", "body": "<p><strong>核心注解<\/strong>：<code>@SpringBootApplication = @SpringBootConfiguration + @EnableAutoConfiguration + @ComponentScan<\/code>。<br><strong>自动装配流程<\/strong>：<\/p>\n<ol><li><code>@EnableAutoConfiguration<\/code> 导入 <code>AutoConfigurationImportSelector<\/code>。<\/li><li>读取 <code>META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports<\/code>（Spring Boot 2.7 起）中所有自动配置类（如 RedisAutoConfiguration、DataSourceAutoConfiguration）。<\/li><li>逐类用 <code>@Conditional*<\/code> 条件注解判断是否生效（<code>@ConditionalOnClass<\/code>：classpath 有类才装配；<code>@ConditionalOnMissingBean<\/code>：用户已定义则不覆盖；<code>@ConditionalOnProperty<\/code>：配置项开启）。<\/li><li>装配的 Bean 绑定 <code>@ConfigurationProperties<\/code>（如 <code>spring.redis.*<\/code>）。<\/li><\/ol>\n<blockquote>加分点：<strong>自动装配是\"按条件加载的默认配置 + 用户可覆盖\"<\/strong>；Spring Boot 3 后 imports 文件路径变化，且强制 Java 17 + Spring 6。<\/blockquote>"}, {"q": "10.2 Spring Boot 启动流程（run 方法做了什么）", "tag": "高频", "body": "<ol><li>创建 <code>SpringApplication<\/code>，推断 Web 应用类型、加载 ApplicationContextInitializer/ApplicationListener（SPI）。<\/li><li>调用 <code>run()<\/code>：<code>SpringApplicationRunListeners.starting()<\/code>（事件发布）→ 创建 Environment（配置解析）→ 打印 Banner → 创建 ApplicationContext（AnnotationConfigServletWebServerApplicationContext）→ <strong>prepareContext<\/strong>（注册启动类）→ <strong>refreshContext<\/strong>（核心：<code>refresh()<\/code> 即 Spring 容器启动全流程，见 9.2）→ afterRefresh → <code>listeners.started()<\/code> → 执行 <code>CommandLineRunner<\/code>/<code>ApplicationRunner<\/code> → <code>listeners.running()<\/code>。<\/li><\/ol>\n<blockquote>加分点：<code>refresh()<\/code> 是 Spring 容器启动的心脏（BeanFactory 创建、BeanDefinition 注册、Bean 实例化、内嵌 Tomcat 启动、Web 容器初始化）；Runner 用于启动后初始化数据。<\/blockquote>"}, {"q": "10.3 starter 原理与自定义 starter", "tag": "进阶", "body": "<ul><li><strong>starter<\/strong> = 一组自动配置 + 依赖管理：<code>mybatis-spring-boot-starter<\/code> 内含 <code>xxxAutoConfiguration<\/code> + <code>spring.factories<\/code>/imports 注册。<\/li><li>自定义 starter 步骤：① 写自动配置类（@Configuration + @EnableConfigurationProperties）；② META-INF 下注册；③ 依赖打包。<\/li><li><strong>@ConfigurationProperties 与 @Value<\/strong>：前者类型安全、支持校验（@Validated）、可复用，推荐用于配置类。<\/li><\/ul>"}, {"q": "10.4 @Configuration 与 @Component 的区别（CGLIB 代理）", "tag": "进阶", "body": "<ul><li><code>@Configuration<\/code> 类被 <strong>CGLIB 增强<\/strong>（<code>ConfigurationClassEnhancer<\/code>）→ 类内 <code>@Bean<\/code> 方法互调时返回<strong>同一个单例<\/strong>（不做代理则每次 new）。<\/li><li><code>@Component<\/code> 不增强 → <code>@Bean<\/code> 方法互调会创建多个实例。<\/li><li>因此 <code>@Configuration<\/code> 中 @Bean 方法互调是安全的；若为 Lite 模式（@Component 或 proxyBeanMethods=false）互调则不走单例池。<\/li><\/ul>\n<blockquote>加分点：<code>@Configuration(proxyBeanMethods = false)<\/code> 是 <strong>Lite 模式<\/strong>——启动更快（少生成代理类），适合无内部互调的配置类；Spring Boot 内部大量使用 Lite 模式。<\/blockquote>"}, {"q": "10.5 Spring Cloud 核心组件与职责", "tag": "高频", "body": "<table><thead><tr><th>组件<\/th><th>职责<\/th><th>常见实现<\/th><\/tr><\/thead><tbody><tr><td>注册中心<\/td><td>服务发现/健康检查<\/td><td>Eureka（AP）、Nacos（AP/CP 可选）、Consul<\/td><\/tr><tr><td>配置中心<\/td><td>动态配置<\/td><td>Nacos Config、Spring Cloud Config<\/td><\/tr><tr><td>网关<\/td><td>路由/鉴权/限流/聚合<\/td><td>Spring Cloud Gateway（WebFlux 响应式）<\/td><\/tr><tr><td>负载均衡<\/td><td>客户端负载<\/td><td>LoadBalancer（替代 Ribbon）<\/td><\/tr><tr><td>熔断降级<\/td><td>故障隔离<\/td><td>Sentinel、Resilience4j（替代 Hystrix）<\/td><\/tr><tr><td>链路追踪<\/td><td>全链路监控<\/td><td>Sleuth + Zipkin / SkyWalking<\/td><\/tr><tr><td>服务调用<\/td><td>声明式 HTTP<\/td><td>OpenFeign<\/td><\/tr><\/tbody><\/table>\n<blockquote>加分点：<strong>CAP 权衡<\/strong>：Eureka 是 AP（宁可注册表不一致也要可用），Consul/Nacos-CP 是 CP（宁可不可用也不给错误数据）；生产常用 Nacos——临时实例 AP、持久实例 CP。<\/blockquote>"}, {"q": "10.6 微服务拆分原则与常见问题", "tag": "进阶", "body": "<ul><li>拆分维度：业务域（DDD 限界上下文）、团队结构（康威定律）、独立演进/独立部署。<\/li><li>常见坑：分布式事务（见 12.1）、分布式锁（12.2）、配置漂移、服务间调用链过长（>3 跳考虑聚合）、数据一致性、故障蔓延（熔断/隔离/降级/限流四件套）。<\/li><\/ul>\n<hr>"}]}, {"title": "11 设计模式与场景题", "questions": [{"q": "11.1 单例模式的 5 种写法对比", "tag": "高频", "body": "<table><thead><tr><th>写法<\/th><th>线程安全<\/th><th>懒加载<\/th><th>备注<\/th><\/tr><\/thead><tbody><tr><td>饿汉（static final）<\/td><td>✅<\/td><td>❌<\/td><td>类加载即创建<\/td><\/tr><tr><td>懒汉（方法加锁）<\/td><td>✅<\/td><td>✅<\/td><td>性能差<\/td><\/tr><tr><td><strong>DCL + volatile<\/strong><\/td><td>✅<\/td><td>✅<\/td><td>推荐<\/td><\/tr><tr><td>静态内部类 Holder<\/td><td>✅<\/td><td>✅<\/td><td>JVM 保证初始化唯一<\/td><\/tr><tr><td><strong>枚举<\/strong><\/td><td>✅<\/td><td>天然<\/td><td><strong>防反射、防序列化破坏<\/strong>，最佳<\/td><\/tr><\/tbody><\/table>\n<blockquote>加分点：反射可破坏除枚举外的所有单例（Constructor.setAccessible）；序列化反序列化也会产生新实例（需 readResolve）；枚举底层是类 + static final 字段，天然免疫。<\/blockquote>"}, {"q": "11.2 策略 / 模板方法 / 责任链 模式（源码中的应用）", "tag": "进阶", "body": "<ul><li><strong>策略<\/strong>：算法族封装（<code>Comparator<\/code>、线程池拒绝策略、<code>RejectedExecutionHandler<\/code>、Spring <code>Resource<\/code> 解析）。<\/li><li><strong>模板方法<\/strong>：父类定骨架、子类实现细节（AQS 的 tryAcquire、Spring <code>JdbcTemplate<\/code>、<code>AbstractApplicationContext.refresh<\/code>）。<\/li><li><strong>责任链<\/strong>：请求沿链传递（Servlet Filter、Netty ChannelPipeline、MyBatis 插件 Interceptor、Spring MVC HandlerInterceptor）。<\/li><li><strong>工厂<\/strong>：BeanFactory（抽象工厂）、静态工厂 <code>Integer.valueOf<\/code>、简单工厂（Calendar）。<\/li><\/ul>"}, {"q": "11.3 动态代理的实现方式与选择", "tag": "高频", "body": "<ul><li>JDK 动态代理：接口 + InvocationHandler；CGLIB：继承 + MethodInterceptor。<\/li><li>Spring AOP 默认选择逻辑：<strong>有接口且未强制 → JDK 代理；否则 CGLIB<\/strong>。<\/li><li>对比：JDK 代理仅能代理接口方法，但无需额外依赖；CGLIB 可代理类但 final 无法代理、生成子类。<\/li><li><strong>静态代理 vs 动态代理<\/strong>：静态代理写死目标类；动态代理运行时生成。<\/li><\/ul>"}, {"q": "11.4 观察者模式与 Spring 事件机制", "tag": "进阶", "body": "<ul><li>Spring 事件：<code>ApplicationEvent<\/code> + <code>@EventListener<\/code>/<code>ApplicationListener<\/code> + <code>ApplicationEventPublisher.publishEvent<\/code>。<\/li><li>默认<strong>同步<\/strong>执行（发布线程阻塞）；<code>@Async<\/code> + <code>@EnableAsync<\/code> 可异步；支持泛型事件精确匹配。<\/li><li>用途：业务解耦（下单 → 发短信/发积分/写日志，避免主流程阻塞）。<\/li><li>对比 MQ：进程内事件用 Spring Event，跨服务用 MQ。<\/li><\/ul>"}, {"q": "11.5 高频场景题：如何实现接口幂等？", "tag": "高频", "body": "<ol><li><strong>唯一索引/唯一键<\/strong>：数据库约束兜底（最可靠）。<\/li><li><strong>Token 令牌机制<\/strong>：请求前发 token，请求时校验并删除（Redis SETNX）。<\/li><li><strong>状态机<\/strong>：订单状态流转，重复请求状态不匹配直接返回。<\/li><li><strong>去重表<\/strong>：业务唯一键 + 状态标记。<\/li><li><strong>乐观锁<\/strong>：version 字段，update where version=?。<\/li><\/ol>\n<ul><li>判定幂等键：用户 ID + 业务参数 hash 或全局 ID（见 12.3）。<\/li><\/ul>"}, {"q": "11.6 SOLID 设计原则", "tag": "基础", "body": "<ul><li><strong>S<\/strong> 单一职责：一个类一个职责。<\/li><li><strong>O<\/strong> 开闭：对扩展开放、对修改关闭（策略/模板方法）。<\/li><li><strong>L<\/strong> 里氏替换：子类可替换父类且行为不破坏。<\/li><li><strong>I<\/strong> 接口隔离：接口按调用方细分。<\/li><li><strong>D<\/strong> 依赖倒置：面向接口编程，依赖抽象不依赖具体。<\/li><\/ul>\n<blockquote>加分点：日常 Review 时 SOLID 是最实用的一把尺子；配合\"高内聚低耦合\"一起答。<\/blockquote>\n<hr>"}]}, {"title": "12 分布式与中间件原理", "questions": [{"q": "12.1 分布式事务方案对比", "tag": "高频", "body": "<table><thead><tr><th>方案<\/th><th>原理<\/th><th>一致性<\/th><th>适用<\/th><\/tr><\/thead><tbody><tr><td>2PC/XA<\/td><td>准备→提交，两阶段<\/td><td>强一致<\/td><td>短事务、跨库少<\/td><\/tr><tr><td><strong>TCC<\/strong><\/td><td>Try-Confirm-Cancel 补偿<\/td><td>最终一致<\/td><td>业务可拆分（账户/库存）<\/td><\/tr><tr><td><strong>Saga<\/strong><\/td><td>正向流程 + 反向补偿<\/td><td>最终一致<\/td><td>长事务、异步<\/td><\/tr><tr><td><strong>Seata AT<\/strong><\/td><td>全局锁 + 回滚日志 undo_log<\/td><td>最终一致<\/td><td>对业务侵入最小<\/td><\/tr><tr><td>本地消息表 + MQ<\/td><td>事务消息（RocketMQ）<\/td><td>最终一致<\/td><td>异步解耦<\/td><\/tr><\/tbody><\/table>\n<blockquote>加分点：2PC 缺点——同步阻塞、协调者单点、数据不一致窗口；TCC 需要业务实现 Try/Confirm/Cancel 三方法（侵入高）；Seata AT 用全局事务管理器 + undo_log 自动生成反向 SQL，代价是性能与全局锁。<\/blockquote>"}, {"q": "12.2 分布式锁的实现与对比", "tag": "高频", "body": "<table><thead><tr><th>方案<\/th><th>优点<\/th><th>缺点<\/th><\/tr><\/thead><tbody><tr><td><strong>Redis SET NX EX<\/strong><\/td><td>快、简单<\/td><td>主从切换丢锁（需 Redlock/Redisson watchDog 续期）<\/td><\/tr><tr><td><strong>ZooKeeper 临时顺序节点<\/strong><\/td><td>强一致、无过期风险<\/td><td>性能差、依赖 ZK<\/td><\/tr><tr><td><strong>数据库唯一键/乐观锁<\/strong><\/td><td>简单<\/td><td>性能差、单点<\/td><\/tr><\/tbody><\/table>\n<p><strong>Redis 分布式锁要点<\/strong>：<code>SET lockKey clientId NX EX 30<\/code>（原子）→ 业务 → Lua 脚本比对 clientId 再 DEL（<strong>防误删别人锁<\/strong>）→ 看门狗自动续期（Redisson）。<br><strong>Redlock<\/strong>：多数节点加锁成功才算成功，解决主从切换问题（但仍被业界质疑，需权衡）。<\/p>\n<blockquote>加分点：Redis 锁本质是\"CP 服务当 AP 用\"的妥协；极致一致性场景选 ZK/etcd。<\/blockquote>"}, {"q": "12.3 分布式 ID 方案", "tag": "高频", "body": "<ol><li><strong>UUID<\/strong>：本地生成，无序、长、无业务含义 → 不适合作主键（页分裂）。<\/li><li><strong>数据库自增/号段模式<\/strong>：批量取号（如一次取 1000 个），简单可靠，需维护号段表。<\/li><li><strong>Redis INCR<\/strong>：快，但依赖 Redis、持久化可能丢号。<\/li><li><strong>雪花算法 Snowflake<\/strong>：<code>时间戳(41) + 机器ID(10) + 序列号(12)<\/code>，64 位 Long，<strong>趋势递增<\/strong>、无依赖、QPS 高；坑：时钟回拨（可等待/备用位/内存序列）。<\/li><li><strong>美团 Leaf / 百度 UidGenerator<\/strong>：雪花 + 号段结合。<\/li><\/ol>"}, {"q": "12.4 消息队列选型与消息可靠性", "tag": "高频", "body": "<table><thead><tr><th>MQ<\/th><th>特点<\/th><\/tr><\/thead><tbody><tr><td>Kafka<\/td><td>高吞吐、日志流、分区有序，可能重复消费，适合大数据/日志<\/td><\/tr><tr><td>RocketMQ<\/td><td>事务消息、延迟消息、死信队列，适合金融/订单<\/td><\/tr><tr><td>RabbitMQ<\/td><td>功能全、管理界面友好，吞吐相对低，适合中小规模<\/td><\/tr><tr><td>Pulsar<\/td><td>存算分离、多租户，云原生<\/td><\/tr><\/tbody><\/table>\n<p><strong>可靠性三阶段<\/strong>：生产端（confirm 确认 + 重试）、Broker（持久化 + 多副本）、消费端（<strong>手动 ACK + 消费幂等<\/strong>）。<br><strong>消息积压处理<\/strong>：扩容消费者 → 临时转存（堆积消息先 dump 到 Redis/文件再慢慢消费）→ 排查慢消费原因。<br><strong>顺序消息<\/strong>：Kafka 同分区有序（按 key hash 到同一分区）；RocketMQ 普通消息要保序需顺序队列 + 单消费者。<\/p>"}, {"q": "12.5 限流算法对比", "tag": "进阶", "body": "<table><thead><tr><th>算法<\/th><th>原理<\/th><th>特点<\/th><\/tr><\/thead><tbody><tr><td>计数器<\/td><td>固定窗口计数<\/td><td>临界突刺问题<\/td><\/tr><tr><td><strong>滑动窗口<\/strong><\/td><td>细分子窗口<\/td><td>平滑，主流（Sentinel 默认）<\/td><\/tr><tr><td><strong>令牌桶<\/strong><\/td><td>匀速放令牌，可突发<\/td><td>允许突发流量（Guava RateLimiter）<\/td><\/tr><tr><td>漏桶<\/td><td>匀速流出<\/td><td>强制平滑，无法突发<\/td><\/tr><\/tbody><\/table>\n<blockquote>加分点：分布式限流 = Redis + Lua 原子操作（计数/令牌）；单机限流用 Guava/Sentinel；网关层 + 应用层双层限流。<\/blockquote>"}, {"q": "12.6 缓存一致性：Cache Aside 与延迟双删", "tag": "高频", "body": "<ul><li><strong>Cache Aside（旁路缓存）<\/strong>：读 miss 查库回填；写 = <strong>先更新 DB，再删缓存<\/strong>（不是更新缓存）。<\/li><li>为什么删缓存而非更新缓存：并发写场景更新缓存会产生旧数据污染，删除更简单安全。<\/li><li><strong>延迟双删<\/strong>：更新 DB → 删缓存 → <strong>sleep 短暂时间<\/strong> → 再删一次（兜底读线程回填的旧值）。<\/li><li>极端一致方案：订阅 binlog（Canal）→ 异步删除缓存；DB 与缓存用事务消息保证最终一致。<\/li><\/ul>\n<blockquote>加分点：先删缓存再更新 DB 的风险更大（删后读请求回填旧值）；缓存穿透/击穿/雪崩的防御：布隆过滤器、互斥锁重建、过期时间加随机值、多级缓存——详见《Redis 深度面试题库》第 9 章。<\/blockquote>"}, {"q": "12.7 高并发系统设计的通用套路", "tag": "进阶", "body": "<ol><li><strong>读多写少<\/strong>：缓存 + CDN + 多级缓存。<\/li><li><strong>写多<\/strong>：MQ 削峰填谷、批量写、分库分表。<\/li><li><strong>热点数据<\/strong>：本地缓存 + 热 key 探测 + 备份 key。<\/li><li><strong>防止雪崩<\/strong>：限流、熔断、降级、隔离（线程池/信号量）、超时控制、重试退避。<\/li><li><strong>链路保护<\/strong>：超时（连接/读/写三层）+ 重试幂等 + 熔断（错误率阈值）+ 优雅降级（返回默认值）。<\/li><li><strong>容量评估<\/strong>：QPS × 峰值系数 → 压测定阈值 → 监控告警（Prometheus + Grafana）。<\/li><\/ol>\n<blockquote>加分点：面试答系统设计题遵循\"<strong>场景 → 约束 → 方案 → 细节 → 容灾<\/strong>\"五步法，先澄清 QPS/数据量/一致性要求再动手。<\/blockquote>\n<hr>"}]}, {"title": "附 面试复习路线图", "questions": [], "intro": "<ul><li><strong>第一层（必背）<\/strong>：JVM 内存模型、类加载、GC 算法与收集器、HashMap 源码、synchronized/volatile、线程池、JMM。<\/li><li><strong>第二层（原理）<\/strong>：AQS、ConcurrentHashMap、ThreadLocal、Spring IOC/AOP/循环依赖/事务、Netty 线程模型。<\/li><li><strong>第三层（场景）<\/strong>：分布式锁/事务/ID、缓存一致性、限流熔断、幂等设计、系统设计五步法。<\/li><li><strong>关联文档<\/strong>：数据库 →《MySQL 深度面试题库》；缓存 →《Redis 深度面试题库》。<\/li><li><strong>备考建议<\/strong>：先画 JVM/并发/Spring 三张脑图，再对着高频题口述 1 分钟版 + 追问版，最后用 jstack/jstat/Arthas 实操验证。<\/li><\/ul>\n<blockquote>祝面试顺利！知其然，更知其所以然。<\/blockquote>"}], "qcount": 91}]}, {"id": "mysql", "name": "MySQL", "icon": "🐬", "color": "#3b82f6", "docs": [{"sub": "追问链冲刺版", "chapters": [{"title": "00 怎么用这份追问链", "questions": [], "intro": "<p><strong>面试的真相<\/strong>：面试官几乎不会只问\"主问题\"，而是顺着你的回答往下钻——你说 B+ 树，他问\"为什么不用跳表\"；你说 MVCC，他问\"ReadView 怎么判断可见性\"；你说两阶段提交，他问\"崩溃后怎么判断提交还是回滚\"。<strong>能扛到第几层，决定你值多少钱。<\/strong><\/p>\n<p><strong>每条追问链的结构<\/strong>：<\/p>\n<ul><li><strong>L0 主问题<\/strong>：面试的切入点，必须流畅。<\/li><li><strong>L1~L5 追问<\/strong>：层层递进，每层标注「考察意图」，答不上就停在这层的深度。<\/li><li><strong>目标<\/strong>：普通岗位答到 L2，核心岗位冲到 L3+，资深/架构岗尽量 L4~L5。<\/li><\/ul>\n<p><strong>使用建议<\/strong>：先自己对着 L0 回答，再逐层往下看，标记自己断在哪一层，重点补那一层的薄弱点。<\/p>\n<hr>"}, {"title": "追问链总览", "questions": [], "intro": "<table><thead><tr><th>#<\/th><th>追问链<\/th><th>核心考点<\/th><th>纵深<\/th><\/tr><\/thead><tbody><tr><td>01<\/td><td>一条 SQL 的执行链路<\/td><td>分层架构 / 查询缓存 / 优化器<\/td><td>L5<\/td><\/tr><tr><td>02<\/td><td>为什么是 B+ 树<\/td><td>索引结构 / 页分裂 / 跳表对比<\/td><td>L5<\/td><\/tr><tr><td>03<\/td><td>聚簇·回表·覆盖索引<\/td><td>索引存储 / 回表代价 / MRR<\/td><td>L4<\/td><\/tr><tr><td>04<\/td><td>最左前缀原则<\/td><td>联合索引 / 范围失效 / 设计<\/td><td>L4<\/td><\/tr><tr><td>05<\/td><td>事务隔离与 MVCC<\/td><td>隔离级别 / ReadView / undo<\/td><td>L5<\/td><\/tr><tr><td>06<\/td><td>幻读与 next-key lock<\/td><td>间隙锁 / 当前读 / 边界<\/td><td>L4<\/td><\/tr><tr><td>07<\/td><td>锁分类与死锁<\/td><td>意向锁 / MDL / 死锁检测<\/td><td>L4<\/td><\/tr><tr><td>08<\/td><td>redo·binlog·两阶段提交<\/td><td>日志 / 崩溃恢复 / 组提交<\/td><td>L5<\/td><\/tr><tr><td>09<\/td><td>主从复制与延迟<\/td><td>复制原理 / 并行复制 / GTID<\/td><td>L4<\/td><\/tr><tr><td>10<\/td><td>分库分表<\/td><td>分片键 / 基因法 / 跨库难题<\/td><td>L4<\/td><\/tr><tr><td>11<\/td><td>缓存一致性<\/td><td>缓存策略 / canal / 三大问题<\/td><td>L4<\/td><\/tr><tr><td>12<\/td><td>Buffer Pool 与内存<\/td><td>LRU 冷热区 / 脏页 / 命中率<\/td><td>L4<\/td><\/tr><tr><td>13<\/td><td>一条 UPDATE 的完整链路<\/td><td>综合压轴 / 全链路串讲<\/td><td>L5<\/td><\/tr><\/tbody><\/table>\n<hr>"}, {"title": "🔥 追问链 01｜一条 SQL 的执行链路", "questions": [{"q": "L0 · 主问题：一条 SELECT 语句的完整执行流程？", "tag": "", "body": "<blockquote>考察意图：是否真正理解 MySQL 分层架构，能否从\"背流程\"深入到\"为什么这样设计\"。<\/blockquote>\n<p><strong>答<\/strong>：<code>客户端 → 连接器 → 分析器 → 优化器 → 执行器 → 存储引擎<\/code>。连接器做 TCP 握手、鉴权、权限缓存；分析器做词法/语法分析生成语法树；优化器决定执行计划（选哪个索引、连接顺序）；执行器调用存储引擎接口取数；存储引擎真正读写数据。<\/p>"}, {"q": "L1 · 追问：8.0 为什么把查询缓存移除了？", "tag": "", "body": "<p><strong>答<\/strong>：查询缓存以 SQL 文本为 key 缓存结果集，<strong>只要表有任何更新，该表所有缓存整体失效<\/strong>；高并发下命中率低，且缓存维护、失效加锁反而成为瓶颈。缓存应由应用层（Redis）按业务语义来做，而不是数据库按 SQL 文本做。<\/p>"}, {"q": "L2 · 追问：优化器怎么决定走哪个索引？", "tag": "", "body": "<p><strong>答<\/strong>：基于<strong>代价模型（Cost Model）<\/strong>，不是规则：根据统计信息（<code>innodb_stats_*<\/code>、表行数、索引区分度/基数 cardinality）估算不同执行计划的 CPU + IO 代价，选代价最小的。这也是为什么 <code>rows<\/code> 是<strong>估算值<\/strong>、统计信息失真会导致\"明明有索引却走全表扫描\"。<\/p>"}, {"q": "L3 · 追问：执行器和存储引擎是怎么交互的？", "tag": "", "body": "<p><strong>答<\/strong>：通过统一的 <code>handler<\/code> 抽象接口。Server 层不直接碰数据文件，只调用 <code>handler<\/code> 的 <code>open/read_first/read_next/index_read<\/code> 等方法，具体读写由各引擎实现。这就是\"插件式存储引擎\"能换引擎的原因。<\/p>"}, {"q": "L4 · 追问：权限到底在哪里检查？为什么不是连接器一次查完？", "tag": "", "body": "<p><strong>答<\/strong>：连接器阶段先读一次权限并<strong>缓存到连接会话<\/strong>；执行器在打开表时再校验一次（在优化器之后）。注意顺序：<strong>优化器不检查权限，执行器才检查<\/strong>。若连接建立后权限被修改，需重连或用 <code>FLUSH PRIVILEGES<\/code> 才生效。<\/p>"}, {"q": "L5 · 追问：如果这是一条 UPDATE，流程会多出什么？", "tag": "", "body": "<p><strong>答<\/strong>：多出<strong>日志与两阶段提交<\/strong>：定位行加锁（当前读）→ 改内存页 → 写 undo（用于回滚/MVCC）→ 写 redo(PREPARE) → 写 binlog → redo(COMMIT) → 返回，脏页延迟刷盘。核心是 redo 与 binlog 用<strong>两阶段提交<\/strong>保证崩溃恢复时二者一致。详见追问链 08。<\/p>\n<hr>"}]}, {"title": "🔥 追问链 02｜为什么是 B+ 树", "questions": [{"q": "L0 · 主问题：MySQL 为什么用 B+ 树做索引？", "tag": "", "body": "<blockquote>考察意图：索引结构的选型依据，以及能否算清\"磁盘 IO 次数\"这个本质。<\/blockquote>\n<p><strong>答<\/strong>：索引要同时支持<strong>等值、范围、排序<\/strong>查询，且要<strong>减少磁盘 IO<\/strong>。B+ 树非叶子只存键+指针、叶子存数据并双向链表相连，扇出大、树矮、范围查询快、查询路径等长，完美契合磁盘场景。<\/p>"}, {"q": "L1 · 追问：哈希表、红黑树、B 树为什么不行？", "tag": "", "body": "<p><strong>答<\/strong>：哈希表等值 O(1) 但不支持范围/排序/前缀匹配；红黑树/AVL 是二叉树，千万级数据 20+ 层 = 20+ 次随机磁盘 IO；B 树非叶子也存数据，扇出小、树更高，范围查询要中序遍历。<\/p>"}, {"q": "L2 · 追问：说\"3 层就能存 2000 万\"，具体怎么算的？", "tag": "", "body": "<p><strong>答<\/strong>：InnoDB 一页 16KB。非叶子节点每项 = 主键 8B + 指针 6B ≈ 14B，一页约装 <code>16KB/14B ≈ 1170<\/code> 个分叉。叶子节点假设一行 1KB，一页约 16 行。三层 B+ 树：<code>1170 × 1170 × 16 ≈ 2190 万行<\/code>，即<strong>最多 3 次磁盘 IO<\/strong>（根页常驻内存时实际 2 次）。<\/p>"}, {"q": "L3 · 追问：主键为什么推荐自增？不自增会怎样？", "tag": "", "body": "<p><strong>答<\/strong>：自增主键是<strong>顺序追加写<\/strong>，新记录总是落在最右叶子，几乎不引发页分裂；UUID/随机主键无序，插入时频繁<strong>页分裂<\/strong>，产生碎片、随机 IO，且二级索引要冗余存主键，主键越宽，二级索引越占空间。可答：雪花算法/号段生成<strong>趋势递增<\/strong>的 bigint 是生产常用折中。<\/p>"}, {"q": "L4 · 追问：页分裂具体发生了什么？", "tag": "", "body": "<p><strong>答<\/strong>：当叶子页写满还要插入时，InnoDB 申请一个新页，把原页约一半数据搬过去，再更新父节点指针，插入新值。主键有序时新页追加在尾部，几乎不搬数据；主键随机时插入点落在中间，频繁搬一半数据，产生大量碎片和随机 IO。<\/p>"}, {"q": "L5 · 追问：那为什么不用跳表（Skip List）？Redis 不是用跳表吗？", "tag": "", "body": "<p><strong>答<\/strong>：跳表也是 O(log n)，但它是<strong>内存数据结构<\/strong>：节点靠多层随机指针串联，指针跳转在内存里很快，但在磁盘上是<strong>随机 IO<\/strong>，且跳表节点不按页对齐、扇出小、树高，无法像 B+ 树那样把连续键紧凑塞进一页实现顺序预读。一句话：<strong>跳表为内存优化，B+ 树为磁盘优化<\/strong>，介质决定结构。<\/p>\n<hr>"}]}, {"title": "🔥 追问链 03｜聚簇·回表·覆盖索引", "questions": [{"q": "L0 · 主问题：聚簇索引、二级索引、回表、覆盖索引分别是什么？", "tag": "", "body": "<blockquote>考察意图：索引的物理存储模型，以及\"回表\"这个性能痛点的本质与解法。<\/blockquote>\n<p><strong>答<\/strong>：聚簇索引（主键）叶子存<strong>整行数据<\/strong>；二级索引叶子存\"索引列 + 主键值\"；用二级索引查到主键后、再回聚簇索引查整行叫<strong>回表<\/strong>；查询所需列全部在索引里、不用回表叫<strong>覆盖索引<\/strong>。<\/p>"}, {"q": "L1 · 追问：表没有主键怎么办？", "tag": "", "body": "<p><strong>答<\/strong>：InnoDB 按优先级选：① 第一个<strong>非空唯一索引<\/strong>；② 都没有则生成隐藏的 6 字节 <code>ROW_ID<\/code> 作聚簇索引。所以最好显式建主键，避免依赖隐藏 row_id（不可控、不能复用）。<\/p>"}, {"q": "L2 · 追问：二级索引为什么存主键值，而不是存行指针（MyISAM 那样）？", "tag": "", "body": "<p><strong>答<\/strong>：因为聚簇索引的<strong>数据会随主键变更/页分裂而移动<\/strong>。若二级索引存物理地址，数据一移动所有二级索引都要更新；存主键值（逻辑地址），数据移动时二级索引不用动，代价只是多一次回表。这是 InnoDB 与 MyISAM 的核心差异。<\/p>"}, {"q": "L3 · 追问：EXPLAIN 里怎么看出是覆盖索引、还是用了 ICP？", "tag": "", "body": "<p><strong>答<\/strong>：<code>Extra<\/code> 列。<code>Using index<\/code> = 覆盖索引（不回表，最优）；<code>Using index condition<\/code> = 索引下推 ICP（引擎层先过滤，减少回表）；<code>Using where<\/code> = Server 层过滤；<code>Using filesort<\/code>/<code>Using temporary<\/code> 是警告信号。<\/p>"}, {"q": "L4 · 追问：回表的代价是什么？MRR 怎么优化？", "tag": "", "body": "<p><strong>答<\/strong>：回表是<strong>随机 IO<\/strong>——二级索引叶子里的主键是无序的，回聚簇索引读整行时磁盘寻道频繁。<strong>MRR（Multi-Range Read）<\/strong> 把二级索引查到的主键先排序，再<strong>按主键顺序<\/strong>回表，把随机读变成近似顺序读，减少磁盘寻道。可通过 <code>optimizer_switch<\/code> 的 <code>mrr=on<\/code> 控制。<\/p>\n<hr>"}]}, {"title": "🔥 追问链 04｜最左前缀原则", "questions": [{"q": "L0 · 主问题：什么是最左前缀原则？", "tag": "", "body": "<blockquote>考察意图：是否理解联合索引的\"整体排序\"本质，而不只是死记规则。<\/blockquote>\n<p><strong>答<\/strong>：联合索引 <code>(a,b,c)<\/code> 按 (a,b,c) 整体排序，查询必须从最左列开始连续匹配才能走索引。等效于建了 <code>a<\/code>、<code>(a,b)<\/code>、<code>(a,b,c)<\/code> 三个索引。<\/p>"}, {"q": "L1 · 追问：`WHERE a=1 AND c=3` 会怎样？", "tag": "", "body": "<p><strong>答<\/strong>：<code>a<\/code> 能走索引，<code>c<\/code> 因为跳过了 <code>b<\/code> 无法直接定位，只能靠<strong>索引下推（ICP）<\/strong>在遍历 <code>a=1<\/code> 的行时顺带过滤 <code>c=3<\/code>，比全表回表好，但不如 <code>(a,c)<\/code> 高效。<\/p>"}, {"q": "L2 · 追问：`WHERE a>1 AND b=2`，为什么 b 失效？", "tag": "", "body": "<p><strong>答<\/strong>：因为索引按 (a,b) 排序，<code>a>1<\/code> 是<strong>范围<\/strong>，范围内 <code>a<\/code> 各不相同的行，其 <code>b<\/code> 是<strong>无序的<\/strong>，无法用 b 继续二分定位。<strong>范围列之后的列都失效<\/strong>——这是最左前缀最常见的坑。<\/p>"}, {"q": "L3 · 追问：为什么不能跳过 a 直接查 b？", "tag": "", "body": "<p><strong>答<\/strong>：B+ 树叶子按 (a,b,c) <strong>整体字典序<\/strong>排列：先比 a，a 相同再比 b。若只按 b 查，索引里 b 是全局无序的，无法用 b 定位，只能全索引扫描。这就是\"最左前缀\"的物理本质。<\/p>"}, {"q": "L4 · 追问：怎么设计才能既查 a 又按 b 排序？", "tag": "", "body": "<p><strong>答<\/strong>：把排序列也纳入联合索引。如 <code>WHERE a=? ORDER BY b<\/code> 需要 <code>(a,b)<\/code>；<code>WHERE a=? AND b>? ORDER BY c<\/code> 需要 <code>(a,b,c)<\/code> 才能排序也不 filesort。核心口诀：<strong>等值在前、范围在后、排序列紧随其后<\/strong>，让排序也能\"吃\"到索引的有序性。<\/p>\n<hr>"}]}, {"title": "🔥 追问链 05｜事务隔离与 MVCC", "questions": [{"q": "L0 · 主问题：四个隔离级别分别解决什么问题？", "tag": "", "body": "<blockquote>考察意图：MySQL 面试的\"分水岭\"，能否把隔离级别、ReadView、undo 版本链串起来。<\/blockquote>\n<p><strong>答<\/strong>：RU 什么也不解决（脏读）；RC 解决脏读，但可能不可重复读、幻读；RR（MySQL 默认）解决脏读+不可重复读，基本解决幻读；Serializable 全解决（靠串行化）。<\/p>"}, {"q": "L1 · 追问：MVCC 是怎么实现\"不加锁读\"的？", "tag": "", "body": "<p><strong>答<\/strong>：靠<strong>隐藏字段 + undo 版本链 + ReadView<\/strong>。每行有 <code>DB_TRX_ID<\/code>（最近修改的事务 id）、<code>DB_ROLL_PTR<\/code>（指向 undo 里的历史版本）；读时沿版本链找到\"本事务可见\"的版本，通过版本判断而非加锁实现一致性快照。<\/p>"}, {"q": "L2 · 追问：ReadView 的可见性判断规则是什么？", "tag": "", "body": "<p><strong>答<\/strong>：ReadView 记录 <code>m_ids<\/code>（当前活跃事务集合）、<code>min_trx_id<\/code>、<code>max_trx_id<\/code>、<code>creator_trx_id<\/code>。对某版本的事务 id <code>trx_id<\/code>：<\/p>\n<pre><code>trx_id == creator_trx_id   → 自己改的，可见\ntrx_id &lt;  min_trx_id       → 已提交，可见\ntrx_id &gt;= max_trx_id       → 视图之后的事务，不可见\ntrx_id ∈  m_ids            → 仍在活跃，不可见\n否则                        → 已提交，可见<\/code><\/pre>"}, {"q": "L3 · 追问：RR 和 RC 的 MVCC 差在哪？", "tag": "", "body": "<p><strong>答<\/strong>：<strong>ReadView 生成时机不同<\/strong>。RC：每次快照读都生成新 ReadView，所以能读到别的事务新提交的数据（不可重复读）；RR：<strong>事务内第一次快照读<\/strong>生成 ReadView 并复用，全程同一快照，所以可重复读。<\/p>"}, {"q": "L4 · 追问：MySQL 为什么默认 RR，而不是像 Oracle 用 RC？", "tag": "", "body": "<p><strong>答<\/strong>：历史原因——<strong>5.7 之前 binlog 默认 STATEMENT 格式<\/strong>，主从复制靠 SQL 回放，若用 RC 会出现\"主库事务执行顺序与 binlog 回放结果不一致\"的幻读风险；RR + 间隙锁能保证 STATEMENT 复制下主从一致。5.7.7 后 binlog 默认 ROW，才逐渐有公司切 RC 提并发。能答出这条\"历史包袱\"是明显加分。<\/p>"}, {"q": "L5 · 追问：undo log 会被清理吗？什么时候？", "tag": "", "body": "<p><strong>答<\/strong>：会，由后台 <strong>purge 线程<\/strong>异步清理。判断依据是：某 undo 版本<strong>不再被任何活跃事务的 ReadView 引用<\/strong>时才可回收。<strong>长事务会拖着 purge 无法推进<\/strong>，导致 undo 空间暴涨、版本链变长、查询变慢——这就是长事务危害的底层原因。<\/p>\n<hr>"}]}, {"title": "🔥 追问链 06｜幻读与 next-key lock", "questions": [{"q": "L0 · 主问题：什么是幻读？和不可重复读有何区别？", "tag": "", "body": "<blockquote>考察意图：锁与 MVCC 的交叉地带，以及能否说清 RR 的\"幻读边界\"。<\/blockquote>\n<p><strong>答<\/strong>：不可重复读是<strong>同一行<\/strong>被改（读到的值变了）；幻读是<strong>多出/少了行<\/strong>（同样的范围查询，结果集的行数变了）。幻读本质是<strong>插入/删除<\/strong>造成的。<\/p>"}, {"q": "L1 · 追问：RR 是怎么解决幻读的？", "tag": "", "body": "<p><strong>答<\/strong>：两条腿。<strong>快照读<\/strong>靠 MVCC（读的是事务开始时的快照，别人插入看不到）；<strong>当前读<\/strong>靠 <strong>next-key lock（记录锁 + 间隙锁）<\/strong>，把查询范围锁住，阻止其他事务插入，从根上消除幻读。<\/p>"}, {"q": "L2 · 追问：为什么间隙锁只在 RR 及以上才有？", "tag": "", "body": "<p><strong>答<\/strong>：间隙锁锁的是\"记录之间的空隙\"，代价是降低并发。RC 没有间隙锁（只有记录锁），因为它容忍幻读；RR 为了基本消除幻读才引入。这也是 RC 并发更高、RR 更容易死锁的原因。<\/p>"}, {"q": "L3 · 追问：RR 能 100% 避免幻读吗？边界在哪？", "tag": "", "body": "<p><strong>答<\/strong>：<strong>不能严格 100%<\/strong>。经典反例：事务 A 先<strong>快照读<\/strong>（<code>SELECT * WHERE id>5<\/code>，MVCC 不加锁），此时事务 B 插入一条 <code>id=10<\/code> 并提交；A 再<strong>当前读<\/strong>（<code>SELECT ... FOR UPDATE<\/code> 或 <code>UPDATE<\/code>）时会看到这条新插入的行，产生\"幻影\"。所以严格说 RR 只是\"基本解决\"，能主动点出这个边界是加分项。<\/p>"}, {"q": "L4 · 追问：InnoDB 的加锁规则是什么？", "tag": "", "body": "<p><strong>答<\/strong>：丁奇总结的四原则 + 两优化：① 加锁基本单位是 next-key lock（前开后闭）；② 访问到的对象才加锁；③ 等值查询向右遍历到第一个不满足等值条件的值，退化为<strong>间隙锁<\/strong>；④ 唯一索引等值命中，退化为<strong>记录锁<\/strong>。另有已知现象：唯一索引<strong>范围查询<\/strong>会锁到第一个不满足条件的值。<\/p>\n<hr>"}]}, {"title": "🔥 追问链 07｜锁分类与死锁", "questions": [{"q": "L0 · 主问题：MySQL 有哪些锁？", "tag": "", "body": "<blockquote>考察意图：锁的体系是否完整，以及死锁的排查与工程处理能力。<\/blockquote>\n<p><strong>答<\/strong>：按粒度分<strong>全局锁、表级锁、行级锁<\/strong>。表级含 MDL 元数据锁、意向锁；行级含记录锁、间隙锁、临键锁。另外还有自增锁 AUTO-INC。<\/p>"}, {"q": "L1 · 追问：意向锁（IS/IX）是干什么的？", "tag": "", "body": "<p><strong>答<\/strong>：解决\"<strong>表锁与行锁的冲突判断<\/strong>\"。事务加行锁前先给表加意向锁；别人要加表锁时，只需看表上有没有意向锁，就知道有没有行锁，而不用逐行扫描。它是表级标记、不阻塞、只用于快速判断兼容性。<\/p>"}, {"q": "L2 · 追问：MDL 锁是什么？为什么大表 DDL 会阻塞 DML？", "tag": "", "body": "<p><strong>答<\/strong>：MDL（元数据锁）保护表结构：增删改查自动加 MDL <strong>读锁<\/strong>，DDL 需要 MDL <strong>写锁<\/strong>，读写互斥。一个未提交的长事务持有 MDL 读锁，后面的 <code>ALTER TABLE<\/code> 拿不到写锁就一直排队，而后续新来的 DML 又排在 DDL 后面——造成\"DDL 阻塞 DML、进而雪崩\"。这是 <code>Online DDL<\/code> 与 <code>pt-osc/gh-ost<\/code> 要解决的问题。<\/p>"}, {"q": "L3 · 追问：死锁怎么检测？怎么处理？", "tag": "", "body": "<p><strong>答<\/strong>：InnoDB 维护<strong>锁等待图<\/strong>，发现<strong>环路<\/strong>即判定死锁，<strong>自动回滚事务量最小（undo 最少）的那个<\/strong>，抛 1213 错误，让应用重试。查看 <code>SHOW ENGINE INNODB STATUS<\/code> 的 <code>LATEST DETECTED DEADLOCK<\/code> 定位是哪两条 SQL 互相持有对方要的锁。<\/p>"}, {"q": "L4 · 追问：工程上怎么避免死锁？", "tag": "", "body": "<p><strong>答<\/strong>：① 按<strong>固定顺序<\/strong>访问多行/多表（不同事务锁序一致）；② 尽量<strong>缩小锁范围<\/strong>（精确索引、少用范围）；③ 控制事务粒度，事务内不穿插远程调用/长查询；④ 高并发热点可降级 RC（无间隙锁）或用锁等待超时 <code>innodb_lock_wait_timeout<\/code> 兜底；⑤ 应用侧捕获 1213 自动重试。<\/p>\n<hr>"}]}, {"title": "🔥 追问链 08｜redo·binlog·两阶段提交", "questions": [{"q": "L0 · 主问题：redo log 和 binlog 有什么区别？", "tag": "", "body": "<blockquote>考察意图：持久性与主从一致性的核心，MySQL 面试最高频的\"深水区\"。<\/blockquote>\n<p><strong>答<\/strong>：redo log 是 <strong>InnoDB 层物理日志<\/strong>（记录页的修改），循环写，用于<strong>崩溃恢复<\/strong>；binlog 是 <strong>Server 层逻辑日志<\/strong>（SQL 或行变更），追加写，用于<strong>主从复制和数据恢复<\/strong>。<\/p>"}, {"q": "L1 · 追问：为什么需要两阶段提交？", "tag": "", "body": "<p><strong>答<\/strong>：因为 redo 和 binlog 分属两层、<strong>独立写入<\/strong>，若一个成功一个失败，就会不一致：redo 成功 binlog 失败 → 主库有数据、从库没有（主从不一致）；binlog 成功 redo 失败 → 从库有、主库没有。两阶段提交让二者\"要么都成功、要么都失败\"。<\/p>"}, {"q": "L2 · 追问：两阶段提交的具体流程？", "tag": "", "body": "<p><strong>答<\/strong>：<\/p>\n<pre><code>1. 写 redo log，状态 = PREPARE\n2. 写 binlog\n3. 写 redo log，状态 = COMMIT，事务提交成功<\/code><\/pre>"}, {"q": "L3 · 追问：崩溃后怎么判断该提交还是回滚？", "tag": "", "body": "<p><strong>答<\/strong>：扫描 redo 里的 PREPARE 事务，再比对 binlog：<\/p>\n<ul><li>redo 是 PREPARE + binlog <strong>不存在<\/strong> → 回滚（redo 未提交，binlog 也没写，主从都无）<\/li><li>redo 是 PREPARE + binlog <strong>存在<\/strong> → 提交（binlog 已写，从库会执行，主库必须提交保持一致）<\/li><li>redo 是 COMMIT → 直接提交<\/li><\/ul>"}, {"q": "L4 · 追问：组提交（Group Commit）是什么？为什么能提性能？", "tag": "", "body": "<p><strong>答<\/strong>：两阶段提交里最贵的操作是 <strong>fsync 刷盘<\/strong>（redo 和 binlog 各一次）。组提交把<strong>并发事务的 fsync 合并成一次<\/strong>——多个事务的日志一起刷，分摊 fsync 开销，大幅提升写入吞吐。开启 <code>binlog_group_commit_sync_delay<\/code> 可进一步攒批。<\/p>"}, {"q": "L5 · 追问：要\"数据绝对不丢\"，三个刷盘参数怎么配？", "tag": "", "body": "<p><strong>答<\/strong>：① <code>innodb_flush_log_at_trx_commit=1<\/code>（每次提交 fsync redo）；② <code>sync_binlog=1<\/code>（每次提交 fsync binlog）；③ <code>innodb_doublewrite=1<\/code>（防部分页写）。即\"双 1 + 双写\"最安全，代价是写入性能下降，通常用<strong>组提交 + 批量刷盘<\/strong>平衡。<\/p>\n<hr>"}]}, {"title": "🔥 追问链 09｜主从复制与延迟", "questions": [{"q": "L0 · 主问题：主从复制的原理？", "tag": "", "body": "<blockquote>考察意图：高可用架构的复制原理与延迟治理，架构岗必考。<\/blockquote>\n<p><strong>答<\/strong>：主库把变更写 binlog → 从库 <strong>IO 线程<\/strong>拉取 binlog 到本地 relay log → 从库 <strong>SQL 线程<\/strong>回放 relay log 更新数据。8.0 引入 GTID，事务有全局唯一 id，切换从库无需找位点。<\/p>"}, {"q": "L1 · 追问：为什么会有主从延迟？", "tag": "", "body": "<p><strong>答<\/strong>：主库并发写（多线程），从库 <strong>SQL 线程是单线程串行回放<\/strong>，跟不上主库吞吐；大事务、DDL、从库自身负载也会放大延迟。监控指标 <code>Seconds_Behind_Master<\/code>。<\/p>"}, {"q": "L2 · 追问：怎么解决主从延迟？", "tag": "", "body": "<p><strong>答<\/strong>：<strong>并行复制<\/strong>——5.7 按库并行（<code>DATABASE<\/code>），8.0 用 <strong>writeset<\/strong>（<code>WRITESET<\/code>）按事务冲突关系并行，同库不冲突的事务也能并行回放；配合拆分大事务、一主多从分流、只读从库。<\/p>"}, {"q": "L3 · 追问：GTID 是什么？解决了什么问题？", "tag": "", "body": "<p><strong>答<\/strong>：GTID = <code>server_uuid:transaction_id<\/code>，为每个事务分配<strong>全局唯一编号<\/strong>。传统基于位点的复制在切换主从时要手动找 <code>File+Position<\/code>，容易错位；GTID 让从库能<strong>自动跳过已执行的事务、续传未执行的<\/strong>，主从切换和故障恢复更可靠。<\/p>"}, {"q": "L4 · 追问：异步、半同步、MGR 分别什么场景？脑裂怎么办？", "tag": "", "body": "<p><strong>答<\/strong>：异步不等确认、延迟小但可能丢数据；半同步等至少一个从库 ACK 才返回，降低丢数据风险（从库故障需降级异步避免阻塞）；MGR 用 Paxos 共识实现强一致+自动选主，需 3 节点。<strong>脑裂<\/strong>靠\"过半仲裁\"解决：网络分区后只有多数派能写，少数派自动降级只读，配合 fencing 强制旧主下线。<\/p>\n<hr>"}]}, {"title": "🔥 追问链 10｜分库分表", "questions": [{"q": "L0 · 主问题：什么时候需要分库分表？", "tag": "", "body": "<blockquote>考察意图：分布式改造的判断力与跨库难题的工程解法。<\/blockquote>\n<p><strong>答<\/strong>：分库——单库连接数/IO 打满或按业务域拆分；分表——单表千万~亿级或 >10GB，B+ 树加深、Buffer Pool 命中率下降、DDL 阻塞。<strong>先做减法<\/strong>（归档、加索引、优化 SQL、升级硬件），垂直优先、水平次之。<\/p>"}, {"q": "L1 · 追问：垂直拆分和水平拆分怎么选？", "tag": "", "body": "<p><strong>答<\/strong>：垂直分库按<strong>业务域<\/strong>（用户库/订单库/库存库），垂直分表拆<strong>大字段<\/strong>到扩展表；水平分表是<strong>同结构拆多张<\/strong>，靠路由定位。垂直解决\"表太宽/库太杂\"，水平解决\"行太多\"。<\/p>"}, {"q": "L2 · 追问：分片键怎么选？基因法是什么？", "tag": "", "body": "<p><strong>答<\/strong>：分片键选<strong>最频繁的等值条件<\/strong>（如 user_id），保证均匀、避免时间热点。<strong>基因法<\/strong>：订单号末尾嵌入 user_id 的哈希后缀，使订单既能按订单号直接路由、也能按 user_id 路由，解决\"按 user_id 查订单却要全库扫\"的痛点（电商经典）。<\/p>"}, {"q": "L3 · 追问：跨库的 join、事务、分页怎么办？", "tag": "", "body": "<p><strong>答<\/strong>：join——应用层组装 / 字段冗余 / 宽表 / ES；事务——XA（刚性慢）/ TCC / <strong>本地消息表 + MQ（最终一致，最常用）<\/strong>/ Saga；分页——各分片 limit 后归并，深分页用<strong>游标翻页<\/strong>。中间件：ShardingSphere-JDBC（客户端）/ Proxy、MyCat（服务端）。<\/p>"}, {"q": "L4 · 追问：怎么平滑扩容？", "tag": "", "body": "<p><strong>答<\/strong>：<strong>双写 + 全量迁移 + 校验 + 灰度切换<\/strong>：新老分片同时写，用 canal 订阅 binlog 追增量，<code>pt-table-checksum<\/code> 校验一致后灰度切读、再停旧库。取模分片<strong>翻倍扩容只迁一半数据<\/strong>，是常见低成本方案。<\/p>\n<hr>"}]}, {"title": "🔥 追问链 11｜缓存一致性", "questions": [{"q": "L0 · 主问题：更新数据时，更新缓存还是删除缓存？", "tag": "", "body": "<blockquote>考察意图：缓存与 DB 的一致性方案，以及三大缓存问题的应对。<\/blockquote>\n<p><strong>答<\/strong>：<strong>删除缓存<\/strong>（Cache Aside）。因为\"更新缓存\"在并发下可能写脏、且缓存未必马上被读，不如\"失效后按需回源\"，配合\"先更新 DB 再删缓存\"。<\/p>"}, {"q": "L1 · 追问：先删缓存还是先更新 DB？为什么都有不一致窗口？", "tag": "", "body": "<p><strong>答<\/strong>：<strong>先删缓存<\/strong>：删完、DB 未更新前，旧请求把旧值写回缓存 → 读到旧值；<strong>先更新 DB 后删缓存<\/strong>：更新完、删缓存前，读请求可能命中旧缓存 → 短暂读到旧值。二者窗口不同，主流是<strong>先更 DB 再删缓存<\/strong>，窗口更短。<\/p>"}, {"q": "L2 · 追问：延迟双删是解决什么的？怎么用？", "tag": "", "body": "<p><strong>答<\/strong>：解决\"<strong>先更 DB 后删缓存<\/strong>\"仍可能出现的脏缓存：更新 DB 后删一次，<strong>延时（如 1~2 秒）再删一次<\/strong>，把并发写回的脏值二次清掉。是简单可靠的兜底，但不是银弹。<\/p>"}, {"q": "L3 · 追问：生产里更推荐什么方案？", "tag": "", "body": "<p><strong>答<\/strong>：<strong>canal 订阅 binlog 删缓存<\/strong>：应用只写 DB，canal 解析 binlog 变更后异步删缓存。解耦、可靠、可重放，是主流大厂做法。核心思想：<strong>一致性交给\"数据库变更事件\"驱动，而不是应用手动维护<\/strong>。<\/p>"}, {"q": "L4 · 追问：缓存穿透、击穿、雪崩分别怎么防？", "tag": "", "body": "<p><strong>答<\/strong>：穿透（查不存在的 key 打穿到 DB）——布隆过滤器 / 缓存空值；击穿（热点 key 过期瞬间集中打 DB）——互斥锁重建 / 逻辑过期 / 热点不过期；雪崩（大量 key 同时过期/缓存宕机）——过期时间加随机抖动 / 多级缓存 / 限流降级。<\/p>\n<hr>"}]}, {"title": "🔥 追问链 12｜Buffer Pool 与内存", "questions": [{"q": "L0 · 主问题：Buffer Pool 是什么？", "tag": "", "body": "<blockquote>考察意图：内存与 IO 的理解深度，调优岗加分项。<\/blockquote>\n<p><strong>答<\/strong>：InnoDB 的内存缓存区，缓存<strong>数据页<\/strong>。读写都先经过它——命中即内存操作，未命中才磁盘 IO，是 MySQL 性能的核心。大小 <code>innodb_buffer_pool_size<\/code>，建议物理内存 60%~75%。<\/p>"}, {"q": "L1 · 追问：Buffer Pool 的 LRU 有什么特殊设计？", "tag": "", "body": "<p><strong>答<\/strong>：<strong>冷热分区<\/strong>（冷区约占 37%）：新读入的页先放<strong>冷区头部<\/strong>，只有被再次访问且停留时间 > <code>innodb_old_blocks_time<\/code>（默认 1000ms）才晋升热区。这样<strong>全表扫描的一次性页不会挤掉热点数据<\/strong>。<\/p>"}, {"q": "L2 · 追问：脏页什么时候刷回磁盘？", "tag": "", "body": "<p><strong>答<\/strong>：不是每次更新都刷，而是由后台线程按需刷：redo log 空间水位触发的 <strong>checkpoint<\/strong>、脏页比例超过 <code>innodb_max_dirty_pages_pct<\/code>、Buffer Pool 空闲页不足、MySQL 空闲/关闭时。脏页过多会导致刷盘风暴、IO 抖动。<\/p>"}, {"q": "L3 · 追问：怎么衡量 Buffer Pool 是否够用？", "tag": "", "body": "<p><strong>答<\/strong>：看<strong>命中率<\/strong>：<code>Innodb_buffer_pool_read_requests / (read_requests + read_ahead)<\/code>，命中率应 >99%。若命中率低且 <code>Innodb_buffer_pool_reads<\/code>（磁盘读）高，说明池太小或数据量超内存，需扩容或分库分表。<\/p>"}, {"q": "L4 · 追问：为什么大表全表扫描会让系统变卡？", "tag": "", "body": "<p><strong>答<\/strong>：全表扫描会不断把新页读入 Buffer Pool，若无冷热分区保护，会把<strong>热点页全部挤出<\/strong>，导致后续热点查询全部落盘、整体变慢。冷热分区正是为此设计；也可用 <code>innodb_buffer_pool_size<\/code> 多 instance 降低争用。<\/p>\n<hr>"}]}, {"title": "🔥 追问链 13｜一条 UPDATE 的完整链路（压轴）", "questions": [{"q": "L0 · 主问题：完整描述一条 UPDATE 从执行到落盘的全过程？", "tag": "", "body": "<blockquote>考察意图：把前面所有知识点串成一条线，检验体系是否打通。答得越完整越加分。<\/blockquote>\n<p><strong>答<\/strong>：<code>执行器定位行（当前读 + X 锁/next-key lock）→ 数据页读入 Buffer Pool → 写 undo（版本链，供回滚/MVCC）→ 修改内存页（变脏页）→ 写 redo(PREPARE) → 写 binlog → redo(COMMIT) → 返回成功<\/code>，脏页由后台延迟刷盘。<\/p>"}, {"q": "L1 · 追问：UPDATE 加的是快照读还是当前读？为什么？", "tag": "", "body": "<p><strong>答<\/strong>：<strong>当前读<\/strong>。UPDATE 必须基于<strong>最新数据<\/strong>修改，且要加锁防止并发修改冲突；快照读（MVCC）读的是历史快照，不能用于更新基础，否则会丢更新。<\/p>"}, {"q": "L2 · 追问：没有索引的 WHERE 条件下 UPDATE 会怎样？", "tag": "", "body": "<p><strong>答<\/strong>：InnoDB 行锁是<strong>加在索引记录上<\/strong>的，无索引时无法定位具体行，会<strong>退化为全表扫描 + 锁全表所有行<\/strong>（实际上锁住所有记录和间隙），并发极差、极易死锁。这是\"WHERE 条件必须走索引\"的根因。<\/p>"}, {"q": "L3 · 追问：redo log 满了会怎样？checkpoint 是干嘛的？", "tag": "", "body": "<p><strong>答<\/strong>：redo log 是<strong>循环写<\/strong>，<code>write pos<\/code> 追上 <code>checkpoint<\/code> 即\"满了\"，此时必须停下写入、强制把脏页刷盘以推进 checkpoint 腾出空间，导致写入卡顿。checkpoint 标记\"哪些脏页已刷盘、对应 redo 可覆盖\"，是 redo 循环复用的关键。<\/p>"}, {"q": "L4 · 追问：从提交到\"数据真正落盘\"中间发生了什么？", "tag": "", "body": "<p><strong>答<\/strong>：事务提交只保证 <strong>redo 落盘<\/strong>（持久性），数据页仍在 Buffer Pool 是脏页，由后台线程异步刷盘。这就是 WAL（先写日志）的威力——提交快，因为只刷顺序的 redo，而非随机写数据页。<\/p>"}, {"q": "L5 · 追问：崩溃重启后，这条 UPDATE 怎么恢复？", "tag": "", "body": "<p><strong>答<\/strong>：重放 redo log <strong>前滚<\/strong>已提交事务（redo 是 COMMIT 或 PREPARE+binlog 存在的），再用 undo log <strong>回滚<\/strong>未提交事务（redo 是 PREPARE 但 binlog 不存在），最终回到崩溃前的一致状态。<\/p>\n<hr>"}]}, {"title": "新增高频题（现有题库缺失的补充）", "questions": [{"q": "补01 · 为什么索引列不建议用 NULL？", "tag": "", "body": "<p><strong>答<\/strong>：NULL 值参与比较需额外处理（IS NULL / 不等判断），优化器处理更复杂、部分场景索引失效；占用额外字节标志位。规范上建表 <code>NOT NULL DEFAULT<\/code>，把\"空\"语义用默认值表达。<\/p>"}, {"q": "补02 · EXPLAIN 的 key_len 有什么用？", "tag": "", "body": "<p><strong>答<\/strong>：<code>key_len<\/code> 是<strong>实际用到的索引字节数<\/strong>。通过它判断联合索引\"用了几列\"：如 <code>(name VARCHAR(20) utf8mb4, age INT)<\/code>，只匹配 name 时 key_len ≈ 20×4+2=82，再命中 age 会 +4。是验证最左前缀、定位索引没吃满的利器。<\/p>"}, {"q": "补03 · 索引的区分度/选择性怎么算？低于多少不建议建索引？", "tag": "", "body": "<p><strong>答<\/strong>：<code>区分度 = COUNT(DISTINCT col) / COUNT(*)<\/code>，越接近 1 越好。区分度极低的列（如性别、状态位）走索引收益小，优化器可能直接全表扫。经验：低于 20% 一般不单独建索引，可作为联合索引的辅助列。<\/p>"}, {"q": "补04 · 自适应哈希索引（AHI）是什么？", "tag": "", "body": "<p><strong>答<\/strong>：InnoDB 观察高频等值查询模式，自动在内存为热点索引页建<strong>哈希索引<\/strong>，等值查询 O(1)。无需人工干预，但只对<strong>等值、热点、重复模式<\/strong>有效，范围查询用不上。<code>SHOW ENGINE INNODB STATUS<\/code> 可看 AHI 使用情况。<\/p>"}, {"q": "补05 · 为什么 MySQL 不用跳表、也不把 B 树换成\"更好的\"结构？", "tag": "", "body": "<p><strong>答<\/strong>：见追问链 02 L5——介质决定结构。B+ 树把连续键紧凑塞进 16KB 页实现顺序预读 + 高扇出 + 矮树高，是为<strong>磁盘随机 IO 贵<\/strong>而生的最优解；跳表/红黑树等为内存设计，在磁盘上会退化为大量随机 IO。<\/p>"}, {"q": "补06 · 当前读 vs 快照读，最常见的\"踩坑\"场景？", "tag": "", "body": "<p><strong>答<\/strong>：RR 下，事务先 <code>SELECT<\/code>（快照读，看到旧值）再 <code>UPDATE<\/code>（当前读，基于最新值修改），改完再 <code>SELECT<\/code> 仍显示旧值——因为快照读复用同一 ReadView。<strong>业务判断若依赖\"我刚读到的值\"，必须用 <code>SELECT ... FOR UPDATE<\/code>（当前读）<\/strong>，否则会基于过期数据做决策。<\/p>"}, {"q": "补07 · undo log 空间一直涨怎么办？", "tag": "", "body": "<p><strong>答<\/strong>：定位长事务——<code>information_schema.innodb_trx<\/code> 查 <code>trx_started<\/code> 最早、<code>trx_rows_modified<\/code> 最大的事务；<code>SHOW PROCESSLIST<\/code> 找执行时间长的会话。根治：缩短事务、及时 COMMIT、事务内不做远程调用/大查询、设置 <code>max_execution_time<\/code>、监控 undo 使用率告警。<\/p>"}, {"q": "补08 · MDL 锁写锁的\"雪崩\"是怎么发生的？怎么避免？", "tag": "", "body": "<p><strong>答<\/strong>：长事务持 MDL 读锁 → DDL 申请写锁排队 → 后续所有 DML 申请读锁排在 DDL 后 → 业务读写全阻塞。避免：大表 DDL 用 <strong>Online DDL（INSTANT/INPLACE + LOCK=NONE）<\/strong> 或 <code>pt-osc/gh-ost<\/code>（影子表 + binlog 同步，不长时间持锁）。<\/p>"}, {"q": "补09 · InnoDB 为什么没有\"锁升级\"（lock escalation）？", "tag": "", "body": "<p><strong>答<\/strong>：InnoDB 行锁存在内存哈希表里，<strong>内存开销可控<\/strong>，无需像 Oracle/SQL Server 那样\"行锁太多时升级成表锁省内存\"。代价是可能锁大量行，但换来更细粒度的并发，这与其\"行锁+MVCC 高并发\"的设计目标一致。<\/p>"}, {"q": "补10 · 锁等待超时 和 死锁，有什么区别？", "tag": "", "body": "<p><strong>答<\/strong>：锁等待超时是<strong>单边等待<\/strong>超过 <code>innodb_lock_wait_timeout<\/code>（默认 50s），报 1205；死锁是<strong>互相等待成环<\/strong>，被死锁检测立即识别并回滚，报 1213。死锁是\"等不到头\"，超时是\"等太久\"；处理上死锁靠重试，超时靠排查慢事务。<\/p>"}, {"q": "补11 · redo log 为什么要设计成循环写、固定大小？", "tag": "", "body": "<p><strong>答<\/strong>：redo 只需保证\"崩溃能恢复最近未刷盘的修改\"，一旦脏页刷盘、对应 redo 就无用了，可覆盖复用。<strong>固定大小 + 循环写<\/strong>既省空间又性能稳定（顺序写、无需扩容），checkpoint 推进即可复用。<\/p>"}, {"q": "补12 · binlog 里的 XID event 是干什么的？", "tag": "", "body": "<p><strong>答<\/strong>：XID 是<strong>事务提交标识<\/strong>，用于两阶段提交时在 binlog 中标记事务边界。崩溃恢复时，redo 的 PREPARE 事务通过 <strong>XID 去 binlog 里查找对应事务是否存在<\/strong>，从而决定提交还是回滚——XID 是 redo 与 binlog 关联的桥梁。<\/p>"}, {"q": "补13 · 8.0 的 writeset 并行复制为什么比 5.7 强？", "tag": "", "body": "<p><strong>答<\/strong>：5.7 按<strong>库<\/strong>并行（不同库可并行，同库串行），单库热点无法并行；8.0 的 <code>WRITESET<\/code> 记录每事务<strong>改动的行集合<\/strong>，只要两个事务改的行不冲突就能并行回放，<strong>同库内也能并行<\/strong>，大幅提升单库从节点吞吐。<\/p>"}, {"q": "补14 · 半同步复制从库挂了会怎样？怎么兜底？", "tag": "", "body": "<p><strong>答<\/strong>：主库等不到从库 ACK，写入会<strong>阻塞直到超时<\/strong>（<code>rpl_semi_sync_master_timeout<\/code>），超时后<strong>自动降级为异步<\/strong>，从库恢复后再自动升回半同步。避免单点故障拖垮主库，是半同步的常见保护机制。<\/p>"}, {"q": "补15 · 怎么校验主从数据是否一致？", "tag": "", "body": "<p><strong>答<\/strong>：<strong>pt-table-checksum<\/strong> 对主库分块计算校验和，与从库对比定位不一致的表/块；不一致用 <strong>pt-table-sync<\/strong> 回补。预防：binlog 用 ROW 格式、启用 GTID、禁止在从库手工写数据、定期巡检。<\/p>"}, {"q": "补16 · 订单超时未支付自动取消，数据库层面怎么做？", "tag": "", "body": "<p><strong>答<\/strong>：不要靠\"实时扫描全表\"。主流：<strong>延迟队列/RocketMQ 延迟消息<\/strong>投递超时事件，或<strong>定时任务扫\"已创建且超时\"的订单<\/strong>（状态 + 过期时间建索引，分批游标扫描），配合状态机流转 + 幂等取消 + 库存回补。核心：<strong>按过期时间索引、增量处理、幂等<\/strong>。<\/p>"}, {"q": "补17 · 排行榜/点赞数这种场景，MySQL 合适吗？", "tag": "", "body": "<p><strong>答<\/strong>：高频写、实时排序、读多写多，MySQL 压力大。更优：<strong>Redis ZSet<\/strong>（天然有序、O(log N) 写、实时 rank）。MySQL 做持久化兜底，Redis 做实时榜单，异步落库。能答出\"不同数据结构选不同存储\"是加分。<\/p>"}, {"q": "补18 · 热点行高并发更新（如库存/余额）怎么优化？", "tag": "", "body": "<p><strong>答<\/strong>：① 把单行<strong>拆成多行<\/strong>（如库存拆 10 份，随机取一行扣减，再汇总）；② <strong>排队削峰<\/strong>（MQ 串行化）；③ <strong>合并批量更新<\/strong>；④ 适当降级 RC、关死锁检测、锁超时兜底；⑤ 余额类用<strong>流水表 + 汇总<\/strong>替代单行频繁 UPDATE。核心：<strong>分散热点，避免单行串行成为瓶颈<\/strong>。<\/p>"}, {"q": "补19 · 读写分离下，写完立刻读主从延迟导致读到旧数据怎么办？", "tag": "", "body": "<p><strong>答<\/strong>：一致性敏感场景<strong>强制走主库<\/strong>（如\"写后立即读\"）；或用<strong>路由标记<\/strong>（会话内写后 N 秒内读主）；或<strong>读从库+版本号校验<\/strong>；长期靠<strong>降低主从延迟<\/strong>（并行复制、拆分大事务）。核心原则：<strong>能容忍延迟的读才走从库<\/strong>。<\/p>"}, {"q": "补20 · 分库分表后，唯一性约束（如手机号唯一）怎么保证？", "tag": "", "body": "<p><strong>答<\/strong>：分片后单库唯一索引失效，需全局唯一：① 用<strong>唯一列作为分片键<\/strong>（按手机号哈希分片，天然唯一）；② 若不能，用<strong>全局唯一表/Redis 预占<\/strong>（先抢唯一性再写）；③ 应用层先查后写 + 唯一表兜底。能指出\"分片键选择与唯一性约束冲突\"这一根本矛盾是加分。<\/p>"}, {"q": "补21 · 账户余额并发扣减，怎么保证不超扣、不丢更新？", "tag": "", "body": "<p><strong>答<\/strong>：<code>UPDATE balance = balance - ? WHERE id=? AND balance >= ?<\/code> 条件更新，<strong>受影响行数=0 则重试/拒绝<\/strong>（乐观锁思路，本质是\"读-判断-写\"变原子条件更新）；或用行锁 <code>SELECT ... FOR UPDATE<\/code>。<strong>绝不能<\/strong>先 SELECT 判断再 UPDATE（非原子，并发下超扣）。<\/p>"}, {"q": "补22 · 为什么金额字段要用 DECIMAL 而不是 FLOAT/DOUBLE？", "tag": "", "body": "<p><strong>答<\/strong>：FLOAT/DOUBLE 是<strong>二进制浮点<\/strong>，无法精确表示十进制小数（如 0.1），运算有误差；DECIMAL 是<strong>定点精确存储<\/strong>，适合金额。金额用 <code>DECIMAL(18,2)<\/code>，运算在应用层用 BigDecimal 或整数分，避免浮点误差。<\/p>"}, {"q": "补23 · DATETIME 和 TIMESTAMP 怎么选？", "tag": "", "body": "<p><strong>答<\/strong>：TIMESTAMP 是 4 字节、带时区、范围到 2038 年（<strong>2038 问题<\/strong>）；DATETIME 是 8 字节、范围大、不含时区。需要精确记录到远未来或不受时区转换影响时用 DATETIME，需要毫秒用 <code>DATETIME(3)<\/code>。8.0 后默认推荐 DATETIME。<\/p>"}, {"q": "补24 · 一条 SQL 为什么\"时快时慢\"？", "tag": "", "body": "<p><strong>答<\/strong>：可能原因：① <strong>缓冲池命中波动<\/strong>（冷数据第一次查慢，热了变快）；② <strong>脏页刷盘/checkpoint<\/strong> 导致的 IO 抖动；③ <strong>锁等待<\/strong>（被别的事务阻塞）；④ <strong>执行计划变化<\/strong>（统计信息更新后换了索引，甚至走错索引）；⑤ 网络/连接池抖动。排查：<code>SHOW PROCESSLIST<\/code> 看状态，<code>EXPLAIN<\/code> 对比执行计划，慢日志看是否同一条 SQL 波动。<\/p>"}, {"q": "补25 · MySQL 的 IO 是同步还是异步的？", "tag": "", "body": "<p><strong>答<\/strong>：8.0 之前 InnoDB 用<strong>原生 AIO（异步 IO）<\/strong>，可并发发起多个磁盘请求；Windows 等平台用模拟 AIO。异步 IO 让多个页的读写并行，减少等待。能答出\"IO 模型\"层面属于进阶加分。<\/p>"}, {"q": "补26 · 为什么说\"不要用 SELECT *\"？", "tag": "", "body": "<p><strong>答<\/strong>：① 多读无用列，<strong>大字段<\/strong>会触发 off-page 额外 IO；② 破坏<strong>覆盖索引<\/strong>，导致回表；③ 增加网络与内存开销；④ 表结构变更时结果集列数变化，代码脆弱。应<strong>只 SELECT 必要列<\/strong>，最好走覆盖索引。<\/p>\n<hr>\n<p>*整理时间：2026-08 · 追问链建议配合线上 EXPLAIN / SHOW ENGINE INNODB STATUS 实测验证，答到 L3+ 才算真正\"问不倒\"*<\/p>"}]}], "qcount": 96}, {"sub": "题库深度版", "chapters": [{"title": "01 基础架构与存储引擎", "questions": [{"q": "1.1 一条 SELECT 语句在 MySQL 中的完整执行流程？", "tag": "", "body": "<p><strong>流程<\/strong>：<code>客户端 → 连接器 → 查询缓存(8.0已移除) → 分析器 → 优化器 → 执行器 → 存储引擎<\/code><\/p>\n<ul><li><strong>连接器<\/strong>：TCP 握手、校验账号密码、获取权限；管理连接与空闲超时。<\/li><li><strong>查询缓存<\/strong>：8.0 之前按 SQL 文本缓存结果集，表一更新即失效，命中率低，8.0 已彻底移除。<\/li><li><strong>分析器<\/strong>：词法分析 → 语法分析，生成语法树；语法错误在此报出。<\/li><li><strong>优化器<\/strong>：决定执行计划——走哪个索引、连接顺序、是否索引下推。<\/li><li><strong>执行器<\/strong>：调用存储引擎接口取数；注意<strong>权限在优化器之后才检查<\/strong>。<\/li><li><strong>存储引擎<\/strong>：InnoDB 真正读写数据、维护 Buffer Pool 与行锁。<\/li><\/ul>\n<blockquote>加分点：一条 UPDATE 还会触发 redo log 两阶段提交 + binlog 写入。<\/blockquote>"}, {"q": "1.2 MySQL 逻辑架构分层", "tag": "", "body": "<ul><li><strong>Server 层<\/strong>：连接器/分析器/优化器/执行器 + 内置函数 + binlog + 视图/存储过程——跨引擎通用。<\/li><li><strong>存储引擎层<\/strong>：插件式（InnoDB/MyISAM/Memory），redo/undo log、Buffer Pool 属引擎层。<\/li><li>引擎通过统一的 <code>handler<\/code> 接口被 Server 层调用。<\/li><\/ul>"}, {"q": "1.3 InnoDB vs MyISAM", "tag": "", "body": "<table><thead><tr><th>维度<\/th><th>InnoDB<\/th><th>MyISAM<\/th><\/tr><\/thead><tbody><tr><td>事务<\/td><td>支持 ACID<\/td><td>不支持<\/td><\/tr><tr><td>锁粒度<\/td><td>行锁(+间隙锁)<\/td><td>仅表锁<\/td><\/tr><tr><td>索引<\/td><td>聚簇索引（数据绑主键）<\/td><td>非聚簇（存行指针）<\/td><\/tr><tr><td>外键<\/td><td>支持<\/td><td>不支持<\/td><\/tr><tr><td>MVCC<\/td><td>支持<\/td><td>不支持<\/td><\/tr><tr><td>崩溃恢复<\/td><td>redo+doublewrite<\/td><td>无，可能损坏<\/td><\/tr><tr><td>count(*)<\/td><td>扫描<\/td><td>O(1) 缓存<\/td><\/tr><\/tbody><\/table>\n<p><strong>为什么默认 InnoDB<\/strong>：事务、行锁、外键、MVCC、崩溃恢复，5.5.5 起为默认引擎。<\/p>"}, {"q": "1.4 其他引擎", "tag": "", "body": "<ul><li><strong>Memory<\/strong>：数据在内存，重启丢失，适合临时表/缓存。<\/li><li><strong>Archive<\/strong>：只支持 INSERT/SELECT，高压缩，适合日志归档。<\/li><li><strong>CSV/Blackhole<\/strong>：CSV 可直接读文本；Blackhole 只收不存，用于复制中转。<\/li><\/ul>\n<hr>"}]}, {"title": "02 索引原理与优化", "questions": [{"q": "2.1 为什么用 B+ 树做索引？", "tag": "", "body": "<ul><li><strong>哈希表<\/strong>：等值 O(1)，但不支持范围/排序/前缀；InnoDB 用它做自适应哈希索引。<\/li><li><strong>AVL/红黑树<\/strong>：树高随数据量增长，千万级 20+ 层 = 20+ 次磁盘 IO，不可接受。<\/li><li><strong>B 树<\/strong>：非叶子也存数据，扇出小、树更高；范围查询要中序遍历。<\/li><li><strong>B+ 树<\/strong>：非叶子只存键+指针，扇出大（16KB 页 ≈ 1170 分叉），<strong>3 层 ≈ 2000 万行 = 3 次 IO<\/strong>；叶子双向链表，范围查询/排序极快；查询路径稳定。<\/li><\/ul>"}, {"q": "2.2 B+ 树 vs B 树", "tag": "", "body": "<p>数据只存叶子 / 叶子有链表 / 树更矮扇出更大 / 范围查询快 / 查询路径等长。<\/p>"}, {"q": "2.3 聚簇索引、二级索引、回表、覆盖索引", "tag": "", "body": "<ul><li><strong>聚簇索引<\/strong>：主键即聚簇索引，叶子存整行；无主键则用第一个非空唯一索引，再没有生成隐藏 ROW_ID。<\/li><li><strong>二级索引<\/strong>：叶子存\"索引列 + 主键值\"。<\/li><li><strong>回表<\/strong>：二级索引 → 拿主键 → 回聚簇索引取整行，多一次 IO。<\/li><li><strong>覆盖索引<\/strong>：查询列全在索引里，无需回表（Extra: <code>Using index<\/code>）。<\/li><\/ul>"}, {"q": "2.4 最左前缀原则", "tag": "", "body": "<p>联合索引 <code>(a,b,c)<\/code> 相当于建了 a、(a,b)、(a,b,c) 三个索引，必须从最左连续匹配：<\/p>\n<table><thead><tr><th>条件<\/th><th>是否走索引<\/th><\/tr><\/thead><tbody><tr><td>WHERE a=1<\/td><td>✅<\/td><\/tr><tr><td>WHERE a=1 AND b=2<\/td><td>✅<\/td><\/tr><tr><td>WHERE a=1 AND b=2 AND c=3<\/td><td>✅<\/td><\/tr><tr><td>WHERE a=1 AND c=3<\/td><td>✅(a 用索引，c 走 ICP)<\/td><\/tr><tr><td>WHERE b=2<\/td><td>❌<\/td><\/tr><tr><td>WHERE a>1 AND b=2<\/td><td>⚠️ b 在范围列之后失效<\/td><\/tr><\/tbody><\/table>\n<p><strong>设计启示<\/strong>：等值条件放前，范围条件放后。<\/p>"}, {"q": "2.5 索引下推 ICP（5.6+）", "tag": "", "body": "<p>将 WHERE 中能用索引判断的条件下推到引擎层过滤，减少回表。EXPLAIN Extra 显示 <code>Using index condition<\/code>。前提：下推列必须在二级索引中。<\/p>\n<pre><code class=\"lang-sql\">-- 例：(name, age) 联合索引\nSELECT * FROM t WHERE name LIKE '张%' AND age=10;\n-- 引擎层遍历索引时直接过滤 age=10，只有满足的行才回表<\/code><\/pre>"}, {"q": "2.6 索引失效场景", "tag": "", "body": "<ol><li>隐式类型转换：varchar 列与数字比较<\/li><li>对索引列使用函数/运算：<code>DATE(create_time)=...<\/code>、<code>id+1=3<\/code><\/li><li>LIKE 以 % 开头<\/li><li>OR 连接非索引条件<\/li><li>联合索引范围列右侧失效<\/li><li>NOT IN / NOT LIKE / != / <><\/li><li>统计信息失真（ANALYZE TABLE 可刷新）<\/li><li>表太小，优化器选全表扫描<\/li><\/ol>\n<blockquote>最终以 EXPLAIN 为准。<\/blockquote>"}, {"q": "2.7 普通索引 vs 唯一索引（change buffer）", "tag": "", "body": "<ul><li>查询：唯一索引命中即停，普通索引多找一条（代价极小）。<\/li><li>写入：唯一索引需先读后写判断唯一性，<strong>不能用 change buffer<\/strong>；普通索引可先记入 <strong>change buffer<\/strong>，读该页时再 merge，<strong>减少随机 IO<\/strong>。<\/li><li>适用：写多读少的普通二级索引收益大；写后立即读反而多一次 merge。<\/li><li>结论：无唯一性需求的列用普通索引。<\/li><\/ul>"}, {"q": "2.8 前缀索引", "tag": "", "body": "<p>大字段取前 N 字符建索引，省空间。坑：不能用于 ORDER BY 和覆盖索引；区分度不足要评估 <code>COUNT(DISTINCT LEFT(col,n))/COUNT(*)<\/code>。<\/p>"}, {"q": "2.9 自增主键 vs UUID", "tag": "", "body": "<ul><li>自增：追加写，几乎不页分裂，顺序 IO。<\/li><li>UUID：随机无序 → 频繁<strong>页分裂<\/strong>、碎片、随机 IO；占用大，二级索引冗余主键成本高。<\/li><li>方案：雪花算法/号段生成趋势递增 bigint；UUID 可存 BINARY(16)。<\/li><\/ul>"}, {"q": "2.10 索引设计规范", "tag": "", "body": "<p>WHERE/ORDER BY/GROUP BY/JOIN ON 列优先；区分度 > 20%；避免冗余索引 (a) 与 (a,b) 并存；单表索引 ≤ 5~6 个；控制索引列长度。<\/p>\n<hr>"}]}, {"title": "03 事务与 MVCC", "questions": [{"q": "3.1 ACID 如何保证", "tag": "", "body": "<table><thead><tr><th>特性<\/th><th>机制<\/th><\/tr><\/thead><tbody><tr><td>原子性<\/td><td>undo log 回滚<\/td><\/tr><tr><td>一致性<\/td><td>应用约束 + 各机制共同保证<\/td><\/tr><tr><td>隔离性<\/td><td>锁 + MVCC<\/td><\/tr><tr><td>持久性<\/td><td>redo log + doublewrite + 刷盘<\/td><\/tr><\/tbody><\/table>"}, {"q": "3.2 隔离级别", "tag": "", "body": "<p>RU（脏读）→ RC（避免脏读，可能不可重复读）→ RR（默认，避免不可重复读，基本避免幻读）→ Serializable（全避免）。<\/p>\n<p>MySQL 的 RR 通过 MVCC（快照读）+ next-key lock（当前读）基本解决幻读。Oracle 默认 RC，很多互联网公司主动切 RC 提升并发。<\/p>"}, {"q": "3.3 MVCC 原理", "tag": "", "body": "<ul><li><strong>隐藏字段<\/strong>：DB_TRX_ID（最近修改事务 ID）、DB_ROLL_PTR（回滚指针 → undo 版本链）、DB_ROW_ID。<\/li><li><strong>ReadView<\/strong>：m_ids（活跃事务列表）、min_trx_id、max_trx_id、creator_trx_id。<\/li><li><strong>可见性判断<\/strong>：<\/li><\/ul>\n<pre><code>trx_id == creator_trx_id      → 自己改的，可见\ntrx_id &lt; min_trx_id           → 已提交，可见\ntrx_id &gt;= max_trx_id          → 视图之后的事务，不可见\ntrx_id ∈ m_ids                → 仍在活跃，不可见\n否则                           → 已提交，可见<\/code><\/pre>\n<ul><li>一句话：读操作沿 undo 版本链按 ReadView 找到\"快照创建时刻可见\"的版本，不加锁实现隔离。<\/li><\/ul>"}, {"q": "3.4 RR vs RC 的 MVCC 区别", "tag": "", "body": "<ul><li><strong>RC<\/strong>：每次快照读都生成新 ReadView → 能看到新提交 → 不可重复读。<\/li><li><strong>RR<\/strong>：事务内第一次快照读生成 ReadView 并复用 → 全程同一快照。<\/li><\/ul>\n<p>经典坑：RR 下先 SELECT 再 UPDATE（当前读），UPDATE 基于最新版本，快照读仍显示旧值。<\/p>"}, {"q": "3.5 快照读 vs 当前读", "tag": "", "body": "<ul><li>快照读：普通 SELECT，MVCC，不加锁。<\/li><li>当前读：<code>SELECT ... FOR UPDATE<\/code> / <code>LOCK IN SHARE MODE<\/code> / UPDATE / DELETE / INSERT，读最新版并加锁。<\/li><\/ul>"}, {"q": "3.6 幻读解决", "tag": "", "body": "<p>快照读靠 MVCC；当前读靠 <strong>next-key lock（记录锁+间隙锁）<\/strong> 阻止插入。严格讲 InnoDB 的 RR 不是标准定义下的\"完全无幻读\"（先快照读后插入再更新的场景仍可能感知到），能指出边界是加分项。<\/p>"}, {"q": "3.7 长事务危害", "tag": "", "body": "<p>持锁阻塞并发、undo 无法清理撑爆磁盘、版本链过长影响查询、拖慢主从同步。避免：及时 COMMIT、autocommit=1、事务内不做远程调用/大查询、巡检 innodb_trx。<\/p>\n<hr>"}]}, {"title": "04 锁机制", "questions": [{"q": "4.1 锁分类", "tag": "", "body": "<ul><li><strong>全局锁<\/strong>：FLUSH TABLES WITH READ LOCK，备份用（推荐 mysqldump --single-transaction）。<\/li><li><strong>表级锁<\/strong>：表锁、<strong>MDL 元数据锁<\/strong>（DDL 与 DML 互斥）、<strong>意向锁 IS/IX<\/strong>（表级标记，不阻塞）。<\/li><li><strong>行级锁<\/strong>：记录锁、间隙锁、临键锁。<strong>加在索引记录上<\/strong>——无索引 WHERE 会全表加锁（经典坑）。<\/li><li><strong>自增锁<\/strong>：AUTO-INC Lock，8.0 支持交错模式提并发。<\/li><\/ul>"}, {"q": "4.2 记录锁 / 间隙锁 / 临键锁", "tag": "", "body": "<ul><li>记录锁：锁单条索引记录。<\/li><li>间隙锁：锁开区间，只阻止插入。<\/li><li>临键锁：记录锁+前向间隙锁，左开右闭 (a,b]，RR 下加锁默认单位。<\/li><li>间隙锁/临键锁<strong>只在 RR 及以上生效<\/strong>；RC 只有记录锁。<\/li><\/ul>"}, {"q": "4.3 InnoDB 加锁规则（丁奇版）", "tag": "", "body": "<ol><li>原则1：加锁基本单位是 next-key lock（前开后闭）。<\/li><li>原则2：查找过程中访问到的对象才加锁。<\/li><li>优化1：等值查询向右遍历到第一个不满足等值条件的值，next-key 退化为<strong>间隙锁<\/strong>。<\/li><li>优化2：唯一索引等值查询命中，next-key 退化为<strong>记录锁<\/strong>。<\/li><li>已知现象：唯一索引<strong>范围查询<\/strong>会锁到第一个不满足条件的值（右边界也加锁）。<\/li><\/ol>\n<pre><code class=\"lang-sql\">-- 表 t(id 唯一, 数据 1,3,5,10)，RR：\nSELECT * FROM t WHERE id=5 FOR UPDATE;   -- 只锁 5（记录锁）\nSELECT * FROM t WHERE id=3 FOR UPDATE;   -- 3 不存在 → 间隙锁 (1,3)\nSELECT * FROM t WHERE id&gt;=3 FOR UPDATE;  -- 锁 (1,3]...(10,+∞)<\/code><\/pre>"}, {"q": "4.4 死锁", "tag": "", "body": "<ul><li>定义：循环等待。<\/li><li>处理：等待图检测，<strong>回滚代价最小的事务<\/strong>，抛 1213，应用重试。<\/li><li>避免：固定顺序访问、缩小锁范围、控制事务大小、RC 降级、热点行高并发可关死锁检测用锁超时兜底。<\/li><li>查看：<code>SHOW ENGINE INNODB STATUS<\/code> 的 LATEST DETECTED DEADLOCK。<\/li><\/ul>"}, {"q": "4.5 乐观锁 vs 悲观锁", "tag": "", "body": "<ul><li>悲观锁：SELECT ... FOR UPDATE（须在事务内、走索引）。<\/li><li>乐观锁：版本号 / 条件更新，UPDATE 受影响行数=0 则重试。<\/li><\/ul>\n<pre><code class=\"lang-sql\">UPDATE t SET stock=stock-1, version=version+1 WHERE id=1 AND version=3;\nUPDATE t SET stock=stock-1 WHERE id=1 AND stock&gt;0;<\/code><\/pre>\n<hr>"}]}, {"title": "05 日志与可靠性", "questions": [{"q": "5.1 redo log 与 WAL", "tag": "", "body": "<ul><li>redo log：InnoDB 层<strong>物理日志<\/strong>（页修改），崩溃恢复前滚，保证持久性。<\/li><li>WAL：先写日志（顺序写）再刷脏页，大幅提升写性能。<\/li><li>循环写文件，write pos 与 checkpoint；<code>innodb_flush_log_at_trx_commit<\/code>：1(每次fsync)/0(每秒)/2(写OS cache每秒刷)。<\/li><\/ul>"}, {"q": "5.2 binlog 三种格式", "tag": "", "body": "<ul><li><strong>STATEMENT<\/strong>：原始 SQL，日志小，非确定性函数（NOW/UUID/LIMIT）可能主从不一致。<\/li><li><strong>ROW<\/strong>（8.0 默认）：行级变更，最安全，日志大。<\/li><li><strong>MIXED<\/strong>：默认 STATEMENT，非安全语句自动切 ROW。<\/li><\/ul>"}, {"q": "5.3 redo vs binlog", "tag": "", "body": "<table><thead><tr><th>项<\/th><th>redo log<\/th><th>binlog<\/th><\/tr><\/thead><tbody><tr><td>层<\/td><td>InnoDB 层<\/td><td>Server 层<\/td><\/tr><tr><td>内容<\/td><td>物理（页修改）<\/td><td>逻辑（SQL/行变更）<\/td><\/tr><tr><td>写入<\/td><td>循环写<\/td><td>追加写归档<\/td><\/tr><tr><td>作用<\/td><td>崩溃恢复<\/td><td>复制、恢复<\/td><\/tr><\/tbody><\/table>"}, {"q": "5.4 两阶段提交", "tag": "", "body": "<pre><code>1. 写 redo log = PREPARE\n2. 写 binlog\n3. 写 redo log = COMMIT<\/code><\/pre>\n<p>崩溃恢复判断：redo PREPARE + binlog 不存在 → 回滚；redo PREPARE + binlog 存在 → 提交；redo COMMIT → 提交。<br>配合<strong>组提交<\/strong>减少 fsync；双1配置（sync_binlog=1 + innodb_flush_log_at_trx_commit=1）最安全。<\/p>"}, {"q": "5.5 undo log", "tag": "", "body": "<p>回滚 + MVCC 版本链；purge 线程清理不被引用的版本。<\/p>"}, {"q": "5.6 doublewrite buffer", "tag": "", "body": "<p>解决<strong>部分页写入（torn page）<\/strong>：16KB 页只写一半，redo 无法恢复坏页。先整页写入双写区（2MB 连续写），再写数据文件。SSD/云盘原子写场景可关闭（innodb_doublewrite=0）。<\/p>\n<hr>"}]}, {"title": "06 主从复制与高可用", "questions": [{"q": "6.1 复制原理", "tag": "", "body": "<pre><code>主库 binlog ──(IO线程)──▶ relay log ──(SQL线程)──▶ 从库数据<\/code><\/pre>\n<p>8.0 支持 GTID：事务全局唯一 ID，自动跳过已执行事务，切换无需找位点。扩展：一主多从、级联复制。<\/p>"}, {"q": "6.2 异步 / 半同步 / MGR", "tag": "", "body": "<ul><li>异步：不等确认，延迟小可能丢数据。<\/li><li>半同步：等至少一个从库 ACK 才返回，降低丢数据风险；从库故障会阻塞写入（可降级异步）。<\/li><li>MGR：Paxos 共识 + 多主，强一致自动选主，需 3 节点以上、网络稳定。<\/li><\/ul>"}, {"q": "6.3 主从延迟", "tag": "", "body": "<p><strong>原因<\/strong>：SQL 线程单线程回放跟不上、大事务、DDL/锁传导、从库负载。<br><strong>解决<\/strong>：并行复制（5.7 按库、8.0 writeset 事务级）、拆分大事务、一主多从分流、监控 Seconds_Behind_Master。<br><strong>读写分离注意<\/strong>：写完立即读可能读到旧数据，一致性要求高的走主库。<\/p>"}, {"q": "6.4 高可用与脑裂", "tag": "", "body": "<ul><li>MHA（经典）、Orchestrator（拓扑管理）、MGR + Router（官方推荐）、双主 + VIP。<\/li><li><strong>脑裂<\/strong>：网络分区两个主同时写。避免：过半仲裁（Paxos）、心跳+仲裁、fencing/STONITH 强制下线旧主。<\/li><li>一致性校验：pt-table-checksum + pt-table-sync。<\/li><\/ul>"}, {"q": "6.5 主从不一致排查", "tag": "", "body": "<p>pt-table-checksum 定位 → 常见原因（STATEMENT 格式/人工改从库/复制中断/DDL）→ pt-table-sync 回补或重建从库 → 预防：ROW 格式 + GTID + 定期巡检。<\/p>\n<hr>"}]}, {"title": "07 分库分表", "questions": [{"q": "7.1 何时需要", "tag": "", "body": "<ul><li>分库：连接数/IO 瓶颈、业务域拆分。<\/li><li>分表：单表千万~亿级或 >10GB，B+ 树加深、缓冲命中率下降、DDL 阻塞。<\/li><li><strong>先做减法<\/strong>：归档、加索引、优化 SQL、换硬件。垂直优先，水平次之。<\/li><\/ul>"}, {"q": "7.2 垂直 vs 水平", "tag": "", "body": "<ul><li>垂直分库：按业务域（用户库/订单库/库存库）。<\/li><li>垂直分表：大字段拆扩展表。<\/li><li>水平分表：同结构拆 t_order_0..N，路由计算、扩容复杂。<\/li><\/ul>"}, {"q": "7.3 分片键与算法", "tag": "", "body": "<ul><li>分片键：选最频繁的等值条件（user_id），保证均匀、避免时间热点。<\/li><li>取模：均匀但扩容全量迁移；范围：扩容友好可能倾斜；一致性哈希：扩容只影响相邻；<strong>基因法<\/strong>：订单号嵌入 user_id 哈希后缀，订单号/user_id 都能直接路由（电商经典）。<\/li><\/ul>"}, {"q": "7.4 平滑扩容", "tag": "", "body": "<p>双写 + 全量迁移 + 校验 + 灰度切换；取模翻倍只迁一半；配合 canal 订阅 binlog 做增量。<\/p>"}, {"q": "7.5 分布式 ID", "tag": "", "body": "<p>数据库自增（可步长错位）/ Redis INCR / UUID（无序不适合主键）/ <strong>雪花算法<\/strong>（1符号+41毫秒时间戳+10机器+12序列，趋势递增无中心；<strong>时钟回拨<\/strong>会重复，可用 Leaf-snowflake+ZK）/ 号段模式（Leaf-segment）。<\/p>"}, {"q": "7.6 跨库难题", "tag": "", "body": "<ul><li>join：应用层内存组装 / 字段冗余 / 宽表/ES。<\/li><li>事务：XA（刚性慢）/ TCC / <strong>本地消息表+MQ（最终一致，最常用）<\/strong> / Saga。<\/li><li>全局分页：各分片 limit + 归并；深分页用<strong>游标翻页<\/strong>。<\/li><li>中间件：ShardingSphere-JDBC（客户端主流）/ ShardingSphere-Proxy、MyCat（服务端透明）。<\/li><\/ul>\n<hr>"}]}, {"title": "08 SQL 优化与调优", "questions": [{"q": "8.1 EXPLAIN 关键列", "tag": "", "body": "<ul><li><strong>type<\/strong>（重点）：system > const > eq_ref > ref > range > index > ALL，至少到 range/ref。<\/li><li><strong>key/key_len<\/strong>：实际索引/长度（判断联合索引用了几列）。<\/li><li><strong>rows<\/strong>：预估扫描行数。<\/li><li><strong>Extra<\/strong>：Using index（覆盖✅）/ Using index condition（ICP✅）/ Using filesort⚠️ / Using temporary⚠️ / Using join buffer⚠️。<\/li><li>注意 rows 是估算值。<\/li><\/ul>"}, {"q": "8.2 定位慢 SQL", "tag": "", "body": "<p>慢查询日志（long_query_time=1）→ mysqldumpslow / pt-query-digest 汇总 → SHOW PROCESSLIST 抓实时 → EXPLAIN 分析 → 加索引/改写 SQL/上缓存。<\/p>"}, {"q": "8.3 深分页优化", "tag": "", "body": "<p>LIMIT 1000000,10 要扫 100 万行。方案：<\/p>\n<pre><code class=\"lang-sql\">-- 延迟关联\nSELECT * FROM t WHERE id IN (SELECT id FROM t WHERE xxx ORDER BY id LIMIT 1000000, 10);\n-- 游标翻页（推荐，适合下一页场景）\nSELECT * FROM t WHERE id &gt; 1000000 ORDER BY id LIMIT 10;<\/code><\/pre>\n<p>游标翻页不能随机跳页。<\/p>"}, {"q": "8.4 count(*) 优化", "tag": "", "body": "<p>count(*) 与 count(1) 等价；count(列) 数非空最慢。InnoDB 无行数缓存（MVCC 可见性）。优化：汇总计数表 / Redis 缓存 / 接受近似值（SHOW TABLE STATUS、EXPLAIN rows）/ 归档。<\/p>"}, {"q": "8.5 ORDER BY / GROUP BY / JOIN", "tag": "", "body": "<ul><li>排序：排序列命中索引免 filesort；减少 SELECT 列宽。<\/li><li>分组：走索引免临时表。<\/li><li>JOIN：小表驱动大表（NLJ 被驱动表走索引）；无索引用 BNL/Hash Join（8.0）；MRR 把随机回表变顺序读。<\/li><\/ul>"}, {"q": "8.6 大表 DDL", "tag": "", "body": "<p>直接 ALTER 加 MDL 锁阻塞 DML。方案：Online DDL（ALGORITHM=INPLACE, LOCK=NONE）、<strong>pt-osc / gh-ost<\/strong>（建新表拷贝+binlog 同步+rename，生产标准做法）、8.0 INSTANT 即时加列。<\/p>"}, {"q": "8.7 Buffer Pool 调优", "tag": "", "body": "<p>大小设物理内存 60%~75%（innodb_buffer_pool_size）；多 instance 减少争用；LRU 冷热区防全表扫描挤占热点；命中率 >99%。<\/p>"}, {"q": "8.8 连接数打满", "tag": "", "body": "<p>SHOW PROCESSLIST 找长连接/慢 SQL 并 kill → 排查连接泄漏、连接池过大、wait_timeout → max_connections 调大要评估内存 → 读写分离分流。<\/p>"}, {"q": "8.9 SQL 注入预防", "tag": "", "body": "<p>预编译参数绑定（PreparedStatement / MyBatis #{}）最有效；白名单校验；最小权限账号；屏蔽错误堆栈；${} 动态拼接单独做白名单。<\/p>\n<hr>"}]}, {"title": "09 数据库设计", "questions": [{"q": "9.1 三范式与反范式", "tag": "", "body": "<ul><li>1NF 字段原子；2NF 完全依赖；3NF 无传递依赖。<\/li><li>反范式：刻意冗余换查询性能（少 join、报表直接查），一致性靠业务保证。<\/li><li>经验：核心交易链路偏范式，查询聚合场景偏反范式。<\/li><\/ul>"}, {"q": "9.2 字段类型规范", "tag": "", "body": "<ul><li>金额用 <strong>DECIMAL(18,2)<\/strong>，绝不用 FLOAT/DOUBLE。<\/li><li>时间用 DATETIME（TIMESTAMP 有 2038 限制），需要毫秒用 DATETIME(3)。<\/li><li>字符集统一 <strong>utf8mb4<\/strong>；NOT NULL DEFAULT；大字段拆表；主键推荐自增/雪花 bigint。<\/li><\/ul>"}, {"q": "9.3 MySQL 与 Redis 缓存一致性", "tag": "", "body": "<ul><li>Cache Aside：写时先更新 DB 再<strong>删缓存<\/strong>（不是更新）。<\/li><li>延迟双删：更新后删缓存，等 1~2 秒再删一次。<\/li><li><strong>canal 订阅 binlog<\/strong>：应用只写 DB，canal 删缓存——解耦可靠，主流方案。<\/li><li>目标最终一致；强一致不依赖缓存。<\/li><\/ul>"}, {"q": "9.4 大字段影响", "tag": "", "body": "<p>TEXT/BLOB 可能溢出到 off-page，主页只存指针 → 额外 IO。方案：拆表、只 SELECT 必要列、内容放 OSS。<\/p>\n<hr>"}]}, {"title": "10 高频场景题", "questions": [{"q": "10.1 千万级表查询慢", "tag": "", "body": "<p>定位（EXPLAIN/慢日志）→ 索引优化（联合索引/覆盖索引）→ SQL 优化（免函数/隐式转换/深分页，游标翻页）→ 架构（归档冷数据、读写分离、缓存、分表）→ 硬件（Buffer Pool/SSD）。<\/p>"}, {"q": "10.2 秒杀防超卖", "tag": "", "body": "<p>前端限流 → Redis Lua 原子预扣 → MQ 削峰 → DB 条件更新 <code>UPDATE t_stock SET stock=stock-1 WHERE sku_id=? AND stock>0<\/code> 兜底 + 幂等（订单号唯一索引）→ 超时未支付回补库存。<br><strong>防超卖本质<\/strong>：读-判断-写 变成原子条件更新。<\/p>"}, {"q": "10.3 订单号设计", "tag": "", "body": "<p>全局唯一 + 趋势递增 + 可路由分片 + 可读。雪花变体/号段 + 尾部嵌入分片基因。不要用数据库自增对外暴露。<\/p>"}, {"q": "10.4 误删数据恢复", "tag": "", "body": "<p>前提 binlog_format=ROW。mysqlbinlog 按时间点/位点解析，回放到误操作前一秒；或全量备份+增量 binlog。预防：sql_safe_updates、DML 前备份、定期演练。<\/p>"}, {"q": "10.5 数据库 CPU 100%", "tag": "", "body": "<p>SHOW PROCESSLIST 找慢会话 → 慢查询日志/监控定位 SQL → EXPLAIN 分析 → 加索引/改写/kill → 长期 SQL 评审、读写分离。<\/p>"}, {"q": "10.6 好友关系表", "tag": "", "body": "<pre><code class=\"lang-sql\">CREATE TABLE friend (\n  user_id BIGINT NOT NULL, friend_id BIGINT NOT NULL, created_at DATETIME NOT NULL,\n  PRIMARY KEY (user_id, friend_id), KEY idx_friend (friend_id)\n) ENGINE=InnoDB;<\/code><\/pre>\n<p>存两行（A→B、B→A）简化列表查询；按 user_id 分片。<\/p>"}, {"q": "10.7 树形结构", "tag": "", "body": "<p>邻接表（8.0 递归 CTE）/ 路径枚举 / 闭包表（查询 O(1) 写放大）。评论深层级场景：闭包表或冗余 path + 缓存。<\/p>\n<hr>"}]}, {"title": "11 进阶原理", "questions": [{"q": "11.1 一条 UPDATE 的内部流程", "tag": "", "body": "<p>定位加锁（当前读+X锁/next-key）→ 读页进 Buffer Pool → 写 undo（版本链）→ 改内存页（脏页）→ 写 redo(PREPARE) → 写 binlog → redo(COMMIT) → 返回，脏页延迟刷盘。<\/p>"}, {"q": "11.2 Buffer Pool LRU 优化", "tag": "", "body": "<p>冷热两区（冷区 37%）：新页进冷区头部，停留超 1000ms 再访问才晋升热区——全表扫描的一次性页不会挤掉热点。预读机制减少连续 IO。<\/p>"}, {"q": "11.3 自增主键用尽", "tag": "", "body": "<p>TINYINT 127 / INT 21.47 亿 / BIGINT 922亿亿。用尽后 INSERT 报主键冲突。8.0 计数器持久化到 redo（重启不回退），5.7 重启可能复用已删最大值。<\/p>"}, {"q": "11.4 一张表能存多少行", "tag": "", "body": "<p>16KB 页、主键 8B+指针 6B ≈ 1170 分叉/页；3 层 ≈ 1170×1170×16 ≈ <strong>2190 万行<\/strong>（行 1KB）。千万级仍 3~4 次 IO，但运维/锁/DDL 成本上升。<\/p>"}, {"q": "11.5 CHAR vs VARCHAR", "tag": "", "body": "<p>CHAR 定长读取快无碎片；VARCHAR 变长省空间（1~2 字节长度前缀）。上限 65535 字节（utf8mb4 约 16383 字符）。定长短字段用 CHAR，长短差异大用 VARCHAR。<\/p>"}, {"q": "11.6 utf8 vs utf8mb4", "tag": "", "body": "<p>MySQL 的 utf8 = utf8mb3，最多 3 字节，存不了 emoji 和生僻字；utf8mb4 才是完整 UTF-8。8.0 默认 utf8mb4。迁移注意索引 key_len 变长。<\/p>"}, {"q": "11.7 NULL 的影响", "tag": "", "body": "<p>IS NULL/IS NOT NULL 可走索引（与 Oracle 不同）；count(列) 跳过 NULL；<strong>唯一索引允许多个 NULL<\/strong>；WHERE col != 'x' 不匹配 NULL；排序 NULL 最前。建议 NOT NULL DEFAULT。<\/p>"}, {"q": "11.8 MySQL 8.0 重要变化", "tag": "", "body": "<p>默认 utf8mb4、binlog_format=ROW、CTE 与窗口函数、移除查询缓存、数据字典入 InnoDB、Hash Join、INSTANT 加列、caching_sha2_password、增强并行复制（writeset）、SHOW REPLICA STATUS 新命名。<\/p>\n<hr>\n<p>*整理时间：2026-08 · 建议结合线上 EXPLAIN 实测验证各规则*<\/p>"}]}], "qcount": 71}]}, {"id": "redis", "name": "Redis", "icon": "⚡", "color": "#ef4444", "docs": [{"sub": "追问链冲刺版", "chapters": [{"title": "00 业务背景：Redis 在这个系统里干什么", "questions": [], "intro": "<p><strong>系统定位<\/strong>：B2B 大宗商品交易（挂摘牌/现货）的合同履约系统，核心是把「合同（商业契约）」与「履约（执行））」解耦，用双轨引擎支持顺序交收（状态机强管控）与自由交收（事件驱动）。<\/p>\n<p><strong>五大微服务<\/strong>：合同、履约、资金、物流仓储、票务；基础设施层明确标注 <strong>Redis（锁 / 缓存）<\/strong>、Kafka/RocketMQ（事件总线）、Seata/消息最终一致。<\/p>\n<p><strong>Redis 承担的四大业务职责<\/strong>：<\/p>\n<ol><li><strong>资金池余额缓存<\/strong>：<code>fund_pool(Plan-001).Paid_Pool.balance<\/code> 预存款池余额的读写缓存。<\/li><li><strong>分布式锁<\/strong>：资金预扣/冻结（<code>preFreeze → confirmSettlement<\/code>）与履约状态机推进的并发互斥。<\/li><li><strong>幂等控制<\/strong>：结算、退款等资金动作的幂等键，防止重复扣款/重复结算。<\/li><li><strong>读缓存<\/strong>：合同详情、商品、字典、权限、大屏看板等读多写少数据。<\/li><\/ol>\n<p><strong>核心资金铁律<\/strong>（来自系统设计）：*「没有资金预扣/冻结成功的业务流转，都是耍流氓」*——业务操作意向 → 资金预扣/冻结 → 冻结成功 → 业务状态推进 → 最终结算，预扣失败则事务回滚。Redis 就是这条链路上「预扣原子性 + 并发互斥 + 幂等」的物理实现。<\/p>\n<hr>"}, {"title": "追问链总览", "questions": [], "intro": "<table><thead><tr><th>#<\/th><th>追问链<\/th><th>业务锚点<\/th><th>纵深<\/th><\/tr><\/thead><tbody><tr><td>01<\/td><td>资金池余额缓存与一致性<\/td><td>fund_pool.balance 扣减<\/td><td>L5<\/td><\/tr><tr><td>02<\/td><td>资金预扣/冻结的分布式锁<\/td><td>preFreeze→confirmSettlement 2PC<\/td><td>L5<\/td><\/tr><tr><td>03<\/td><td>结算幂等<\/td><td>confirmSettlement 防重复结算<\/td><td>L4<\/td><\/tr><tr><td>04<\/td><td>履约状态机防重<\/td><td>同一履约单并发推进<\/td><td>L4<\/td><\/tr><tr><td>05<\/td><td>缓存一致性<\/td><td>合同/商品缓存更新<\/td><td>L4<\/td><\/tr><tr><td>06<\/td><td>缓存穿透/击穿/雪崩<\/td><td>履约高峰 + 热点合同<\/td><td>L4<\/td><\/tr><tr><td>07<\/td><td>事件总线与消息去重<\/td><td>EDA 领域事件<\/td><td>L4<\/td><\/tr><tr><td>08<\/td><td>挂摘牌防重 + 竞价排行<\/td><td>交易撮合 ZSet<\/td><td>L4<\/td><\/tr><tr><td>09<\/td><td>数据结构选型<\/td><td>资金流水/待办/大屏<\/td><td>L4<\/td><\/tr><tr><td>10<\/td><td>持久化与高可用<\/td><td>RDB/AOF/集群/热 key<\/td><td>L5<\/td><\/tr><tr><td>11<\/td><td>单线程模型与性能<\/td><td>阻塞操作/慢查询<\/td><td>L4<\/td><\/tr><tr><td>12<\/td><td>过期与淘汰策略<\/td><td>冻结超时释放/keyspace<\/td><td>L4<\/td><\/tr><\/tbody><\/table>\n<hr>"}, {"title": "🔥 追问链 01｜资金池余额缓存与一致性", "questions": [{"q": "L0 · 主问题：资金池余额（fund_pool.balance）为什么要放 Redis？", "tag": "", "body": "<blockquote>考察意图：资金余额是「强一致」数据，为什么还敢用 Redis 缓存？能否说清「缓存余额」与「DB 余额」的分工与兜底。<\/blockquote>\n<p><strong>答<\/strong>：余额是<strong>高频读写 + 热点<\/strong>数据——每一笔预扣、结算、退款都要读/改余额，直接打 DB 会成瓶颈。Redis 内存读写 + 单线程原子操作，能把余额的读写扛到万级 QPS。但<strong>余额是资金核心，不能只靠缓存<\/strong>，DB 才是最终权威。<\/p>"}, {"q": "L1 · 追问：缓存余额和 DB 余额怎么保证一致？", "tag": "", "body": "<p><strong>答<\/strong>：核心思想是「<strong>Redis 承担并发原子扣减，DB 承担最终落账<\/strong>」：扣减先走 Redis（Lua 原子判余额并扣减），DB 用<strong>流水 + 汇总快照<\/strong>异步落账；两者通过<strong>对账机制<\/strong>（安全网）定期比对，不平则冲正。<strong>资金场景不追求强一致缓存，追求「最终一致 + 可对账 + 可冲正」<\/strong>。<\/p>"}, {"q": "L2 · 追问：并发扣减怎么做到原子？DECRBY 直接减行不行？", "tag": "", "body": "<p><strong>答<\/strong>：不行，<code>DECRBY<\/code> 只会无脑减，可能把余额减成负数。必须用 <strong>Lua 脚本<\/strong>：<\/p>\n<pre><code class=\"lang-lua\">-- 原子判余额并扣减，防止超扣\nlocal cur = redis.call('GET', KEYS[1])\nif not cur or tonumber(cur) &lt; tonumber(ARGV[1]) then\n  return -1   -- 余额不足\nend\nreturn redis.call('DECRBY', KEYS[1], ARGV[1])<\/code><\/pre>\n<p>Redis <strong>单线程执行 Lua<\/strong>，整个「读-判-扣」脚本是原子的，天然避免并发超扣。<\/p>"}, {"q": "L3 · 追问：扣减成功了，但 DB 落账失败了怎么办？", "tag": "", "body": "<p><strong>答<\/strong>：这是分布式场景的经典「先扣缓存、后落账」顺序问题。方案：① 扣减成功但落账失败 → <strong>回滚 Redis 余额<\/strong>（补偿）或记入待处理队列重试；② 更稳的做法是<strong>先落 DB 流水（记流水表），再异步扣 Redis<\/strong>，用<strong>对账任务<\/strong>兜底；③ 生产常用「<strong>DB 流水为准 + Redis 余额为加速 + 对账冲正<\/strong>」三层，任何中间态都能通过对账纠偏。<\/p>"}, {"q": "L4 · 追问：Redis 崩了/缓存被清了，余额怎么办？", "tag": "", "body": "<p><strong>答<\/strong>：<strong>DB 兜底 + 重建<\/strong>。缓存失效后从 DB 的「汇总快照 + 流水」重建余额缓存；重建期间若并发写，用<strong>分布式锁<\/strong>串行化或<strong>双写<\/strong>。这就是为什么资金余额的 DB 侧一定是「明细流水 + 汇总快照」而非只存一个裸 balance——<strong>流水是余额的真相来源，缓存只是快照<\/strong>。<\/p>"}, {"q": "L5 · 追问：那资金余额到底适不适合用缓存？边界在哪？", "tag": "", "body": "<p><strong>答<\/strong>：分两段：<strong>查询余额<\/strong>可以缓存（读多，允许短暂延迟，配合对账）；<strong>扣减动作<\/strong>必须原子且最终以 DB 为准。更严谨的方案是「<strong>扣减走 DB 行锁 + 乐观锁，Redis 只缓存读<\/strong>」或「<strong>余额不入缓存，用 Redis 做扣减的原子闸门 + DB 落账<\/strong>」。能讲清「<strong>缓存放什么、不放什么、谁兜底<\/strong>」这条边界，就是资深水平——资金领域，<strong>正确性 > 性能<\/strong>。<\/p>\n<hr>"}]}, {"title": "🔥 追问链 02｜资金预扣/冻结的分布式锁", "questions": [{"q": "L0 · 主问题：preFreeze（资金预扣/冻结）为什么要加分布式锁？", "tag": "", "body": "<blockquote>考察意图：分布式锁的完整实现链路与工程坑，能否从 SET NX PX 一路讲到 RedLock 和锁粒度。<\/blockquote>\n<p><strong>答<\/strong>：同一履约单/同一资金池，可能被「确认收货结算」和「退款解冻」等多条链路并发操作；若不互斥，会出现<strong>预扣和结算同时改余额、状态推进错乱<\/strong>。分布式锁保证「同一资金操作时刻只有一个执行者」，配合 2PC 的 preFreeze→confirmSettlement 顺序。<\/p>"}, {"q": "L1 · 追问：Redis 分布式锁怎么实现？", "tag": "", "body": "<p><strong>答<\/strong>：核心命令 <code>SET key value NX PX 30000<\/code>——<code>NX<\/code> 保证只当 key 不存在才成功（互斥），<code>PX<\/code> 设过期时间（防死锁），<code>value<\/code> 用唯一标识（如 UUID+线程号）。加锁成功才执行业务，finally 里释放。<\/p>"}, {"q": "L2 · 追问：为什么要设 PX 过期时间？锁超时了业务还没跑完怎么办？", "tag": "", "body": "<p><strong>答<\/strong>：设 PX 是<strong>防死锁<\/strong>——持有锁的进程宕机，锁会自己过期，不会永久阻塞别人。但业务执行超过锁的 TTL，锁被释放、别人抢到，会导致<strong>并发执行<\/strong>。解法：<strong>看门狗续期<\/strong>（Redisson 的 watchdog，默认 30s 锁、每 10s 续期），锁在业务完成前自动续命，业务结束才真正释放。<\/p>"}, {"q": "L3 · 追问：释放锁为什么必须用 Lua？直接 DEL 行吗？", "tag": "", "body": "<p><strong>答<\/strong>：不行。若 A 的锁过期了、B 抢到锁，此时 A 执行完去 <code>DEL<\/code>，会<strong>把 B 的锁误删<\/strong>。必须用 Lua <strong>先校验 value 是自己的再删<\/strong>：<\/p>\n<pre><code class=\"lang-lua\">if redis.call('GET', KEYS[1]) == ARGV[1] then\n  return redis.call('DEL', KEYS[1])\nelse\n  return 0\nend<\/code><\/pre>\n<p>「<strong>加锁 SET NX PX + 释放 Lua 校验 value<\/strong>」是分布式锁的标准姿势。<\/p>"}, {"q": "L4 · 追问：主从切换导致锁丢失怎么办？RedLock 靠谱吗？", "tag": "", "body": "<p><strong>答<\/strong>：Redis 主从是异步复制，主挂了、从升主，<strong>锁可能已丢<\/strong>。RedLock 思路是向 N 个独立 Redis 节点（如 5 个）分别加锁，拿到过半（≥3）才算成功。<strong>但 RedLock 有争议<\/strong>（依赖时钟、节点故障时仍有窗口），且牺牲性能。工程上多数场景：<strong>用 Redis 单主/哨兵 + 看门狗，把锁的临界区做短、业务本身做幂等<\/strong>，比迷信 RedLock 更实际。资金极端场景可考虑 <strong>ZooKeeper/etcd<\/strong>（CP 强一致）做锁。<\/p>"}, {"q": "L5 · 追问：你们资金场景锁的 key 和粒度怎么设计？", "tag": "", "body": "<p><strong>答<\/strong>：锁 key 要<strong>精准到最小冲突单元<\/strong>，避免锁太粗影响并发。如 <code>lock:fund:pool:{poolId}<\/code>（锁资金池）或 <code>lock:fulfillment:{planId}:{node}<\/code>（锁履约单的某个节点）。<strong>粒度原则<\/strong>：资金预扣锁 <code>fund_pool<\/code> 维度，状态推进锁 <code>fulfillment_plan<\/code> 维度；绝不锁全局（如 <code>lock:all<\/code>），否则退化成单点串行。<\/p>\n<hr>"}]}, {"title": "🔥 追问链 03｜结算幂等", "questions": [{"q": "L0 · 主问题：confirmSettlement（预扣转实结）为什么必须幂等？", "tag": "", "body": "<blockquote>考察意图：资金动作「重复执行不重复扣钱」是底线，能否给出幂等键的完整设计。<\/blockquote>\n<p><strong>答<\/strong>：结算涉及真金白银。网络超时重试、MQ 重复投递、定时任务重跑，都可能导致同一笔结算被执行多次。<strong>幂等保证「同一笔资金业务操作，重复执行也只生效一次」<\/strong>，否则就是重复扣款事故。<\/p>"}, {"q": "L1 · 追问：幂等键怎么设计？用 SETNX 吗？", "tag": "", "body": "<p><strong>答<\/strong>：用<strong>业务唯一键<\/strong>做幂等标识，如 <code>settle:{settlementNo}<\/code> 或 <code>settle:{planId}:{node}<\/code>。执行前 <code>SETNX settle:xxx 1 EX 86400<\/code>：<strong>抢到（返回1）才执行<\/strong>，抢不到说明已处理过，直接返回成功。SETNX 的原子性天然适合「先占坑再干活」。<\/p>"}, {"q": "L2 · 追问：光靠 Redis SETNX 就够了吗？Redis 丢了怎么办？", "tag": "", "body": "<p><strong>答<\/strong>：不够。Redis 是加速层，<strong>兜底必须是 DB<\/strong>：① 结算表对业务唯一键加<strong>唯一索引<\/strong>，重复插入直接报冲突；② 或结算单状态字段做 <strong>CAS 乐观锁<\/strong>（<code>UPDATE ... WHERE status='PRE_FROZEN'<\/code>，影响行数=0 说明已处理）。<strong>Redis 幂等键 + DB 唯一索引/状态机，双保险<\/strong>，Redis 只是把「已处理」的判断提前到内存层减少 DB 压力。<\/p>"}, {"q": "L3 · 追问：幂等键的过期时间怎么定？过期了又重试怎么办？", "tag": "", "body": "<p><strong>答<\/strong>：过期时间要<strong>覆盖「重试窗口」<\/strong>，通常设到业务重试周期之外（如结算重试 24h，幂等键设 25~48h）。但更稳妥的是：<strong>幂等键过期了也没关系，因为 DB 唯一索引/状态机永远兜底<\/strong>——Redis 幂等键只是「第一道快速闸门」，失效后落到 DB 层照样拦住。这就是「<strong>缓存可丢、DB 不可丢<\/strong>」的设计哲学。<\/p>"}, {"q": "L4 · 追问：幂等 + 事务 + 锁怎么组合才不出问题？", "tag": "", "body": "<p><strong>答<\/strong>：资金动作的标准组合是「<strong>锁 + 幂等 + 事务<\/strong>」三层：分布式锁保证并发互斥 → 幂等键保证重复调用只生效一次 → DB 事务保证「扣款 + 改状态 + 记流水」原子。<strong>顺序<\/strong>：加锁 → 幂等检查 → 事务内完成资金变更与状态流转 → 释放锁。任何一层缺失都可能在极端并发下出资金事故。<\/p>\n<hr>"}]}, {"title": "🔥 追问链 04｜履约状态机防重", "questions": [{"q": "L0 · 主问题：履约状态机推进（如「待发货 → 已发货」）怎么防并发重复推进？", "tag": "", "body": "<blockquote>考察意图：状态流转的并发控制，乐观锁与分布式锁的选型判断力。<\/blockquote>\n<p><strong>答<\/strong>：核心是<strong>状态流转必须「从旧状态原子地跳到新状态」<\/strong>。用 DB 乐观锁：<code>UPDATE fulfillment SET status='SHIPPED', version=version+1 WHERE id=? AND status='TO_SHIP'<\/code>，影响行数=0 说明已被别人推进过，直接放弃或报「状态已变更」。<\/p>"}, {"q": "L1 · 追问：乐观锁（CAS）和分布式锁（悲观锁）怎么选？", "tag": "", "body": "<p><strong>答<\/strong>：<strong>冲突概率低、单行更新<\/strong> → 乐观锁，无锁等待、吞吐高；<strong>冲突概率高、多行/多资源联动<\/strong> → 分布式锁，串行化避免浪费重试。资金+状态机场景常用<strong>组合<\/strong>：外层分布式锁串行化复杂编排，内层状态字段 CAS 做最后防线。<\/p>"}, {"q": "L2 · 追问：状态机 + 分布式锁 + 事务的组合，顺序有讲究吗？", "tag": "", "body": "<p><strong>答<\/strong>：有。标准顺序「<strong>加锁 → 读状态校验 → 业务动作 → 事务内改状态 → 释放锁<\/strong>」。坑点：① 锁必须<strong>包住「读状态 + 改状态」<\/strong>的整个临界区，否则读到的旧状态会并发改写；② 释放锁要在事务提交后（finally），避免事务没提交锁就放了。<\/p>"}, {"q": "L3 · 追问：锁超时导致状态推进「卡住」了怎么办？", "tag": "", "body": "<p><strong>答<\/strong>：先区分「锁被误释放导致并发推进」和「业务真的慢」。前者靠<strong>看门狗续期 + 释放锁 Lua 校验<\/strong>解决；后者靠<strong>把状态推进拆成短事务 + 幂等重试<\/strong>，确保即使锁超时、重试也能安全推进到目标状态（幂等保证不重复副作用）。<\/p>"}, {"q": "L4 · 追问：为什么状态机里最忌讳「先查状态再更新」？", "tag": "", "body": "<p><strong>答<\/strong>：因为「查」和「更新」之间有时间差，两个线程都查到 <code>TO_SHIP<\/code>，都去更新，就都推进成功——<strong>典型的 check-then-act 竞态<\/strong>。正确做法是把状态作为<strong>更新条件<\/strong>（<code>WHERE status='TO_SHIP'<\/code>）或加锁把「查+改」变成原子，绝不能「裸 SELECT 判断再裸 UPDATE」。<\/p>\n<hr>"}]}, {"title": "🔥 追问链 05｜缓存一致性", "questions": [{"q": "L0 · 主问题：更新合同/商品数据时，更新缓存还是删缓存？", "tag": "", "body": "<blockquote>考察意图：缓存更新策略的演进，以及「资金数据」与「普通数据」的一致性边界。<\/blockquote>\n<p><strong>答<\/strong>：<strong>删缓存（Cache Aside）<\/strong>。更新缓存在并发下可能写脏，不如「先更新 DB，再删除缓存」，让下次读按需回源。系统里合同详情、商品、字典都用这套。<\/p>"}, {"q": "L1 · 追问：先删缓存还是先更新 DB？", "tag": "", "body": "<p><strong>答<\/strong>：主流<strong>先更新 DB，再删缓存<\/strong>，不一致窗口更短。但仍可能短暂读到旧值（更新完、删缓存前有请求命中旧缓存），可接受最终一致。<\/p>"}, {"q": "L2 · 追问：删缓存失败了怎么办？", "tag": "", "body": "<p><strong>答<\/strong>：<strong>延迟双删<\/strong>（删一次，延时 1~2s 再删一次，清掉并发写回的脏值）；或更可靠用 <strong>canal 订阅 binlog<\/strong>——应用只写 DB，canal 解析 binlog 变更后异步删缓存，解耦且可重放。资金系统里普通业务数据（合同/商品）用这套就够。<\/p>"}, {"q": "L3 · 追问：资金类数据（余额、流水）也能这么删缓存吗？", "tag": "", "body": "<p><strong>答<\/strong>：<strong>不能简单套用<\/strong>。资金数据是强一致诉求，删缓存重建有窗口会读到「扣减前」的旧余额。所以资金余额不靠「删缓存重建」，而靠<strong>原子扣减 + 对账冲正<\/strong>（见追问链 01）。<strong>关键认知：缓存一致性策略要按数据一致性等级分级——普通数据「最终一致」，资金数据「强一致/可对账」<\/strong>。<\/p>"}, {"q": "L4 · 追问：哪些数据你绝不会放进缓存？", "tag": "", "body": "<p><strong>答<\/strong>：① <strong>资金流水/账本<\/strong>（真相来源，必须 DB 强一致）；② <strong>结算、预扣的中间状态<\/strong>（一旦缓存丢失会破坏 2PC 语义）；③ <strong>需跨服务强一致读的数据<\/strong>；④ 大字段/敏感合规数据（如银行授权、电子签章原文）。一句话：<strong>「能容忍短暂不一致的读多数据」才配进缓存，其余交给 DB<\/strong>。<\/p>\n<hr>"}]}, {"title": "🔥 追问链 06｜缓存穿透/击穿/雪崩", "questions": [{"q": "L0 · 主问题：缓存穿透、击穿、雪崩分别是什么？", "tag": "", "body": "<blockquote>考察意图：三大缓存问题的场景化应对，能否结合履约高峰给出具体方案。<\/blockquote>\n<p><strong>答<\/strong>：穿透——查<strong>不存在<\/strong>的数据，缓存没挡住、直接打 DB（如伪造的商品 ID）；击穿——<strong>某个热点 key<\/strong> 过期瞬间，海量请求集中打 DB（如爆款合同详情）；雪崩——<strong>大量 key 同时过期或缓存整体宕机<\/strong>，DB 被瞬间压垮。<\/p>"}, {"q": "L1 · 追问：穿透怎么防？（结合商品/合同 ID）", "tag": "", "body": "<p><strong>答<\/strong>：① <strong>布隆过滤器<\/strong>：把所有合法 ID 预先存进布隆，请求先过布隆，不存在直接拦截；② <strong>缓存空值<\/strong>：查不到也缓存一个短 TTL 的空结果；③ 参数校验（ID 格式/范围）兜底。B2B 场景商品 ID 相对有限，布隆过滤器 + 空值缓存最实用。<\/p>"}, {"q": "L2 · 追问：击穿怎么防？（热点合同被疯狂查询）", "tag": "", "body": "<p><strong>答<\/strong>：核心是<strong>避免「失效瞬间」的并发回源<\/strong>。① <strong>互斥锁重建<\/strong>：只让一个请求回源查 DB 重建缓存，其余等待或读旧值；② <strong>逻辑过期<\/strong>：缓存不设物理过期，存一个「逻辑过期时间」，读时发现逻辑过期就异步重建、先用旧值顶着；③ 热点数据<strong>永不过期 + 后台定时刷新<\/strong>。<\/p>"}, {"q": "L3 · 追问：雪崩怎么防？（履约高峰期大量字典/权限同时过期）", "tag": "", "body": "<p><strong>答<\/strong>：① <strong>过期时间加随机抖动<\/strong>（如 1h ± 10min），避免同时失效；② <strong>多级缓存<\/strong>（本地 Caffeine + Redis）；③ <strong>限流降级<\/strong>：缓存/DB 都扛不住时熔断、返回兜底数据；④ 缓存集群<strong>高可用<\/strong>（哨兵/集群），避免单点宕机。资金系统里「权限、字典」这类热读数据尤其要防雪崩。<\/p>"}, {"q": "L4 · 追问：履约高峰期，整体缓存怎么设计才稳？", "tag": "", "body": "<p><strong>答<\/strong>：分层设计：<strong>本地缓存（热点字典/权限）→ Redis（业务数据）→ DB（真相）<\/strong>。热点合同详情用「互斥锁重建 + 逻辑过期」；资金余额用「原子扣减不入常规缓存」；配合<strong>限流 + 降级 + 预热<\/strong>（高峰期前把热点数据提前灌入缓存）。核心是<strong>让热点永不「裸奔」打 DB<\/strong>。<\/p>\n<hr>"}]}, {"title": "🔥 追问链 07｜事件总线与消息去重", "questions": [{"q": "L0 · 主问题：系统用 EDA 事件总线，Redis 能做消息队列吗？", "tag": "", "body": "<blockquote>考察意图：EDA 事件驱动的消息可靠性，以及 Redis 做队列的边界。<\/blockquote>\n<p><strong>答<\/strong>：能。<strong>List<\/strong> 可以做简单队列（LPUSH/BRPOP），<strong>Redis Stream<\/strong>（5.0+）是真正的消息队列结构，支持消费组、ACK、消息持久化。但 Redis 做队列是「<strong>尽力而为<\/strong>」，消息持久化靠 AOF，宕机可能丢消息。<\/p>"}, {"q": "L1 · 追问：领域事件消费为什么必须幂等？", "tag": "", "body": "<p><strong>答<\/strong>：MQ 的<strong>至少一次投递<\/strong>语义下，事件可能被重复投递（重试、分区再平衡）。「合同生效 → 生成履约计划」「资金状态变更 → 推进履约进度」这类事件，重复消费会导致重复生成计划/重复推进。所以<strong>消费端必须幂等<\/strong>——用事件 ID 做幂等键（见追问链 03）。<\/p>"}, {"q": "L2 · 追问：Redis Stream 的消费组是什么？怎么用？", "tag": "", "body": "<p><strong>答<\/strong>：消费组允许多个消费者<strong>并行消费同一条 Stream<\/strong>，每个消息被组内一个消费者处理，通过 <code>XACK<\/code> 确认；没 ACK 的消息进 <strong>Pending 列表<\/strong>，可重新投递给其他消费者——天然支持「消费者故障接管」。<code>XADD<\/code> 生产、<code>XREADGROUP<\/code> 消费、<code>XACK<\/code> 确认。<\/p>"}, {"q": "L3 · 追问：资金类事件为什么用 RocketMQ/Kafka 而不用 Redis？", "tag": "", "body": "<p><strong>答<\/strong>：<strong>可靠性等级不同<\/strong>。资金事件（结算、退款）要求<strong>不丢、可回溯、顺序保证<\/strong>：RocketMQ/Kafka 有<strong>多副本持久化、消息回溯、死信队列、事务消息<\/strong>。Redis 做队列在宕机时可能丢消息、且 Stream 的持久化依赖 AOF 配置，<strong>扛不住资金级的可靠性要求<\/strong>。所以系统里「<strong>普通事件可上 Redis Stream，资金事件必须上 MQ<\/strong>」。<\/p>"}, {"q": "L4 · 追问：消息的顺序性 + 幂等 + 去重，怎么一起保证？", "tag": "", "body": "<p><strong>答<\/strong>：① <strong>顺序性<\/strong>：同一资金池/履约单的事件发到<strong>同一分区<\/strong>（按 poolId/planId 做 key 哈希），单分区内有序；② <strong>幂等/去重<\/strong>：消费端用<strong>业务唯一键（事件 ID/业务单号）<\/strong>做幂等，重复消息直接跳过；③ <strong>兜底<\/strong>：DB 状态机 + 唯一索引拦截非法状态流转。顺序靠分区，幂等靠业务键，两者叠加才可靠。<\/p>\n<hr>"}]}, {"title": "🔥 追问链 08｜挂摘牌防重 + 竞价排行", "questions": [{"q": "L0 · 主问题：挂摘牌/竞价里，Redis 承担什么角色？", "tag": "", "body": "<blockquote>考察意图：交易撮合场景的并发防重与有序结构选型。<\/blockquote>\n<p><strong>答<\/strong>：① <strong>防重复摘牌<\/strong>：同一挂牌单只能被摘一次，用 SETNX 抢占；② <strong>竞价/挂单排序<\/strong>：用 ZSet 按价格排序，O(log N) 插入、O(1) 取最高/最低价；③ <strong>交易撮合状态缓存<\/strong>：挂牌/摘牌状态高频查询。<\/p>"}, {"q": "L1 · 追问：摘牌怎么防重复？", "tag": "", "body": "<p><strong>答<\/strong>：<code>SETNX listing:lock:{listingId} userId EX 300<\/code> 抢占挂牌单，<strong>抢到才允许摘牌<\/strong>；DB 侧挂牌单状态字段 <code>WHERE status='ON_LISTING'<\/code> 乐观锁兜底。Redis 是「快速闸门」，DB 状态是「最终裁决」。<\/p>"}, {"q": "L2 · 追问：竞价怎么用 ZSet 实现价格排序？", "tag": "", "body": "<p><strong>答<\/strong>：<code>ZADD auction:{auctionId} price bidderId<\/code>，用价格做 score；<code>ZREVRANGE<\/code> 取最高价、<code>ZREMRANGEBYRANK<\/code> 踢出局、<code>ZINCRBY<\/code> 加价。出价即 <code>ZADD<\/code>，若新价低于当前最高价直接拒绝。ZSet 的<strong>有序 + 去重（member 唯一）<\/strong>天然适合竞价簿。<\/p>"}, {"q": "L3 · 追问：挂单行情/排行榜这种「实时有序」数据，为什么用 ZSet 而不是 DB ORDER BY？", "tag": "", "body": "<p><strong>答<\/strong>：ZSet 是<strong>内存有序结构<\/strong>，<code>ZRANGE/ZREVRANGE<\/code> 是 O(log N + M)，万级挂单毫秒级返回；DB 的 <code>ORDER BY<\/code> 每次全表排序，高并发下不可接受。且 ZSet 支持<strong>实时增量更新<\/strong>（<code>ZINCRBY<\/code> 调价），DB 每次都是整行 UPDATE + 重新排序。<\/p>"}, {"q": "L4 · 追问：竞价高潮期 ZSet 本身成为热点怎么办？", "tag": "", "body": "<p><strong>答<\/strong>：① 竞价簿的 key 按<strong>单品/场次<\/strong>隔离（<code>auction:{id}<\/code>），热点打散；② 读多写多时，<strong>主写从读<\/strong>（写主、读从）或用<strong>本地缓存 + 定期同步<\/strong>；③ 关键竞价动作加<strong>分布式锁<\/strong>串行化，避免并发改价错乱；④ 极端场景用 <strong>Lua 脚本<\/strong>把「校验 + 出价」原子化。<\/p>\n<hr>"}]}, {"title": "🔥 追问链 09｜数据结构选型", "questions": [{"q": "L0 · 主问题：Redis 有哪几种核心数据结构？", "tag": "", "body": "<blockquote>考察意图：是否清楚每种 Redis 数据结构适合的业务场景，而非只会用 String。<\/blockquote>\n<p><strong>答<\/strong>：String、List、Set、ZSet、Hash，外加 Bitmap、HyperLogLog、Geo、Stream 等扩展结构。<\/p>"}, {"q": "L1 · 追问：资金流水、待办清单、履约进度分别用什么结构？", "tag": "", "body": "<p><strong>答<\/strong>：<strong>资金流水<\/strong>（时序、可裁剪）→ List 或 ZSet（按时间 score 排序）；<strong>待办清单/任务<\/strong>（去重、状态）→ List 做队列，或 Set 做去重集合；<strong>履约进度/节点状态<\/strong>（字段化）→ Hash，<code>HSET fulfillment:{planId} payment 1 delivery 0<\/code>，一次读写多个字段。<\/p>"}, {"q": "L2 · 追问：为什么「对象/行数据」用 Hash 而不是把整个 JSON 塞进 String？", "tag": "", "body": "<p><strong>答<\/strong>：Hash 能<strong>按字段局部读写<\/strong>（<code>HGET/HINCRBY<\/code>），改一个字段不用序列化整个对象；String 存 JSON 每次都要整体 GET→改→SET，浪费且易并发覆盖。<strong>对象有字段级更新需求 → Hash<\/strong>；纯只读缓存 → String JSON 也行。<\/p>"}, {"q": "L3 · 追问：大屏实时看板（05-screen）这类「统计」数据用什么？", "tag": "", "body": "<p><strong>答<\/strong>：<strong>Bitmap<\/strong>（签到/活跃用户/去重计数）、<strong>HyperLogLog<\/strong>（海量 UV 去重，误差 0.81%）、<strong>ZSet<\/strong>（Top N 排行）。如「今日成交额 Top 10 商品」用 ZSet，「活跃企业数」用 Bitmap 或 HLL。统计类用这些结构<strong>内存占用极小、实时性高<\/strong>，比 DB <code>GROUP BY<\/code> 强得多。<\/p>"}, {"q": "L4 · 追问：Set 和 ZSet 的区别？什么时候用哪个？", "tag": "", "body": "<p><strong>答<\/strong>：Set 是<strong>无序去重<\/strong>集合，适合「去重 + 集合运算」（如「同时持有 A/B 合同的企业」用 SINTER）；ZSet 是<strong>有序去重<\/strong>，适合「排名/区间」（如「资金流水按时间、竞价按价格」）。<strong>需要顺序/排名 → ZSet，只要去重 → Set<\/strong>。<\/p>\n<hr>"}]}, {"title": "🔥 追问链 10｜持久化与高可用", "questions": [{"q": "L0 · 主问题：RDB 和 AOF 的区别？", "tag": "", "body": "<blockquote>考察意图：资金缓存的数据可靠性，RDB/AOF/主从/集群/热 key 的完整体系。<\/blockquote>\n<p><strong>答<\/strong>：RDB 是<strong>快照<\/strong>，把某个时刻内存全量 dump 到文件，恢复快但两次快照间可能丢数据；AOF 是<strong>追加日志<\/strong>，每条写命令都记，丢得少但文件大、恢复慢。默认混合：RDB 全量 + AOF 增量。<\/p>"}, {"q": "L1 · 追问：资金缓存用什么持久化策略？", "tag": "", "body": "<p><strong>答<\/strong>：<strong>AOF everysec<\/strong>（每秒 fsync 一次，最多丢 1 秒数据）+ 定期 RDB 兜底。资金余额/幂等键这类，宁可牺牲一点性能也要少丢；而纯缓存数据（可重建的）甚至可以<strong>关闭持久化<\/strong>。核心是<strong>按数据重要性分级配置<\/strong>——资金状态要 AOF，普通缓存可不持久化。<\/p>"}, {"q": "L2 · 追问：主从、哨兵、集群分别解决什么问题？", "tag": "", "body": "<p><strong>答<\/strong>：<strong>主从<\/strong>解决读扩展 + 数据冗余（主写从读）；<strong>哨兵<\/strong>解决高可用（主挂了自动选新主）；<strong>集群（Cluster）<\/strong>解决水平扩展（数据按 slot 分片到多个主节点）。资金系统通常是「<strong>主从 + 哨兵<\/strong>」保证可用，数据量大再上「<strong>集群<\/strong>」。<\/p>"}, {"q": "L3 · 追问：集群的 slot 哈希是什么？会有什么问题？", "tag": "", "body": "<p><strong>答<\/strong>：集群把 key 按 <strong>CRC16(key) % 16384<\/strong> 映射到 slot，slot 分布到各节点。问题：<strong>跨 slot 的多 key 操作<\/strong>（MGET、Lua 多 key）会失败，需要 hash tag（<code>{poolId}<\/code>）把相关 key 落到同一 slot；<strong>热 key<\/strong>会集中打某一节点导致单点瓶颈。<\/p>"}, {"q": "L4 · 追问：资金余额是天然热 key，怎么办？", "tag": "", "body": "<p><strong>答<\/strong>：① <strong>拆 key<\/strong>：<code>fund:balance:{poolId}<\/code> 无法拆时，用<strong>多副本 key<\/strong>（<code>balance:0/1/2...<\/code>）读时随机、写时全量或聚合；② <strong>本地缓存<\/strong>：余额短期缓存在应用内存（Caffeine），减少打 Redis；③ <strong>读写分离<\/strong>：读走从节点分摊；④ <strong>限流<\/strong>保护主节点。核心是<strong>把单点的集中读写打散<\/strong>。<\/p>"}, {"q": "L5 · 追问：主从切换期间，幂等键/锁丢了会怎样？怎么兜底？", "tag": "", "body": "<p><strong>答<\/strong>：主从<strong>异步复制<\/strong>，切换瞬间可能有数据未同步，导致幂等键/锁丢失 → 重复扣款/重复执行风险。兜底：① <strong>DB 唯一索引/状态机永远是最终裁决<\/strong>（Redis 丢了也能拦住）；② 关键资金操作<strong>降级为 DB 强一致<\/strong>（短暂牺牲性能换正确性）；③ 监控主从延迟，延迟过高时告警或熔断。<strong>资金场景的底线永远是 DB，Redis 只是加速<\/strong>。<\/p>\n<hr>"}]}, {"title": "🔥 追问链 11｜单线程模型与性能", "questions": [{"q": "L0 · 主问题：Redis 是单线程，为什么还这么快？", "tag": "", "body": "<blockquote>考察意图：Redis 单线程「快」的本质，以及哪些操作会踩性能坑。<\/blockquote>\n<p><strong>答<\/strong>：① <strong>纯内存操作<\/strong>；② <strong>IO 多路复用<\/strong>（epoll）单线程高效处理海量连接；③ <strong>单线程无锁无上下文切换<\/strong>，避免了多线程竞争开销。瓶颈不在 CPU 而在内存和网络。<\/p>"}, {"q": "L1 · 追问：6.0 之后不是多线程了吗？", "tag": "", "body": "<p><strong>答<\/strong>：6.0 的多线程<strong>只用于网络 IO 的读写解析<\/strong>（收发数据、协议解析），<strong>命令执行仍是单线程<\/strong>。这样既利用多核处理 IO，又保持命令执行的原子性和无锁优势。<\/p>"}, {"q": "L2 · 追问：哪些命令会阻塞 Redis？为什么危险？", "tag": "", "body": "<p><strong>答<\/strong>：<strong>KEYS \\<\/strong>*（全库扫描）、<strong>大 key 的 DEL<\/strong>、<strong>SMEMBERS/HGETALL 大集合<\/strong>、<strong>flushall<\/strong>、复杂排序。因为它们<strong>单线程执行、耗时长<\/strong>，期间所有其他命令排队，整个 Redis 卡顿。生产<strong>禁用 KEYS<\/strong>，用 <code>SCAN<\/code> 渐进式遍历；大 key 要拆分。<\/p>"}, {"q": "L3 · 追问：大 key 会带来什么问题？怎么定位和处理？", "tag": "", "body": "<p><strong>答<\/strong>：大 key（单个 String 几 MB、集合几十万元素）会：<strong>阻塞单线程<\/strong>（读写/删除都慢）、<strong>网络传输大<\/strong>、<strong>内存分布不均<\/strong>、<strong>主从同步慢<\/strong>。定位：<code>redis-cli --bigkeys<\/code> 或 <code>MEMORY USAGE key<\/code>。处理：<strong>拆分成多个小 key<\/strong>（如大 Hash 按 ID 哈希拆 N 份）、集合用 HSCAN/SSCAN 分批读、删除用 <code>UNLINK<\/code>（异步删）。<\/p>"}, {"q": "L4 · 追问：怎么定位 Redis 慢查询？", "tag": "", "body": "<p><strong>答<\/strong>：① <code>SLOWLOG GET<\/code> 看执行慢的命令及耗时；② 排查 <code>KEYS<\/code>/大 key/复杂度高的命令（<code>SORT<\/code>、<code>SINTER<\/code> 大集合）；③ 监控<strong>内存碎片率<\/strong>、<code>used_memory<\/code>、阻塞客户端数；④ 用 <code>redis-cli --latency<\/code> 测延迟。发现慢命令就改写（SCAN 替代 KEYS、拆分大 key、避免 O(N) 命令打大集合）。<\/p>\n<hr>"}]}, {"title": "🔥 追问链 12｜过期与淘汰策略", "questions": [{"q": "L0 · 主问题：Redis 的过期 key 是怎么删除的？", "tag": "", "body": "<blockquote>考察意图：内存管理与资金「冻结超时释放」的落地，能否把 TTL 机制用对。<\/blockquote>\n<p><strong>答<\/strong>：<strong>惰性删除 + 定期删除<\/strong>结合。惰性删除：访问 key 时发现过期才删；定期删除：后台周期性抽样检查过期 key 删除。两者配合，既不让过期 key 长期占内存，又不让删除阻塞。<\/p>"}, {"q": "L1 · 追问：内存满了怎么办？淘汰策略有哪些？", "tag": "", "body": "<p><strong>答<\/strong>：按 <code>maxmemory-policy<\/code> 淘汰：<strong>noeviction<\/strong>（报错不淘汰，资金场景常用）、<strong>allkeys-lru / volatile-lru<\/strong>（LRU 淘汰）、<strong>allkeys-lfu / volatile-lfu<\/strong>（LFU 淘汰热点不敏感）、<strong>random<\/strong>、<strong>ttl<\/stro
