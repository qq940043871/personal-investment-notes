<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>面试背诵集合 · 全栈八股文</title>
<style>
:root{
  --bg1:#070b1a;--bg2:#0b1830;--bg3:#0a1226;
  --card:rgba(255,255,255,0.045);--card2:rgba(255,255,255,0.07);
  --line:rgba(120,180,255,0.16);--line2:rgba(120,180,255,0.28);
  --txt:#dbe6f5;--txt2:#9fb2cc;--muted:#6d7f9c;
  --accent:#38bdf8;--accent2:#22d3ee;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif;
  color:var(--txt);
  background:
    radial-gradient(1200px 600px at 12% -8%, rgba(56,189,248,.22), transparent 60%),
    radial-gradient(900px 500px at 88% 8%, rgba(34,211,238,.16), transparent 55%),
    radial-gradient(700px 500px at 50% 110%, rgba(99,102,241,.18), transparent 60%),
    linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  background-attachment:fixed;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

/* 顶部 */
header{
  position:sticky;top:0;z-index:50;
  backdrop-filter:blur(14px);
  background:linear-gradient(180deg,rgba(7,11,26,.92),rgba(7,11,26,.72));
  border-bottom:1px solid var(--line);
  padding:14px 22px 10px;
}
.hd-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{
  width:38px;height:38px;border-radius:10px;flex:none;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;color:#fff;
  background:linear-gradient(135deg,#0ea5e9,#6366f1);
  box-shadow:0 4px 18px rgba(56,189,248,.4);
}
.hd-title h1{font-size:18px;font-weight:700;letter-spacing:.5px}
.hd-title p{font-size:12px;color:var(--muted);margin-top:2px}
.hd-stats{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stat{
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:6px 12px;font-size:12px;color:var(--txt2);
}
.stat b{color:var(--accent2);font-size:15px;margin:0 2px}
.search-wrap{flex:1;min-width:220px;position:relative}
.search-wrap input{
  width:100%;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:9px 12px 9px 34px;color:var(--txt);
  font-size:13px;outline:none;transition:.2s;
}
.search-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,.15)}
.search-wrap::before{content:"🔍";position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.6}

/* Tab */
.tabs{
  display:flex;gap:6px;overflow-x:auto;padding:10px 22px 2px;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:none;display:flex;align-items:center;gap:6px;
  padding:7px 14px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:var(--card);color:var(--txt2);
  font-size:13px;white-space:nowrap;transition:.18s;user-select:none;
}
.tab:hover{border-color:var(--line2);color:var(--txt)}
.tab.active{
  color:#fff;border-color:transparent;
  background:linear-gradient(135deg,var(--accent),#6366f1);
  box-shadow:0 4px 16px rgba(56,189,248,.35);
}
.tab .n{font-size:11px;opacity:.8}

/* 主区 */
main{max-width:1180px;margin:0 auto;padding:18px 22px 60px}
.tech-head{display:flex;align-items:baseline;gap:10px;margin:6px 0 4px}
.tech-head h2{font-size:22px;font-weight:800}
.tech-head .cnt{font-size:12px;color:var(--muted)}

/* 文档区块 */
.doc{margin-top:18px}
.doc-title{
  display:flex;align-items:center;gap:10px;margin-bottom:12px;
}
.doc-badge{
  font-size:12px;font-weight:600;color:var(--accent2);
  background:rgba(34,211,238,.12);border:1px solid rgba(34,211,238,.3);
  padding:3px 10px;border-radius:999px;
}
.doc-title .sub{font-size:14px;color:var(--txt2);font-weight:600}
.doc-title .q{font-size:12px;color:var(--muted)}

/* 章节 */
.chapter{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  margin-bottom:12px;overflow:hidden;
}
.chapter>summary{
  list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;
  padding:13px 16px;font-size:14px;font-weight:700;color:var(--txt);
  transition:.15s;user-select:none;
}
.chapter>summary::-webkit-details-marker{display:none}
.chapter>summary:hover{background:var(--card2)}
.chapter>summary .arrow{transition:.2s;font-size:11px;color:var(--muted)}
.chapter[open]>summary .arrow{transform:rotate(90deg)}
.chapter>summary .ccount{margin-left:auto;font-size:11px;color:var(--muted);font-weight:500}
.chapter-intro{
  padding:10px 16px;font-size:13px;color:var(--txt2);
  border-top:1px dashed var(--line);line-height:1.7;
}
.chapter-body{padding:2px 12px 12px}

/* 题目卡片 */
.qcard{
  border:1px solid var(--line);border-radius:12px;margin:10px 0;
  background:rgba(255,255,255,0.02);overflow:hidden;transition:.15s;
}
.qcard:hover{border-color:var(--line2)}
.qcard.mastered{border-color:rgba(52,211,153,.45);background:rgba(16,185,129,.05)}
.qhead{
  display:flex;align-items:flex-start;gap:10px;padding:12px 14px;cursor:pointer;user-select:none;
}
.qhead:hover{background:var(--card2)}
.qhead .idx{flex:none;font-size:11px;color:var(--muted);font-weight:700;padding-top:2px;min-width:26px}
.qhead .qtxt{flex:1;font-size:14px;font-weight:600;line-height:1.55;color:var(--txt)}
.qhead .qtag{
  flex:none;font-size:10px;padding:2px 8px;border-radius:6px;margin-top:2px;font-weight:700;
  background:rgba(56,189,248,.15);color:#7dd3fc;border:1px solid rgba(56,189,248,.3);
}
.qhead .qtag.t-高频{background:rgba(239,68,68,.15);color:#fca5a5;border-color:rgba(239,68,68,.35)}
.qhead .qtag.t-必背{background:rgba(239,68,68,.15);color:#fca5a5;border-color:rgba(239,68,68,.35)}
.qhead .qtag.t-进阶{background:rgba(168,85,247,.15);color:#d8b4fe;border-color:rgba(168,85,247,.35)}
.qhead .qtag.t-中频{background:rgba(234,179,8,.15);color:#fde68a;border-color:rgba(234,179,8,.35)}
.qhead .qtag.t-基础{background:rgba(16,185,129,.15);color:#6ee7b7;border-color:rgba(16,185,129,.35)}
.qhead .caret{flex:none;color:var(--muted);font-size:11px;transition:.2s;padding-top:3px}
.qcard.open .qhead .caret{transform:rotate(90deg)}
.qbody{display:none;padding:0 14px 14px 50px;font-size:13.5px;line-height:1.8;color:var(--txt2)}
.qcard.open .qbody{display:block}
.qbody p{margin:6px 0}
.qbody ul,.qbody ol{margin:8px 0;padding-left:22px}
.qbody li{margin:4px 0}
.qbody strong{color:#eaf2ff}
.qbody code{
  font-family:"SFMono-Regular",Consolas,"JetBrains Mono",monospace;font-size:12.5px;
  background:rgba(56,189,248,.12);color:#93d5ff;padding:1px 6px;border-radius:5px;
}
.qbody pre{
  background:rgba(3,8,20,.7);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;overflow-x:auto;margin:10px 0;
}
.qbody pre code{background:transparent;color:#b8d8ff;padding:0;font-size:12.5px;line-height:1.65}
.qbody table{border-collapse:collapse;width:100%;margin:10px 0;font-size:12.5px}
.qbody th,.qbody td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.qbody th{background:rgba(56,189,248,.1);color:#dbeafe;font-weight:600}
.qbody blockquote{
  border-left:3px solid var(--accent);background:rgba(56,189,248,.07);
  padding:8px 14px;margin:10px 0;border-radius:0 8px 8px 0;color:#c4d6ec;
}
.qbody hr{border:none;border-top:1px dashed var(--line);margin:12px 0}

/* 操作按钮 */
.qactions{flex:none;display:flex;align-items:center;gap:6px}
.btn-master{
  border:1px solid var(--line2);background:transparent;color:var(--muted);
  border-radius:8px;padding:3px 8px;font-size:11px;cursor:pointer;transition:.15s;
}
.btn-master:hover{color:var(--txt);border-color:var(--accent)}
.btn-master.on{background:rgba(16,185,129,.18);color:#6ee7b7;border-color:rgba(52,211,153,.5)}

/* 空态 */
.empty{padding:40px;text-align:center;color:var(--muted);font-size:14px}
.float-actions{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:40}
.fab{
  width:42px;height:42px;border-radius:50%;border:1px solid var(--line2);cursor:pointer;
  background:rgba(11,24,48,.85);color:var(--txt2);font-size:16px;backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;transition:.15s;box-shadow:0 4px 14px rgba(0,0,0,.4);
}
.fab:hover{color:#fff;border-color:var(--accent)}
@media (max-width:720px){.hd-stats{margin-left:0;width:100%}.qbody{padding-left:14px}}
</style>
</head>
<body>
<header>
  <div class="hd-top">
    <div class="logo">📘</div>
    <div class="hd-title">
      <h1>面试背诵集合</h1>
      <p>Java · MySQL · Redis · Kafka/ZK · Nginx · Linux · Tomcat · 网络连接</p>
    </div>
    <div class="search-wrap">
      <input id="search" type="text" placeholder="搜索题目关键词，如：HashMap、MVCC、三次握手、B+树…">
    </div>
    <div class="hd-stats">
      <span class="stat">总题 <b id="statTotal">0</b></span>
      <span class="stat">已掌握 <b id="statDone">0</b></span>
      <span class="stat">掌握率 <b id="statPct">0</b>%</span>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<main id="main"></main>
<div class="float-actions">
  <button class="fab" id="btnExpand" title="全部展开">▾</button>
  <button class="fab" id="btnCollapse" title="全部折叠">▸</button>
  <button class="fab" id="btnMasterAll" title="当前页全部标记掌握">✓</button>
  <button class="fab" id="btnTop" title="回到顶部">↑</button>
</div>
<script>
const DATA = [{"id": "java", "name": "Java", "icon": "☕", "color": "#f59e0b", "docs": [{"sub": "考前背诵版", "chapters": [{"title": "01 JVM 内存区域与对象（8 题）", "questions": [{"q": "Q01 JVM 运行时内存区域如何划分？JDK8 有哪些变化？", "tag": "高频", "body": "<p><strong>答<\/strong>：线程私有 3 块（程序计数器、虚拟机栈、本地方法栈）+ 线程共享 2 块（堆、方法区）。JDK8 起方法区改为<strong>元空间 Metaspace<\/strong>，移出堆、用本地内存。<\/p>\n<ul><li><strong>程序计数器<\/strong>：唯一不会 OOM 的区域，记录字节码行号。<\/li><li><strong>虚拟机栈<\/strong>：栈帧 = 局部变量表 + 操作数栈 + 动态链接 + 返回地址；栈深超限抛 <code>StackOverflowError<\/code>，扩展失败抛 OOM。<\/li><li><strong>堆<\/strong>：GC 主战场，新生代（Eden + 2×Survivor）+ 老年代。<\/li><li><strong>元空间<\/strong>：类元数据存本地内存（默认无上限）；字符串常量池、静态变量仍在堆（JDK7 起静态变量已移入堆）。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：私有 3 件套（计数/栈/本地），共享 2 件套（堆/方法区）；JDK8 永久代换元空间，解决永久代 OOM。<\/blockquote>"}, {"q": "Q02 新生代与老年代如何划分？对象如何晋升？", "tag": "基础", "body": "<p><strong>答<\/strong>：新生代 = Eden + S0 + S1（默认 <strong>8:1:1<\/strong>），老年代存长命对象。<\/p>\n<ul><li>对象优先在 Eden 分配；Minor GC 后幸存对象在 S0/S1 间复制，默认 15 次（<code>-XX:MaxTenuringThreshold<\/code>）后晋升老年代。<\/li><li>大对象直接进老年代（<code>-XX:PretenureSizeThreshold<\/code>）。<\/li><li><strong>动态年龄判定<\/strong>：Survivor 中同年龄对象总和 > Survivor 一半，则 ≥ 该年龄的对象直接晋升。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：Eden 生、Survivor 倒、15 次或过半就进老；8:1:1 只浪费 10%（复制算法只需一块 Survivor 空着）。<\/blockquote>"}, {"q": "Q03 对象创建过程？", "tag": "高频", "body": "<p><strong>答<\/strong>：类加载检查 → 分配内存 → 初始化零值 → 设置对象头 → 执行构造方法。<\/p>\n<ol><li><strong>类加载检查<\/strong>：常量池能否定位到类符号引用，未加载先加载。<\/li><li><strong>分配内存<\/strong>：指针碰撞（堆规整）/ 空闲列表（不规整）；TLAB 优先，失败 CAS 加锁。<\/li><li><strong>初始化零值<\/strong>：字段置 0/null/false。<\/li><li><strong>设置对象头<\/strong>：Mark Word、类型指针、hashCode、分代年龄、锁标志。<\/li><li><strong>执行 <code><init><\/code><\/strong>：真正按程序员意图初始化。<\/li><\/ol>\n<blockquote><strong>口诀<\/strong>：查→分→零→头→构；DCL 要 volatile 就是因为 5 步可能重排。<\/blockquote>"}, {"q": "Q04 对象内存布局？为什么要求 8 字节对齐？", "tag": "进阶", "body": "<p><strong>答<\/strong>：对象头 + 实例数据 + 对齐填充。<\/p>\n<ul><li><strong>对象头<\/strong>：① Mark Word（64 位 8 字节：hashCode/分代年龄/锁标志/偏向线程 ID）；② 类型指针（压缩后 4 字节）；③ 数组长度（仅数组）。<\/li><li><strong>实例数据<\/strong>：字段值，相同宽度字段重排减少填充。<\/li><li><strong>对齐填充<\/strong>：对象大小必须 8 字节整数倍。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：头(8+4) + 数据 + 补齐；8 对齐 = CPU 高效访问 + 分配管理。<\/blockquote>"}, {"q": "Q05 对象访问定位：句柄 vs 直接指针？", "tag": "基础", "body": "<p><strong>答<\/strong>：HotSpot 用<strong>直接指针<\/strong>（reference 直接指向对象），少一次定位、更快；句柄方式 GC 移动对象只需改句柄、稳定。<\/p>\n<ul><li>直接指针：对象头类型指针指向方法区类信息。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：HotSpot 要速度选指针，GC 移动由 GC 自己更新引用。<\/blockquote>"}, {"q": "Q06 栈帧包含哪些结构？", "tag": "基础", "body": "<p><strong>答<\/strong>：局部变量表（Slot 复用，long/double 占 2 Slot）、操作数栈（字节码工作区）、动态链接（符号引用→直接引用）、返回地址。<code>-Xss<\/code> 控制栈大小。<\/p>\n<blockquote><strong>口诀<\/strong>：表、栈、链、址四件套。<\/blockquote>"}, {"q": "Q07 常见 OOM 类型与排查流程？", "tag": "高频", "body": "<p><strong>答<\/strong>：StackOverflowError（栈深）、Java heap space（堆满）、GC overhead limit exceeded（98% 时间 GC 且回收 <2%）、Metaspace（动态生成类过多）、Direct buffer memory（堆外泄漏）。<\/p>\n<ul><li>排查：<code>jps<\/code> 找进程 → <code>jmap -dump<\/code> 导出堆 → MAT/JProfiler 分析 Dominator Tree 找大对象与 GC Roots 引用链。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：栈、堆、GC 效率、元空间、Direct 五类；生产加 <code>-XX:+HeapDumpOnOutOfMemoryError<\/code> 自动落盘。<\/blockquote>"}, {"q": "Q08 逃逸分析、标量替换、锁消除是什么？", "tag": "进阶", "body": "<p><strong>答<\/strong>：分析对象是否逃逸出方法/线程，不逃逸则可优化。<\/p>\n<ul><li><strong>标量替换<\/strong>：对象拆成标量字段直接放栈（HotSpot 借此实现\"栈上分配\"）。<\/li><li><strong>锁消除<\/strong>：无竞争的 synchronized 直接去掉。<\/li><li><code>-XX:+DoEscapeAnalysis<\/code> 默认开启（Server 模式）。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：不逃逸 → 拆开放栈（标量替换）+ 去掉锁（锁消除），减少 GC 压力。<\/blockquote>\n<hr>"}]}, {"title": "02 类加载机制（5 题）", "questions": [{"q": "Q09 类加载过程分几步？", "tag": "高频", "body": "<p><strong>答<\/strong>：加载 → 验证 → 准备 → 解析 → 初始化。<\/p>\n<ul><li><strong>加载<\/strong>：全限定名取字节流 → 转方法区数据结构 → 生成 Class 对象。<\/li><li><strong>验证<\/strong>：文件格式、字节码语义、符号引用验证（防恶意字节码）。<\/li><li><strong>准备<\/strong>：静态变量分配内存并设<strong>零值<\/strong>（<code>static int a = 1<\/code> 此时 a=0）。<\/li><li><strong>解析<\/strong>：符号引用 → 直接引用。<\/li><li><strong>初始化<\/strong>：执行 <code><clinit><\/code>（静态赋值 + 静态代码块），JVM 加锁保证只执行一次。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：加验准解初；\"准备\"只给零值，真值在\"初始化\"。<\/blockquote>"}, {"q": "Q10 类初始化触发时机？哪些是\"被动引用\"不触发？", "tag": "高频", "body": "<p><strong>答<\/strong>：<strong>主动引用 6 种<\/strong>：new/getstatic/putstatic/invokestatic、反射、初始化子类先初始化父类、main 入口类、JDK7 动态语言、MethodHandle。<\/p>\n<ul><li><strong>被动引用不触发<\/strong>：① 引用父类静态字段只初始化父类；② <code>loadClass<\/code> 不初始化（<code>forName<\/code> 会）；③ <code>new SubClass[10]<\/code> 数组不触发；④ <code>static final<\/code> 编译期常量不触发。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：主动 = new/静态/反射/父子/main；被动 = 父静态、loadClass、数组、编译期常量。<\/blockquote>"}, {"q": "Q11 双亲委派模型是什么？为什么这样设计？", "tag": "高频", "body": "<p><strong>答<\/strong>：加载请求先委托给父加载器，父加载不了才自己加载。层级：Bootstrap → Extension（JDK9 起 Platform）→ Application → 自定义。<\/p>\n<ul><li><strong>好处<\/strong>：① 避免类重复加载；② 核心类安全（自定义 <code>java.lang.String<\/code> 永远不会被用到）。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：向上委派、向下兜底；重写 <code>findClass<\/code> 而非 <code>loadClass<\/code>。<\/blockquote>"}, {"q": "Q12 什么场景要打破双亲委派？", "tag": "进阶", "body": "<p><strong>答<\/strong>：JDBC SPI、Tomcat、OSGi、热部署。<\/p>\n<ul><li><strong>JDBC SPI<\/strong>：<code>DriverManager<\/code> 由 Bootstrap 加载，但实现类在 classpath → 用<strong>线程上下文类加载器<\/strong>反向加载。<\/li><li><strong>Tomcat<\/strong>：每个 WebApp 隔离加载自己的类，\"先自己加载、不行再委派\"。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：SPI 是官方对双亲委派的突破；打破方式 = 上下文类加载器 / 重写 loadClass。<\/blockquote>"}, {"q": "Q13 自定义类加载器与热部署原理？", "tag": "进阶", "body": "<p><strong>答<\/strong>：继承 ClassLoader 重写 <code>findClass<\/code>：读字节码 → <code>defineClass<\/code> → 返回 Class。<\/p>\n<ul><li><strong>热部署<\/strong>：换<strong>新的类加载器<\/strong>加载新版本，旧类可卸载（无引用 + 类加载器可回收）。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：同名不同加载器 = 两个类，<code>instanceof<\/code> 可能失效，强转抛 ClassCastException。<\/blockquote>\n<hr>"}]}, {"title": "03 垃圾回收（8 题）", "questions": [{"q": "Q14 如何判断对象存活？GC Roots 有哪些？", "tag": "高频", "body": "<p><strong>答<\/strong>：JVM 用<strong>可达性分析<\/strong>（引用计数有循环引用缺陷被弃用）。GC Roots：<\/p>\n<ol><li>虚拟机栈引用的对象（局部变量、参数）。<\/li><li>方法区静态属性引用的对象。<\/li><li>方法区常量引用的对象（字符串常量池）。<\/li><li>本地方法栈 JNI 引用的对象。<\/li><li>synchronized 锁住的对象、JVM 内部引用（Class、系统类加载器）。<\/li><\/ol>\n<blockquote><strong>口诀<\/strong>：栈引用、静态、常量、JNI、锁对象；finalize 只有一次自救机会且不保证执行，永远别用。<\/blockquote>"}, {"q": "Q15 四种引用类型及场景？", "tag": "高频", "body": "<p><strong>答<\/strong>：强（永不回收）→ 软（内存不足回收）→ 弱（下次 GC 必回收）→ 虚（随时回收，须配引用队列）。<\/p>\n<ul><li><strong>软引用<\/strong>：内存敏感缓存（图片缓存）。<\/li><li><strong>弱引用<\/strong>：ThreadLocal 的 key、WeakHashMap。<\/li><li><strong>虚引用<\/strong>：堆外内存/DirectByteBuffer 回收跟踪（NIO Cleaner）。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：强不软、软救急、弱即死、虚管堆外；回收后进 ReferenceQueue 可做回调。<\/blockquote>"}, {"q": "Q16 三大 GC 算法对比？", "tag": "高频", "body": "<p><strong>答<\/strong>：标记-清除（有碎片）、复制（无碎片但浪费空间）、标记-整理（无碎片但 STW 移动对象）。<\/p>\n<ul><li><strong>分代收集<\/strong>：新生代朝生夕死 → 复制；老年代存活率高 → 标记-清除/整理。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：新生代复制、老年代整理；复制算法用 Eden 8:1:1 化解浪费。<\/blockquote>"}, {"q": "Q17 垃圾收集器演进路线？", "tag": "高频", "body": "<p><strong>答<\/strong>：Serial（单线程）→ Parallel（JDK8 默认，追求吞吐）→ CMS（低停顿，JDK9 弃用/JDK14 移除）→ G1（JDK9+ 默认，Region 化可预测停顿）→ ZGC/Shenandoah（亚毫秒）。<\/p>\n<ul><li>CMS 4 阶段：初始标记(STW) → 并发标记 → 重新标记(STW) → 并发清除；缺陷：浮动垃圾 + 碎片 + 并发失败退化 Serial Old。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：串→并→CMS→G1→ZGC；CMS 与 G1 都追求低停顿，G1 用 Region 化解碎片。<\/blockquote>"}, {"q": "Q18 G1 收集器原理？", "tag": "高频", "body": "<p><strong>答<\/strong>：堆划为约 2048 个 Region，逻辑分代（Eden/Survivor/Old/Humongous）；跨 Region 引用用 <strong>RSet<\/strong> 记录，避免全堆扫描。<\/p>\n<ul><li><strong>三色标记<\/strong>：白（未访问）→ 灰（引用未扫完）→ 黑（引用扫完）。<\/li><li><strong>SATB<\/strong>：并发标记记录起始快照，防漏标。<\/li><li><strong>Mixed GC<\/strong>：新生代 + 部分老年代，<code>-XX:MaxGCPauseMillis<\/code>(默认 200ms) 控停顿。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：Region + RSet + SATB + Mixed；写屏障维护 RSet 与 SATB。<\/blockquote>"}, {"q": "Q19 ZGC 为什么能做到亚毫秒停顿？", "tag": "进阶", "body": "<p><strong>答<\/strong>：<strong>染色指针<\/strong>（64 位指针高 4 位存状态：Finalizable/Remapped/Marked0/Marked1）+ <strong>读屏障<\/strong>实现并发移动对象。<\/p>\n<ul><li>停顿不再随堆大小增长；JDK21 起多代 ZGC 默认开启。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：状态写进指针里（染色），读时发现不对就转发修复（读屏障）；\"并发搬家公司\"。<\/blockquote>"}, {"q": "Q20 三色标记漏标问题如何解决？", "tag": "进阶", "body": "<p><strong>答<\/strong>：漏标条件 = 黑色对象新引用白色对象 + 灰色对象不再引用它。<\/p>\n<ul><li><strong>CMS 增量更新<\/strong>：黑对象引用白对象时把黑对象标灰，重新标记再扫。<\/li><li><strong>G1 SATB<\/strong>：记录起始快照，把被删引用对象的快照保留为灰。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：增量更新多标（浮动垃圾）、SATB 也多标但防漏；漏标 = 该回收的没回收，比多标危险。<\/blockquote>"}, {"q": "Q21 安全点/安全区域是什么？调优常用参数？", "tag": "高频", "body": "<p><strong>答<\/strong>：<strong>安全点<\/strong>：GC 只能在所有线程到达安全点时暂停（方法调用、循环回跳、异常抛出）；<strong>安全区域<\/strong>：Sleep/Blocked 线程引用关系不变，GC 无需等待。<\/p>\n<ul><li>常用参数：<code>-Xms -Xmx<\/code>（建议相等）、<code>-Xmn<\/code>、<code>-XX:SurvivorRatio=8<\/code>、<code>-XX:+UseG1GC<\/code>、<code>-XX:MaxGCPauseMillis=200<\/code>、<code>-XX:+HeapDumpOnOutOfMemoryError<\/code>。<\/li><li>工具：jps/jstat/jmap/jstack/jinfo/Arthas。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：调优 = 定目标（吞吐 or 延迟）→ 看 GC 日志 → 找停顿来源 → 单变量验证。<\/blockquote>\n<hr>"}]}, {"title": "04 Java 基础与字符串（8 题）", "questions": [{"q": "Q22 String 为什么不可变？好处？", "tag": "高频", "body": "<p><strong>答<\/strong>：<code>final class<\/code> + <code>private final byte[] value<\/code>（JDK9 起）+ 不暴露修改方法。<\/p>\n<ul><li><strong>好处<\/strong>：① 常量池复用省内存；② 线程安全；③ hashCode 可缓存（适合做 HashMap key）；④ 网络参数/文件路径安全。<\/li><li>JDK9 <strong>Compact Strings<\/strong>：Latin-1 编码 1 字节/字符，省约 50% 内存。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：final 类 + final 数组 + 不暴露改法；四好处：省、安、快、稳。<\/blockquote>"}, {"q": "Q23 String / StringBuilder / StringBuffer 区别？", "tag": "基础", "body": "<p><strong>答<\/strong>：String 不可变；StringBuilder 可变非线程安全（最快）；StringBuffer 可变线程安全（方法级 synchronized）。<\/p>\n<blockquote><strong>口诀<\/strong>：拼接少用 String（循环内 O(n²)）；单线程 StringBuilder，多线程 StringBuffer。<\/blockquote>"}, {"q": "Q24 == 与 equals？字符串常量池与 intern？", "tag": "高频", "body": "<p><strong>答<\/strong>：<code>==<\/code> 比引用地址；<code>equals<\/code> 默认比地址，String 重写为比内容。<\/p>\n<ul><li>常量池（JDK7 起在堆）：字面量 <code>\"a\"<\/code> 入池；<code>new String(\"a\")<\/code> 建两个对象（池 + 堆各一）。<\/li><li><code>intern()<\/code>：入池并返回池中引用。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：字面量在池、new 在堆；<code>s2.intern() == s1<\/code> → true。<\/blockquote>"}, {"q": "Q25 hashCode 与 equals 的约定？", "tag": "高频", "body": "<p><strong>答<\/strong>：equals 相等 → hashCode 必相等；hashCode 相等 → equals 不一定相等（冲突）。<\/p>\n<ul><li><strong>只重写 equals 不重写 hashCode<\/strong>：HashMap 中相同逻辑对象分到不同桶，get 永远查不到 → 内存泄漏（对象丢失）。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：equals 相同则 hash 必同；hash 相同不保证 equals。<\/blockquote>"}, {"q": "Q26 Integer 缓存与装箱拆箱的坑？", "tag": "高频", "body": "<p><strong>答<\/strong>：<code>IntegerCache<\/code> 缓存 -128~127，<code>valueOf<\/code> 装箱走缓存。<\/p>\n<ul><li><code>Integer a=127,b=127; a==b<\/code> → <strong>true<\/strong>；128 → <strong>false<\/strong>。<\/li><li><strong>坑<\/strong>：<code>Integer i=null; if(i==1)<\/code> 拆箱 NPE；包装类比较用 <code>equals<\/code>。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：128 就是分界线；装箱=valueOf，拆箱=intValue，null 拆箱必 NPE。<\/blockquote>"}, {"q": "Q27 反射的原理与性能开销？", "tag": "进阶", "body": "<p><strong>答<\/strong>：Class 对象持有方法/字段元数据；<code>Method.invoke<\/code> 先走 JNI，多次调用后走<strong>字节码版本<\/strong>（Inflation 机制）。<\/p>\n<ul><li><strong>开销<\/strong>：类型检查、访问检查、装箱、无法内联。<\/li><li><strong>优化<\/strong>：缓存 Method/Field、<code>setAccessible(true)<\/code>、用 MethodHandle/VarHandle。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：invoke 有通胀机制——调多了生成字节码加速；反射是框架（Spring/MyBatis）的基石。<\/blockquote>"}, {"q": "Q28 深拷贝与浅拷贝？如何深拷贝？", "tag": "基础", "body": "<p><strong>答<\/strong>：浅拷贝只复制引用（共享对象）；深拷贝连内容一起复制。<\/p>\n<ul><li>实现深拷贝：重写 clone 逐层复制、序列化反序列化、<strong>JSON 序列化（推荐）<\/strong>、手动构造。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：<code>clone()<\/code> 默认浅；<code>Arrays.copyOf<\/code>/<code>List.copyOf<\/code> 都是浅拷贝。<\/blockquote>"}, {"q": "Q29 单例 DCL 为什么加 volatile？", "tag": "高频", "body": "<p><strong>答<\/strong>：<code>new Singleton()<\/code> 三步（分配内存 → 初始化 → 引用赋值）可能重排为（分配 → 赋值 → 初始化），另一线程读到<strong>未初始化<\/strong>对象。volatile 禁止重排 + 保证可见性。<\/p>\n<ul><li>更优写法：<strong>静态内部类<\/strong>（JVM 保证初始化唯一）、<strong>枚举<\/strong>（天然防反射/序列化破坏）。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：不加 volatile 可能拿到\"半成品\"对象；枚举单例 = 反射和序列化都打不穿。<\/blockquote>\n<hr>"}]}, {"title": "05 集合框架与 HashMap 源码（8 题）", "questions": [{"q": "Q30 ArrayList 扩容机制？", "tag": "高频", "body": "<p><strong>答<\/strong>：默认容量 10，满时扩容 <strong>1.5 倍<\/strong>（<code>old + (old >> 1)<\/code>），<code>Arrays.copyOf<\/code> 复制。<\/p>\n<ul><li>随机访问 O(1)，中间插入/删除 O(n)。<\/li><li><strong>实际 ArrayList 几乎总是优于 LinkedList<\/strong>：内存连续、CPU 缓存友好、扩容摊还 O(1)。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：1.5 倍扩容；<code>subList<\/code> 是视图，结构性修改抛 ConcurrentModificationException。<\/blockquote>"}, {"q": "Q31 HashMap 底层结构与 put 流程（JDK8）？", "tag": "高频", "body": "<p><strong>答<\/strong>：数组 + 链表 + 红黑树。<\/p>\n<ol><li><code>hash = key.hashCode() ^ (hash >>> 16)<\/code>（<strong>扰动函数<\/strong>，高位参与低 16 位）。<\/li><li>数组空 → resize 初始化 16。<\/li><li><code>(n - 1) & hash<\/code> 定位桶。<\/li><li>桶空直接插入；有节点链表尾插/树插。<\/li><li>链表长度 ≥ 8 <strong>且<\/strong>数组长度 ≥ 64 → 树化。<\/li><li>重复 key 覆盖旧值。<\/li><li>元素数 > threshold（容量 × 0.75）→ 扩容。<\/li><\/ol>\n<blockquote><strong>口诀<\/strong>：异或高位、按位取模、尾插、8 和 64 双条件树化、0.75 扩容。<\/blockquote>"}, {"q": "Q32 HashMap 为什么线程不安全？", "tag": "高频", "body": "<p><strong>答<\/strong>：JDK7 头插法 + 并发扩容 → 链表成环 → get 死循环 CPU 100%；JDK8 尾插解决死循环，但仍<strong>数据丢失<\/strong>、size 不准。<\/p>\n<ul><li>解决：ConcurrentHashMap / synchronizedMap。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：JDK7 死循环、JDK8 丢数据；并发一律 ConcurrentHashMap。<\/blockquote>"}, {"q": "Q33 为什么链表转红黑树阈值是 8？", "tag": "进阶", "body": "<p><strong>答<\/strong>：泊松分布下，负载因子 0.75 时桶中节点 ≥ 8 的概率约 0.00000006（千万分之六）——8 是\"树化兜底\"。<\/p>\n<ul><li>转树：链表 ≥ 8 <strong>且<\/strong>容量 ≥ 64（容量不足先扩容拆链表）。<\/li><li>退化：树节点 ≤ 6 转回链表（8/6 留 2 缓冲防震荡）。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：8 = 概率兜底；转树看\"8 且 64\"，退化看 6。<\/blockquote>"}, {"q": "Q34 HashMap 容量为什么是 2 的幂？传 17 会怎样？", "tag": "进阶", "body": "<p><strong>答<\/strong>：<code>(n-1) & hash<\/code> 位运算取代取模，更快且索引均匀；扩容后元素要么原位要么 +oldCap。<\/p>\n<ul><li>传 17 → <code>tableSizeFor<\/code> 向上取整为 <strong>32<\/strong>。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：2 的幂 = 位运算取模 + 扩容高效；预估容量 = 数据量 / 0.75 + 1。<\/blockquote>"}, {"q": "Q35 ConcurrentHashMap 原理（JDK7 vs JDK8）？", "tag": "高频", "body": "<p><strong>答<\/strong>：JDK7 <strong>分段锁 Segment<\/strong>（继承 ReentrantLock，默认 16 段）；JDK8 <strong>CAS + synchronized 锁桶<\/strong>（锁链表头）。<\/p>\n<ul><li>JDK8：桶空 CAS 插入，非空锁头节点；多线程协助扩容（ForwardingNode 标记已迁移桶）。<\/li><li><strong>禁止 null key/value<\/strong>（并发下无法区分\"不存在\"与\"值为 null\"）。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：JDK7 分段、JDK8 锁桶；fwd 节点让读线程跳新表。<\/blockquote>"}, {"q": "Q36 CopyOnWriteArrayList 原理与场景？", "tag": "高频", "body": "<p><strong>答<\/strong>：写时复制整份数组，读不加锁。<\/p>\n<ul><li>适用：<strong>读多写极少<\/strong>（白名单、监听器、配置）。<\/li><li>缺点：写代价高、内存翻倍、弱一致性迭代器。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：写复制、读无锁；只适合读多写极少的场景。<\/blockquote>"}, {"q": "Q37 LinkedHashMap 如何实现 LRU？", "tag": "进阶", "body": "<p><strong>答<\/strong>：HashMap + 双向链表维护顺序；<code>accessOrder=true<\/code> 时每次 get/put 把节点移到尾部 → 头部即最久未使用。<\/p>\n<ul><li>重写 <code>removeEldestEntry<\/code> 返回 <code>size() > capacity<\/code> → 天然 LRU 缓存。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：访问后移尾部，头部即最久未用；override removeEldestEntry 即得 LRU。<\/blockquote>\n<hr>"}]}, {"title": "06 并发基础与 JMM（9 题）", "questions": [{"q": "Q38 线程创建方式与生命周期状态？", "tag": "高频", "body": "<p><strong>答<\/strong>：继承 Thread、实现 Runnable（推荐）、实现 Callable + FutureTask、线程池。<\/p>\n<ul><li>状态：<code>NEW → RUNNABLE → (BLOCKED/WAITING/TIMED_WAITING) → TERMINATED<\/code>。<\/li><li><code>sleep<\/code> 不释放锁；<code>wait<\/code> 释放锁（须在 synchronized 内）；<code>yield<\/code> 让出 CPU 不阻塞。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：BLOCKED 等 synchronized 锁，WAITING 等 wait/join/park，TIMED_WAITING 是带超时版。<\/blockquote>"}, {"q": "Q39 JMM 是什么？三大特性如何保证？", "tag": "高频", "body": "<p><strong>答<\/strong>：JMM 规定线程工作内存与主内存的交互规则（工作内存 ≈ CPU 缓存，主内存 ≈ RAM）。<\/p>\n<ul><li><strong>原子性<\/strong>：synchronized / Lock / CAS（<code>i++<\/code> 是读-改-写三步，非原子）。<\/li><li><strong>可见性<\/strong>：volatile / synchronized / final。<\/li><li><strong>有序性<\/strong>：volatile / synchronized / happens-before。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：原子加锁、可见 volatile、有序靠 happens-before。<\/blockquote>"}, {"q": "Q40 happens-before 规则有哪些？", "tag": "高频", "body": "<p><strong>答<\/strong>：① 程序顺序；② 锁（unlock 先于后续 lock）；③ volatile 写先于读；④ 传递性；⑤ 线程 start 先于其内部操作；⑥ 线程内操作先于 join 返回；⑦ interrupt 先于被中断线程感知；⑧ 构造完成先于 finalize。<\/p>\n<blockquote><strong>口诀<\/strong>：程序、锁、volatile、传递、start、join、interrupt、finalize 八条。<\/blockquote>"}, {"q": "Q41 volatile 的原理与作用？", "tag": "高频", "body": "<p><strong>答<\/strong>：<strong>可见性<\/strong>（写后写回主内存 + 失效其他线程缓存，底层靠 MESI 缓存一致性）+ <strong>有序性<\/strong>（禁止重排），<strong>不保证原子性<\/strong>。<\/p>\n<ul><li>经典用法：状态标志、DCL 单例、双检锁。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：可见 + 有序，不原子；<code>volatile i++<\/code> 照样丢数据。<\/blockquote>"}, {"q": "Q42 synchronized 锁升级过程？", "tag": "高频", "body": "<p><strong>答<\/strong>：无锁 → 偏向锁 → 轻量级锁 → 重量级锁（不可逆）。<\/p>\n<ul><li><strong>偏向锁<\/strong>：记录线程 ID，同线程重入无 CAS。<\/li><li><strong>轻量级锁<\/strong>：CAS 自旋抢锁，适合锁占用短。<\/li><li><strong>重量级锁<\/strong>：依赖 OS 互斥量 Monitor，内核态切换开销大。<\/li><li>JDK15 起偏向锁废弃，JDK18 移除。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：偏→轻→重，按竞争程度选代价；无竞争偏向、轻竞争自旋、重竞争阻塞。<\/blockquote>"}, {"q": "Q43 CAS 原理与 ABA 问题？", "tag": "高频", "body": "<p><strong>答<\/strong>：比较内存值是否等于预期值，相等才更新（<code>Unsafe.compareAndSwapInt<\/code>，CPU 指令 cmpxchg）。<\/p>\n<ul><li><strong>ABA<\/strong>：A→B→A，CAS 误判未修改 → <code>AtomicStampedReference<\/code>（版本号）解决。<\/li><li>缺点：自旋空转耗 CPU；只能保证单变量原子性。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：比较-交换-失败重试；ABA 用版本号戳破。<\/blockquote>"}, {"q": "Q44 ThreadLocal 原理与内存泄漏？", "tag": "高频", "body": "<p><strong>答<\/strong>：每线程持有 ThreadLocalMap，key 是 ThreadLocal <strong>弱引用<\/strong>，value 强引用。<\/p>\n<ul><li><strong>泄漏<\/strong>：ThreadLocal 被回收后 key=null，value 仍被线程（尤其线程池复用）强引用 → 无法回收。<\/li><li><strong>解决<\/strong>：用后 <code>remove()<\/code>；get/set 会顺带清理过期条目（expungeStaleEntry）。<\/li><li>线程池下继承失效 → 阿里 <strong>TransmittableThreadLocal<\/strong>。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：弱 key 强 value，用完必 remove；InheritableThreadLocal 在线程池里是坑。<\/blockquote>"}, {"q": "Q45 死锁四条件与排查？", "tag": "高频", "body": "<p><strong>答<\/strong>：<strong>互斥、占有且等待、不可剥夺、循环等待<\/strong>。<\/p>\n<ul><li>排查：<code>jstack<\/code> 见 <code>Found one Java-level deadlock<\/code>；Arthas <code>thread -b<\/code>。<\/li><li>避免：锁顺序一致、tryLock 超时、锁粒度最小化。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：互斥、占有等待、不可剥夺、循环；破循环最常用。<\/blockquote>"}, {"q": "Q46 锁优化手段？", "tag": "进阶", "body": "<p><strong>答<\/strong>：<strong>锁消除<\/strong>（逃逸分析证明不逃逸就去掉锁）、<strong>锁粗化<\/strong>（连续加锁合并）、<strong>自适应自旋<\/strong>（按上次成功率动态调次数）。<\/p>\n<blockquote><strong>口诀<\/strong>：消、粗、自适应，配合锁升级三档。<\/blockquote>\n<hr>"}]}, {"title": "07 JUC 深度（8 题）", "questions": [{"q": "Q47 AQS 原理？", "tag": "高频", "body": "<p><strong>答<\/strong>：<code>volatile int state<\/code>（同步状态）+ CLH 双向等待队列。<\/p>\n<ul><li><strong>模板方法<\/strong>：tryAcquire/tryRelease/tryAcquireShared/tryReleaseShared 由子类实现；acquire = tryAcquire 失败 → addWaiter 入队 → acquireQueued 自旋/park。<\/li><li><strong>非公平<\/strong>：入队前先 CAS 抢一次；公平严格 FIFO。<\/li><li>用 <code>LockSupport.park/unpark<\/code> 阻塞唤醒（不依赖监视器、可精确唤醒）。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：state + CLH 队列 + 模板方法；ReentrantLock/CountDownLatch/Semaphore 都基于它。<\/blockquote>"}, {"q": "Q48 ReentrantLock 与 synchronized 对比？", "tag": "高频", "body": "<p><strong>答<\/strong>：ReentrantLock 手动 lock/unlock、可选公平、可中断（lockInterruptibly）、可超时（tryLock）、多 Condition 精确唤醒。<\/p>\n<ul><li><strong>可重入原理<\/strong>：state 计数，重入 +1、释放 -1，归零才真正释放。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：公平、中断、超时、多条件队列是 Lock 四张牌；synchronized 自动省心。<\/blockquote>"}, {"q": "Q49 读写锁与 StampedLock？", "tag": "进阶", "body": "<p><strong>答<\/strong>：ReentrantReadWriteLock 读读共享、读写/写写互斥；state 高 16 位读计数、低 16 位写计数；支持<strong>锁降级<\/strong>（写→读），不支持锁升级（死锁）。<\/p>\n<ul><li><strong>StampedLock<\/strong>：乐观读（不阻塞写）+ 悲观读 + 写锁三模式；不可重入、无 Condition。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：RRW 可降级不可升级；StampedLock 乐观读用版本戳校验。<\/blockquote>"}, {"q": "Q50 CountDownLatch / CyclicBarrier / Semaphore 区别？", "tag": "高频", "body": "<p><strong>答<\/strong>：CountDownLatch 倒计数门闩（等 N 个任务，<strong>一次<\/strong>）；CyclicBarrier 栅栏（N 个线程互相等，<strong>可 reset 复用<\/strong>）；Semaphore 信号量（限流，控制并发数）。<\/p>\n<blockquote><strong>口诀<\/strong>：一个等多个用 Latch，多个互相等用 Barrier，控制并发数用 Semaphore。<\/blockquote>"}, {"q": "Q51 线程池七大参数与执行流程？", "tag": "高频", "body": "<p><strong>答<\/strong>：corePoolSize、maximumPoolSize、keepAliveTime+TimeUnit、workQueue、threadFactory、handler。<\/p>\n<ul><li>流程：线程 < core → 建核心线程；≥ core → 入队；队列满 → 建非核心线程；队列满且达 max → <strong>拒绝策略<\/strong>；空闲超 keepAliveTime → 回收。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：核心不够就建、满了先排队、队列满了才扩、扩无可扩就拒绝——<strong>先入队后扩线程<\/strong>。<\/blockquote>"}, {"q": "Q52 拒绝策略与阻塞队列如何选？", "tag": "高频", "body": "<p><strong>答<\/strong>：AbortPolicy（默认，抛异常）、CallerRuns（调用线程执行）、Discard（静默丢）、DiscardOldest（丢最老）。<\/p>\n<ul><li>队列：ArrayBlockingQueue（有界）、LinkedBlockingQueue（默认无界<strong>易 OOM<\/strong>）、SynchronousQueue（无缓冲，任务直接交线程）、DelayQueue（延迟任务）。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：生产用有界队列 + CallerRuns；Executors 的 Fixed 池无界队列 OOM、Cached 池线程数 Integer.MAX。<\/blockquote>"}, {"q": "Q53 线程池大小如何确定？", "tag": "进阶", "body": "<p><strong>答<\/strong>：CPU 密集 <code>N+1<\/code>；IO 密集 <code>N × (1 + 等待/计算)<\/code> 或经验 2N。<\/p>\n<ul><li>队列容量与拒绝策略要压测验证；用 <code>availableProcessors()<\/code> 取核数。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：CPU 算、IO 等；严禁 Executors 快捷创建（阿里规约）。<\/blockquote>"}, {"q": "Q54 Future / CompletableFuture？", "tag": "进阶", "body": "<p><strong>答<\/strong>：Future get() 阻塞、无法编排；CompletableFuture 回调式链式编排（thenApply/thenCompose/thenCombine/whenComplete），allOf/anyOf 聚合，exceptionally/handle 处理异常。<\/p>\n<ul><li>原理：Completion 栈（Treiber 栈）回调链，默认 ForkJoinPool.commonPool。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：生产必须自定义线程池，别用 commonPool 被阻塞任务拖垮。<\/blockquote>\n<hr>"}]}, {"title": "08 IO 与网络（6 题）", "questions": [{"q": "Q55 BIO / NIO / AIO 区别？", "tag": "高频", "body": "<p><strong>答<\/strong>：BIO 阻塞（一连接一线程，线程爆炸）；NIO 同步非阻塞（多路复用 Selector，一线程管多连接）；AIO 异步非阻塞（内核完成回调，Linux 生态不成熟）。<\/p>\n<blockquote><strong>口诀<\/strong>：NIO 是\"同步非阻塞\"，AIO 才是\"异步非阻塞\"；Linux 下 epoll 让 NIO 成主流。<\/blockquote>"}, {"q": "Q56 NIO 三大组件？", "tag": "高频", "body": "<p><strong>答<\/strong>：<strong>Buffer<\/strong>（position/limit/capacity 三指针，flip 转读模式）、<strong>Channel<\/strong>（双向通道）、<strong>Selector<\/strong>（多路复用器，一个线程监听多 Channel 事件）。<\/p>\n<ul><li>流程：注册 → 事件就绪（select 返回 SelectionKey）→ 遍历处理。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：缓冲、通道、选择器；Channel 与流最大区别是\"双向\"。<\/blockquote>"}, {"q": "Q57 select / poll / epoll 对比？", "tag": "进阶", "body": "<p><strong>答<\/strong>：select fd_set 位图（上限 1024、每次全量拷贝、O(n)）；poll pollfd 数组（无上限、仍全量拷贝）；epoll 事件表 + 红黑树（<strong>mmap 共享<\/strong>、注册一次、O(1) 事件回调、支持 <strong>ET 边缘触发<\/strong>）。<\/p>\n<ul><li>Netty 默认 LT（水平触发）。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：select 上限 1024、poll 无限不增量、epoll 注册一次 O(1)；ET 要一次读完。<\/blockquote>"}, {"q": "Q58 零拷贝是什么？Java 如何实现？", "tag": "进阶", "body": "<p><strong>答<\/strong>：传统 read+write 4 次拷贝 + 4 次上下文切换。<\/p>\n<ul><li><strong>mmap<\/strong>：用户态与内核共享缓冲区，少 1 次拷贝（MappedByteBuffer）。<\/li><li><strong>sendfile<\/strong>：内核直接 DMA 到 Socket（FileChannel.transferTo）→ 2 次拷贝。<\/li><li>Netty FileRegion 底层即 transferTo。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：4 拷贝 → mmap 3 拷贝 → sendfile 2 拷贝；关键是不经过用户态。<\/blockquote>"}, {"q": "Q59 Netty 核心架构与线程模型？", "tag": "高频", "body": "<p><strong>答<\/strong>：<strong>主从 Reactor<\/strong>：Main Reactor（boss 管 accept）→ Sub Reactor（worker 管 IO 读写）。<\/p>\n<ul><li>组件：Bootstrap、EventLoopGroup（每 EventLoop = 一线程 + 一 Selector）、ChannelPipeline（责任链）、ByteBuf（双指针、池化、零拷贝）、ChannelHandler。<\/li><li><strong>粘包拆包<\/strong>：LineBased/DelimiterBased/FixedLength/<strong>LengthFieldBasedFrameDecoder<\/strong>（最常用）。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：boss 接客、worker 干活；耗时业务丢独立线程池，别堵 eventLoop。<\/blockquote>"}, {"q": "Q60 TCP 三次握手、四次挥手与 TIME_WAIT？", "tag": "基础", "body": "<p><strong>答<\/strong>：三次握手 SYN → SYN+ACK → ACK（确认收发能力、防历史连接）；四次挥手 FIN → ACK → FIN → ACK（半关闭）。<\/p>\n<ul><li><strong>TIME_WAIT<\/strong>（主动关闭方，2MSL）：保证最后 ACK 可达 + 让旧报文消失；大量 TIME_WAIT 出现在短连接高并发 → 改长连接/调内核参数。<\/li><li>服务端大量 <strong>CLOSE_WAIT<\/strong>：对端关闭但本地没 close（代码/连接池泄漏）。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：握手 3 次建双向、挥手 4 次因半关；TIME_WAIT 在主动方、CLOSE_WAIT 是被动方没关。<\/blockquote>\n<hr>"}]}, {"title": "09 Spring 核心（8 题）", "questions": [{"q": "Q61 IOC 容器：BeanFactory 与 ApplicationContext？", "tag": "高频", "body": "<p><strong>答<\/strong>：BeanFactory 最底层、懒加载；ApplicationContext 继承之，<strong>启动时预实例化单例<\/strong> + AOP/事件/国际化。<\/p>\n<ul><li>注入方式：构造器注入（推荐，final 保证）、setter 注入、字段注入（@Autowired，不推荐）。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：BeanFactory 懒、ApplicationContext 饿（启动即建）；单例默认非懒加载，@Lazy 可改。<\/blockquote>"}, {"q": "Q62 Bean 生命周期完整流程？", "tag": "高频", "body": "<p><strong>答<\/strong>：实例化 → 属性填充 → Aware 回调（BeanName/BeanFactory/ApplicationContext）→ BeanPostProcessor.before → @PostConstruct / InitializingBean / init-method → <strong>BeanPostProcessor.after（AOP 代理在此生成）<\/strong> → 使用 → 销毁（@PreDestroy / DisposableBean）。<\/p>\n<blockquote><strong>口诀<\/strong>：实→填→Aware→前后置→初始化→代理→用→销毁；AOP 代理生成于 after 阶段。<\/blockquote>"}, {"q": "Q63 循环依赖与三级缓存？", "tag": "高频", "body": "<p><strong>答<\/strong>：一级 singletonObjects（成品）→ 二级 earlySingletonObjects（半成品）→ 三级 singletonFactories（对象工厂）。<\/p>\n<ul><li>流程（A 依赖 B、B 依赖 A）：A 实例化入三级 → 填属性发现 B → B 实例化入三级 → 填属性发现 A → 三级工厂 getEarlyBeanReference 生成早期引用（需要 AOP 则在此出代理）→ 注入 B → B 完成入一级 → A 完成入一级。<\/li><li><strong>为什么三级不用二级<\/strong>：二级无法在实例化后、属性填充前用 BeanPostProcessor 生成 AOP 代理，三级用 ObjectFactory 延迟决策。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：一二三 = 成品/半成品/工厂；构造器循环依赖无解；Boot 2.6+ 默认禁止循环依赖。<\/blockquote>"}, {"q": "Q64 AOP 原理：JDK 动态代理 vs CGLIB？", "tag": "高频", "body": "<p><strong>答<\/strong>：JDK 代理基于接口（Proxy + InvocationHandler）；CGLIB 基于继承生成子类（Enhancer + MethodInterceptor），final 类/方法无法代理。<\/p>\n<ul><li>Spring 选择：有接口 → JDK；无接口 → CGLIB；<strong>Boot 2.x+ 默认强制 CGLIB<\/strong>。<\/li><li>通知类型：@Before/@After/@Around/@AfterReturning/@AfterThrowing；@Around 最灵活。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：有接口 JDK、没接口 CGLIB、Boot2 全 CGLIB；<strong>自调用 this.method() 不走代理<\/strong>——AOP 失效经典坑。<\/blockquote>"}, {"q": "Q65 @Transactional 事务失效场景？", "tag": "高频", "body": "<p><strong>答<\/strong>：① 自调用（this 调用不走代理）；② 非 public 方法；③ 异常被 try-catch 吞掉；④ checked 异常默认不回滚（需 <code>rollbackFor = Exception.class<\/code>）；⑤ 数据库引擎不支持事务（MyISAM）；⑥ final 方法/类。<\/p>\n<blockquote><strong>口诀<\/strong>：默认只回滚 RuntimeException/Error；checked 异常是\"可预期业务异常\"不该回滚（Spring 哲学）。<\/blockquote>"}, {"q": "Q66 事务传播行为有哪几种？", "tag": "进阶", "body": "<p><strong>答<\/strong>：REQUIRED（默认，有则加入）、REQUIRES_NEW（总是新建，挂起外层）、SUPPORTS、NOT_SUPPORTED、MANDATORY（必须有）、NEVER（必须无）、NESTED（savepoint 嵌套）。<\/p>\n<blockquote><strong>口诀<\/strong>：R 家族记四个（REQUIRED/NEW/SUPPORTS/NOT_SUPPORTED）+ 强制两个（MANDATORY/NEVER）+ 嵌套 NESTED；日志/MQ 发送用 REQUIRES_NEW。<\/blockquote>"}, {"q": "Q67 单例 Bean 的线程安全问题？", "tag": "高频", "body": "<p><strong>答<\/strong>：单例 Bean 默认线程不安全（有状态字段并发读写）。<\/p>\n<ul><li>解决：① 无状态设计；② ThreadLocal；③ 加锁；④ 原型作用域（如 SimpleDateFormat）。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：Controller/Service 只放方法参数（无状态）；有状态放 ThreadLocal。<\/blockquote>"}, {"q": "Q68 @Autowired 与 @Resource 区别？", "tag": "基础", "body": "<p><strong>答<\/strong>：@Autowired（Spring）<strong>byType 优先<\/strong>，同类型多个按字段名找，找不到报错（需 @Qualifier）；@Resource（JSR-250）<strong>byName 优先<\/strong>。<\/p>\n<blockquote><strong>口诀<\/strong>：Autowired 按类型、Resource 按名字；构造器注入永远优先。<\/blockquote>\n<hr>"}]}, {"title": "10 Spring Boot 与微服务（5 题）", "questions": [{"q": "Q69 Spring Boot 自动装配原理？", "tag": "高频", "body": "<p><strong>答<\/strong>：<code>@SpringBootApplication = @SpringBootConfiguration + @EnableAutoConfiguration + @ComponentScan<\/code>。<\/p>\n<ul><li>流程：@EnableAutoConfiguration 导入 AutoConfigurationImportSelector → 读 <code>META-INF/spring/...AutoConfiguration.imports<\/code>（Boot 2.7+）所有自动配置类 → 逐类按 <code>@Conditional*<\/code> 判断是否生效（@ConditionalOnClass/@ConditionalOnMissingBean/@ConditionalOnProperty）→ 绑定 @ConfigurationProperties。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：导入选择器 → 读 imports 清单 → 条件注解裁决 → 属性绑定；本质是\"默认配置 + 用户可覆盖\"。<\/blockquote>"}, {"q": "Q70 Spring Boot 启动流程（run 做了什么）？", "tag": "高频", "body": "<p><strong>答<\/strong>：创建 SpringApplication（推断 Web 类型、加载 SPI 监听器）→ run()：监听器 starting → 创建 Environment → 打 Banner → 创建 ApplicationContext → prepareContext → <strong>refreshContext（refresh() 即容器启动心脏）<\/strong> → started → 执行 CommandLineRunner/ApplicationRunner → running。<\/p>\n<blockquote><strong>口诀<\/strong>：环境→容器→refresh→Runner；Runner 用于启动后初始化数据。<\/blockquote>"}, {"q": "Q71 starter 原理与自定义 starter？", "tag": "进阶", "body": "<p><strong>答<\/strong>：starter = 自动配置类 + 依赖管理；自定义：① 写 @Configuration + @EnableConfigurationProperties；② META-INF 注册；③ 打包。<\/p>\n<ul><li>@ConfigurationProperties 类型安全、支持校验，优于 @Value。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：自动配置类 + imports 注册 + 条件生效；配置类用 Properties 不用 Value。<\/blockquote>"}, {"q": "Q72 @Configuration 与 @Component 区别（CGLIB 代理）？", "tag": "进阶", "body": "<p><strong>答<\/strong>：@Configuration 被 <strong>CGLIB 增强<\/strong> → 类内 @Bean 方法互调返回<strong>同一个单例<\/strong>；@Component 不增强 → 每次 new。<\/p>\n<ul><li><code>proxyBeanMethods = false<\/code> = Lite 模式，启动更快，适合无内部互调的配置类。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：Configuration 会\"拦截互调\"保单例；Lite 模式快但别内部互调。<\/blockquote>"}, {"q": "Q73 Spring Cloud 核心组件？", "tag": "高频", "body": "<p><strong>答<\/strong>：注册中心（Eureka AP / Nacos AP|CP / Consul）、配置中心（Nacos Config）、网关（Gateway WebFlux）、负载均衡（LoadBalancer）、熔断（Sentinel/Resilience4j）、链路追踪（Sleuth+Zipkin/SkyWalking）、服务调用（OpenFeign）。<\/p>\n<blockquote><strong>口诀<\/strong>：注册、配置、网关、负载、熔断、链路、调用七件套；<strong>CAP<\/strong>：Eureka 是 AP，Consul/Nacos-CP 是 CP。<\/blockquote>\n<hr>"}]}, {"title": "11 分布式与中间件（7 题）", "questions": [{"q": "Q74 分布式事务方案对比？", "tag": "高频", "body": "<p><strong>答<\/strong>：2PC/XA（强一致，同步阻塞、协调者单点）、<strong>TCC<\/strong>（Try-Confirm-Cancel 补偿，业务侵入高）、<strong>Saga<\/strong>（正向 + 反向补偿，长事务）、<strong>Seata AT<\/strong>（全局锁 + undo_log 回滚日志，侵入最小）、本地消息表 + MQ（最终一致）。<\/p>\n<blockquote><strong>口诀<\/strong>：强一致 2PC、最终一致靠补偿；Seata AT 用 undo_log 自动生成反向 SQL。<\/blockquote>"}, {"q": "Q75 分布式锁实现与对比？", "tag": "高频", "body": "<p><strong>答<\/strong>：Redis <code>SET key clientId NX EX<\/code>（快、简单，主从切换丢锁）、ZooKeeper 临时顺序节点（强一致，性能差）、数据库唯一键（简单，性能差）。<\/p>\n<ul><li><strong>要点<\/strong>：原子加锁 → 业务 → <strong>Lua 脚本比对 clientId 再 DEL（防误删）<\/strong> → 看门狗续期（Redisson）。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：加锁 SETNX、释放 Lua 校验、续期看门狗；极致一致性选 ZK/etcd。<\/blockquote>"}, {"q": "Q76 分布式 ID 方案？", "tag": "高频", "body": "<p><strong>答<\/strong>：UUID（无序长，不适合作主键）、号段模式（批量取号）、Redis INCR（依赖 Redis）、<strong>雪花算法<\/strong>（时间戳 41 + 机器 10 + 序列号 12，趋势递增，坑：时钟回拨）。<\/p>\n<ul><li>工业级：美团 Leaf、百度 UidGenerator。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：雪花 = 时间 + 机器 + 序列；时钟回拨可等待/备用位/内存序列。<\/blockquote>"}, {"q": "Q77 MQ 选型与消息可靠性？", "tag": "高频", "body": "<p><strong>答<\/strong>：Kafka 高吞吐（日志流，可能重复消费）、RocketMQ 事务消息/延迟消息/死信队列（金融订单）、RabbitMQ 功能全吞吐低、Pulsar 存算分离。<\/p>\n<ul><li><strong>可靠性三阶段<\/strong>：生产端 confirm + 重试、Broker 持久化 + 多副本、消费端<strong>手动 ACK + 消费幂等<\/strong>。<\/li><li><strong>积压<\/strong>：扩容消费者 → 临时转存 → 排查慢消费；<strong>顺序<\/strong>：Kafka 同分区有序。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：不丢 = 生产确认 + 存储多副本 + 消费手动 ACK；幂等是消费端底线。<\/blockquote>"}, {"q": "Q78 限流算法对比？", "tag": "进阶", "body": "<p><strong>答<\/strong>：计数器（临界突刺）、<strong>滑动窗口<\/strong>（平滑，Sentinel 默认）、<strong>令牌桶<\/strong>（匀速放令牌、允许突发，Guava RateLimiter）、漏桶（强制平滑，不能突发）。<\/p>\n<blockquote><strong>口诀<\/strong>：要突发选令牌桶、要强制平滑选漏桶、分布式限流 Redis + Lua。<\/blockquote>"}, {"q": "Q79 缓存一致性：Cache Aside 与延迟双删？", "tag": "高频", "body": "<p><strong>答<\/strong>：Cache Aside：读 miss 查库回填；写 = <strong>先更新 DB，再删缓存<\/strong>（不是更新缓存）。<\/p>\n<ul><li><strong>延迟双删<\/strong>：更新 DB → 删缓存 → sleep 短暂 → 再删一次（兜底并发读回填的旧值）。<\/li><li>极端一致：订阅 binlog（Canal）异步删缓存。<\/li><\/ul>\n<blockquote><strong>口诀<\/strong>：先更库再删缓存；双删兜底；穿透/击穿/雪崩 → 布隆/互斥/随机过期。<\/blockquote>"}, {"q": "Q80 高并发系统设计通用套路？", "tag": "进阶", "body": "<p><strong>答<\/strong>：读多写少 → 缓存 + CDN；写多 → MQ 削峰 + 分库分表；防雪崩 → 限流、熔断、降级、隔离；链路保护 → 超时 + 重试幂等 + 熔断；容量评估 → QPS × 峰值系数 → 压测定阈值 → 监控告警。<\/p>\n<blockquote><strong>口诀<\/strong>：场景 → 约束 → 方案 → 细节 → 容灾 五步法；先澄清 QPS/数据量/一致性再动手。<\/blockquote>\n<hr>"}]}, {"title": "附 背诵顺序建议", "questions": [], "intro": "<ul><li><strong>第一梯队（必背必问）<\/strong>：HashMap put 流程、synchronized 锁升级、volatile、线程池 7 参数、AQS、JVM 内存区域、GC Roots、双亲委派、Bean 生命周期、循环依赖三级缓存。<\/li><li><strong>第二梯队（原理深挖）<\/strong>：G1/ZGC、CAS+ABA、ThreadLocal 泄漏、ConcurrentHashMap、AOP 代理、事务传播、自动装配。<\/li><li><strong>第三梯队（场景题）<\/strong>：分布式锁/事务/ID、缓存一致性、限流熔断、幂等设计、系统设计五步法。<\/li><li><strong>复习节奏<\/strong>：先背\"口诀\"→ 再口述\"关键点\"→ 最后对着深度题库查漏补缺。祝面试顺利！<\/li><\/ul>"}], "qcount": 80}, {"sub": "题库深度版", "chapters": [{"title": "01 JVM 内存区域与对象", "questions": [{"q": "1.1 JVM 运行时内存区域如何划分？JDK8 有哪些变化？", "tag": "高频", "body": "<p><strong>线程私有<\/strong>：虚拟机栈、本地方法栈、程序计数器。<br><strong>线程共享<\/strong>：堆、方法区（JDK8 起改为<strong>元空间 Metaspace<\/strong>，移出堆、使用本地内存）。<\/p>\n<ul><li><strong>程序计数器<\/strong>：唯一不会 OOM 的区域，记录字节码行号，用于分支/循环/跳转/异常恢复/线程切换。<\/li><li><strong>虚拟机栈<\/strong>：栈帧（局部变量表、操作数栈、动态链接、返回地址）；<code>StackOverflowError<\/code>（栈深度超限）与 <code>OutOfMemoryError<\/code>（动态扩展失败）。<\/li><li><strong>本地方法栈<\/strong>：为 native 方法服务，HotSpot 中与虚拟机栈合并。<\/li><li><strong>堆<\/strong>：GC 主战场，新生代(Eden + 2×Survivor) + 老年代；可细分为 TLAB。<\/li><li><strong>方法区/元空间<\/strong>：类元信息、常量、静态变量（JDK7 起静态变量移入堆）。JDK8 用元空间取代永久代：字符串常量池与静态变量仍在堆，类元数据用本地内存——<strong>避免永久代 OOM、无需调 MaxPermSize<\/strong>。<\/li><\/ul>\n<blockquote>加分点：JDK8 移除永久代原因：永久代大小固定难调、Full GC 频繁；元空间受 OS 内存限制，默认无上限，可用 <code>-XX:MaxMetaspaceSize<\/code> 限制。<\/blockquote>"}, {"q": "1.2 堆内存分代结构：新生代与老年代", "tag": "基础", "body": "<ul><li>新生代：Eden + S0 + S1（默认 <strong>8:1:1<\/strong>），对象优先在 Eden 分配，Minor GC 后幸存对象在 S0/S1 间复制，<code>-XX:MaxTenuringThreshold<\/code>(默认15) 次后晋升老年代。<\/li><li>老年代：大对象直接进入（<code>-XX:PretenureSizeThreshold<\/code>），Major/Full GC 触发点。<\/li><li>动态年龄判定：Survivor 中同年龄对象总和 > Survivor 一半时，≥该年龄对象直接晋升。<\/li><\/ul>\n<blockquote>加分点：为什么不 1:1:1？复制算法只需一块 Survivor 空着，浪费率最小为 10%（Eden:S0:S1=8:1:1，总浪费 10%）。<\/blockquote>"}, {"q": "1.3 对象创建过程？", "tag": "高频", "body": "<ol><li><strong>类加载检查<\/strong>：new 指令先检查常量池能否定位到类符号引用，未加载则先加载。<\/li><li><strong>分配内存<\/strong>：指针碰撞（堆规整）或空闲列表（堆不规整）；线程内 TLAB 优先分配，失败再 CAS 加锁分配。<\/li><li><strong>初始化零值<\/strong>：对象字段置 0/null/false（保证字段无初始化也能用）。<\/li><li><strong>设置对象头<\/strong>：Mark Word、类型指针、hashCode、GC 分代年龄、锁标志。<\/li><li><strong>执行构造方法<\/strong>：<code><init><\/code> 真正按程序员意图初始化。<\/li><\/ol>\n<blockquote>加分点：<code>Object o = new Object()<\/code> 在字节码层面 = new + dup + invokespecial <code><init><\/code>；DCL 单例需要 volatile 正是因为这 5 步可能重排（分配内存与构造可能颠倒，见 4.8）。<\/blockquote>"}, {"q": "1.4 对象内存布局：对象头/实例数据/对齐填充", "tag": "进阶", "body": "<ul><li><strong>对象头<\/strong>：① Mark Word（64 位机 8 字节）：hashCode、分代年龄、锁状态标志、偏向线程 ID；② 类型指针（压缩后 4 字节，指向类元数据）；③ 数组长度（仅数组对象）。<\/li><li><strong>实例数据<\/strong>：字段值，相同宽度字段按规则重排以减少填充。<\/li><li><strong>对齐填充<\/strong>：对象大小必须是 <strong>8 字节整数倍<\/strong>（HotSpot 要求）。<\/li><li>开启 <code>-XX:+UseCompressedOops<\/code>（JDK8 默认）后，普通对象头 12 字节（8+4），压缩引用 4 字节。<\/li><\/ul>\n<blockquote>追问：为什么要求 8 字节对齐？便于 CPU 高效访问与内存分配管理；也是 JOL 工具查看对象布局的基础。<\/blockquote>"}, {"q": "1.5 对象访问定位：句柄 vs 直接指针", "tag": "基础", "body": "<ul><li><strong>句柄<\/strong>：栈中 reference 指向句柄池，句柄池存对象实例数据与类型数据地址。GC 移动对象只需改句柄，稳定。<\/li><li><strong>直接指针<\/strong>（HotSpot 默认）：reference 直接指向对象，对象头类型指针指向方法区类信息。<strong>少一次定位，更快<\/strong>；对象移动需更新引用（由 GC 处理）。<\/li><li>结论：HotSpot 用直接指针换速度，句柄换 GC 稳定性。<\/li><\/ul>"}, {"q": "1.6 栈帧包含哪些结构？", "tag": "基础", "body": "<p>局部变量表（Slot 复用，long/double 占 2 Slot）、操作数栈（字节码指令的工作区）、动态链接（符号引用→直接引用）、返回地址（方法出口）。<code>-Xss<\/code> 控制栈大小。<\/p>\n<blockquote>加分点：局部变量表 Slot 复用可能导致对象被提前回收（变量作用域结束但 Slot 仍被 GC Roots 引用）——在长生命周期循环里把大对象置 null 可辅助 GC，但现代 JIT 已优化，不必迷信。<\/blockquote>"}, {"q": "1.7 OOM 的常见类型与排查流程？", "tag": "高频", "body": "<ul><li><strong>StackOverflowError<\/strong>：栈溢出，递归过深。<\/li><li><strong>Java heap space<\/strong>：堆满，<code>-Xmx<\/code> 不足或泄漏。<\/li><li><strong>GC overhead limit exceeded<\/strong>：98% 时间在 GC 且回收 <2%。<\/li><li><strong>Metaspace<\/strong>：元空间满，动态生成类过多（反射/字节码增强）。<\/li><li><strong>Direct buffer memory<\/strong>：堆外内存泄漏（NIO 未释放）。<\/li><\/ul>\n<p>排查流程：<code>jps<\/code> 找进程 → <code>jmap -dump<\/code> 导出堆 → MAT/JProfiler 分析 Dominator Tree（支配树）找大对象与 GC Roots 引用链 → 修复代码。<\/p>\n<blockquote>加分点：生产环境建议 <code>-XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=...<\/code> 自动落盘；再配合 <code>jstat -gcutil<\/code> 观察 GC 频率。<\/blockquote>"}, {"q": "1.8 逃逸分析、栈上分配与标量替换是什么？", "tag": "进阶", "body": "<ul><li><strong>逃逸分析<\/strong>：分析对象作用域，判断是否逃逸出方法/线程。<\/li><li>若不逃逸：<strong>栈上分配<\/strong>（HotSpot 实际未完全实现）、<strong>标量替换<\/strong>（把对象拆成多个标量字段直接放栈）、<strong>锁消除<\/strong>（同步块去掉锁）。<\/li><li>说明：HotSpot 通过标量替换间接实现栈上分配效果；<code>-XX:+DoEscapeAnalysis<\/code> 默认开启，Server 模式默认开启，Client 模式默认关闭。<\/li><\/ul>\n<blockquote>深坑：很多人说\"HotSpot 支持栈上分配\"，准确说法是<strong>通过标量替换实现<\/strong>——小对象（如无逃逸的局部 POJO）可直接分配在栈上/寄存器，减少 GC 压力。<\/blockquote>\n<hr>"}]}, {"title": "02 类加载机制", "questions": [{"q": "2.1 类加载过程分几步？每步做什么？", "tag": "高频", "body": "<p><strong>加载 → 验证 → 准备 → 解析 → 初始化<\/strong>（<code>--verify<\/code> 可用 <code>-Xverify:none<\/code> 跳过）。<\/p>\n<ul><li><strong>加载<\/strong>：通过类全限定名获取二进制字节流（jar/网络/动态代理），转为方法区运行时数据结构，生成 <code>Class<\/code> 对象。<\/li><li><strong>验证<\/strong>：文件格式、字节码语义（元数据、字节码、符号引用验证），防止恶意字节码。<\/li><li><strong>准备<\/strong>：为<strong>静态变量分配内存并设零值<\/strong>（<code>static int a = 1<\/code> 此时 a=0，真正的 1 在初始化阶段）。<\/li><li><strong>解析<\/strong>：符号引用 → 直接引用（类/接口/字段/方法）。<\/li><li><strong>初始化<\/strong>：执行 <code><clinit><\/code>，静态变量赋值 + 静态代码块；只有此阶段是\"主动执行\"。<\/li><\/ul>\n<blockquote>加分点：接口与类的初始化时机不同——接口的字段引用不触发父接口初始化；<code><clinit><\/code> 由 JVM 加锁保证线程安全（一个类只初始化一次）。<\/blockquote>"}, {"q": "2.2 类初始化的触发时机？被动引用不触发哪些？", "tag": "高频", "body": "<p><strong>主动引用（6 种）<\/strong>：new/getstatic/putstatic/invokestatic、反射、初始化子类先初始化父类、main 入口类、JDK7 动态语言支持、<code>MethodHandle<\/code>。<br><strong>被动引用（不触发）<\/strong>：<\/p>\n<ol><li><code>SubClass.value<\/code> 引用父类静态字段 → 只初始化父类。<\/li><li><code>Class.forName<\/code> vs <code>ClassLoader.loadClass<\/code>：后者不初始化。<\/li><li><code>new SubClass[10]<\/code> 数组 → 不触发。<\/li><li>常量（<code>static final<\/code> 编译期常量）→ 编译期已入常量池。<\/li><\/ol>"}, {"q": "2.3 双亲委派模型是什么？为什么这么设计？", "tag": "高频", "body": "<p><strong>流程<\/strong>：类加载器收到加载请求 → 先委托给父加载器 → 父加载不了才自己加载。<br><strong>层级<\/strong>：Bootstrap（rt.jar，C++ 实现）→ Extension（JDK9 起为 Platform）→ Application（classpath）→ 自定义。<br><strong>为什么<\/strong>：<\/p>\n<ol><li><strong>避免类重复加载<\/strong>：同名的类只加载一份。<\/li><li><strong>核心类安全<\/strong>：防止自定义 <code>java.lang.String<\/code> 混入核心库——加载 <code>String<\/code> 时先被 Bootstrap 加载，自定义的同名类永远不会被用到。<\/li><\/ol>\n<blockquote>加分点：<code>ClassLoader.loadClass<\/code> 内部先 <code>findLoadedClass<\/code> → 父加载 → <code>findClass<\/code>；重写时应重写 <code>findClass<\/code> 而非 <code>loadClass<\/code>，否则破坏委派。<\/blockquote>"}, {"q": "2.4 什么场景要打破双亲委派？如何打破？", "tag": "进阶", "body": "<ul><li><strong>JDBC SPI<\/strong>：<code>DriverManager<\/code> 在 Bootstrap 加载，但实现（mysql-connector）在 classpath——需要<strong>线程上下文类加载器<\/strong>（ContextClassLoader）反向加载。<\/li><li><strong>Tomcat<\/strong>：每个 WebApp 独立加载自己 lib 下的类（避免不同应用同 JAR 冲突），且要能加载应用自身的 <code>Servlet<\/code>——采用\"<strong>先自己加载、不行再委派<\/strong>\"的顺序。<\/li><li><strong>OSGi/JBoss<\/strong>：更细粒度的模块化加载。<\/li><li><strong>热部署<\/strong>：换一个自定义类加载器加载新版本类，老类卸载。<\/li><\/ul>\n<blockquote>加分点：双亲委派是\"默认安全\"而非\"铁律\"，SPI 机制本身就是官方对双亲委派的突破。<\/blockquote>"}, {"q": "2.5 自定义类加载器怎么做？热部署原理？", "tag": "进阶", "body": "<p><code>extends ClassLoader<\/code> 重写 <code>findClass<\/code>：读字节码 → <code>defineClass<\/code> → 返回 Class。<br><strong>热部署<\/strong>：用<strong>新的类加载器<\/strong>重新加载（旧类卸载的前提是：无引用 + 无 GC Roots 可达 + ClassLoader 可回收），Spring Boot DevTools 即基于此。注意：类名相同但加载器不同 = 两个不同的类，<code>instanceof<\/code>/<code>equals<\/code> 可能失效。<\/p>"}, {"q": "2.6 类加载器不同会导致什么坑？", "tag": "进阶", "body": "<ul><li>同全限定名类由不同加载器加载 → 类型不兼容，强转会 <code>ClassCastException<\/code>。<\/li><li>父加载器看不到子加载器的类（可见性单向）。<\/li><li><code>getClass().getClassLoader()<\/code> 判空表示 Bootstrap 加载。<\/li><\/ul>\n<hr>"}]}, {"title": "03 垃圾回收", "questions": [{"q": "3.1 如何判断对象存活？GC Roots 有哪些？", "tag": "高频", "body": "<ul><li><strong>引用计数<\/strong>（Python/早期 JVM）：循环引用无法回收，JVM 弃用。<\/li><li><strong>可达性分析<\/strong>（JVM 采用）：从 <strong>GC Roots<\/strong> 出发做引用链遍历，不可达即回收。GC Roots 包括：<\/li><\/ul>\n<ol><li>虚拟机栈中引用的对象（局部变量、参数）。<\/li><li>方法区静态属性引用的对象。<\/li><li>方法区常量引用的对象（如 String 常量池）。<\/li><li>本地方法栈 JNI 引用的对象。<\/li><li>被 <code>synchronized<\/code> 锁住的对象、JVM 内部引用（Class、系统类加载器、异常对象）。<\/li><\/ol>\n<blockquote>加分点：finalize() 只有一次自救机会且不保证执行，<strong>永远不要用<\/strong>；现代观点：弱引用+引用队列才是正确的清理方式（如 ThreadLocal 的 expungeStaleEntry）。<\/blockquote>"}, {"q": "3.2 四种引用类型及适用场景", "tag": "高频", "body": "<ul><li><strong>强引用<\/strong>：<code>new<\/code> 出来的，GC 永不回收，OOM 也不收。<\/li><li><strong>软引用 SoftReference<\/strong>：内存不足时回收 → 内存敏感缓存（图片缓存）。<\/li><li><strong>弱引用 WeakReference<\/strong>：下次 GC 必回收 → ThreadLocal 的 key、WeakHashMap。<\/li><li><strong>虚引用 PhantomReference<\/strong>：随时可能回收，必须配合引用队列，用于<strong>堆外内存/DirectByteBuffer 的回收跟踪<\/strong>（NIO 的 Cleaner）。<\/li><\/ul>\n<blockquote>加分点：软/弱/虚引用对象被回收后会被放入关联的 <code>ReferenceQueue<\/code>，可据此做资源清理回调。<\/blockquote>"}, {"q": "3.3 三大 GC 算法对比", "tag": "高频", "body": "<table><thead><tr><th>算法<\/th><th>原理<\/th><th>优点<\/th><th>缺点<\/th><\/tr><\/thead><tbody><tr><td>标记-清除<\/td><td>标记存活→清除未存活<\/td><td>简单<\/td><td>内存碎片、两次扫描慢<\/td><\/tr><tr><td>复制<\/td><td>存活对象复制到另一半<\/td><td>无碎片、高效<\/td><td>浪费一半空间（Eden 8:1:1 化解）<\/td><\/tr><tr><td>标记-整理<\/td><td>标记后存活对象向一端移动<\/td><td>无碎片、空间利用率高<\/td><td>移动对象需更新引用，STW<\/td><\/tr><\/tbody><\/table>\n<p><strong>分代收集<\/strong>：新生代对象朝生夕死 → 复制；老年代存活率高 → 标记-清除/整理。<\/p>"}, {"q": "3.4 经典垃圾收集器演进路线", "tag": "高频", "body": "<ul><li><strong>Serial / Serial Old<\/strong>：单线程，Client 模式默认，停顿长。<\/li><li><strong>Parallel / Parallel Old<\/strong>（JDK8 默认）：多线程，追求吞吐量（<code>-XX:+UseParallelGC<\/code>）。<\/li><li><strong>CMS<\/strong>（JDK9 弃用 / JDK14 移除）：并发标记清除，追求低停顿，但<strong>浮动垃圾 + 内存碎片 + 并发失败退化 Serial Old<\/strong>。<\/li><li><strong>G1<\/strong>（JDK9+ 默认）：Region 化，可预测停顿，兼顾吞吐与延迟。<\/li><li><strong>ZGC / Shenandoah<\/strong>（JDK11/15+）：TB 级堆、亚毫秒停顿。<\/li><\/ul>\n<blockquote>加分点：CMS 的 4 个阶段：初始标记(STW)→并发标记→重新标记(STW)→并发清除；\"并发模式失败\"= 老年代被并发线程塞满，触发 Full GC 兜底。<\/blockquote>"}, {"q": "3.5 G1 收集器原理详解", "tag": "高频", "body": "<ul><li><strong>堆划分为 2048 个 Region<\/strong>，逻辑分代（Eden/Survivor/Old/Humongous 大对象区），Region 之间可达则记录在 <strong>RSet（Remembered Set）<\/strong>——避免全堆扫描，代价是维护 RSet 开销。<\/li><li><strong>三色标记<\/strong>：白（未访问）→灰（已访问，引用未扫完）→黑（已访问，引用已扫完）。<\/li><li><strong>SATB（Snapshot At The Beginning）<\/strong>：并发标记期间记录起始快照，防止<strong>漏标<\/strong>（黑色对象新引用白色对象）。<\/li><li><strong>Mixed GC<\/strong>：新生代 + 部分老年代 Region 一起回收，通过 <code>-XX:MaxGCPauseMillis<\/code>(默认200ms) 控制停顿；G1 通过<strong>收集集合 CSet 选择<\/strong>实现可预测停顿。<\/li><li><strong>写屏障<\/strong>：G1 用写屏障维护 RSet 与 SATB。<\/li><\/ul>\n<blockquote>追问：为什么 G1 不用 ZGC 的读屏障？G1 是\"增量式整理\"（局部移动），不需要全局指针修正，读屏障成本高收益低。<\/blockquote>"}, {"q": "3.6 ZGC 为什么能做到亚毫秒停顿？", "tag": "进阶", "body": "<ul><li><strong>染色指针（Colored Pointer）<\/strong>：把 64 位指针的高 4 位用作标记位（Finalizable/Remapped/Marked0/Marked1），对象状态编码在指针里。<\/li><li><strong>读屏障<\/strong>：每次访问对象时读指针，若指针染色与对象状态不一致则修复（转发到新地址），实现<strong>并发移动对象<\/strong>（不做 STW 的\"搬家公司\"）。<\/li><li><strong>多代 ZGC<\/strong>（JDK21）：引入分代，进一步降低 CPU 开销。<\/li><\/ul>\n<blockquote>加分点：ZGC 的停顿不再随堆大小增长；JDK21 起 ZGC 支持分代，默认开启。<\/blockquote>"}, {"q": "3.7 三色标记漏标问题与 CMS 的增量更新", "tag": "进阶", "body": "<ul><li>漏标条件：<strong>黑色对象<\/strong>重新引用了一个<strong>白色对象<\/strong>，且灰色对象不再引用它。<\/li><li>解决方案：<strong>增量更新（CMS）<\/strong>——黑色对象引用白色对象时，把黑色对象标灰（重新标记阶段再扫）；<strong>SATB（G1）<\/strong>——记录起始快照，把被删引用对象的快照保留为灰。<\/li><li>代价：增量更新会产生<strong>浮动垃圾<\/strong>（多标不回收，下次清）；SATB 会产生更多浮动垃圾但避免漏标。<\/li><\/ul>"}, {"q": "3.8 安全点与安全区域", "tag": "进阶", "body": "<ul><li><strong>安全点 Safepoint<\/strong>：GC 只能在所有线程到达安全点时暂停；如方法调用、循环回跳、异常抛出处。<\/li><li>线程处于 Sleep/Blocked 时到不了安全点 → <strong>安全区域 SafeRegion<\/strong>：该区域内引用关系不变，GC 无需等待。<\/li><li>垃圾收集器扫描线程栈依赖安全点；<code>-XX:+PrintSafepointStatistics<\/code> 可排查 STW。<\/li><\/ul>"}, {"q": "3.9 JVM 调优实战：常用参数与排查工具", "tag": "高频", "body": "<p><strong>常用参数<\/strong>：<\/p>\n<pre><code>-Xms -Xmx（堆大小，建议相等避免动态扩缩）\n-Xmn（新生代）、-XX:SurvivorRatio=8\n-XX:MaxMetaspaceSize\n-XX:+UseG1GC -XX:MaxGCPauseMillis=200\n-XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/dump.hprof\n-XX:+PrintGCDetails -Xloggc:/tmp/gc.log（JDK9+ 用 -Xlog:gc*）<\/code><\/pre>\n<p><strong>排查工具<\/strong>：jps（进程）、jstat（GC 统计）、jmap（堆转储）、jstack（线程栈，排查死锁）、jinfo（参数）、jcmd、MAT/Arthas。<\/p>\n<blockquote>加分点：调优流程 = 明确目标（吞吐 or 延迟）→ 收集 GC 日志 → 分析停顿来源 → 调整参数单变量验证；避免堆外大数组/大集合、避免频繁 Full GC。<\/blockquote>\n<hr>"}]}, {"title": "04 Java 基础与字符串", "questions": [{"q": "4.1 String 为什么不可变？不可变有什么好处？", "tag": "高频", "body": "<p><strong>不可变<\/strong>：<code>final class<\/code> + <code>private final char[] value<\/code>（JDK9 起 byte[] + coder 编码标记）+ 不暴露修改方法。<br><strong>好处<\/strong>：<\/p>\n<ol><li><strong>字符串常量池<\/strong>可复用，节省内存。<\/li><li><strong>线程安全<\/strong>，天然可共享。<\/li><li><strong>hashCode 可缓存<\/strong>，HashMap 的 key 首选 String。<\/li><li>作为网络参数/文件路径安全，不被篡改。<\/li><\/ol>\n<blockquote>加分点：JDK9 的 Compact Strings：Latin-1 编码用 1 字节/字符，减少 50% 内存；<code>==<\/code> 比较的是引用，<code>equals<\/code> 比较内容，常量池中的字符串用 <code>==<\/code> 可能相等（见 4.3）。<\/blockquote>"}, {"q": "4.2 String、StringBuilder、StringBuffer 区别", "tag": "基础", "body": "<table><thead><tr><th>类<\/th><th>可变<\/th><th>线程安全<\/th><th>性能<\/th><\/tr><\/thead><tbody><tr><td>String<\/td><td>不可变<\/td><td>安全<\/td><td>拼接产生新对象，慢<\/td><\/tr><tr><td>StringBuilder<\/td><td>可变<\/td><td>不安全<\/td><td>最快<\/td><\/tr><tr><td>StringBuffer<\/td><td>可变<\/td><td>安全（方法级 synchronized）<\/td><td>较慢<\/td><\/tr><\/tbody><\/table>\n<blockquote>加分点：循环内 <code>s += x<\/code> 会被 javac 优化成 <code>new StringBuilder<\/code>，但每次循环都 new，O(n²)；字符串拼接 <code>+<\/code> 在单表达式内编译器自动用 StringBuilder。<\/blockquote>"}, {"q": "4.3 == 与 equals 的区别？String 常量池是什么？", "tag": "高频", "body": "<ul><li><code>==<\/code> 比较引用地址；<code>equals<\/code> 默认也是比较地址（Object），String 重写为比较内容。<\/li><li>字符串常量池（JDK7 起在堆）：<code>\"a\"<\/code> 字面量入池；<code>new String(\"a\")<\/code> 创建两个对象（池中一个、堆中一个）。<\/li><li><code>intern()<\/code>：字符串入池，返回池中引用。<\/li><\/ul>\n<pre><code class=\"lang-java\">String s1 = \"a\";               // 池中\nString s2 = new String(\"a\");   // 堆中，池中已有 \"a\"\ns1 == s2          // false\ns2.intern() == s1 // true<\/code><\/pre>"}, {"q": "4.4 hashCode 与 equals 的约定？为什么重写 equals 必须重写 hashCode？", "tag": "高频", "body": "<p><strong>约定<\/strong>：equals 相等 → hashCode 必相等；hashCode 相等 → equals 不一定相等（哈希冲突）。<br><strong>为什么<\/strong>：HashMap 用 hashCode 定位桶，equals 比较桶内元素。只重写 equals 不重写 hashCode → 相同逻辑对象 hashCode 不同 → 分到不同桶，<code>get<\/code> 永远查不到 → <strong>内存泄漏（丢失）<\/strong>。<\/p>"}, {"q": "4.5 Integer 缓存与装箱拆箱的坑", "tag": "高频", "body": "<ul><li><code>Integer a = 127, b = 127; a == b<\/code> → <strong>true<\/strong>（-128~127 缓存，<code>IntegerCache<\/code>）。<\/li><li><code>Integer a = 128, b = 128; a == b<\/code> → <strong>false<\/strong>（超出缓存）。<\/li><li>装箱 = <code>Integer.valueOf<\/code>（带缓存），拆箱 = <code>intValue<\/code>。<\/li><li><strong>坑<\/strong>：<code>Integer i = null; if (i == 1)<\/code> 拆箱 NPE；<code>Integer i1=1000, i2=1000; i1 == i2<\/code> false——比较包装类要 <code>equals<\/code>。<\/li><li><code>-XX:AutoBoxCacheMax<\/code> 可调整缓存上限。<\/li><\/ul>"}, {"q": "4.6 反射的用途、原理与性能开销", "tag": "进阶", "body": "<ul><li>用途：框架（Spring IOC/MyBatis）、动态代理、序列化、注解处理、热部署。<\/li><li>原理：Class 对象持有方法/字段元数据，<code>Method.invoke<\/code> 走 JNI → MethodAccessor 生成字节码实现，多次调用后走<strong>字节码版本<\/strong>（Inflation）。<\/li><li>开销：类型检查、访问检查、方法查找、参数装箱、无法内联。<\/li><li>优化：缓存 Method/Field 反射对象、<code>setAccessible(true)<\/code> 跳过安全检查、尽量用接口调用。<\/li><\/ul>\n<blockquote>加分点：JDK17+ 的 <strong>MethodHandle<\/strong> 更轻量（invokedynamic 支持），<code>VarHandle<\/code> 提供字段原子操作；反射获取泛型用 <code>getGenericSuperclass<\/code>。<\/blockquote>"}, {"q": "4.7 深拷贝与浅拷贝？如何实现深拷贝？", "tag": "基础", "body": "<ul><li><strong>浅拷贝<\/strong>：只复制引用，共享对象（<code>clone()<\/code> 默认 + <code>Arrays.copyOf<\/code> 元素引用共享）。<\/li><li><strong>深拷贝<\/strong>：连对象内容一起复制。实现：重写 clone 逐层复制、序列化反序列化（实现 Serializable）、<strong>JSON 序列化<\/strong>（Jackson/Gson，推荐）、手动构造。<\/li><li>注意：<code>List.copyOf<\/code>/<code>Collections.copy<\/code> 都是浅拷贝。<\/li><\/ul>"}, {"q": "4.8 单例模式的线程安全问题（DCL 为什么加 volatile）", "tag": "高频", "body": "<pre><code class=\"lang-java\">class Singleton {\n    private static volatile Singleton instance;\n    private Singleton() {}\n    public static Singleton getInstance() {\n        if (instance == null) {           // 1 快速判断\n            synchronized (Singleton.class) { // 2 加锁\n                if (instance == null) {   // 3 二次判断\n                    instance = new Singleton(); // 4 创建\n                }\n            }\n        }\n        return instance;\n    }\n}<\/code><\/pre>\n<ul><li>需要 volatile：<code>new Singleton()<\/code> 三步（分配内存→初始化→引用赋值）可能<strong>重排<\/strong>为（分配→赋值→初始化），另一线程在 1 处读到<strong>未初始化<\/strong>的对象。<\/li><li>volatile 禁止重排 + 保证可见性。<\/li><li>其他单例：枚举（天然防反射/序列化）、静态内部类（懒加载 + 线程安全）。<\/li><\/ul>\n<hr>"}]}, {"title": "05 集合框架与 HashMap 源码", "questions": [{"q": "5.1 ArrayList 扩容机制？与 LinkedList 如何选择？", "tag": "高频", "body": "<ul><li><strong>ArrayList<\/strong>：默认容量 10，<code>add<\/code> 满时扩容为 <strong>1.5 倍<\/strong>（<code>old + (old >> 1)<\/code>），<code>Arrays.copyOf<\/code> 复制；随机访问 O(1)，插入/删除 O(n)。<\/li><li><strong>LinkedList<\/strong>：双向链表，插入/删除 O(1)（已知节点），随机访问 O(n)。<\/li><li>选择：读多写少 → ArrayList；频繁头尾插入 → LinkedList。<strong>实际 ArrayList 几乎总是更好<\/strong>：内存连续、CPU 缓存友好、1.5 倍扩容摊还 O(1)。<\/li><\/ul>\n<blockquote>加分点：<code>new ArrayList(0)<\/code> 后首次 add 直接扩到 10；<code>subList<\/code> 是视图（结构性修改抛 ConcurrentModificationException）；<code>ArrayList<\/code> 与 <code>Vector<\/code> 区别 = 线程安全 + 2 倍扩容 vs 1.5 倍。<\/blockquote>"}, {"q": "5.2 HashMap 底层结构与 put 流程（JDK8）", "tag": "高频", "body": "<p><strong>结构<\/strong>：数组 + 链表 + <strong>红黑树<\/strong>。<br><strong>put 流程<\/strong>：<\/p>\n<ol><li><code>hash = (h = key.hashCode()) ^ (h >>> 16)<\/code>——<strong>扰动函数<\/strong>，让高位参与低 16 位运算，减少碰撞。<\/li><li>数组空 → <code>resize()<\/code> 初始化 16。<\/li><li><code>(n - 1) & hash<\/code> 定位桶。<\/li><li>桶空 → 直接 new Node；桶有节点 → 链表尾插 / 树插（红黑树）。<\/li><li>链表长度 ≥ 8 且数组长度 ≥ 64 → 树化；否则仅扩容。<\/li><li>重复 key 覆盖旧值返回旧值。<\/li><li>元素数 > <code>threshold<\/code>（容量×0.75）→ 扩容。<\/li><\/ol>\n<blockquote>加分点：为什么是 2 的幂？<code>(n-1)&hash<\/code> 等价取模且更快，还能保证扩容后元素要么原位要么 +oldCap，rehash 高效。<\/blockquote>"}, {"q": "5.3 HashMap 为什么线程不安全？JDK7 扩容死循环", "tag": "进阶", "body": "<ul><li><strong>JDK7<\/strong>：头插法 + 并发扩容 → 两个线程 rehash 时链表成环 → <strong>get 死循环 CPU 100%<\/strong>。<\/li><li><strong>JDK8<\/strong>：改尾插法解决死循环，但仍有<strong>数据丢失<\/strong>（put 覆盖）、<strong>size 不准确<\/strong>。<\/li><li>解决：<code>ConcurrentHashMap<\/code> / <code>Collections.synchronizedMap<\/code> / <code>Hashtable<\/code>。<\/li><\/ul>"}, {"q": "5.4 为什么链表转红黑树阈值是 8？", "tag": "进阶", "body": "<ul><li>泊松分布：负载因子 0.75 下，桶中节点数 ≥8 的概率约 <strong>0.00000006<\/strong>（千万分之六），几乎不可能，说明 8 是\"树化兜底\"而非常态。<\/li><li>转树条件：<strong>链表长度 ≥ 8 且数组容量 ≥ 64<\/strong>（容量不足优先扩容，扩容后链表会拆散）。<\/li><li>退化条件：树节点 ≤ 6 时转回链表（防频繁震荡，8/6 留 2 的缓冲）。<\/li><li>树化代价：红黑树节点占内存约为链表节点 2 倍（TreeNode 含 parent/red/left/right）。<\/li><\/ul>"}, {"q": "5.5 HashMap 的容量为什么是 2 的幂？初始化传 17 会怎样？", "tag": "进阶", "body": "<ul><li><code>(n-1) & hash<\/code> 位运算取代 <code>%<\/code> 取模；2 的幂保证低位全 1，索引均匀。<\/li><li>传 17 → <code>tableSizeFor<\/code> 向上取整为 <strong>32<\/strong>（大于等于参数的最小 2 次幂）。<\/li><li>负载因子 0.75 是空间与时间折中；<code>initialCapacity<\/code> 建议预估值 / 0.75 + 1，避免频繁扩容。<\/li><\/ul>"}, {"q": "5.6 ConcurrentHashMap 原理（JDK7 vs JDK8）", "tag": "高频", "body": "<p><strong>JDK7<\/strong>：<strong>分段锁 Segment<\/strong>（继承 ReentrantLock），默认 16 段，锁粒度 = 段。<br><strong>JDK8<\/strong>：<\/p>\n<ul><li>放弃分段锁，用 <strong>CAS + synchronized<\/strong> 锁桶（链表头节点）。<\/li><li>put：桶空 CAS 插入；桶非空 synchronized 锁头节点；扩容多线程协助（<code>Transfer<\/code> 任务拆分）。<\/li><li>并发度更高、内存更省；<code>size()<\/code> 用 baseCount + CounterCell 累加。<\/li><li><strong>禁止 null key/null value<\/strong>（与 HashMap 不同，因为并发下无法区分\"不存在\"与\"值为 null\"）。<\/li><\/ul>\n<blockquote>加分点：JDK8 CHM 的扩容是\"并发迁移\"，通过 <code>ForwardingNode<\/code>（fwd 节点）标记已迁移桶，读线程遇到 fwd 会跳到新表继续读。<\/blockquote>"}, {"q": "5.7 CopyOnWriteArrayList 的原理与适用场景", "tag": "高频", "body": "<ul><li><strong>写时复制<\/strong>：写操作先复制整份数组，在副本上修改，再 <code>setArray<\/code> 发布；读不加锁。<\/li><li>适用：<strong>读多写极少<\/strong>（白名单、监听器列表、配置）。<\/li><li>缺点：写代价高、内存翻倍、数据短暂不一致（弱一致性迭代器）。<\/li><\/ul>"}, {"q": "5.8 LinkedHashMap 如何实现 LRU？", "tag": "进阶", "body": "<ul><li><code>LinkedHashMap<\/code> = HashMap + 双向链表维护插入/访问顺序。<\/li><li><code>accessOrder=true<\/code> 时，每次 get/put 把节点移到链表尾部 → 链表头部即最久未使用。<\/li><li>重写 <code>removeEldestEntry<\/code> 返回 <code>size() > capacity<\/code> → <strong>天然 LRU 缓存<\/strong>（LinkedHashMap 源码自带思路，Redis 淘汰策略同理）。<\/li><\/ul>"}, {"q": "5.9 TreeMap 与 Comparable/Comparator", "tag": "基础", "body": "<ul><li>TreeMap 红黑树实现，key 有序，O(log n) 查找；<code>firstKey/lastKey/subMap<\/code> 等有序 API。<\/li><li>key 需实现 <code>Comparable<\/code> 或在构造器传入 <code>Comparator<\/code>；两者不一致时以 Comparator 为准（TreeSet 同理）。<\/li><\/ul>\n<hr>"}]}, {"title": "06 并发基础与 JMM", "questions": [{"q": "6.1 线程的创建方式与生命周期状态", "tag": "高频", "body": "<ul><li>创建：继承 Thread、实现 Runnable（推荐）、实现 Callable（可返回结果/抛异常，配合 FutureTask）、线程池。<\/li><li>状态：<code>NEW → RUNNABLE → (BLOCKED/WAITING/TIMED_WAITING) → TERMINATED<\/code>；<code>RUNNABLE<\/code> 涵盖运行与就绪（OS 层面）。<\/li><li><strong>BLOCKED<\/strong>（等 synchronized 锁）、<strong>WAITING<\/strong>（wait/join/park 无限等待）、<strong>TIMED_WAITING<\/strong>（sleep/wait(timeout)/join(timeout)）。<\/li><li><code>sleep<\/code> 不释放锁；<code>wait<\/code> 释放锁（必须在 synchronized 块内）；<code>yield<\/code> 让出 CPU 但不阻塞。<\/li><\/ul>"}, {"q": "6.2 JMM 是什么？三大特性如何保证？", "tag": "高频", "body": "<p><strong>JMM（Java 内存模型）<\/strong>：规定线程与主内存的交互规则——每个线程有<strong>工作内存<\/strong>（寄存器/缓存），共享变量在主内存；线程间不可见，通过主内存传递。<\/p>\n<ul><li><strong>原子性<\/strong>：synchronized / Lock / CAS 保证（<code>i++<\/code> 不是原子的：读-改-写三步）。<\/li><li><strong>可见性<\/strong>：volatile / synchronized / final（初始化安全）保证。<\/li><li><strong>有序性<\/strong>：volatile（禁重排）/ synchronized / happens-before 规则保证。<\/li><\/ul>\n<blockquote>加分点：JMM 与物理内存模型对应——工作内存 ≈ CPU 缓存，主内存 ≈ RAM；缓存一致性协议（MESI）解决多核可见性，JMM 是对底层的内存抽象。<\/blockquote>"}, {"q": "6.3 happens-before 规则有哪些？", "tag": "高频", "body": "<ol><li><strong>程序顺序规则<\/strong>：单线程内代码顺序。<\/li><li><strong>锁规则<\/strong>：unlock happens-before 后续 lock。<\/li><li><strong>volatile 规则<\/strong>：volatile 写 happens-before 后续读。<\/li><li><strong>传递性<\/strong>：A→B→C 则 A→C。<\/li><li><strong>线程启动<\/strong>：start() happens-before 该线程内所有操作。<\/li><li><strong>线程终止<\/strong>：线程内操作 happens-before 其他线程 join() 返回。<\/li><li><strong>中断规则<\/strong>：interrupt() happens-before 被中断线程检测到中断。<\/li><li><strong>对象终结<\/strong>：构造完成 happens-before finalize() 开始。<\/li><\/ol>\n<blockquote>加分点：happens-before 是\"逻辑可见性\"保证，不是\"物理时间先后\"——JIT 重排只要不破坏该规则即可。<\/blockquote>"}, {"q": "6.4 volatile 的原理与作用", "tag": "高频", "body": "<ul><li><strong>可见性<\/strong>：volatile 写后插入 StoreStore/StoreLoad 屏障，强制写回主内存；读前插入 LoadLoad/LoadStore 屏障，失效本地缓存（实际上依赖 MESI 缓存一致性协议）。<\/li><li><strong>有序性<\/strong>：禁止 volatile 读写指令重排序。<\/li><li><strong>不保证原子性<\/strong>：<code>volatile int i; i++<\/code> 仍非原子。<\/li><li>经典用法：<strong>状态标志<\/strong>（<code>running<\/code> 开关）、<strong>DCL 单例<\/strong>、<strong>双写模式<\/strong>（double-checked locking）。<\/li><\/ul>"}, {"q": "6.5 synchronized 的锁升级过程与原理", "tag": "高频", "body": "<p><strong>对象头 Mark Word<\/strong> 记录锁状态，升级路径：<strong>无锁 → 偏向锁 → 轻量级锁 → 重量级锁<\/strong>（不可逆）。<\/p>\n<ul><li><strong>偏向锁<\/strong>：记录线程 ID，同线程重入无 CAS；有竞争即撤销偏向。<\/li><li><strong>轻量级锁<\/strong>：CAS 自旋抢锁（自旋次数/自适应），适合锁占用短。<\/li><li><strong>重量级锁<\/strong>：依赖 OS 互斥量（Monitor），线程阻塞唤醒涉及内核态切换，开销大。<\/li><li>JDK15 起偏向锁废弃（维护成本高），JDK18 移除。<\/li><\/ul>\n<blockquote>加分点：锁升级本质是\"根据竞争程度选择代价\"：无竞争→偏向，轻竞争→自旋，重竞争→阻塞；<code>-XX:+UseBiasedLocking<\/code> 可开关。<\/blockquote>"}, {"q": "6.6 CAS 原理与 ABA 问题", "tag": "高频", "body": "<ul><li><strong>CAS（Compare And Swap）<\/strong>：比较内存值是否等于预期值，相等才更新，否则重试；<code>Unsafe.compareAndSwapInt<\/code>，CPU 原子指令（cmpxchg）。<\/li><li>优点：无锁、无阻塞，乐观并发。<\/li><li>缺点：① 自旋空转耗 CPU；② <strong>ABA 问题<\/strong>：值 A→B→A，CAS 误判未修改——用 <code>AtomicStampedReference<\/code>（版本号）或 <code>AtomicMarkableReference<\/code> 解决；③ 只能保证<strong>单个变量<\/strong>原子性（多变量用 AtomicReference 包装）。<\/li><\/ul>"}, {"q": "6.7 ThreadLocal 原理与内存泄漏", "tag": "高频", "body": "<ul><li>每个线程持有 <code>ThreadLocalMap<\/code>，key 是 ThreadLocal 的<strong>弱引用<\/strong>，value 是强引用。<\/li><li><strong>内存泄漏<\/strong>：ThreadLocal 被回收（弱引用）后，key=null 但 value 仍被线程（如线程池复用线程）强引用 → 无法回收。<\/li><li><strong>解决<\/strong>：使用后 <code>remove()<\/code>；ThreadLocalMap 的 <code>get/set<\/code> 会顺带清理 key=null 的过期条目（expungeStaleEntry），但不保证。<\/li><li><strong>适用<\/strong>：线程内上下文（数据库连接、用户信息、事务）；<strong>继承<\/strong>用 <code>InheritableThreadLocal<\/code>（线程池场景失效，需 TransmittableThreadLocal 阿里 TTL）。<\/li><\/ul>"}, {"q": "6.8 死锁的产生条件与排查", "tag": "高频", "body": "<p>四个必要条件：<strong>互斥、占有且等待、不可剥夺、循环等待<\/strong>。<\/p>\n<ul><li>排查：<code>jstack<\/code> 查看 <code>Found one Java-level deadlock<\/code>；JMC/Arthas <code>thread -b<\/code>。<\/li><li>避免：锁顺序一致、加锁超时（<code>tryLock<\/code>）、锁粒度最小化、用更高层并发工具（如单锁、数据库行锁）。<\/li><\/ul>"}, {"q": "6.9 锁优化手段有哪些？", "tag": "进阶", "body": "<ul><li><strong>锁消除<\/strong>：逃逸分析证明对象不逃逸 → 去掉 synchronized（如 StringBuffer 局部变量）。<\/li><li><strong>锁粗化<\/strong>：连续加锁同一对象合并（循环内拼接）。<\/li><li><strong>自适应自旋<\/strong>：根据上次自旋成功率动态调整自旋次数。<\/li><li>以及偏向锁/轻量级锁/重量级锁的升级设计（见 6.5）。<\/li><\/ul>\n<hr>"}]}, {"title": "07 JUC 深度", "questions": [{"q": "7.1 AQS 原理：核心数据结构与模板方法", "tag": "高频", "body": "<p><strong>AbstractQueuedSynchronizer<\/strong> 是 JUC 锁与同步器的基石（ReentrantLock/CountDownLatch/Semaphore 都基于它）。<\/p>\n<ul><li><strong>核心成员<\/strong>：<code>volatile int state<\/code>（同步状态）+ <strong>CLH 双向队列<\/strong>（等待线程节点，含 prev/next/thread/waitStatus）。<\/li><li><strong>模板方法<\/strong>：<code>tryAcquire/tryRelease/tryAcquireShared/tryReleaseShared<\/code>（由子类实现，AQS 用模板方法模式）；<code>acquire<\/code> 流程：tryAcquire 失败 → <code>addWaiter<\/code> 入队 → <code>acquireQueued<\/code> 自旋/park。<\/li><li><strong>释放<\/strong>：head 节点出队唤醒后继（<code>unparkSuccessor<\/code>）。<\/li><li><strong>公平 vs 非公平<\/strong>：非公平在入队前先 CAS 抢一次（<code>hasQueuedPredecessors<\/code> 为 false 才抢），公平严格 FIFO。<\/li><li><strong>CLH 优化<\/strong>：前驱节点状态判断，避免惊群。<\/li><\/ul>\n<blockquote>加分点：AQS 用 <code>LockSupport.park/unpark<\/code> 阻塞唤醒，而不是 Object.wait（不依赖监视器、不抛中断异常、可指定线程精确唤醒）。<\/blockquote>"}, {"q": "7.2 ReentrantLock 与 synchronized 的对比", "tag": "高频", "body": "<table><thead><tr><th>维度<\/th><th>synchronized<\/th><th>ReentrantLock<\/th><\/tr><\/thead><tbody><tr><td>获取释放<\/td><td>自动<\/td><td>手动 lock/unlock（finally 释放）<\/td><\/tr><tr><td>公平性<\/td><td>非公平<\/td><td>公平/非公平可选<\/td><\/tr><tr><td>可中断<\/td><td>不可中断<\/td><td>lockInterruptibly<\/td><\/tr><tr><td>超时<\/td><td>无<\/td><td>tryLock(timeout)<\/td><\/tr><tr><td>条件队列<\/td><td>一个 wait/notify<\/td><td>多个 Condition（精确唤醒）<\/td><\/tr><tr><td>性能<\/td><td>JDK6 后已接近<\/td><td>相当（自适应自旋）<\/td><\/tr><\/tbody><\/table>\n<p><strong>可重入原理<\/strong>：<code>state<\/code> 计数——重入一次 state+1，释放一次 state-1，归零才真正释放锁。<\/p>"}, {"q": "7.3 读写锁：ReentrantReadWriteLock 与 StampedLock", "tag": "进阶", "body": "<ul><li><strong>ReentrantReadWriteLock<\/strong>：读读共享、读写互斥、写写互斥；state 高 16 位读计数、低 16 位写计数；<strong>锁降级<\/strong>（写锁→读锁）支持，<strong>锁升级<\/strong>不支持（会死锁）。<\/li><li><strong>StampedLock<\/strong>（JDK8）：乐观读（不阻塞写）、悲观读、写锁三种模式；读多写少时用乐观读 + 版本戳校验，性能更高；<strong>不可重入、不支持 Condition<\/strong>。<\/li><\/ul>"}, {"q": "7.4 CountDownLatch / CyclicBarrier / Semaphore 区别", "tag": "高频", "body": "<table><thead><tr><th>工具<\/th><th>作用<\/th><th>可复用<\/th><th>方向<\/th><\/tr><\/thead><tbody><tr><td>CountDownLatch<\/td><td>倒计数门闩，等 N 个任务完成<\/td><td>否（一次）<\/td><td>一个线程等多个<\/td><\/tr><tr><td>CyclicBarrier<\/td><td>栅栏，N 个线程互相等待齐头并进<\/td><td>是（reset）<\/td><td>多个线程互相等<\/td><\/tr><tr><td>Semaphore<\/td><td>信号量，控制并发访问数（限流）<\/td><td>是<\/td><td>共享资源池<\/td><\/tr><\/tbody><\/table>\n<blockquote>加分点：CountDownLatch 底层 AQS 共享模式（state=N，countDown 递减，归零唤醒 await）；Semaphore 公平/非公平对应 AQS 两种 acquire；<code>await<\/code> 与 <code>await(timeout)<\/code> 防死等。<\/blockquote>"}, {"q": "7.5 线程池七大参数与执行流程", "tag": "高频", "body": "<p><strong>七大参数<\/strong>：corePoolSize、maximumPoolSize、keepAliveTime + TimeUnit、workQueue（阻塞队列）、threadFactory、handler（拒绝策略）。<br><strong>执行流程<\/strong>：<\/p>\n<ol><li>线程数 < corePoolSize → 新建核心线程执行。<\/li><li>≥ corePoolSize → 入队 workQueue。<\/li><li>队列满 → 线程数 < maximumPoolSize → 新建非核心线程（临时线程）。<\/li><li>队列满且线程数 = maximumPoolSize → <strong>拒绝策略<\/strong>。<\/li><li>空闲线程超过 keepAliveTime → 回收（allowCoreThreadTimeOut 可回收核心线程）。<\/li><\/ol>\n<blockquote>加分点：<strong>先入队后扩线程<\/strong>（核心线程不够先排队），与\"先扩线程后入队\"（SynchronousQueue 场景）的区别常被问；线程池与队列的组合决定是\"缓存型\"还是\"弹性型\"。<\/blockquote>"}, {"q": "7.6 拒绝策略与阻塞队列如何选？", "tag": "高频", "body": "<p><strong>4 种拒绝策略<\/strong>（<code>ThreadPoolExecutor.AbortPolicy<\/code> 默认）：Abort（抛异常）、CallerRuns（调用线程执行）、Discard（静默丢弃）、DiscardOldest（丢弃队头最老任务）。<br><strong>阻塞队列<\/strong>：<\/p>\n<ul><li><code>ArrayBlockingQueue<\/code>：有界数组 FIFO，容量固定。<\/li><li><code>LinkedBlockingQueue<\/code>：可选有界链表，默认 Integer.MAX（<strong>易 OOM<\/strong>）。<\/li><li><code>SynchronousQueue<\/code>：无缓冲，任务直接交给线程（配合大 maxPoolSize 做\"弹性\"池）。<\/li><li><code>DelayQueue<\/code>：延迟任务（ScheduledThreadPoolExecutor 用 DelayedWorkQueue）。<\/li><li>生产建议：<strong>有界队列 + CallerRuns/自定义策略<\/strong>，宁可降速不可丢任务。<\/li><\/ul>"}, {"q": "7.7 线程池大小如何确定？如何监控？", "tag": "进阶", "body": "<ul><li><strong>CPU 密集<\/strong>：<code>N + 1<\/code>（N=核数）。<\/li><li><strong>IO 密集<\/strong>：<code>N * (1 + 等待时间/计算时间)<\/code> 或 <code>2N<\/code>（经验值）；更精确用 <code>N * CPU利用率 * (1 + W/C)<\/code>。<\/li><li>队列容量与拒绝策略要配合压测验证；<strong>避免无界队列<\/strong>。<\/li><li>监控：<code>getPoolSize/getActiveCount/getTaskCount/getQueue().size()<\/code> 定时采集；ThreadPoolExecutor 支持 hook 方法（beforeExecute/afterExecute）打点。<\/li><\/ul>\n<blockquote>加分点：核心线程数设置建议用 <code>Runtime.getRuntime().availableProcessors()<\/code>；线程池<strong>不允许用 Executors 快速创建<\/strong>——FixedThreadPool/单线程池无界队列 OOM、CachedThreadPool 最大线程 Integer.MAX 创建大量线程——这是阿里规约硬性要求。<\/blockquote>"}, {"q": "7.8 Future / CompletableFuture 异步编程", "tag": "进阶", "body": "<ul><li><strong>Future<\/strong>：get() 阻塞、isDone 轮询，无法组合编排。<\/li><li><strong>CompletableFuture<\/strong>（JDK8）：回调式异步，<code>thenApply/thenCompose/thenCombine/whenComplete<\/code> 链式编排，<code>allOf/anyOf<\/code> 聚合，异常用 <code>exceptionally/handle<\/code>。<\/li><li>原理：内部基于 <strong>Completion 栈<\/strong>（Treiber 栈）实现回调链，默认使用 ForkJoinPool.commonPool。<\/li><li>生产：<strong>自定义线程池传入<\/strong>，避免 commonPool 被阻塞任务耗尽（阿里规约）。<\/li><\/ul>"}, {"q": "7.9 并发容器一览", "tag": "基础", "body": "<table><thead><tr><th>容器<\/th><th>替代<\/th><th>特性<\/th><\/tr><\/thead><tbody><tr><td>ConcurrentHashMap<\/td><td>HashMap<\/td><td>分段/CAS+锁桶，高并发读<\/td><\/tr><tr><td>CopyOnWriteArrayList<\/td><td>ArrayList<\/td><td>写复制，读无锁<\/td><\/tr><tr><td>ConcurrentLinkedQueue<\/td><td>LinkedList<\/td><td>无锁 CAS 队列<\/td><\/tr><tr><td>BlockingQueue 族<\/td><td>队列<\/td><td>生产者消费者解耦<\/td><\/tr><tr><td>ConcurrentSkipListMap<\/td><td>TreeMap<\/td><td>跳表，并发有序<\/td><\/tr><tr><td>DelayQueue<\/td><td>定时<\/td><td>延迟任务调度<\/td><\/tr><\/tbody><\/table>\n<hr>"}]}, {"title": "08 IO 与网络", "questions": [{"q": "8.1 BIO / NIO / AIO 的区别", "tag": "高频", "body": "<table><thead><tr><th>模型<\/th><th>阻塞<\/th><th>模型<\/th><th>并发支撑<\/th><th>代表<\/th><\/tr><\/thead><tbody><tr><td>BIO<\/td><td>阻塞 IO<\/td><td>一连接一线程<\/td><td>差（线程爆炸）<\/td><td>Socket 传统<\/td><\/tr><tr><td>NIO<\/td><td>非阻塞 IO<\/td><td>多路复用（Selector）<\/td><td>好（一线程管多连接）<\/td><td>Netty<\/td><\/tr><tr><td>AIO<\/td><td>异步 IO<\/td><td>内核完成回调<\/td><td>好但 Linux 实现不成熟<\/td><td>JDK7 AIO<\/td><\/tr><\/tbody><\/table>\n<blockquote>加分点：NIO 是\"<strong>同步非阻塞<\/strong>\"（同步指读写过程由用户线程自己完成）；AIO 是\"异步非阻塞\"（内核完成 IO 后回调）；Linux 下 epoll 使 NIO 成为主流，AIO 因 glibc 生态问题应用少。<\/blockquote>"}, {"q": "8.2 NIO 三大组件：Buffer / Channel / Selector", "tag": "高频", "body": "<ul><li><strong>Buffer<\/strong>：缓冲区（position/limit/capacity 三指针），<code>flip()<\/code> 读模式、<code>compact()<\/code>、<code>rewind()<\/code>。<\/li><li><strong>Channel<\/strong>：双向通道（FileChannel/SocketChannel/DatagramChannel），与流的最大区别是<strong>双向<\/strong>。<\/li><li><strong>Selector<\/strong>：多路复用器，一个线程 <code>select()<\/code> 监听多个 Channel 的 OP_ACCEPT/OP_READ/OP_WRITE 事件，返回 <code>SelectionKey<\/code> 集合。<\/li><li>流程：注册 Channel 到 Selector → 事件就绪 → 遍历 key 处理 → <code>key.channel()<\/code> 读写。<\/li><\/ul>"}, {"q": "8.3 IO 多路复用：select / poll / epoll 对比", "tag": "进阶", "body": "<table><thead><tr><th>维度<\/th><th>select<\/th><th>poll<\/th><th>epoll<\/th><\/tr><\/thead><tbody><tr><td>结构<\/td><td>fd_set 位图<\/td><td>pollfd 数组<\/td><td>事件表 + 红黑树<\/td><\/tr><tr><td>上限<\/td><td>1024<\/td><td>无限制<\/td><td>无限制<\/td><\/tr><tr><td>拷贝<\/td><td>每次全量拷贝到内核<\/td><td>同左<\/td><td>mmap 共享，注册一次<\/td><\/tr><tr><td>触发<\/td><td>水平 LT<\/td><td>水平 LT<\/td><td>水平 LT + <strong>边缘 ET<\/strong><\/td><\/tr><tr><td>效率<\/td><td>O(n) 轮询<\/td><td>O(n) 轮询<\/td><td><strong>O(1)<\/strong> 事件回调<\/td><\/tr><\/tbody><\/table>\n<blockquote>加分点：epoll 的 ET（边缘触发）模式只在状态变化时通知一次，要求一次性读完，Netty 默认 <strong>LT<\/strong>；epoll 适合大量空闲连接场景，select/poll 适合连接少且活跃。<\/blockquote>"}, {"q": "8.4 零拷贝是什么？Java 里如何实现？", "tag": "进阶", "body": "<ul><li>传统 read+write 需 <strong>4 次拷贝 + 4 次上下文切换<\/strong>（内核态/用户态）。<\/li><li><strong>mmap<\/strong>：用户态与内核态共享内核缓冲区，减少 1 次拷贝（<code>MappedByteBuffer<\/code>）。<\/li><li><strong>sendfile<\/strong>：数据不经过用户态，内核直接 DMA 到 Socket（<code>FileChannel.transferTo<\/code> → <code>sendfile<\/code> 系统调用）→ <strong>2 次拷贝<\/strong>；支持 scatter-gather 后仅 2 次 DMA 拷贝。<\/li><li>Netty 的 <code>FileRegion<\/code> 底层即 transferTo。<\/li><\/ul>"}, {"q": "8.5 Netty 的核心架构与线程模型", "tag": "高频", "body": "<ul><li><strong>Reactor 模型<\/strong>：Main Reactor（boss，accept 连接）→ Sub Reactor（worker，IO 读写），即主从多线程模型。<\/li><li><strong>核心组件<\/strong>：Bootstrap/ServerBootstrap、EventLoopGroup（线程组，每个 EventLoop 绑定一个线程 + 一个 Selector）、ChannelPipeline（责任链）、ByteBuf（池化、引用计数）、ChannelHandler（入站/出站）。<\/li><li><strong>ByteBuf<\/strong>：读写双指针，支持零拷贝（CompositeByteBuf、slice、Unpooled.wrappedBuffer）、池化（PooledByteBufAllocator）。<\/li><li><strong>粘包拆包<\/strong>：<code>LineBasedFrameDecoder<\/code>、<code>DelimiterBasedFrameDecoder<\/code>、<code>FixedLengthFrameDecoder<\/code>、<strong><code>LengthFieldBasedFrameDecoder<\/code><\/strong>（最常用，带长度字段）。<\/li><\/ul>\n<blockquote>加分点：Netty 的写事件由 eventLoop 线程保证单线程写，避免多线程写 ByteBuf 的竞态；业务处理耗时任务要丢到独立业务线程池，避免阻塞 eventLoop。<\/blockquote>"}, {"q": "8.6 TCP 三次握手、四次挥手与 TIME_WAIT", "tag": "基础", "body": "<ul><li>三次握手：SYN → SYN+ACK → ACK；确认双方收发能力，防历史重复连接。<\/li><li>四次挥手：FIN → ACK → FIN → ACK；因半关闭（单向关闭）。<\/li><li><strong>TIME_WAIT<\/strong>（主动关闭方，2MSL）：保证最后的 ACK 可达 + 让旧连接报文在网络中消失；大量 TIME_WAIT 出现在短连接高并发场景 → 调整内核参数或改长连接。<\/li><li>服务端大量 CLOSE_WAIT：<strong>对端关闭但本地未 close<\/strong>，通常代码未关闭 Socket/连接池泄漏。<\/li><\/ul>\n<hr>"}]}, {"title": "09 Spring 核心", "questions": [{"q": "9.1 IOC 容器：BeanFactory 与 ApplicationContext", "tag": "高频", "body": "<ul><li><strong>BeanFactory<\/strong>：最底层容器，懒加载（getBean 时才创建）。<\/li><li><strong>ApplicationContext<\/strong>：继承 BeanFactory，<strong>启动时预实例化单例<\/strong> + AOP、事件、国际化、环境抽象等企业级能力；常用实现：ClassPathXmlApplicationContext（XML）、AnnotationConfigApplicationContext（注解）。<\/li><li><strong>IOC 本质<\/strong>：控制反转——对象创建与依赖注入交给容器，降低耦合；对应 DI（依赖注入）：构造器注入（推荐，final 保证）、setter 注入、字段注入（@Autowired，不推荐，难测试）。<\/li><\/ul>\n<blockquote>加分点：Spring 中单例 Bean 默认<strong>非懒加载<\/strong>（预实例化）——启动即创建，利于发现问题；<code>@Lazy<\/code> 可改。<\/blockquote>"}, {"q": "9.2 Bean 生命周期完整流程", "tag": "高频", "body": "<p><code>实例化 → 属性填充（依赖注入）→ Aware 回调（BeanNameAware/BeanFactoryAware/ApplicationContextAware）→ BeanPostProcessor.postProcessBeforeInitialization → @PostConstruct / InitializingBean.afterPropertiesSet / init-method → BeanPostProcessor.postProcessAfterInitialization（AOP 代理在此生成）→ 使用 → 销毁（@PreDestroy / DisposableBean / destroy-method）<\/code><\/p>\n<blockquote>加分点：<strong>AOP 代理在 postProcessAfterInitialization 生成<\/strong>（AbstractAutoProxyCreator）——所以被代理 Bean 的初始化方法仍走原对象，但对外暴露的是代理；<code>@PostConstruct<\/code> 在依赖注入完成后执行，早于 InitializingBean。<\/blockquote>"}, {"q": "9.3 循环依赖与三级缓存", "tag": "高频", "body": "<pre><code class=\"lang-java\">// 三级缓存（DefaultSingletonBeanRegistry）\nMap&lt;String, Object&gt; singletonObjects;        // 一级：成品单例（完成初始化）\nMap&lt;String, Object&gt; earlySingletonObjects;   // 二级：早期暴露的半成品（未完成属性填充）\nMap&lt;String, ObjectFactory&lt;?&gt;&gt; singletonFactories; // 三级：对象工厂（用于生成代理）<\/code><\/pre>\n<p><strong>流程（A 依赖 B，B 依赖 A）<\/strong>：<\/p>\n<ol><li>创建 A → 实例化 → 放入三级缓存（singletonFactory）→ 属性填充时发现依赖 B。<\/li><li>创建 B → 实例化 → 三级缓存 → 填充属性发现依赖 A。<\/li><li>从三级缓存取 A 的 ObjectFactory → <code>getEarlyBeanReference<\/code> 生成 A 的<strong>早期引用<\/strong>（若 A 需要 AOP，此处生成代理）→ 放入二级缓存 → 注入给 B。<\/li><li>B 完成 → B 入一级缓存 → A 继续完成属性填充 → A 入一级缓存。<\/li><\/ol>\n<p><strong>为什么三级不用二级<\/strong>：二级缓存无法在\"实例化后、属性填充前\"用 BeanPostProcessor 生成 AOP 代理（代理要等目标对象真实被引用时才知道是否需要），三级缓存用 ObjectFactory 延迟决策。<\/p>\n<blockquote>追问：构造器注入的循环依赖无法解决（实例化阶段就要依赖）；<code>@Async<\/code>/<code>@Transactional<\/code> 代理对象循环依赖 JDK 版本不同行为不同，Spring Boot 2.6+ 默认<strong>禁止循环依赖<\/strong>（spring.main.allow-circular-references=false）。<\/blockquote>"}, {"q": "9.4 AOP 原理：JDK 动态代理 vs CGLIB", "tag": "高频", "body": "<ul><li><strong>JDK 动态代理<\/strong>：基于接口，<code>Proxy.newProxyInstance<\/code> + <code>InvocationHandler<\/code>，运行时生成代理类。<\/li><li><strong>CGLIB<\/strong>：基于继承，生成目标类子类（<code>Enhancer<\/code> + <code>MethodInterceptor<\/code>），可代理无接口类；<strong>final 方法/类无法代理<\/strong>。<\/li><li>Spring 选择：目标有接口 → JDK 代理；无接口 → CGLIB；<strong>Spring Boot 2.x+ 默认强制 CGLIB<\/strong>（<code>spring.aop.proxy-target-class=true<\/code>）。<\/li><li>AOP 概念：切面（@Aspect）、切点（@Pointcut）、通知（@Before/@After/@Around/@AfterReturning/@AfterThrowing）、连接点、织入（编译期/类加载期/运行期——Spring 是运行期代理织入）。<\/li><\/ul>\n<blockquote>加分点：<code>@Around<\/code> 最灵活（可控制是否执行方法）；AOP 自调用失效——<code>this.method()<\/code> 不走代理，必须注入自身代理或 <code>AopContext.currentProxy()<\/code>。<\/blockquote>"}, {"q": "9.5 @Transactional 事务失效的常见场景", "tag": "高频", "body": "<ol><li><strong>自调用<\/strong>：同类内 this 调用，不走代理。<\/li><li><strong>方法非 public<\/strong>（默认拦截器仅 public）。<\/li><li><strong>异常被吞<\/strong>：<code>try-catch<\/code> 住了 RuntimeException；或抛出的不是 RuntimeExc
