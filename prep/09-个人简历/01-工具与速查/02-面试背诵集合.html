ng>（先删快过期的）。<strong>资金/幂等键这类不能丢的，必须 noeviction<\/strong>，宁报错也不静默丢。<\/p>"}, {"q": "L2 · 追问：资金冻结的 TTL 怎么设？「冻结超时自动释放」怎么做？", "tag": "", "body": "<p><strong>答<\/strong>：系统设计里有「冻结超时自动释放」（如 2 小时超时释放，保护客户资金不被锁死）。实现：① 冻结 key 设 <strong>TTL=2h<\/strong>，配合 <strong>keyspace 通知<\/strong>（<code>EXPIRE<\/code> 事件）在过期时触发释放逻辑；② 或<strong>延迟队列<\/strong>（ZSet 用「过期时间戳」做 score，轮询取出已过期的冻结单释放）；③ DB 侧冻结单状态 + 定时任务扫描兜底。<strong>超时释放必须幂等<\/strong>（可能多次触发）。<\/p>"}, {"q": "L3 · 追问：为什么不用「到期立刻删除」而是靠通知/轮询？", "tag": "", "body": "<p><strong>答<\/strong>：Redis 的过期是<strong>惰性/定期<\/strong>，不是「到期精确触发」；且业务释放动作（改 DB 状态、回补余额）<strong>必须在业务侧做<\/strong>，Redis 只能当触发器。所以用 keyspace 通知或延迟队列「<strong>通知业务去释放<\/strong>」，业务释放逻辑幂等 + DB 兜底。<\/p>"}, {"q": "L4 · 追问：LRU 和 LFU 有什么区别？资金缓存用哪个？", "tag": "", "body": "<p><strong>答<\/strong>：LRU 按「<strong>最近访问时间<\/strong>」淘汰，LFU 按「<strong>访问频率<\/strong>」淘汰。LFU 更能保护「访问频繁但偶尔不被访问」的热点 key。资金/幂等缓存<strong>不参与淘汰<\/strong>（noeviction，宁可满也不丢）；普通缓存热点多的用 <strong>LFU<\/strong>，通用的用 <strong>LRU<\/strong>。<\/p>\n<hr>"}]}, {"title": "新增高频题（结合业务的 Redis 补充题）", "questions": [{"q": "补01 · Redis 和 Memcached 的区别？", "tag": "", "body": "<p><strong>答<\/strong>：Redis 支持<strong>丰富数据结构<\/strong>（String/List/Set/ZSet/Hash/Stream…）、<strong>持久化<\/strong>（RDB/AOF）、<strong>主从/集群<\/strong>、<strong>原子 Lua<\/strong>；Memcached 只支持 String、纯内存无持久化、多线程。资金系统需要「原子扣减 + 锁 + 幂等 + 持久化」，只能用 Redis。<\/p>"}, {"q": "补02 · 为什么资金余额用 Redis 而不用本地缓存（Caffeine）？", "tag": "", "body": "<p><strong>答<\/strong>：余额是<strong>跨实例共享<\/strong>的强一致数据，本地缓存每个实例各有一份，无法保证「全局唯一余额」和「原子扣减」。Redis 是<strong>集中式共享内存<\/strong>，所有实例读同一个余额、扣减原子。本地缓存只适合「字典、权限」这类<strong>可容忍不一致、单实例热读<\/strong>的数据。<\/p>"}, {"q": "补03 · 分布式锁的 value 为什么用「UUID + 线程号」而不是固定值？", "tag": "", "body": "<p><strong>答<\/strong>：释放锁时要<strong>校验「这把锁是不是自己加的」<\/strong>。固定 value 无法区分「A 的锁」和「B 的锁」，误删风险高；用 UUID+线程号唯一标识加锁者，Lua 释放时 <code>GET == value<\/code> 才删，避免误删别人的锁。<\/p>"}, {"q": "补04 · Redis 的 key 设计有哪些规范？", "tag": "", "body": "<p><strong>答<\/strong>：① <strong>有业务前缀 + 冒号分层<\/strong>：<code>fund:balance:{poolId}<\/code>、<code>settle:idem:{no}<\/code>；② <strong>可读、见名知义<\/strong>；③ <strong>控制长度<\/strong>（太长占内存）；④ <strong>避免热 key<\/strong>（热点拆多副本）；⑤ <strong>避免大 key<\/strong>（集合过大拆分）；⑥ 用 <code>hash tag {poolId}<\/code> 保证相关 key 同 slot。<\/p>"}, {"q": "补05 · 缓存与 DB 双写，为什么会「数据错乱」？怎么用「双写一致性」解决？", "tag": "", "body": "<p><strong>答<\/strong>：并发下两个请求交叉写：A 写 DB、B 写 DB、B 删缓存、A 删缓存，最终缓存可能是旧值。解决：<strong>串行化<\/strong>（同 key 的写操作加锁/队列）、<strong>延迟双删<\/strong>、<strong>canal 订阅 binlog 驱动<\/strong>（DB 为准，缓存由 binlog 事件刷新），核心是<strong>让 DB 成为唯一真相、缓存只能被动跟随<\/strong>。<\/p>"}, {"q": "补06 · 为什么说「Redis 适合做缓存，不适合做数据库」？", "tag": "", "body": "<p><strong>答<\/strong>：Redis 数据在内存、持久化是「尽力而为」，<strong>宕机可能丢数据、内存容量有限、事务只有单命令/Lua 的原子性<\/strong>，没有关系型数据库的强事务和复杂查询。所以资金流水、账本这类「真相数据」必须落 MySQL/PostgreSQL，Redis 只做加速和并发控制。<\/p>"}, {"q": "补07 · 怎么保证「余额扣减」和「订单状态」两个动作的一致性？", "tag": "", "body": "<p><strong>答<\/strong>：这是<strong>跨服务分布式事务<\/strong>问题。方案：① <strong>本地消息表 + MQ<\/strong>（最终一致，系统常用）：本地事务同时写业务数据 + 消息表，MQ 投递驱动余额扣减，失败重试；② <strong>TCC<\/strong>（Try-Confirm-Cancel）：预扣（Try）→ 确认（Confirm）/ 取消（Cancel）；③ <strong>Seata<\/strong> 分布式事务框架。B2B 资金场景常用「<strong>本地消息表 + MQ + 幂等 + 对账<\/strong>」的组合，而非强一致 XA。<\/p>"}, {"q": "补08 · Redis 的 pipeline 和事务（MULTI/EXEC）有什么区别？", "tag": "", "body": "<p><strong>答<\/strong>：pipeline 是<strong>批量发送命令减少 RTT<\/strong>，但不保证原子性、无回滚；MULTI/EXEC 是<strong>事务<\/strong>，命令排队、EXEC 时原子执行（但<strong>没有回滚<\/strong>，某命令出错其他命令仍执行）。真正要「读-判-写」原子，用 <strong>Lua 脚本<\/strong>（Redis 单线程执行脚本，真正原子）。资金扣减用 Lua，批量查询用 pipeline。<\/p>"}, {"q": "补09 · 为什么 Redis 事务不支持回滚？", "tag": "", "body": "<p><strong>答<\/strong>：Redis 追求简单高效，命令在入队时已做语法校验，运行时错误（如对 String 做 LPUSH）<strong>难以回滚且代价高<\/strong>；Redis 认为<strong>这类错误是编程错误，应在开发阶段发现<\/strong>，不值得为它引入回滚机制。需要原子性用 Lua。<\/p>"}, {"q": "补10 · 缓存雪崩时，怎么用「限流 + 降级」保护资金链路？", "tag": "", "body": "<p><strong>答<\/strong>：① <strong>限流<\/strong>：网关/Redis 令牌桶（<code>INCR<\/code> + 过期做计数器）限制打到资金服务的 QPS；② <strong>降级<\/strong>：非核心读接口降级为返回缓存/兜底值，甚至关闭；③ <strong>熔断<\/strong>：资金 DB 压力过大时熔断非核心链路，<strong>优先保证扣款/结算等核心资金动作<\/strong>；④ <strong>隔离<\/strong>：资金服务的 Redis 与普通缓存 Redis <strong>物理隔离<\/strong>，避免普通缓存雪崩拖垮资金。<\/p>"}, {"q": "补11 · Redis 集群中，资金幂等键应该放哪个节点？怎么保证一致性？", "tag": "", "body": "<p><strong>答<\/strong>：用 <strong>hash tag <code>{poolId}<\/code><\/strong> 让同一资金池相关的「余额、幂等键、锁」落到<strong>同一 slot/节点<\/strong>，保证相关 key 的 Lua 多 key 操作可用、且本地化减少跨节点请求。幂等键的最终一致性靠 <strong>DB 唯一索引兜底<\/strong>，不依赖 Redis 集群的强一致。<\/p>"}, {"q": "补12 · 如何用 Redis 做「限流」？（结合接口防刷）", "tag": "", "body": "<p><strong>答<\/strong>：① <strong>固定窗口<\/strong>：<code>INCR rate:user:{id}<\/code> + <code>EXPIRE 60<\/code>，超过阈值拒绝；② <strong>滑动窗口<\/strong>：ZSet 用时间戳做 score，<code>ZREMRANGEBYSCORE<\/code> 清理窗口外 + <code>ZCARD<\/code> 计数；③ <strong>令牌桶/漏桶<\/strong>：Lua 脚本原子实现令牌生成与扣减。资金系统的「支付接口防刷、结算接口限流」常用滑动窗口 + Lua。<\/p>"}, {"q": "补13 · Redis 的 keyspace 通知可靠性如何？资金释放能只靠它吗？", "tag": "", "body": "<p><strong>答<\/strong>：keyspace 通知是<strong>尽力而为<\/strong>，<strong>不保证送达<\/strong>（客户端断线、通知丢失都可能发生）。所以<strong>资金冻结超时释放不能只靠 keyspace 通知<\/strong>，必须「<strong>keyspace 通知（快）+ 延迟队列/ZSet 轮询（稳）+ DB 定时任务扫表（最终兜底）<\/strong>」多层冗余，释放逻辑幂等。<\/p>"}, {"q": "补14 · 什么是 Redis 的「缓存击穿」的「逻辑过期」方案？和「互斥锁」比有何优劣？", "tag": "", "body": "<p><strong>答<\/strong>：逻辑过期：缓存存「值 + 逻辑过期时间」，读时若逻辑过期，<strong>先返回旧值<\/strong>、异步开线程重建；互斥锁：过期后<strong>只让一个线程回源<\/strong>、其余等待。逻辑过期<strong>用户体验好（不阻塞）<\/strong>，但可能短暂读到旧值、实现复杂；互斥锁<strong>数据新<\/strong>，但会阻塞等待。资金热点余额用「原子扣减」不在此列，普通热点合同/商品用逻辑过期更平滑。<\/p>\n<hr>\n<p>*整理时间：2026-08 · 追问链锚定 p001_b2b_supply_chain 业务系统（资金池/预扣冻结2PC/幂等/状态机/事件总线/挂摘牌）· 资金场景底线永远是 DB，Redis 是加速与并发控制的利器*<\/p>"}]}], "qcount": 77}, {"sub": "题库深度版", "chapters": [{"title": "01 基础认知与数据类型", "questions": [{"q": "1.1 Redis 是什么？主要应用场景有哪些？", "tag": "高频", "body": "<p><strong>Redis<\/strong> 是一个基于 <strong>内存<\/strong> 的键值对 NoSQL 数据库（Remote Dictionary Server），由 C 语言编写，单机 QPS 可达 <strong>10万+<\/strong>。既是数据库，也是缓存，还是消息中间件。<\/p>\n<p>典型场景：<\/p>\n<ul><li><strong>缓存<\/strong>：热点数据加速，扛住读并发（最主流）。<\/li><li><strong>分布式锁<\/strong>：SET NX EX 实现互斥，见第 10 章。<\/li><li><strong>排行榜<\/strong>：ZSet 按分数排序。<\/li><li><strong>计数器/限流<\/strong>：INCR、滑动窗口、令牌桶。<\/li><li><strong>消息队列<\/strong>：List / PubSub / Stream。<\/li><li><strong>社交关系<\/strong>：Set 做关注/粉丝/共同好友。<\/li><li><strong>统计类<\/strong>：Bitmap 签到、HyperLogLog UV、GEO 附近的人。<\/li><\/ul>\n<blockquote>加分点：Redis 不是\"缓存\"这么简单——它凭借丰富数据结构 + 原子命令 + Lua 脚本，承担了大量\"在线逻辑\"。<\/blockquote>"}, {"q": "1.2 五大基础数据类型及底层编码", "tag": "高频", "body": "<table><thead><tr><th>类型<\/th><th>说明<\/th><th>底层编码（7.0 前 / 7.0 起）<\/th><th>经典命令<\/th><\/tr><\/thead><tbody><tr><td>String<\/td><td>字符串/整数/浮点<\/td><td>int / embstr / raw<\/td><td>SET GET INCR MGET<\/td><\/tr><tr><td>Hash<\/td><td>字段-值映射，对象<\/td><td>ziplist / dict → <strong>listpack<\/strong> / dict<\/td><td>HSET HGET HGETALL<\/td><\/tr><tr><td>List<\/td><td>双向链表<\/td><td>ziplist / linkedlist → <strong>quicklist<\/strong>（listpack 节点）<\/td><td>LPUSH RPOP LRANGE<\/td><\/tr><tr><td>Set<\/td><td>无序去重集合<\/td><td>intset / hashtable<\/td><td>SADD SISMEMBER SUNION<\/td><\/tr><tr><td>ZSet<\/td><td>有序去重集合<\/td><td>ziplist / skiplist+dict → <strong>listpack<\/strong> / skiplist+dict<\/td><td>ZADD ZRANGE ZSCORE<\/td><\/tr><\/tbody><\/table>\n<blockquote>加分点：7.0 用 <strong>listpack 全面替代 ziplist<\/strong>（配置项也从 <code>*-max-ziplist-*<\/code> 改为 <code>*-max-listpack-*<\/code>），解决了 ziplist 级联更新的缺陷。<\/blockquote>"}, {"q": "1.3 String 的三种编码：int / embstr / raw", "tag": "进阶", "body": "<ul><li><strong>int<\/strong>：value 是整数且能用 long 表示 → 直接用 long 存，节省内存。<\/li><li><strong>embstr<\/strong>：长度 <strong>≤ 44 字节<\/strong>（3.2 之前是 39）→ 一次 malloc 分配 redisObject + sdshdr 连续内存，只读优化。<\/li><li><strong>raw<\/strong>：长度 > 44 字节 → 两次分配，普通 SDS。<\/li><li>一旦对 embstr 执行修改（APPEND 等），会转成 raw。<\/li><\/ul>\n<blockquote>追问：为什么是 44？因为 embstr 需要一次性分配 64 字节（jemalloc 分配单元），减去 redisObject(16B) 和 sdshdr8(3B) + 结束符(1B)，剩余 44 字节可存数据。<\/blockquote>"}, {"q": "1.4 ZSet 为什么既能排序又能快速查分？", "tag": "进阶", "body": "<p>ZSet 底层是 <strong>skiplist + dict<\/strong> 双结构：<\/p>\n<ul><li><strong>skiplist<\/strong>：按 score 排序，支持 ZRANGE 范围查询、ZRANK 排名（O(logN)）。<\/li><li><strong>dict<\/strong>：member → score 映射，支持 ZSCORE O(1) 精确查分。<\/li><li>两者通过指针共享同一份元素，<strong>不冗余存储数据<\/strong>。<\/li><\/ul>\n<blockquote>追问：什么时候用 ziplist/listpack？元素数量 < 128 且 value 长度 < 64 字节时用 listpack 紧凑存储，超过后升级为 skiplist+dict。<\/blockquote>"}, {"q": "1.5 高级类型：Bitmap / HyperLogLog / GEO / Stream", "tag": "高频", "body": "<ul><li><strong>Bitmap<\/strong>：位图，基于 String 按位操作。签到（SETBIT 1 表示签）、在线状态、布隆过滤器。<\/li><li><strong>HyperLogLog<\/strong>：基数统计（UV）。<strong>12KB 内存即可统计 2^64 个不同值<\/strong>，误差约 <strong>0.81%<\/strong>，不可精确回读元素。<\/li><li><strong>GEO<\/strong>：经纬度地理信息，底层就是 ZSet（GeoHash 编码作 score）。附近的人：GEORADIUS。<\/li><li><strong>Stream<\/strong>（5.0 引入）：<strong>可持久化的消息队列<\/strong>，支持消费者组、消息 ACK、Pending 列表、死信处理，是 Redis 最接近专业 MQ 的形态。<\/li><\/ul>"}, {"q": "1.6 单机默认 16 个数据库，为什么通常只用 0 号库？", "tag": "基础", "body": "<p><code>select 0~15<\/code> 切换。但生产环境<strong>几乎只用 db0<\/strong>：<\/p>\n<ul><li>多库不便于管理、难排查。<\/li><li>集群模式下<strong>只有 db0<\/strong>（Cluster 不支持多库）。<\/li><li>语义隔离应通过 <strong>key 前缀/命名空间<\/strong>（如 <code>user:1001:profile<\/code>）而非多库。<\/li><\/ul>\n<blockquote>加分点：3.x 就有人提出废弃多库；现在官方推荐用前缀隔离 + 不同 Redis 实例隔离不同业务。<\/blockquote>\n<hr>"}]}, {"title": "02 底层数据结构", "questions": [{"q": "2.1 SDS（简单动态字符串）比 C 字符串强在哪？", "tag": "高频", "body": "<p>SDS 结构：<code>len + alloc + flags + buf[]<\/code>，相比 C 字符串：<\/p>\n<ol><li><strong>O(1) 获取长度<\/strong>：C 字符串要 O(n) 遍历。<\/li><li><strong>杜绝缓冲区溢出<\/strong>：修改前检查空间，不足自动扩容（<strong>预分配<\/strong>：<1MB 翻倍，≥1MB 加 1MB）。<\/li><li><strong>二进制安全<\/strong>：以 len 判断结束而不是 <code>\\0<\/code>，可存图片、序列化对象等任意二进制。<\/li><li><strong>惰性空间释放<\/strong>：缩短字符串不立即释放，避免频繁重分配。<\/li><li><strong>兼容 C 字符串函数<\/strong>：末尾保留 <code>\\0<\/code>，能直接复用 strlen/strcat 等。<\/li><\/ol>"}, {"q": "2.2 dict 字典的渐进式 rehash 怎么工作？", "tag": "高频", "body": "<p>dict = 两个哈希表 ht[0]、ht[1] + rehashidx。<\/p>\n<ul><li><strong>触发扩容<\/strong>：used/size ≥ 1（允许扩容时）触发翻倍扩容；<strong>used/size ≥ 5 时强制扩容<\/strong>。<\/li><li><strong>触发缩容<\/strong>：used/size < 0.1 时缩容。<\/li><li><strong>渐进式<\/strong>：不一次性迁移所有键（会阻塞），而是 rehash 期间<strong>每次增删查改顺带迁移一个桶<\/strong>，直到 rehashidx 走完 ht[0] 全部桶。<\/li><li><strong>rehash 期间<\/strong>：新键一律加 ht[1]；读操作先查 ht[0] 再查 ht[1]；删除两表都查。<\/li><li><strong>负载因子<\/strong>：默认 1；做 BGSAVE/BGREWRITEAOF 时（子进程 fork 期间）提高到 5，避免写时复制扩大内存。<\/li><\/ul>\n<blockquote>加分点：渐进式 rehash 是 Redis\"单线程不能长时间阻塞\"哲学的典型体现。<\/blockquote>"}, {"q": "2.3 ziplist 是什么？为什么 7.0 被 listpack 淘汰？", "tag": "进阶", "body": "<p>ziplist 是一块<strong>连续内存<\/strong>，按\"前一个节点长度 + 编码 + 数据\"紧凑排列，省内存且 cache 友好。<\/p>\n<ul><li>代价：<strong>连锁更新<\/strong>——某节点长度变化导致后续所有节点的 prevlen 字段连锁扩容，最坏 O(n²)。<\/li><li>listpack（7.0）：每个节点只记录<strong>自身长度<\/strong>，不再记录前驱长度 → <strong>彻底消除连锁更新<\/strong>，同时保持紧凑。<\/li><\/ul>"}, {"q": "2.4 quicklist 与 linkedlist", "tag": "进阶", "body": "<ul><li>3.2 前：List 元素少用 ziplist，多则 linkedlist（每个节点一个独立内存，碎片化 + 指针开销大）。<\/li><li>3.2 起：<strong>quicklist = 双向链表 + 每节点一段 ziplist/listpack<\/strong>，兼顾内存紧凑与两端 O(1) 操作。<\/li><li>配置：<code>list-max-listpack-size<\/code>（节点容量，默认 128 或 8KB）、<code>list-compress-depth<\/code>（两端外中间节点压缩，0 不压缩）。<\/li><\/ul>"}, {"q": "2.5 跳表 skiplist：为什么 ZSet 用它而不是红黑树？", "tag": "高频", "body": "<p>跳表 = 有序链表 + 多层索引，查找 O(logN)。<\/p>\n<p>选跳表而非红黑树/AVL 的原因：<\/p>\n<ol><li><strong>实现简单<\/strong>：区间/范围查询（ZRANGE）实现远比平衡树容易——跳表天然有序遍历。<\/li><li><strong>增删改简单<\/strong>：无需复杂的旋转/染色，调整层级即可。<\/li><li><strong>内存局部性可控<\/strong>：按需随机建层，常数因子适中（Redis 层高上限 32，概率 p=0.25）。<\/li><li>红黑树在<strong>单点查、内存占用<\/strong>上略优，但 Redis 高频操作是范围查询，跳表更合适。<\/li><\/ol>\n<blockquote>加分点：skiplist 的层高用随机数生成（类似抛硬币），Redis 通过 ZSKIPLIST_MAXLEVEL=32 限制层数，期望层高 ≈ 4。<\/blockquote>"}, {"q": "2.6 intset 整数集合", "tag": "基础", "body": "<ul><li>只存整数的 Set 用 intset：连续数组，按编码 int16/int32/int64 递增升级存储。<\/li><li>升级条件：元素个数 > <strong>512<\/strong>（<code>set-max-intset-entries<\/code>）或插入非整数 → 转 hashtable。<\/li><li>升级<strong>不可逆<\/strong>：一旦升级为 int64 编码，删回小整数也不会降级。<\/li><\/ul>\n<hr>"}]}, {"title": "03 持久化", "questions": [{"q": "3.1 RDB 持久化原理与触发方式", "tag": "高频", "body": "<p>RDB = 内存数据的<strong>二进制快照<\/strong>。<\/p>\n<p>触发方式：<\/p>\n<ul><li>手动：<code>SAVE<\/code>（阻塞主线程）、<code>BGSAVE<\/code>（fork 子进程）。<\/li><li>自动：配置 <code>save 900 1 / 300 10 / 60 10000<\/code>（900 秒内 ≥1 次写、300 秒内 ≥10 次、60 秒内 ≥1 万次，满足任一即 BGSAVE）。<\/li><li>其他：主从<strong>全量同步<\/strong>、<code>SHUTDOWN<\/code>（无 AOF 时）也会触发。<\/li><\/ul>\n<p>流程（BGSAVE）：<\/p>\n<ol><li>fork 子进程（<strong>此时内存几乎翻倍风险<\/strong>，见 3.7）。<\/li><li>子进程写临时 RDB 文件（利用 COW 快照内存页）。<\/li><li>写完后 <strong>rename 原子替换<\/strong> 旧 RDB。<\/li><\/ol>\n<p>优缺点：<\/p>\n<ul><li>✅ 文件紧凑、加载快、适合<strong>备份/灾备<\/strong>。<\/li><li>❌ <strong>丢数据窗口大<\/strong>（两次快照间的写入全丢）。<\/li><\/ul>"}, {"q": "3.2 fork + COW（写时复制）的细节", "tag": "进阶", "body": "<p>fork 出的子进程与父进程共享内存页表。子进程读共享页写 RDB；父进程收到写请求时，<strong>被写的页先复制一份再修改<\/strong>（COW），子进程看到的仍是 fork 时刻的旧页。<\/p>\n<ul><li>好处：子进程不阻塞父进程，能\"瞬间\"拿到一致性快照。<\/li><li>风险：<strong>写越多，复制页越多，内存占用越高<\/strong>（极端可能 2 倍）；大实例 fork 本身也耗时。<\/li><li>优化：<code>vm.overcommit_memory=1<\/code> 允许超量内存；避免 fork 期间大量写；主从的从库开 RDB 可降低主库负担。<\/li><\/ul>"}, {"q": "3.3 AOF 原理与三种刷盘策略", "tag": "高频", "body": "<p>AOF = 追加<strong>写命令<\/strong>日志（类似 binlog，存的是 Redis 协议文本）。<\/p>\n<p>三种策略（<code>appendfsync<\/code>）：<\/p>\n<table><thead><tr><th>策略<\/th><th>刷盘时机<\/th><th>性能<\/th><th>最多丢数据<\/th><\/tr><\/thead><tbody><tr><td>always<\/td><td>每条命令 fsync<\/td><td>最慢<\/td><td>1 条命令<\/td><\/tr><tr><td>everysec<\/td><td>每秒 fsync<\/td><td>折中<\/td><td>1 秒<\/td><\/tr><tr><td>no<\/td><td>交给操作系统<\/td><td>最快<\/td><td>数十秒~更多<\/td><\/tr><\/tbody><\/table>\n<ul><li>默认 <strong>everysec<\/strong>，兼顾性能与安全。<\/li><li>fsync 调用是同步 IO，always 会显著拖慢吞吐；no 依赖内核 pdflush 策略，崩溃丢数据不可控。<\/li><\/ul>"}, {"q": "3.4 AOF 重写（rewrite）原理", "tag": "高频", "body": "<p>AOF 无限追加会膨胀。重写 = 用<strong>当前数据集<\/strong>生成最小命令集（如对 100 万次 INCR 只写 <code>SET key 1000000<\/code>）。<\/p>\n<p>流程：<\/p>\n<ol><li>fork 子进程，根据当前内存快照生成新 AOF（写临时文件）。<\/li><li>重写期间父进程把新写命令同时追加到 <strong>AOF rewrite buffer<\/strong>。<\/li><li>子进程完成后，父进程把 rewrite buffer 追加进新 AOF，<strong>rename 原子替换<\/strong>。<\/li><\/ol>\n<ul><li>触发：手动 <code>BGREWRITEAOF<\/code> 或 <code>auto-aof-rewrite-percentage 100<\/code>（AOF 增长 100%）+ <code>auto-aof-rewrite-min-size 64mb<\/code>。<\/li><li>注意：<strong>重写期间大量写入时，rewrite buffer 也可能膨胀<\/strong>。<\/li><\/ul>"}, {"q": "3.5 混合持久化（4.0+）", "tag": "进阶", "body": "<p><code>aof-use-rdb-preamble yes<\/code>（默认开启）：<\/p>\n<ul><li>AOF 重写后的文件 = <strong>RDB 快照 + 增量 AOF<\/strong>。<\/li><li>加载时先快速加载 RDB 部分，再回放增量命令。<\/li><li>✅ 兼得 RDB 的加载速度和 AOF 的丢数据窗口小；❌ 文件不再是纯文本，无法直接人肉编辑。<\/li><\/ul>"}, {"q": "3.6 RDB vs AOF 怎么选？恢复流程？", "tag": "高频", "body": "<table><thead><tr><th>维度<\/th><th>RDB<\/th><th>AOF<\/th><\/tr><\/thead><tbody><tr><td>文件<\/td><td>二进制快照<\/td><td>命令文本<\/td><\/tr><tr><td>大小<\/td><td>小<\/td><td>大（重写可缩小）<\/td><\/tr><tr><td>恢复速度<\/td><td>快<\/td><td>慢<\/td><\/tr><tr><td>丢数据<\/td><td>多<\/td><td>少（everysec 丢 1s）<\/td><\/tr><tr><td>适用<\/td><td>备份/灾备/冷启动<\/td><td>数据安全要求高<\/td><\/tr><\/tbody><\/table>\n<ul><li><strong>生产推荐<\/strong>：两者都开（AOF 保安全，RDB 做备份）；纯缓存场景可只开 RDB 甚至都不开。<\/li><li><strong>启动恢复<\/strong>：优先加载 <strong>AOF<\/strong>（数据更全），无 AOF 才加载 RDB。<\/li><li>文件损坏：AOF 用 <code>redis-check-aof --fix<\/code>，RDB 用 <code>redis-check-rdb<\/code>。<\/li><\/ul>"}, {"q": "3.7 fork 阻塞与持久化风险排查", "tag": "进阶", "body": "<ul><li><code>INFO stats<\/code> 看 <code>latest_fork_usec<\/code>；<code>INFO persistence<\/code> 看 rdb/aof 状态。<\/li><li>现象：fork 期间<strong>主线程停顿<\/strong>（大实例可达秒级），命令延迟飙升。<\/li><li>优化：<\/li><li>控制实例内存（单实例 ≤ 10GB 量级，或改用多实例）。<\/li><li>关闭 THP（透明大页），避免 COW 页分裂放大。<\/li><li>错峰 BGSAVE；主从都开持久化；从库开启 RDB 减少主库压力。<\/li><\/ul>\n<hr>"}]}, {"title": "04 过期删除与内存淘汰", "questions": [{"q": "4.1 过期键的删除策略", "tag": "高频", "body": "<p>Redis 采用 <strong>惰性删除 + 定期删除<\/strong> 结合：<\/p>\n<ul><li><strong>惰性删除<\/strong>：key 过期后不立即删，<strong>访问时才检查<\/strong>是否过期，过期则删。省 CPU，但过期 key 会残留占内存。<\/li><li><strong>定期删除<\/strong>：每 100ms 随机抽 <strong>20 个<\/strong>带过期时间的 key，删除其中过期的；若过期比例 > 25%，<strong>继续抽下一轮<\/strong>（每轮最多执行 1ms 限制，防阻塞）。<\/li><li>为什么不用定时器逐 key 删？key 太多，扫描成本高；纯惰性又占内存 → 两者互补。<\/li><\/ul>\n<blockquote>追问：CPU 与内存权衡——定期删除有 <code>hz<\/code> 配置（默认 10，即每秒 10 次任务循环）。<\/blockquote>"}, {"q": "4.2 过期键在主从复制 / 持久化中的特殊处理", "tag": "进阶", "body": "<ul><li><strong>主从<\/strong>：从库<strong>不主动删除<\/strong>过期 key（避免主从时钟不一致导致删错），等主库发 DEL 命令同步删除；但读从库时仍会按本地时间判断\"逻辑过期\"，返回 nil。<\/li><li><strong>RDB<\/strong>：生成时<strong>过滤已过期<\/strong>的 key；加载时（主库）忽略过期 key。<\/li><li><strong>AOF<\/strong>：删除时追加一条 DEL；AOF 重写时过滤过期 key。<\/li><\/ul>"}, {"q": "4.3 内存淘汰策略（maxmemory-policy）", "tag": "高频", "body": "<p><code>maxmemory<\/code> 达到上限后按策略淘汰：<\/p>\n<table><thead><tr><th>策略<\/th><th>作用范围<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>noeviction<\/td><td>-<\/td><td>不淘汰，写直接报错（默认，适合对一致性敏感的缓存）<\/td><\/tr><tr><td>allkeys-lru<\/td><td>所有 key<\/td><td>最近最少使用<\/td><\/tr><tr><td>allkeys-lfu<\/td><td>所有 key<\/td><td>最不经常使用（4.0+）<\/td><\/tr><tr><td>allkeys-random<\/td><td>所有 key<\/td><td>随机淘汰<\/td><\/tr><tr><td>volatile-lru<\/td><td><strong>设置了过期时间<\/strong>的 key<\/td><td>最常用<\/td><\/tr><tr><td>volatile-lfu<\/td><td>设置了过期时间的 key<\/td><td><\/td><\/tr><tr><td>volatile-random<\/td><td>设置了过期时间的 key<\/td><td><\/td><\/tr><tr><td>volatile-ttl<\/td><td>设置了过期时间的 key<\/td><td>剩余寿命最短的先淘汰<\/td><\/tr><\/tbody><\/table>\n<ul><li>无过期时间的 key 不受 volatile-* 影响（可能被\"饿死\"内存）。<\/li><li>缓存场景建议 <code>allkeys-lru<\/code>（或 lfu）；有明确 TTL 语义用 <code>volatile-lru<\/code>。<\/li><\/ul>"}, {"q": "4.4 LRU 与 LFU 的区别？Redis 为什么用\"近似 LRU\"？", "tag": "进阶", "body": "<ul><li><strong>LRU<\/strong>：按\"最近访问时间\"淘汰；问题：<strong>一次冷数据大量读取也能把热点挤出去<\/strong>（如全表扫描缓存），且维护精确时间成本高。<\/li><li><strong>LFU<\/strong>：按\"访问频率\"淘汰，兼顾频次与时间衰减（计数器随时间减半），更抗突发扫描。4.0 引入。<\/li><li><strong>近似 LRU<\/strong>：不维护全局链表，<strong>抽样 maxmemory-samples（默认 5）个 key<\/strong>，淘汰其中最久未用的。代价是精度略降，换来 O(1) 且无内存开销。<\/li><li>配置：<code>maxmemory-samples<\/code> 越大越接近精确 LRU，但淘汰耗时略增。<\/li><\/ul>"}, {"q": "4.5 淘汰是阻塞的吗？淘汰流程", "tag": "基础", "body": "<ul><li>近似 LRU/LFU：<strong>主线程内<\/strong>执行，但只抽样几个 key，耗时极小。<\/li><li>若剩余候选都不满足（无过期 key 且策略是 volatile-*），则<strong>不淘汰<\/strong>，写命令返回 OOM 错误。<\/li><li>大 key 淘汰删除也会阻塞 → Redis 4.0 起支持 <code>unlink<\/code>（异步删除），淘汰默认走异步删除通道（<code>lazyfree-lazy-eviction yes<\/code> 可配）。<\/li><\/ul>\n<hr>"}]}, {"title": "05 主从复制", "questions": [{"q": "5.1 主从复制的作用与拓扑", "tag": "基础", "body": "<ul><li>作用：<strong>读写分离<\/strong>（主写从读）、<strong>数据冗余<\/strong>、故障时从库晋升、为哨兵/集群提供基础。<\/li><li>拓扑：一主一从、一主多从、<strong>主从链<\/strong>（从库再挂从库，缓解主库全量同步压力）。<\/li><li>命令：<code>REPLICAOF host port<\/code>（7.0 前为 SLAVEOF）；取消：<code>REPLICAOF no one<\/code>。<\/li><li>复制是<strong>异步<\/strong>的：主库执行写命令后立即返回，通过传播给从库。<\/li><\/ul>"}, {"q": "5.2 全量复制的完整流程（PSYNC）", "tag": "高频", "body": "<p>触发：从库首次连接、或增量同步不可用（backlog 不够）。<\/p>\n<pre><code>从库 → 主库: PSYNC ? -1\n主库: 生成 replid，启动 BGSAVE，写入 repl backlog\n主库 → 从库: +FULLRESYNC &lt;replid&gt; &lt;offset&gt;\n主库: 发送 RDB 快照（期间新写命令进 backlog）\n主库 → 从库: 发送 backlog 中的增量命令\n从库: 清空旧数据 → 加载 RDB → 追加重放增量 → 建立连接持续收增量<\/code><\/pre>\n<p><strong>关键点<\/strong>：<\/p>\n<ul><li>同步期间从库<strong>清空自身数据<\/strong>，期间对外读可能返回空（<code>replica-serve-stale-data<\/code> 可配是否允许读旧数据）。<\/li><li>RDB 传输/加载阶段从库阻塞，大实例全量同步耗时可观。<\/li><li>主库 fork 做 BGSAVE 也有阻塞与内存翻倍风险（见 3.7）。<\/li><\/ul>"}, {"q": "5.3 增量复制与复制积压缓冲区（backlog）", "tag": "高频", "body": "<ul><li>断线重连后，从库发 <code>PSYNC <replid> <offset><\/code>。<\/li><li>主库检查 offset 是否仍在 <strong>repl_backlog<\/strong>（默认 1MB，环形缓冲区）内：<\/li><li>在 → <code>+CONTINUE<\/code>，只补发断线期间的增量命令。<\/li><li>不在（断线太久，数据被覆盖）→ <strong>退化为全量同步<\/strong>。<\/li><li>backlog 大小建议按 <code>重连耗时 × 每秒写量<\/code> 估算，太小的后果是频繁全量同步。<\/li><\/ul>\n<blockquote>追问：主从切换后如何继续增量？Redis 用 <strong>replid 与 replid2<\/strong>：主库切换后从库拿 replid2 匹配新主库，只要 backlog 里还有数据就能增量续传，避免全量。<\/blockquote>"}, {"q": "5.4 主从数据不一致与延迟怎么处理？", "tag": "进阶", "body": "<ul><li>根因：复制<strong>异步<\/strong>，从库有网络/加载延迟；<code>INFO replication<\/code> 可看 <code>master_repl_offset<\/code> 与从库 offset 差值。<\/li><li>缓解：<\/li><li><code>repl-disable-tcp-nodelay no<\/code>：小包立即发送（牺牲一点带宽换低延迟）。<\/li><li>从库本地读缓存写放大：<code>replica-read-only yes<\/code>（默认，从库只读）。<\/li><li><strong>强一致场景不要走 Redis 主从读<\/strong>：业务上对一致性敏感的操作必须打主库或加缓存版本号校验。<\/li><li>配置 <code>min-replicas-to-write<\/code> + <code>min-replicas-max-lag<\/code>：从库落后过多时主库<strong>拒绝写入<\/strong>（牺牲可用性换一致性）。<\/li><\/ul>"}, {"q": "5.5 读写分离有哪些坑？", "tag": "高频", "body": "<ol><li><strong>读到旧数据<\/strong>：主从延迟 → 刚写就读从库可能读不到 → 一致性敏感操作读主。<\/li><li><strong>从库宕机/延迟飙升<\/strong>：客户端要具备故障转移和延迟降级。<\/li><li><strong>缓存场景放大写放大<\/strong>：热点更新频繁时，把\"缓存更新\"也复制到从库，从库内存/CPU 白白翻倍。<\/li><li>主库 BGSAVE 全量同步期间，从库短暂不可服务。<\/li><li>只适合<strong>读多写少、容忍秒级延迟<\/strong>的业务。<\/li><\/ol>\n<hr>"}]}, {"title": "06 哨兵 Sentinel", "questions": [{"q": "6.1 Sentinel 解决什么问题？", "tag": "基础", "body": "<p>主从复制本身<strong>不能自动故障转移<\/strong>：主库挂了，从库不会自己上位，客户端也不知道新主是谁。<br>Sentinel（哨兵）提供：<\/p>\n<ol><li><strong>监控<\/strong>：持续检查主从健康。<\/li><li><strong>通知<\/strong>：故障通知运维/系统。<\/li><li><strong>自动故障转移<\/strong>：选从库晋升为新主，并让其他从库重新指向新主。<\/li><li><strong>配置中心<\/strong>：客户端通过哨兵拿当前主库地址。<\/li><\/ol>"}, {"q": "6.2 主观下线（sdown）与客观下线（odown）", "tag": "进阶", "body": "<ul><li><strong>主观下线 sdown<\/strong>：单个哨兵发现主库 <code>down-after-milliseconds<\/code> 内无响应（PING 超时），标记\"疑似下线\"。<\/li><li><strong>客观下线 odown<\/strong>：<strong>≥ quorum 个哨兵<\/strong>都认为主库 sdown，才确认主库真的挂了，进入故障转移。<\/li><li>防止<strong>网络分区误判<\/strong>：单哨兵可能因自身网络抖动误判，需要多哨兵\"投票\"确认。<\/li><\/ul>"}, {"q": "6.3 故障转移（failover）完整流程", "tag": "高频", "body": "<ol><li><strong>判定 odown<\/strong>：哨兵 A 发现主库 sdown，向其他哨兵广播\"我认为主库挂了\"，收到 ≥ quorum 个确认 → odown。<\/li><li><strong>选举 leader 哨兵<\/strong>：故障转移由<strong>一个哨兵<\/strong>执行。候选哨兵向其他哨兵要选票，<strong>获得半数以上（超过 quorum）<\/strong> 即成为 leader（Raft 类似算法）。每个哨兵一个配置纪元只能投一票。<\/li><li><strong>leader 选新主<\/strong>：筛选在线且数据最新的从库，按优先级排序：<\/li><\/ol>\n<ul><li><code>replica-priority<\/code> 越小越优先；<\/li><li>复制偏移量越大（数据越新）越优先；<\/li><li>再相同按 runid 字典序。<\/li><\/ul>\n<ol><li><strong>切换<\/strong>：向新主发送 <code>SLAVEOF NO ONE<\/code> → 其他从库 <code>SLAVEOF 新主<\/code> → 通知客户端更新主库地址 → 旧主恢复后变成新主的从库。<\/li><\/ol>\n<blockquote>加分点：Sentinel 至少部署 <strong>3 个<\/strong>（奇数）——quorum 机制要求多数派才能决策，2 个哨兵时恰好一个分区各占一个，谁都凑不齐 quorum，故障转移瘫痪。<\/blockquote>"}, {"q": "6.4 脑裂（split-brain）问题", "tag": "进阶", "body": "<p>脑裂场景：主库与哨兵网络隔离，但主库仍活着 → 哨兵选出新主 → 旧主继续接收写入 → 恢复后旧主降级为从库，<strong>这部分写入全部丢失<\/strong>。<\/p>\n<p>解决：<\/p>\n<ul><li><code>min-replicas-to-write 1<\/code> + <code>min-replicas-max-lag 10<\/code>：主库发现<strong>从库失联超过阈值就拒绝写入<\/strong>，把\"被隔离期间的写入\"挡在门外。<\/li><li>本质：用<strong>牺牲可用性换取一致性<\/strong>，丢失窗口被压缩到不可接受范围之外。<\/li><\/ul>"}, {"q": "6.5 客户端如何感知主从切换？", "tag": "基础", "body": "<ul><li>客户端先向哨兵查询：<code>SENTINEL get-master-addr-by-name <name><\/code>。<\/li><li>客户端订阅哨兵频道 <code>+switch-master<\/code> 事件，主库变更时自动刷新连接。<\/li><li>主流客户端（如 Jedis Sentinel / Lettuce / Redisson）内置此逻辑。<\/li><\/ul>\n<hr>"}]}, {"title": "07 集群 Cluster", "questions": [{"q": "7.1 Cluster 的槽位（slot）机制", "tag": "高频", "body": "<ul><li>数据分片：整个 key 空间划分为 <strong>16384 个槽<\/strong>，<code>slot = CRC16(key) % 16384<\/code>。<\/li><li>每个节点负责一段槽区间（<code>CLUSTER ADDSLOTS<\/code>），<strong>读写只路由到对应节点<\/strong>。<\/li><li>客户端缓存\"槽 → 节点\"映射表；连接错误节点时返回 <strong>MOVED<\/strong> 重定向。<\/li><li>每个主节点可挂从节点做高可用（哨兵逻辑内嵌）。<\/li><\/ul>"}, {"q": "7.2 为什么槽数量定 16384 而不是 65536？", "tag": "进阶", "body": "<p>官方解释（Redis 作者 antirez）：<\/p>\n<ol><li><strong>心跳包体积<\/strong>：节点间 gossip 用 <strong>bitmap 表示槽分布<\/strong>，16384 槽 = 2KB 的 bitmap；65536 槽 = 8KB，节点多时网络开销翻 4 倍。<\/li><li><strong>集群规模上限<\/strong>：16384 槽配合每节点承载上千槽，已足够支撑<strong>千节点级<\/strong>集群（实际生产几十上百节点）。<\/li><li><strong>设计权衡<\/strong>：槽是静态的，节点少时 65536 反而浪费；传输、计算成本都高于收益。<\/li><\/ol>"}, {"q": "7.3 MOVED 与 ASK 重定向的区别", "tag": "高频", "body": "<ul><li><strong>MOVED<\/strong>：槽<strong>已经<\/strong>迁移完成，目标节点明确。客户端收到后<strong>更新本地槽映射缓存<\/strong>，下次直连新节点（持久性）。<\/li><li><strong>ASK<\/strong>：槽<strong>正在迁移<\/strong>中（源节点只剩部分 key，目标节点已有部分 key）。仅对<strong>当前请求<\/strong>临时重定向，客户端<strong>不更新<\/strong>缓存（一次性）。<\/li><li>两者都是返回给客户端的错误/提示，客户端需正确处理并重试。<\/li><\/ul>"}, {"q": "7.4 集群节点间通信：gossip 协议", "tag": "进阶", "body": "<ul><li>节点间用独立的 <strong>集群总线端口（16379）<\/strong>，与客户端端口（6379）分离。<\/li><li>每个节点定期与其他节点交换状态：<code>MEET<\/code>（握手加入）、<code>PING/PONG<\/code>（心跳 + 携带节点状态信息）。<\/li><li>通过 gossip 传播：节点故障检测、槽分配变更、配置纪元。<\/li><li>故障判定类似哨兵：<strong>半数以上主节点<\/strong>认为某节点不可达 → 标记 FAIL，触发从节点提升。<\/li><\/ul>"}, {"q": "7.5 扩容/缩容与数据迁移", "tag": "进阶", "body": "<ul><li>新增节点：<code>CLUSTER MEET<\/code> 加入集群 → <code>CLUSTER RESHARD<\/code> 从其他节点<strong>迁槽<\/strong>。<\/li><li>迁移以 <strong>slot 为粒度、key 为单位<\/strong>：源节点对目标节点执行 <code>MIGRATE<\/code> 命令，逐 key 搬运。<\/li><li>迁移中该槽处于 <strong>migrating/importing<\/strong> 状态 → 客户端访问触发 ASK 逻辑。<\/li><li>缩容：迁走节点的所有槽后 <code>CLUSTER FORGET<\/code> 移除。<\/li><\/ul>\n<blockquote>加分点：<code>cluster-require-full-coverage<\/code>（默认 yes）：部分槽没有节点覆盖时整个集群拒绝服务；改为 no 可让集群降级可用（部分数据访问失败）。<\/blockquote>"}, {"q": "7.6 Cluster 的使用限制与踩坑", "tag": "高频", "body": "<ol><li><strong>多键操作必须同槽<\/strong>：MSET、Lua、事务涉及多个 key 时，必须用 <strong>hash tag<\/strong>（<code>{user1001}:cart<\/code> 按 <code>{}<\/code> 内内容算槽）保证落在同一节点。<\/li><li><strong>不支持跨节点事务<\/strong>。<\/li><li><strong>pipeline 跨节点会被打散<\/strong>，需按节点分组发送。<\/li><li>只有 <strong>db0<\/strong>。<\/li><li>小数据量别上集群：单机 10 万 QPS 足够时，集群反而引入路由、迁移、运维复杂度。<\/li><\/ol>\n<hr>"}]}, {"title": "08 缓存三大问题与一致性", "questions": [{"q": "8.1 缓存穿透（cache penetration）", "tag": "高频", "body": "<p><strong>现象<\/strong>：查询一个<strong>必然不存在<\/strong>的数据，缓存和数据库都查不到 → 每次请求都打数据库，DB 压力被放大。<\/p>\n<p><strong>原因<\/strong>：恶意攻击或代码漏洞，构造大量不存在的 key。<\/p>\n<p><strong>解决<\/strong>：<\/p>\n<ol><li><strong>缓存空值<\/strong>：查不到也缓存 <code>key → null<\/code>，TTL 设短（如 5 分钟），并加<strong>随机<\/strong>防止同时失效。<\/li><li><strong>布隆过滤器<\/strong>：请求先过布隆，判定\"一定不存在\"直接拒绝，不查缓存和 DB。<\/li><li>接口层<strong>参数校验<\/strong>：非法 ID（负数、超范围）直接拦截。<\/li><li>监控空值命中率异常波动。<\/li><\/ol>"}, {"q": "8.2 缓存击穿（cache breakdown / hot key expire）", "tag": "高频", "body": "<p><strong>现象<\/strong>：<strong>某一个热点 key<\/strong> 在过期瞬间，大量并发请求同时打到 DB。<\/p>\n<p><strong>解决<\/strong>：<\/p>\n<ol><li><strong>互斥锁<\/strong>：缓存失效后，只有一个线程去查 DB 重建缓存，其余线程等待或返回旧值（注意死锁与超时）。<\/li><li><strong>逻辑过期<\/strong>：value 里存逻辑过期时间，过期后<strong>异步<\/strong>重建缓存，请求先返回旧数据——不阻塞读。<\/li><li><strong>热点永不过期<\/strong>：后台定时刷新（不设物理过期，用逻辑过期控制）。<\/li><li>热点 key 预热 + 多副本分散。<\/li><\/ol>"}, {"q": "8.3 缓存雪崩（cache avalanche）", "tag": "高频", "body": "<p><strong>现象<\/strong>：<\/p>\n<ul><li>大量 key <strong>同一时刻过期<\/strong> → 同时打 DB；<\/li><li>或 Redis <strong>整体宕机<\/strong> → 请求全部打到 DB，DB 被压垮。<\/li><\/ul>\n<p><strong>解决<\/strong>：<\/p>\n<ol><li><strong>过期时间加随机<\/strong>：基础 TTL + random(0~300s)，避免集中失效。<\/li><li><strong>多级缓存<\/strong>：本地缓存（Caffeine）+ Redis，Redis 挂了本地还能扛。<\/li><li><strong>Redis 高可用<\/strong>：主从 + 哨兵 + 集群，避免单点宕机。<\/li><li><strong>限流降级<\/strong>：DB 侧限流、熔断、降级返回兜底数据。<\/li><li><strong>提前预热<\/strong>：大促前把热点数据刷进缓存并分散过期时间。<\/li><\/ol>"}, {"q": "8.4 缓存与数据库一致性方案", "tag": "高频", "body": "<p>主流方案 <strong>Cache Aside<\/strong>（旁路缓存）：<\/p>\n<ul><li>读：先读缓存，未命中读 DB → 写回缓存。<\/li><li>写：<strong>先更新 DB，再删除缓存<\/strong>（不是更新缓存）。<\/li><\/ul>\n<p>为什么\"先删缓存再更新 DB\"不行：删除后、更新 DB 前，并发读会把<strong>旧值<\/strong>写回缓存 → 缓存里长期是脏数据。<br>为什么\"更新缓存\"不行：写频繁时缓存被反复无效更新，且与 DB 更新非原子。<\/p>\n<p><strong>一致性增强<\/strong>：<\/p>\n<ol><li><strong>延迟双删<\/strong>：更新 DB 后删缓存，等 ~1s 再删一次，兜住中间窗口的脏回写。<\/li><li><strong>binlog 订阅（canal）<\/strong>：应用只写 DB，canal 监听 binlog 异步删缓存——<strong>解耦、可靠、主流<\/strong>。<\/li><li><strong>版本号/时间戳<\/strong>：缓存带 version，回写时校验，旧的写不进去。<\/li><\/ol>\n<blockquote>结论：缓存一致性只能做到<strong>最终一致<\/strong>；强一致场景不应依赖缓存（直接读 DB 或用分布式事务）。<\/blockquote>"}, {"q": "8.5 缓存粒度与更新策略选型", "tag": "进阶", "body": "<ul><li><strong>缓存粒度<\/strong>：对象级（整个 user 对象）vs 字段级。对象级实现简单、命中率高；字段级内存省但逻辑复杂。一般<strong>对象级 + 序列化<\/strong>。<\/li><li><strong>写策略对比<\/strong>：<\/li><li>Cache Aside：实现简单，适合读多写少。<\/li><li>Write Through / Write Behind：强一致/异步写回，实现复杂，Redis 场景少用。<\/li><li><strong>缓存命中率目标<\/strong>：> 95%，用 <code>INFO stats<\/code> 的 <code>keyspace_hits/keyspace_misses<\/code> 监控。<\/li><\/ul>\n<hr>"}]}, {"title": "09 事务与 Lua", "questions": [{"q": "9.1 Redis 事务的组成与原理", "tag": "高频", "body": "<p>命令：<code>MULTI<\/code>（开启）→ 命令<strong>入队<\/strong>（不执行）→ <code>EXEC<\/code>（批量执行）/ <code>DISCARD<\/code>（取消）。<\/p>\n<ul><li><strong>原子性<\/strong>：EXEC 时队列中命令<strong>连续执行完<\/strong>，期间不穿插其他客户端的命令（单线程 + 整体执行）。<\/li><li><strong>WATCH<\/strong>：乐观锁。WATCH 的 key 在 EXEC 前被其他客户端修改，则 <strong>EXEC 直接返回空<\/strong>（事务作废），配合重试实现 CAS。<\/li><li>隔离性：事务执行期间<strong>不会被其他命令打断<\/strong> → 天然串行。<\/li><\/ul>\n<blockquote>加分点：Redis 事务更像\"批量执行 + 乐观锁\"，而不是关系数据库的事务——它没有回滚、没有隔离级别概念。<\/blockquote>"}, {"q": "9.2 Redis 事务为什么不支持回滚？", "tag": "进阶", "body": "<p>官方设计取舍：<\/p>\n<ol><li>命令错误在<strong>入队阶段<\/strong>就能发现（语法错误/命令不存在），此时<strong>整批拒绝<\/strong>，不存在\"执行到一半失败\"的语法问题。<\/li><li>运行时错误（如对 String 执行 LPUSH）本质是<strong>编程错误<\/strong>，回滚也无法恢复业务语义。<\/li><li>回滚会增加实现复杂度，违背 Redis\"简单高效\"的哲学。<\/li><\/ol>\n<ul><li>注意：EXEC 时某条命令运行失败，<strong>其他命令照常执行<\/strong>，不会整体回滚。<\/li><\/ul>"}, {"q": "9.3 Lua 脚本：为什么能保证原子性？", "tag": "高频", "body": "<p>Redis 2.6 引入 Lua：<code>EVAL script numkeys key... arg...<\/code>。<\/p>\n<ul><li><strong>原子性<\/strong>：Lua 脚本在<strong>服务端一次性执行<\/strong>，执行期间 Redis 不处理任何其他命令 → 读改写无竞态。<\/li><li><strong>减少网络往返<\/strong>：复杂逻辑一次 RTT 完成。<\/li><li><strong>典型应用<\/strong>：秒杀扣库存（GET → 判断 → DECR）、分布式锁续期、限流计数。<\/li><li>脚本可以用 <code>redis.call()<\/code> / <code>redis.pcall()<\/code> 调用命令；<code>redis.call<\/code> 出错会中断脚本。<\/li><\/ul>\n<blockquote>追问：Lua 与事务的区别？事务=命令批量排队执行，无逻辑判断；Lua=在服务端<strong>执行一段程序<\/strong>，可读改写、可判断，原子性更强更灵活。7.0 的 <strong>Redis Functions<\/strong> 可把 Lua 函数化部署管理，替代 EVAL 散落的脚本。<\/blockquote>"}, {"q": "9.4 pipeline 与事务、Lua 的区别", "tag": "基础", "body": "<ul><li><strong>pipeline<\/strong>：客户端<strong>批量发送命令<\/strong>减少 RTT，<strong>不保证原子<\/strong>（命令之间可能插入其他请求）。<\/li><li><strong>事务<\/strong>：服务端排队 + EXEC 原子执行，但不减少\"入队\"那次的 RTT 开销。<\/li><li><strong>Lua<\/strong>：服务端执行，既原子又少 RTT，是三者中\"功能最强\"的。<\/li><li>组合用法：<code>pipeline + 多条独立命令<\/code> 提升吞吐；关键一致性操作用 Lua。<\/li><\/ul>\n<hr>"}]}, {"title": "10 分布式锁", "questions": [{"q": "10.1 分布式锁的基本实现", "tag": "高频", "body": "<p>最简：<code>SET lock:order key value NX PX 30000<\/code><\/p>\n<ul><li><strong>NX<\/strong>：key 不存在才设置成功（互斥）。<\/li><li><strong>PX<\/strong>：自动过期，防死锁（加锁进程崩溃也不怕）。<\/li><li>一定要 <strong>SET 一条命令原子完成<\/strong>，不能用 <code>SETNX + EXPIRE<\/code> 两步（中间崩溃就死锁）。<\/li><\/ul>\n<p>value 存什么？<strong>客户端唯一标识<\/strong>（UUID/请求 ID），用于解锁时校验\"只能解自己的锁\"。<\/p>"}, {"q": "10.2 误删锁与安全解锁", "tag": "高频", "body": "<p><strong>问题<\/strong>：A 拿到锁，业务执行超时，锁自动过期；B 拿到锁；A 执行完去 DEL，把 <strong>B 的锁删了<\/strong> → 互斥失效。<\/p>\n<p><strong>解决<\/strong>：解锁前<strong>校验 value 是自己的<\/strong>，且校验+删除必须原子（Lua）：<\/p>\n<pre><code class=\"lang-lua\">-- KEYS[1]=lock key, ARGV[1]=clientId\nif redis.call(\"get\", KEYS[1]) == ARGV[1] then\n  return redis.call(\"del\", KEYS[1])\nelse\n  return 0\nend<\/code><\/pre>"}, {"q": "10.3 Redisson 看门狗（WatchDog）续期机制", "tag": "进阶", "body": "<ul><li>默认锁有效期 <strong>30 秒<\/strong>；持有锁的线程业务没执行完怎么办？<\/li><li>Redisson 启动一个<strong>后台定时任务（看门狗）<\/strong>：锁剩余时间 < 1/3 有效期时自动<strong>续期到 30s<\/strong>，直到业务显式解锁。<\/li><li>客户端崩溃 → 看门狗随进程消失 → 锁到期自动释放，不会死锁。<\/li><li>实现基于 Lua（可重入 Hash + 过期 + 续期）。<\/li><\/ul>"}, {"q": "10.4 RedLock 多节点锁与争议", "tag": "进阶", "body": "<p><strong>背景<\/strong>：单主 Redis 锁在<strong>主从切换<\/strong>时会丢：A 在旧主加锁 → 旧主没同步就挂了 → 新主没有锁记录 → B 也能加锁成功 → 互斥失效。<\/p>\n<p><strong>RedLock 思想<\/strong>：在 <strong>N 个独立 Redis 节点<\/strong>（通常 5）上都加锁，<strong>成功 ≥ N/2+1 个<\/strong>才算持有。<\/p>\n<ul><li>用途：对一致性要求极高（如金融扣款、幂等控制）时。<\/li><li><strong>争议（Martin Kleppmann vs antirez）<\/strong>：<\/li><li>Kleppmann：RedLock 依赖时钟，GC 停顿/时钟跳跃仍可能破功；分布式锁的正确姿势是 <strong>Fencing token<\/strong>（锁携带单调递增令牌，写入时校验，旧令牌拒绝）。<\/li><li>antirez：工程上 RedLock 已足够，配合足够短的有效期，可把风险降到可接受。<\/li><li>实践结论：<strong>绝大多数业务用单节点 Redis 锁 + 看门狗就够<\/strong>；要绝对安全请用 <strong>ZooKeeper/etcd<\/strong>（顺序节点 + 会话超时）或带 fencing token 的落库校验。<\/li><\/ul>"}, {"q": "10.5 分布式锁还有哪些细节考点？", "tag": "进阶", "body": "<ol><li><strong>可重入<\/strong>：同一线程重复加锁不阻塞（Redisson 用 Hash：field=线程 ID，计数 +1）。<\/li><li><strong>锁粒度<\/strong>：尽量<strong>细<\/strong>（按订单/用户维度），避免全局一把锁拖垮并发。<\/li><li><strong>加锁失败处理<\/strong>：自旋重试（带超时上限）或快速失败返回。<\/li><li><strong>业务执行时间 > 锁有效期<\/strong>：看门狗续期，或预估最长执行时间设置合理 PX。<\/li><li><strong>等锁时间与最大持有时间<\/strong>分开设置，防线程池耗尽。<\/li><li>锁与业务操作同一事务边界，避免\"加锁后 DB 操作失败锁不释放\"。<\/li><\/ol>\n<hr>"}]}, {"title": "11 高性能机制", "questions": [{"q": "11.1 Redis 为什么是单线程模型？单线程为什么还这么快？", "tag": "高频", "body": "<p>Redis 命令执行是<strong>单线程<\/strong>（网络 IO 与命令处理主体为单线程；6.0 起网络 IO 可多线程）。<\/p>\n<p><strong>为什么快<\/strong>：<\/p>\n<ol><li><strong>纯内存操作<\/strong>：数据都在内存，无磁盘 IO（持久化异步）。<\/li><li><strong>单线程避免上下文切换与锁竞争<\/strong>：无锁、无竞态，天然原子。<\/li><li><strong>IO 多路复用<\/strong>：epoll 监听大量连接，非阻塞处理网络。<\/li><li><strong>高效数据结构<\/strong>：SDS、跳表、压缩结构针对场景优化。<\/li><li><strong>代码路径短<\/strong>：核心命令都是简单 C 实现，无复杂调度。<\/li><\/ol>\n<p><strong>为什么坚持单线程<\/strong>：<\/p>\n<ul><li>多线程带来的<strong>锁竞争、上下文切换、缓存失效<\/strong>开销可能大于收益；<\/li><li>单线程让<strong>原子性<\/strong>天然成立（事务/Lua/分布式锁都受益）；<\/li><li>瓶颈在内存与网络带宽，不在 CPU。<\/li><\/ul>"}, {"q": "11.2 IO 多路复用：select / poll / epoll", "tag": "进阶", "body": "<ul><li>Redis 通过 <strong>aeEventLoop<\/strong> 封装 epoll（Linux）/kqueue（macOS）/select（兜底）。<\/li><li><strong>epoll 优势<\/strong>：<code>epoll_create<\/code> + 内核事件表；<strong>O(1)<\/strong> 获取就绪事件（select/poll 是 O(n) 扫描）；水平触发/边缘触发；避免每次调用重新拷贝 fd 集合。<\/li><li>Redis 对每个事件：读事件 → 解析命令 → 执行 → 写事件回包。<\/li><li>单线程事件循环让<strong>上万个连接<\/strong>共享一个线程而不互相阻塞。<\/li><\/ul>"}, {"q": "11.3 文件事件与时间事件", "tag": "进阶", "body": "<ul><li><strong>文件事件<\/strong>：客户端连接/读写就绪，回调处理。<\/li><li><strong>时间事件<\/strong>：定期任务（<code>serverCron<\/code>，每 100ms）——过期键清理、AOF 刷盘、主从心跳、统计信息、集群检查等。<\/li><li>事件循环：优先处理文件事件，时间事件按到期时间执行，两者共享单线程。<\/li><\/ul>"}, {"q": "11.4 Redis 6.0 引入多线程 IO，为什么？", "tag": "进阶", "body": "<p>背景：<strong>瓶颈不在 CPU，而在网络读写（read/write 系统调用 + 协议解析的 memcpy）<\/strong>，大流量时单线程处理网络 IO 成为瓶颈。<\/p>\n<p>6.0 方案：<\/p>\n<ul><li>默认<strong>关闭<\/strong>；<code>io-threads 4<\/code>、<code>io-threads-do-reads yes<\/code> 开启。<\/li><li><strong>读/写 socket 用多个 IO 线程并行<\/strong>（把数据从内核缓冲搬入/搬出），<strong>命令执行仍由主线程串行<\/strong> → 保持原子性与无锁。<\/li><li>收益：网络吞吐提升明显（尤其多客户端、大 value）；对纯计算型负载无增益。<\/li><\/ul>\n<blockquote>加分点：Redis 7.0 继续优化：共享 IO 线程任务、减少锁竞争；7.2 引入异步 socket 写等。<strong>永远记住：执行模型仍是单线程<\/strong>，这是所有原子性保证的根基。<\/blockquote>"}, {"q": "11.5 慢查询与延迟排查", "tag": "进阶", "body": "<ul><li>慢日志：<code>slowlog-log-slower-than 10000<\/code>（微秒，默认 10ms）、<code>slowlog-max-len 128<\/code>；<code>SLOWLOG GET<\/code> 查看。<\/li><li>常见慢命令：<code>KEYS *<\/code>（全量扫描，O(N) 阻塞）→ 用 <strong>SCAN<\/strong> 游标迭代替代；<code>SMEMBERS<\/code>/<code>HGETALL<\/code>/<code>LRANGE<\/code> 大集合；<code>SORT<\/code>；大 value 的 GET/SET。<\/li><li>延迟监控：<code>redis-cli --latency<\/code>、<code>INFO commandstats<\/code>（各命令耗时统计）、<code>latency monitor<\/code>。<\/li><li>排查顺序：慢日志 → 大 key（--bigkeys）→ 网络/内核参数 → fork/持久化阻塞 → 内存碎片。<\/li><\/ul>\n<hr>"}]}, {"title": "12 大 Key / 热 Key / 内存治理", "questions": [{"q": "12.1 大 Key 的危害与发现", "tag": "高频", "body": "<p><strong>定义<\/strong>（经验值）：String value > 10KB；集合元素 > 5000 个或整体 > 10KB。<\/p>\n<p><strong>危害<\/strong>：<\/p>\n<ol><li><strong>阻塞<\/strong>：删除（DEL）、序列化（SAVE/迁移）、HGETALL 等耗时飙升，阻塞主线程。<\/li><li><strong>网络<\/strong>：一次大 value 传输占用带宽、拖慢其他命令。<\/li><li><strong>内存<\/strong>：倾斜（分片不均）、内存碎片。<\/li><\/ol>\n<p><strong>发现<\/strong>：<\/p>\n<ul><li><code>redis-cli --bigkeys<\/code>（按类型抽样扫描）。<\/li><li><code>MEMORY USAGE key<\/code> 精确查看单个 key 内存。<\/li><li>SCAN + 类型命令（LLEN/SCARD/HLEN/STRLEN）自研巡检脚本。<\/li><li>结合监控：节点内存不均、慢查询命令为集合类时重点怀疑。<\/li><\/ul>"}, {"q": "12.2 大 Key 怎么治理？", "tag": "进阶", "body": "<ol><li><strong>拆分<\/strong>：大 value 拆成多个小 key（如 hash 按字段拆、list 按页拆），或大集合拆多个。<\/li><li><strong>压缩/降级<\/strong>：大对象压缩后存储；图片等二进制放 OSS，Redis 只存 URL。<\/li><li><strong>异步删除<\/strong>：<code>UNLINK key<\/code>（4.0+，后台线程回收），或开启 <code>lazyfree-lazy-*<\/code> 系列配置，DEL 自动异步化。<\/li><li><strong>避免产生<\/strong>：写库层限制单 key 大小、定期清理过期大集合（<code>EXPIRE<\/code> + 后台扫描）。<\/li><\/ol>"}, {"q": "12.3 热 Key 的发现与处理", "tag": "高频", "body": "<p><strong>发现<\/strong>：<\/p>\n<ul><li>客户端本地计数（访问频率最高的 key 上报）。<\/li><li><code>redis-cli --hotkeys<\/code>（需开启 LFU 策略）。<\/li><li><code>MONITOR<\/code> 抽样（线上慎用，有性能开销）。<\/li><li>代理层（如 Codis/Twemproxy/自研网关）统计。<\/li><\/ul>\n<p><strong>处理<\/strong>：<\/p>\n<ol><li><strong>本地缓存<\/strong>（Caffeine）：热 key 直接命中 JVM，Redis 只做兜底——最有效。<\/li><li><strong>多副本 / 读写分离<\/strong>：热 key 拆成 <code>key:0<\/code>~<code>key:N<\/code> 多个副本分散到不同节点，读随机选一个。<\/li><li><strong>热点限流<\/strong>：对单 key 访问频率限流，保护下游。<\/li><li>避免把全部流量打到单节点（集群下热 key 所在节点会成为瓶颈）。<\/li><\/ol>"}, {"q": "12.4 内存碎片与内存分析", "tag": "进阶", "body": "<ul><li><code>INFO memory<\/code>：<code>used_memory<\/code>（数据）、<code>used_memory_rss<\/code>（进程实际占用）、<code>mem_fragmentation_ratio<\/code>（RSS/used，>1.5 表示碎片高）。<\/li><li>碎片来源：频繁增删改、大 key 删除后空间未归还。<\/li><li>处理：<code>CONFIG SET activedefrag yes<\/code>（自动整理）；重启（不推荐）；<code>MEMORY PURGE<\/code>（整理 jemalloc 缓存）。<\/li><li>内存分析工具：<code>redis-rdb-tools<\/code>（rdb 转 CSV 分析各 key 占用）、<code>MEMORY DOCTOR<\/code> 诊断。<\/li><\/ul>\n<hr>"}]}, {"title": "13 高频场景题", "questions": [{"q": "13.1 秒杀系统如何防超卖？", "tag": "高频", "body": "<p>链路：<strong>限流 → 预扣库存 → 异步下单 → 对账回补<\/strong>。<\/p>\n<ul><li><strong>Lua 原子预扣<\/strong>（关键）：<\/li><\/ul>\n<pre><code class=\"lang-lua\">-- KEYS[1]=stock:sku, ARGV[1]=userId\nlocal stock = tonumber(redis.call(\"get\", KEYS[1]) or 0)\nif stock &lt;= 0 then return 0 end\nredis.call(\"decr\", KEYS[1])\nredis.call(\"sadd\", \"users:\" .. KEYS[1], ARGV[1])  -- 幂等：一人一单\nreturn 1<\/code><\/pre>\n<ul><li>预扣成功 → 发 MQ 异步下单（削峰）→ DB 幂等兜底（订单号唯一索引）。<\/li><li><strong>回补<\/strong>：订单超时未支付/取消 → 库存 +1（同样走 Lua）。<\/li><li><strong>防超卖本质<\/strong>：把\"读-判断-写\"变成<strong>原子条件更新<\/strong>，杜绝并发窗口。<\/li><\/ul>"}, {"q": "13.2 排行榜怎么实现？", "tag": "高频", "body": "<p>ZSet：<code>ZADD rank:game1 100 userA<\/code>，分数即分值。<\/p>\n<ul><li>实时更新：<code>ZINCRBY rank:game1 10 userA<\/code>。<\/li><li>TopN：<code>ZREVRANGE rank:game1 0 99 WITHSCORES<\/code>（O(logN+M)）。<\/li><li>排名：<code>ZREVRANK<\/code>；同分排序规则：ZREVRANGEBYSCORE 按成员字典序。<\/li><li>分页：<code>ZREVRANGE WITHSCORES<\/code> 配合 limit。<\/li><li>千万级用户也毫无压力（skiplist 保证 O(logN)）。<\/li><\/ul>"}, {"q": "13.3 用 Redis 实现消息队列", "tag": "高频", "body": "<p>三种方案对比：<\/p>\n<table><thead><tr><th>方案<\/th><th>可靠性<\/th><th>消费者组<\/th><th>适用<\/th><\/tr><\/thead><tbody><tr><td>List（LPUSH+BRPOP）<\/td><td>一般（BRPOPLPUSH 可确认）<\/td><td>无<\/td><td>简单任务队列<\/td><\/tr><tr><td>PubSub<\/td><td><strong>不持久<\/strong>（发布即焚，离线收不到）<\/td><td>无<\/td><td>实时广播/通知<\/td><\/tr><tr><td>Stream（5.0+）<\/td><td>持久化 + ACK + Pending<\/td><td>✅<\/td><td>生产级轻量 MQ<\/td><\/tr><\/tbody><\/table>\n<p>Stream 关键概念：<code>XADD<\/code>（追加消息）、<code>XREADGROUP<\/code>（消费者组消费）、<code>XACK<\/code>（确认）、<code>XPENDING<\/code>（未确认列表）、死信处理 <code>XCLAIM<\/code>。<\/p>\n<blockquote>加分点：Stream + 消费者组 + Pending + ACK，可以做到\"至少一次\"投递；业务要求强顺序/事务性时仍建议专业 MQ（Kafka/RocketMQ）。<\/blockquote>"}, {"q": "13.4 分布式限流方案", "tag": "高频", "body": "<ul><li><strong>固定窗口<\/strong>：<code>INCR key<\/code> + 首次 <code>EXPIRE<\/code>（简单，有临界突刺问题：窗口交界可双倍流量）。<\/li><li><strong>滑动窗口<\/strong>：ZSet 记录时间戳，<code>ZREMRANGEBYSCORE<\/code> 清窗口外 + <code>ZCARD<\/code> 计数（精确，内存随请求量增长）。<\/li><li><strong>令牌桶（Lua 原子实现）<\/strong>：按速率补令牌，突发可控，最常用：<\/li><\/ul>\n<pre><code class=\"lang-lua\">-- KEYS[1]=bucket, ARGV[1]=capacity, ARGV[2]=rate, ARGV[3]=now\nlocal t = tonumber(redis.call(\"get\", KEYS[1] .. \":ts\") or ARGV[3])\nlocal tokens = tonumber(redis.call(\"get\", KEYS[1] .. \":tk\") or ARGV[1])\ntokens = math.min(tonumber(ARGV[1]), tokens + (tonumber(ARGV[3]) - t) * tonumber(ARGV[2]))\nredis.call(\"set\", KEYS[1] .. \":ts\", ARGV[3])\nif tokens &lt; 1 then return 0 end\nredis.call(\"set\", KEYS[1] .. \":tk\", tokens - 1)\nreturn 1<\/code><\/pre>\n<ul><li>网关层（Nginx + Lua / Sentinel）做全局限流，应用层做业务维度限流。<\/li><\/ul>"}, {"q": "13.5 布隆过滤器", "tag": "进阶", "body": "<p>原理：bitmap + k 个 hash 函数。写入把 k 个位全置 1；查询 k 个位<strong>不全为 1 → 一定不存在<\/strong>；全为 1 → <strong>可能存在<\/strong>（有误判率）。<\/p>\n<ul><li>误判率公式：<code>p ≈ (1 - e^(-kn/m))^k<\/code>，m=位数组大小，n=元素数，k=hash 数。<\/li><li>支持<strong>删除<\/strong>的变体：Counting Bloom Filter（计数位）。<\/li><li>Redis 原生 bitmap 可手写；生产用模块 <strong>RedisBloom<\/strong>（支持 BF.ADD / BF.EXISTS，含误判率参数）。<\/li><li>应用：缓存穿透防护、黑名单、爬虫去重、推荐系统去重。<\/li><\/ul>"}, {"q": "13.6 附近的人 GEO", "tag": "基础", "body": "<ul><li>存：<code>GEOADD city:users 116.39 39.90 userId<\/code>（底层 ZSet，score=GeoHash 编码）。<\/li><li>查：<code>GEORADIUS city:users 116.39 39.90 5 km WITHDIST<\/code>（5 公里内，带距离）。<\/li><li><code>GEOSEARCH<\/code>（6.2+）支持更灵活的范围/形状查询。<\/li><li>注意：GEO 精确度约米级（GeoHash 球面编码），足够 LBS 场景；高精度需求需专业地理位置服务。<\/li><\/ul>"}, {"q": "13.7 签到与 Bitmap", "tag": "基础", "body": "<ul><li>签到：<code>SETBIT sign:2026-08 userId 1<\/code>（按年/月建 key，bit 位=日期）。<\/li><li>查询连续签到：<code>BITFIELD GET u31 0<\/code>（取 31 位）→ 位运算数末尾连续 1。<\/li><li>统计本月签到天数：<code>BITCOUNT sign:2026-08<\/code>。<\/li><li>优点：<strong>一个用户一年才 365bit≈46 字节<\/strong>，千万用户也只需几十 MB。<\/li><\/ul>"}, {"q": "13.8 UV 统计 HyperLogLog", "tag": "基础", "body": "<ul><li><code>PFADD page:uv:0815 userA userB ...<\/code>，<code>PFCOUNT<\/code> 得基数。<\/li><li>内存固定 ~12KB（无论统计多少），误差约 0.81%，<strong>无法回读具体用户<\/strong>。<\/li><li>适用：UV、独立访客、搜索词去重等只关心\"有多少个不同值\"的场景。<\/li><li>精确统计小规模（如 <1000）用 Set；超大规模用 HLL 近似。<\/li><\/ul>"}, {"q": "13.9 延迟队列（定时任务）", "tag": "进阶", "body": "<p>方案：<strong>ZSet，score = 下次执行时间戳<\/strong>。<\/p>\n<ul><li>入队：<code>ZADD delay_queue now+5s taskId<\/code>。<\/li><li>消费（轮询 + 重投）：<\/li><\/ul>\n<pre><code class=\"lang-lua\">local item = redis.call(\"zrangebyscore\", KEYS[1], 0, ARGV[1], \"limit\", 0, 1)\nif item[1] then\n  redis.call(\"zrem\", KEYS[1], item[1])   -- 原子取出：先查再删（lua 保证）\n  return item[1]\nend<\/code><\/pre>\n<ul><li>到期任务投递到工作队列（List/Stream）异步执行；执行失败重新入队（带重试次数）。<\/li><li>应用：订单超时关闭、优惠券到期提醒、异步对账。<\/li><\/ul>\n<blockquote>加分点：多消费者竞争时用 Lua 保证\"取出+删除\"原子，避免重复消费；或用 Stream 的 <code>XREADGROUP + XACK<\/code> 更稳。<\/blockquote>\n<hr>"}]}, {"title": "14 进阶与生态", "questions": [{"q": "14.1 Redis vs Memcached", "tag": "高频", "body": "<table><thead><tr><th>维度<\/th><th>Redis<\/th><th>Memcached<\/th><\/tr><\/thead><tbody><tr><td>数据类型<\/td><td>5 大类型 + 高级类型<\/td><td>仅 String<\/td><\/tr><tr><td>持久化<\/td><td>RDB / AOF<\/td><td>无<\/td><\/tr><tr><td>集群<\/td><td>Cluster 原生分片<\/td><td>客户端分片（一致性哈希）<\/td><\/tr><tr><td>线程模型<\/td><td>单线程事件循环<\/td><td>多线程<\/td><\/tr><tr><td>内存管理<\/td><td>jemalloc + 多种编码优化<\/td><td>slab 分配<\/td><\/tr><tr><td>功能<\/td><td>事务/Lua/发布订阅/Stream/分布式锁<\/td><td>纯缓存<\/td><\/tr><tr><td>适用<\/td><td>缓存 + 业务逻辑 + 中间件<\/td><td>极简 KV 缓存<\/td><\/tr><\/tbody><\/table>\n<p>结论：Redis 功能全面替代 Memcached；Memcached 仅在\"极致简单、多线程大吞吐\"的纯缓存场景还有价值。<\/p>"}, {"q": "14.2 Redis vs 本地缓存（Caffeine/Guava）", "tag": "进阶", "body": "<table><thead><tr><th>维度<\/th><th>本地缓存<\/th><th>Redis<\/th><\/tr><\/thead><tbody><tr><td>访问速度<\/td><td>纳秒级（JVM 堆内）<\/td><td>微秒级（网络 RTT）<\/td><\/tr><tr><td>一致性<\/td><td>多实例各自为政，容易不一致<\/td><td>全局唯一<\/td><\/tr><tr><td>容量<\/td><td>受单机 JVM 内存限制<\/td><td>可横向扩展（集群）<\/td><\/tr><tr><td>失效通知<\/td><td>无<\/td><td>发布订阅/版本号可做<\/td><\/tr><tr><td>适用<\/td><td>热点 key 二级缓存、防击穿<\/td><td>全局共享缓存<\/td><\/tr><\/tbody><\/table>\n<p><strong>最佳实践<\/strong>：<strong>本地缓存 + Redis 两级缓存<\/strong>——本地扛热点（命中率 90%+），Redis 做全局一致层，本地过期走 Redis 兜底。注意两级缓存的一致性：本地 TTL 尽量短或用版本号失效。<\/p>"}, {"q": "14.3 Redis 7.0 重要变化", "tag": "进阶", "body": "<ol><li><strong>listpack 全面替代 ziplist<\/strong>，消除级联更新；配置项改名 <code>*-max-listpack-entries<\/code>。<\/li><li><strong>Redis Functions<\/strong>：Lua 函数化注册管理（<code>FUNCTION LOAD<\/code>），替代散落 EVAL，支持权限控制。<\/li><li><strong>ACL v2<\/strong>：key 权限支持通配符与更细粒度。<\/li><li><strong>Sharded Pub/Sub<\/strong>：集群下广播只发到相关分片，解决广播风暴。<\/li><li>命令维度 TLS、<code>lazy free<\/code> 增强、内存效率提升（大 value 场景更省）。<\/li><li>Redis 8.0（2025）进一步聚焦 AI：<strong>内置 Vector Set（向量集）<\/strong>、Redis Data Integration（RDI）数据管道、LLM 缓存等，原生支持 AI 应用缓存与向量检索。<\/li><\/ol>"}, {"q": "14.4 Redis 安全加固", "tag": "高频", "body": "<ol><li><strong>ACL<\/strong>：按用户分配命令/key 权限（Redis 6+），最小权限原则。<\/li><li><strong>禁用危险命令<\/strong>：<code>rename-command KEYS \"\"<\/code>、<code>FLUSHALL<\/code>、<code>CONFIG<\/code>、<code>DEBUG<\/code>、<code>EVAL<\/code>（按需）。<\/li><li><strong>网络隔离<\/strong>：<code>bind 内网IP<\/code>、<code>protected-mode yes<\/code>、<strong>不暴露公网<\/strong>；必要时走专用网络/VPC、SSL。<\/li><li><strong>认证<\/strong>：<code>requirepass<\/code> 强密码；生产用 ACL 用户更细粒度。<\/li><li>其他：升级版本修 CVE、监控慢命令、限制 <code>maxmemory<\/code> 防 OOM 拖垮机器。<\/li><\/ol>"}, {"q": "14.5 Redis 线上故障排查思路", "tag": "进阶", "body": "<p>按现象定位：<\/p>\n<ul><li><strong>延迟飙升<\/strong>：<code>SLOWLOG<\/code> → 大 key（<code>--bigkeys<\/code>）→ fork/持久化 → 网络/内核 → 内存碎片。<\/li><li><strong>内存暴涨<\/strong>：<code>MEMORY USAGE<\/code> + <code>redis-rdb-tools<\/code> 分析 → 无效 key（过期策略没触发）→ 大 value → 连接数（buffer）。<\/li><li><strong>连接数打满<\/strong>：客户端连接池配置（maxTotal）、慢命令占线程、<code>timeout<\/code> 配置、连接泄漏。<\/li><li><strong>OOM/淘汰<\/strong>：<code>maxmemory<\/code> + 淘汰策略不当 → 调整策略、扩容、治理大 key。<\/li><li><strong>主从不同步<\/strong>：<code>INFO replication<\/code> 看 offset 差距 → 网络带宽 → backlog 过小导致频繁全量。<\/li><li><strong>集群数据倾斜<\/strong>：<code>CLUSTER INFO<\/code> / <code>CLUSTER NODES<\/code> 看槽分布与内存 → 热 key 分片、hash tag 使用不当。<\/li><li>监控指标：<code>INFO stats/commandstats/memory/replication<\/code> + Redis Exporter + Grafana。<\/li><\/ul>"}, {"q": "14.6 单机性能与容量估算", "tag": "基础", "body": "<ul><li>单机 QPS：<strong>读 10w+、写 8w+<\/strong>（受 value 大小、网络、机器影响）。<\/li><li>单机内存：建议 <strong>≤ 10GB<\/strong>（fork 成本、全量同步时间、RDB 加载时长可控）。<\/li><li>容量规划：<code>总数据量 × (1 + 索引/编码开销 20~50%)<\/code>；集合类按元素估算。<\/li><li>压测：<code>redis-benchmark -t set,get -n 1000000 -c 100<\/code>，关注 P99 延迟（< 1ms 为佳）。<\/li><li>部署：<strong>主从 + 哨兵<\/strong>是标配；数据量大/写入高再上 Cluster；核心链路加本地缓存兜底。<\/li><\/ul>\n<hr>\n<p>*整理时间：2026-08 · 建议结合 redis.conf 参数与线上 INFO 实测验证各策略*<\/p>"}]}], "qcount": 78}]}, {"id": "kafka", "name": "Kafka/ZK", "icon": "🔄", "color": "#06b6d4", "docs": [{"sub": "考前背诵版", "chapters": [{"title": "01 Kafka 核心概念与架构", "questions": [{"q": "1.1 Kafka 是什么？核心角色与定位？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li>Kafka 是 LinkedIn 开源（2011 年进 Apache）的<strong>分布式消息队列 / 流处理平台<\/strong>，Scala + Java 编写。<\/li><li><strong>三大核心能力<\/strong>：发布订阅（Pub/Sub）、数据存储（可回溯）、流处理（Kafka Streams）。<\/li><li><strong>四大角色<\/strong>：<\/li><li><strong>Producer<\/strong>（生产者）：发消息。<\/li><li><strong>Broker<\/strong>（服务端）：存消息，集群由多个 Broker 组成。<\/li><li><strong>Consumer<\/strong>（消费者）：拉消息。<\/li><li><strong>ZooKeeper / KRaft<\/strong>：协调器（早期管元数据与选举，KRaft 时代被替代）。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>P 发、B 存、C 拉、ZK 管 —— 一条链路，四个角色。<\/code><\/p>\n<p><strong>加分点：<\/strong> 区别于\"用完即走\"的 MQ，Kafka 本质是<strong>日志系统<\/strong>：消息落盘可重复消费、可回溯（offset 不删除消息），所以它能同时当\"队列\"和\"流数据平台\"。<\/p>\n<p><strong>追问：<\/strong> Kafka 消息会被消费后删除吗？—— 不会，按 <code>retention.ms<\/code>（默认 7 天）或分区大小保留，消费者各自记录自己的 offset。<\/p>"}, {"q": "1.2 Topic / Partition / Offset 三件套？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li><strong>Topic（主题）<\/strong>：消息的逻辑分类，一个 Topic 下可以有很多分区。<\/li><li><strong>Partition（分区）<\/strong>：物理分片，每个分区是一个<strong>有序的日志文件（append-only）<\/strong>；分区内有序、跨分区无序。<\/li><li><strong>Offset（位移）<\/strong>：分区内每条消息的<strong>递增编号<\/strong>（从 0 开始），是消息的唯一位置标识，也是消费者消费进度的游标。<\/li><li>消息归属：<strong>partition = hash(key) % 分区数<\/strong>（无 key 则轮询/粘性分区）。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>Topic 分类、Partition 分片、Offset 编号 —— 分区内有序，全局只保证这个。<\/code><\/p>\n<p><strong>加分点：<\/strong> 分区数决定并行度（并发上限 = min(分区数, 消费者数)）；但<strong>分区不是越多越好<\/strong>：文件句柄、rebalance 时间、元数据都会膨胀。<\/p>\n<p><strong>追问：<\/strong> 为什么 Kafka 只在分区内有序？—— 全局有序就要单分区，牺牲并行度；业务上按 key 分区即可保证\"同一 key 有序\"。<\/p>"}, {"q": "1.3 Kafka 为什么快？核心六板斧", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ol><li><strong>顺序写盘<\/strong>：消息 append-only 追加写，磁盘顺序写接近内存速度（600MB/s+）。<\/li><li><strong>Page Cache<\/strong>：读写都优先走操作系统的页缓存，避免 JVM GC 与对象开销。<\/li><li><strong>零拷贝<\/strong>：消费走 <code>sendfile<\/code>（内核态直接搬数据），生产走 <code>mmap<\/code>，省去用户态拷贝。<\/li><li><strong>批量 + 压缩<\/strong>：生产者攒批（batch）、服务端按批存储、消费者按批拉取，消息压缩（lz4/zstd/snappy）降网络 IO。<\/li><li><strong>稀疏索引<\/strong>：日志配 index 文件，二分查找定位，不逐条扫。<\/li><li><strong>无状态 Broker + 分区并行<\/strong>：Broker 不维护消费状态（offset 在消费者侧），天然易水平扩展。<\/li><\/ol>\n<p><strong>口诀：<\/strong> <code>顺序写、页缓存、零拷贝、批压、稀疏索引、无状态 —— 六板斧砍出百万 TPS。<\/code><\/p>\n<p><strong>加分点：<\/strong> 面试亮点：Kafka 的\"快\"本质是 <strong>用磁盘换性能<\/strong>（顺序 IO），把传统 MQ 的\"内存+随机 IO\"换成\"Page Cache + 顺序 IO\"，再叠加\"批量\"把 IO 次数降到最低。<\/p>\n<p><strong>追问：<\/strong> Page Cache 会不会导致丢消息？—— 不会主动丢，但<strong>断电/宕机<\/strong>会丢（页缓存未刷盘），生产用 <code>log.flush.interval.messages<\/code>/<code>fsync<\/code> 参数权衡性能与安全。<\/p>"}, {"q": "1.4 AR / ISR / OSR 三兄弟？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li><strong>AR（Assigned Replicas）<\/strong>：分区的<strong>所有副本<\/strong>集合。<\/li><li><strong>ISR（In-Sync Replicas）<\/strong>：<strong>同步中<\/strong>的副本集合（与 Leader 保持同步、存活），写入只认 ISR。<\/li><li><strong>OSR（Out-of-Sync Replicas）<\/strong>：<strong>落后/失联<\/strong>的副本（= AR - ISR）。<\/li><li>副本同步判定：Follower 持续向 Leader 拉数据，落后超过 <code>replica.lag.time.max.ms<\/code>（默认 30s）就会被<strong>踢出 ISR<\/strong>；追上了再加回来（ISR 是动态伸缩的）。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>AR 全员、ISR 在岗、OSR 掉队 —— 写入只问 ISR。<\/code><\/p>\n<p><strong>加分点：<\/strong> ISR 是 Kafka 高可用与一致性的<strong>枢纽<\/strong>：HW（高水位）只推进到 ISR 里最慢的那个，ISR 收缩过小说明副本健康堪忧，是排查丢数据的第一站。<\/p>\n<p><strong>追问：<\/strong> ISR 可以变成空吗？—— 极端情况可能，此时 Leader 可自行推进 HW（取决于 <code>min.insync.replicas<\/code> 与 unclean 配置），也可能触发\"未同步副本竞选\"。<\/p>"}, {"q": "1.5 Kafka vs RabbitMQ vs RocketMQ？", "tag": "中频", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<table><thead><tr><th>维度<\/th><th>Kafka<\/th><th>RabbitMQ<\/th><th>RocketMQ<\/th><\/tr><\/thead><tbody><tr><td>模型<\/td><td>Topic 分区日志<\/td><td>Exchange/Queue<\/td><td>Topic/Queue<\/td><\/tr><tr><td>吞吐<\/td><td>百万级<\/td><td>万级<\/td><td>十万级<\/td><\/tr><tr><td>顺序性<\/td><td>分区内严格<\/td><td>单队列<\/td><td>队列内严格<\/td><\/tr><tr><td>消息回溯<\/td><td>支持（offset 重放）<\/td><td>不支持<\/td><td>支持（时间点）<\/td><\/tr><tr><td>消费模式<\/td><td>拉 Pull<\/td><td>推 Push/拉<\/td><td>推拉结合<\/td><\/tr><tr><td>事务<\/td><td>幂等+事务<\/td><td>弱<\/td><td>分布式事务强<\/td><\/tr><tr><td>典型场景<\/td><td>日志、大数据、削峰<\/td><td>业务消息、低延迟<\/td><td>金融、事务消息<\/td><\/tr><\/tbody><\/table>\n<p><strong>口诀：<\/strong> <code>Kafka 要吞吐、RabbitMQ 要轻快、RocketMQ 要事务 —— 按需点单。<\/code><\/p>\n<p><strong>加分点：<\/strong> 面试常问\"为什么选 Kafka\"：日志类高吞吐 + 可回溯 + 生态（Flink/Spark）最顺；但业务级强事务/死信/延迟队列 RabbitMQ/RocketMQ 更顺手。<\/p>\n<p><strong>追问：<\/strong> Kafka 是推还是拉？—— <strong>拉（Pull）<\/strong>：消费者主动拉取，服务端无状态、可批量、可控速；缺点是有延迟（可长轮询缓解）。<\/p>\n<hr>"}]}, {"title": "02 生产者原理", "questions": [{"q": "2.1 生产消息完整流程？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong> 一条消息的旅程：<\/p>\n<pre><code>Producer 拦截器(interceptor) → 序列化器(serializer) → 分区器(partitioner)\n→ 攒批进缓冲区(accumulator, 默认 32MB)\n→ Sender 线程按批次取出（满足 batch.size 或 linger.ms）\n→ 发送到 Leader → 等待 acks → 回调(callback) 通知成功/失败<\/code><\/pre>\n<ul><li>关键：<strong>异步 + 批量<\/strong> —— 主线程只负责往缓冲区塞，真正发送是后台 Sender 线程。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>拦截 → 序列化 → 分区 → 进缓冲区 → 批量发 → 等 ack → 回调。<\/code><\/p>\n<p><strong>加分点：<\/strong> <code>max.block.ms<\/code> 控制\"缓冲区满时等待\"；<code>batch.size<\/code>（默认 16KB）与 <code>linger.ms<\/code>（默认 0）决定攒批策略；<code>buffer.memory<\/code> 默认 32MB。<\/p>\n<p><strong>追问：<\/strong> <code>linger.ms<\/code> 调大会怎样？—— 吞吐↑（攒更多批）但延迟↑；追求低延迟设 0~5，追求吞吐设 10~100。<\/p>"}, {"q": "2.2 分区选择策略？", "tag": "高频", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ol><li><strong>指定 partition<\/strong>：直接发指定分区（最高优先级）。<\/li><li><strong>指定 key<\/strong>：<code>hash(key) % 分区数<\/code> → 同一 key 永远进同一分区（顺序性）。<\/li><li><strong>无 key（新版本默认）<\/strong>：<strong>Sticky Partition（粘性分区）<\/strong>—— 一批消息粘在一个分区，攒够再换，减少请求次数，提升吞吐（旧版是轮询）。<\/li><\/ol>\n<p><strong>口诀：<\/strong> <code>指定分区 > 按 key 哈希 > 粘性轮询。<\/code><\/p>\n<p><strong>加分点：<\/strong> 粘性分区是 2.4+ 的优化点，问\"生产者为什么吞吐高\"可以扯到它：消息尽量粘在同一分区攒批，减少跨分区请求。<\/p>\n<p><strong>追问：<\/strong> key 哈希能保证稳定吗？—— 分区数不变则稳定；<strong>扩容分区数会打乱映射<\/strong>，所以需要顺序性的场景扩容要谨慎（或按\"业务 id 子分区\"设计）。<\/p>"}, {"q": "2.3 acks 三种可靠性语义？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<table><thead><tr><th>acks<\/th><th>含义<\/th><th>可靠性<\/th><th>场景<\/th><\/tr><\/thead><tbody><tr><td><code>0<\/code><\/td><td>不等确认，发完就算成功<\/td><td>最差（可能丢）<\/td><td>日志、监控（可丢）<\/td><\/tr><tr><td><code>1<\/code><\/td><td><strong>Leader 写成功即确认<\/strong>（默认）<\/td><td>中（Leader 挂了丢）<\/td><td>大多数业务<\/td><\/tr><tr><td><code>-1/all<\/code><\/td><td><strong>ISR 全部写成功才确认<\/strong><\/td><td>最好（配合 min.insync.replicas）<\/td><td>金融、关键数据<\/td><\/tr><\/tbody><\/table>\n<p><strong>口诀：<\/strong> <code>0 不回头、1 认 Leader、all 等全员 —— 可靠性按需加钱。<\/code><\/p>\n<p><strong>加分点：<\/strong> <code>acks=all<\/code> 必须配合 <code>min.insync.replicas<\/code>（如 =2）才有意义：否则 ISR 只剩 Leader 时 all 也退化成 1。三者组合：<code>acks=all + min.insync.replicas=2 + retries<\/code> 才是生产推荐。<\/p>\n<p><strong>追问：<\/strong> acks=all 一定不丢吗？—— 还受 <code>retries<\/code>、<code>unclean.leader.election<\/code> 影响；若允许\"非 ISR 副本竞选 Leader\"，仍可能丢数据。<\/p>"}, {"q": "2.4 生产者重试与顺序性冲突？", "tag": "进阶", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li><code>retries<\/code>：发送失败重试次数（默认 Integer.MAX，配合 <code>delivery.timeout.ms<\/code> 限总时长）。<\/li><li><code>max.in.flight.requests.per.connection<\/code>（默认 5）：<strong>同一连接上未确认的请求数<\/strong>。<\/li><li><strong>重试 + 乱序的坑<\/strong>：第一批发送失败重试，第二批已发出，若重试成功晚到，则消息顺序颠倒（0、1、2 → 0、2、1）。<\/li><li>解法：① 置 <code>max.in.flight=1<\/code>（保顺序但掉吞吐）；② <strong>开启幂等<\/strong>（<code>enable.idempotence=true<\/code>，默认开），Broker 端按序去重，允许 >1。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>重试会乱序，幂等来兜底；要不就 in.flight=1 锁死。<\/code><\/p>\n<p><strong>加分点：<\/strong> 2.8+ 默认 <code>enable.idempotence=true<\/code> 且 <code>max.in.flight=5<\/code> 也保证顺序 —— 因为幂等生产者的 seq 校验会让重试批次按序落盘。<\/p>\n<p><strong>追问：<\/strong> 幂等如何保证顺序？—— 见 2.5，Broker 按 <code>(PID, Partition, seq)<\/code> 校验，seq 必须连续递增，乱序批次被拒绝/等待。<\/p>"}, {"q": "2.5 幂等生产者原理？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li>开启 <code>enable.idempotence=true<\/code> 后，每条消息带 <strong>PID（生产者 ID）+ Sequence Number（序号，分区内自增）<\/strong>。<\/li><li>Broker 端为每个 <code>(PID, 分区)<\/code> 维护一个 <strong>已接收的最大序号<\/strong>：<\/li><li>新消息序号 = 上一条 + 1 → 正常接收。<\/li><li>序号 ≤ 已接收 → <strong>重复，直接丢弃<\/strong>。<\/li><li>序号 > 上一条 + 1 → <strong>乱序/缺号，拒绝<\/strong>（等重试）。<\/li><li>结果：<strong>单生产者、单分区内的消息不重复、不丢失、有序<\/strong>。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>PID + seq，Broker 查重 —— 重复丢、乱序拒、断号等。<\/code><\/p>\n<p><strong>加分点：<\/strong> 幂等<strong>只能保证单会话单分区<\/strong>的 exactly-once；跨分区/多会话要用<strong>事务<\/strong>（2.6）。<\/p>\n<p><strong>追问：<\/strong> PID 什么时候失效？—— 生产者重启 PID 会变（或旧 PID 过期），所以\"崩溃重启后\"的重复仍可能发生，幂等不是跨进程的。<\/p>"}, {"q": "2.6 Kafka 事务与 exactly-once？", "tag": "进阶", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li><strong>事务<\/strong> = 把<strong>多个分区的写入<\/strong>（可跨 Topic）做成原子操作：要么全部成功、要么全部回滚。<\/li><li>核心组件：<strong>Transaction Coordinator（事务协调器，在 Broker 内）<\/strong> + 事务日志（内部 Topic <code>__transaction_state<\/code>）。<\/li><li>流程：<\/li><\/ul>\n<ol><li>生产者向 Coordinator <strong>发起事务<\/strong>（<code>initTransactions<\/code>）。<\/li><li>写消息前<strong>标记分区<\/strong>（AddPartitionsToTxn），消息带事务 id。<\/li><li>提交时 Coordinator 写 <strong>PREPARE_COMMIT<\/strong> → 各分区写 <strong>COMMIT 标记（LSO 后的控制消息）<\/strong> → 完成。<\/li><\/ol>\n<ul><li>消费端配合 <code>isolation.level=read_committed<\/code> 才能只读到已提交的消息。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>Coordinator 记账，分区写标记，提交才可见 —— 多分区原子提交。<\/code><\/p>\n<p><strong>加分点：<\/strong> 事务实现真正 <strong>exactly-once（端到端）<\/strong>：事务写 + <code>read_committed<\/code> 消费 + 幂等消费（offset 去重），是 Kafka 精确一次的完整链路。<\/p>\n<p><strong>追问：<\/strong> 事务性能开销大吗？—— 有额外 RTT（标记分区、提交协调），追求极致吞吐的业务一般不用；且事务不能跨 Kafka 集群（可用消息最终一致性代替）。<\/p>\n<hr>"}]}, {"title": "03 消费者原理", "questions": [{"q": "3.1 消费流程与位移（offset）管理？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li>消费者是<strong>拉模式<\/strong>：<code>poll()<\/code> 批量拉取（默认 max.poll.records=500），处理完后<strong>提交 offset<\/strong> 表示\"这段我消费完了\"。<\/li><li><strong>offset 存哪<\/strong>：内部 Topic <code>__consumer_offsets<\/code>（50 个分区，按 groupId hash），老版本存 ZK。<\/li><li>消费进度 = <strong>消费者自己提交的 offset<\/strong>，Broker 不记录谁消费到哪 —— 这就是\"无状态 Broker\"。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>poll 拉、处理完、提交 offset —— 进度在消费者手里。<\/code><\/p>\n<p><strong>加分点：<\/strong> <code>enable.auto.commit<\/code>（默认 true）每 <code>auto.commit.interval.ms<\/code>（5s）自动提交；<strong>手动提交<\/strong>更可控（<code>commitSync<\/code> 同步阻塞 / <code>commitAsync<\/code> 异步回调）。<\/p>\n<p><strong>追问：<\/strong> offset 提交太早/太晚会怎样？—— 早提交：处理中途崩溃 → <strong>消息丢失<\/strong>（offset 已提交但没处理完）；晚提交：处理完未提交崩溃 → <strong>重复消费<\/strong>（重启从头拉）。<\/p>"}, {"q": "3.2 消费组与分区分配策略？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li><strong>Consumer Group（消费组）<\/strong>：组内消费者<strong>共同分担<\/strong>一个或多个 Topic 的所有分区；一个分区<strong>同一时刻只能被组内一个消费者消费<\/strong>（互斥）。<\/li><li>三大分配策略（<code>partition.assignment.strategy<\/code>）：<\/li><\/ul>\n<ol><li><strong>Range（范围，默认）<\/strong>：按 Topic 逐个分配，分区数/消费者数整除 —— 不均时前几个消费者<strong>多分<\/strong>。<\/li><li><strong>RoundRobin（轮询）<\/strong>：所有分区排好队轮流分，<strong>整体均衡<\/strong>。<\/li><li><strong>Sticky（粘性，2.4+）<\/strong>：在轮询基础上<strong>尽量保持上次的分配<\/strong>（rebalance 时少挪动），3.x 默认。<\/li><\/ol>\n<p><strong>口诀：<\/strong> <code>Range 按 Topic 割、RoundRobin 轮流发、Sticky 尽量不搬家。<\/code><\/p>\n<p><strong>加分点：<\/strong> 组内消费者数 > 分区数时，多出的消费者<strong>空转<\/strong>（拿不到分区）；最大消费并行度 = 分区数。<\/p>\n<p><strong>追问：<\/strong> 一个消费者能消费多个分区吗？—— 能，一个消费者默认可以持有多个分区；<strong>分区是组内唯一持有单元<\/strong>。<\/p>"}, {"q": "3.3 offset 提交的四种姿势？", "tag": "高频", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<table><thead><tr><th>组合<\/th><th>说明<\/th><th>风险<\/th><\/tr><\/thead><tbody><tr><td>自动提交<\/td><td>5s 定时提交，poll 之前先提交上次<\/td><td>易丢/易重<\/td><\/tr><tr><td>同步提交 <code>commitSync<\/code><\/td><td>处理完提交，失败会<strong>重试<\/strong>，阻塞<\/td><td>吞吐低<\/td><\/tr><tr><td>异步提交 <code>commitAsync<\/code><\/td><td>提交回调，失败<strong>不重试<\/strong><\/td><td>可能漏提交<\/td><\/tr><tr><td>同步+异步组合<\/td><td>关键位置同步兜底，日常异步<\/td><td>生产推荐<\/td><\/tr><\/tbody><\/table>\n<p><strong>口诀：<\/strong> <code>自动省事有风险、sync 稳但慢、async 快但飘、组合拳最优。<\/code><\/p>\n<p><strong>加分点：<\/strong> 推荐模式：循环内 <code>commitAsync<\/code>（快），循环退出前（或优雅关闭时）补一次 <code>commitSync<\/code> 兜底 —— 兼顾吞吐与可靠。<\/p>\n<p><strong>追问：<\/strong> commitAsync 失败会怎样？—— 失败但没回调重试，offset 停留在旧值 → 下次重启<strong>重复消费<\/strong>；所以\"至少一次\"靠\"手动提交 + 处理完再提交\"保证。<\/p>"}, {"q": "3.4 Rebalance 机制与协调器？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li><strong>Rebalance（再平衡）<\/strong>：消费者<strong>加入/退出/崩溃<\/strong>或<strong>分区变化<\/strong>时，组内重新分配分区。期间<strong>全体停止消费<\/strong>（stop-the-world）。<\/li><li>触发条件：① 消费者加入/离开；② 消费者崩溃（<code>session.timeout.ms<\/code> 未心跳）；③ 分区数变化（扩分区）。<\/li><li>协调器：<strong>Group Coordinator<\/strong>（某个 Broker 承担），消费者心跳 + offset 提交都找它。<\/li><li>流程（2.4+ 新版）：<\/li><\/ul>\n<ol><li>消费者向 Coordinator 发 <code>JoinGroup<\/code>。<\/li><li>Coordinator 选 <strong>Leader 消费者<\/strong>，Leader 用分配策略算出分配方案。<\/li><li>所有消费者收 <code>SyncGroup<\/code> 结果，rebalance 完成。<\/li><\/ol>\n<p><strong>口诀：<\/strong> <code>有变动就全员重排、期间停摆；心跳断了就被踢出局。<\/code><\/p>\n<p><strong>加分点：<\/strong> 新版优化：<code>max.poll.interval.ms<\/code>（默认 5min）代替\"处理超时踢人\"；<strong>静态成员（static membership）<\/strong> 用 <code>group.instance.id<\/code> 避免\"宕机秒踢+重平衡\"风暴。<\/p>\n<p><strong>追问：<\/strong> 消费慢会被踢吗？—— 超过 <code>max.poll.interval.ms<\/code> 没 poll 就会被判定失联踢出组 → 触发 rebalance；解法：调大该参数、减少单次 poll 记录数、或并发消费。<\/p>"}, {"q": "3.5 消息不丢 / 不重 / 有序，消费端怎么保证？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li><strong>不丢（至少一次 At-Least-Once）<\/strong>：<strong>处理完业务再提交 offset<\/strong>（手动提交、先处理后提交）；<code>enable.auto.commit=false<\/code>。<\/li><li><strong>不重（幂等消费）<\/strong>：业务侧幂等 —— 用<strong>业务唯一键<\/strong>（订单号/消息 ID）去重（Redis setNX / DB 唯一索引 / 记录消费表）。<\/li><li><strong>有序<\/strong>：① 生产按 key 分区（同一 key 进同一分区）；② 消费端<strong>单分区单线程<\/strong>处理（<code>max.poll.records=1<\/code> 或并发队列按 key 哈希到单线程）。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>先处理再提交防丢；唯一键去重防重；按 key 分区 + 单线程保序。<\/code><\/p>\n<p><strong>加分点：<\/strong> 经典总结：<strong>Kafka 默认是\"至少一次\"<\/strong>，既可能重复消费（可幂等处理），也可能丢（offset 乱提交/acks=1）。要 exactly-once 必须 幂等 + 事务 + 业务幂等三方配合。<\/p>\n<p><strong>追问：<\/strong> 消费端怎么\"优雅关闭\"？—— 实现 <code>ConsumerRebalanceListener<\/code>：在 <code>onPartitionsRevoked<\/code> 里做\"处理完再提交 offset\"，再退出 poll 循环，避免 rebalance 丢位移。<\/p>\n<hr>"}]}, {"title": "04 存储与日志机制", "questions": [{"q": "4.1 日志分段存储结构？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li>每个分区一个<strong>目录<\/strong>：<code>/data/topic-0/<\/code>；内部按<strong>段（Segment）<\/strong> 切分，默认 <code>log.segment.bytes=1GB<\/code> 或 <code>log.roll.hours<\/code> 到达即滚动。<\/li><li>一个 Segment = <strong>三个文件<\/strong>（同 baseOffset 命名）：<\/li><li><code>00000000000000000000.log<\/code> —— 消息数据（顺序追加）。<\/li><li><code>...index<\/code> —— <strong>偏移量索引<\/strong>（相对 offset → 物理位置）。<\/li><li><code>...timeindex<\/code> —— <strong>时间索引<\/strong>（时间戳 → 相对 offset）。<\/li><li><strong>活跃段（active segment）<\/strong>：正在写的最后一个段，不可删除。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>一分区一目录，段切三件套：log 存数据、index 查偏移、timeindex 查时间。<\/code><\/p>\n<p><strong>加分点：<\/strong> 段是有序的：全局 offset = 段 baseOffset + 段内相对 offset；<strong>删除/过期按段<\/strong>整段删除（所以消息删除是\"整段删\"，粒度是段）。<\/p>\n<p><strong>追问：<\/strong> 为什么消息删除慢？—— 删除是<strong>删除整个 Segment 文件<\/strong>（顺带清理 index），不是逐条删；磁盘回收取决于段大小与 retention。<\/p>"}, {"q": "4.2 稀疏索引与二分查找？", "tag": "高频", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li>index 是<strong>稀疏索引<\/strong>：不是每条消息都建索引，而是<strong>每隔 <code>log.index.interval.bytes<\/code>（默认 4KB）记录一条<\/strong>（offset → 文件物理位置）。<\/li><li>查找消息流程：按目标 offset 定位所属 Segment → 在 index <strong>二分查找<\/strong>最近 <= 目标 offset 的条目 → 从该物理位置<strong>顺序扫<\/strong>到目标消息。<\/li><li>好处：索引文件小（内存友好）、查找快（O(logN) + 少量顺序扫描）。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>稀疏索引 + 二分定位 + 顺序扫描 —— 不逐条建索引，也不逐条扫。<\/code><\/p>\n<p><strong>加分点：<\/strong> 面试亮点：Kafka 没有为每条消息建索引（那样索引比数据还大），用\"稀疏索引 + 粗定位 + 细扫描\"在<strong>内存占用<\/strong>与<strong>查找速度<\/strong>间取平衡。<\/p>\n<p><strong>追问：<\/strong> index 怎么保证 index 文件本身有序？—— 追加写天然有序（按 offset 递增），所以能二分。<\/p>"}, {"q": "4.3 日志清理策略：delete 与 compact？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li><strong>delete（默认）<\/strong>：按 <strong>时间<\/strong>（<code>retention.ms<\/code>，默认 7 天）或 <strong>大小<\/strong>（<code>retention.bytes<\/code>，按分区）删除过期段。<\/li><li><strong>compact（日志压缩）<\/strong>：按 <strong>key<\/strong> 合并 —— 相同 key 只保留<strong>最新一条<\/strong>（value 最新），用于\"状态快照\"类数据（如配置、用户最新状态）。<\/li><li>触发：<code>log.cleanup.policy=compact<\/code> 或 <code>delete,compact<\/code> 混合。<\/li><li><strong>cleaner 线程<\/strong>：后台线程扫描日志，保留每个 key 的最新记录，删除旧记录（用布隆过滤器加速）。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>delete 按时间/大小删，compact 按 key 留最新 —— 一个清历史，一个留状态。<\/code><\/p>\n<p><strong>加分点：<\/strong> 经典场景：<strong>消费者组 offset 用的内部 Topic <code>__consumer_offsets<\/code> 就是 compact 策略<\/strong> —— 只留每个 group+分区的最新 offset；KV 状态存储（Kafka Streams changelog）也是 compact。<\/p>\n<p><strong>追问：<\/strong> compact 一定能压缩到很小吗？—— 不能保证，依赖 key 的分布与 cleaner 时机；且<strong>活跃段不参与压缩<\/strong>。<\/p>"}, {"q": "4.4 刷盘机制与消息安全性？", "tag": "高频", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li>Kafka 写消息先到 <strong>Page Cache<\/strong>，再由操作系统异步刷盘（<code>log.flush.interval.messages<\/code> 默认 Long.Max、<code>log.flush.interval.ms<\/code> 默认无）。<\/li><li>可控刷盘参数（<code>log.flush.scheduler.interval.ms<\/code>、每 Broker 的 <code>flush<\/code> 配置）可强制 fsync，但<strong>大幅降低吞吐<\/strong>。<\/li><li><strong>生产不主动刷盘<\/strong>：靠 <code>acks=all + ISR 多副本<\/code> 保证\"至少存了一份\"，单机宕机依赖副本恢复 —— 即\"用副本冗余替代磁盘同步\"。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>写缓存、靠副本、不硬刷 —— 副本冗余换性能。<\/code><\/p>\n<p><strong>加分点：<\/strong> 面试高频：Kafka 保证持久性不是靠 fsync，而是靠 <strong>ISR 多副本 + acks=all<\/strong>；单副本 + 断电会丢 Page Cache 里未刷盘的数据。<\/p>\n<p><strong>追问：<\/strong> 为什么日志目录建议用独立磁盘？—— 避免与 OS 日志/其他应用 IO 竞争；且顺序写需要整块盘，RAID 无缓存场景注意掉电保护。<\/p>"}, {"q": "4.5 零拷贝细节（sendfile / mmap）？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li><strong>消费方向（Broker → 消费者）<\/strong>：<code>sendfile<\/code> —— 数据从<strong>磁盘 → 内核 socket 缓冲区 → 网卡<\/strong>，<strong>不经过用户态<\/strong>，2 次拷贝（DMA + CPU）。<\/li><li><strong>生产方向（生产者 → Broker）<\/strong>：<code>mmap<\/code> —— 消息缓冲区映射到内存，写消息 = 写内存，由内核回写磁盘。<\/li><li>对比传统 read/write：数据要\"磁盘 → 内核 → 用户态 → 内核 → 网卡\"，4 次拷贝 + 多次上下文切换。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>消费 sendfile 内核对内核搬，生产 mmap 当内存写 —— 都不进 JVM 用户态。<\/code><\/p>\n<p><strong>加分点：<\/strong> 关键：Kafka 的零拷贝把<strong>数据链路<\/strong>压缩到\"磁盘缓冲直发网卡\"，配合 Page Cache（热数据直接在内存）实现高吞吐。<\/p>\n<p><strong>追问：<\/strong> 传输大对象（>1MB）零拷贝还生效吗？—— 零拷贝对网络发送生效，但<strong>跨 Broker 复制<\/strong>、消费者大批量场景仍涉及内存缓冲；大消息会额外消耗页缓存。<\/p>\n<hr>"}]}, {"title": "05 副本与一致性", "questions": [{"q": "5.1 副本同步（Leader 与 Follower）细节？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li>每个分区有 1 个 <strong>Leader<\/strong> + N 个 <strong>Follower<\/strong>（<code>replication.factor<\/code> 决定）。<\/li><li><strong>读写都只走 Leader<\/strong>；Follower <strong>主动拉取（fetch）<\/strong> 同步数据，不对外服务。<\/li><li>Follower 同步路径：Follower 向 Leader 发 FetchRequest（带自己的 offset）→ Leader 返回新消息 → Follower 写入本地日志。<\/li><li><strong>ISR 判定<\/strong>：Follower 的 LEO 落后 Leader 的 HW 超过 <code>replica.lag.time.max.ms<\/code>（默认 30s，注意是<strong>时间<\/strong>阈值不是条数）→ 踢出 ISR。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>读写认 Leader，Follower 自己来拉，30 秒不跟就踢出 ISR。<\/code><\/p>\n<p><strong>加分点：<\/strong> Kafka 副本是\"<strong>异步复制<\/strong>\"（Leader 不等 Follower 就能 ack，除非 acks=all）→ 所以天然<strong>可能丢<\/strong>；ISR + acks=all 把窗口缩到最小。<\/p>\n<p><strong>追问：<\/strong> Follower 同步慢会被踢吗？—— 会，但按<strong>时间<\/strong>判断：只要 Follower 持续拉（哪怕每次很少）就不算掉队；卡住 30s 才踢。<\/p>"}, {"q": "5.2 高水位 HW 与 LEO？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li><strong>LEO（Log End Offset）<\/strong>：每个副本<strong>本地日志下一条要写的偏移<\/strong>（最新）。<\/li><li><strong>HW（High Watermark）<\/strong>：<strong>ISR 中所有副本 LEO 的最小值<\/strong>；<code>offset < HW<\/code> 的消息对所有副本\"已提交\"（消费者可见）。<\/li><li>消费者只能消费 <strong>< HW<\/strong> 的消息；Leader 会把自己的 HW 发给 Follower，Follower 也截断到 HW。<\/li><li><strong>Leader Epoch<\/strong>（0.11+）：记录 Leader 任期，Follower 截断时以 Leader Epoch 判断该截多少，<strong>修复旧版 HW 不一致导致的丢/重<\/strong>。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>LEO 是队尾，HW 是集体最矮 —— 低于 HW 才算数。<\/code><\/p>\n<p><strong>加分点：<\/strong> 面试拔高：旧版 HW 机制在\"Leader 切换 + 副本截断\"时可能丢数据（截断过头），Leader Epoch 通过\"带任期号向新 Leader 问\"精确截断，是 0.11 的重要修复。<\/p>\n<p><strong>追问：<\/strong> HW 谁推进？—— Leader 推进自己 HW（看 ISR 最慢 LEO），并把 HW 广播给 Follower；Follower 收到后推进自己的 HW。<\/p>"}, {"q": "5.3 Leader 选举与 Controller？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li><strong>Controller（控制器）<\/strong>：集群中<strong>唯一<\/strong>的\"管家\"Broker，负责分区 Leader 选举、分区分配、Broker 上下线处理。<\/li><li>Controller 选举：依赖 ZK（早期）—— 多个 Broker 抢建 <code>/controller<\/code> 临时节点，抢到的就是 Controller；失败者监听该节点，Controller 挂了自动再抢。<strong>KRaft 时代<\/strong>用 Raft 协议在控制器节点间选举。<\/li><li><strong>分区 Leader 选举<\/strong>：分区 Leader 挂了，Controller 从 <strong>ISR 中选一个新 Leader<\/strong>（优先选副本在位的）；<strong>unclean 选举<\/strong>允许从 OSR 选（会丢数据，默认关闭）。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>Controller 是管家，分区挂了从 ISR 里挑新 Leader，unclean 是保命不是保数据。<\/code><\/p>\n<p><strong>加分点：<\/strong> 元数据缓存：Controller 维护所有分区/副本状态，变更通过 <strong>RPC 通知<\/strong>各 Broker 更新元数据；Controller 是单点，但切换是秒级。<\/p>\n<p><strong>追问：<\/strong> <code>unclean.leader.election.enable<\/code> 开不开？—— 默认 <code>false<\/code>（宁可分区不可用也不丢数据）；开 <code>true<\/code> 保可用性但<strong>可能丢消息<\/strong>，二选一。<\/p>"}, {"q": "5.4 丢数据场景大盘点？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong> 从生产到消费四个环节：<\/p>\n<ol><li><strong>生产端<\/strong>：<code>acks=0/1<\/code>（没等 ISR 全落）、生产者异常未重试 → 丢。<\/li><li><strong>Broker 端<\/strong>：Leader 挂了、Follower 未同步完成就接盘（ISR 无/未同步）、<code>unclean<\/code> 选举 → 丢。<\/li><li><strong>存储端<\/strong>：Page Cache 未刷盘断电 → 丢。<\/li><li><strong>消费端<\/strong>：先提交 offset 后处理（自动提交/同步提交过早）→ 丢。<\/li><\/ol>\n<p><strong>口诀：<\/strong> <code>生产不等 ack、Broker 抢脏 Leader、缓存没落盘、消费先提交 —— 四处漏水的四个窟窿。<\/code><\/p>\n<p><strong>加分点：<\/strong> 生产级防丢清单：<code>acks=all<\/code> + <code>min.insync.replicas=2<\/code> + <code>retries<\/code>（大）+ <code>unclean.leader.election.enable=false<\/code> + 消费先处理再提交 + 合理刷盘/副本数（3）。<\/p>\n<p><strong>追问：<\/strong> 副本数 3 就万无一失吗？—— 不是：如果 ISR 只剩 Leader（两个 Follower 都掉队），此时 Leader 挂 → 无同步副本可选 → 要么不可用、要么 unclean 丢数据。所以要监控 ISR 收缩。<\/p>\n<hr>"}]}, {"title": "06 高可用与集群管理", "questions": [{"q": "6.1 Kafka 集群元数据存什么？", "tag": "高频", "body": "<p><strong>答案骨架：<\/strong>（ZK 时代）Kafka 在 ZK 上存储/注册：<\/p>\n<ul><li><strong>Broker 注册<\/strong>：<code>/brokers/ids/{id}<\/code>（临时节点，Broker 下线自动消失）。<\/li><li><strong>Topic 元数据<\/strong>：<code>/brokers/topics/{topic}<\/code>（分区数、副本分配）。<\/li><li><strong>Controller 节点<\/strong>：<code>/controller<\/code>（临时节点，谁建谁当 Controller）。<\/li><li><strong>消费者组 offset<\/strong>（老版本）/ 分区 ISR 变化等。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>ZK 管四样：Broker 名册、Topic 配置、Controller 宝座、老版位移。<\/code><\/p>\n<p><strong>加分点：<\/strong> 注意：<strong>消息数据本身不存 ZK<\/strong>，ZK 只存<strong>元数据<\/strong>；且 0.9+ 消费位移已迁到 Kafka 内部 Topic，ZK 只管协调类元数据。<\/p>\n<p><strong>追问：<\/strong> ZK 挂了 Kafka 还能用吗？—— 能用：元数据已缓存到各 Broker，但<strong>无法创建 Topic、无法处理 Broker 上下线、无法选举 Controller<\/strong>，等于集群\"瘫痪但还活着\"。<\/p>"}, {"q": "6.2 Controller 的角色细讲？", "tag": "进阶", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li>Controller 做的事：<\/li><\/ul>\n<ol><li><strong>分区 Leader 选举<\/strong>（分区挂、Broker 挂触发）。<\/li><li><strong>Broker 上下线管理<\/strong>：新 Broker 注册 → 分配分区副本；Broker 下线 → 副本转移、Leader 重选。<\/li><li><strong>分区重分配<\/strong>（扩缩容/迁移）。<\/li><li><strong>ISR 变更通知<\/strong>、元数据分发（通知所有 Broker 更新缓存）。<\/li><\/ol>\n<ul><li>实现：Controller 内存维护 <strong>元数据缓存（全量 Topic/分区/副本状态）<\/strong>，变更时把<strong>事件<\/strong>广播（LeaderAndIsr、UpdateMetadata 请求）。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>选举、上下线、重分配、广播元数据 —— Controller 是集群的神经中枢。<\/code><\/p>\n<p><strong>加分点：<\/strong> Controller 挂了的恢复：其他 Broker 监听 <code>/controller<\/code>，ZK 会话超时后重新竞选；恢复期间<strong>集群只读<\/strong>（不能建 Topic、不能迁分区），但存量消费/生产仍可用。<\/p>\n<p><strong>追问：<\/strong> Controller 会不会成为瓶颈？—— 元数据量巨大（几万分区）时，Controller 处理元数据变更和广播会有压力；分区数建议控制在合理范围（经验 < 5 万）。<\/p>"}, {"q": "6.3 分区副本怎么分配与扩容？", "tag": "进阶", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li><strong>初始分配<\/strong>：分区副本<strong>尽量均匀<\/strong>分布到不同 Broker，且每个分区的副本<strong>错开 Broker<\/strong>（同机架还要错机架，<code>rack.aware<\/code>）。<\/li><li><strong>扩容<\/strong>：新增 Broker → 用 <code>kafka-reassign-partitions.sh<\/code> <strong>迁移分区<\/strong>（把部分分区副本搬过去），期间数据复制、<strong>服务不中断<\/strong>。<\/li><li><strong>分区数扩容<\/strong>：<code>kafka-topics.sh --alter --partitions N<\/code>，但<strong>已存在消息的 key 路由会变<\/strong>（hash 基数变了）。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>新 Broker 搬分区、分区数扩容要谨慎 —— 副本跟机架走，key 路由会翻车。<\/code><\/p>\n<p><strong>加分点：<\/strong> 迁移用\"增量副本 + 完成即删旧副本\"，避免瞬时双写压力；生产推荐\"<strong>分区数一次性规划够<\/strong>\"，别频繁扩。<\/p>\n<p><strong>追问：<\/strong> 扩分区后同一 key 还在同一分区吗？—— 不一定！<code>hash(key) % N<\/code> 变成 <code>% M<\/code>（M>N），历史数据重路由 → 需要顺序性的 topic 扩容会破坏顺序。<\/p>"}, {"q": "6.4 Kafka 高可用部署架构？", "tag": "高频", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<pre><code>3+ Broker（副本 factor=3，副本错机架）\n    ↕ 元数据协调\n3+ ZK 节点（ZK 时代）或 3 控制器（KRaft）<\/code><\/pre>\n<ul><li><strong>副本 factor=3<\/strong>：单 Broker 挂不丢数据、ISR 仍 ≥2。<\/li><li><strong>ZK 集群<\/strong>：奇数节点（3/5），过半可用；ZK 不存数据只存元数据。<\/li><li><strong>监控<\/strong>：ISR 收缩、UnderReplicatedPartitions、Controller 切换、消费组 lag 是四大黄金指标。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>Broker 三副本错机架，ZK 奇数过半 —— 挂了也能转。<\/code><\/p>\n<p><strong>加分点：<\/strong> 生产者侧 <code>acks=all<\/code>、消费端 <code>read_committed<\/code> 按需；客户端配 <code>bootstrap.servers<\/code> 多地址（只用于发现，任意一个能连即可）。<\/p>\n<p><strong>追问：<\/strong> ZK 集群本身怎么不挂？—— 奇数节点 + 独立磁盘 + 监控告警；ZK 会话超时（<code>session.timeout.ms<\/code>）设置过短会导致 Broker 被误判下线，引发大面积 rebalance。<\/p>\n<hr>"}]}, {"title": "07 性能优化与排障", "questions": [{"q": "7.1 生产端调优参数清单？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ol><li><code>acks=all<\/code> + <code>min.insync.replicas=2<\/code>（可靠）。<\/li><li><code>batch.size=32K~64K<\/code> + <code>linger.ms=10~100<\/code>（攒批，提吞吐）。<\/li><li><code>compression.type=lz4/zstd<\/code>（压缩省带宽，CPU 换带宽）。<\/li><li><code>buffer.memory=64MB<\/code>、<code>max.block.ms<\/code>（缓冲不足不阻塞主线程）。<\/li><li><code>max.in.flight.requests.per.connection=5<\/code> + <code>enable.idempotence=true<\/code>（高吞吐还保序）。<\/li><li><code>retries<\/code> 大 + <code>delivery.timeout.ms<\/code>（重试窗口）。<\/li><\/ol>\n<p><strong>口诀：<\/strong> <code>acks 保命、batch+linger 攒批、压缩省带宽、幂等保序 —— 六件套。<\/code><\/p>\n<p><strong>加分点：<\/strong> 调优依据：先看<strong>瓶颈<\/strong> —— 带宽受限就加压缩，CPU 受限就减压缩，延迟敏感就小 batch + linger=0。<\/p>\n<p><strong>追问：<\/strong> 压缩在哪个环节发生？—— 生产者压缩（攒批后），Broker 存压缩态，消费者拉取后<strong>解压<\/strong> —— 端到端压缩，磁盘/网络都省。<\/p>"}, {"q": "7.2 消费端调优参数清单？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ol><li><code>fetch.min.bytes<\/code>（默认 1，攒够才返回）+ <code>fetch.max.wait.ms<\/code>（最多等多久）→ 减少空轮询。<\/li><li><code>max.poll.records=500<\/code> → 控制单次处理量，防\"处理超时被踢\"。<\/li><li><code>max.poll.interval.ms=5min<\/code> → 处理慢的业务调大。<\/li><li><code>enable.auto.commit=false<\/code> + 手动提交 → 精确控制位移。<\/li><li><code>isolation.level=read_committed<\/code> → 事务消息只读已提交。<\/li><li>并发：<strong>分区数 = 消费者数<\/strong>（并行度上限），处理用线程池 + 按 key 哈希到线程保序。<\/li><\/ol>\n<p><strong>口诀：<\/strong> <code>攒批拉取、限量处理、手动提交、并发对齐分区数。<\/code><\/p>\n<p><strong>加分点：<\/strong> 高性能消费架构：<code>单消费者 + 多线程 + 内部队列按 key 分桶<\/code> —— 既保持单分区有序，又突破\"单消费者单线程\"的瓶颈。<\/p>\n<p><strong>追问：<\/strong> 消费者数 > 分区数会怎样？—— 多余消费者<strong>闲置<\/strong>（join 但没分区），白占资源；所以扩容消费者要先扩分区。<\/p>"}, {"q": "7.3 消息积压（lag）怎么办？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ol><li><strong>先诊断<\/strong>：<code>kafka-consumer-groups.sh --describe<\/code> 看各分区 lag；定位是<strong>生产暴增<\/strong>还是<strong>消费变慢<\/strong>（消费耗时、日志、GC、DB 慢查询）。<\/li><li><strong>应急扩容<\/strong>：增加消费者数量 —— 但<strong>并行度受分区数限制<\/strong>，分区数不够先扩分区（注意 key 路由影响）。<\/li><li><strong>加速消费<\/strong>：批量处理（攒批写 DB）、异步化（先入本地缓冲/下一级 MQ）、去重降计算。<\/li><li><strong>如果积压到快过期<\/strong>：临时加 Topic + 增加消费者机器，或<strong>换更大的消费组<\/strong>分流。<\/li><li><strong>根治<\/strong>：定位生产端瓶颈 / 消费端慢查询、死锁、外呼慢。<\/li><\/ol>\n<p><strong>口诀：<\/strong> <code>先看 lag 哪来的，扩容消费者、加分区、批量加速 —— 治标再治本。<\/code><\/p>\n<p><strong>加分点：<\/strong> 注意<strong>消费积压 ≠ 系统挂了<\/strong>：Kafka 消息不丢（保留期内），滞后消费是可恢复的；关键是不让 lag 超过 retention 导致消息被删。<\/p>\n<p><strong>追问：<\/strong> 消费者处理不过来，能多开几个消费者进程吗？—— 能，但<strong>同一组内<\/strong>多进程分到的还是那些分区；换组则各消费各的（相当于复制一份全量数据，慎用）。<\/p>"}, {"q": "7.4 常见故障排查清单？", "tag": "高频", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<table><thead><tr><th>症状<\/th><th>排查方向<\/th><\/tr><\/thead><tbody><tr><td>消费 lag 暴涨<\/td><td>消费端慢、rebalance 频繁、分区热点<\/td><\/tr><tr><td>rebalance 风暴<\/td><td>心跳超时、<code>session.timeout.ms<\/code> 过短、处理超 <code>max.poll.interval.ms<\/code>、GC 停顿<\/td><\/tr><tr><td>消息发不出去<\/td><td><code>max.block.ms<\/code> 缓冲满、连接数/线程数、Broker 磁盘满、ISR 不足<\/td><\/tr><tr><td><code>NotLeaderForPartition<\/code><\/td><td>分区 Leader 切换中、元数据过期<\/td><\/tr><tr><td>磁盘占用满<\/td><td><code>retention.ms<\/code> 太短？日志太大？compact 失效<\/td><\/tr><tr><td>UnderReplicatedPartitions<\/td><td>某 Follower 同步慢、Broker 网络/磁盘故障<\/td><\/tr><\/tbody><\/table>\n<p><strong>口诀：<\/strong> <code>积压看消费、风暴看心跳、发送看缓冲、漂移看元数据、磁盘看保留、副本看同步。<\/code><\/p>\n<p><strong>加分点：<\/strong> 万能第一步：<code>kafka-topics.sh --describe<\/code>（分区/ISR/Leader）+ 消费组 describe（lag）+ Broker 日志，三查定位。<\/p>\n<p><strong>追问：<\/strong> rebalance 风暴怎么根治？—— ① 调大 <code>session.timeout.ms<\/code> / <code>heartbeat.interval.ms<\/code>；② 处理逻辑提速，别超 <code>max.poll.interval.ms<\/code>；③ <strong>静态成员<\/strong>（<code>group.instance.id<\/code>）；④ 关掉不必要的心跳风暴源（GC 长停顿、网络抖动）。<\/p>"}, {"q": "7.5 延迟与吞吐指标速记？", "tag": "进阶", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li><strong>吞吐<\/strong>：TPS（每秒消息数）/ MBps；关键参数 batch、linger、压缩、并发。<\/li><li><strong>延迟<\/strong>：<code>end-to-end latency<\/code>（生产到消费可见）；<code>producer latency<\/code>（发出到 ack）；<code>fetch latency<\/code>。<\/li><li>关系：<strong>高吞吐与低延迟互相矛盾<\/strong> —— 攒批越大延迟越高；链路延迟 = 网络 RTT + 攒批等待 + 消费 poll 间隔。<\/li><li>常用工具：JMX 指标（<code>kafka.server:type=BrokerTopicMetrics<\/code>）、<code>kafka-run-class kafka.tools.GetOffsetShell<\/code>、Prometheus + Grafana。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>吞吐靠攒批，延迟怕攒批 —— 先定业务目标再调。<\/code><\/p>\n<p><strong>加分点：<\/strong> 长轮询（fetch）默认等待 <code>fetch.max.wait.ms<\/code>；生产加 <code>linger.ms=0<\/code> 可降延迟；消费 poll 间隔 = <code>max.poll.interval.ms<\/code> 内的一次循环，积压时延迟自然升高。<\/p>\n<p><strong>追问：<\/strong> 怎么测 Kafka 极限吞吐？—— 用 <code>kafka-producer-perf-test.sh<\/code> 压生产、<code>kafka-consumer-perf-test.sh<\/code> 压消费；观察<strong>是否是磁盘/网卡/GC 瓶颈<\/strong>。<\/p>\n<hr>"}]}, {"title": "08 高频场景题", "questions": [{"q": "8.1 消息丢失，完整排查链路？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong> 四段式排查（见 5.4）：<\/p>\n<ol><li><strong>生产端<\/strong>：确认 <code>acks<\/code> 是否 0/1、是否重试尽、发送是否抛异常未处理。<\/li><li><strong>Broker 端<\/strong>：确认 <code>min.insync.replicas<\/code>、<code>unclean<\/code> 是否开、ISR 是否收缩、副本数。<\/li><li><strong>消费端<\/strong>：确认 offset 提交时机（是否先提交后处理）。<\/li><li><strong>链路<\/strong>：看监控（Producer error rate、UnderReplicatedPartitions、lag 变化）倒推。<\/li><\/ol>\n<p><strong>口诀：<\/strong> <code>生产问 acks、Broker 问 ISR、消费问提交、全程看监控。<\/code><\/p>\n<p><strong>加分点：<\/strong> 面试答法：先定性\"哪一段可能丢\"，再逐个给证据（配置、日志、指标），最后给<strong>修复方案<\/strong>（acks=all、先处理再提交、副本 3、监控 ISR）。<\/p>\n<p><strong>追问：<\/strong> 如果已经发生了，怎么恢复？—— 生产侧：从源头重发（保留原始数据）；消费侧：offset 回退到丢失点重放（<code>kafka-consumer-groups.sh --reset-offsets<\/code>）；<strong>Broker 已删的消息无法找回<\/strong>，只能靠备份。<\/p>"}, {"q": "8.2 消息重复消费怎么解决？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li>重复的根源：Kafka 是<strong>至少一次<\/strong> —— 重试、rebalance、offset 提交失败都会导致重复。<\/li><li>解决三板斧（幂等消费）：<\/li><\/ul>\n<ol><li><strong>唯一键去重<\/strong>：消息带业务唯一 ID（订单号），消费端查 Redis <code>SETNX<\/code> / DB 唯一索引 / 幂等表。<\/li><li><strong>状态机幂等<\/strong>：处理逻辑本身幂等（如\"更新账户余额为 X\"而非\"余额+X\"）。<\/li><li><strong>事务兜底<\/strong>：消费 + 写库放同一事务（DB 唯一约束冲突回滚）。<\/li><\/ol>\n<p><strong>口诀：<\/strong> <code>重复不可怕，幂等来消化 —— 唯一键去重、接口幂等、事务兜底。<\/code><\/p>\n<p><strong>加分点：<\/strong> 最常用：<strong>\"消息 ID + Redis SETNX\"<\/strong>（value 为消费结果，TTL 覆盖业务时间窗），或 DB 建唯一索引（消息 id 作为唯一键），简单可靠。<\/p>\n<p><strong>追问：<\/strong> 重复窗口有多长？—— 可能跨越很久（offset 回退重放），所以<strong>幂等键不要设太短 TTL<\/strong>；极端场景（删库重放）要靠 DB 唯一索引永久兜底。<\/p>"}, {"q": "8.3 怎么保证消息顺序消费？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li><strong>生产端<\/strong>：同一业务 key → 同一分区（<code>key.hashCode() % partitions<\/code>）。<\/li><li><strong>Broker 端<\/strong>：分区内天然有序（append-only）。<\/li><li><strong>消费端<\/strong>：<strong>单分区内单线程消费<\/strong>（一个分区不会被组内两个消费者同时消费；但一个消费者可多线程，需要按 key 哈希路由到固定线程）。<\/li><li><strong>极端可靠<\/strong>：<code>max.in.flight=1<\/code> + 幂等（防止重试乱序）。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>key 进同分区、分区内单线程、重试不乱序 —— 三关守序。<\/code><\/p>\n<p><strong>加分点：<\/strong> 面试追问点：<strong>顺序与吞吐的平衡<\/strong> —— 可以\"每个分区一个线程\"或\"按 key 哈希分到 N 个桶线程\"，桶内有序、桶间并行。<\/p>\n<p><strong>追问：<\/strong> rebalance 会乱序吗？—— rebalance 后分区换消费者处理，<strong>新消费者从提交的 offset 继续<\/strong>，若旧消费者还有消息处理中未提交，可能乱序/重复 → 用 8.2 的幂等兜底。<\/p>"}, {"q": "8.4 大消息（>10MB）怎么处理？", "tag": "进阶", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ol><li><strong>不推荐直接塞<\/strong>：Kafka 单条默认 <code>message.max.bytes<\/code>=1MB，大消息占内存、拖慢 GC、消费网络慢。<\/li><li>方案一：<strong>消息传引用<\/strong> —— 大文件/大对象存 OSS/MinIO/DB，Kafka 只传 <strong>URL + 元数据<\/strong>（最常用）。<\/li><li>方案二：<strong>拆分成多条<\/strong>（块）+ 消费端组装。<\/li><li>方案三：调大 <code>message.max.bytes<\/code> / <code>max.request.size<\/code> / <code>fetch.message.max.bytes<\/code>（万不得已，影响性能）。<\/li><\/ol>\n<p><strong>口诀：<\/strong> <code>大对象进对象存储，Kafka 只跑元数据 —— 引用式消息。<\/code><\/p>\n<p><strong>加分点：<\/strong> 面试亮点：大消息对<strong>页缓存<\/strong>杀伤力大（挤掉热数据），还会让<strong>零拷贝失效<\/strong>；正确做法永远是\"消息瘦身\"。<\/p>\n<p><strong>追问：<\/strong> 必须传大 JSON 呢？—— 压缩（snappy/zstd）后再放，或拆成多条 + 顺序号 + 消费端 join。<\/p>"}, {"q": "8.5 百万/千万级消息积压怎么抢救？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ol><li><strong>扩容消费者<\/strong>（先扩到分区数上限）。<\/li><li><strong>扩分区<\/strong>（并行度不够时；注意 key 路由变化）。<\/li><li><strong>消费加速<\/strong>：批量写库、异步落库、下游削峰（加中间层）。<\/li><li><strong>如果只是临时大流量<\/strong>：允许 lag 存在（保留期内可追），监控不要误判为故障。<\/li><li><strong>极端情况<\/strong>：临时\"重放方案\" —— 另开消费者把积压消息转存到更大的集群/其他 MQ 慢慢处理。<\/li><\/ol>\n<p><strong>口诀：<\/strong> <code>先加消费者、再加分区、批量加速 —— 让 lag 先停涨，再慢慢消化。<\/code><\/p>\n<p><strong>加分点：<\/strong> 面试常考\"消费能力跟不上\"：瓶颈往往在<strong>下游 DB/外呼<\/strong>而不是 Kafka 本身；真正的解法是<strong>异步化 + 削峰填谷<\/strong>（MQ 的本质用途）。<\/p>\n<p><strong>追问：<\/strong> 积压期间消息会丢吗？—— 不会（保留期内）；但<strong>超时 retention 的消息会被清掉<\/strong>，所以优先处理接近过期窗口的数据，或临时调大 retention。<\/p>"}, {"q": "8.6 快问快答 15 连", "tag": "高频", "body": "<p><strong>Q1. Kafka 吞吐为什么高？<\/strong> 顺序写 + 页缓存 + 零拷贝 + 批量压缩 + 稀疏索引。<br><strong>Q2. 分区和消费者的关系？<\/strong> 一分区一消费者互斥，并行度 = 分区数。<br><strong>Q3. 消息会丢失吗？<\/strong> 默认至少一次；acks=all+ISR 缩小丢窗口；unclean 会丢。<br><strong>Q4. 重复消费怎么办？<\/strong> 幂等（唯一键去重）。<br><strong>Q5. 顺序消费怎么保证？<\/strong> 同 key 同分区 + 单线程消费。<br><strong>Q6. acks=0/1/all？<\/strong> 不等/Leader/ISR 全确认。<br><strong>Q7. HW 和 LEO？<\/strong> LEO 队尾，HW 是 ISR 最矮，消费者只看 <HW。<br><strong>Q8. ISR 是什么？<\/strong> 与 Leader
