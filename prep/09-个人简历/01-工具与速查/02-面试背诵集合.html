保持同步的副本集合。<br><strong>Q9. offset 存哪？<\/strong> 内部 Topic <code>__consumer_offsets<\/code>（老版 ZK）。<br><strong>Q10. 幂等原理？<\/strong> PID + seq，Broker 查重。<br><strong>Q11. 事务谁协调？<\/strong> Transaction Coordinator + <code>__transaction_state<\/code>。<br><strong>Q12. 消费组重平衡触发？<\/strong> 增删消费者、分区数变化、心跳超时。<br><strong>Q13. 消息积压怎么办？<\/strong> 扩消费者/分区 + 批量 + 异步。<br><strong>Q14. Controller 干什么？<\/strong> 选举、上下线、重分配、广播元数据。<br><strong>Q15. 为什么移除 ZK？<\/strong> ZK 是性能/运维瓶颈，KRaft 自管元数据。<\/p>"}, {"q": "8.7 送命题：Kafka 和 Flink 怎么配合？", "tag": "进阶", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li>Flink 作为<strong>消费者<\/strong>：从 Kafka 拉流式计算（窗口、聚合、状态），结果写回 Kafka/DB/下游。<\/li><li><strong>精确一次<\/strong>：Flink checkpoint 把 <strong>Kafka offset 存进 state<\/strong>，恢复时从 checkpoint 的 offset 续消费 → 端到端 exactly-once。<\/li><li>Kafka 当<strong>缓冲层<\/strong>：削峰 + 解耦 + 可重放（Flink 出错了能回放修复）。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>Kafka 当蓄水池，Flink 当水厂，checkpoint 记水位 —— 可回溯可恢复。<\/code><\/p>\n<p><strong>加分点：<\/strong> 面试：Kafka + Flink 是<strong>流处理黄金组合<\/strong>，难点是\"端到端精确一次\" = 源端（offset 进 state）+ 计算（checkpoint）+ 汇端（两阶段提交/幂等写）。<\/p>\n<hr>"}]}, {"title": "09 ZooKeeper 核心概念", "questions": [{"q": "9.1 ZooKeeper 是什么？数据模型？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li>ZooKeeper 是 Apache 的<strong>分布式协调服务<\/strong>（源自 Hadoop 生态），为分布式系统提供<strong>一致性协调<\/strong>：配置管理、命名、锁、Leader 选举。<\/li><li><strong>数据模型<\/strong>：<strong>树形 ZNode 结构<\/strong>（类似文件系统），每个节点存<strong>数据<\/strong>（<1MB）+ <strong>元数据<\/strong>（版本号、ACL、时间戳）。<\/li><li><strong>核心承诺<\/strong>：<strong>强一致<\/strong>（ZAB 协议）、顺序性、原子性 —— 写操作全走 Leader，过半写入才算成功。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>ZK = 分布式系统的\"注册中心 + 文件系统\"，树形节点，强一致。<\/code><\/p>\n<p><strong>加分点：<\/strong> 经典组合：ZK 是 Kafka、HBase、Dubbo、Hadoop HA 的底层协调者 —— 它们都用 ZK 解决\"谁当主、谁在哪、配置是什么\"。<\/p>\n<p><strong>追问：<\/strong> 为什么 ZK 不适合存大数据？—— 节点默认 1MB 限制、全量加载内存、写是串行的；它是\"协调状态机\"，不是数据库。<\/p>"}, {"q": "9.2 ZNode 四种类型？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<table><thead><tr><th>类型<\/th><th>特点<\/th><th>场景<\/th><\/tr><\/thead><tbody><tr><td>持久节点（PERSISTENT）<\/td><td>手动删除才消失<\/td><td>配置、元数据<\/td><\/tr><tr><td>持久顺序节点<\/td><td>名字带递增序号，持久<\/td><td>公平锁排队<\/td><\/tr><tr><td>临时节点（EPHEMERAL）<\/td><td><strong>会话结束自动删除<\/strong><\/td><td>Broker/服务注册（挂了自动摘除）<\/td><\/tr><tr><td>临时顺序节点<\/td><td>临时 + 序号<\/td><td>分布式锁、Leader 选举<\/td><\/tr><\/tbody><\/table>\n<p><strong>口诀：<\/strong> <code>持久靠手动删，临时跟会话走，顺序自带编号 —— 四种节点组合出所有玩法。<\/code><\/p>\n<p><strong>加分点：<\/strong> 临时节点是 ZK 做\"<strong>心跳探活<\/strong>\"的关键：客户端会话（session）通过心跳维护，断连超过 <code>session.timeout<\/code> 节点即被删 → 服务故障自动摘除。<\/p>\n<p><strong>追问：<\/strong> 临时节点能带子节点吗？—— 可以带，但<strong>临时节点下不能建持久子节点<\/strong>（临时节点的生命周期随会话，子节点会失联）。<\/p>"}, {"q": "9.3 Watch 机制原理？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li><strong>Watch（监听）<\/strong>：客户端<strong>注册一次<\/strong>在节点上的监听（读操作可附带 watch）。<\/li><li><strong>触发<\/strong>：节点数据变化（set）、节点删除、子节点变化时，ZK <strong>通知客户端<\/strong>（异步回调）。<\/li><li><strong>一次性<\/strong>：watch <strong>触发一次后失效<\/strong>，要持续监听需重新注册（\"watch 是一次性的\"）。<\/li><li>保证：客户端能<strong>先收到通知再读到新数据<\/strong>（通知语义），但通知可能延迟，需配合重查。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>注册一次、变化通知、通知完失效 —— 要监听就得重新绑。<\/code><\/p>\n<p><strong>加分点：<\/strong> 面试亮点：watch 是 <strong>Push 通知<\/strong>，比轮询高效；但<strong>不能依赖 watch 拿数据<\/strong>，它只是\"变化提示\"，事件驱动的标准写法是\"收到通知 → 重新 getData 带 watch\"。<\/p>\n<p><strong>追问：<\/strong> 羊群效应（惊群）和 watch 的关系？—— 大量客户端 watch 同一节点，节点一变<strong>全部被唤醒<\/strong>（如抢锁失败者都监听同一把锁）→ 用<strong>顺序节点 + 只监听前一个节点<\/strong>规避（见 11.3）。<\/p>"}, {"q": "9.4 ZK 典型应用场景？", "tag": "高频", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ol><li><strong>命名服务<\/strong>：节点路径当唯一 ID（<code>/services/user-service/node1<\/code>）。<\/li><li><strong>配置管理<\/strong>：配置放节点，客户端 watch 变更即时感知（老牌方案，现在多用 Apollo/Nacos）。<\/li><li><strong>分布式锁<\/strong>：临时顺序节点实现公平锁（见 11 章）。<\/li><li><strong>Leader 选举<\/strong>：多个候选抢建临时节点，建成功的当 Leader；Leader 挂了节点消失，触发再选（Kafka Controller、HBase HMaster）。<\/li><li><strong>注册中心<\/strong>：服务上线注册、下线自动摘除（Dubbo 早期方案）。<\/li><li><strong>集群元数据/协调<\/strong>：Kafka、Hadoop HA 都靠它。<\/li><\/ol>\n<p><strong>口诀：<\/strong> <code>命名、配置、锁、选举、注册 —— ZK 五虎将。<\/code><\/p>\n<p><strong>加分点：<\/strong> 面试对比：Nacos 是\"ZK + 配置中心\"的升级版（AP 模式、自带控制台）；ZK 定位是<strong>通用协调原语<\/strong>，写强一致、读可扩展性弱。<\/p>\n<p><strong>追问：<\/strong> 注册中心选 ZK 还是 Nacos？—— 高可用优先（可用性 > 一致性，容忍短暂不一致）选 Nacos（AP）；强一致元数据场景选 ZK（CP）。<\/p>\n<hr>"}]}, {"title": "10 ZK 一致性原理", "questions": [{"q": "10.1 ZAB 协议两阶段？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li><strong>ZAB（ZooKeeper Atomic Broadcast）<\/strong> = 崩溃恢复 + 消息广播两个阶段。<\/li><\/ul>\n<ol><li><strong>崩溃恢复（选举）<\/strong>：Leader 挂了，集群进入选举，选出新 Leader，新 Leader <strong>同步日志<\/strong>（把未提交的提案补齐/丢弃），收敛到一致状态。<\/li><li><strong>消息广播（主从复制）<\/strong>：Leader 写请求 → 生成<strong>提案（Proposal，带 ZXID）<\/strong> → 广播给 Follower → <strong>过半 ack<\/strong> → Leader 提交并通知 Follower 提交。<\/li><\/ol>\n<ul><li>保证：<strong>已提交的提案不丢、未提交的不能出现在新 Leader 上<\/strong>（ZAB 的核心正确性）。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>先选主补齐账，再广播过半提交 —— ZAB 两阶段。<\/code><\/p>\n<p><strong>加分点：<\/strong> 与 Raft 对比：ZAB 强调<strong>恢复后不能出现\"已提交被丢弃\"<\/strong>（丢弃旧 Leader 未提交日志要交给新 Leader 决定）；Raft 是\"任期 + 日志匹配\"。<\/p>\n<p><strong>追问：<\/strong> 过半提交为什么能保证强一致？—— 两个过半集合<strong>必有交集<\/strong>（quorum 数学性质），所以任何已提交的提案一定被\"存活多数\"记住，新 Leader 从多数派恢复日志必含已提交项。<\/p>"}, {"q": "10.2 Leader 选举流程与 ZXID？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li><strong>ZXID（事务 ID）<\/strong>：64 位 = <strong>纪元（epoch，高 32 位）+ 事务计数（低 32 位）<\/strong>；每次 Leader 换届 epoch+1，提案计数从 0 重来。<\/li><li><strong>Fast Leader Election 流程<\/strong>：<\/li><\/ul>\n<ol><li>每个 Follower 投<strong>自己<\/strong>（<code>(epoch, zxid, myid)<\/code>）。<\/li><li>收到投票，比较 <code>(epoch, zxid)<\/code>，<strong>大的赢<\/strong>，改投对方并广播。<\/li><li>某节点收到<strong>过半<\/strong>同意的投票 → 当选 Leader。<\/li><li>新 Leader 向其他节点发\"成为 Leader\"消息，旧 Leader 退位，Follower 同步日志。<\/li><\/ol>\n<ul><li>优先级：<strong>epoch 高 > zxid 高（数据新）> myid 大<\/strong>。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>先比纪元、再比日志新、最后比 id —— 数据新者当老大。<\/code><\/p>\n<p><strong>加分点：<\/strong> 选 Leader 的核心逻辑：<strong>谁的数据最新谁当主<\/strong>（zxid 最大），避免新 Leader 还得倒数据；选举期间集群<strong>不可写<\/strong>（只读旧数据），是 ZK 的\"短暂不可用窗口\"。<\/p>\n<p><strong>追问：<\/strong> 选举会永远选不出来吗？—— 不会：超过半数节点在线就一定能选出（quorum 定理）；少于半数在线 → 集群整体不可用（ZAB 的牺牲可用性保一致性）。<\/p>"}, {"q": "10.3 脑裂与过半机制？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li><strong>脑裂<\/strong>：网络分区把集群分成两半，两边各自选 Leader → 数据分裂。<\/li><li><strong>解决：过半（quorum）机制<\/strong> —— 只有拿到 <strong>N/2+1<\/strong> 票的 Leader 才有效；分区后<strong>只能有一半有资格<\/strong>（多数派），少数派再选也凑不齐票，<strong>自动作废<\/strong>。<\/li><li>例：5 节点集群，分区成 3+2 → 3 的一方选 Leader 成功，2 的一方永远选不出来 → 没有双主。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>过半才称王，分裂必一边 —— 少数派翻不了天。<\/code><\/p>\n<p><strong>加分点：<\/strong> 这是\"CP 系统\"（如 ZK）的经典取舍：<strong>宁可牺牲可用性，也不允许双主写脏数据<\/strong>；对比 Redis 主从（AP 系）需要额外哨兵/仲裁处理脑裂。<\/p>\n<p><strong>追问：<\/strong> 机器数必须奇数吗？—— 建议奇数：5 台能扛 2 台故障，6 台也只扛 2 台（多数 = 4），<strong>奇数用更少的机器获得同样的容错<\/strong>。<\/p>"}, {"q": "10.4 ZK 读性能和顺序性细节？", "tag": "进阶", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li><strong>读请求<\/strong>：任意节点（Leader/Follower）都能直接返回本地数据（<strong>主从分离读<\/strong>）→ 读性能可扩展。<\/li><li><strong>写请求<\/strong>：全部转发 Leader，<strong>串行处理<\/strong>（单线程事务队列）→ 写性能有上限（几千~上万 TPS）。<\/li><li><strong>顺序性保证<\/strong>：① 全局有序（同一 Leader 串行提案）；② 因果有序（客户端会话内先发先生效）；③ <strong>读可能读到旧数据<\/strong>（Follower 读未同步）→ 强一致性读要走 <code>sync()<\/code> 或读 Leader。<\/li><li>ZXID 保证 <strong>watch 通知顺序<\/strong>与<strong>事务提交顺序<\/strong>一致。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>读扩散、写串行 —— 读可能旧，写一定新。<\/code><\/p>\n<p><strong>加分点：<\/strong> 面试亮点：ZK 是\"<strong>读写不对称<\/strong>\"系统：读强一致只是\"最终一致 + 顺序一致\"（Follower 可能滞后），要线性一致性读需加 sync。这也是\"ZK 不适合当缓存\"的原因之一。<\/p>\n<p><strong>追问：<\/strong> ZK 能当缓存用吗？—— 不合适：读是\"过半无写冲突\"的本地读还行，但<strong>节点容量小、内存型、写串行<\/strong>，缓存该用 Redis。<\/p>\n<hr>"}]}, {"title": "11 ZK 分布式锁与实战", "questions": [{"q": "11.1 分布式锁三方案对比？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<table><thead><tr><th>方案<\/th><th>原理<\/th><th>优点<\/th><th>缺点<\/th><\/tr><\/thead><tbody><tr><td><strong>Redis SETNX<\/strong><\/td><td>内存加锁 + 过期<\/td><td>快、简单<\/td><td>主从切换丢锁（RedLock 复杂）、看门狗<\/td><\/tr><tr><td><strong>ZK 临时顺序节点<\/strong><\/td><td>最小序号拿锁<\/td><td>强一致、<strong>天然防死锁<\/strong>（会话断开自动释放）、公平<\/td><td>性能低（写串行）、重<\/td><\/tr><tr><td><strong>DB 唯一索引/悲观锁<\/strong><\/td><td>数据库行锁<\/td><td>简单、可靠<\/td><td>性能差、单点<\/td><\/tr><\/tbody><\/table>\n<p><strong>口诀：<\/strong> <code>Redis 快但可能抖，ZK 稳但慢，DB 兜底最朴素。<\/code><\/p>\n<p><strong>加分点：<\/strong> 面试结论：<strong>业务量小/要绝对正确选 ZK（Curator）<\/strong>，高并发低延迟选 Redis（可接受极小概率的锁失效）；DB 锁只做兜底。<\/p>\n<p><strong>追问：<\/strong> Redis 锁为什么会失效？—— 主从异步复制：加锁在 Master，Master 挂了 Slave 顶上但锁数据没复制过去 → 新主上没有锁 → 两个客户端同时持锁。ZK 因\"过半同步\"无此问题。<\/p>"}, {"q": "11.2 ZK 实现分布式锁（临时顺序节点）？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li>加锁：在锁节点下创建<strong>临时顺序节点<\/strong> <code>/locks/lock_0000000010<\/code>。<\/li><li>判断：<strong>序号最小<\/strong>的节点 = 持锁者。<\/li><li>等待：非最小者 <strong>watch 前一个节点<\/strong>（只监听比它小的最近一个），前一个删除 → 自己被唤醒 → 再判断是否最小。<\/li><li>释放：删除自己的节点（或会话断开自动删）。<\/li><li>优点：<strong>公平<\/strong>（按申请顺序）、<strong>无死锁<\/strong>（临时节点随会话消亡）、避免惊群（只 watch 前一个）。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>排号叫号 —— 建临时顺序节点排队，最小号拿锁，只看前面一个。<\/code><\/p>\n<p><strong>加分点：<\/strong> 这是<strong>羊群效应<\/strong>的经典解法：如果所有等待者都 watch 锁根节点，锁一释放全被唤醒（羊群效应/惊群）；\"watch 前驱\"把唤醒面收敛到 O(1)。<\/p>\n<p><strong>追问：<\/strong> 持锁者挂了会怎样？—— 会话超时 → 临时节点被 ZK 自动删除 → 前驱消失 → 后继被唤醒抢锁，<strong>不需要超时续租<\/strong>（对比 Redis 要看门狗）。<\/p>"}, {"q": "11.3 羊群效应（惊群）详解？", "tag": "进阶", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li><strong>羊群效应<\/strong>：很多客户端同时等待同一事件，事件触发时<strong>全部被唤醒<\/strong>去竞争，但只有 1 个能赢，其余<strong>白忙 + 产生大量请求<\/strong>。<\/li><li>ZK 场景：① 大量客户端 watch 同一锁节点 → 锁释放时全员唤醒；② 大量客户端 watch Leader 节点 → Leader 挂全员抢选举。<\/li><li>解法：<strong>只监听自己关心的最小对象<\/strong> —— 锁场景\"只 watch 前驱节点\"、选举场景\"只 watch 比自己小的节点\"，把 O(n) 唤醒降为 O(1)。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>惊群 = 一石惊起千鸟飞；对症下药 = 只盯眼前那一个。<\/code><\/p>\n<p><strong>加分点：<\/strong> Curator 的 InterProcessMutex 就是\"临时顺序节点 + watch 前驱\"实现；面试说出\"避免羊群效应\"就是加分项。<\/p>\n<p><strong>追问：<\/strong> 还有别处见过羊群效应吗？—— 有：缓存失效后多线程同时回源（缓存击穿）、Kafka 多消费者抢分区、Redis 分布式锁释放后多客户端自旋 —— 解法思路一致：<strong>收窄竞争面 + 退避<\/strong>。<\/p>"}, {"q": "11.4 Curator 框架速记？", "tag": "中频", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li><strong>Curator<\/strong> = ZK 客户端封装（Netflix 开源），比原生 API 好用太多。<\/li><li>常用 API：<\/li><li><code>CuratorFramework<\/code> 连接管理（重试策略 <code>RetryNTimes<\/code>/<code>ExponentialBackoffRetry<\/code>）。<\/li><li><code>InterProcessMutex<\/code>（排他锁）/ <code>InterProcessReadWriteLock<\/code>（读写锁）。<\/li><li><code>LeaderLatch<\/code> / <code>LeaderSelector<\/code>（Leader 选举）。<\/li><li><code>PathChildrenCache<\/code>（子节点监听，替代手写 watch）。<\/li><li>使用注意：<strong>必须自己维护会话与重试<\/strong>，超时时间、连接串配置好。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>Curator 是瑞士军刀 —— 锁、选举、缓存监听一套齐。<\/code><\/p>\n<p><strong>加分点：<\/strong> 面试答\"用过 ZK 吗\"→ 用 Curator 实现过分布式锁/注册中心，是常见项目题；记得提\"ZK 强一致所以锁可靠，但吞吐受限\"。<\/p>\n<hr>"}]}, {"title": "12 Kafka 与 ZK 的关系及演进", "questions": [{"q": "12.1 Kafka 到底用 ZK 干什么？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong>（2.8 之前）<\/p>\n<ol><li><strong>Broker 注册/发现<\/strong>：Broker 启动注册 <code>/brokers/ids/{id}<\/code>，下线自动消失。<\/li><li><strong>Topic 元数据<\/strong>：分区数、副本分配方案存 <code>/brokers/topics/{topic}<\/code>。<\/li><li><strong>Controller 选举<\/strong>：<code>/controller<\/code> 临时节点，谁建谁当 Controller。<\/li><li><strong>消费者组/offset<\/strong>（0.9 之前）：旧版消费位移也存 ZK（后迁到 Kafka 内部 Topic）。<\/li><li><strong>ISR 变化通知<\/strong>（老版本）：Broker 上报 ISR 变更，Controller 通过 ZK watch 感知。<\/li><\/ol>\n<p><strong>口诀：<\/strong> <code>注册、元数据、Controller、老位移 —— ZK 是 Kafka 的\"总台账\"。<\/code><\/p>\n<p><strong>加分点：<\/strong> 面试重点：<strong>消息数据不进 ZK<\/strong>，ZK 只存元数据；且 Kafka 对 ZK 是<strong>重度依赖<\/strong> —— ZK 挂 → 元数据无法变更，集群\"只能消费存量\"。<\/p>\n<p><strong>追问：<\/strong> 为什么后来的 Kafka 要摆脱 ZK？—— 见 12.2：ZK 成为性能/运维瓶颈，且 Kafka 社区想要\"一组件架构\"。<\/p>"}, {"q": "12.2 为什么 Kafka 要移除 ZK（KRaft）？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ol><li><strong>运维复杂度<\/strong>：多一套 ZK 集群要部署、监控、调优，故障面翻倍。<\/li><li><strong>元数据扩容瓶颈<\/strong>：分区数巨大时（几万分区）ZK 的元数据读写、watch 压力大，成为上限。<\/li><li><strong>故障恢复慢<\/strong>：ZK 会话超时触发 Controller 切换、大面积 rebalance 风暴。<\/li><li><strong>架构简洁<\/strong>：Kafka 自己用 <strong>Raft 协议<\/strong>管元数据（KRaft，KIP-500），Broker 同时当\"控制器节点\"。<\/li><li><strong>可演进<\/strong>：支持元数据自己管理后，Kafka 能独立演进（如更细粒度权限、topic 级故障域）。<\/li><\/ol>\n<p><strong>口诀：<\/strong> <code>少一套 ZK、快一点恢复、扛更大集群 —— 自己当家做主（KRaft）。<\/code><\/p>\n<p><strong>加分点：<\/strong> KRaft：<strong>Quorum Controller（奇数个）<\/strong> 用 Raft 管理元数据，元数据日志存自己的磁盘；3.0+ 支持、4.0 起 ZK 模式移除。<\/p>\n<p><strong>追问：<\/strong> KRaft 和 ZK 模式有啥区别？—— 部署从\"Kafka + ZK\"变\"纯 Kafka\"；Controller 从\"ZK 抢临时节点\"变\"Raft 选主\"；其余 Producer/Consumer 协议<strong>完全不变<\/strong>，迁移透明。<\/p>"}, {"q": "12.3 ZK 模式 → KRaft 迁移注意？", "tag": "进阶", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ol><li>工具：<code>kafka-storage.sh random-uuid<\/code>（生成 cluster id）→ <code>kafka-storage.sh format<\/code>（格式化元数据目录）→ 配 <code>process.roles=broker,controller<\/code>。<\/li><li>兼容：2.8~3.x 支持<strong>混合模式<\/strong>（ZK 与 KRaft 共存迁移）。<\/li><li>迁移影响：<strong>滚动重启<\/strong>，老 Broker 用 ZK、新节点用 KRaft，逐步切换。<\/li><li>生产建议：<strong>新集群直接上 KRaft<\/strong>（3.x 稳定版），老集群规划低峰迁移。<\/li><\/ol>\n<p><strong>口诀：<\/strong> <code>新装用 KRaft，老集群滚动切，broker 和 controller 一肩挑。<\/code><\/p>\n<p><strong>加分点：<\/strong> 面试如果聊到\"最新的 Kafka 架构\"，提 KRaft 就是加分项；能说出\"4.0 彻底移除 ZK\"更好。<\/p>\n<p><strong>追问：<\/strong> KRaft 还是单 Controller 吗？—— 不是：<strong>奇数个控制器节点组成 quorum<\/strong>（如 3），Raft 选主，Leader 挂自动切换，天生高可用。<\/p>"}, {"q": "12.4 Kafka + ZK 经典面试连环问？", "tag": "高频", "body": "<p><strong>Q1. ZK 挂了 Kafka 会怎样？<\/strong> 元数据不能变更（建 Topic/上下线/选举停摆），存量消费生产继续。<br><strong>Q2. Controller 挂了谁顶？<\/strong> 其他 Broker 重新竞选（ZK 模式抢 /controller，KRaft Raft 选主）。<br><strong>Q3. 为什么 Kafka 不用 Redis 做协调？<\/strong> 需要强一致 + 持久化 + 有序，ZK/ZAB/Raft 是专门设计。<br><strong>Q4. ZK 节点是 CP 还是 AP？<\/strong> CP（强一致，牺牲可用性）。<br><strong>Q5. 消费 offset 现在存哪？<\/strong> Kafka 内部 Topic <code>__consumer_offsets<\/code>（早先存 ZK）。<\/p>\n<hr>"}]}, {"title": "13 综合快问快答与送命题", "questions": [{"q": "13.1 综合快问快答 20 连", "tag": "高频", "body": "<p><strong>Kafka 篇：<\/strong><br><strong>Q1. 一个分区最多被几个消费者消费？<\/strong> 同一消费组内 1 个。<br><strong>Q2. Topic 分区数怎么定？<\/strong> 吞吐目标 + 消费者并行度 + 扩容成本，别贪多。<br><strong>Q3. 消息格式是什么？<\/strong> 二进制的 RecordBatch（带 CRC、压缩、时间戳、key/value）。<br><strong>Q4. 消费者组 offset 提交失败会怎样？<\/strong> 重复消费（至少一次）。<br><strong>Q5. <code>__consumer_offsets<\/code> 怎么分区？<\/strong> 按 groupId 哈希到 50 个分区。<br><strong>Q6. Kafka 能当缓存吗？<\/strong> 不适合：无随机读、无 TTL 语义，是日志不是 KV。<br><strong>Q7. 为什么拉模式而不是推模式？<\/strong> 消费者控速、批量、服务端无状态。<br><strong>Q8. 分区数和副本数啥区别？<\/strong> 分区是并行度，副本是冗余度。<br><strong>Q9. Leader 读写，Follower 干嘛？<\/strong> 备份 + 随时顶班。<br><strong>Q10. 消息时间戳存哪？<\/strong> 每条消息带 timestamp，配 timeindex 按时间查。<\/p>\n<p><strong>ZK 篇：<\/strong><br><strong>Q11. ZK 节点数据大小限制？<\/strong> 默认 1MB。<br><strong>Q12. ZK 是 AP 还是 CP？<\/strong> CP（过半机制，可用性让位一致性）。<br><strong>Q13. 临时节点什么时候删？<\/strong> 会话超时/关闭。<br><strong>Q14. Watch 是一次性的吗？<\/strong> 是，触发即失效。<br><strong>Q15. 选举怎么保证数据最新者当选？<\/strong> ZXID（epoch + 计数）最大者。<br><strong>Q16. 脑裂怎么防？<\/strong> 过半 quorum，少数派选不出主。<br><strong>Q17. ZK 为什么不适合高并发写？<\/strong> 写全走 Leader 串行。<br><strong>Q18. 分布式锁公平吗？<\/strong> 临时顺序节点版是公平锁。<br><strong>Q19. Curator 是什么？<\/strong> ZK 的高层封装客户端。<br><strong>Q20. ZK 写请求必须走 Leader？<\/strong> 是，Follower 收到会转发给 Leader。<\/p>"}, {"q": "13.2 送命题：设计一个消息中间件，怎么答？", "tag": "进阶", "body": "<p><strong>答案骨架：<\/strong> 从 Kafka 抄作业：<\/p>\n<ol><li><strong>存储<\/strong>：append-only 日志 + 分段（Segment）+ 稀疏索引 + 顺序写磁盘。<\/li><li><strong>高吞吐<\/strong>：批量（攒批）+ 压缩 + 零拷贝（sendfile/mmap）+ 页缓存。<\/li><li><strong>分布式<\/strong>：Topic 分区 + 副本（ISR 思想：维护同步副本集合）+ 控制器选举。<\/li><li><strong>消费模型<\/strong>：拉模式 + 消费组 + offset 管理（内部 Topic 存位移）。<\/li><li><strong>可靠性<\/strong>：acks 分级 + 幂等（序号去重）+ 事务（协调器 + 提交标记）。<\/li><li><strong>一致性<\/strong>：元数据用 Raft（KRaft 思路）或 ZK。<\/li><\/ol>\n<p><strong>口诀：<\/strong> <code>日志存储 + 批量压缩 + 分区副本 + 拉消费 + 幂等事务 —— 一套 Kafka 从零到一。<\/code><\/p>\n<p><strong>加分点：<\/strong> 面试官要听的不是\"背 Kafka 参数\"，而是<strong>设计取舍<\/strong>：为什么顺序写快、为什么 ISR 不全部同步、为什么拉不推 —— 答出权衡就是高分。<\/p>\n<p><strong>追问：<\/strong> 如果要你优化 Kafka，改哪里？—— ① 元数据与数据面分离（已做 KRaft）；② 分区数膨胀问题（共享日志/Tiered Storage 分层存储）；③ 大消息处理（对象存储引用）；④ 跨集群事务（可参考各开源方案）。<\/p>"}, {"q": "13.3 面试高频坑与避坑指南", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ol><li><strong>\"Kafka 消息不会丢\" ❌<\/strong> —— 默认至少一次，不同配置下会丢，要说清楚条件。<\/li><li><strong>\"ISR 就是所有副本\" ❌<\/strong> —— ISR 是\"同步中\"的副本（AR 才是全部）。<\/li><li><strong>\"顺序保证 = 全局有序\" ❌<\/strong> —— 只有分区内有序。<\/li><li><strong>\"offset 存 ZK\" ❌<\/strong> —— 0.9+ 存 <code>__consumer_offsets<\/code>（ZK 时代已过去）。<\/li><li><strong>\"ZK 存了 Kafka 的消息\" ❌<\/strong> —— ZK 只存元数据。<\/li><li><strong>\"幂等 = exactly-once\" ❌<\/strong> —— 幂等只管单分区单会话；exactly-once 要事务 + 幂等消费。<\/li><li><strong>\"ZAB 就是 Raft\" ❌<\/strong> —— 类似但不同：ZAB 有\"恢复后不丢已提交\"的强保证细节。<\/li><li><strong>\"ZK 读也强一致\" ❌<\/strong> —— 读可走 Follower（可能旧），要线性读需 sync。<\/li><\/ol>\n<p><strong>口诀：<\/strong> <code>丢不丢看配置、序不序看分区、offset 在 Kafka 不在 ZK、幂等不是万能的 —— 八个坑，背完不踩。<\/code><\/p>\n<p><strong>加分点：<\/strong> 面试说\"<strong>至少一次 + 幂等消费 = 业务级不重不丢<\/strong>\"是被普遍认可的落地方案；能主动指出坑说明你真懂。<\/p>\n<hr>\n<blockquote>背诵节奏建议：第 1 遍只背\"口诀\"；第 2 遍背\"答案骨架\"；第 3 遍口述\"加分点\"；考前只看\"追问\"。<br>祝面试顺利，Offer 到手 🎉<\/blockquote>"}]}], "qcount": 60}]}, {"id": "nginx", "name": "Nginx", "icon": "🌐", "color": "#10b981", "docs": [{"sub": "考前背诵版", "chapters": [{"title": "01 核心概念与架构", "questions": [{"q": "1.1 Nginx 是什么？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li>Nginx（engine X）是俄罗斯人 Igor Sysoev 写的，C 语言，2004 年开源，轻量级 Web 服务器。<\/li><li><strong>三大角色<\/strong>：HTTP 服务器（静态资源）、反向代理服务器、邮件代理服务器（POP3/IMAP/SMTP）。<\/li><li><strong>核心卖点<\/strong>：高并发（单机 5 万~10 万连接）、低内存占用、模块化、高可靠性（master/worker 多进程）。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>三大角色 + 两高一低 = 静态服务、反代、邮件；并发高、内存低、可靠高。<\/code><\/p>\n<p><strong>加分点：<\/strong> 不是\"单进程事件驱动\"这一个点，而是 <strong>进程模型 + 事件驱动 + 异步非阻塞 I/O + 模块化 + 内存池<\/strong> 五件套组合拳。<\/p>\n<p><strong>追问：<\/strong> Nginx 算不算 Web Server？—— 算，但动态处理弱，动态请求要转发给 fastcgi（PHP-FPM）/ uwsgi / 应用容器。<\/p>"}, {"q": "1.2 正向代理 vs 反向代理？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<table><thead><tr><th>维度<\/th><th>正向代理<\/th><th>反向代理<\/th><\/tr><\/thead><tbody><tr><td>代理对象<\/td><td>客户端（替客户端访问服务器）<\/td><td>服务器（替服务器接请求）<\/td><\/tr><tr><td>谁隐藏<\/td><td>隐藏客户端<\/td><td>隐藏服务器<\/td><\/tr><tr><td>部署位置<\/td><td>客户端侧<\/td><td>服务器侧<\/td><\/tr><tr><td>典型场景<\/td><td>翻墙、公司代理<\/td><td>负载均衡、网关、CDN 回源<\/td><\/tr><\/tbody><\/table>\n<p><strong>口诀：<\/strong> <code>正隐客户端，反隐服务器。<\/code><\/p>\n<p><strong>加分点：<\/strong> Nginx 默认做反向代理；做正向代理要配 <code>resolver<\/code> + <code>proxy_pass $http_host$request_uri<\/code>，且原生只支持 HTTP 正向代理，HTTPS 正向代理要加 <code>ngx_http_proxy_connect_module<\/code>（或 OpenResty）。<\/p>"}, {"q": "1.3 master / worker 进程模型？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li><strong>master 进程<\/strong>：不处理业务，只做管理 —— 读配置、fork worker、收信号（HUP/QUIT/USR2）、监控 worker、平滑升级。<\/li><li><strong>worker 进程<\/strong>：真正干活的进程，事件循环处理海量连接，互相独立。<\/li><li><strong>两个辅助进程<\/strong>：cache manager（定时清过期缓存）、cache loader（启动时把磁盘缓存索引加载进内存）。<\/li><li>worker 数量默认 1，建议 <strong>= CPU 核数<\/strong>（<code>worker_processes auto<\/code>）。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>master 管，worker 干；一个挂，master 拉。<\/code><\/p>\n<p><strong>加分点：<\/strong> 为什么用多进程不用多线程？—— 高并发下多进程内存隔离更稳，某个请求崩了不会拖垮整个服务，且避免线程锁竞争。worker 之间通过共享内存（limit_req 计数）通信。<\/p>"}, {"q": "1.4 Nginx vs Apache？", "tag": "中频", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li>Apache：进程/线程池模型（MPM），<strong>每连接一线程/进程<\/strong>，并发几千就吃力；支持 .htaccess 目录级配置，动态处理强（PHP 模块内置）。<\/li><li>Nginx：<strong>事件驱动 + 异步非阻塞<\/strong>，一个进程管几万连接；静态文件快（sendfile 零拷贝）；动态弱，要转发。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>Apache 一连接一线程，Nginx 一进程万连接。<\/code><\/p>\n<p><strong>加分点：<\/strong> 现代主流架构 = Nginx 做入口（静态+反代+负载），动态请求转发给 Apache/Tomcat/PHP-FPM。<\/p>"}, {"q": "1.5 nginx.conf 配置块结构？", "tag": "基础", "body": "<p><strong>答案骨架：<\/strong> 由外到内：<\/p>\n<pre><code>main（全局）→ events（事件模型）\n            → http（HTTP 服务）\n                → server（虚拟主机：监听/域名/ssl）\n                    → location（URI 匹配规则）\n                → upstream（后端服务器组）\n            → stream（四层 TCP/UDP 代理，需编译 stream 模块）<\/code><\/pre>\n<p>配置继承：<strong>子块继承父块，子块可覆盖<\/strong>（类似 CSS 的层叠）。<\/p>\n<p><strong>口诀：<\/strong> <code>全局 > events > http > server > location，upstream 挂在 http 下。<\/code><\/p>\n<p><strong>加分点：<\/strong> <code>include<\/code> 实现配置拆分；<code>nginx -t<\/code> 检查语法；<code>nginx -s reload<\/code> 平滑生效。<\/p>\n<hr>"}]}, {"title": "02 高性能原理", "questions": [{"q": "2.1 为什么 Nginx 快？核心六板斧", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ol><li><strong>事件驱动<\/strong>：基于 epoll/kqueue，一个进程同时监听几万个 socket，无阻塞。<\/li><li><strong>异步非阻塞 I/O<\/strong>：读写不等待，事件就绪才处理。<\/li><li><strong>多进程无锁设计<\/strong>：worker 间共享状态极少，连接分配用原子操作。<\/li><li><strong>内存池<\/strong>：每请求独立内存池，减少 malloc/free 与碎片。<\/li><li><strong>零拷贝<\/strong>：静态文件 sendfile 内核态直接搬，不经用户态。<\/li><li><strong>模块化精简<\/strong>：核心小，功能按需编译。<\/li><\/ol>\n<p><strong>口诀：<\/strong> <code>事件驱动、异步非阻塞、无锁多进程、内存池、零拷贝、模块化 —— 六板斧砍出高性能。<\/code><\/p>\n<p><strong>加分点：<\/strong> 本质是 <strong>用少量进程 + 事件循环 对抗 海量并发连接<\/strong>，把\"线程上下文切换\"开销换成\"事件回调\"。<\/p>"}, {"q": "2.2 同步阻塞 / 同步非阻塞 / 异步阻塞 / 异步非阻塞？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li><strong>同步阻塞<\/strong>：发起 I/O 后线程卡住等结果。（BIO）<\/li><li><strong>同步非阻塞<\/strong>：发起后立刻返回，轮询状态（浪费 CPU）。（NIO 轮询）<\/li><li><strong>异步阻塞<\/strong>：罕见组合，基本无意义。<\/li><li><strong>异步非阻塞<\/strong>：发起后干别的，事件就绪内核回调通知。（AIO / Nginx 的 I/O 多路复用）<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>阻塞=等着，非阻塞=轮着，异步=回调。Nginx 是异步非阻塞（事件通知）。<\/code><\/p>\n<p><strong>加分点：<\/strong> Nginx 实际用 <strong>I/O 多路复用（epoll）+ 非阻塞 socket<\/strong>：把 fd 交给内核，就绪了内核告诉你，不用轮询、不用等。<\/p>"}, {"q": "2.3 epoll 为什么比 select / poll 快？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li>select：fd 上限 1024，每次调用把全量 fd 从用户态拷到内核态，内核线性扫描，O(n)。<\/li><li>poll：取消 1024 限制（链表），但仍是 <strong>全量拷贝 + 线性扫描<\/strong>，O(n)。<\/li><li>epoll：<strong>事件就绪通知<\/strong>，注册后内核维护红黑树，只返回\"就绪的 fd\"（就绪链表），O(1)；<strong>零拷贝<\/strong>（mmap 共享内存，无需每次拷全量）。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>select/poll 全量轮询，epoll 就绪通知 —— 前者 O(n)，后者 O(1)。<\/code><\/p>\n<p><strong>加分点：<\/strong> epoll 三个 API：<code>epoll_create<\/code> / <code>epoll_ctl<\/code>（注册、改、删）/ <code>epoll_wait<\/code>（等就绪）。ET（边沿触发，只通知一次，要一次性读完）vs LT（水平触发，没读完一直通知）。<\/p>"}, {"q": "2.4 Nginx 事件驱动处理一个请求的流程？", "tag": "进阶", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ol><li>监听 socket 有新连接 → epoll 返回可读事件 → accept 建立连接，注册读写事件。<\/li><li>读事件就绪 → 读请求头/请求体（非阻塞，没读完继续等）。<\/li><li>解析请求 → 走 HTTP 阶段钩子（rewrite、access、content…）。<\/li><li>内容阶段：静态文件直接 sendfile / 动态请求 proxy_pass 转发。<\/li><li>写事件就绪 → 非阻塞写出响应 → 关闭或 keepalive 复用连接。<\/li><\/ol>\n<p><strong>口诀：<\/strong> <code>accept → 读 → 解析 → 处理（静态/代理）→ 写 → 关/复用。全程不阻塞。<\/code><\/p>\n<p><strong>加分点：<\/strong> 一个 worker 的 epoll 实例管理所有连接，任何时刻都在\"少数活跃事件\"上忙，这就是高并发的秘密。<\/p>"}, {"q": "2.5 惊群问题与 accept_mutex / reuseport？", "tag": "进阶", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li><strong>惊群<\/strong>：多个 worker 同时监听同一 listen socket，一个连接进来，<strong>所有 worker 都被唤醒<\/strong>去抢 accept，但只有一个成功，其余空转 —— 浪费 CPU。<\/li><li>解决一：<strong>accept_mutex on<\/strong>（默认开）：同一时刻只有一个 worker 持有 accept 锁，其他 sleep，减少唤醒。<\/li><li>解决二：<strong>reuseport<\/strong>（Linux 3.9+）：内核把连接<strong>哈希分发<\/strong>到各 worker 的独立 socket，天然无竞争，性能更好（需编译支持）。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>惊群=一群 worker 抢一个连接；accept_mutex 排队抢，reuseport 内核分。<\/code><\/p>\n<p><strong>加分点：<\/strong> reuseport 还解决了负载均衡问题（按哈希分发）；缺点是需要内核支持和编译选项，生产环境可用 <code>listen 80 reuseport;<\/code>。<\/p>"}, {"q": "2.6 worker 进程数与最大并发怎么算？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li><code>worker_processes<\/code> = CPU 核数（IO 密集可 2 倍核数，避免进程切换）。<\/li><li><code>worker_connections<\/code> 每个 worker 的最大连接数（默认 1024，建议 4096~10240）。<\/li><li><strong>最大并发（HTTP 场景）≈ worker_processes × worker_connections ÷ 4<\/strong>（每个请求约占用 2 个连接：accept 一个 + 可能 upstream 一个；2 连接/请求 → ÷2，再留余量 ÷4）。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>并发 ≈ 进程数 × 每进程连接数 ÷ 4（÷2 是连接账，÷4 是留余量）。<\/code><\/p>\n<p><strong>加分点：<\/strong> 还要调 <strong>系统级限制<\/strong>：<code>ulimit -n<\/code>（文件描述符上限）、内核 <code>net.core.somaxconn<\/code>（accept 队列）、<code>net.ipv4.tcp_max_syn_backlog<\/code>（半连接队列）。<\/p>"}, {"q": "2.7 平滑 reload / 平滑升级的原理？", "tag": "高频", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li><strong>reload（HUP）<\/strong>：master 重新读配置 → 校验 → fork 新 worker → 新请求走新 worker，旧 worker 处理完存量连接后优雅退出。<strong>整个过程不断服务<\/strong>。<\/li><li><strong>平滑升级（USR2 + WINCH）<\/strong>：master 起新 master + 新 worker，<strong>新旧版本共存<\/strong>，存量连接旧进程处理，新连接新进程处理，<code>kill -QUIT 旧master<\/code> 收尾。<\/li><li>关键：worker 是 <strong>按需退出<\/strong> 的（<code>worker_shutdown_timeout<\/code> 可限时）。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>HUP 换配置换 worker，USR2 换二进制 —— 都是\"新老共存、优雅退旧\"。<\/code><\/p>\n<p><strong>加分点：<\/strong> 回滚 = 恢复旧二进制 + 再走一遍 USR2；二进制文件会备份为 <code>nginx.oldbin<\/code>。<\/p>\n<hr>"}]}, {"title": "03 反向代理", "questions": [{"q": "3.1 反向代理原理与最小配置？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong> 客户端访问 Nginx（只认 Nginx），Nginx 把请求<strong>原样转发<\/strong>给后端（Tomcat/SpringBoot/Go/Node），后端响应再回传客户端。客户端不知道后端存在。<\/p>\n<pre><code class=\"lang-nginx\">server {\n    listen 80;\n    location /api/ {\n        proxy_pass http://192.168.1.10:8080;\n    }\n}<\/code><\/pre>\n<p><strong>口诀：<\/strong> <code>统一入口，替后端接客，客户端只见 Nginx。<\/code><\/p>\n<p><strong>加分点：<\/strong> 反向代理在 OSI 七层之上（HTTP 层），能做 7 层路由、改写、缓存；4 层用 <code>stream<\/code> 块。<\/p>"}, {"q": "3.2 proxy_pass 带路径与不带路径的区别？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li><strong>不带路径<\/strong> <code>proxy_pass http://后端;<\/code>：URI <strong>原样透传<\/strong>。<\/li><li><strong>带路径<\/strong> <code>proxy_pass http://后端/xxx/;<\/code>：<strong>location 匹配部分被替换<\/strong>为 <code>/xxx/<\/code>。<\/li><\/ul>\n<pre><code class=\"lang-nginx\">location /api/ { proxy_pass http://back/; }\n\nlocation /api/ { proxy_pass http://back; }<\/code><\/pre>\n<p><strong>口诀：<\/strong> <code>不带路径原样传，带路径换前缀 —— proxy_pass 末尾的 / 决定命运。<\/code><\/p>\n<p><strong>加分点：<\/strong> 关键看 proxy_pass 的 URI 部分是否以 <code>/<\/code> 结尾：带路径（含变量时）会替换 location 前缀；正则 location 里不能带 URI。<\/p>"}, {"q": "3.3 怎么把真实客户端 IP 传给后端？", "tag": "高频", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li>用请求头携带：<code>X-Forwarded-For: 客户端IP, 上一跳代理IP<\/code>（每层代理追加）。<\/li><li>Nginx 配置：<\/li><\/ul>\n<pre><code class=\"lang-nginx\">proxy_set_header X-Real-IP $remote_addr;        # 真实 IP\nproxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # 追加链\nproxy_set_header Host $host;<\/code><\/pre>\n<ul><li>后端取 <code>X-Real-IP<\/code> 或 <code>X-Forwarded-For<\/code> 第一段（注意<strong>伪造风险<\/strong>：多层代理时要信任前置代理，用 <code>real_ip<\/code> 模块 + <code>set_real_ip_from<\/code> 从可信代理链取）。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>X-Real-IP 给真身，X-Forwarded-For 记全链。<\/code><\/p>\n<p><strong>加分点：<\/strong> 生产一般 Nginx 只信任来自 LVS/云负载均衡的 IP（<code>set_real_ip_from<\/code>），防止客户端伪造 XFF。<\/p>"}, {"q": "3.4 WebSocket 反向代理怎么配？", "tag": "高频", "body": "<p><strong>答案骨架：<\/strong> WebSocket 是<strong>长连接 + 升级协议<\/strong>，需要：① 设置 Upgrade 头；② 加大超时（默认 60s 会断）。<\/p>\n<pre><code class=\"lang-nginx\">location /ws/ {\n    proxy_pass http://ws_backend;\n    proxy_http_version 1.1;                 # 必须，keepalive 需要\n    proxy_set_header Upgrade $http_upgrade; # 升级协议\n    proxy_set_header Connection \"upgrade\";  # 保持长连接\n    proxy_read_timeout 3600s;               # 心跳间隔决定\n    proxy_send_timeout 3600s;\n}<\/code><\/pre>\n<p><strong>口诀：<\/strong> <code>HTTP 1.1 + Upgrade + Connection upgrade + 大超时 = WebSocket 四件套。<\/code><\/p>\n<p><strong>加分点：<\/strong> 超时建议略大于客户端心跳间隔；TCP 层还要考虑 <code>keepalive<\/code> 与防火墙 idle 超时。<\/p>"}, {"q": "3.5 反向代理超时与重试？", "tag": "进阶", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li>超时三兄弟：<code>proxy_connect_timeout<\/code>（建连，默认 60s）、<code>proxy_send_timeout<\/code>（写，默认 60s）、<code>proxy_read_timeout<\/code>（读/等响应，默认 60s）。<\/li><li>重试：<code>proxy_next_upstream<\/code>（默认 <code>error timeout<\/code>）—— 失败后<strong>换下一台上游重试<\/strong>，可加 <code>http_502 http_504<\/code>。<\/li><li>配合：<code>proxy_next_upstream_tries 3<\/code>（最多试 3 台）。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>连不上、写不出、等不到，三超时；挂了就 next_upstream 换台。<\/code><\/p>\n<p><strong>加分点：<\/strong> 注意<strong>非幂等请求（POST）重试有风险<\/strong>，可 <code>proxy_next_upstream non_idempotent<\/code> 谨慎开启。<\/p>"}, {"q": "3.6 proxy_buffering 缓冲是什么？", "tag": "进阶", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li>默认 <code>proxy_buffering on<\/code>：Nginx 先把后端响应<strong>收进缓冲区<\/strong>再发给客户端。<\/li><li>优点：慢客户端不拖累后端（后端瞬间写完就走）；缺点：首字节延迟。<\/li><li>相关参数：<code>proxy_buffer_size<\/code>（头缓冲，默认 4k~8k）、<code>proxy_buffers<\/code>（body 缓冲）、<code>proxy_busy_buffers_size<\/code>（发往客户端的大小）。<\/li><li>流式场景（SSE/下载）可 <code>proxy_buffering off<\/code> 或调大 <code>proxy_buffers<\/code>。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>缓冲 = Nginx 当蓄水池，后端秒完、慢客户端慢慢喝。<\/code><\/p>\n<p><strong>加分点：<\/strong> SSE（Server-Sent Events）必须关缓冲或设 <code>X-Accel-Buffering: no<\/code>，否则流式数据被憋住。<\/p>\n<hr>"}]}, {"title": "04 负载均衡", "questions": [{"q": "4.1 Nginx 负载均衡原理？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong> <code>upstream<\/code> 定义后端服务器组，proxy_pass 指向组名，Nginx 按算法把请求分发给组内服务器，后端哪个\"活着且合格\"就分给谁。<\/p>\n<pre><code class=\"lang-nginx\">upstream backend {\n    server 192.168.1.11:8080 weight=3;\n    server 192.168.1.12:8080;\n    server 192.168.1.13:8080 backup;\n}\nserver {\n    location / { proxy_pass http://backend; }\n}<\/code><\/pre>\n<p><strong>口诀：<\/strong> <code>upstream 是池子，proxy_pass 是水龙头，算法决定水流向。<\/code><\/p>"}, {"q": "4.2 五大负载均衡算法？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ol><li><strong>轮询（默认）<\/strong>：依次分发，平均。<code>weight<\/code> 加权轮询按权重。<\/li><li><strong>ip_hash<\/strong>：按客户端 IP 哈希，<strong>同一 IP 固定同一台<\/strong>（会话保持）。<\/li><li><strong>least_conn<\/strong>：发给<strong>当前连接数最少<\/strong>的（长连接/慢请求友好）。<\/li><li><strong>url_hash<\/strong>：按 URL 哈希，同一 URL 固定一台（缓存命中友好，需 <code>hash $request_uri<\/code> 配置）。<\/li><li><strong>fair（第三方）<\/strong>：按<strong>响应时间<\/strong>分配（按后端最快）。<\/li><\/ol>\n<p><strong>口诀：<\/strong> <code>轮询排排坐，加权按分量，IP 哈希锁人，最少连接躲慢，URL 哈希锁资源。<\/code><\/p>\n<p><strong>加分点：<\/strong> 一致性哈希（<code>hash $request_uri consistent<\/code>）解决扩缩容时大量重映射问题，缓存场景必备。<\/p>"}, {"q": "4.3 upstream server 常用参数？", "tag": "高频", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li><code>weight<\/code>：权重（配合轮询）。<\/li><li><code>max_fails=N<\/code>：连续失败 N 次判定不可用（默认 1）。<\/li><li><code>fail_timeout=时间<\/code>：失败计数窗口 + 熔断时间（默认 10s，同时是标记不可用的时长）。<\/li><li><code>backup<\/code>：备份机，<strong>主机全挂才启用<\/strong>。<\/li><li><code>down<\/code>：手动下线，不参与分发。<\/li><li><code>max_conns<\/code>：最大并发连接数（防打爆单机）。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>weight 分量、max_fails 记过、fail_timeout 关禁闭、backup 备胎、down 停用、max_conns 限流。<\/code><\/p>\n<p><strong>加分点：<\/strong> <code>max_fails=0<\/code> 表示不做失败检测（永不熔断），适合健康检查由外部负责的场景。<\/p>"}, {"q": "4.4 健康检查：被动 vs 主动？", "tag": "进阶", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li><strong>被动（默认）<\/strong>：靠真实请求判断 —— 请求失败计数达 max_fails，fail_timeout 内不再分发；无真实流量就检测不到。<\/li><li><strong>主动（商业版 / 开源补丁 / OpenResty）<\/strong>：Nginx 定时主动发探测请求（<code>health_check interval=5s<\/code>），不依赖业务流量。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>被动=看真流量踩雷，主动=定时自己敲门。<\/code><\/p>\n<p><strong>加分点：<\/strong> 开源版常用方案：OpenResty + lua-resty-healthcheck，或 LVS/云负载均衡器做主动探测。<\/p>"}, {"q": "4.5 负载均衡的会话保持怎么做？", "tag": "高频", "body": "<p><strong>答案骨架：<\/strong> 三种主流方案：<\/p>\n<ol><li><strong>ip_hash / hash 算法<\/strong>：同一来源 IP 固定同一后端（简单，但 IP 变化/NAT 会失效）。<\/li><li><strong>sticky cookie（商业版）<\/strong>：种 cookie 绑定后端。<\/li><li><strong>应用层会话共享<\/strong>：Session 放 Redis（无状态化，最推荐，不依赖负载均衡策略）。<\/li><\/ol>\n<p><strong>口诀：<\/strong> <code>哈希锁 IP、cookie 锁会话、Redis 一劳永逸。<\/code><\/p>\n<p><strong>加分点：<\/strong> 面试加分点：<strong>无状态化才是正解<\/strong> —— 服务端 Session 移到 Redis/分布式缓存，负载均衡随便切。<\/p>"}, {"q": "4.6 灰度发布 + upstream 长连接？", "tag": "进阶", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li><strong>灰度<\/strong>：① 权重灰度（新版本 weight=1 先放量）；② 按头灰度（<code>map $http_user_agent<\/code> / 指定参数路由到灰度池）；③ 按 IP 白名单灰度（<code>geo<\/code> 模块）。<\/li><\/ul>\n<pre><code class=\"lang-nginx\">upstream prod { server 10.0.0.1:8080; }\nupstream gray { server 10.0.0.2:8080; }\nmap $http_canary $pool {\n    default prod;   # 默认生产池\n    \"1\"     gray;   # 请求头 canary:1 走灰度池\n}<\/code><\/pre>\n<ul><li><strong>upstream 长连接<\/strong>：<code>upstream { keepalive 32; }<\/code> + 转发时 <code>proxy_http_version 1.1<\/code> + <code>Connection \"\"<\/code>，减少频繁建连开销。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>灰度三招：权重放量、按头分流、IP 白名单；keepalive 32 省握手。<\/code><\/p>\n<p><strong>加分点：<\/strong> 灰度发布配合监控：先 1% → 5% → 50% → 100%，异常立即 <code>down<\/code> 或改回 prod。<\/p>\n<hr>"}]}, {"title": "05 静态资源与缓存", "questions": [{"q": "5.1 root 与 alias 的区别？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li><strong>root<\/strong>：把 location 匹配的 URI <strong>拼在 root 路径后面<\/strong> → 文件 = root + 完整URI。<\/li><li><strong>alias<\/strong>：把 location 匹配部分<strong>替换<\/strong>为 alias 路径 → 文件 = alias + 剩余URI。<\/li><\/ul>\n<pre><code class=\"lang-nginx\">location /static/ { root /data/www; }\n\nlocation /static/ { alias /data/files/; }<\/code><\/pre>\n<p><strong>口诀：<\/strong> <code>root 是拼接，alias 是替换。alias 末尾要带 /，root 不用。<\/code><\/p>\n<p><strong>加分点：<\/strong> alias 只能用在 location 里；正则 location 用 alias 时要注意捕获组。<\/p>"}, {"q": "5.2 静态资源浏览器缓存怎么配？", "tag": "高频", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<pre><code class=\"lang-nginx\">location ~* \\.(js|css|png|jpg|svg)$ {\n    expires 30d;                 # 强缓存：Cache-Control: max-age=2592000\n    add_header Cache-Control \"public, immutable\";\n    etag on;                     # 协商缓存（默认开）\n}<\/code><\/pre>\n<ul><li><strong>强缓存<\/strong>（200 from cache）：<code>Expires<\/code> / <code>Cache-Control: max-age<\/code>。<\/li><li><strong>协商缓存<\/strong>（304）：<code>ETag<\/code>（内容哈希）/ <code>Last-Modified<\/code>。<\/li><li>关键：<strong>带 hash 的文件名（webpack contenthash）才能放心用 max-age 永久缓存<\/strong>；不带 hash 的用 <code>no-cache<\/code> 每次协商。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>带 hash 锁死 max-age，不带 hash 走 304。<\/code><\/p>\n<p><strong>加分点：<\/strong> 面试点：更新策略 —— 文件名 hash 变了 → URL 变了 → 必然回源新文件，缓存自动失效，无需手动刷新。<\/p>"}, {"q": "5.3 gzip 压缩怎么配？", "tag": "高频", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<pre><code class=\"lang-nginx\">gzip on;\ngzip_comp_level 5;                # 1-9，5 性价比最高\ngzip_min_length 1k;               # 小于 1k 不压（压了更亏）\ngzip_types text/plain text/css application/javascript application/json image/svg+xml;\ngzip_vary on;                     # 返回 Vary: Accept-Encoding<\/code><\/pre>\n<ul><li>只压缩文本类（html/js/css/json/svg）；<strong>图片/视频本身已压缩，再 gzip 收益低还耗 CPU<\/strong>。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>文本才压，1k 起步，level 5，图片别动。<\/code><\/p>\n<p><strong>加分点：<\/strong> 现代可上 <strong>Brotli（br）<\/strong> 比 gzip 再小 15%~20%；开启后检查响应头是否带 <code>Content-Encoding: gzip<\/code>。<\/p>"}, {"q": "5.4 sendfile 零拷贝原理？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li>传统读文件发网络：磁盘 → 内核缓冲 → 用户态 → 内核 socket 缓冲 → 网卡，<strong>4 次拷贝 + 4 次上下文切换<\/strong>。<\/li><li><code>sendfile<\/code>：磁盘 → 内核缓冲 → <strong>直接<\/strong> socket 缓冲 → 网卡，<strong>2 次拷贝（还可用 DMA）<\/strong>，全程不经过用户态。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>sendfile = 数据在内核里走 VIP 通道，不进用户态。<\/code><\/p>\n<p><strong>加分点：<\/strong> <code>sendfile on<\/code>（默认开）只对静态文件生效；配合 <code>tcp_nopush on<\/code>（攒包发）、<code>tcp_nodelay on<\/code>（小包快发）。<\/p>"}, {"q": "5.5 proxy_cache 代理缓存？", "tag": "进阶", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<pre><code class=\"lang-nginx\">proxy_cache_path /data/nginx_cache levels=1:2 keys_zone=mycache:100m max_size=10g inactive=60m;\nserver {\n    location / {\n        proxy_cache mycache;              # 开缓存\n        proxy_cache_key $scheme$host$uri; # 缓存键\n        proxy_cache_valid 200 301 302 10m; # 哪些状态码缓存多久\n        proxy_cache_valid 404 1m;\n        proxy_cache_use_stale error timeout updating; # 后端挂了用旧缓存兜底\n    }\n}<\/code><\/pre>\n<ul><li>原理：以 <code>proxy_cache_key<\/code> 为键，把后端响应<strong>缓存到磁盘<\/strong>，相同键直接返回。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>keys_zone 定池子，proxy_cache_key 定钥匙，valid 定保质期，use_stale 兜底。<\/code><\/p>\n<p><strong>加分点：<\/strong> <code>proxy_cache_use_stale updating<\/code>（缓存更新时旧值先顶着，防止缓存击穿）；<code>X-Cache-Status: HIT/MISS<\/code> 看命中率。<\/p>"}, {"q": "5.6 open_file_cache 与断点续传？", "tag": "进阶", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<pre><code class=\"lang-nginx\">open_file_cache max=1000 inactive=20s;     # 缓存文件句柄/元数据\nopen_file_cache_valid 30s;                 # 校验间隔\nopen_file_cache_min_uses 2;                # 访问 2 次以上才缓存\nopen_file_cache_errors on;                 # 也缓存\"找不到\"的结果<\/code><\/pre>\n<ul><li><strong>断点续传<\/strong>：Nginx 原生支持 <code>Range<\/code> 请求（206 Partial Content），<code>proxy_set_header Range $http_range<\/code> 透传；大文件下载默认支持。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>open_file_cache 缓存句柄省 open/close；Range 请求天生支持断点续传。<\/code><\/p>\n<p><strong>加分点：<\/strong> 断点续传配合 <code>expires<\/code> 让客户端缓存部分内容；CDN 场景务必透传 Range，否则视频拖动全废。<\/p>\n<hr>"}]}, {"title": "06 location 与 rewrite", "questions": [{"q": "6.1 location 匹配优先级？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong> 优先级从高到低：<\/p>\n<ol><li><code>= <\/code> 精确匹配（最高）。<\/li><li><code>^~<\/code> 前缀匹配，命中后<strong>不再看正则<\/strong>。<\/li><li><code>~<\/code> / <code>~*<\/code> 正则匹配（区分/不区分大小写），<strong>按书写顺序<\/strong>取第一个命中。<\/li><li><code>/<\/code> 通用前缀匹配（最长前缀）。<\/li><\/ol>\n<p><strong>口诀：<\/strong> <code>等于 > 脱帽前缀（^~）> 正则（~）> 最长普通前缀（/）。<\/code><\/p>\n<p><strong>加分点：<\/strong> 完整判定流程：先精确 <code>=<\/code>，再 <code>^~<\/code> 前缀（命中即停），再按顺序扫正则（命中即停），最后最长前缀；正则优先级高于普通前缀（除非前缀是 ^~）。<\/p>"}, {"q": "6.2 location 匹配示例？", "tag": "高频", "body": "<pre><code class=\"lang-nginx\">location = /a      { ... }  # 只匹配 /a\nlocation ^~ /img/  { ... }  # 前缀匹配，命中后正则不再看\nlocation ~ \\.png$  { ... }  # 正则：.png 结尾\nlocation /api/     { ... }  # 普通前缀\nlocation /         { ... }  # 兜底<\/code><\/pre>\n<ul><li>请求 <code>/a<\/code> → 精确；<code>/img/1.png<\/code> → <code>^~<\/code>（正则的 \\.png$ 不会生效）；<code>/x/1.png<\/code> → 正则；<code>/api/user<\/code> → 前缀；<code>/other<\/code> → 兜底。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>越具体的匹配越优先，^~ 是正则的\"免死金牌\"。<\/code><\/p>"}, {"q": "6.3 rewrite 指令与四个 flag？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<pre><code class=\"lang-nginx\">rewrite ^/old/(.*)$ /new/$1 permanent;   # 301\nrewrite ^/user/(\\d+)$ /profile?id=$1 last; # 内部跳转<\/code><\/pre>\n<p>四个 flag：<\/p>\n<ul><li><code>last<\/code>：停止 rewrite，<strong>重新进入 location 匹配<\/strong>（换 location 处理）。<\/li><li><code>break<\/code>：停止 rewrite，<strong>留在当前 location<\/strong>，不再匹配。<\/li><li><code>redirect<\/code>：302 临时跳转。<\/li><li><code>permanent<\/code>：301 永久跳转。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>last 重进赛场，break 原地躺平，redirect 临时走，permanent 永久走。<\/code><\/p>\n<p><strong>加分点：<\/strong> <code>last<\/code> 与 <code>break<\/code> 的区别是经典题：last 后再按新 URI 匹配 location；break 直接在当前 location 继续执行剩余指令（如 proxy_pass）。<\/p>"}, {"q": "6.4 if 指令的陷阱？", "tag": "进阶", "body": "<p><strong>答案骨架：<\/strong> if 在 location 里行为<strong>不可预测<\/strong>（官方文档原话：\"if is evil\"），只有以下场景安全：<\/p>\n<ul><li><code>return<\/code>、<code>rewrite<\/code>、<code>set<\/code> 这几个指令在 if 里是可靠的。<\/li><li>其他（proxy_pass、try_files 等放 if 里）会产生诡异 bug。<\/li><\/ul>\n<pre><code class=\"lang-nginx\">if ($request_method = POST) { return 405; }   # 安全用法<\/code><\/pre>\n<ul><li>替代方案：需要复杂条件路由用 <code>map<\/code>、<code>geo<\/code>、<code>server 拆分<\/code>、<code>location 嵌套<\/code>。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>if 里只放 return / rewrite / set，其他都别碰。<\/code><\/p>\n<p><strong>加分点：<\/strong> 典型坑：if 里写 proxy_pass 会按默认 server 处理或产生意外行为；官方推荐\"多 location + map\"代替 if 逻辑。<\/p>"}, {"q": "6.5 try_files 原理？", "tag": "高频", "body": "<p><strong>答案骨架：<\/strong> 按顺序尝试文件/URI，<strong>第一个命中的生效<\/strong>，全不命中走最后兜底：<\/p>\n<pre><code class=\"lang-nginx\">location / {\n    try_files $uri $uri/ /index.html;   # 文件 → 目录 → 兜底 index.html\n}<\/code><\/pre>\n<ul><li><code>$uri<\/code>：真实文件路径；<code>$uri/<\/code>：目录（会找 index）；<code>/index.html<\/code>：最后兜底（内部重定向）。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>try_files 依次找，找到即停，找不到走最后一个。<\/code><\/p>\n<p><strong>加分点：<\/strong> 是 <strong>SPA history 路由刷新不 404<\/strong> 的核心方案；也可配合 <code>=404<\/code> 显式兜底。<\/p>"}, {"q": "6.6 SPA history 路由刷新 404 怎么解决？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong> 原因：前端 history 路由刷新时，浏览器请求真实路径（如 /user/123），Nginx 找不到该文件 → 404。解决：<strong>所有非文件请求都回退到 index.html<\/strong>（由前端路由接管）：<\/p>\n<pre><code class=\"lang-nginx\">location / {\n    root /data/dist;\n    try_files $uri $uri/ /index.html;\n}\nlocation /assets/ {        # 静态资源目录要单独放行\n    root /data/dist;\n    expires 30d;\n}<\/code><\/pre>\n<p><strong>口诀：<\/strong> <code>try_files 兜底 index.html，静态资源目录单独放行。<\/code><\/p>\n<p><strong>加分点：<\/strong> 面试追问：API 请求不能也兜底到 index.html → API 用独立 location 转发后端；否则接口 404 会返回 HTML。<\/p>\n<hr>"}]}, {"title": "07 限流与访问控制", "questions": [{"q": "7.1 漏桶 vs 令牌桶？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li><strong>漏桶（Leaky Bucket）<\/strong>：请求像水进桶，桶底按<strong>固定速率<\/strong>漏水 → <strong>限速恒定<\/strong>，溢出则丢弃/排队。适合<strong>平滑突发、保护后端<\/strong>（nginx limit_req 默认漏桶）。<\/li><li><strong>令牌桶（Token Bucket）<\/strong>：按固定速率往桶里<strong>加令牌<\/strong>，请求要拿令牌才能走 → <strong>允许一定突发<\/strong>（桶里攒的令牌可瞬间消耗）。适合<strong>允许短时突刺<\/strong>。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>漏桶：进多出少，速率恒定；令牌桶：攒令牌，允许爆发。<\/code><\/p>\n<p><strong>加分点：<\/strong> Nginx 的 limit_req 是漏桶；令牌桶一般用 Redis 实现（Lua/Java）或在网关层（如 Kong/APISIX）配置。<\/p>"}, {"q": "7.2 limit_req 配置与 burst/nodelay？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<pre><code class=\"lang-nginx\">limit_req_zone $binary_remote_addr zone=req:10m rate=10r/s;\nserver {\n    location /api/ {\n        limit_req zone=req burst=20 nodelay;\n    }\n}<\/code><\/pre>\n<ul><li><code>rate=10r/s<\/code>：平均速率 10 请求/秒（漏桶出口）。<\/li><li><code>burst=20<\/code>：桶容量，允许<strong>瞬时多来 20 个<\/strong>（排队或直接过）。<\/li><li><code>nodelay<\/code>：突发请求<strong>不排队<\/strong>、直接放行（配合 burst 用）；不加 nodelay 则超出平均速率的请求会被<strong>延迟<\/strong>（排队）。<\/li><li>超限返回 503（可 <code>limit_req_status 429<\/code>）。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>rate 定平均，burst 给余量，nodelay 不排队 —— 三件套。<\/code><\/p>\n<p><strong>加分点：<\/strong> 排队 vs nodelay 是经典追问：有 nodelay 时突发立即处理但总量受 rate 约束；无 nodelay 时突发被延迟到\"匀速\"，体验差但后端稳。<\/p>"}, {"q": "7.3 limit_conn 连接数限制？", "tag": "中频", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<pre><code class=\"lang-nginx\">limit_conn_zone $binary_remote_addr zone=conn:10m;\nserver {\n    location /download/ {\n        limit_conn conn 5;   # 每个 IP 最多 5 个并发连接\n        limit_conn_status 503;\n    }\n}<\/code><\/pre>\n<ul><li>按 key（IP/UA 等）限制<strong>并发连接数<\/strong>，区别于 limit_req 的<strong>请求速率<\/strong>。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>limit_req 限速率，limit_conn 限并发。<\/code><\/p>\n<p><strong>加分点：<\/strong> 下载站限并发常用；也可按 <code>$server_name<\/code> 限制全站连接数。<\/p>"}, {"q": "7.4 allow / deny 访问控制？", "tag": "基础", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<pre><code class=\"lang-nginx\">location /admin/ {\n    allow 192.168.1.0/24;\n    allow 10.0.0.1;\n    deny all;           # 兜底拒绝\n}<\/code><\/pre>\n<ul><li>按<strong>顺序<\/strong>匹配：从上到下，第一个命中的生效。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>先 allow 白名单，再 deny all 兜底 —— 顺序就是规则。<\/code><\/p>\n<p><strong>加分点：<\/strong> 更细的控制用 <code>geo<\/code> 模块按 IP 分段给变量，再配合 if/limit；或 <code>auth_basic<\/code> 基础认证、<code>auth_request<\/code> 统一鉴权。<\/p>"}, {"q": "7.5 防盗链 + 接口防刷？", "tag": "高频", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<pre><code class=\"lang-nginx\">location ~* \\.(gif|jpg|png)$ {\n    valid_referers none blocked *.example.com;\n    if ($invalid_referer) { return 403; }\n}<\/code><\/pre>\n<ul><li>接口防刷三件套：<strong>limit_req（速率）+ limit_conn（并发）+ 业务层验证码/Token 鉴权<\/strong>。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>防盗链看 Referer，防刷靠 限速 + 限连 + 验证码。<\/code><\/p>\n<p><strong>加分点：<\/strong> Referer 可伪造，真正防盗链要<strong>签名 URL（时间戳 + token）<\/strong>；防刷要结合登录态、设备指纹、风控。<\/p>\n<hr>"}]}, {"title": "08 HTTPS 与安全", "questions": [{"q": "8.1 HTTPS 配置与握手流程？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<pre><code class=\"lang-nginx\">server {\n    listen 443 ssl;\n    server_name example.com;\n    ssl_certificate     /etc/nginx/cert.pem;      # 证书（含公钥）\n    ssl_certificate_key /etc/nginx/cert.key;      # 私钥\n    ssl_protocols TLSv1.2 TLSv1.3;\n    ssl_ciphers HIGH:!aNULL:!MD5;\n    # 80 端口跳转\n}<\/code><\/pre>\n<ul><li><strong>握手流程（TLS 1.2）<\/strong>：ClientHello → ServerHello + 证书 → 客户端验证证书 → 密钥交换（ECDHE/RSA）→ 双方生成会话密钥 → 对称加密通信。<\/li><li>混合加密：<strong>非对称（握手换密钥）+ 对称（传输数据）<\/strong>。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>证书验身、非对称换钥、对称传数 —— TLS 三连。<\/code><\/p>\n<p><strong>加分点：<\/strong> 证书链要配全（含中间证书），否则部分客户端报错；<code>ssl_session_cache shared:SSL:10m<\/code> 复用会话省握手。<\/p>"}, {"q": "8.2 HTTPS 性能怎么优化？", "tag": "进阶", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ol><li><code>ssl_session_cache shared:SSL:10m<\/code>（会话复用，省完整握手）。<\/li><li><code>ssl_session_timeout 10m<\/code>（会话过期）。<\/li><li><strong>TLS 1.3<\/strong>：1-RTT，会话恢复 0-RTT，握手更快。<\/li><li><code>ssl_ecdh_curve<\/code> 用高效曲线；OCSP Stapling（<code>ssl_stapling on<\/code>）减少证书验证往返。<\/li><li>HTTP/2 多路复用，一个连接并发请求。<\/li><\/ol>\n<p><strong>口诀：<\/strong> <code>会话缓存省握手，TLS1.3 减往返，HTTP/2 复连接。<\/code><\/p>\n<p><strong>加分点：<\/strong> OCSP Stapling 由服务器代查证书吊销状态并缓存，客户端少一次外呼。<\/p>"}, {"q": "8.3 HTTP/2 特性？", "tag": "中频", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li><strong>二进制分帧<\/strong>（不再文本解析）。<\/li><li><strong>多路复用<\/strong>：一个 TCP 连接并发多个请求（解决队头阻塞 I）。<\/li><li><strong>头部压缩 HPACK<\/strong>（静态+动态表）。<\/li><li><strong>服务端推送 Server Push<\/strong>（HTTP/2 原生，后被 HTTP/3 移除）。<\/li><li>开启：<code>listen 443 ssl http2;<\/code>。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>二进制、多路复用、头压缩、服务端推送 —— H2 四宝。<\/code><\/p>\n<p><strong>加分点：<\/strong> 追问：HTTP/2 的<strong>队头阻塞仍在 TCP 层<\/strong>（丢包重传阻塞），HTTP/3（QUIC，基于 UDP）彻底解决。<\/p>"}, {"q": "8.4 HSTS 与安全响应头？", "tag": "基础", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<pre><code class=\"lang-nginx\">add_header Strict-Transport-Security \"max-age=31536000; includeSubDomains\" always;\nadd_header X-Content-Type-Options \"nosniff\" always;\nadd_header X-Frame-Options \"SAMEORIGIN\" always;\nadd_header X-XSS-Protection \"1; mode=block\" always;\nadd_header Content-Security-Policy \"default-src 'self'\" always;<\/code><\/pre>\n<ul><li>HSTS：告诉浏览器<strong>强制 HTTPS<\/strong> 访问，防降级攻击/SSL 剥离。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>HSTS 锁 HTTPS，CSP 锁资源，X-Frame 锁嵌套。<\/code><\/p>"}, {"q": "8.5 安全加固清单？", "tag": "高频", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ol><li>隐藏版本号：<code>server_tokens off;<\/code>。<\/li><li>禁用不安全的 HTTP 方法：只留 GET/HEAD/POST（if 判断 method 返回 405）。<\/li><li>限制请求体：<code>client_max_body_size 10m;<\/code>（防大包攻击）。<\/li><li>限制超时与连接：<code>client_body_timeout<\/code>、limit_conn。<\/li><li>防目录遍历：<code>autoindex off;<\/code>（默认关）。<\/li><li>防 SQL 注入/XSS 由业务层处理，Nginx 可加 WAF（ModSecurity / OpenResty）。<\/li><li>最小权限：worker 用低权限用户跑。<\/li><\/ol>\n<p><strong>口诀：<\/strong> <code>藏版本、禁方法、限体积、限并发、关列表、上 WAF、低权限。<\/code><\/p>\n<hr>"}]}, {"title": "09 高可用架构", "questions": [{"q": "9.1 Keepalived + VIP 方案？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li>两台 Nginx（主/备）跑 keepalived，共享一个<strong>虚拟 IP（VIP）<\/strong>，客户端只访问 VIP。<\/li><li>keepalived 用 <strong>VRRP 协议<\/strong>：主节点定期发心跳，备节点收不到（超时）就<strong>抢 VIP<\/strong> 顶上。<\/li><li>故障检测：keepalived 通过脚本检查 nginx 进程/端口，挂了先降级再切 VIP。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>VIP 是招牌，VRRP 是心跳，谁活着谁扛招牌。<\/code><\/p>\n<p><strong>加分点：<\/strong> 追问：主备切换时间（默认秒级）；业务无感知靠<strong>连接迁移<\/strong>难，一般配合 DNS 短 TTL 或 LVS。<\/p>"}, {"q": "9.2 脑裂问题？", "tag": "进阶", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li><strong>脑裂<\/strong>：主备之间的心跳断了（网络分区），<strong>两边都以为自己是主<\/strong>，都绑 VIP → 双主写冲突、服务紊乱。<\/li><li>解决：① 心跳走<strong>独立网卡/专线<\/strong>；② 仲裁机制（<code>nopreempt<\/code>、脚本连第三方仲裁如数据库/锁）；③ VRRP 选举依赖优先级 + 多播隔离；④ 监控告警。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>心跳断了就分裂，仲裁+隔离治脑裂。<\/code><\/p>\n<p><strong>加分点：<\/strong> 云环境用云厂商 HA（如腾讯云 CLB / 阿里 SLB）更省心，天然解决脑裂。<\/p>"}, {"q": "9.3 LVS + Nginx 四七层架构？", "tag": "进阶", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li><strong>LVS（四层）<\/strong>：工作在传输层，只做 IP+端口转发，<strong>不解析 HTTP<\/strong>，性能极高（DR 模式转发效率最高），扛大流量。<\/li><li><strong>Nginx（七层）<\/strong>：应用层，做路由、rewrite、缓存、限流。<\/li><li>经典分层：<strong>DNS/LB（四层 LVS）→ Nginx（七层）→ 应用集群<\/strong>；LVS 在前面挡流量，Nginx 精细化分发。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>LVS 挡前面扛流量，Nginx 在后面精分发 —— 四层粗筛，七层细磨。<\/code><\/p>\n<p><strong>加分点：<\/strong> LVS 三种模式：NAT（改写地址）、DR（改 MAC，回包直连）、TUN（隧道）；DR 性能最好，要求后端和 LVS 同网段。<\/p>"}, {"q": "9.4 平滑升级与回滚细节？", "tag": "高频", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ol><li><code>kill -USR2 旧master<\/code> → 启动新 master + 新 worker（新老共存，新连接进新版）。<\/li><li><code>kill -WINCH 旧master<\/code> → 旧 worker 优雅退出（存量连接处理完）。<\/li><li><code>kill -QUIT 旧master<\/code> → 彻底退出旧进程。<\/li><\/ol>\n<ul><li><strong>回滚<\/strong>：旧二进制保留为 <code>nginx.oldbin<\/code>，重复 USR2/WINCH 流程切回去。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>USR2 上新，WINCH 退旧，QUIT 收尾；回滚再走一遍。<\/code><\/p>"}, {"q": "9.5 多级缓存架构与 CDN？", "tag": "进阶", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li>访问链路：<strong>浏览器缓存 → CDN 边缘 → LVS → Nginx（proxy_cache）→ 应用 → 数据库<\/strong>。<\/li><li>CDN：就近缓存静态资源，回源到源站（源站可用 Nginx 做缓存层）。<\/li><li>缓存刷新：CDN 按 URL/目录刷新、带版本号资源天然隔离。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>近处先挡：浏览器、CDN、Nginx 缓存；逐级回源。<\/code><\/p>\n<p><strong>加分点：<\/strong> 缓存一致性：资源带 contenthash 最稳；动态接口用 <code>Cache-Control: no-store<\/code> 或短 TTL。<\/p>\n<hr>"}]}, {"title": "10 日志与监控", "questions": [{"q": "10.1 access_log 格式与字段？", "tag": "高频", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<pre><code class=\"lang-nginx\">log_format main '$remote_addr - $remote_user [$time_local] \"$request\" '\n                '$status $body_bytes_sent \"$http_referer\" \"$http_user_agent\" '\n                '$request_time $upstream_response_time $upstream_addr';\naccess_log /var/log/nginx/access.log main;<\/code><\/pre>\n<p>关键字段：<code>$remote_addr<\/code>（客户端 IP）、<code>$status<\/code>（状态码）、<code>$request_time<\/code>（总耗时）、<code>$upstream_response_time<\/code>（后端耗时）、<code>$upstream_addr<\/code>（哪台上游）。<\/p>\n<p><strong>口诀：<\/strong> <code>IP、时间、请求、状态、大小、Referer、UA、耗时 —— 一条全记录。<\/code><\/p>\n<p><strong>加分点：<\/strong> <code>$request_time - $upstream_response_time<\/code> 可估算 Nginx 自身耗时（排队/网络）。<\/p>"}, {"q": "10.2 日志切割方案？", "tag": "高频", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li>方案一（官方）：<code>nginx -s reopen<\/code> + 外部定时（logrotate）：<\/li><\/ul>\n<pre><code class=\"lang-bash\">/var/log/nginx/*.log {\n    daily; rotate 30; compress;\n    postrotate { /usr/sbin/nginx -s reopen; }\n}<\/code><\/pre>\n<ul><li>方案二：<code>access_log<\/code> 支持 <code>timeiso8601<\/code> 变量按时间动态分文件（生产不推荐，句柄多）。<\/li><li>方案三：切割后必须 <code>nginx -s reopen<\/code>（USR1 信号），让 nginx 重开新文件句柄。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>移动旧日志 → USR1/reopen 开新句柄 —— 两步切日志。<\/code><\/p>\n<p><strong>加分点：<\/strong> 忘记 reopen 会导致日志继续写旧文件（句柄未释放），磁盘不释放。<\/p>"}, {"q": "10.3 stub_status 监控指标？", "tag": "中频", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<pre><code class=\"lang-nginx\">location /nginx_status {\n    stub_status on;\n    allow 127.0.0.1;  deny all;\n}<\/code><\/pre>\n<p>输出字段：<code>Active connections<\/code>（活跃连接）、<code>accepts<\/code>（累计接受）、<code>handled<\/code>（累计处理）、<code>requests<\/code>（累计请求）、<code>Reading/Writing/Waiting<\/code>（读/写/空闲 keepalive 连接）。<\/p>\n<p><strong>口诀：<\/strong> <code>活跃数、累计量、Reading/Writing/Waiting 三态。<\/code><\/p>\n<p><strong>加分点：<\/strong> 判断连接泄漏：<code>requests/handled<\/code> 长期小于 100% 说明有连接未正常处理；Waiting 太多说明 keepalive 空闲多。<\/p>"}, {"q": "10.4 502 / 504 / 499 怎么排查？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li><strong>502 Bad Gateway<\/strong>：Nginx 拿到<strong>无效响应<\/strong> —— 后端挂了/没起来/端口错/超时/防火墙。排查：后端进程、端口、日志。<\/li><li><strong>504 Gateway Timeout<\/strong>：Nginx 等后端响应<strong>超时<\/strong> —— 后端慢或卡死。排查：调大 <code>proxy_read_timeout<\/code>、查后端慢查询/死锁。<\/li><li><strong>499 Client Closed Request<\/strong>：<strong>客户端主动断开<\/strong>（Nginx 已发出请求但客户端等不及关了）—— 不是后端错误！排查：客户端超时设置、接口是否太慢、App 弱网。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>502 后端挂，504 后端慢，499 客户端跑。<\/code><\/p>\n<p><strong>加分点：<\/strong> 499 常见于移动端/网关超时设置过短；大量 499 说明接口响应太慢，客户端等不起。<\/p>"}, {"q": "10.5 常见 HTTP 状态码速记？", "tag": "基础", "body": "<p><strong>答案骨架：<\/strong> <code>200 成功 / 301 永久跳转 / 302 临时跳转 / 304 协商缓存未变 / 400 参数错 / 401 未认证 / 403 无权限 / 404 不存在 / 405 方法不允许 / 408 请求超时 / 413 请求体过大 / 429 限流 / 500 服务器错 / 502 网关错 / 503 服务不可用（过载/维护）/ 504 网关超时 / 499 客户端断开<\/code>。<\/p>\n<p><strong>口诀：<\/strong> <code>4 开头客户端错，5 开头服务器错，502/504 网关在中间。<\/code><\/p>\n<hr>"}]}, {"title": "11 性能优化", "questions": [{"q": "11.1 Nginx 性能优化清单？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ol><li><code>worker_processes<\/code> = CPU 核数；<code>worker_cpu_affinity<\/code> 绑核。<\/li><li><code>worker_connections<\/code> 调大到 4096~10240；<code>worker_rlimit_nofile<\/code> = worker_connections × 2。<\/li><li><code>use epoll<\/code>；开启 <code>accept_mutex<\/code> / reuseport。<\/li><li><code>sendfile on; tcp_nopush on; tcp_nodelay on;<\/code>。<\/li><li>gzip/Brotli 压缩文本资源。<\/li><li>静态资源 <code>expires<\/code> 长缓存 + contenthash。<\/li><li>上游 <code>keepalive 32<\/code> 长连接。<\/li><li>proxy 缓冲（buffering）挡慢客户端。<\/li><li>系统内核参数：<code>net.core.somaxconn<\/code>、<code>net.ipv4.tcp_tw_reuse<\/code>、<code>file-max<\/code>。<\/li><li>日志异步/最小化（<code>access_log off<\/code> 或 buffer）。<\/li><\/ol>\n<p><strong>口诀：<\/strong> <code>进程绑核、连接放大、零拷贝三件套、压缩缓存长连接、内核参数跟紧。<\/code><\/p>"}, {"q": "11.2 内核参数调优？", "tag": "进阶", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<pre><code class=\"lang-bash\">net.core.somaxconn = 65535        # accept 队列长度\nnet.ipv4.tcp_max_syn_backlog = 65535  # 半连接队列\nnet.ipv4.tcp_tw_reuse = 1         # TIME_WAIT 复用\nnet.ipv4.tcp_fin_timeout = 30     # 快速回收\nnet.core.rmem_max / wmem_max     # 内核 socket 缓冲上限\nfs.file-max = 1000000             # 全局 fd 上限<\/code><\/pre>\n<p>注意：<code>tcp_tw_recycle<\/code> 已废弃（NAT 环境出问题），别再开。<\/p>\n<p><strong>口诀：<\/strong> <code>队列放大、TIME_WAIT 复用、fd 上限抬 —— 三块大头。<\/code><\/p>"}, {"q": "11.3 压测工具与指标？", "tag": "进阶", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li>工具：<code>ab -n 100000 -c 1000 URL<\/code>、<code>wrk -t8 -c1000 -d30s URL<\/code>、<code>hey<\/code>、<code>JMeter<\/code>。<\/li><li>核心指标：<strong>QPS/RPS<\/strong>（每秒请求）、<strong>TPS<\/strong>（每秒事务）、<strong>平均/TP99 延迟<\/strong>、<strong>错误率<\/strong>、<strong>CPU/内存/连接数<\/strong>。<\/li><li>压测结论关注：瓶颈在 Nginx 还是在后端（看 <code>$upstream_response_time<\/code> vs <code>$request_time<\/code>）。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>QPS 看吞吐，TP99 看体验，错误率看稳定。<\/code><\/p>\n<p><strong>加分点：<\/strong> 压测要分开打：纯静态（测 Nginx 上限）和走后端（测全链路），才能定位瓶颈。<\/p>"}, {"q": "11.4 慢客户端攻击防护？", "tag": "进阶", "body": "<p><strong>答案骨架：<\/strong> Slowloris 攻击 = 慢速发请求头占住连接不释放，耗尽连接数。<\/p>\n<ul><li>防护：<code>client_header_timeout 10s<\/code>（头超时）、<code>client_body_timeout 10s<\/code>（体超时）、<code>client_max_body_size<\/code> 限体积、<code>limit_conn<\/code> 限并发、<code>keepalive_timeout 65<\/code>、超时缩小到 5~10s。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>把超时调小、连接限住 —— 慢速攻击就废了。<\/code><\/p>\n<hr>"}]}, {"title": "12 源码原理", "questions": [{"q": "12.1 内存池 ngx_pool_t？", "tag": "进阶", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li>每个<strong>连接/请求<\/strong>分配一个内存池，小块内存直接从池里切（链表管理大块），<strong>请求结束整池释放<\/strong>。<\/li><li>好处：减少 malloc/free 次数、避免内存碎片、提高分配速度。<\/li><li>关键点：池是<strong>一次性释放<\/strong>，生命周期跟随请求。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>一请求一池，池随请求生，池随请求亡。<\/code><\/p>\n<p><strong>加分点：<\/strong> 大块内存（> pool->max）走独立 malloc 挂到池链表，释放时统一回收。<\/p>"}, {"q": "12.2 模块化与 HTTP 阶段钩子？", "tag": "进阶", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li>Nginx 是<strong>模块化架构<\/strong>：核心 + 功能模块（http/stream/event/过滤链）。<\/li><li>HTTP 处理被拆成<strong>11 个阶段<\/strong>：<code>post_read → rewrite → find_config(location 匹配) → rewrite 再检查 → preaccess → access → post_access → try_files(precontent) → content → log<\/code>。<\/li><li>内容阶段（content）决定\"谁来响应\"（static/proxy/fastcgi）；<strong>过滤链<\/strong>（header filter / body filter）依次加工响应（gzip、sub_filter）。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>阶段拆流程、过滤链加工 —— 请求像流水线过 11 关。<\/code><\/p>\n<p><strong>加分点：<\/strong> 官方文档有 PHASE 图；面试能说出\"location 匹配发生在 find_config 阶段、limit_req 在 preaccess\"就加分。<\/p>"}, {"q": "12.3 核心数据结构速览？", "tag": "进阶", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li><code>ngx_connection_t<\/code>：连接对象（fd、读写事件、缓冲）。<\/li><li><code>ngx_event_t<\/code>：事件对象（回调 handler、超时、标志）。<\/li><li><code>ngx_http_request_t<\/code>：请求对象（方法、URI、头、连接、阶段）。<\/li><li><code>ngx_chain_t<\/code> / <code>ngx_buf_t<\/code>：<strong>缓冲链表<\/strong>，贯穿读写（零拷贝的数据载体）。<\/li><li><code>ngx_pool_t<\/code>：内存池。<\/li><li><code>ngx_queue_t<\/code> / <code>ngx_rbtree_t<\/code>（红黑树）：定时器、epoll fd 管理。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>连接、事件、请求三巨头，buf 链传数据，池管内存，红黑树管定时器。<\/code><\/p>"}, {"q": "12.4 从源码角度回答\"为什么 Nginx 能撑高并发\"？", "tag": "高频", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ol><li><strong>事件模型<\/strong>：epoll 就绪通知，worker 进程内一个循环管所有 fd（<code>ngx_event_process<\/code>）。<\/li><li><strong>无阻塞<\/strong>：socket 全部非阻塞 + 事件驱动，没有线程睡等。<\/li><li><strong>无锁/少锁<\/strong>：worker 尽量无共享数据，连接分配用原子操作（<code>ngx_atomic_*<\/code>）。<\/li><li><strong>内存池<\/strong>：请求级分配，快速且无碎片。<\/li><li><strong>零拷贝<\/strong>：sendfile 内核搬数据。<\/li><li><strong>多进程<\/strong>：master 管理 + worker 干活，单 worker 崩溃不影响整体。<\/li><\/ol>\n<p><strong>口诀：<\/strong> <code>epoll 通知 + 非阻塞 + 原子无锁 + 内存池 + sendfile + 多进程 —— 源码级六连。<\/code><\/p>"}, {"q": "12.5 源码级高频追问？", "tag": "进阶", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li><strong>worker 之间怎么负载均衡连接？<\/strong> accept_mutex 锁 / reuseport 内核哈希。<\/li><li><strong>一个请求生命周期经过哪些结构？<\/strong> listen socket → ngx_connection_t → 读事件 → ngx_http_request_t → 阶段处理 → 过滤链 → 写事件。<\/li><li><strong>Nginx 为什么不用多线程？<\/strong> 进程隔离更稳、避免锁竞争、事件驱动本来就不需要线程池（对比 Java Netty 需要线程池执行回调）。<\/li><li><strong>reload 时旧请求怎么处理？<\/strong> 旧 worker 继续处理存量连接直到完成或超时（worker_shutdown_timeout）。<\/li><li><strong>keepalive 连接归谁？<\/strong> 空闲 keepalive 连接挂在 worker 的事件循环里，只占 fd 不占 CPU。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>追问万变不离其宗：连接归事件循环，请求走阶段钩子，内存走请求池。<\/code><\/p>\n<hr>"}]}, {"title": "13 场景题与快问快答", "questions": [{"q": "13.1 前端项目（Vue/React history 路由）部署？", "tag": "必背", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<pre><code class=\"lang-nginx\">server {\n    listen 80;\n    server_name example.com;\n    root /data/dist;\n    index index.html;\n\n    location /assets/ { expires 30d; }         # 静态资源长缓存\n    location /api/    { proxy_pass http://backend; }  # 接口转后端\n    location / {\n        try_files $uri $uri/ /index.html;      # 前端路由兜底\n    }\n}<\/code><\/pre>\n<p>要点：<strong>history 路由兜底 index.html + 接口单独转发 + 静态资源长缓存<\/strong>。<\/p>\n<p><strong>口诀：<\/strong> <code>资源长缓存、接口走代理、页面兜底 index.html。<\/code><\/p>"}, {"q": "13.2 跨域（CORS）怎么配？", "tag": "高频", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<pre><code class=\"lang-nginx\">location /api/ {\n    add_header Access-Control-Allow-Origin  $http_origin always;\n    add_header Access-Control-Allow-Methods \"GET, POST, PUT, DELETE, OPTIONS\" always;\n    add_header Access-Control-Allow-Headers \"Content-Type, Authorization\" always;\n    add_header Access-Control-Allow-Credentials true always;\n    if ($request_method = OPTIONS) { return 204; }   # 预检直接回\n    proxy_pass http://backend;\n}<\/code><\/pre>\n<p>要点：<strong>预检 OPTIONS 直接 204 返回，不转发后端<\/strong>；带凭证时 Allow-Origin 不能是 <code>*<\/code>。<\/p>\n<p><strong>口诀：<\/strong> <code>OPTIONS 预检自己扛，CORS 头加三件套，带 cookie 不能写 *。<\/code><\/p>"}, {"q": "13.3 大文件上传/下载？", "tag": "中频", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<pre><code class=\"lang-nginx\">client_max_body_size 100m;              # 上传大小限制\nproxy_request_buffering off;            # 大上传关缓冲，边收边转\nlocation /download/ {\n    sendfile on; tcp_nopush on;          # 下载零拷贝\n}<\/code><\/pre>\n<ul><li>下载支持 Range 断点续传（原生）；上传一般配合后端分片（业务层）。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>上传限体积、关缓冲；下载 sendfile + Range。<\/code><\/p>"}, {"q": "13.4 WebSocket / SSE / 直播流？", "tag": "中频", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li><strong>WebSocket<\/strong>：Upgrade 头 + HTTP 1.1 + 大超时（见 3.4）。<\/li><li><strong>SSE<\/strong>：<code>proxy_buffering off<\/code>（或 <code>X-Accel-Buffering: no<\/code>）+ 长超时。<\/li><li><strong>直播（HLS/RTMP）<\/strong>：HLS 是切片文件（静态/缓存友好）；RTMP 需编译 <code>ngx_rtmp_module<\/code>。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>WS 升级协议、SSE 关缓冲、HLS 静态切片。<\/code><\/p>"}, {"q": "13.5 网关能力组合（鉴权+限流+灰度+日志）？", "tag": "进阶", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<pre><code class=\"lang-nginx\">location /api/ {\n    limit_req zone=req burst=20 nodelay;   # ① 限流\n    auth_request /auth;                    # ② 鉴权（auth_request 模块）\n    proxy_set_header X-Canary $http_canary;# ③ 灰度（配合 map）\n    access_log /data/log/gateway.log main; # ④ 统一日志\n    proxy_pass http://backend;             # ⑤ 转发\n}\nlocation = /auth { internal; proxy_pass http://auth_service; }  # 内部鉴权端点<\/code><\/pre>\n<p>要点：<code>auth_request<\/code> 把鉴权交给独立服务，返回 200 放行、401/403 拦截。<\/p>\n<p><strong>口诀：<\/strong> <code>限流 → 鉴权 → 灰度 → 日志 → 转发，网关五连。<\/code><\/p>\n<p><strong>加分点：<\/strong> 更复杂网关直接上 OpenResty（Lua）或 APISIX/Kong。<\/p>"}, {"q": "13.6 快问快答 15 连", "tag": "高频", "body": "<p><strong>Q1. reload 和 restart 区别？<\/strong> reload 平滑（旧连接不断），restart 全断。<br><strong>Q2. Nginx 默认 worker 数？<\/strong> 1，生产设 CPU 核数。<br><strong>Q3. 惊群怎么解决？<\/strong> accept_mutex / reuseport。<br><strong>Q4. 最大并发怎么算？<\/strong> worker × connections ÷ 4。<br><strong>Q5. proxy_pass 末尾带不带 /？<\/strong> 带则替换前缀，不带原样传。<br><strong>Q6. root 和 alias？<\/strong> root 拼接，alias 替换。<br><strong>Q7. location 匹配优先级？<\/strong> = > ^~ > ~ > 最长前缀。<br><strong>Q8. rewrite last 和 break？<\/strong> last 重新匹配 location，break 停在本 location。<br><strong>Q9. 限流默认返回码？<\/strong> 503，可改 429。<br><strong>Q10. 502/504/499 含义？<\/strong> 后端挂/后端慢/客户端断开。<br><strong>Q11. 怎么拿真实 IP？<\/strong> X-Real-IP + X-Forwarded-For（可信代理内）。<br><strong>Q12. HTTPS 握手为什么快不了？<\/strong> 非对称协商慢，用会话缓存/TLS1.3 优化。<br><strong>Q13. HTTP/2 队头阻塞还在吗？<\/strong> TCP 层还在，HTTP/3（QUIC）解决。<br><strong>Q14. 为什么 Nginx 不用多线程？<\/strong> 多进程隔离稳 + 事件驱动无需线程池。<br><strong>Q15. 后端挂了缓存怎么兜底？<\/strong> proxy_cache_use_stale。<\/p>"}, {"q": "13.7 送命题：OpenResty / 网关怎么答？", "tag": "进阶", "body": "<p><strong>答案骨架：<\/strong><\/p>\n<ul><li><strong>OpenResty<\/strong> = Nginx + LuaJIT + 丰富模块，在 Nginx 阶段钩子里写 Lua 逻辑（限流、鉴权、动态路由、聚合 API）。<\/li><li>与 Spring Cloud Gateway / APISIX / Kong 对比：OpenResty/APISIX 性能最高（C+Lua）、动态能力强；Java 网关生态好、易二次开发。<\/li><li>选型：<strong>入口流量巨大选 OpenResty 系，业务复杂团队 Java 系<\/strong>。<\/li><\/ul>\n<p><strong>口诀：<\/strong> <code>Nginx 是\"死配置\"，OpenResty 是\"活逻辑\"，网关是\"全家桶\"。<\/code><\/p>\n<hr>\n<blockquote>背诵节奏建议：第 1 遍只背\"口诀\"；第 2 遍背\"答案骨架\"；第 3 遍口述\"加分点\"；考前只看\"追问\"。<br>祝面试顺利，Offer 到手 🎉<\/blockquote>"}]}], "qcount": 72}, {"sub": "题库深度版", "chapters": [{"title": "01 基础认知与核心概念", "questions": [{"q": "1.1 Nginx 是什么？主要特点与适用场景？", "tag": "高频", "body": "<p><strong>Nginx<\/strong>（engine X）是一个高性能的 <strong>HTTP 服务器 / 反向代理服务器 / 邮件代理服务器<\/strong>，由俄罗斯人 Igor Sysoev 于 2004 年开源，C 语言编写。<\/p>\n<p>核心特点：<\/p>\n<ul><li><strong>高并发<\/strong>：单机可支撑 <strong>5万~10万<\/strong> 并发连接（事件驱动 + 异步非阻塞 I/O），远胜 Apache。<\/li><li><strong>低资源占用<\/strong>：一个 worker 进程即可处理大量连接，内存占用小。<\/li><li><strong>高扩展性<\/strong>：模块化设计，功能可插拔（gzip、ssl、proxy、rewrite、stream 等）。<\/li><li><strong>高可靠性<\/strong>：master 管理 + 多 worker，进程互相隔离，可平滑升级、热部署。<\/li><\/ul>\n<p>适用场景：<\/p>\n<ul><li><strong>Web 服务器<\/strong>：托管静态资源（HTML/JS/CSS/图片），性能极佳。<\/li><li><strong>反向代理<\/strong>：统一入口转发到后端应用（Tomcat、Spring Boot、Go、Node 等）。<\/li><li><strong>负载均衡<\/strong>：将请求分发到多台后端服务器。<\/li><li><strong>网关/入口<\/strong>：统一鉴权、限流、灰度、日志记录。<\/li><li><strong>缓存服务器<\/strong>：静态资源缓存、代理缓存、CDN 边缘节点。<\/li><\/ul>\n<blockquote>加分点：Nginx 的高性能不是靠\"单进程事件驱动\"这一个点，而是 <strong>进程模型（master/worker）+ 事件驱动 + 异步非阻塞 + 模块化 + 内存池<\/strong> 的组合拳。<\/blockquote>"}, {"q": "1.2 正向代理 vs 反向代理？", "tag": "高频", "body": "<table><thead><tr><th>维度<\/th><th>正向代理<\/th><th>反向代理<\/th><\/tr><\/thead><tbody><tr><td>代理对象<\/td><td><strong>客户端<\/strong>（替客户端访问服务器）<\/td><td><strong>服务器<\/strong>（替服务器接收请求）<\/td><\/tr><tr><td>位置<\/td><td>客户端一侧<\/td><td>服务器一侧<\/td><\/tr><tr><td>服务器感知<\/td><td>服务器不知道真实客户端，只看到代理<\/td><td>客户端不知道真实服务器，只看到代理<\/td><\/tr><tr><td>典型场景<\/td><td>翻墙、公司上网代理、抓包工具<\/td><td>负载均衡、网关、CDN 回源<\/td><\/tr><tr><td>配置位置<\/td><td>客户端（浏览器/系统代理）<\/td><td>服务器端 nginx.conf<\/td><\/tr><\/tbody><\/table>\n<p>一句话记忆：<strong>正向代理隐藏客户端，反向代理隐藏服务器<\/strong>。<\/p>\n<blockquote>追问：Nginx 默认就是反向代理的角色。做正向代理需要配置 <code>resolver<\/code> + <code>proxy_pass $http_host$request_uri<\/code>，且只支持 HTTP 协议（商业版/OpenResty 可扩展）。<\/blockquote>"}, {"q": "1.3 Nginx vs Apache：为什么 Nginx 更适合高并发？", "tag": "高频", "body": "<table><thead><tr><th>对比项<\/th><th>Nginx<\/th><th>Apache<\/th><\/tr><\/thead><tbody><tr><td>架构<\/td><td>事件驱动 + 异步非阻塞<\/td><td>进程/线程池（MPM 模式），每连接一线程<\/td><\/tr><tr><td>并发能力<\/td><td>高（几万~十万）<\/td><td>低（几千），受线程数限制<\/td><\/tr><tr><td>资源占用<\/td><td>低<\/td><td>高（每连接独立线程栈）<\/td><\/tr><tr><td>静态文件<\/td><td>极快（sendfile + 零拷贝）<\/td><td>一般<\/td><\/tr><tr><td>动态处理<\/td><td>弱（需 fastcgi/uwsgi 转发）<\/td><td>强（PHP 等模块内置）<\/td><\/tr><tr><td>配置灵活性<\/td><td>.htaccess 不支持<\/td><td>支持 .htaccess 目录级配置<\/td><\/tr><tr><td>稳定性<\/td><td>高<\/td><td>高<\/td><\/tr><\/tbody><\/table>\n<blockquote>结论：<strong>静态资源 + 高并发入口用 Nginx，动态应用处理 + 目录级灵活配置用 Apache<\/strong>；现代架构主流是 Nginx 做入口，动态请求转发给后端（PHP-FPM、Tomcat 等）。<\/blockquote>"}, {"q": "1.4 进程模型：master 与 worker 各司其职", "tag": "高频", "body": "<p>Nginx 采用 <strong>master + worker 多进程<\/strong> 模型（还有 cache manager / cache loader 两个辅助进程）：<\/p>\n<ul><li><strong>master 进程<\/strong>：不处理业务请求，只做管理——读取配置、fork 出 worker、接收信号（HUP/QUIT/USR2 等）、监控 worker 健康、平滑升级。<\/li><li><strong>worker 进程<\/strong>：真正处理请求。多个 worker 通过 <strong>事件循环<\/strong> 并发处理海量连接，互相独立、互不干扰。<\/li><li><strong>cache manager<\/strong>：定时清理过期缓存。<\/li><li><strong>cache loader<\/strong>：启动时把磁盘缓存加载到内存索引。<\/li><\/ul>\n<p>关键点：<\/p>\n<ul><li>worker 数量默认 1，建议设为 <strong>CPU 核数<\/strong>（避免过多进程切换开销）。<\/li><li>worker 之间通过 <strong>共享内存<\/strong>（如 limit_req 的计数）通信，通过 <strong>accept_mutex / reuseport<\/strong> 协调新连接分配。<\/li><li>一个 worker 挂了不影响其他 worker，master 会自动拉起新的。<\/li><\/ul>\n<blockquote>加分点：为什么不用多线程？因为<strong>高并发场景下多进程比多线程更稳定<\/strong>——进程内存隔离，不会因某个请求的 bug 拖垮整个服务；且避免了线程切换和锁竞争。<\/blockquote>"}, {"q": "1.5 为什么 Nginx 性能高？核心优势总结", "tag": "高频", "body": "<ol><li><strong>事件驱动模型<\/strong>：基于 epoll/kqueue，一个进程可以同时监听数万个 socket，<strong>没有阻塞<\/strong>。<\/li><li><strong>异步非阻塞 I/O<\/strong>：读写不等待，事件就绪才处理，CPU 利用率高。<\/li><li><strong>多进程 + 无锁设计<\/strong>：worker 进程间尽量无共享状态，减少锁竞争（连接分配用原子操作）。<\/li><li><strong>内存池<\/strong>：每个请求使用独立内存池，减少 malloc/free 次数和内存碎片。<\/li><li><strong>零拷贝<\/strong>：静态文件用 <code>sendfile<\/code> 直接在内核态拷贝，不经用户态。<\/li><li><strong>模块化 + 精简<\/strong>：核心很小，功能按需编译加载。<\/li><\/ol>\n<blockquote>对比：传统阻塞式服务器（每连接一线程）在高并发下会因线程过多导致上下文切换开销巨大、内存耗尽。Nginx 用\"少量进程处理海量连接\"的思路解决了这个问题。<\/blockquote>"}, {"q": "1.6 配置文件结构：nginx.conf 由哪些部分组成？", "tag": "基础", "body": "<p>nginx.conf 主要包含以下块：<\/p>\n<table><thead><tr><th>块<\/th><th>作用<\/th><th>层级<\/th><\/tr><\/thead><tbody><tr><td><code>main<\/code>（全局块）<\/td><td>全局配置：worker_processes、user、pid、error_log<\/td><td>最外层<\/td><\/tr><tr><td><code>events<\/code><\/td><td>事件模型配置：worker_connections、epoll、accept_mutex<\/td><td>全局<\/td><\/tr><tr><td><code>http<\/code><\/td><td>HTTP 服务配置：server、upstream、gzip、proxy 等<\/td><td>全局<\/td><\/tr><tr><td><code>server<\/code><\/td><td>虚拟主机配置：监听端口/域名、location、ssl<\/td><td>http 内<\/td><\/tr><tr><td><code>location<\/code><\/td><td>URI 匹配与请求处理规则<\/td><td>server 内<\/td><\/tr><tr><td><code>upstream<\/code><\/td><td>后端服务器组（负载均衡池）<\/td><td>http 内<\/td><\/tr><tr><td><code>stream<\/code><\/td><td>四层（TCP/UDP）代理配置<\/td><td>全局（需编译 stream 模块）<\/td><\/tr><\/tbody><\/table>\n<p>示例骨架：<\/p>\n<pre><code class=\"lang-nginx\">user nginx;                  # main\nworker_processes auto;       # 与 CPU 核数一致\nerror_log /var/log/nginx/error.log warn;\n\nevents {\n    worker_connections 1024; # 单 worker 最大连接数\n    use epoll;               # Linux 事件模型\n}\n\nhttp {\n    include mime.types;\n    sendfile on;\n    upstream backend {       # 负载均衡池\n        server 10.0.0.1:8080 weight=2;\n        server 10.0.0.2:8080 weight=1;\n    }\n    server {                 # 虚拟主机\n        listen 80;\n        server_name example.com;\n        location /api/ {\n            proxy_pass http://backend;\n        }\n    }\n}<\/code><\/pre>\n<blockquote>注意：<code>events<\/code>、<code>http<\/code>、<code>stream<\/code> 是平级的顶层块，<code>server<\/code> 必须在 <code>http<\/code>（或 <code>stream<\/code>）内，<code>location<\/code> 必须在 <code>server<\/code> 内。<\/blockquote>"}, {"q": "1.7 Nginx 模块化架构", "tag": "进阶", "body": "<p>Nginx 功能由模块实现，编译时通过 <code>--with-xxx<\/code> / <code>--without-xxx<\/code> 控制：<\/p>\n<ul><li><strong>核心模块<\/strong>：ngx_core_module（主进程）、ngx_events_module（事件）等，必须存在。<\/li><li><strong>标准模块<\/strong>：http_core、http_proxy、http_upstream、http_gzip、http_ssl、http_rewrite、http_limit_req 等。<\/li><li><strong>第三方模块<\/strong>：lua（OpenResty）、headers-more、echo、stream 等。<\/li><\/ul>\n<p>模块类型（按处理阶段）：<\/p>\n<ul><li><strong>Handler 模块<\/strong>：处理请求，生成响应（如 static、proxy、fastcgi）。<\/li><li><strong>Filter 模块<\/strong>：对响应内容做后处理（如 gzip、sub_filter 替换、ssi）。<\/li><li><strong>Upstream 模块<\/strong>：实现负载均衡逻辑（如 proxy、memcached、fastcgi 的 upstream）。<\/li><li><strong>Load-Balance 模块<\/strong>：upstream 中选择后端服务器的算法。<\/li><\/ul>\n<blockquote>加分点：<strong>OpenResty = Nginx + LuaJIT + 大量模块<\/strong>，通过 Lua 在 Nginx 各阶段（rewrite/access/content 等）注入业务逻辑，是 API 网关（Kong、APISIX）的基石。<\/blockquote>"}, {"q": "1.8 Nginx 常见的几种工作角色", "tag": "基础", "body": "<ol><li><strong>静态 Web 服务器<\/strong>：直接返回磁盘文件。<\/li><li><strong>反向代理服务器<\/strong>：转发到后端应用。<\/li><li><strong>负载均衡器<\/strong>：多后端分发（七层 HTTP / 四层 TCP 均可）。<\/li><li><strong>HTTP 缓存服务器<\/strong>：CDN 节点，缓存静态资源。<\/li><li><strong>网关<\/strong>：统一鉴权、限流、灰度、跨域。<\/li><li><strong>邮件代理<\/strong>：IMAP/POP3/SMTP 代理（远古功能，较少用）。<\/li><\/ol>\n<hr>"}]}, {"title": "02 事件驱动与高性能原理", "questions": [{"q": "2.1 同步阻塞 / 同步非阻塞 / 异步非阻塞 I/O", "tag": "高频", "body": "<p>以\"读取 socket 数据\"为例：<\/p>\n<ul><li><strong>同步阻塞（BIO）<\/strong>：调用 read 后线程阻塞，直到有数据才返回。多路并发需要多线程。<\/li><li><strong>同步非阻塞（NIO）<\/strong>：read 立即返回，没数据返回 EAGAIN，需要<strong>用户态轮询<\/strong>（忙等，浪费 CPU）。<\/li><li><strong>I/O 多路复用<\/strong>：一次系统调用（select/poll/epoll）监听大量 fd，内核通知\"哪些 fd 就绪了\"，再对就绪 fd 做非阻塞读写。Nginx/Redis 都采用此方案。<\/li><li><strong>异步非阻塞（AIO）<\/strong>：调用后立即返回，内核完成数据拷贝后通过信号/回调通知，全程不参与（Nginx 对磁盘 I/O 可选 AIO，网络 I/O 用多路复用）。<\/li><\/ul>\n<blockquote>加分点：Nginx 的\"异步非阻塞\"准确说是 <strong>基于事件驱动（epoll）的非阻塞 I/O 多路复用<\/strong>，并不是 libuv 式的纯异步回调，两者要区分清楚。<\/blockquote>"}, {"q": "2.2 epoll 是什么？为什么比 select/poll 快？", "tag": "高频", "body": "<p>epoll 是 Linux 2.6 引入的高性能 I/O 多路复用接口，核心 API：<code>epoll_create<\/code>、<code>epoll_ctl<\/code>、<code>epoll_wait<\/code>。<\/p>\n<p>对比 select/poll 的优势：<\/p>\n<table><thead><tr><th>维度<\/th><th>select/poll<\/th><th>epoll<\/th><\/tr><\/thead><tbody><tr><td>最大 fd 数<\/td><td>select 1024（FD_SETSIZE），poll 无上限但数量大时退化<\/td><td>无上限<\/td><\/tr><tr><td>就绪检测方式<\/td><td><strong>每次调用都要把 fd 集合从用户态拷贝到内核态<\/strong>，内核全量扫描 O(n)<\/td><td>内核维护<strong>红黑树 + 就绪链表<\/strong>，只返回就绪 fd O(1)<\/td><\/tr><tr><td>用户态处理<\/td><td>全量遍历找就绪 fd<\/td><td>直接遍历就绪链表<\/td><\/tr><tr><td>触发模式<\/td><td>仅水平触发（LT）<\/td><td><strong>LT + ET（边缘触发）<\/strong><\/td><\/tr><\/tbody><\/table>\n<p>关键概念：<\/p>\n<ul><li><strong>LT（水平触发）<\/strong>：fd 有数据就一直通知，直到处理完；不易漏事件，可能重复唤醒。<\/li><li><strong>ET（边缘触发）<\/strong>：状态变化才通知一次；效率更高，但<strong>必须一次性把数据读完<\/strong>，否则丢数据。<\/li><li>Nginx 默认使用 epoll 的 <strong>LT 模式<\/strong>（更稳妥），通过 <code>events { use epoll; }<\/code> 指定（Linux 下默认就是 epoll，可省略）。<\/li><\/ul>\n<blockquote>追问：epoll 的两个关键数据结构？内核中每个 epoll 实例维护一棵<strong>红黑树<\/strong>（存储所有注册的 fd）和一个<strong>就绪链表<\/strong>（存放有事件发生的 fd），epoll_wait 只把就绪链表拷贝给用户态，所以效率与监听数量无关。<\/blockquote>"}, {"q": "2.3 Nginx 事件驱动模型工作流程", "tag": "进阶", "body": "<p>Nginx 每个 worker 内部有一个 <strong>事件循环<\/strong>（ngx_process_events_and_timers）：<\/p>\n<pre><code>循环开始\n  ├─ 调用 epoll_wait 等待事件（阻塞/超时）\n  ├─ 有新事件？\n  │   ├─ 读事件：调用对应 handler（读请求头/读 body/读上游响应）\n  │   └─ 写事件：调用对应 handler（写响应给客户端/写上游请求）\n  ├─ 处理定时器：检查超时（keepalive 超时、proxy 超时、限速等）\n  └─ 回到 epoll_wait 继续等待<\/code><\/pre>\n<p>特点：<\/p>\n<ul><li>一个 worker 内的所有连接都由这一个事件循环驱动，<strong>无阻塞操作<\/strong>。<\/li><li>每个连接关联一个状态机（读头 → 读 body → 处理 → 写响应），事件驱动状态机推进。<\/li><li>定时器用<strong>红黑树<\/strong>管理（ngx_event_timer_rbtree），到期事件批量处理。<\/li><\/ul>\n<blockquote>加分点：Nginx 事件循环最核心的函数是 <code>ngx_process_events_and_timers<\/code>，它先处理事件再处理定时器；所谓\"高并发\"本质是<strong>用极少的线程（worker）高效地轮转处理海量连接的状态机<\/strong>。<\/blockquote>"}, {"q": "2.4 worker 进程数如何设置？", "tag": "高频", "body": "<pre><code class=\"lang-nginx\">worker_processes 4;     # 或 auto（自动按 CPU 核数）<\/code><\/pre>\n<p>原则：<\/p>\n<ul><li>默认 <strong>CPU 核数<\/strong>（物理核）。例如 8 核 16 线程，一般设为 8 或 auto。<\/li><li>设太大会增加<strong>进程切换开销<\/strong>和内存占用（每个 worker 都有独立的内存副本，含各模块共享内存的拷贝成本）。<\/li><li>设太小无法充分利用多核。<\/li><\/ul>\n<p>进阶配置：<\/p>\n<pre><code class=\"lang-nginx\">worker_processes auto;\nworker_cpu_affinity auto;        # worker 绑定 CPU 核，避免缓存抖动\nworker_rlimit_nofile 65535;      # 单进程可打开文件数上限（配合 ulimit）<\/code><\/pre>\n<ul><li><code>worker_cpu_affinity<\/code>：把每个 worker 绑定到固定 CPU，减少上下文切换和 cache miss。<\/li><li>实际经验：<strong>I/O 密集型<\/strong>可等于核数；<strong>CPU 密集型<\/strong>（如大量 gzip）可略少；若 worker 常处于空闲，可减少到核数一半。<\/li><\/ul>\n<blockquote>追问：<code>worker_rlimit_nofile<\/code> 不设会怎样？进程默认 fd 上限通常 1024，即使 worker_connections 配了 65535，单 worker 也打不开那么多连接，会报 \"too many open files\"。<\/blockquote>"}, {"q": "2.5 惊群问题与解决（accept_mutex / reuseport）", "tag": "进阶", "body": "<p><strong>惊群（thundering herd）<\/strong>：多个 worker 同时 accept 同一个监听 socket 的新连接，内核唤醒所有 worker，但只有一个能成功，其余白白空转。<\/p>\n<p>Nginx 的解决方式：<\/p>\n<ol><li><strong>accept_mutex<\/strong>（早期方案）：在 <code>events<\/code> 块开启 <code>accept_mutex on;<\/code>，同一时刻<strong>只有一个 worker 持有 accept 锁<\/strong>，抢到锁的 worker 才 accept 新连接（批量 accept 后立即释放），避免全部 worker 被唤醒。<\/li><li><strong>SO_REUSEPORT<\/strong>（Linux 3.9+，Nginx 1.9.1+）：配置 <code>listen 80 reuseport;<\/code>，<strong>每个 worker 独立监听同一个端口<\/strong>，由内核在多个 socket 间负载均衡分发连接，彻底消除 accept 锁竞争，性能更高。<\/li><\/ol>\n<pre><code class=\"lang-nginx\">events {\n    accept_mutex off;    # 使用 reuseport 时关闭\n}\nserver {\n    listen 80 reuseport; # 内核级负载均衡\n}<\/code><\/pre>\n<blockquote>加分点：reuseport 的代价是<strong>连接分布不保证均匀<\/strong>（内核按四元组哈希），且在 worker 重启时其 socket 上的已有连接会断开，需权衡；多数场景 Nginx 默认 accept_mutex 足够。<\/blockquote>"}, {"q": "2.6 worker_connections 与最大并发数计算", "tag": "高频", "body": "<pre><code class=\"lang-nginx\">events {\n    worker_connections 1024;   # 默认 1024，单 worker 可同时打开的连接数\n    use epoll;\n}<\/code><\/pre>\n<p>计算模型：<\/p>\n<ul><li><strong>总连接数<\/strong> = <code>worker_processes × worker_connections<\/code>（文件描述符层面的上限）。<\/li><li>纯静态资源场景：一个客户端一个连接，最大并发 ≈ 该值。<\/li><li><strong>反向代理场景：客户端与上游各占一个连接<\/strong>，实际最大并发 ≈ <code>worker_processes × worker_connections / 2<\/code>。<\/li><li>还要受 <code>worker_rlimit_nofile<\/code>（fd 上限）和系统 <code>ulimit -n<\/code>、<code>net.core.somaxconn<\/code> 限制。<\/li><\/ul>\n<p>示例：8 worker × 65535 connections = 524,280 个 fd；做反向代理时约支撑 26 万并发连接。<\/p>\n<blockquote>追问：系统层面还要调什么？<code>ulimit -n<\/code>（进程 fd 上限）、<code>net.core.somaxconn<\/code>（accept 队列长度）、<code>net.ipv4.ip_local_port_range<\/code>（本地端口范围，影响主动连接上游的数量）、<code>net.ipv4.tcp_tw_reuse<\/code>（TIME_WAIT 复用）。<\/blockquote>"}, {"q": "2.7 Nginx 是如何做到平滑 reload / 平滑升级的？", "tag": "高频", "body": "<ul><li><strong>平滑 reload<\/strong>（改配置生效）：向 master 发送 <strong>HUP<\/strong> 信号 → master 重新解析配置文件 → 若语法 OK，fork 出<strong>新的 worker 组<\/strong> → 新连接交给新 worker；旧 worker 处理完已接收的请求后自动退出（优雅退出）。<\/li><li><strong>平滑升级<\/strong>（换二进制）：向 master 发送 <strong>USR2<\/strong> → master 启动新的 master+worker（新二进制）→ 新老进程同时存在、共享监听端口 → 发 <strong>WINCH<\/strong> 让旧 worker 优雅退出 → 发 <strong>QUIT<\/strong> 退出旧 master，完成无缝升级。<\/li><li><strong>立即退出<\/strong>：QUIT（优雅退出，处理完当前请求）、TERM/INT（立即退出）。<\/li><\/ul>\n<table><thead><tr><th>信号<\/th><th>作用<\/th><\/tr><\/thead><tbody><tr><td>HUP<\/td><td>平滑重载配置<\/td><\/tr><tr><td>QUIT<\/td><td>优雅退出（处理完当前请求）<\/td><\/tr><tr><td>TERM/INT<\/td><td>立即退出<\/td><\/tr><tr><td>USR1<\/td><td>重新打开日志（日志切割）<\/td><\/tr><tr><td>USR2<\/td><td>平滑升级新版本<\/td><\/tr><tr><td>WINCH<\/td><td>优雅关闭 worker（配合 USR2 升级）<\/td><\/tr><\/tbody><\/table>\n<blockquote>加分点：reload 不是\"重启\"，worker 进程号会变、旧连接不断；这也是 Nginx 高可用的体现——<strong>配置文件出错时 reload 会失败但不会影响正在运行的进程<\/strong>。<\/blockquote>\n<hr>"}]}, {"title": "03 反向代理", "questions": [{"q": "3.1 反向代理的原理与最小配置", "tag": "高频", "body": "<p>原理：客户端请求 Nginx → Nginx 按照配置<strong>转发请求到上游服务器<\/strong> → 拿到响应后再返回给客户端。客户端始终只与 Nginx 通信。<\/p>\n<pre><code class=\"lang-nginx\">server {\n    listen 80;\n    server_name example.com;\n    location / {\n        proxy_pass http://127.0.0.1:8080;   # 转发到后端\n        proxy_set_header Host $host;         # 传递原始 Host\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n    }\n}<\/code><\/pre>\n<p>常用指令：<\/p>\n<ul><li><code>proxy_pass<\/code>：上游地址（必填）。<\/li><li><code>proxy_set_header<\/code>：改写转发请求头。<\/li><li><code>proxy_connect_timeout / proxy_read_timeout / proxy_send_timeout<\/code>：连接/读/写超时（默认 60s）。<\/li><li><code>proxy_buffering on/off<\/code>：是否缓冲上游响应。<\/li><li><code>proxy_redirect<\/code>：改写上游返回的 Location/Refresh 头。<\/li><\/ul>\n<blockquote>追问：反向代理为什么能隐藏后端？因为客户端只能看到 Nginx 的 IP，后端 IP 通过 <code>proxy_set_header<\/code> 只在内网传递，对外不可见；同时 Nginx 层可以做统一入口的鉴权、限流、白名单。<\/blockquote>"}, {"q": "3.2 proxy_pass 带路径与不带路径的区别", "tag": "高频", "body": "<p>这是<strong>最经典的高频陷阱<\/strong>，区别在于 URI 的处理方式：<\/p>\n<ul><li><strong>不带 URI<\/strong>（proxy_pass 后无 <code>/<\/code>，如 <code>proxy_pass http://backend;<\/code>）：<strong>完整保留原始 URI<\/strong> 转发。<\/li><\/ul>\n<pre><code class=\"lang-nginx\">  location /api/ { proxy_pass http://backend; }\n  # 请求 /api/user?id=1 → 上游收到 /api/user?id=1<\/code><\/pre>\n<ul><li><strong>带 URI<\/strong>（proxy_pass 后带 <code>/<\/code> 或路径，如 <code>proxy_pass http://backend/;<\/code>）：<strong>用指定 URI 替换 location 匹配部分<\/strong>。<\/li><\/ul>\n<pre><code class=\"lang-nginx\">  location /api/ { proxy_pass http://backend/; }\n  # 请求 /api/user?id=1 → 上游收到 /user?id=1（/api/ 被替换为 /）\n  location /api/ { proxy_pass http://backend/new/; }\n  # 请求 /api/user → 上游收到 /new/user<\/code><\/pre>\n<blockquote>追问：带正则的 location 里能用不带 URI 的 proxy_pass 吗？<strong>不能<\/strong>。当 location 使用正则（<code>~<\/code>、<code>~*<\/code>）或 <code>@<\/code> 命名 location 时，proxy_pass 必须不带 URI，否则启动报错 <code>\"proxy_pass\" cannot have URI part<\/code>。<\/blockquote>"}, {"q": "3.3 反向代理的请求头传递", "tag": "基础", "body": "<p>后端要拿到客户端的真实信息，必须显式传递请求头（否则看到的是 Nginx 的 IP/默认头）：<\/p>\n<pre><code class=\"lang-nginx\">proxy_set_header Host $host;                          # 原始 Host（多域名时关键）\nproxy_set_header X-Real-IP $remote_addr;              # 客户端真实 IP\nproxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # 追加式链路 IP\nproxy_set_header X-Forwarded-Proto $scheme;           # http/https 标识（后端判跳转）\nproxy_set_header Connection \"\";                       # 清空 Connection，配合上游长连接<\/code><\/pre>\n<ul><li><code>$proxy_add_x_forwarded_for<\/code> = 客户端已有 XFF + <code>$remote_addr<\/code>，<strong>追加而非覆盖<\/strong>，保留完整链路。<\/li><li>如果经过多层代理，取<strong>最左边第一个<\/strong> IP 是真实客户端（需后端配合解析）。<\/li><\/ul>\n<blockquote>注意：如果 Nginx 前面还有 CDN/其他代理，<code>$remote_addr<\/code> 是上一跳代理的 IP，应优先信任 CDN 传的 XFF/<code>X-Real-IP<\/code>，并做好<strong>白名单校验<\/strong>防止伪造。<\/blockquote>"}, {"q": "3.4 反向代理超时与重试", "tag": "进阶", "body": "<pre><code class=\"lang-nginx\">proxy_connect_timeout 5s;     # 与上游建立 TCP 连接超时（默认 60s，内网建议调小）\nproxy_send_timeout   30s;     # 向上游发送请求超时（两次写操作间隔）\nproxy_read_timeout   30s;     # 读取上游响应超时（两次读操作间隔，长接口调大）\nproxy_next_upstream  error timeout http_502 http_503 http_504;  # 触发重试的条件\nproxy_next_upstream_tries 2;  # 重试次数<\/code><\/pre>\n<ul><li><strong>504 Gateway Timeout<\/strong>：通常是 <code>proxy_read_timeout<\/code> 太小，或上游本身处理慢。<\/li><li><strong>502 Bad Gateway<\/strong>：上游连接失败（服务挂了/端口不对/防火墙）。<\/li><li><code>proxy_next_upstream<\/code> 指定哪些情况<strong>换下一个上游重试<\/strong>；默认对 GET 会重试，<strong>POST 需谨慎<\/strong>（可能导致重复提交，需接口幂等）。<\/li><\/ul>\n<blockquote>加分点：写操作（POST/PUT）默认也会重试（error 类），生产环境建议显式配置重试策略，并对后端做好<strong>幂等性设计<\/strong>。<\/blockquote>"}, {"q": "3.5 反向代理缓冲（proxy_buffering）", "tag": "进阶", "body": "<pre><code class=\"lang-nginx\">proxy_buffering on;                        # 默认开启\nproxy_buffer_size 4k;
