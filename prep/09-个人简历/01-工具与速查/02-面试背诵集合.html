rong>\"FIN 只关发送方向，TCP 双工两方向独立关——所以四次。主动方发 FIN 后仍能收（半关闭）。\"<\/strong><\/blockquote>"}, {"q": "3.2 为什么挥手四次、握手三次？", "tag": "高频", "body": "<p><strong>标准答案<\/strong>：<\/p>\n<ul><li><strong>握手<\/strong>：服务器的 SYN 和 ACK 可合并（没有\"等业务数据\"的约束）。<\/li><li><strong>挥手<\/strong>：B 收到 FIN 后<strong>先回 ACK<\/strong>，但可能还有数据要发，<strong>不能立刻发 FIN<\/strong>——FIN 与 ACK 必然分开，天然四次。<\/li><li>只有 B 恰好没数据时 FIN+ACK 可合并成三次。<\/li><\/ul>\n<blockquote>记忆口诀：<strong>\"握手是'我有话说'，挥手是'我说完了'——对方说完了我还得把话说完，所以多一次。\"FIN_WAIT_2 堆积 = 对端应用不 close。<\/strong><\/blockquote>"}, {"q": "3.3 TIME_WAIT 是什么？为什么 2MSL？", "tag": "高频", "body": "<p><strong>标准答案<\/strong>：<\/p>\n<ol><li><strong>TIME_WAIT<\/strong>：主动关闭方发完最后一个 ACK 后等待 2MSL 的状态（Linux MSL≈30s，共约 60s）。<\/li><li><strong>两个作用<\/strong>：<\/li><\/ol>\n<ul><li>保证最后一个 ACK 可靠到达（丢了还能重发，配合对方重传 FIN）。<\/li><li>让旧连接的延迟报文在 2MSL 内消亡，不污染新连接。<\/li><\/ul>\n<blockquote>记忆口诀：<strong>\"TIME_WAIT 是主动关闭方的专利，被动方不进。'量大不是病，端口耗尽才致命'——每秒新建×60s 接近 6.5 万才是危险线。\"<\/strong><\/blockquote>"}, {"q": "3.4 TIME_WAIT 过多怎么处理？", "tag": "高频", "body": "<p><strong>标准答案（按优先级）<\/strong>：<\/p>\n<ol><li><strong>连接复用<\/strong>（治本）：Keep-Alive/连接池，减少\"建-断\"次数。<\/li><li><strong>内核参数<\/strong>（缓解）：<code>tcp_tw_reuse=1<\/code>（仅客户端角色）+ <code>tcp_timestamps=1<\/code>。<\/li><li><strong>架构调整<\/strong>：让对端主动断开，把 TIME_WAIT 转移出去；负载均衡分摊。<\/li><\/ol>\n<blockquote>记忆口诀：<strong>\"禁用 tcp_tw_recycle——NAT 下时间戳倒置会误杀正常连接，Linux 4.12 已删除。主动说这句话是明显加分项。\"<\/strong><\/blockquote>"}, {"q": "3.5 CLOSE_WAIT 堆积的原因与排查？", "tag": "高频", "body": "<p><strong>标准答案<\/strong>：<\/p>\n<ol><li><strong>原因<\/strong>：被动关闭方收到 FIN 回 ACK 后<strong>应用没调用 close()<\/strong>——代码 Bug（没处理关闭事件、异常漏 close、线程池耗尽）。<\/li><li><strong>排查三板斧<\/strong>：<\/li><\/ol>\n<ul><li><code>ss -antp | grep CLOSE_WAIT<\/code> 定位进程。<\/li><li><code>jstack <pid><\/code> 找阻塞线程（先看线程池！）。<\/li><li>代码审计 close 路径（finally/异常分支）。<\/li><\/ul>\n<blockquote>记忆口诀：<strong>\"TIME_WAIT 多找网络层/架构，CLOSE_WAIT 多查应用代码——两者正好相反。\"CLOSE_WAIT 堆积 = fd 泄漏信号。<\/strong><\/blockquote>\n<hr>"}]}, {"title": "04 TCP 状态机与连接队列", "questions": [{"q": "4.1 TCP 11 种状态怎么背？", "tag": "进阶", "body": "<p><strong>标准答案（两条主线）<\/strong>：<\/p>\n<ul><li><strong>服务端主线<\/strong>：<code>LISTEN → SYN_RCVD → ESTABLISHED → CLOSE_WAIT → LAST_ACK → CLOSED<\/code>。<\/li><li><strong>客户端主线<\/strong>：<code>SYN_SENT → ESTABLISHED → FIN_WAIT_1 → FIN_WAIT_2 → TIME_WAIT → CLOSED<\/code>。<\/li><li>另有：CLOSED（初始）、CLOSING（双方同时 FIN，罕见）。<\/li><\/ul>\n<blockquote>记忆口诀：<strong>\"画两条线比背表强：服务端从听(倾听)到收，客户端从发到等。\"面试现场画出状态迁移线 = 稳。<\/strong><\/blockquote>"}, {"q": "4.2 半连接队列与全连接队列？", "tag": "高频", "body": "<p><strong>标准答案<\/strong>：<\/p>\n<ul><li><strong>半连接队列（SYN 队列）<\/strong>：收到 SYN、未完成握手（SYN_RCVD），大小受 <code>tcp_max_syn_backlog<\/code> 限制。<\/li><li><strong>全连接队列（accept 队列）<\/strong>：握手完成、等应用 accept()，大小 = <code>min(listen(fd, backlog), somaxconn)<\/code>。<\/li><li><strong>流程<\/strong>：SYN 入半连接 → 回 SYN+ACK → 收 ACK 移入全连接 → accept() 取走。<\/li><\/ul>\n<blockquote>记忆口诀：<strong>\"backlog 只管全连接队列，管不了半连接队列——调大 backlog 防的是'accept 不及时'，不是 SYN Flood。\"<\/strong><\/blockquote>"}, {"q": "4.3 连接队列溢出怎么处理？", "tag": "进阶", "body": "<p><strong>标准答案<\/strong>：<\/p>\n<ol><li><strong>全连接队列满<\/strong>：由 <code>tcp_abort_on_overflow<\/code> 决定——0（默认）静默丢 ACK，客户端发数据时才被 RST；1 直接回 RST。<\/li><li><strong>半连接队列满<\/strong>：<code>dmesg<\/code> 出现 <code>Possible SYN flooding on port<\/code>，大概率被攻击。<\/li><li><strong>排查<\/strong>：<code>ss -lnt<\/code> 看 <code>Recv-Q<\/code>（当前队列）vs <code>Send-Q<\/code>（上限），Recv-Q 顶满不降 = 应用 accept 太慢。<\/li><\/ol>\n<blockquote>记忆口诀：<strong>\"先判断是哪个队列满：半连接满=网络层攻击，全连接满=应用层瓶颈。根因完全不同。\"<\/strong><\/blockquote>"}, {"q": "4.4 连接队列与三次握手的交互细节？", "tag": "进阶", "body": "<p><strong>标准答案<\/strong>：<\/p>\n<ol><li>SYN 到达 → 半连接队列建 request_sock，回 SYN+ACK。<\/li><li>收到 ACK → 校验后移出半连接队列，建 sock 入全连接队列。<\/li><li>accept() 取走 → 完成。<\/li><li><strong>SYN Cookie 模式<\/strong>：不建 request_sock，握手信息编码进 ISN，收 ACK 现场校验直接建连。<\/li><\/ol>\n<blockquote>记忆口诀：<strong>\"Cookie 是'溢出才触发'的兜底，队列是'入队前检查'的第一道防线。\"<\/strong><\/blockquote>\n<hr>"}]}, {"title": "05 TCP 可靠性机制", "questions": [{"q": "5.1 TCP 如何保证可靠传输？", "tag": "高频", "body": "<p><strong>标准答案（六大机制）<\/strong>：<\/p>\n<ol><li><strong>序号+确认<\/strong>：每字节一个序号，ACK 报\"期望的下一个字节号\"，有序重组去重。<\/li><li><strong>超时重传<\/strong>：RTO 超时未确认即重传。<\/li><li><strong>滑动窗口/流量控制<\/strong>：按接收方 rwnd 调发送量。<\/li><li><strong>拥塞控制<\/strong>：按网络状态调 cwnd。<\/li><li><strong>校验和<\/strong>：损坏即丢弃触发重传。<\/li><li><strong>连接管理<\/strong>：握手/挥手保证会话正确。<\/li><\/ol>\n<blockquote>记忆口诀：<strong>\"序号确认重传打丢包，窗口打速度差（流控）和容量差（拥塞），校验和打损坏。\"<\/strong><\/blockquote>"}, {"q": "5.2 超时重传与快速重传的区别？", "tag": "高频", "body": "<p><strong>标准答案<\/strong>：<\/p>\n<ul><li><strong>超时重传<\/strong>：RTO 定时器（<code>RTO = SRTT + 4×RTTVAR<\/code>），超时未收到 ACK 重传，超时后<strong>指数退避<\/strong>（×2），连续 15 次放弃（<code>tcp_retries2<\/code>）。<\/li><li><strong>快速重传<\/strong>：不等超时，<strong>收到 3 个重复 ACK<\/strong> 立即重传。原理：重复 ACK 说明下一个包丢了且后续包陆续到了。<\/li><\/ul>\n<blockquote>记忆口诀：<strong>\"快速重传阈值是 3 个重复 ACK 不是 1 个——1~2 个可能只是乱序，3 个才能判定真丢包。高频细节！\"<\/strong><\/blockquote>"}, {"q": "5.3 SACK 与 D-SACK？", "tag": "进阶", "body": "<p><strong>标准答案<\/strong>：<\/p>\n<ul><li><strong>SACK（选择确认）<\/strong>：精确报告已收到的非连续区间，只重传真正丢的段（传统 ACK 只能确认连续部分）。<\/li><li><strong>D-SACK（重复 SACK）<\/strong>：报告重复收到的段，让发送方区分\"重传导致重复\"还是\"绕路迟到\"，优化 RTO 估算。<\/li><\/ul>\n<blockquote>记忆口诀：<strong>\"SACK 治'中间丢了一截'，D-SACK 治'我重复收到'。高带宽高延迟链路收益最大。\"<\/strong><\/blockquote>"}, {"q": "5.4 滑动窗口与流量控制（rwnd）？", "tag": "高频", "body": "<p><strong>标准答案<\/strong>：<\/p>\n<ul><li><strong>滑动窗口<\/strong>：发送方维护窗口连续发送、累积确认，不必逐包等待。<\/li><li><strong>流量控制<\/strong>：接收方在 ACK 里带 <code>rwnd<\/code>（我还能收多少），发送窗口 = <code>min(swnd, rwnd, cwnd)<\/code>。<\/li><li><strong>零窗口<\/strong>：rwnd=0 停发，用窗口探测（persist timer 发 1 字节）打破死锁。<\/li><\/ul>\n<blockquote>记忆口诀：<strong>\"流控（rwnd）防'我收不过来'，拥塞控制（cwnd）防'网络受不了'——两个独立窗口，取小者。\"<\/strong><\/blockquote>"}, {"q": "5.5 拥塞控制四阶段？", "tag": "高频", "body": "<p><strong>标准答案<\/strong>：<\/p>\n<ol><li><strong>慢启动<\/strong>：cwnd 从 1（实为 10）个 MSS 指数增长，到 ssthresh 停止。<\/li><li><strong>拥塞避免<\/strong>：超过 ssthresh 后线性增长（每 RTT +1）。<\/li><li><strong>快速恢复<\/strong>：3 个重复 ACK 触发，cwnd <strong>减半<\/strong>而非清零，配合快速重传。<\/li><li><strong>超时重传<\/strong>：视为严重拥塞，cwnd 归 1、ssthresh 减半，重新慢启动。<\/li><\/ol>\n<blockquote>记忆口诀：<strong>\"AIMD 灵魂：加性增、乘性减。重复 ACK 减半、超时清零——区别必考。\"Linux 默认 CUBIC，新内核支持 BBR。<\/strong><\/blockquote>"}, {"q": "5.6 CUBIC 与 BBR 的区别？", "tag": "进阶", "body": "<p><strong>标准答案<\/strong>：<\/p>\n<ul><li><strong>CUBIC<\/strong>（Linux 默认）：三次函数控制窗口增长，与 RTT 无关，适合大带宽长链路；用<strong>丢包<\/strong>当拥塞信号。<\/li><li><strong>BBR<\/strong>（Google）：不靠丢包，持续探测<strong>带宽×时延（BDP）<\/strong>，把窗口稳定在 BDP 附近；高丢包高带宽链路吞吐远超 CUBIC（YouTube 提升 2~25 倍）。<\/li><\/ul>\n<blockquote>记忆口诀：<strong>\"CUBIC 靠丢包判拥塞，BBR 靠测量定窗口。BBR 的争议：会吃掉瓶颈路由器排队缓存，bbr2 才修公平性。\"<\/strong><\/blockquote>"}, {"q": "5.7 粘包与拆包的原因和解决？", "tag": "高频", "body": "<p><strong>标准答案<\/strong>：<\/p>\n<ol><li><strong>原因<\/strong>：TCP 是<strong>字节流协议<\/strong>，不保留应用消息边界——多次 send 可能合并交付（Nagle、缓冲区），一次 send 可能拆开发送。<\/li><li><strong>解决四选一<\/strong>：<\/li><\/ol>\n<ul><li><strong>定长消息<\/strong>：固定长度切分（浪费）。<\/li><li><strong>分隔符<\/strong>：<code>\\n<\/code> 结尾（Redis RESP；要处理转义）。<\/li><li><strong>长度前缀<\/strong>（最常用）：4 字节长度头 + 载荷（HTTP/2 帧、Netty）。<\/li><li><strong>自定义协议<\/strong>：魔数+版本+长度（Dubbo、MQ）。<\/li><\/ul>\n<blockquote>记忆口诀：<strong>\"粘包不是 TCP 的 Bug，是流协议没有消息边界的必然。UDP 是数据报天然不粘包。实时场景可关 Nagle（TCP_NODELAY）。\"<\/strong><\/blockquote>\n<hr>"}]}, {"title": "06 长连接保活与连接数量", "questions": [{"q": "6.1 TCP KeepAlive 的三个内核参数？", "tag": "高频", "body": "<p><strong>标准答案<\/strong>：<\/p>\n<ul><li><code>tcp_keepalive_time<\/code>（默认 <strong>7200s<\/strong>）：空闲多久开始探测。<\/li><li><code>tcp_keepalive_intvl<\/code>（默认 <strong>75s<\/strong>）：探测包间隔。<\/li><li><code>tcp_keepalive_probes<\/code>（默认 <strong>9<\/strong>）：连续几次无响应判定死亡。<\/li><\/ul>\n<blockquote>记忆口诀：<strong>\"7200+75×9≈2.2 小时才能发现对方死了——太慢，所以实时场景必须应用层心跳。\"KeepAlive 只保活已建立连接。<\/strong><\/blockquote>"}, {"q": "6.2 应用层心跳 vs TCP KeepAlive？", "tag": "高频", "body": "<p><strong>标准答案<\/strong>：<\/p>\n<ul><li><strong>TCP KeepAlive<\/strong>：内核实现，间隔 2 小时太慢，只知道\"连接死没死\"，防僵尸连接。<\/li><li><strong>应用层心跳<\/strong>：应用代码实现，间隔可控（如 30s），可携带业务数据，真正检测活跃度。<\/li><li><strong>实践<\/strong>：两者都用——TCP KeepAlive 兜底清理僵尸，应用心跳做活跃检测（连续 N 次未收到才判死，防抖动）。<\/li><\/ul>\n<blockquote>记忆口诀：<strong>\"30s 是工程经验值——要小于运营商 NAT 映射超时（约 30~120s），否则映射被回收连接被掐。\"<\/strong><\/blockquote>"}, {"q": "6.3 长连接 vs 短连接怎么选？", "tag": "高频", "body": "<p><strong>标准答案<\/strong>：<\/p>\n<ul><li><strong>短连接<\/strong>：每次 3 次握手+4 次挥手，时延多 1~2 RTT，产生大量 TIME_WAIT；适合低频一次性请求。<\/li><li><strong>长连接<\/strong>：首次建连后复用，无额外握手 RTT，常驻 fd/内存/保活开销；适合高频交互、实时推送、内部 RPC。<\/li><li><strong>选择<\/strong>：B/S 高频 → Keep-Alive/HTTP/2；RPC/DB/Redis/MQ → 连接池长连接；低频一次性 → 短连接。<\/li><\/ul>\n<blockquote>记忆口诀：<strong>\"短连接瓶颈在握手 RTT，长连接瓶颈在连接管理与保活——HTTP/2 多路复用本质是驯服建连成本。\"<\/strong><\/blockquote>"}, {"q": "6.4 一台服务器最多能建立多少 TCP 连接？", "tag": "高频", "body": "<p><strong>标准答案（四重约束）<\/strong>：<\/p>\n<ol><li><strong>fd<\/strong>（最直接）：每连接至少 1 个 fd，<code>ulimit -n<\/code> 决定。<\/li><li><strong>内存<\/strong>：每连接内核态约 3~4KB，百万连接 3~4GB+，加用户态轻松几十 GB。<\/li><li><strong>端口<\/strong>：服务端监听同一端口可接受海量连接（靠客户端端口区分）；客户端单 IP 最多约 6.5 万源端口。<\/li><li><strong>CPU 中断<\/strong>：每连接收发包触发软中断，隐藏瓶颈。<\/li><\/ol>\n<blockquote>记忆口诀：<strong>\"C10K 过时了，现代 epoll 单机百万连接；C10M 要靠 DPDK/XDP 内核旁路。瓶颈不是内核，是 fd/内存/中断的工程调配。\"<\/strong><\/blockquote>"}, {"q": "6.5 C10K / C10M 与 epoll？", "tag": "高频", "body": "<p><strong>标准答案<\/strong>：<\/p>\n<ul><li><strong>C10K 解法 = I/O 多路复用<\/strong>：<\/li><li><strong>select/poll<\/strong>：全量 fd 拷用户态，O(n) 遍历，低效。<\/li><li><strong>epoll<\/strong>（Linux）：事件驱动+就绪回调，只返回就绪 fd，O(1)。ET（边缘触发）vs LT（水平触发）。<\/li><li>macOS 用 <strong>kqueue<\/strong>，Windows 用 <strong>IOCP<\/strong>。<\/li><li><strong>C10M<\/strong>：epoll 不够，需 DPDK/XDP 内核旁路、多队列网卡（RSS）、无锁编程。<\/li><\/ul>\n<blockquote>记忆口诀：<strong>\"LT 有数据就通知（编程简单），ET 只通知一次必须读干净（配非阻塞循环）。Redis/Node 用 ET，Netty 默认 LT。\"<\/strong><\/blockquote>\n<hr>"}]}, {"title": "07 UDP 与可靠 UDP", "questions": [{"q": "7.1 UDP 为什么\"无连接\"？", "tag": "基础", "body": "<p><strong>标准答案<\/strong>：<\/p>\n<ul><li>UDP 头仅 <strong>8 字节<\/strong>：源端口、目的端口、长度、校验和——没有序号/确认/窗口/状态，所以不需要连接。<\/li><li>\"无连接\"三层含义：<strong>无需握手、无状态（内核无连接表）、无保证<\/strong>（不保证送达/有序/不重复）。<\/li><\/ul>\n<blockquote>记忆口诀：<strong>\"UDP 头短到只有 8 字节，才能让 QUIC 在用户态把连接状态搬上来自造——这是 QUIC/KCP 能落地的前提。\"<\/strong><\/blockquote>"}, {"q": "7.2 UDP 报文最大多大？MTU 分片？", "tag": "进阶", "body": "<p><strong>标准答案<\/strong>：<\/p>\n<ul><li><strong>理论最大<\/strong>：长度字段 16 bit，载荷最大 <strong>65507 字节<\/strong>（减 IP 头 20 + UDP 头 8）。<\/li><li><strong>实际限制<\/strong>：超过 MTU（以太网 1500）触发 IP 分片，<strong>丢一片整个报文作废<\/strong>（IP 不重传）。<\/li><li><strong>最佳实践<\/strong>：载荷 ≤ <strong>1472 字节<\/strong>（1500-20-8），或应用层分片+序号重组（QUIC）。<\/li><\/ul>\n<blockquote>记忆口诀：<strong>\"1472 是安全线。PMTUD 防分片，但某些网络静默丢大包——'小包通、大包不通'就是 PMTUD 失效的经典故障。\"<\/strong><\/blockquote>"}, {"q": "7.3 如何基于 UDP 实现可靠传输？", "tag": "高频", "body": "<p><strong>标准答案（自研 RUDP 六要素）<\/strong>：<\/p>\n<ol><li><strong>序号<\/strong>：检测丢包/乱序/重复。<\/li><li><strong>ACK/NACK + 重传<\/strong>：NACK（报丢哪些）比纯 ACK 高效；超时+快速重传。<\/li><li><strong>缓冲排序<\/strong>：重排乱序报文。<\/li><li><strong>流量控制<\/strong>：滑动窗口。<\/li><li><strong>拥塞控制<\/strong>：可选（游戏常简化）。<\/li><li><strong>连接 ID<\/strong>：代替四元组，支持连接迁移。<\/li><\/ol>\n<blockquote>记忆口诀：<strong>\"RUDP = 把 TCP 的能力挑着抄到 UDP 上。别从零造轮子——直接用 QUIC 或 KCP，拥塞控制做对太难。\"<\/strong><\/blockquote>"}, {"q": "7.4 QUIC 的核心特性？", "tag": "进阶", "body": "<p><strong>标准答案（五点）<\/strong>：<\/p>\n<ol><li><strong>0-RTT/1-RTT 建连<\/strong>：首次 1-RTT，复用会话 0-RTT（比 TCP+TLS 的 2~3 RTT 快）。<\/li><li><strong>连接 ID 与连接迁移<\/strong>：不绑 IP:端口，<strong>换网不断连<\/strong>。<\/li><li><strong>无队头阻塞<\/strong>：按 stream 独立可靠传输，一个 stream 丢包不影响其他。<\/li><li><strong>TLS 1.3 内嵌<\/strong>：加密与传输握手合一。<\/li><li><strong>用户态实现<\/strong>：迭代快，无需 NAT 打洞。<\/li><\/ol>\n<blockquote>记忆口诀：<strong>\"HTTP/2 的队头阻塞在 TCP 层——丢一个包整条连接上的流全等；QUIC 把它隔离到单 stream，这是 HTTP/3 选 QUIC 的根本原因。\"<\/strong><\/blockquote>"}, {"q": "7.5 TCP 与 UDP 如何选择？", "tag": "高频", "body": "<p><strong>标准答案（决策模型）<\/strong>：<\/p>\n<ol><li>要可靠+有序+通用 → <strong>TCP<\/strong>（HTTP、DB、文件、RPC）。<\/li><li>容忍少量丢失但要低时延 → <strong>UDP<\/strong>（音视频、游戏指令）。<\/li><li>要可靠又要低时延/连接迁移 → <strong>QUIC<\/strong>。<\/li><li>广播/组播/任播 → <strong>只能 UDP<\/strong>。<\/li><li>DNS → UDP 为主，超时重试切 TCP。<\/li><\/ol>\n<blockquote>记忆口诀：<strong>\"TCP 用时间换可靠，UDP 用不可靠换时间，QUIC 两个都要。视频会议不用 TCP：丢包重传+队头阻塞会卡顿，宁可丢旧帧渲染新帧。\"<\/strong><\/blockquote>\n<hr>"}]}, {"title": "08 HTTP 连接模型演进", "questions": [{"q": "8.1 HTTP/1.0 与 HTTP/1.1 连接的区别？", "tag": "高频", "body": "<p><strong>标准答案<\/strong>：<\/p>\n<ul><li><strong>HTTP/1.0<\/strong>：默认<strong>短连接<\/strong>，每请求响应后关闭，重复握手开销大。<\/li><li><strong>HTTP/1.1<\/strong>：默认<strong>持久连接（Keep-Alive）<\/strong>，同一 TCP 连接串行多请求；<code>Connection: close<\/code> 显式关闭。<\/li><\/ul>\n<blockquote>记忆口诀：<strong>\"Keep-Alive 解决了重复握手，但 HTTP/1.1 仍串行+浏览器单域 6 连接上限——这两个痛点正是 HTTP/2 要解决的。\"<\/strong><\/blockquote>"}, {"q": "8.2 HTTP/2 多路复用是什么？", "tag": "高频", "body": "<p><strong>标准答案<\/strong>：<\/p>\n<ol><li><strong>二进制分帧<\/strong>：请求响应拆成帧，帧带 <strong>Stream ID<\/strong>。<\/li><li><strong>多路复用<\/strong>：一个 TCP 连接并发多个流，帧交错发送，<strong>响应可乱序<\/strong>（按流 ID 重组），消除 HTTP 层队头阻塞。<\/li><li><strong>HPACK 头部压缩<\/strong>：体积降 80%+。<\/li><li><strong>Server Push<\/strong>：服务端主动推资源（已渐弃用）。<\/li><\/ol>\n<blockquote>记忆口诀：<strong>\"HTTP/2 解决了 HTTP 层的队头阻塞，但 TCP 层还在——丢一个包，整条连接所有流都等。这句接不上就露怯了。\"<\/strong><\/blockquote>"}, {"q": "8.3 HTTP/2 为什么还有队头阻塞？", "tag": "进阶", "body": "<p><strong>标准答案<\/strong>：<\/p>\n<ul><li>所有流共享一个 TCP 连接，<strong>一个流的包丢失 → TCP 接收缓冲按序交付 → 整条连接所有流阻塞<\/strong>，直到重传到达。<\/li><li><strong>量化<\/strong>：丢包率 0.1% 仍优于 HTTP/1.1；<strong>超过 1~2% 反而更慢<\/strong>（HTTP/1.1 多连接互相独立）。<\/li><\/ul>\n<blockquote>记忆口诀：<strong>\"临界点：丢包率 1~2% 是 HTTP/2 与 HTTP/1.1 的胜负手——答出这个量化结论，面试官会认为你真懂。\"<\/strong><\/blockquote>"}, {"q": "8.4 HTTP/3 相对 HTTP/2 的改进？", "tag": "进阶", "body": "<p><strong>标准答案<\/strong>：<\/p>\n<ol><li><strong>无 TCP 层队头阻塞<\/strong>：QUIC 按流独立可靠传输，一个流丢包不影响其他流。<\/li><li><strong>0-RTT 建连<\/strong>：复用缓存参数与 TLS 密钥（有重放风险，仅幂等请求）。<\/li><li><strong>连接迁移<\/strong>：连接 ID 不随 IP 变，Wi-Fi 切 4G 不断连。<\/li><li><strong>基于 UDP<\/strong>：用户态实现，迭代快。<\/li><\/ol>\n<blockquote>记忆口诀：<strong>\"TCP+TLS1.3 约 2 RTT，HTTP/3 首次 1 RTT、复用 0 RTT。移动端弱网收益最大，2023 起三大浏览器默认启用。\"<\/strong><\/blockquote>"}, {"q": "8.5 HTTP 连接池如何复用连接？", "tag": "高频", "body": "<p><strong>标准答案（池化四机制）<\/strong>：<\/p>\n<ol><li><strong>缓存<\/strong>：按 (scheme, host, port) 分组存空闲连接。<\/li><li><strong>复用<\/strong>：优先取池中空闲连接，超时未取到才新建。<\/li><li><strong>驱逐<\/strong>：空闲超时、连接数上限、过期清理。<\/li><li><strong>健康检查<\/strong>：取出时校验可用性，失效废弃重建。<\/li><\/ol>\n<blockquote>记忆口诀：<strong>\"连接池=以空间换时间+复用昂贵建连成本。HTTP/2 时代池的'路由'从连接细化到流，连接需求大降。\"<\/strong><\/blockquote>\n<hr>"}]}, {"title": "09 WebSocket", "questions": [{"q": "9.1 WebSocket 握手过程？", "tag": "高频", "body": "<p><strong>标准答案<\/strong>：<\/p>\n<ol><li>客户端发 HTTP Upgrade 请求：<code>Upgrade: websocket<\/code> + <code>Sec-WebSocket-Key<\/code>（随机 16 字节 base64）+ <code>Sec-WebSocket-Version: 13<\/code>。<\/li><li>服务器算 <code>Sec-WebSocket-Accept = Base64(SHA1(Key + \"258EAFA5-E914-47DA-95CA-C5AB0DC85B11\"))<\/code>，回 <code>101 Switching Protocols<\/code>。<\/li><li>升级为全双工双向数据通道。<\/li><\/ol>\n<blockquote>记忆口诀：<strong>\"Key 防缓存代理伪造。握手后连接不复用给普通 HTTP——网关/负载均衡必须放行 upgrade 头，否则被截断。\"<\/strong><\/blockquote>"}, {"q": "9.2 WebSocket 与轮询、SSE 的对比？", "tag": "高频", "body": "<p><strong>标准答案<\/strong>：<\/p>\n<ul><li><strong>轮询<\/strong>：客户端定时拉，单向，开销高。<\/li><li><strong>长轮询<\/strong>：挂起请求直到有数据，单向，弱网兜底。<\/li><li><strong>SSE<\/strong>：服务器→客户端单向流，HTTP 协议，<strong>内置重连（Last-Event-ID）<\/strong>。<\/li><li><strong>WebSocket<\/strong>：<strong>全双工双向<\/strong>，独立帧协议，实时性最好，重连需自实现。<\/li><\/ul>\n<blockquote>记忆口诀：<strong>\"只做服务器单向推送优先 SSE（简单+自带重连）；要双向交互才上 WebSocket。不是所有实时场景都该用 WS——成熟话术。\"<\/strong><\/blockquote>"}, {"q": "9.3 WebSocket 帧结构与掩码的作用？", "tag": "进阶", "body": "<p><strong>标准答案<\/strong>：<\/p>\n<ul><li>帧字段：<strong>FIN<\/strong>（最后帧）、<strong>opcode<\/strong>（0x1 文本/0x2 二进制/0x8 关闭/0x9 Ping/0xA Pong）、<strong>MASK<\/strong>、<strong>Payload len<\/strong>、<strong>Masking-Key<\/strong>。<\/li><li><strong>掩码规则<\/strong>：客户端→服务器必须置 MASK=1，服务器→客户端必须为 0。<\/li><\/ul>\n<blockquote>记忆口诀：<strong>\"掩码的真实目的是防'缓存投毒攻击'——让载荷对中间代理不可预测，破坏向缓存注入伪造 HTTP 响应的攻击。答出这点非常加分。\"<\/strong><\/blockquote>"}, {"q": "9.4 WebSocket 心跳与断线重连策略？", "tag": "高频", "body": "<p><strong>标准答案<\/strong>：<\/p>\n<ul><li><strong>心跳<\/strong>：优先用协议自带 Ping/Pong 帧；N 次无 Pong 判定断线。<\/li><li><strong>重连<\/strong>：立即重连 → <strong>指数退避+随机抖动<\/strong>（1s/2s/4s…上限 30s）→ 重连后恢复鉴权/订阅/补消息 → 服务端限流防死循环。<\/li><\/ul>\n<blockquote>记忆口诀：<strong>\"纯指数退避会导致'雷群效应'（N 个客户端同时重连打爆服务器），必须加抖动分散。云厂商 SDK 全是'退避+抖动+上限'三段式。\"<\/strong><\/blockquote>\n<hr>"}]}, {"title": "10 连接池", "questions": [{"q": "10.1 为什么需要连接池？", "tag": "基础", "body": "<p><strong>标准答案<\/strong>：<\/p>\n<ol><li><strong>建连成本高<\/strong>：三次握手+鉴权+初始化（MySQL 认证、权限校验），动辄数十 ms。<\/li><li><strong>无池痛点<\/strong>：高并发下握手风暴、TIME_WAIT 爆炸、数据库连接风暴。<\/li><li><strong>池化收益<\/strong>：复用摊薄成本、限流保护下游、预热与监控。<\/li><\/ol>\n<blockquote>记忆口诀：<strong>\"池的本质 = 昂贵初始化与高频使用解耦。池化三要素：容量上限、空闲回收、生命周期管理——所有池都逃不出这三件事。\"<\/strong><\/blockquote>"}, {"q": "10.2 数据库连接池核心参数（HikariCP）？", "tag": "高频", "body": "<p><strong>标准答案（必背参数）<\/strong>：<\/p>\n<table><thead><tr><th>参数<\/th><th>默认<\/th><th>作用<\/th><\/tr><\/thead><tbody><tr><td>maximumPoolSize<\/td><td>10<\/td><td>池最大连接数<\/td><\/tr><tr><td>minimumIdle<\/td><td>10<\/td><td>最少空闲连接<\/td><\/tr><tr><td>connectionTimeout<\/td><td>30s<\/td><td>获取连接超时<\/td><\/tr><tr><td>idleTimeout<\/td><td>10min<\/td><td>空闲回收（仅当空闲>minimumIdle）<\/td><\/tr><tr><td>maxLifetime<\/td><td>30min<\/td><td>连接最大存活<\/td><\/tr><tr><td>leakDetectionThreshold<\/td><td>0<\/td><td>泄漏检测阈值<\/td><\/tr><\/tbody><\/table>\n<blockquote>记忆口诀：<strong>\"maxLifetime 必须 < 数据库 wait_timeout（MySQL 8h），否则'僵尸连接'报错——最经典的坑。\"<\/strong><\/blockquote>"}, {"q": "10.3 连接池大小怎么设置？", "tag": "高频", "body": "<p><strong>标准答案<\/strong>：<\/p>\n<ul><li><strong>误区<\/strong>：连接越多吞吐越高？错！连接是串行执行 SQL 的资源，CPU 核数是真实上限，池过大反而降吞吐。<\/li><li><strong>经验公式<\/strong>：<code>连接数 = CPU核数 × 2 + 有效磁盘数<\/code>（HDD；SSD 场景乘 4~8）。<\/li><li><strong>调参目标<\/strong>：P99 延迟达标 + 池使用率 30~60%，配合压测三档对比。<\/li><\/ul>\n<blockquote>记忆口诀：<strong>\"一个活跃连接同一时刻只能跑一个查询，并发收益上限≈CPU 核数×（1/IO 等待占比）——和线程池大小是同一套建模逻辑。\"<\/strong><\/blockquote>"}, {"q": "10.4 连接泄漏怎么排查？", "tag": "高频", "body": "<p><strong>标准答案<\/strong>：<\/p>\n<ol><li><strong>现象<\/strong>：拿连接没归还（异常未 finally、线程持有不放）→ 池耗尽 → \"connection pool exhausted\"。<\/li><li><strong>排查<\/strong>：<code>leakDetectionThreshold=5000<\/code>（持有超 5s 打印完整调用栈，定位到代码行）+ 监控池使用率。<\/li><li><strong>根治<\/strong>：try-with-resources / with 语法 + 代码评审 + <code>connectionTimeout<\/code> 兜底。<\/li><\/ol>\n<blockquote>记忆口诀：<strong>\"泄漏检测只能事后发现，防不了泄漏；更本质的是编码规范+超时兜底。leakDetectionThreshold 必须 < connectionTimeout 才有意义。\"<\/strong><\/blockquote>\n<hr>"}]}, {"title": "11 排障与场景题", "questions": [{"q": "11.1 线上大量 TIME_WAIT 怎么排查处理？", "tag": "高频", "body": "<p><strong>标准答案<\/strong>：<\/p>\n<pre><code class=\"lang-bash\">ss -ant | awk '{print $1}' | sort | uniq -c | sort -rn\nss -ant state time-wait | awk '{print $4}' | sort | uniq -c | sort -rn<\/code><\/pre>\n<ol><li><strong>根因<\/strong>：本机是主动关闭方 + 短连接高频建断。<\/li><li><strong>处理<\/strong>：连接复用（治本）→ 确认数量是否影响可用性（几万内无感）→ <code>tcp_tw_reuse=1<\/code>（仅客户端）+ 时间戳 → 架构调整让对端断开。<\/li><\/ol>\n<blockquote>记忆口诀：<strong>\"TIME_WAIT 不是故障，端口耗尽才是：每秒新建×60s 接近 6.5 万才危险。别急着清零，先看每秒新建速率。\"<\/strong><\/blockquote>"}, {"q": "11.2 线上大量 CLOSE_WAIT 怎么排查处理？", "tag": "高频", "body": "<p><strong>标准答案<\/strong>：<\/p>\n<pre><code class=\"lang-bash\">ss -antp | grep CLOSE_WAIT | head -20   # 定位进程\njstack &lt;pid&gt;                            # 找阻塞线程<\/code><\/pre>\n<ol><li><strong>根因<\/strong>：被动关闭方收到 FIN 后应用没 close()。<\/li><li><strong>排查顺序<\/strong>：<strong>ss 定位进程 → jstack 找阻塞线程（先看线程池！）→ 代码审计 close 路径<\/strong>。<\/li><li><strong>兜底<\/strong>：调 <code>tcp_keepalive_time<\/code> 加速回收（治标）。<\/li><\/ol>\n<blockquote>记忆口诀：<strong>\"CLOSE_WAIT 三板斧：ss 定位 → jstack 查线程池 → 审计 close。大多数堆积是'线程池被慢下游占满，没机会 close'，先看线程池比先看代码高效。\"<\/strong><\/blockquote>"}, {"q": "11.3 connect timeout 与 read timeout 的区别？", "tag": "高频", "body": "<p><strong>标准答案<\/strong>：<\/p>\n<ul><li><strong>connect timeout<\/strong>：握手完成的等待上限。原因：目标不可达、防火墙丢 SYN、半连接队列满。建议：<strong>局域网 1~3s，公网 3~5s<\/strong>。<\/li><li><strong>read timeout<\/strong>：连接建立后等响应数据的时限。原因：服务端慢、死锁、拥塞。建议：<strong>业务 P99 × 3~5<\/strong>。<\/li><\/ul>\n<blockquote>记忆口诀：<strong>\"connect 要短（快速失败），read 要按业务容忍度给足余量。read 超时后多数框架直接关连接——连接不可复用。\"<\/strong><\/blockquote>"}, {"q": "11.4 断线重连策略？", "tag": "高频", "body": "<p><strong>标准答案<\/strong>：<\/p>\n<pre><code>delay = min(base * 2^attempt, max_delay) + random(0, jitter)<\/code><\/pre>\n<ol><li><strong>成功连接后重置计数<\/strong>。<\/li><li><strong>连续失败达上限进入长等待<\/strong>，防死循环。<\/li><li><strong>重连后恢复状态<\/strong>：重放订阅/鉴权/断点续传。<\/li><li><strong>服务端记录重连频率，超频拒绝<\/strong>。<\/li><\/ol>\n<blockquote>记忆口诀：<strong>\"jitter 的理由：N 个客户端同时断网恢复时，无抖动会集体重连（惊群）把刚恢复的服务器再次打挂。Kafka 消费者、云 SDK 全内置。\"<\/strong><\/blockquote>"}, {"q": "11.5 NAT 穿透与 UDP 打洞？", "tag": "进阶", "body": "<p><strong>标准答案<\/strong>：<\/p>\n<ol><li><strong>NAT 四类型<\/strong>（松→严）：<strong>全锥形 → 受限锥形 → 端口受限锥形 → 对称 NAT<\/strong>。<\/li><li><strong>UDP 打洞<\/strong>：双方同时向对方公网地址发 UDP，利用\"受限锥形允许已通信 IP 反向发包\"互相踩通映射。<\/li><li><strong>对称 NAT 下打洞必失败<\/strong> → 兜底 <strong>TURN 中继<\/strong>（WebRTC：先 P2P 后降级 TURN）。<\/li><\/ol>\n<blockquote>记忆口诀：<strong>\"打洞适用受限锥形，对称 NAT 必须 TURN。TCP 打洞更难（SYN 时序不可控），P2P 一般 UDP 打洞+上层可靠协议。\"<\/strong><\/blockquote>"}, {"q": "11.6 百万长连接网关架构怎么设计（IM 场景）？", "tag": "进阶", "body": "<p><strong>标准答案（六层设计）<\/strong>：<\/p>\n<ol><li><strong>接入层无状态集群<\/strong>：epoll 支撑十万~百万级连接，连接只在本机。<\/li><li><strong>会话路由<\/strong>：Redis 记录 userId → 网关节点。<\/li><li><strong>水平扩展<\/strong>：服务发现自动注册，客户端重连路由新节点。<\/li><li><strong>心跳与踢人<\/strong>：30s 心跳判离线，同账号踢旧连接。<\/li><li><strong>消息可靠性<\/strong>：客户端 ack + 服务端序号 + 离线消息落 MQ/DB。<\/li><li><strong>瓶颈点<\/strong>：fd 上限、每连接内存（压到 2~4KB）、CPU 软中断（多队列 RSS）、GC 停顿（Netty 堆外内存）。<\/li><\/ol>\n<blockquote>记忆口诀：<strong>\"IM 核心哲学：连接与状态分离——连接可丢、状态不丢。网关挂了 = 客户端重连新网关 + 从 Redis 恢复状态，用户无感知。\"<\/strong><\/blockquote>\n<hr>\n<blockquote>整理完成：11 大章节 55 题，八股文速记版。与《网络连接类型面试题深度整理》配套使用——深度版讲原理、八股版供背诵。建议按章节逐章背诵，先记「记忆口诀」再补「标准答案」细节。<\/blockquote>"}]}], "qcount": 55}, {"sub": "题库深度版", "chapters": [{"title": "01 连接的本质与分类", "questions": [{"q": "1.1 什么是\"网络连接\"？物理连接与逻辑连接的区别？", "tag": "基础", "body": "<p><strong>网络连接<\/strong>是通信双方在传输数据前建立的一种\"通路\"概念，但必须区分两个层面：<\/p>\n<ul><li><strong>物理连接<\/strong>：真实存在的硬件链路，如网线、光纤、交换机端口之间的电气/光信号通路。它是\"线\"的存在。<\/li><li><strong>逻辑连接<\/strong>（软件连接）：在物理链路上，由协议栈软件维护的一条\"虚拟通路\"状态，如 TCP 连接（四元组 + 状态机）、HTTP 连接（请求/响应会话）、VPN 隧道。它是\"状态\"的存在。<\/li><\/ul>\n<blockquote>加分点：物理连接是共享的，逻辑连接是复用的——成千上万条 TCP 连接可能共享同一根光纤（分组交换），这正是\"逻辑连接\"存在的意义：在共享介质上抽象出隔离的会话。<\/blockquote>"}, {"q": "1.2 面向连接 vs 无连接：TCP 与 UDP 的本质差异", "tag": "高频", "body": "<table><thead><tr><th>维度<\/th><th>面向连接（TCP）<\/th><th>无连接（UDP）<\/th><\/tr><\/thead><tbody><tr><td>连接建立<\/td><td>三次握手建立连接<\/td><td>无握手，直接发包<\/td><\/tr><tr><td>状态维护<\/td><td>两端维护连接状态机<\/td><td>无状态<\/td><\/tr><tr><td>可靠性<\/td><td>确认、重传、排序、去重<\/td><td>尽最大努力交付<\/td><\/tr><tr><td>流量/拥塞控制<\/td><td>有（滑动窗口 + 拥塞控制）<\/td><td>无<\/td><\/tr><tr><td>报文边界<\/td><td>字节流，无边界（粘包）<\/td><td>保留报文边界<\/td><\/tr><tr><td>首部开销<\/td><td>20 字节<\/td><td>8 字节<\/td><\/tr><tr><td>典型场景<\/td><td>HTTP、数据库、文件传输<\/td><td>DNS、音视频、游戏、QUIC<\/td><\/tr><\/tbody><\/table>\n<blockquote>加分点：口语化的\"TCP 要连接、UDP 不要连接\"并不精确——<strong>\"连接\"的本质是两端协同维护的会话状态<\/strong>，TCP 用握手 + 序号 + 窗口 + 重传把不可靠的 IP 网络抽象成可靠字节流；UDP 只是 IP 之上加了一个 8 字节端口复用层，其他一律不管。<\/blockquote>"}, {"q": "1.3 单播、广播、组播（多播）、任播的区别", "tag": "基础", "body": "<p>这是按<strong>目的地址的寻址范围/接收者数量<\/strong>划分的\"连接/通信类型\"：<\/p>\n<ul><li><strong>单播（Unicast）<\/strong>：一对一，发送方与唯一接收方通信。TCP、绝大多数 HTTP 都是单播。<\/li><li><strong>广播（Broadcast）<\/strong>：一对全部，发给本网段所有主机（目的地址 <code>255.255.255.255<\/code> 或子网广播地址）。只存在于 IPv4，IPv6 用组播取代。<\/li><li><strong>组播（Multicast）<\/strong>：一对多，只发给\"订阅了该组地址\"的主机（IPv4 的 <code>224.0.0.0/4<\/code>，IPv6 的 <code>FF00::/8<\/code>）。直播、IPTV、路由协议（OSPF 用 224.0.0.5/6）。<\/li><li><strong>任播（Anycast）<\/strong>：一对最近，多个主机共享同一地址，路由器把报文送给\"最近\"的一个。DNS（8.8.8.8、1.1.1.1）、CDN、Anycast TCP 常用于抗 DDoS。<\/li><\/ul>\n<blockquote>加分点：面试升级点——<strong>TCP 只能单播<\/strong>（因为需要端到端状态与确认），UDP 天然支持广播/组播/任播；但任播 + TCP 在 CDN/DNS 场景大量使用（多台服务器共享 IP，靠 BGP 路由到最近节点），这不矛盾：连接是建立在\"被路由选中的那一台\"上的。<\/blockquote>"}, {"q": "1.4 电路交换 vs 分组交换；虚电路 vs 数据报", "tag": "进阶", "body": "<ul><li><strong>电路交换（Circuit Switching）<\/strong>：通信前先建立<strong>独占物理通路<\/strong>（如老式电话），期间独占带宽，线路利用率低，建立慢，但时延稳定。连接 = 物理通路本身。<\/li><li><strong>分组交换（Packet Switching）<\/strong>：数据拆成分组独立路由转发，链路共享，利用率高，但可能乱序/丢失。互联网本质是分组交换。<\/li><\/ul>\n<p>分组交换再分两种\"连接形态\"：<\/p>\n<ul><li><strong>虚电路（Virtual Circuit）<\/strong>：发送前先建立逻辑通路（如 ATM、MPLS、X.25），分组沿同一路径走，网络层有状态。<strong>\"面向连接\"的分组交换<\/strong>。<\/li><li><strong>数据报（Datagram）<\/strong>：每个分组独立选路（IP 就是这样），无连接、无状态、可能乱序。<\/li><\/ul>\n<blockquote>加分点：经典面试点——<strong>TCP 是\"端到端的有状态协议\"，但跑在\"无状态的数据报网络层(IP)\"之上<\/strong>，这正是\"端到端原则\"（End-to-End Principle）的体现：把可靠性放在终端实现，网络只管转发，这是互联网能够大规模扩展的根本原因。<\/blockquote>"}, {"q": "1.5 \"连接\"在 OSI/TCP-IP 各层分别是什么形态？", "tag": "进阶", "body": "<table><thead><tr><th>层级<\/th><th>连接形态<\/th><th>典型协议<\/th><\/tr><\/thead><tbody><tr><td>应用层<\/td><td>应用会话/逻辑连接<\/td><td>HTTP Keep-Alive、WebSocket、TLS Session<\/td><\/tr><tr><td>传输层<\/td><td>端到端连接（四元组+状态机）<\/td><td>TCP、SCTP<\/td><\/tr><tr><td>网络层<\/td><td>无连接数据报（或有虚电路）<\/td><td>IP、MPLS LSP<\/td><\/tr><tr><td>数据链路层<\/td><td>点到点/局域网连接（MAC、VLAN）<\/td><td>以太网、PPP、Wi-Fi 关联<\/td><\/tr><tr><td>物理层<\/td><td>物理链路/信道<\/td><td>铜缆、光纤、无线电波<\/td><\/tr><\/tbody><\/table>\n<blockquote>加分点：一条\"浏览器打开网页\"的链路，从上到下同时存在 5 层连接：TLS 会话（应用）→ TCP 连接（传输）→ IP 路由（网络）→ 以太网链路（链路）→ 光纤信道（物理），面试能把这 5 层对应关系讲清楚，说明真懂网络。<\/blockquote>\n<hr>"}]}, {"title": "02 TCP 连接的建立：三次握手", "questions": [{"q": "2.1 三次握手的过程与每个报文的作用", "tag": "高频", "body": "<ol><li><strong>客户端 → 服务器：SYN=1, seq=x<\/strong>（SYN_SENT 状态）。含义：\"我想建立连接，我的起始序号是 x\"。<\/li><li><strong>服务器 → 客户端：SYN=1, ACK=1, seq=y, ack=x+1<\/strong>（SYN_RCVD 状态）。含义：\"收到你的 SYN，我同意，我的起始序号是 y，期望你下次从 x+1 发\"。<\/li><li><strong>客户端 → 服务器：ACK=1, seq=x+1, ack=y+1<\/strong>（ESTABLISHED）。含义：\"收到你的 SYN+ACK，连接建立\"。<\/li><\/ol>\n<blockquote>加分点：三次握手本质是<strong>同时确认双方的收发能力与序号同步<\/strong>——第 1 次后服务器知道客户端能发、自己能收；第 2 次后客户端知道双方都能收发；第 3 次后服务器确认客户端能收（否则服务器会认为自己的 SYN+ACK 可能丢了，直接进入 ESTABLISHED 会有隐患）。<\/blockquote>"}, {"q": "2.2 为什么是三次握手，而不是两次或四次？", "tag": "高频", "body": "<ul><li><strong>为什么不能两次<\/strong>：核心是<strong>防止失效的历史连接请求突然到达服务器<\/strong>。客户端发了 SYN，但因网络拥塞超时重传，重传的 SYN 建立成功了，而<strong>旧的失效 SYN 才到达<\/strong>——如果两次握手，服务器收到旧 SYN 就会建立连接并分配资源，但客户端根本不会理它（客户端没有这个连接），造成服务器资源浪费，甚至可能把客户端已确认的连接序号搞乱。三次握手时，服务器收到旧 SYN 回 SYN+ACK，客户端发现序号对不上/不是自己期望的连接，直接发 RST 拒绝，服务器才能识别出这是失效连接。<\/li><li><strong>为什么不需要四次<\/strong>：三次已经完成了\"客户端→服务器、服务器→客户端\"双向的收发能力确认与序号同步，第四次是冗余的。<\/li><\/ul>\n<blockquote>加分点：另一个角度——<strong>两次握手无法避免\"半连接\"状态下的资源浪费，也无法在服务器侧区分新旧 SYN<\/strong>；三次握手让<strong>服务器在收到客户端最后的 ACK 前不进入 ESTABLISHED<\/strong>，从而把\"确认对方还活着\"的成本前置给了先发起的一方。<\/blockquote>"}, {"q": "2.3 SYN Flood 攻击原理与防护", "tag": "高频", "body": "<ul><li><strong>原理<\/strong>：攻击者伪造大量源 IP 发送 SYN 包，服务器收到后回 SYN+ACK，但伪造 IP 永远不会回 ACK，导致<strong>半连接队列（SYN 队列）被占满<\/strong>，后续正常客户的 SYN 无法入队，服务不可用。<\/li><li><strong>危害<\/strong>：服务器每接收一个 SYN 都要分配控制块，内存与 CPU 被耗尽；真正的目的是让<strong>全连接队列/半连接队列溢出<\/strong>。<\/li><\/ul>\n<p>防护手段：<\/p>\n<ol><li><strong>SYN Cookie<\/strong>（最核心）：不分配半连接资源，把序号用哈希（源/目的 IP 端口 + 时间 + 密钥）计算出来作为 SYN+ACK 的序号，客户端回 ACK 时校验序号即可直接建立连接。Linux 默认 <code>net.ipv4.tcp_syncookies=1<\/code>。<\/li><li><strong>缩短 SYN 超时<\/strong>：<code>tcp_synack_retries<\/code> 从 5 次降到 1~2 次，快速回收半连接。<\/li><li><strong>限速/黑白名单<\/strong>：网关层识别并丢弃攻击流量（DDoS 清洗）。<\/li><li><strong>tcp_max_syn_backlog 调大<\/strong>：扩容半连接队列，缓解但不治本。<\/li><\/ol>\n<blockquote>加分点：SYN Cookie 的代价是<strong>放弃了一些 TCP 特性<\/strong>（如窗口缩放、SACK 等选项无法在 SYN 阶段协商，需要通过\"TFO/时间戳回填\"补偿），所以它是\"溢出时才启用\"的兜底机制（Linux 中队列满时自动触发）。<\/blockquote>"}, {"q": "2.4 TCP 初始序列号（ISN）为什么不能固定？", "tag": "进阶", "body": "<ul><li>如果 ISN 固定（如恒为 0），攻击者可<strong>预测并伪造<\/strong>带合法序号的报文，实施会话劫持（TCP Spoofing）。<\/li><li>固定的 ISN 还会导致<strong>新旧连接的序号冲突<\/strong>——前一个连接遗留的旧报文（网络中延迟到达）可能与新连接的序号区间重叠，干扰新连接。<\/li><li>现代实现（RFC 1948）：ISN ≈ 时钟（4µs 粒度）+ 四元组相关的随机哈希（防预测）。<\/li><\/ul>\n<blockquote>加分点：Linux 生成 ISN 用 <code>secure_tcp_seq()<\/code>，是<strong>四元组 + 加密密钥的哈希函数<\/strong>，同一连接每次建立得到的 ISN 都不同且不可预测；这也解释了为什么<strong>TIME_WAIT 2MSL 之后旧报文必然消失<\/strong>——ISN 随机化 + 时间窗双重保障新连接不被污染。<\/blockquote>"}, {"q": "2.5 三次握手可以携带数据吗？为什么？", "tag": "进阶", "body": "<ul><li><strong>第一次 SYN 不能携带数据<\/strong>：此时服务器还没确认客户端身份，若携带数据会放大 SYN Flood 攻击面（伪造 SYN 也能让服务器缓存数据）。<\/li><li><strong>第二次 SYN+ACK 不能携带数据<\/strong>：同理，服务器还不能确认客户端可达。<\/li><li><strong>第三次 ACK 可以携带数据<\/strong>：此时客户端已确认服务器可达，是\"捎带数据\"（piggyback）的合法时机，如 HTTP 场景可把首个请求直接捎带在第三次握手上，省一个 RTT。<\/li><\/ul>\n<blockquote>加分点：<strong>TCP Fast Open（TFO）<\/strong> 打破了\"首次 SYN 不能带数据\"的限制——首次连接用 Cookie 认证后，后续连接的 SYN 可携带数据，实现<strong>0-RTT 建连 + 首包数据<\/strong>，Chrome/HTTP 场景收益明显，但需防重放，因此 Cookie 有有效期。<\/blockquote>"}, {"q": "2.6 同时打开（Simultaneous Open）会发生什么？", "tag": "进阶", "body": "<p>双方同时向对方发 SYN：<\/p>\n<ul><li>客户端 A 发 SYN → A 进入 SYN_SENT；B 同时发 SYN → B 也进入 SYN_SENT。<\/li><li>A 收到 B 的 SYN（不是 SYN+ACK），A 进入 <strong>SYN_RCVD<\/strong> 并回 SYN+ACK；B 同样处理。<\/li><li>各自收到对方的 SYN+ACK 后进入 ESTABLISHED。<\/li><li>结果是<strong>双方都成为主动连接方，各自建立一条完整连接（两倍的状态）<\/strong>，RFC 793 允许，但实际几乎不发生（因为客户端/服务器角色通常固定）。<\/li><\/ul>\n<blockquote>加分点：同时打开在 P2P 场景（双方同时拨号到对方）理论上有意义，但现代 NAT 环境下几乎不可能真正同时发出；NAT 穿透一般用 UDP 打洞而非 TCP 同时打开，因为 NAT 对 SYN 的映射策略不可控。<\/blockquote>\n<hr>"}]}, {"title": "03 TCP 连接的释放：四次挥手", "questions": [{"q": "3.1 四次挥手的过程", "tag": "高频", "body": "<ol><li><strong>主动方 A → B：FIN=1, seq=u<\/strong>（A 进入 FIN_WAIT_1）。含义：\"我这边数据发完了，我要关闭发送方向\"。<\/li><li><strong>B → A：ACK=1, ack=u+1<\/strong>（B 进入 CLOSE_WAIT，A 进入 FIN_WAIT_2）。含义：\"收到你的 FIN，但我还有数据要发\"。<\/li><li><strong>B 数据发完后 → A：FIN=1, seq=w<\/strong>（B 进入 LAST_ACK）。含义：\"我这边也发完了，关闭\"。<\/li><li><strong>A → B：ACK=1, ack=w+1<\/strong>（A 进入 TIME_WAIT，B 收到后 CLOSED）。A 等待 2MSL 后 CLOSED。<\/li><\/ol>\n<blockquote>加分点：<strong>FIN 只表示\"发送方向关闭\"<\/strong>，TCP 是双工协议，两个方向独立关闭——这就是为什么需要 4 次而不是 2 次。主动关闭方发 FIN 后仍能接收数据（半关闭），直到对方也发 FIN。<\/blockquote>"}, {"q": "3.2 为什么挥手要四次，而握手只要三次？", "tag": "高频", "body": "<ul><li><strong>握手时<\/strong>：服务器的 SYN 和 ACK 可以<strong>合并<\/strong>（SYN+ACK 一个报文），因为服务器没有\"必须先等业务数据\"的约束。<\/li><li><strong>挥手时<\/strong>：B 收到 A 的 FIN 后，<strong>先回 ACK 表示\"收到关闭请求\"<\/strong>，但此时 B 可能还有业务数据要发送，<strong>不能立即发 FIN<\/strong>，必须等数据发完。所以 FIN 和 ACK 分开发，天然需要 4 次。<\/li><li>只有在\"B 恰好也没有数据要发\"的特殊情况下，FIN 和 ACK 才能合并（3 次挥手）。<\/li><\/ul>\n<blockquote>加分点：本质是<strong>被动关闭方需要一段时间处理完剩余数据<\/strong>，这段时间里 A 处于 FIN_WAIT_2。如果 B 一直不 close（应用层 Bug），A 会一直停在 FIN_WAIT_2，最终由 <code>tcp_fin_timeout<\/code>（默认 60s）兜底关闭——线上排查时 FIN_WAIT_2 堆积通常指向\"对端应用不关连接\"。<\/blockquote>"}, {"q": "3.3 TIME_WAIT 是什么？为什么是 2MSL？", "tag": "高频", "body": "<ul><li><strong>TIME_WAIT<\/strong>：主动关闭方在发送最后一个 ACK 后进入的状态，等待 <strong>2MSL<\/strong>（Maximum Segment Lifetime，报文最大生存时间）后才 CLOSED。Linux 中 MSL≈30s（<code>tcp_fin_timeout<\/code> 相关），即 TIME_WAIT 约 60s。<\/li><li>两个作用：<\/li><\/ul>\n<ol><li><strong>保证最后一个 ACK 能可靠到达<\/strong>：如果第 4 次 ACK 丢失，B 会重发 FIN，A 需要留在 TIME_WAIT 以便重发 ACK；如果 A 直接关闭，B 会一直收不到确认而反复重传 FIN，甚至误判。<\/li><li><strong>让本连接的所有旧报文在网络中消亡<\/strong>：2MSL 覆盖了\"报文去 + ACK 回\"的最长往返时间，确保旧连接的延迟报文不会污染下一个使用相同四元组的新连接。<\/li><\/ol>\n<blockquote>加分点：TIME_WAIT 是<strong>主动关闭方的专利<\/strong>，被动关闭方不会进入（B 收到 FIN 回 ACK 后走 CLOSE_WAIT → LAST_ACK → CLOSED）。所以高并发短连接服务（如 Nginx 作为客户端、爬虫、网关）会出现大量 TIME_WAIT，这是<strong>正常且必要的<\/strong>，不要一味\"清零\"。<\/blockquote>"}, {"q": "3.4 TIME_WAIT 过多怎么处理？", "tag": "高频", "body": "<p>先确认原因：短连接高频建连/断连（如 HTTP/1.0、服务间 RPC 短连接、大量客户端连完就关）。<\/p>\n<p>处理手段（按优先级）：<\/p>\n<ol><li><strong>连接复用<\/strong>（治本）：开启 HTTP Keep-Alive / 连接池，让连接建立后持续复用，从源头减少\"建-断\"次数。<\/li><li><strong>调整内核参数<\/strong>（缓解）：<\/li><\/ol>\n<ul><li><code>net.ipv4.tcp_tw_reuse=1<\/code>：<strong>客户端<\/strong>视角允许复用处于 TIME_WAIT 的连接（必须配合时间戳选项；对服务器端无效）。<\/li><li><code>net.ipv4.tcp_timestamps=1<\/code>：tcp_tw_reuse 的前提。<\/li><li>调小 TIME_WAIT 时长（改 MSL 不推荐，破坏协议语义）。<\/li><\/ul>\n<ol><li><strong>服务器主动关闭改被动<\/strong>：让对端（客户端）主动断开，把 TIME_WAIT 转移出去。<\/li><li><strong>负载均衡<\/strong>：分摊到多台机器，稀释单机 TIME_WAIT。<\/li><\/ol>\n<blockquote>加分点：<strong>强烈不推荐 <code>tcp_tw_recycle<\/code>（已废弃）<\/strong>——它会在 NAT 环境下因为时间戳倒置而误杀正常连接，Linux 4.12 起已删除该参数。面试主动说\"我不用 tcp_tw_recycle，因为 NAT 下时间戳回退会导致新连接被拒\"是明显加分项。<\/blockquote>"}, {"q": "3.5 CLOSE_WAIT 堆积的原因与排查", "tag": "高频", "body": "<ul><li><strong>CLOSE_WAIT<\/strong>：被动关闭方收到 FIN 回 ACK 后，<strong>等待应用层调用 close()<\/strong> 的状态。只要应用不 close，连接就卡在 CLOSE_WAIT。<\/li><li><strong>堆积原因<\/strong>（几乎都是应用层 Bug）：<\/li><\/ul>\n<ol><li>代码只处理了读事件，没处理连接关闭事件（没调用 close）。<\/li><li>处理逻辑抛异常/超时，close 语句没走到。<\/li><li>长连接场景下游不关闭，服务器自己也不主动关。<\/li><li>线程池耗尽，处理线程全部阻塞，无法执行 close。<\/li><\/ol>\n<ul><li><strong>排查<\/strong>：<code>netstat -ant | grep CLOSE_WAIT | wc -l<\/code> 看数量；<code>ss -antp | grep CLOSE_WAIT<\/code> 定位进程；用 jstack 看线程是否卡死；检查代码里 socket 是否在 finally 中关闭。<\/li><\/ul>\n<blockquote>加分点：CLOSE_WAIT 堆积是\"服务器资源泄漏\"的典型信号——连接没释放，fd 耗尽后新连接直接失败。<strong>它与 TIME_WAIT 正好相反：TIME_WAIT 是正常的协议状态，CLOSE_WAIT 几乎都是代码 Bug<\/strong>。一句话记忆：TIME_WAIT 多找网络层/架构，CLOSE_WAIT 多查应用代码。<\/blockquote>"}, {"q": "3.6 半关闭（shutdown）与 close 的区别", "tag": "进阶", "body": "<ul><li><strong>close(fd)<\/strong>：引用计数 -1，当引用计数归零时<strong>立即<\/strong>发送 FIN，并且<strong>释放整个连接<\/strong>（两个方向都关闭）。若还有数据在途，close 会直接丢弃并可能发 RST。<\/li><li><strong>shutdown(fd, SHUT_WR / SHUT_RD / SHUT_RDWR)<\/strong>：<strong>只关闭指定方向<\/strong>，不释放资源：<\/li><li><code>SHUT_WR<\/code>：发 FIN，关闭发送方向，仍可接收（半关闭）。<\/li><li><code>SHUT_RD<\/code>：关闭接收方向。<\/li><li><code>SHUT_RDWR<\/code>：相当于两个方向都 shutdown，但<strong>不释放 fd<\/strong>（仍需 close）。<\/li><li>适用场景：协议要求\"发完请求后关闭发送，但仍要读响应\"（如某些 RPC、FTP）。<\/li><\/ul>\n<blockquote>加分点：多线程共享同一 socket 时，一个线程 close 会让其他线程无法使用；正确做法是用 shutdown 通知对方\"我要关发送\"，等数据收完再 close。这也是\"优雅关闭\"（Graceful Shutdown）的协议层实现基础。<\/blockquote>\n<hr>"}]}, {"title": "04 TCP 状态机与连接队列", "questions": [{"q": "4.1 TCP 11 种状态全解", "tag": "进阶", "body": "<table><thead><tr><th>状态<\/th><th>含义<\/th><th>进入条件<\/th><\/tr><\/thead><tbody><tr><td>CLOSED<\/td><td>初始状态，无连接<\/td><td>—<\/td><\/tr><tr><td>LISTEN<\/td><td>服务器监听<\/td><td>bind+listen 后<\/td><\/tr><tr><td>SYN_SENT<\/td><td>已发 SYN，等待 SYN+ACK<\/td><td>主动连接方<\/td><\/tr><tr><td>SYN_RCVD<\/td><td>收到 SYN，已回 SYN+ACK<\/td><td>服务器半连接态<\/td><\/tr><tr><td>ESTABLISHED<\/td><td>连接建立，可传数据<\/td><td>握手完成<\/td><\/tr><tr><td>FIN_WAIT_1<\/td><td>已发 FIN，等待 ACK<\/td><td>主动关闭方第一步<\/td><\/tr><tr><td>FIN_WAIT_2<\/td><td>已收 ACK，等待对方 FIN<\/td><td>主动关闭方第二步<\/td><\/tr><tr><td>CLOSE_WAIT<\/td><td>已收 FIN，回 ACK，等应用 close<\/td><td>被动关闭方<\/td><\/tr><tr><td>LAST_ACK<\/td><td>应用 close 后已发 FIN，等最终 ACK<\/td><td>被动关闭方收尾<\/td><\/tr><tr><td>TIME_WAIT<\/td><td>发完最后 ACK，等 2MSL<\/td><td>主动关闭方收尾<\/td><\/tr><tr><td>CLOSING<\/td><td>双方同时发 FIN（罕见）<\/td><td>同时关闭<\/td><\/tr><\/tbody><\/table>\n<blockquote>加分点：把状态机串成一条线——<strong>服务端视角<\/strong>：LISTEN → (收到SYN) SYN_RCVD → (收到ACK) ESTABLISHED → (收到FIN) CLOSE_WAIT → (应用close) LAST_ACK → CLOSED；<strong>客户端视角<\/strong>：SYN_SENT → ESTABLISHED → FIN_WAIT_1 → FIN_WAIT_2 → TIME_WAIT → CLOSED。面试画这条线比背表强得多。<\/blockquote>"}, {"q": "4.2 半连接队列与全连接队列", "tag": "高频", "body": "<p>TCP 服务器有两个队列配合握手：<\/p>\n<ul><li><strong>半连接队列（SYN 队列 / syn queue）<\/strong>：收到 SYN、还没完成三次握手的连接（SYN_RCVD 状态）。大小受 <code>net.ipv4.tcp_max_syn_backlog<\/code>（默认 1024/4096）限制。<\/li><li><strong>全连接队列（accept 队列）<\/strong>：三次握手完成、等待应用 accept() 的连接（ESTABLISHED 但未被 accept）。大小 = <code>min(listen(fd, backlog), net.core.somaxconn)<\/code>（somaxconn 默认 4096）。<\/li><\/ul>\n<p>建立流程：SYN 到达 → 入半连接队列 → 回 SYN+ACK → 收到 ACK → <strong>从半连接队列移入全连接队列<\/strong> → 应用 accept() 取走。<\/p>\n<blockquote>加分点：<strong><code>listen(backlog)<\/code> 的 backlog 只控制全连接队列，控制不了半连接队列<\/strong>（那是 tcp_max_syn_backlog 的事）。很多面试者误以为调大 backlog 能防 SYN Flood，实际防的是\"accept 不及时\"的场景。<\/blockquote>"}, {"q": "4.3 连接队列溢出：tcp_abort_on_overflow 与 backlog", "tag": "进阶", "body": "<ul><li><strong>全连接队列满<\/strong>时新完成的连接怎么处理？由 <code>net.ipv4.tcp_abort_on_overflow<\/code> 决定：<\/li><li><code>0<\/code>（默认）：<strong>静默丢弃<\/strong> ACK 报文，客户端以为握手成功（它已发 ACK），实际服务端没建连接。客户端发数据时服务器回 RST，客户端报错。<\/li><li><code>1<\/code>：直接发 <strong>RST<\/strong> 拒绝，客户端立刻感知\"连接被拒绝\"。<\/li><li>日志标志：<code>dmesg<\/code> 中出现 <code>\"TCP: request_sock_TCP: Possible SYN flooding on port xxx\"<\/code> 说明半连接队列溢出；<code>ss -lnt<\/code> 中 <code>Send-Q<\/code> 大于 <code>Recv-Q<\/code> 且不断增长说明 accept 队列溢出。<\/li><\/ul>\n<blockquote>加分点：<code>ss -lnt<\/code> 读法——<code>Recv-Q<\/code> 是当前 accept 队列长度，<code>Send-Q<\/code> 是队列上限；<code>Recv-Q<\/code> 接近 <code>Send-Q<\/code> 且持续不降，说明<strong>应用 accept 速度跟不上<\/strong>，优先排查应用线程/epoll 处理，而不是调内核参数。<\/blockquote>"}, {"q": "4.4 三次握手与两个队列的交互（Linux 实现细节）", "tag": "进阶", "body": "<ol><li>客户端 SYN 到达 → 服务器在 <strong>inet_csk_reqsk_queue<\/strong>（半连接队列）创建一个 request_sock，回 SYN+ACK。<\/li><li>若收到重传的 SYN（半连接已存在）→ 重新回 SYN+ACK。<\/li><li>收到 ACK → 校验通过后从半连接队列<strong>移除<\/strong>，创建 sock，<strong>插入全连接队列<\/strong>。<\/li><li>应用 accept() 从全连接队列取出 sock → 完成。<\/li><li><strong>SYN Cookie 模式<\/strong>下：不创建 request_sock（半连接队列零占用），把\"握手信息\"编码进 ISN，收到 ACK 时现场校验、直接建立全连接——这也是为什么溢出时 Linux 自动启用 Cookie。<\/li><\/ol>\n<blockquote>加分点：半连接队列的满溢判断是\"<strong>入队前检查<\/strong>\"，而 SYN Cookie 是\"<strong>溢出后才触发<\/strong>\"的兜底（<code>tcp_syncookies=1<\/code> 时队列满则改用 Cookie）。所以<strong>防 SYN Flood 的第一道防线永远是队列容量，第二道才是 Cookie<\/strong>。<\/blockquote>"}, {"q": "4.5 如何排查连接队列溢出？", "tag": "进阶", "body": "<ol><li><code>ss -lnt<\/code>：对比 <code>Recv-Q<\/code> 与 <code>Send-Q<\/code>。<\/li><li><code>netstat -s<\/code>：看 <code>SYNs to LISTEN sockets dropped<\/code>、<code>times the listen queue of a socket overflowed<\/code> 等计数器。<\/li><li><code>dmesg<\/code>：SYN flooding 告警。<\/li><li>性能计数器：<code>nstat -az | grep -i listen<\/code>。<\/li><\/ol>\n<p>定位到溢出后对症处理：<\/p>\n<ul><li>半连接队列溢出 → 大概率 SYN Flood 或被 DDoS，检查源 IP 分布、开 syncookies、限速。<\/li><li>全连接队列溢出 → 应用 accept 慢，查线程池、阻塞 I/O、epoll 配置，再考虑调大 backlog/somaxconn。<\/li><\/ul>\n<blockquote>加分点：排查顺序应该是\"<strong>先看是哪个队列满<\/strong>\"，因为两个队列的根因完全不同——半连接满通常是网络层攻击，全连接满通常是应用层瓶颈。答出这一层，面试官会认为你有真实排障经验。<\/blockquote>\n<hr>"}]}, {"title": "05 TCP 可靠性机制", "questions": [{"q": "5.1 TCP 如何保证可靠传输？", "tag": "高频", "body": "<p>六大机制协同：<\/p>\n<ol><li><strong>序号与确认<\/strong>：每个字节一个序号，ACK 告知对方\"期望的下一个字节号\"，实现有序重组与去重。<\/li><li><strong>确认与重传<\/strong>：超时未确认（RTO）或收到重复 ACK → 重传。<\/li><li><strong>滑动窗口/流量控制<\/strong>：按接收方 rwnd 调整发送量，防止接收方缓冲区溢出。<\/li><li><strong>拥塞控制<\/strong>：按网络状态调整 cwnd，防止压垮网络。<\/li><li><strong>校验和<\/strong>：首部+数据校验，损坏即丢弃（触发重传）。<\/li><li><strong>连接管理<\/strong>：握手/挥手保证会话正确建立与释放。<\/li><\/ol>\n<blockquote>加分点：一句话总结——<strong>TCP 用\"序号 + 确认 + 重传\"对抗丢包，用\"窗口\"对抗双方速度差（流控）与网络容量差（拥塞控制），用\"校验和\"对抗损坏<\/strong>。IP 层只保证\"尽力而为\"，所有可靠性都在传输层补上。<\/blockquote>"}, {"q": "5.2 超时重传与快速重传", "tag": "高频", "body": "<ul><li><strong>超时重传<\/strong>：发送方启动 RTO（Retransmission Timeout）定时器，超时未收到 ACK 就重传。RTO 动态估算：<code>RTO = SRTT + 4×RTTVAR<\/code>（RFC 6298），超时后 RTO <strong>指数退避<\/strong>（×2）。连续超时 15 次（<code>tcp_retries2<\/code>）后放弃连接。<\/li><li><strong>快速重传<\/strong>：不等超时——发送方<strong>收到 3 个重复 ACK<\/strong>（即第 4 次收到相同 ack 号）就立即重传，避免傻等 RTO。原理：重复 ACK 说明\"你发的下一个包丢了，且后续包陆续到了\"。<\/li><\/ul>\n<blockquote>加分点：快速重传触发条件是\"<strong>3 个重复 ACK<\/strong>\"不是 1 个——因为 1~2 个重复 ACK 可能只是乱序（后到的包先到），只有连续 3 个才能判定大概率真丢包。这是面试高频细节。<\/blockquote>"}, {"q": "5.3 SACK 与 D-SACK", "tag": "进阶", "body": "<ul><li><strong>SACK（Selective Acknowledgment）<\/strong>：传统 ACK 只能确认\"连续收到的最大序号\"，如果中间丢了包（如收到 1-1000、3000-4000），发送方不知道 1000-3000 之外哪些已到，只能重传全部。SACK 选项允许接收方<strong>精确报告已收到的非连续区间<\/strong>，发送方只重传真正丢失的段，显著提升效率。<\/li><li><strong>D-SACK（Duplicate-SACK）<\/strong>：SACK 的增强，用于<strong>报告重复收到的段<\/strong>——让发送方判断\"是重传导致重复，还是报文绕路迟到\"，据此调整重传策略与 RTO 估算。<\/li><\/ul>\n<blockquote>加分点：SACK 需要双方在握手时协商（选项），Linux 默认开启（<code>tcp_sack=1<\/code>）。高带宽高延迟链路（BDP 大）上 SACK 收益最明显；而 SYN Cookie 场景下 SACK 选项可能丢失，Linux 用\"时间戳回填\"补偿。<\/blockquote>"}, {"q": "5.4 滑动窗口与流量控制（rwnd）", "tag": "高频", "body": "<ul><li><strong>滑动窗口<\/strong>：发送方维护 [已确认 | 已发送未确认 | 可发送 | 不可发送] 的窗口，窗口内可连续发送，无需逐包等待 ACK（累积确认），提升吞吐。<\/li><li><strong>流量控制<\/strong>：由<strong>接收方<\/strong>主导——接收方在 ACK 中携带 <code>rwnd<\/code>（接收窗口），告知\"我还能收多少\"。发送方窗口 = <code>min(swnd, rwnd, cwnd)<\/code>。若 rwnd=0，发送方停止发送并启动<strong>窗口探测（persist timer）<\/strong>。<\/li><li><strong>零窗口死锁<\/strong>：rwnd=0 后，若接收方恢复的\"窗口更新报文\"丢失，双方互等 → 用窗口探测（发送 1 字节探测包）打破。<\/li><\/ul>\n<blockquote>加分点：流量控制（rwnd，防止\"我收不过来\"）与拥塞控制（cwnd，防止\"网络受不了\"）是<strong>两个独立窗口<\/strong>，发送量取两者较小值——这是高频区分点：<strong>流控是端到端的接收方反馈，拥塞控制是发送方对网络状态的推测<\/strong>。<\/blockquote>"}, {"q": "5.5 拥塞控制：慢启动 / 拥塞避免 / 快速恢复", "tag": "高频", "body": "<ul><li><strong>慢启动（Slow Start）<\/strong>：连接建立时 cwnd 从 1（实际 10）个 MSS 开始，每收到一个 ACK 就翻倍（<strong>指数增长<\/strong>），直到 ssthresh（慢启动阈值）。<\/li><li><strong>拥塞避免（Congestion Avoidance）<\/strong>：超过 ssthresh 后 cwnd <strong>线性增长<\/strong>（每 RTT +1），探测可用带宽。<\/li><li><strong>快速恢复（Fast Recovery）<\/strong>：触发快速重传（3 个重复 ACK）时，cwnd 减半而非清零，配合快速重传快速恢复吞吐（区别于超时重传的直接降到 1 重新慢启动）。<\/li><li><strong>超时重传<\/strong>：视为严重拥塞，cwnd 重置为 1，ssthresh 减半，重新慢启动。<\/li><\/ul>\n<blockquote>加分点：<strong>AIMD（加性增、乘性减）<\/strong> 是拥塞控制的灵魂——加法增窗口（温和探测），乘法减窗口（丢包即砍半/清零）。Linux 默认算法是 <strong>CUBIC<\/strong>（适合高带宽长链路），新内核还支持 BBR（基于带宽时延积，不靠丢包判断拥塞）。<\/blockquote>"}, {"q": "5.6 CUBIC 与 BBR", "tag": "进阶", "body": "<ul><li><strong>CUBIC<\/strong>（Linux 默认，2008 起）：用<strong>三次函数<\/strong>控制窗口增长，与 RTT 无关——在长肥管道上窗口恢复快，适合数据中心/骨干链路，但对\"浅缓冲队列\"场景不够灵敏。<\/li><li><strong>BBR<\/strong>（Google，2016）：<strong>不把丢包当作拥塞信号<\/strong>，而是持续探测\"带宽 × 时延\"（BDP）——先用最大带宽增长，再找到最小时延，把 cwnd 稳定在 BDP 附近。在丢包率高但带宽富余的链路上吞吐远超 CUBIC（YouTube 从 CUBIC 切 BBR 后吞吐提升 2~25 倍）。<\/li><\/ul>\n<table><thead><tr><th>维度<\/th><th>CUBIC<\/th><th>BBR<\/th><\/tr><\/thead><tbody><tr><td>拥塞信号<\/td><td>丢包<\/td><td>带宽×时延（BDP）<\/td><\/tr><tr><td>窗口策略<\/td><td>三次函数 AIMD<\/td><td>按 BDP 定窗口<\/td><\/tr><tr><td>适用场景<\/td><td>通用、大带宽<\/td><td>高丢包、长时延链路<\/td><\/tr><tr><td>代价<\/td><td>丢包误判拥塞<\/td><td>会挤占排队缓存，公平性有争议<\/td><\/tr><\/tbody><\/table>\n<blockquote>加分点：BBR 的争议在于<strong>会\"吃掉\"瓶颈路由器的排队缓存<\/strong>（因为它不主动退让），多流竞争时对其他 TCP 流不友好；内核 5.9+ 提供 <code>bbr2<\/code> 改进了公平性。面试说出\"BBR 靠测量不靠丢包、bbr2 修复公平性\"就已超出平均水准。<\/blockquote>"}, {"q": "5.7 粘包与拆包：TCP 是字节流协议", "tag": "高频", "body": "<ul><li><strong>为什么有粘包<\/strong>：TCP 是<strong>面向字节流的传输<\/strong>，只保证字节顺序，不保留应用消息边界。发送方多次 send 的数据可能被合并（Nagle 算法、缓冲区合并）一次交付；一次 send 的大数据也可能被拆成多次交付。<\/li><li><strong>现象<\/strong>：接收方把多条消息粘在一起（粘包），或一条消息被拆开（拆包/半包）。<\/li><li><strong>解决方案<\/strong>（4 选 1 或组合）：<\/li><\/ul>\n<ol><li><strong>定长消息<\/strong>：每条消息固定长度，按长度切分（简单但浪费）。<\/li><li><strong>分隔符<\/strong>：消息以 <code>\\n<\/code> 等特殊字符结尾（如 Redis RESP、行协议；需处理转义）。<\/li><li><strong>长度前缀（最常用）<\/strong>：消息头 4 字节长度 + 载荷，按长度字段切分（如 HTTP/2 帧、Netty LengthFieldBasedFrameDecoder）。<\/li><li><strong>自定义协议<\/strong>：头部含魔数+版本+长度等（如 Dubbo、MQ 协议）。<\/li><\/ol>\n<blockquote>加分点：粘包/拆包<strong>不是 TCP 的 Bug<\/strong>，而是\"流协议没有消息边界\"的必然结果；UDP 是数据报协议，天然保留边界，所以<strong>不会粘包<\/strong>。Nagle 算法（小包合并）是粘包的重要诱因，实时性要求高的场景可 <code>TCP_NODELAY<\/code> 关闭。<\/blockquote>\n<hr>"}]}, {"title": "06 长连接保活与连接数量", "questions": [{"q": "6.1 TCP KeepAlive 机制与三个内核参数", "tag": "高频", "body": "<p>TCP KeepAlive 是内核层面的保活探测：<\/p>\n<ul><li>连接空闲 <code>tcp_keepalive_time<\/code>（默认 <strong>7200s<\/strong>，2 小时）后开始探测。<\/li><li>每隔 <code>tcp_keepalive_intvl<\/code>（默认 <strong>75s<\/strong>）发送一个探测包。<\/li><li>连续 <code>tcp_keepalive_probes<\/code>（默认 <strong>9<\/strong> 次）无响应 → 判定连接死亡并关闭。<\/li><\/ul>\n<p>即：默认情况下，一条空闲连接最长要 <code>7200 + 75×9 ≈ 2.2 小时<\/code> 才能被内核发现\"对方死了\"。应用可在 socket 上设置 <code>SO_KEEPALIVE<\/code> 并用 <code>TCP_KEEPIDLE/KEEPINTVL/KEEPCNT<\/code> 覆盖默认值。<\/p>\n<blockquote>加分点：<strong>默认 2 小时才探测<\/strong>意味着 TCP KeepAlive 主要防\"长期空闲的连接被僵尸化\"，对实时性场景（如 IM 检测用户掉线）完全不够——必须用<strong>应用层心跳<\/strong>。另外 KeepAlive 只保活<strong>已建立的连接<\/strong>，不能防断线重连。<\/blockquote>"}, {"q": "6.2 应用层心跳 vs TCP KeepAlive", "tag": "高频", "body": "<table><thead><tr><th>维度<\/th><th>TCP KeepAlive<\/th><th>应用层心跳<\/th><\/tr><\/thead><tbody><tr><td>实现层<\/td><td>内核协议栈<\/td><td>应用代码<\/td><\/tr><tr><td>默认探测间隔<\/td><td>2 小时（太慢）<\/td><td>可按需，如 30s<\/td><\/tr><tr><td>探测粒度<\/td><td>只知道\"连接死没死\"<\/td><td>可携带业务数据/确认业务存活<\/td><\/tr><tr><td>可靠性<\/td><td>依赖系统参数<\/td><td>完全可控<\/td><\/tr><tr><td>典型场景<\/td><td>防僵尸连接、NAT 映射回收<\/td><td>IM 在线状态、长连接健康检测<\/td><\/tr><\/tbody><\/table>\n<p><strong>实践结论<\/strong>：IM/长连接系统通常两者都用——TCP KeepAlive 兜底清理僵尸连接，应用层心跳做真正的活跃度检测（心跳超时 → 标记掉线 → 触发重连与状态广播）。<\/p>\n<blockquote>加分点：心跳报文要轻（一个 ping 帧即可），<strong>心跳超时判定要防抖动<\/strong>（连续 N 次未收到才判死）；另外 NAT 网关会回收长时间无流量的映射，所以心跳间隔一般要小于 NAT 映射超时（常见运营商 NAT 超时约 30~120s），<strong>30s 心跳是工程经验值<\/strong>。<\/blockquote>"}, {"q": "6.3 长连接与短连接的对比与选择", "tag": "高频", "body": "<table><thead><tr><th>维度<\/th><th>短连接<\/th><th>长连接<\/th><\/tr><\/thead><tbody><tr><td>建连成本<\/td><td>每次请求都 3 次握手+4 次挥手<\/td><td>首次建连后复用<\/td><\/tr><tr><td>时延<\/td><td>每请求多 1~2 RTT<\/td><td>无额外握手 RTT<\/td><\/tr><tr><td>资源占用<\/td><td>频繁 TIME_WAIT、SYN/ACK 开销<\/td><td>常驻 fd、内存、保活开销<\/td><\/tr><tr><td>适用场景<\/td><td>低频、服务端集群大、无状态<\/td><td>高频交互、实时推送、内部 RPC<\/td><\/tr><\/tbody><\/table>\n<p>选择原则：<\/p>\n<ul><li><strong>B/S 高频 Web<\/strong> → HTTP Keep-Alive / HTTP/2 长连接复用。<\/li><li><strong>服务间 RPC、DB/Redis/MQ 客户端<\/strong> → 连接池长连接。<\/li><li><strong>低频一次性请求<\/strong>（如发送一次邮件通知）→ 短连接更省资源。<\/li><li>长连接要考虑：连接数上限、心跳、断线重连、负载均衡（粘性会话）。<\/li><\/ul>\n<blockquote>加分点：真正的工程结论是\"<strong>短连接的性能瓶颈在握手 RTT，长连接的性能瓶颈在连接管理与保活<\/strong>\"。HTTP 时代用 Keep-Alive、HTTP/2 把多路复用做到单连接内，本质上都是在\"驯服建连成本\"。<\/blockquote>"}, {"q": "6.4 一台服务器最多能建立多少 TCP 连接？", "tag": "高频", "body": "<p>理论极大，实际受多重约束：<\/p>\n<ul><li><strong>四元组上限<\/strong>：源 IP×源端口×目的 IP×目的端口 = 2^32 × 2^16 × 2^32 × 2^16 ≈ 2^96，理论上无穷。<\/li><li><strong>实际瓶颈<\/strong>：<\/li><\/ul>\n<ol><li><strong>文件描述符 fd<\/strong>（最直接）：<code>ulimit -n<\/code>，每连接至少 1 个 fd。百万连接需要 ≥ 100w+ fd。<\/li><li><strong>内存<\/strong>：每个 TCP 连接内核态约 3~4KB（sock + 缓冲区），百万连接约 3~4GB 内核内存，加上用户态缓冲区、线程栈，轻松吃掉几十 GB。<\/li><li><strong>端口<\/strong>：作为<strong>服务端<\/strong>监听同一端口可接受海量连接（四元组靠客户端端口区分）；作为<strong>客户端<\/strong>单 IP 最多约 6.5 万端口（2^16，含保留端口），需要多 IP/端口复用突破。<\/li><li><strong>中断/CPU<\/strong>：每连接收发包都触发软中断，CPU 是隐藏瓶颈。<\/li><\/ol>\n<blockquote>加分点：经典数字——<strong>单机 C10K 早已过时，现代 Linux + epoll 单机可支撑百万连接（C10M 靠内核旁路如 DPDK/XDP 或用户态协议栈）<\/strong>。面试常用话术：\"百万连接的瓶颈不是内核能不能 hold，而是 fd、内存、CPU 中断的工程化调配。\"<\/blockquote>"}, {"q": "6.5 TCP 连接为什么用四元组标识？", "tag": "基础", "body": "<p>四元组 = <strong>源 IP + 源端口 + 目的 IP + 目的端口<\/strong>，唯一确定一条连接：<\/p>\n<ul><li>IP 定位主机，端口定位主机上的进程/服务，四元组精确定位\"哪台机器的哪个进程 ↔ 哪台机器的哪个进程\"。<\/li><li>同一条连接的两端各有一个（IP, 端口），双向复用同一四元组。<\/li><li>服务器 listen 一个端口（如 80），可以同时服务百万条连接——因为每条连接的<strong>客户端四元组不同<\/strong>，内核靠四元组哈希找到对应 sock。<\/li><\/ul>\n<blockquote>加分点：补充两个变体——<strong>五元组<\/strong> = 四元组 + 协议（区分 TCP/UDP）；<strong>七元组<\/strong> = 五元组 + 进出接口 + 会话 ID（防火墙/负载均衡常用）。答出这个递进关系，显示对网络栈的完整理解。<\/blockquote>"}, {"q": "6.6 C10K / C10M 问题与 epoll", "tag": "高频", "body": "<ul><li><strong>C10K<\/strong>：单机并发 1 万连接。老方案（进程/线程 per 连接）在 1 万连接时线程切换、内存爆炸。核心解法是 <strong>I/O 多路复用<\/strong>：<\/li><li><strong>select/poll<\/strong>：内核每次把全部 fd 拷给用户态，O(n) 遍历，fd 上限 1024/无上限但低效。<\/li><li><strong>epoll<\/strong>（Linux）：<strong>事件驱动 + 就绪回调<\/strong>，只返回\"就绪的 fd\"，O(1) 处理，无数量上限。配套 <strong>ET（边缘触发）<\/strong> 与 <strong>LT（水平触发）<\/strong> 模式。<\/li><li>macOS/BSD 用 <strong>kqueue<\/strong>，Windows 用 <strong>IOCP<\/strong>（真正的异步 I/O）。<\/li><li><strong>C10M<\/strong>：单机千万连接。纯 epoll 也难，需要 <strong>DPDK/XDP（内核旁路，用户态收包）<\/strong>、多队列网卡（RSS）、无锁编程。<\/li><\/ul>\n<blockquote>加分点：epoll ET vs LT——<strong>LT<\/strong>（默认）只要缓冲区有数据就持续通知，编程简单；<strong>ET<\/strong> 只在状态变化时通知一次，必须一次性读完（配合非阻塞 I/O 循环读），否则丢数据。Netty 默认 LT（对 Java 友好），Redis/Node 的 libuv 默认 <strong>ET<\/strong>——答出 Redis 用 ET 是加分项。<\/blockquote>\n<hr>"}]}, {"title": "07 UDP 连接与可靠 UDP", "questions": [{"q": "7.1 UDP 为什么\"无连接\"？UDP 头部 8 字节", "tag": "基础", "body": "<ul><li>UDP 头部只有 <strong>4 个字段 × 16 bit = 8 字节<\/strong>：源端口、目的端口、长度、校验和。<strong>没有序号、没有确认、没有窗口、没有状态<\/strong>——所以不需要连接。<\/li><li>\"无连接\"的三层含义：<\/li><\/ul>\n<ol><li><strong>无需握手<\/strong>：发数据前不建立会话。<\/li><li><strong>无状态<\/strong>：两端不保存对方信息，内核里没有连接表。<\/li><li><strong>无保证<\/strong>：不保证送达、不保证有序、不保证不重复。<\/li><\/ol>\n<blockquote>加分点：正因为 UDP 头只有 8 字节，<strong>QUIC 才能在用户态把\"连接状态\"搬到应用层实现<\/strong>——UDP 是\"裸奔\"的传输层，什么都能在它上面自己造，这是 QUIC/KCP 能落地的前提。<\/blockquote>"}, {"q": "7.2 UDP 报文最大多大？MTU 分片", "tag": "进阶", "body": "<ul><li><strong>理论最大<\/strong>：UDP 长度字段 16 bit，最大 65535 字节，减 IP 头 20 + UDP 头 8，<strong>载荷最大 65507 字节<\/strong>。<\/li><li><strong>实际限制<\/strong>：IP 层 MTU（以太网 1500 字节），超过 MTU 会触发 <strong>IP 分片<\/strong>——分片包只要丢一片，整个报文作废（IP 层不重传），所以<strong>大 UDP 报文可靠性极差<\/strong>。<\/li><li><strong>最佳实践<\/strong>：UDP 载荷控制在 <strong>MTU 内<\/strong>（以太网建议 ≤ 1472 字节，减去 IP+UDP 头），或做应用层分片 + 序号重组（QUIC 就是这么干的，还带重传）。<\/li><\/ul>\n<blockquote>加分点：<strong>PMTUD（路径 MTU 发现）<\/strong> 通过探测避免分片；但某些网络会静默丢弃 DF 置位的大包，导致\"小包通、大包不通\"的诡异故障——面试能举这个排障案例很加分。IPv6 路由器不再分片（只有源端可分片），更依赖 PMTUD。<\/blockquote>"}, {"q": "7.3 如何基于 UDP 实现可靠传输？", "tag": "高频", "body": "<p>在 UDP 之上补 TCP 的能力（自研 RUDP）：<\/p>\n<ol><li><strong>序号<\/strong>：给报文编号，接收方检测丢包/乱序/重复。<\/li><li><strong>确认 ACK + 重传<\/strong>：NACK（否定确认，丢了哪些）比纯 ACK 更高效；超时重传 + 快速重传。<\/li><li><strong>缓冲与排序<\/strong>：接收方重排乱序报文。<\/li><li><strong>流量控制<\/strong>：滑动窗口（发送窗口、接收窗口）。<\/li><li><strong>拥塞控制<\/strong>：可选（游戏场景常简化或不做）。<\/li><li><strong>连接标识<\/strong>：用连接 ID 代替四元组（可支持连接迁移）。<\/li><\/ol>\n<blockquote>加分点：RUDP 的意义在于<strong>按需裁剪<\/strong>——\"既要 UDP 的低时延，又要 TCP 的可靠\"，但把拥塞控制做对很难（很多自研 RUDP 在网络拥塞时会打爆路由器），所以业界更倾向直接用成熟的 <strong>QUIC 或 KCP<\/strong>，而不是从零造轮子。<\/blockquote>"}, {"q": "7.4 QUIC：基于 UDP 的可靠连接", "tag": "进阶", "body": "<p>QUIC（Quick UDP Internet Connections，Google，HTTP/3 的传输层）核心特性：<\/p>\n<ol><li><strong>0-RTT / 1-RTT 建连<\/strong>：首次 1-RTT，复用会话 0-RTT（缓存密钥），比 TCP+TLS（2~3 RTT）快得多。<\/li><li><strong>连接 ID 与连接迁移<\/strong>：连接不再绑定 IP:端口四元组，<strong>换 Wi-Fi/换网络 IP 变化连接不断<\/strong>（手机切网不重连）。<\/li><li><strong>无队头阻塞<\/strong>：多路复用多个 stream，<strong>一个 stream 丢包只重传该 stream<\/strong>，不影响其他 stream（HTTP/2 在 TCP 上做不到）。<\/li><li><strong>TLS 1.3 内嵌<\/strong>：加密握手与传输握手合一，无明文阶段。<\/li><li><strong>用户态实现<\/strong>：迭代快（TCP 改进要改内核），且<strong>无需 NAT 打洞<\/strong>（UDP 天然可穿越 NAT）。<\/li><\/ol>\n<blockquote>加分点：面试高频对比——<strong>HTTP/2 的队头阻塞在 TCP 层<\/strong>（丢一个包，整个 TCP 连接上的所有 stream 都要等重传）；<strong>QUIC 把\"可靠传输\"按 stream 隔离<\/strong>，把队头阻塞限制在单 stream 内。这是 HTTP/3 选择 QUIC 的根本原因。<\/blockquote>"}, {"q": "7.5 KCP 与其他 RUDP 方案对比", "tag": "进阶", "body": "<table><thead><tr><th>方案<\/th><th>定位<\/th><th>特点<\/th><\/tr><\/thead><tbody><tr><td>QUIC<\/td><td>通用可靠传输（HTTP/3 基座）<\/td><td>标准、全特性、拥塞控制完备<\/td><\/tr><tr><td>KCP<\/td><td>游戏加速可靠 UDP<\/td><td><strong>牺牲带宽换低延迟<\/strong>：快速重传、非退避重传、可配置拥塞，适合弱网实时对战<\/td><\/tr><tr><td>WebRTC SCTP<\/td><td>浏览器实时通信数据通道<\/td><td>基于 SCTP over DTLS over UDP，内置有序/无序两种模式<\/td><\/tr><tr><td>自研 RUDP<\/td><td>私有业务<\/td><td>灵活但易踩坑<\/td><\/tr><\/tbody><\/table>\n<blockquote>加分点：KCP 的核心思想是\"<strong>用更多重传换取更快到达<\/strong>\"——它的快速重传阈值可配置（默认 2 个重复 ACK 就重传），重传间隔不按 RTO 退避，还支持\"跳过确认\"（收到乱序包就提前重传疑似丢失的包）。弱网游戏用它，因为它不在乎多吃带宽。<\/blockquote>"}, {"q": "7.6 TCP 与 UDP 如何选择？", "tag": "高频", "body": "<p>决策模型（按业务诉求）：<\/p>\n<ol><li><strong>需要可靠 + 有序 + 通用<\/strong> → TCP（HTTP、数据库、文件、RPC）。<\/li><li><strong>容忍少量丢失但要求低时延<\/strong> → UDP（音视频、游戏操作指令、实时监控——丢一帧无所谓，等重传反而卡顿）。<\/li><li><strong>要求可靠但又要低时延/连接迁移<\/strong> → QUIC（HTTP/3、弱网移动端）。<\/li><li><strong>广播/组播/任播<\/strong> → 只能 UDP。<\/li><li><strong>DNS<\/strong> → UDP 为主（单包小、快），超时重试才切 TCP。<\/li><\/ol>\n<blockquote>加分点：一句话——<strong>\"TCP 用时间换可靠，UDP 用不可靠换时间，QUIC 想两个都要\"<\/strong>。面试被问\"视频会议为什么不用 TCP\"，标准答案是：TCP 丢包后的重传与队头阻塞会造成画面卡顿与声音滞后，实时媒体宁可丢旧帧也要及时渲染新帧，所以 RTP/QUIC 这类\"部分可靠\"才是正解。<\/blockquote>\n<hr>"}]}, {"title": "08 HTTP 连接模型演进", "questions": [{"q": "8.1 HTTP/1.0 vs HTTP/1.1：短连接到长连接", "tag": "高频", "body": "<ul><li><strong>HTTP/1.0<\/strong>：<strong>默认短连接<\/strong>，每个请求/响应后 TCP 连接即关闭，下一个请求重新三次握手。请求频繁时建连开销巨大（多 RTT + 系统资源）。<\/li><li><strong>HTTP/1.1<\/strong>：<strong>默认持久连接（Keep-Alive）<\/strong>，同一 TCP 连接上串行传输多个请求/响应，直到客户端或服务器主动关闭。响应头带 <code>Connection: keep-alive<\/code>（默认，可显式）；<code>Connection: close<\/code> 表示用完即关。<\/li><\/ul>\n<blockquote>加分点：Keep-Alive 让<strong>一个 TCP 连接处理多个请求<\/strong>，省去重复握手；但 HTTP/1.1 仍然<strong>串行<\/strong>——同一连接上的请求必须排队（队头阻塞在 HTTP 层），浏览器为突破限制只能开 6 个并发连接（同域名）。这两个痛点（串行 + 连接数限制）正是 HTTP/2 要解决的。<\/blockquote>"}, {"q": "8.2 Keep-Alive 与 Connection 头", "tag": "高频", "body": "<ul><li><code>Connection: keep-alive<\/code>：要求复用连接（HTTP/1.1 默认，可不写）。<\/li><li><code>Connection: close<\/code>：请求/响应完成后关闭连接。<\/li><li><strong>HTTP/2 禁止 Connection 头<\/strong>（连接管理交给协议层，多路复用天然复用）。<\/li><li>服务器侧超时参数：<code>keepalive_timeout<\/code>（Nginx 默认 75s）、<code>keepalive_requests<\/code>（Nginx 默认 1000，单连接最大请求数，防长连接被单个慢客户端长期占住）。<\/li><\/ul>\n<blockquote>加分点：<strong>长连接也不是无限长<\/strong>——服务器要限制单连接的请求数和空闲超时，否则慢客户端会占着连接不释放（连接耗尽攻击的一个变种）。Nginx 的 keepalive_requests=1000 就是为平衡\"复用收益\"与\"占用成本\"。<\/blockquote>"}, {"q": "8.3 HTTP 管线化（Pipelining）为什么失败？", "tag": "进阶", "body": "<p>HTTP/1.1 曾引入<strong>管线化<\/strong>：一个连接上连续发送多个请求，不必等前一个响应——理论上提高并发。但它失败了：<\/p>\n<ol><li><strong>队头阻塞仍在<\/strong>：服务器<strong>必须按序响应<\/strong>（协议要求），第一个响应慢，后面全堵住。<\/li><li><strong>兼容性问题<\/strong>：代理、服务器实现不统一，很多不遵守规则。<\/li><li><strong>无多路复用语义<\/strong>：响应无法标识对应哪个请求（没有流 ID）。<\/li><\/ol>\n<ul><li>结果：主流浏览器与服务器<strong>普遍禁用/从未支持<\/strong>管线化，等于废弃，直到 HTTP/2 用真正的多路复用解决。<\/li><\/ul>\n<blockquote>加分点：管线化的教训是\"<strong>半吊子的并发比不做更糟<\/strong>\"——按序响应约束让管线化在慢响应场景反而更慢（HoL blocking at HTTP layer），HTTP/2 的核心突破就是<strong>给每个请求独立流 ID，允许乱序响应<\/strong>。<\/blockquote>"}, {"q": "8.4 HTTP/2 多路复用：一个连接多个流", "tag": "高频", "body": "<p>HTTP/2 的关键机制：<\/p>\n<ol><li><strong>二进制分帧<\/strong>：把请求/响应拆成帧（HEADERS / DATA / RST_STREAM / SETTINGS 等），帧携带 <strong>流 ID（Stream ID）<\/strong>。<\/li><li><strong>多路复用<\/strong>：<strong>一个 TCP 连接上并发多个流<\/strong>（Stream），帧交错发送，<strong>响应可以乱序到达<\/strong>（按流 ID 重组），彻底消除 HTTP 层的队头阻塞。<\/li><li><strong>头部压缩 HPACK<\/strong>：静态表+动态表+哈夫曼编码，头部体积平均下降 80%+。<\/li><li><strong>服务端推送（Server Push）<\/strong>：服务器可主动推送资源（已逐渐被弃用，因缓存问题）。<\/li><li>浏览器不再需要 6 连接并发——<strong>单连接承载所有请求<\/strong>。<\/li><\/ol>\n<blockquote>加分点：HTTP/2 解决了 <strong>HTTP 层<\/strong>的队头阻塞，但<strong>TCP 层的队头阻塞还在<\/strong>——TCP 丢一个包，重传期间该连接上所有流的数据都得等（接收缓冲按序交付）。这个\"残留问题\"只有 HTTP/3 能治，这是面试必须能接上的下一句。<\/blockquote>"}, {"q": "8.5 HTTP/2 的队头阻塞问题", "tag": "进阶", "body": "<ul><li><strong>TCP 层队头阻塞<\/strong>：HTTP/2 所有流共享一个 TCP 连接。若一个流的一个包丢失，TCP 接收方只能按序缓冲，<strong>整个连接上的所有流都被阻塞<\/strong>，直到重传到达。<\/li><li><strong>触发场景<\/strong>：弱网、高丢包链路（丢包率 > 1% 时 HTTP/2 可能比 HTTP/1.1 还慢——因为 HTTP/1.1 多个连接互相独立，一个连接丢包不影响其他连接）。<\/li><li><strong>缓解<\/strong>：部分实现做\"多 TCP 连接分摊流\"（Chrome 曾尝试 QUIC 前用多连接），但治本方案就是 HTTP/3。<\/li><\/ul>\n<blockquote>加分点：量化记忆——<strong>丢包率 0.1% 时 HTTP/2 仍优于 HTTP/1.1；丢包率超过 1~2% 时 HTTP/2 反而劣于多连接的 HTTP/1.1<\/strong>。这个\"临界点\"结论经常被面试官用来验证你是否真的理解队头阻塞。<\/blockquote>"}, {"q": "8.6 HTTP/3 QUIC：连接迁移与 0-RTT", "tag": "进阶", "body": "<p>HTTP/3 = HTTP 语义 + QUIC 传输：<\/p>\n<ol><li><strong>无 TCP 层队头阻塞<\/strong>：每个流独立可靠传输（QUIC 内部按流管理序号与重传），一个流丢包不影响其他流。<\/li><li><strong>0-RTT 建连<\/strong>：复用缓存的连接参数与 TLS 密钥，首个请求随握手一起发出（有重放风险，仅用于幂等请求）。<\/li><li><strong>连接迁移<\/strong>：连接 ID 不随 IP 变化——手机从 Wi-Fi 切 4G，QUIC 连接不断，HTTP 会话无需重连（TCP 做不到，IP 变了连接就断）。<\/li><li><strong>基于 UDP<\/strong>：UDP 头 + 自实现可靠传输，便于用户态升级迭代。<\/li><\/ol>\n<blockquote>加分点：HTTP/3 的握手是\"<strong>TLS 1.3 + 传输握手合并<\/strong>\"——TCP+TLS1.3 需要 1 RTT（TLS）+ 1 RTT（TCP）≈ 2 RTT，HTTP/3 首次 1 RTT、复用 0 RTT。移动端弱网场景收益最大（连接迁移 + 无队头阻塞），2023 年起 Chrome/Firefox/Safari 默认启用。<\/blockquote>"}, {"q": "8.7 HTTP 连接池如何复用连接？", "tag": "高频", "body": "<ul><li><strong>为什么需要连接池<\/strong>：HTTP 客户端（OkHttp、Apache HttpClient、Go 的 Transport、JDK HttpClient）内部维护连接池，把 Keep-Alive 连接缓存复用，避免每次请求建连。<\/li><li><strong>核心机制<\/strong>：<\/li><\/ul>\n<ol><li><strong>缓存<\/strong>：按 (scheme, host, port) 分组保存空闲连接。<\/li><li><strong>复用<\/strong>：新请求优先从池中取空闲连接，超时未取到才新建。<\/li><li><strong>驱逐<\/strong>：空闲超时（如 OkHttp 默认 5 分钟 keepAlive）、连接数上限（maxIdleConnections）、过期清理。<\/li><li><strong>健康检查<\/strong>：取出时校验连接是否仍可用（如 TCP 探测、HTTP/2 ping），失效则废弃重建。<\/li><\/ol>\n<ul><li><strong>参数<\/strong>：最大空闲连接数、keep-alive 时长、连接获取超时、每路由最大连接数。<\/li><\/ul>\n<blockquote>加分点：连接池与数据库连接池同理——<strong>池的本质是\"以空间换时间 + 复用昂贵的建连成本\"<\/strong>。HTTP/2 时代连接池的\"路由\"从连接粒度细化为\"连接上的流\"，连接数需求大幅下降（单连接多流），池的参数模型也随之变化。<\/blockquote>\n<hr>"}]}, {"title": "09 WebSocket 与实时双向连接", "questions": [{"q": "9.1 WebSocket 握手过程", "tag": "高频", "body": "<p>WebSocket 通过 <strong>HTTP Upgrade<\/strong> 建立：<\/p>\n<ol><li>客户端发 HTTP 请求：<\/li><\/ol>\n<pre><code class=\"lang-http\">GET /chat HTTP/1.1\nHost: example.com\nUpgrade: websocket\nConnection: Upgrade\nSec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==\nSec-WebSocket-Version: 13<\/code><\/pre>\n<ol><li>服务器计算 <code>Sec-WebSocket-Accept = Base64(SHA1(Sec-WebSocket-Key + \"258EAFA5-E914-47DA-95CA-C5AB0DC85B11\"))<\/code>，返回：<\/li><\/ol>\n<pre><code class=\"lang-http\">HTTP/1.1 101 Switching Protocols\nUpgrade: websocket\nConnection: Upgrade\nSec-WebSocket-Accept: s3pPLMBiTxaQ9kYGzzhZRbK+xOo=<\/code><\/pre>\n<ol><li>之后连接升级为 <strong>全双工双向<\/strong> 数据通道，不再走 HTTP 语义。<\/li><\/ol>\n<blockquote>加分点：<strong>Sec-WebSocket-Key 是随机 16 字节 base64，防缓存代理<\/strong>（保证请求新鲜）；握手成功后<strong>连接不复用给普通 HTTP<\/strong>（协议已切换），网关/负载均衡需要开启 WebSocket 透传（<code>upgrade<\/code> 头部放行），否则连接会被代理截断。<\/blockquote>"}, {"q": "9.2 WebSocket 与 HTTP 长轮询 / SSE 对比", "tag": "高频", "body": "<table><thead><tr><th>维度<\/th><th>HTTP 轮询<\/th><th>HTTP 长轮询<\/th><th>SSE<\/th><th>WebSocket<\/th><\/tr><\/thead><tbody><tr><td>方向<\/td><td>单向（客户端拉）<\/td><td>单向<\/td><td>服务器→客户端单向<\/td><td><strong>全双工双向<\/strong><\/td><\/tr><tr><td>协议<\/td><td>HTTP<\/td><td>HTTP<\/td><td>HTTP（text/event-stream）<\/td><td>独立帧协议<\/td><\/tr><tr><td>实时性<\/td><td>差<\/td><td>较好<\/td><td>好<\/td><td>最好<\/td><\/tr><tr><td>开销<\/td><td>高（高频请求）<\/td><td>中<\/td><td>低（长连接复用）<\/td><td>低<\/td><\/tr><tr><td>自动重连<\/td><td>无<\/td><td>无<\/td><td><strong>内置（Last-Event-ID）<\/strong><\/td><td>需自己实现<\/td><\/tr><tr><td>典型场景<\/td><td>旧系统<\/td><td>弱网兜底<\/td><td>通知流、行情推送<\/td><td>聊天、游戏、协同编辑<\/td><\/tr><\/tbody><\/table>\n<blockquote>加分点：<strong>SSE 比 WebSocket 简单得多且自带重连<\/strong>（服务端断线可基于 Last-Event-ID 续传），只做\"服务器单向推送\"时优先 SSE；需要客户端主动发消息/真正双向交互才上 WebSocket。面试说\"不是所有实时场景都该用 WebSocket\"是成熟的表现。<\/blockquote>"}, {"q": "9.3 WebSocket 帧结构与掩码", "tag": "进阶", "body": "<p>WebSocket 帧格式（RFC 6455）：<\/p>\n<ul><li><strong>FIN<\/strong>（1 bit）：是否最后一帧（分片控制）。<\/li><li><strong>RSV<\/strong>（3 bit）：扩展位。<\/li><li><strong>opcode<\/strong>（4 bit）：0x1 文本、0x2 二进制、0x8 关闭、0x9 Ping、0xA Pong、0x0 续帧。<\/li><li><strong>MASK<\/strong>（1 bit）：<strong>客户端 → 服务器必须置 1<\/strong>，服务器 → 客户端必须为 0。<\/li><li><strong>Payload len<\/strong>（7 bit / 扩展 16 bit / 64 bit）：载荷长度。<\/li><li><strong>Masking-Key<\/strong>（4 字节）：仅客户端发帧时存在，用于载荷异或混淆。<\/li><\/ul>\n<blockquote>加分点：<strong>掩码机制是为了防止\"缓存投毒攻击\"<\/strong>——早期代理会缓存内容，攻击者通过 WebSocket 伪造 HTTP 响应头注入缓存，掩码让载荷对中间代理不可预测，破坏这种注入。这是 RFC 6455 中\"客户端必须掩码、服务端禁止掩码\"不对称设计的真实原因，答出这一点非常加分。<\/blockquote>"}, {"q": "9.4 WebSocket 心跳与断线重连", "tag": "高频", "body": "<ul><li><strong>心跳<\/strong>：协议自带 <strong>Ping/Pong<\/strong> 帧（opcode 0x9/0xA）。客户端定时发 Ping，服务器必须回 Pong；N 次无 Pong 判定断线。也可用应用层 JSON 心跳报文（可携带业务信息，但会污染业务协议，一般优先 Ping/Pong）。<\/li><li><strong>断线重连策略<\/strong>：<\/li><\/ul>\n<ol><li><strong>立即重连<\/strong>：检测到断开马上重连。<\/li><li><strong>指数退避 + 随机抖动<\/strong>：1s、2s、4s… 上限 30s，加 ±随机抖动防止\"惊群\"（大量客户端同时重连打爆服务器）。<\/li><li><strong>重连后状态恢复<\/strong>：重新鉴权、恢复订阅、补发断线期间的消息（结合消息序号）。<\/li><li><strong>服务端重连限流<\/strong>：记录最近断连频次，频繁断连要求等待更久，防客户端死循环打爆服务。<\/li><\/ol>\n<blockquote>加分点：重连抖动（jitter）是工程细节——<strong>纯指数退避会导致 N 个客户端在同一时刻集体重连（雷群效应）<\/strong>，加抖动后分散到时间轴上。云厂商 SDK 普遍用\"退避 + 抖动 + 上限\"三段式，面试能主动提 jitter 是加分项。<\/blockquote>"}, {"q": "9.5 WebSocket 与 HTTP/2 的关系", "tag": "进阶", "body": "<ul><li>HTTP/2 本身支持<strong>双向流<\/strong>（客户端发起的 server push 是单向推送，且仅限服务器→客户端；WebSocket 是真正的双向）。<\/li><li>HTTP/2 提供了 <strong>RFC 8441（Extended CONNECT）<\/strong>：允许 WebSocket 在 HTTP/2 连接上复用（在 HTTP/2 之上承载 WebSocket），解决\"HTTP/2 场景下 WebSocket 只能另开 TCP 连接\"的问题。<\/li><li><strong>本质上 WebSocket 与 HTTP/2 是不同层的复用<\/strong>：WebSocket 提供\"应用层双向消息通道\"，HTTP/2 提供\"传输层多路复用\"；两者可以组合。<\/li><\/ul>\n<blockquote>加分点：一个易混点——<strong>HTTP/2 的 Server Push 与 WebSocket 是两回事<\/strong>：Push 是\"服务器预判客户端需要的资源并提前推送\"（单向、一次性、易缓存错配），WebSocket 是\"建立后任意时刻双向自由收发\"。HTTP/3 时代 WebSocket over QUIC 也已有草案（WebTransport 的补充）。<\/blockquote>\n<hr>"}]}, {"title": "10 连接池原理与参数", "questions": [{"q": "10.1 为什么需要连接池？", "tag": "基础", "body": "<ul><li><strong>建连成本高<\/strong>：数据库/Redis/MQ 等每次建立 TCP 连接 = 三次握手 + 鉴权 + 初始化会话（MySQL 还要做认证、权限校验、建临时表等），动辄数十 ms。<\/li><li><strong>无池的痛点<\/strong>：每请求建连 → 高并发下握手风暴、TIME_WAIT 爆炸、数据库端连接建立风暴，QPS 上不去。<\/li><li><strong>池化收益<\/strong>：<\/li><\/ul>\n<ol><li><strong>复用<\/strong>：连接建好反复用，摊薄建连成本。<\/li><li><strong>限流<\/strong>：池有上限，天然保护下游（数据库连接数可控）。<\/li><li><strong>预热与监控<\/strong>：启动时预建连接（预热），空闲/泄漏可观测。<\/li><\/ol>\n<blockquote>加分点：连接池的本质是<strong>\"对象的昂贵初始化与高频使用解耦\"<\/strong>——同理还有线程池、HTTP 连接池、内存对象池。池化三要素：<strong>容量上限、空闲回收、生命周期管理<\/strong>，任何池都逃不出这三件事。<\/blockquote>"}, {"q": "10.2 数据库连接池核心参数（以 HikariCP 为例）", "tag": "高频", "body": "<p>HikariCP（Spring Boot 默认）关键参数：<\/p>\n<table><thead><tr><th>参数<\/th><th>默认值<\/th><th>作用<\/th><\/tr><\/thead><tbody><tr><td>maximumPoolSize<\/td><td>10<\/td><td>池中<strong>最大连接数<\/strong>（含使用中）<\/td><\/tr><tr><td>minimumIdle<\/td><td>10<\/td><td>最少空闲连接数（维护下限）<\/td><\/tr><tr><td>connectionTimeout<\/td><td>30000ms<\/td><td><strong>获取连接超时<\/strong>，超时抛异常<\/td><\/tr><tr><td>idleTimeout<\/td><td>600000ms<\/td><td>空闲连接<strong>回收<\/strong>时长（仅当空闲 > minimumIdle 时生效）<\/td><\/tr><tr><td>maxLifetime<\/td><td>1800000ms<\/td><td>连接<strong>最大存活时间<\/strong>（必须小于数据库 wait_timeout）<\/td><\/tr><tr><td>connectionTestQuery<\/td><td>无<\/td><td>连接健康检查 SQL（如 <code>SELECT 1<\/code>）<\/td><\/tr><tr><td>leakDetectionThreshold<\/td><td>0（关闭）<\/td><td>连接泄漏检测阈值<\/td><\/tr><\/tbody><\/table>\n<blockquote>加分点：<strong>maxLifetime 必须 < 数据库的 wait_timeout<\/strong>（MySQL 默认 8 小时，连接被服务端空闲断开后，池内\"僵尸连接\"会导致报错），这是连接池与数据库之间最容易踩的坑；<code>leakDetectionThreshold<\/code> 开启后，连接持有超过阈值会<strong>强制归还并打日志<\/strong>，是排查泄漏的利器。<\/blockquote>"}, {"q": "10.3 连接池如何维护连接？获取/归还/驱逐", "tag": "进阶", "body": "<p>生命周期状态机：<\/p>\n<ol><li><strong>创建<\/strong>：池空且未达上限 → 新建连接（可<strong>预热<\/strong>，启动时预建 minimumIdle 条）。<\/li><li><strong>获取（borrow）<\/strong>：优先取空闲连接；空闲不足且未达上限 → 新建；达上限 → <strong>等待<\/strong>（connectionTimeout 内等归还）。<\/li><li><strong>归还（release）<\/strong>：使用完放回空闲队列（注意：必须<strong>释放事务/重置状态<\/strong>，否则下个用户拿到脏状态）。<\/li><li><strong>驱逐（evict）<\/strong>：空闲超时（idleTimeout）、存活超时（maxLifetime）、健康检查失败（testQuery）→ 关闭并移除，再按需补充。<\/li><li><strong>泄漏防护<\/strong>：持有超阈值（leakDetectionThreshold）→ 警告并强制回收。<\/li><\/ol>\n<blockquote>加分点：<strong>连接归还 ≠ 关闭连接<\/strong>，归还是把连接\"重置并放回池\"，关闭是销毁——连接池 bug 多出在\"归还时没重置（autocommit 被改、临时表残留、字符集被改）\"，导致连接状态污染，这类问题极难排查，面试提\"连接状态重置\"是资深信号。<\/blockquote>"}, {"q": "10.4 连接泄漏与 leakDetectionThreshold", "tag": "高频", "body": "<ul><li><strong>泄漏场景<\/strong>：代码拿了连接没归还（异常未 finally 释放、连接被线程持有不放、ThreadLocal 传递导致跨线程占用）→ 池被耗尽 → 后续请求全部超时/报\"connection pool exhausted\"。<\/li><li><strong>排查手段<\/strong>：<\/li><\/ul>\n<ol><li><code>leakDetectionThreshold=5000<\/code>：连接持有超 5s 未归还 → HikariCP 打印完整<strong>调用栈堆栈<\/strong>（能定位到具体代码行）→ 开启后定位泄漏精确到行。<\/li><li>监控：池使用率曲线、活跃连接数、等待获取超时次数。<\/li><li>代码审查：try-with-resources / finally 中归还。<\/li><\/ol>\n<ul><li><strong>根治<\/strong>：规范编码（Java 用 try-with-resources；Python 用 with/contextmanager）+ 压测 + 泄漏检测阈值全开。<\/li><\/ul>\n<blockquote>加分点：<strong>泄漏检测只能\"事后发现\"<\/strong>（连接被借出超过阈值才报警），无法阻止泄漏；更本质的防线是<strong>编码规范 + 代码评审 + 超时兜底<\/strong>（connectionTimeout 保证请求不会无限等）。另外注意：<code>leakDetectionThreshold<\/code> 必须小于 <code>connectionTimeout<\/code> 才有意义（否则等待方先超时了）。<\/blockquote>"}, {"q": "10.5 连接池大小怎么设置？", "tag": "高频", "body": "<ul><li><strong>误区<\/strong>：连接越多吞吐越高？错——连接是<strong>串行执行 SQL<\/strong> 的资源，CPU 核数是真实上限。<strong>过大的连接池反而降低吞吐<\/strong>（线程切换、锁竞争、数据库端连接风暴）。<\/li><li><strong>经验公式<\/strong>：<code>连接数 = CPU核数 × 2 + 有效磁盘数<\/code>（HikariCP 作者 Brett Wooldridge 给出的公式，机械硬盘场景；SSD/高并发 IO 场景可乘 4~8）。<\/li><li>关键权衡：<\/li><li>池太小 → 等待获取超时，吞吐受限。<\/li><li>池太大 → 数据库连接数爆炸、上下文切换开销、GC 压力。<\/li><li><strong>正确姿势<\/strong>：按\"<strong>P99 延迟达标 + 池使用率 30~60%<\/strong>\"为目标调参，配合压测（如 50/100/200 连接三档对比吞吐曲线）。<\/li><\/ul>\n<blockquote>加分点：公式背后的原理——<strong>数据库查询是 CPU+IO 密集的串行操作，一个活跃连接同一时刻只能跑一个查询，并发收益上限 ≈ CPU 核数 × (1/IO 等待占比)<\/strong>。池的\"最优大小\"是让 CPU 刚好饱和、连接不排队，而不是越大越好——这是与\"线程池大小\"完全一致的建模逻辑。<\/blockquote>"}, {"q": "10.6 连接预热与连接健康检查", "tag": "进阶", "body": "<ul><li><strong>预热（Warm-up）<\/strong>：应用启动时提前创建 minimumIdle 条连接并执行轻量查询（如 <code>SELECT 1<\/code>），避免\"上线第一波流量全部卡在建连上\"——常见于发布扩容后的流量尖峰。<\/li><li><strong>健康检查<\/strong>：<\/li><li><strong>惰性校验<\/strong>：借出时校验（多一次 RTT，只对\"可疑连接\"做）。<\/li><li><strong>定期校验<\/strong>：后台线程用 connectionTestQuery 探测空闲连接，失败即淘汰（HikariCP 默认每 30s 检查空闲连接）。<\/li><li><strong>建连时校验<\/strong>：新连接必须通过校验才能入池（防 DNS/权限变更后建出\"哑连接\"）。<\/li><li>典型故障：数据库重启、网络闪断、防火墙超时 → 池内连接变僵尸 → 不校验则首次使用必报错（\"Communications link failure\"），健康检查后自动淘汰重建，业务无感。<\/li><\/ul>\n<blockquote>加分点：<strong>\"僵尸连接\"检测的经典坑<\/strong>——如果连接是\"空闲状态被服务端断开\"，借出时才知道（惰性校验命中）；连接池推荐组合是\"<strong>惰性校验 + 后台定期校验<\/strong>\"，仅靠定期校验会漏掉\"刚被断开、还没到检查周期\"的连接。这也是 HikariCP 用 <code>aliveBypassWindow<\/code>（200ms 内刚借出的连接跳过重复校验）做性能优化的原因。<\/blockquote>\n<hr>"}]}, {"title": "11 连接问题排查与场景题", "questions": [{"q": "11.1 线上大量 TIME_WAIT 怎么排查处理？", "tag": "高频", "body": "<p><strong>排查<\/strong>：<\/p>\n<pre><code class=\"lang-bash\">ss -ant | awk '{print $1}' | sort | uniq -c | sort -rn\nss -ant state time-wait | awk '{print $4}' | sort | uniq -c | sort -rn<\/code><\/pre>\n<p><strong>根因判断<\/strong>：谁主动断开谁产生 TIME_WAIT——大量 TIME_WAIT 说明<strong>本机是主动关闭方<\/strong>，且连接\"建了即断\"（短连接、代理转发、健康检查等）。<\/p>\n<p><strong>处理<\/strong>（按收益排序）：<\/p>\n<ol><li>业务层开启<strong>连接复用<\/strong>（Keep-Alive/连接池）——治本。<\/li><li>确认 TIME_WAIT 数量是否真的影响可用性（<strong>< 几万通常无感<\/strong>，端口耗尽才致命）。<\/li><li>必要时 <code>tcp_tw_reuse=1<\/code>（仅客户端角色）+ <code>tcp_timestamps=1<\/code>；禁用 tcp_tw_recycle。<\/li><li>架构层：客户端集中断连改为服务端断开/负载均衡分摊。<\/li><\/ol>\n<blockquote>加分点：<strong>TIME_WAIT 本身不是故障，端口耗尽才是<\/strong>。TCP 连接四元组中源端口只有 6.5 万，若高 QPS 短连接且 TIME_WAIT 占用 60s，理论上每秒新建超 1000 连接就可能耗尽端口——所以\"量大不大\"要看\"每秒新建速率 × 60s\"是否接近 6.5 万，而不是看绝对值。<\/blockquote>"}, {"q": "11.2 线上大量 CLOSE_WAIT 怎么排查处理？", "tag": "高频", "body": "<p><strong>排查<\/strong>：<\/p>\n<pre><code class=\"lang-bash\">ss -antp | grep CLOSE_WAIT | head -20   # 定位进程 PID\nss -ant | grep -c CLOSE_WAIT\nss -ant state close-wait | awk '{print $5}' | sort | uniq -c | sort -rn<\/code><\/pre>\n<p><strong>根因<\/strong>：被动关闭方收到 FIN 后<strong>应用没调用 close()<\/strong>。锁定进程后：<\/p>\n<ol><li><code>jstack <pid><\/code> 看线程是否阻塞在 IO/锁上（线程池耗尽 → 无法处理关闭事件）。<\/li><li>检查代码：读循环里是否处理了 <code>read()==-1/0<\/code> 并 close；异常分支是否漏 close。<\/li><li>检查连接管理：是否有第三方库/网关吞掉了关闭事件。<\/li><li>兜底：调整 <code>tcp_keepalive_time<\/code> 让僵尸连接更快被回收（治标）。<\/li><\/ol>\n<blockquote>加分点：CLOSE_WAIT 排查的\"三板斧\"：<strong>ss 定位进程 → jstack 找阻塞线程 → 代码审计 close 路径<\/strong>。大多数线上 CLOSE_WAIT 堆积是\"线程池被慢下游占满，处理线程没机会执行 close\"，所以<strong>先看线程池状态<\/strong>比先看代码更高效——面试答这个顺序比答原理更值钱。<\/blockquote>"}, {"q": "11.3 连接超时：connect timeout / read timeout 区别", "tag": "高频", "body": "<ul><li><strong>connect timeout（连接超时）<\/strong>：从发起 TCP 连接到<strong>握手完成<\/strong>的等待上限。超时原因：目标不可达、防火墙丢包（SYN 无响应）、半连接队列满。设置建议：<strong>局域网 1~3s，公网 3~5s<\/strong>，不宜太长（否则故障感知太慢）。<\/li><li><strong>read timeout（读超时/响应超时）<\/strong>：连接建立后，<strong>等待响应数据<\/strong>的时限。超时原因：服务端处理慢、死锁、网络拥塞、服务端崩溃（连接悬挂）。设置建议：<strong>按业务 P99 延迟 × 3~5<\/strong>。<\/li><li><strong>write timeout<\/strong>：发送缓冲区满时等待写入。<\/li><\/ul>\n<blockquote>加分点：超时设置的核心原则——<strong>\"connect 要短（快速失败），read 要按业务容忍度（给足余量）\"<\/strong>。另外一个高频细节：<strong>read timeout 超时只是\"放弃等待\"，连接本身未必失效<\/strong>，多数框架会<strong>直接关闭连接<\/strong>（防止读到错位数据），所以 read timeout 之后连接不可复用。<\/blockquote>"}, {"q": "11.4 断线重连策略：指数退避与抖动", "tag": "高频", "body": "<ul><li><strong>目标<\/strong>：断线后快速恢复，同时不把服务器打挂。<\/li><li><strong>标准策略（指数退避 + 随机抖动 + 上限）<\/strong>：<\/li><\/ul>\n<pre><code>  delay = min(base * 2^attempt, max_delay)\n  delay = delay + random(0, jitter)   # 抖动，防雷群<\/code><\/pre>\n<p>例：base=1s，max=60s，attempt=0,1,2… → 1s、2s、4s、8s…60s。<\/p>\n<ul><li><strong>细节<\/strong>：<\/li><\/ul>\n<ol><li><strong>成功连接后重置计数<\/strong>。<\/li><li><strong>连续失败阈值<\/strong>：达到上限后进入\"长等待\"，避免死循环空转。<\/li><li><strong>状态恢复<\/strong>：重连后重放订阅/鉴权/断点续传（消息序号）。<\/li><li><strong>服务端视角<\/strong>：记录每客户端重连频率，超频拒绝（防被 client 循环打）。<\/li><\/ol>\n<blockquote>加分点：抖动（jitter）的存在理由——<strong>N 个客户端同时断网恢复时，若无抖动会在同一秒集体重连（惊群/雷群效应），把刚恢复的服务器再次打挂<\/strong>；加 ±50% 随机抖动后重连均匀散开。真实分布式系统（如 Kafka 消费者、云 SDK）全部内置该策略。<\/blockquote>"}, {"q": "11.5 NAT 穿透与 UDP 打洞", "tag": "进阶", "body": "<ul><li><strong>问题<\/strong>：内网主机（如手机在 WiFi 后）没有公网 IP，公网对端无法直接连它——NAT 为出站连接建立\"映射表\"，只允许\"从内部发起的会话\"反向回包。<\/li><li><strong>NAT 类型<\/strong>（按限制从松到严）：<\/li><\/ul>\n<ol><li><strong>全锥形（Full Cone）<\/strong>：映射后任意公网主机都能往该端口发包。<\/li><li><strong>受限锥形（Restricted Cone）<\/strong>：只有\"本机曾经通信过的目标 IP\"能发包进来。<\/li><li><strong>端口受限锥形（Port Restricted）<\/strong>：限定目标 IP+端口。<\/li><li><strong>对称 NAT（Symmetric）<\/strong>：<strong>每个目标地址/端口都建立独立映射<\/strong>——最难穿透。<\/li><\/ol>\n<ul><li><strong>UDP 打洞原理<\/strong>：A、B 同时向对方公网地址发 UDP（各自 NAT 建立映射），<strong>利用\"受限锥形允许已通信 IP 反向发包\"的规则<\/strong>，双方互相\"踩通\"映射后即可互发。<\/li><li><strong>TCP 打洞<\/strong>：更难（SYN 时序与 NAT 映射策略不可控），P2P 一般用 UDP 打洞 + 上层可靠协议（QUIC/自研）。<\/li><\/ul>\n<blockquote>加分点：<strong>对称 NAT 下 UDP 打洞必然失败<\/strong>，业界兜底方案是 <strong>TURN（中继转发）<\/strong>——由公网服务器中转所有流量（WebRTC 就是这么设计的：先尝试 P2P，失败降级 TURN）。面试能完整说出\"打洞适用受限锥形、对称 NAT 必须 TURN 中继\"就达到专家线。<\/blockquote>"}, {"q": "11.6 负载均衡的连接保持（粘性会话）", "tag": "进阶", "body": "<ul><li><strong>问题<\/strong>：无状态化后请求会被分发到不同后端，但<strong>有状态会话<\/strong>（登录态、购物车、WebSocket 长连接）要求后续请求仍落到同一台后端。<\/li><li><strong>方案<\/strong>：<\/li><\/ul>\n<ol><li><strong>Cookie 粘性<\/strong>：LB 种下 Cookie 记录后端选择。<\/li><li><strong>IP Hash<\/strong>：按客户端 IP 哈希到固定后端（Nginx ip_hash）。<\/li><li><strong>一致性哈希<\/strong>：带虚拟节点，后端增减时<strong>仅少量会话迁移<\/strong>（Redis 集群分片同款思想）。<\/li><li><strong>会话外部化<\/strong>（治本）：把 Session 放 Redis/DB，彻底不依赖粘性（现代分布式系统的正解）。<\/li><\/ol>\n<ul><li><strong>长连接场景<\/strong>：WebSocket/HTTP/2 的连接与后端绑定，LB 需保证\"同连接同后端\"（HTTP/2 一个连接上的所有流必须去同一后端，否则流状态错乱）。<\/li><\/ul>\n<blockquote>加分点：粘性会话是<strong>\"局部优化\"<\/strong>，会话外部化才是<strong>\"全局正解\"<\/strong>——面试升级话术：\"粘性只是过渡方案，它的代价是后端扩容/缩容时的会话抖动与单点热点；生产上优先把会话下沉到分布式缓存（Redis），让任意后端都能服务任意请求。\"（Nginx ip_hash 的经典坑：源 IP 哈希在后端增减时几乎全量迁移，一致性哈希才平滑。）<\/blockquote>"}, {"q": "11.7 百万长连接网关架构（IM 场景）", "tag": "进阶", "body": "<p>经典设计（微信/钉钉类 IM 的接入层）：<\/p>\n<ol><li><strong>接入层（Connection Gateway）<\/strong>：无状态集群，每台用 epoll 支撑 <strong>10万~百万级<\/strong> WebSocket/TCP 长连接，<strong>连接只在本机，业务状态外置<\/strong>。<\/li><li><strong>会话路由<\/strong>：Redis 记录\"userId → 网关节点\"，消息投递先查路由再转发到对应网关（或经消息总线）。<\/li><li><strong>水平扩展<\/strong>：新网关上线自动注册（服务发现），客户端重连路由到新节点。<\/li><li><strong>心跳与踢人<\/strong>：30s 心跳，超时判离线；同账号新登录踢旧连接（连接管理）。<\/li><li><strong>消息可靠性<\/strong>：客户端 ack + 服务端消息序号 + 离线消息存 MQ/DB。<\/li><li><strong>瓶颈点<\/strong>：单机 fd 上限（调 ulimit）、每连接内存（压缩到 2~4KB）、CPU 软中断（多队列+RSS）、GC 停顿（Netty 用堆外内存/池化）。<\/li><\/ol>\n<blockquote>加分点：IM 架构的<strong>核心原则是\"连接与状态分离\"<\/strong>——连接是\"瞬态资源\"（哪台网关都能收），状态是\"持久资产\"（必须落 Redis/DB），这样网关可以随意扩缩容而不丢会话。面试常追问\"网关挂了连接断了怎么办\"——答案就是：客户端重连 → 新网关 → 路由表查 userId → 状态从 Redis 恢复，用户无感知。这就是\"<strong>连接可丢、状态不丢<\/strong>\"的设计哲学。<\/blockquote>\n<hr>\n<blockquote>整理完成：11 大章节 66 题，覆盖\"连接\"从物理层到应用层的全部形态（TCP/UDP/HTTP/WebSocket/连接池/排障），标注高频/进阶/基础，含加分点与内核参数级细节。<\/blockquote>"}]}], "qcount": 66}]}];
const storeKey = "interview_collection_mastered_v1";
let mastered = new Set(JSON.parse(localStorage.getItem(storeKey) || "[]"));
let curTech = 0;
let searchMode = false;

const $ = s => document.querySelector(s);
const el = (t, cls) => { const e = document.createElement(t); if(cls) e.className = cls; return e; };

function save(){ localStorage.setItem(storeKey, JSON.stringify([...mastered])); updateStats(); }

function uid(ti, di, ci, qi){ return `${ti}:${di}:${ci}:${qi}`; }

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function refreshStats(){
  let total = 0, done = 0;
  DATA.forEach((t,ti)=>t.docs.forEach((d,di)=>d.chapters.forEach(c=>c.questions.forEach((q,qi)=>{
    total++;
    if(mastered.has(uid(t.id,di,chapterIndexOf(t,di,c),qi))) done++;
  }))));
  $("#statTotal").textContent = total;
  $("#statDone").textContent = done;
  $("#statPct").textContent = total ? Math.round(done/total*100) : 0;
}

// 通过章节对象定位其索引（章节数组内顺序稳定）
function chapterIndexOf(t, di, ch){
  return t.docs[di].chapters.indexOf(ch);
}

function buildTabs(){
  const wrap = $("#tabs"); wrap.innerHTML = "";
  DATA.forEach((t,ti)=>{
    const n = t.docs.reduce((a,d)=>a+d.qcount,0);
    const b = el("div","tab"+(ti===curTech?" active":""));
    b.style.setProperty("--accent", t.color);
    b.innerHTML = `<span>${t.icon}</span>${esc(t.name)}<span class="n">${n}</span>`;
    b.onclick = ()=>{ curTech = ti; searchMode = false; $("#search").value=""; buildTabs(); renderTech(); };
    wrap.appendChild(b);
  });
}

function renderTech(){
  const main = $("#main"); main.innerHTML = "";
  const t = DATA[curTech];
  const head = el("div","tech-head");
  head.innerHTML = `<h2>${t.icon} ${esc(t.name)}</h2><span class="cnt">共 ${t.docs.reduce((a,d)=>a+d.qcount,0)} 题 · ${t.docs.length} 份文档</span>`;
  main.appendChild(head);

  t.docs.forEach((d,di)=>{
    const doc = el("div","doc");
    const dt = el("div","doc-title");
    dt.innerHTML = `<span class="doc-badge">${esc(d.sub)}</span><span class="sub">${esc(d.sub === "题库深度版" ? "深度题库" : d.sub)}</span><span class="q">${d.qcount} 题</span>`;
    doc.appendChild(dt);

    d.chapters.forEach((ch,ci)=>{
      if(!ch.questions.length && !ch.intro) return;
      const det = el("details","chapter");
      const sum = el("summary");
      sum.innerHTML = `<span class="arrow">▶</span><span>${esc(ch.title)}</span><span class="ccount">${ch.questions.length} 题</span>`;
      det.appendChild(sum);
      if(ch.intro){ const inr = el("div","chapter-intro"); inr.innerHTML = ch.intro; det.appendChild(inr); }
      const body = el("div","chapter-body");
      ch.questions.forEach((q,qi)=>{
        body.appendChild(buildCard(t,di,ch,ci,q,qi));
      });
      det.appendChild(body);
      doc.appendChild(det);
    });
    main.appendChild(doc);
  });
  refreshStats();
}

function buildCard(t,di,ch,ci,q,qi){
  const id = uid(t.id,di,ci,qi);
  const card = el("div","qcard"+(mastered.has(id)?" mastered":""));
  const head = el("div","qhead");
  const tag = q.tag ? `<span class="qtag t-${esc(q.tag)}">${esc(q.tag)}</span>` : "";
  const mbtn = el("button","btn-master"+(mastered.has(id)?" on":""));
  mbtn.textContent = mastered.has(id) ? "✓ 已掌握" : "标记掌握";
  mbtn.onclick = (e)=>{ e.stopPropagation(); if(mastered.has(id)){mastered.delete(id);}else{mastered.add(id);} save(); card.classList.toggle("mastered"); mbtn.classList.toggle("on"); mbtn.textContent = mastered.has(id)?"✓ 已掌握":"标记掌握"; refreshStats(); };
  head.innerHTML = `<span class="idx">${String(qi+1).padStart(2,'0')}</span><div class="qtxt">${esc(q.q)}</div>${tag}<span class="qactions"></span><span class="caret">▶</span>`;
  head.querySelector(".qactions").appendChild(mbtn);
  head.onclick = (e)=>{ if(e.target===mbtn) return; card.classList.toggle("open"); };
  const body = el("div","qbody");
  body.innerHTML = q.body || "<p>（暂无解析）</p>";
  card.appendChild(head); card.appendChild(body);
  return card;
}

function doSearch(kw){
  kw = kw.trim().toLowerCase();
  const main = $("#main"); main.innerHTML = "";
  if(!kw){ searchMode = false; renderTech(); return; }
  searchMode = true;
  let found = 0;
  const results = [];
  DATA.forEach((t,ti)=>t.docs.forEach((d,di)=>d.chapters.forEach((ch,ci)=>{
    ch.questions.forEach((q,qi)=>{
      const hay = (q.q + " " + ch.title + " " + t.name).toLowerCase();
      if(hay.includes(kw)){
        results.push({t,di,ch,ci,q,qi});
      }
    });
  })));
  const head = el("div","tech-head");
  head.innerHTML = `<h2>🔍 搜索结果</h2><span class="cnt">「${esc(kw)}」命中 ${results.length} 题</span>`;
  main.appendChild(head);
  if(!results.length){ main.appendChild(el("div","empty","没有匹配的题目，换个关键词试试")); refreshStats(); return; }
  results.forEach(r=>{
    const card = buildCard(r.t,r.di,r.ch,r.ci,r.q,r.qi);
    card.classList.add("open");
    main.appendChild(card);
  });
  refreshStats();
}

function expandAll(open){
  document.querySelectorAll(".qcard").forEach(c=>{ if(open)c.classList.add("open"); else c.classList.remove("open"); });
}
function masterAll(){
  // 只对当前可见题目全部标记
  document.querySelectorAll(".qcard").forEach(c=>{
    const mb = c.querySelector(".btn-master"); if(mb && !mb.classList.contains("on")) mb.click();
  });
}

document.addEventListener("DOMContentLoaded", ()=>{
  buildTabs();
  renderTech();
  $("#search").addEventListener("input", e=>doSearch(e.target.value));
  $("#btnExpand").onclick = ()=>expandAll(true);
  $("#btnCollapse").onclick = ()=>expandAll(false);
  $("#btnMasterAll").onclick = ()=>masterAll();
  $("#btnTop").onclick = ()=>window.scrollTo({top:0,behavior:"smooth"});
});
</script>
</body>
</html>
