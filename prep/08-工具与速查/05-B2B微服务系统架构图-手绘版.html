<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B2B 大宗贸易微服务系统架构图</title>
<style>
  :root {
    --bg: #FFFFFF;
    --text: #1e1e1e;
    --subtle: #6b7280;
    --grid-dot: #d1d5db;
    --access-fill: #ECFDF3;
    --access-stroke: #027A48;
    --gateway-fill: #F5F3FF;
    --gateway-stroke: #7A5AF8;
    --business-fill: #F8FAFC;
    --business-stroke: #334155;
    --engine-fill: #FFF7ED;
    --engine-stroke: #C4320A;
    --data-fill: #F0F9FF;
    --data-stroke: #026AA2;
    --external-fill: #F4F3FF;
    --external-stroke: #6941C6;
    --ds-fill: #EFF8FF;
    --ds-stroke: #175CD3;
    --conn-color: #9ca3af;
    --conn-highlight: #1F2937;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #FFFFFF;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
    color: var(--text);
  }

  h1 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: #111827;
    margin-bottom: 4px;
    text-align: center;
  }
  .subtitle {
    font-size: 13px;
    color: var(--subtle);
    margin-bottom: 24px;
    text-align: center;
  }

  .diagram-wrap {
    width: 100%;
    max-width: 1160px;
    border: 1px solid #E5E7EB;
    border-radius: 12px;
    overflow: hidden;
    background: #FAFBFC;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }

  svg { display: block; width: 100%; height: auto; }

  /* Component rectangles */
  .comp-rect {
    transition: all 0.25s ease;
    cursor: pointer;
  }
  .comp-rect:hover {
    filter: brightness(0.96);
    stroke-width: 2.5px !important;
  }

  /* Connection lines */
  .conn {
    transition: all 0.3s ease;
  }
  .conn.dimmed {
    opacity: 0.12;
  }
  .conn.highlighted {
    stroke: var(--conn-highlight) !important;
    stroke-width: 2.2px !important;
    opacity: 1 !important;
    filter: none !important;
  }

  /* Dashed monitoring line */
  .conn-dash {
    transition: all 0.3s ease;
  }
  .conn-dash.dimmed {
    opacity: 0.08;
  }
  .conn-dash.highlighted {
    stroke: #D92D20 !important;
    stroke-width: 2px !important;
    opacity: 1 !important;
    filter: none !important;
  }

  /* Component text hover */
  .comp-group { cursor: pointer; }
  .comp-group:hover .comp-rect {
    filter: brightness(0.94);
  }

  /* Layer labels */
  .layer-label {
    font-size: 11px;
    fill: #9CA3AF;
    font-weight: 500;
    letter-spacing: 0.06em;
  }

  /* Legend */
  .legend-box {
    transition: all 0.2s ease;
  }

  .hover-hint {
    font-size: 11px;
    color: #9CA3AF;
    text-align: center;
    margin-top: 12px;
    font-style: italic;
  }

  .tooltip {
    position: fixed;
    pointer-events: none;
    background: #1F2937;
    color: #F9FAFB;
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 6px;
    white-space: nowrap;
    z-index: 1000;
    opacity: 0;
    transition: opacity 0.18s;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .tooltip.show { opacity: 1; }
</style>
</head>

<p class="hover-hint">悬停任意组件查看其所有关联连接 &nbsp;|&nbsp; 虚线 = 监控链路 &nbsp;|&nbsp; DS↔交易核心 = TCP + 自定义二进制报文</p>

<script>
(function() {
  var tooltip = document.getElementById('tooltip');
  var compGroups = document.querySelectorAll('.comp-group');
  var allConns = document.querySelectorAll('.conn, .conn-dash');
  var highlighted = [];

  function dimAllExcept(keepIds) {
    var keepSet = new Set(keepIds);
    for (var i = 0; i < allConns.length; i++) {
      var el = allConns[i];
      if (keepSet.has(el.id)) {
        el.classList.add('highlighted');
        el.classList.remove('dimmed');
        // Switch to highlighted marker
        if (el.getAttribute('marker-end') === 'url(#arrow)') {
          el.setAttribute('marker-end', 'url(#arrow-hl)');
        }
      } else {
        el.classList.add('dimmed');
        el.classList.remove('highlighted');
        // Reset marker
        if (el.getAttribute('marker-end') === 'url(#arrow-hl)') {
          el.setAttribute('marker-end', 'url(#arrow)');
        }
      }
    }
    highlighted = keepIds;
  }

  function resetAll() {
    for (var i = 0; i < allConns.length; i++) {
      var el = allConns[i];
      el.classList.remove('dimmed', 'highlighted');
      if (el.getAttribute('marker-end') === 'url(#arrow-hl)') {
        el.setAttribute('marker-end', 'url(#arrow)');
      }
    }
    highlighted = [];
  }

  function findRelatedConns(compId) {
    var ids = [];
    for (var i = 0; i < allConns.length; i++) {
      var el = allConns[i];
      var from = el.getAttribute('data-from');
      var to = el.getAttribute('data-to');
      if (from === compId || to === compId) {
        ids.push(el.id);
      }
    }
    return ids;
  }

  for (var i = 0; i < compGroups.length; i++) {
    var group = compGroups[i];
    var compId = group.getAttribute('data-id');

    group.addEventListener('mouseenter', function(e) {
      var id = this.getAttribute('data-id');
      var related = findRelatedConns(id);
      dimAllExcept(related);

      // Show tooltip
      var rect = this.getBoundingClientRect();
      tooltip.textContent = this.querySelector('text').textContent + ' — ' + related.length + ' 条连接';
      tooltip.classList.add('show');
      tooltip.style.left = rect.left + (rect.width / 2) - (tooltip.offsetWidth / 2) + 'px';
      tooltip.style.top = (rect.top - 36) + 'px';
    });

    group.addEventListener('mouseleave', function() {
      resetAll();
      tooltip.classList.remove('show');
    });

    group.addEventListener('mousemove', function(e) {
      tooltip.style.left = (e.clientX - tooltip.offsetWidth / 2) + 'px';
      tooltip.style.top = (e.clientY - 36) + 'px';
    });
  }
})();
</script>

</body>
</html>
