<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>断线到恢复的五步时序</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#f1f5f9;padding:40px;font-family:ui-sans-serif,system-ui,"Microsoft YaHei",sans-serif;color:#1e293b}
  .wrap{width:1200px;margin:0 auto}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:36px 40px}
  h1{font-size:26px;font-weight:600;letter-spacing:.3px;color:#0f172a}
  .sub{color:#64748b;font-size:14px;margin-top:12px;line-height:1.8}
  .legend{display:flex;gap:28px;margin-top:20px;font-size:13px;color:#475569;flex-wrap:wrap}
  .dot{width:13px;height:13px;border-radius:3px;display:inline-block;margin-right:7px;vertical-align:-1px}
  svg{display:block;width:100%;height:auto;margin-top:28px}
  svg text{font-family:ui-sans-serif,system-ui,"Microsoft YaHei",sans-serif}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>从断线到恢复：五步时序</h1>
    <p class="sub">重连不等于重订阅。第三、四步（拉快照、校时钟）最常被省略——代码不报错、页面显示「已连接」，但价格和倒计时永远停在断线那一刻。</p>
    <div class="legend">
      <span><span class="dot" style="background:#d97706"></span>检测到故障</span>
      <span><span class="dot" style="background:#0d9488"></span>恢复动作（顺序不可换）</span>
    </div>

    <svg viewBox="0 0 1200 350" xmlns="http://www.w3.org/2000/svg" role="img">
      <title>从断线到恢复的五步时序</title>
      <desc>依次为发现断开、退避重连、拉快照、校时钟、重订阅，顺序不可颠倒。</desc>
      <defs>
        <marker id="aGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
          <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
        </marker>
      </defs>

      <rect x="60" y="100" width="196" height="150" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="158" y="138" text-anchor="middle" font-size="17" font-weight="600" fill="#92400e">① 发现断开</text>
      <text x="158" y="172" text-anchor="middle" font-size="13" fill="#b45309">连续 2 次 pong 未回</text>
      <text x="158" y="198" text-anchor="middle" font-size="13" fill="#b45309">即判死，不是「再等等」</text>
      <text x="158" y="228" text-anchor="middle" font-size="12" fill="#94a3b8">依据：应用层心跳</text>

      <line x1="258" y1="175" x2="279" y2="175" stroke="#94a3b8" stroke-width="2" marker-end="url(#aGray)"/>

      <rect x="281" y="100" width="196" height="150" rx="10" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
      <text x="379" y="138" text-anchor="middle" font-size="17" font-weight="600" fill="#115e59">② 退避重连</text>
      <text x="379" y="172" text-anchor="middle" font-size="13" fill="#0f766e">1→2→4→8→16→30s</text>
      <text x="379" y="198" text-anchor="middle" font-size="13" fill="#0f766e">每次叠加 ±20% 抖动</text>
      <text x="379" y="228" text-anchor="middle" font-size="12" fill="#94a3b8">依据：无抖动会引发惊群</text>

      <line x1="479" y1="175" x2="500" y2="175" stroke="#94a3b8" stroke-width="2" marker-end="url(#aGray)"/>

      <rect x="502" y="100" width="196" height="150" rx="10" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
      <text x="600" y="138" text-anchor="middle" font-size="17" font-weight="600" fill="#115e59">③ 拉快照</text>
      <text x="600" y="172" text-anchor="middle" font-size="13" fill="#0f766e">GP0105 重建基准</text>
      <text x="600" y="198" text-anchor="middle" font-size="13" fill="#0f766e">不补断线期间的中间事件</text>
      <text x="600" y="228" text-anchor="middle" font-size="12" fill="#94a3b8">依据：补历史成本高于拉快照</text>

      <line x1="700" y1="175" x2="721" y2="175" stroke="#94a3b8" stroke-width="2" marker-end="url(#aGray)"/>

      <rect x="723" y="100" width="196" height="150" rx="10" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
      <text x="821" y="138" text-anchor="middle" font-size="17" font-weight="600" fill="#115e59">④ 校时钟</text>
      <text x="821" y="172" text-anchor="middle" font-size="13" fill="#0f766e">GP2458 校准倒计时基准</text>
      <text x="821" y="198" text-anchor="middle" font-size="13" fill="#0f766e">此后只做本地插值</text>
      <text x="821" y="228" text-anchor="middle" font-size="12" fill="#94a3b8">依据：本地钟会漂移、可被改</text>

      <line x1="921" y1="175" x2="942" y2="175" stroke="#94a3b8" stroke-width="2" marker-end="url(#aGray)"/>

      <rect x="944" y="100" width="196" height="150" rx="10" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
      <text x="1042" y="138" text-anchor="middle" font-size="17" font-weight="600" fill="#115e59">⑤ 重订阅</text>
      <text x="1042" y="172" text-anchor="middle" font-size="13" fill="#0f766e">从最新 seq 开始</text>
      <text x="1042" y="198" text-anchor="middle" font-size="13" fill="#0f766e">以快照为准丢弃过期事件</text>
      <text x="1042" y="228" text-anchor="middle" font-size="12" fill="#94a3b8">依据：epoch 变化则 seq 不可比</text>

      <text x="60" y="296" font-size="14" fill="#dc2626">最常见的错误：只做 ②、⑤ 两步——连接恢复了，心跳也通了，但没有任何一层能发现「数据停在断线那一刻」。</text>
      <text x="60" y="326" font-size="13" fill="#94a3b8">连续失败 5 次：停止重试，切降频轮询（3~5s）保页面可用，后台每 30s 试探一次 WS，恢复后自动切回。</text>
    </svg>
  </div>
</div>
</body>
</html>
