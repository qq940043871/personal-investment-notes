<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 810" width="1040" height="810" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Hiragino Sans GB',sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcfdff"/>
      <stop offset="1" stop-color="#f0f4f9"/>
    </linearGradient>
    <linearGradient id="stepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>
    <filter id="s3" x="-10%" y="-30%" width="120%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#1b2a41" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="1040" height="810" fill="url(#bg3)"/>

  <text x="520" y="58" text-anchor="middle" font-size="30" font-weight="700" fill="#16233a">优化的固定顺序</text>
  <text x="520" y="92" text-anchor="middle" font-size="15" fill="#71809a">顺序错了，力气就白花了。这条路径在服务器、堆、上下文窗口上通用。</text>

  <!-- 台阶基线 -->
  <g stroke="#d7e1ee" stroke-width="2" fill="none">
    <path d="M96 690 L96 780"/>
  </g>

  <!-- 步骤 1 -->
  <g>
    <rect x="96" y="126" width="848" height="86" rx="12" fill="url(#stepGrad)" stroke="#dbe6f5" filter="url(#s3)"/>
    <circle cx="142" cy="169" r="22" fill="#3b82f6"/>
    <text x="142" y="176" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">1</text>
    <text x="184" y="160" font-size="19" font-weight="700" fill="#16233a">先量出来</text>
    <text x="184" y="188" font-size="14" fill="#61708a">没有数据支撑的调优都是碰运气 —— 改 GC 参数凭感觉，改提示词也凭感觉</text>
    <text x="912" y="160" text-anchor="end" font-size="12" fill="#9aa8bc">监控 / GC 日志 / token 计数</text>
  </g>

  <!-- 步骤 2 -->
  <g>
    <rect x="96" y="224" width="848" height="86" rx="12" fill="url(#stepGrad)" stroke="#dbe6f5" filter="url(#s3)"/>
    <circle cx="142" cy="267" r="22" fill="#4b8fe8"/>
    <text x="142" y="274" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">2</text>
    <text x="184" y="258" font-size="19" font-weight="700" fill="#16233a">找出瓶颈在哪一层</text>
    <text x="184" y="286" font-size="14" fill="#61708a">别在没堵的地方修路 —— 是分配太快，是流量太尖，还是内容太杂</text>
    <text x="912" y="258" text-anchor="end" font-size="12" fill="#9aa8bc">定位 / 分层排查</text>
  </g>

  <!-- 步骤 3（重点） -->
  <g>
    <rect x="96" y="322" width="848" height="96" rx="12" fill="#16233a" filter="url(#s3)"/>
    <circle cx="142" cy="370" r="22" fill="#ffffff"/>
    <text x="142" y="377" text-anchor="middle" font-size="17" font-weight="700" fill="#16233a">3</text>
    <text x="184" y="362" font-size="19" font-weight="700" fill="#ffffff">先削减需求</text>
    <text x="184" y="390" font-size="14" fill="#a8b8d0">少造垃圾 ＞ 换收集器　·　少塞内容 ＞ 开大窗口　·　少接无效请求 ＞ 加机器</text>
    <text x="912" y="362" text-anchor="end" font-size="12" fill="#8fa3c0">最反直觉，也最有效</text>
  </g>

  <!-- 步骤 4 -->
  <g>
    <rect x="96" y="430" width="848" height="86" rx="12" fill="url(#stepGrad)" stroke="#dbe6f5" filter="url(#s3)"/>
    <circle cx="142" cy="473" r="22" fill="#7fb2ef"/>
    <text x="142" y="480" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">4</text>
    <text x="184" y="464" font-size="19" font-weight="700" fill="#16233a">再扩大供给</text>
    <text x="184" y="492" font-size="14" fill="#61708a">加机器、加内存、开大窗口 —— 永远排在第三步之后，不是第一步</text>
    <text x="912" y="464" text-anchor="end" font-size="12" fill="#9aa8bc">扩容</text>
  </g>

  <!-- 步骤 5 -->
  <g>
    <rect x="96" y="528" width="848" height="86" rx="12" fill="url(#stepGrad)" stroke="#dbe6f5" filter="url(#s3)"/>
    <circle cx="142" cy="571" r="22" fill="#a5cdf0"/>
    <text x="142" y="578" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">5</text>
    <text x="184" y="562" font-size="19" font-weight="700" fill="#16233a">给峰值留位置</text>
    <text x="184" y="590" font-size="14" fill="#61708a">留余量看着像浪费，其实是在买保险；省下的钱，押上的是稳定性</text>
    <text x="912" y="562" text-anchor="end" font-size="12" fill="#9aa8bc">余量 / 错误预算</text>
  </g>

  <!-- 步骤 6 -->
  <g>
    <rect x="96" y="626" width="848" height="86" rx="12" fill="url(#stepGrad)" stroke="#dbe6f5" filter="url(#s3)"/>
    <circle cx="142" cy="669" r="22" fill="#c3e0ee"/>
    <text x="142" y="676" text-anchor="middle" font-size="17" font-weight="700" fill="#16233a">6</text>
    <text x="184" y="660" font-size="19" font-weight="700" fill="#16233a">从固定阈值走向闭环</text>
    <text x="184" y="688" font-size="14" fill="#61708a">负载高了自动扩，占用多了自动调，上下文按任务类型动态拼装</text>
    <text x="912" y="660" text-anchor="end" font-size="12" fill="#9aa8bc">自适应 / 反馈回路</text>
  </g>

  <!-- 底部注释 -->
  <text x="520" y="764" text-anchor="middle" font-size="14" fill="#8d9bb0">先问有效容量有多大 → 再问卡在哪一层 → 最后才决定省着用，还是加供给</text>
</svg>
