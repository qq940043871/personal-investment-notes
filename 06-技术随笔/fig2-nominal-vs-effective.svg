<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 720" width="1040" height="720" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Hiragino Sans GB',sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcfdff"/>
      <stop offset="1" stop-color="#f0f4f9"/>
    </linearGradient>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#eef2f7"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#ccd6e2" stroke-width="1.4"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-40%" width="140%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#1b2a41" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1040" height="720" fill="url(#bg2)"/>

  <text x="520" y="62" text-anchor="middle" font-size="30" font-weight="700" fill="#16233a">标称容量，和真正能用的容量</text>
  <text x="520" y="96" text-anchor="middle" font-size="15" fill="#71809a">标签上的数字，永远比实际能干活的空间大一圈。所有调优都发生在这道缝里。</text>

  <!-- 图例 -->
  <g font-size="13" fill="#6b7a91">
    <rect x="646" y="116" width="18" height="12" rx="3" fill="#3b82f6"/>
    <text x="672" y="127">有效容量</text>
    <rect x="762" y="116" width="18" height="12" rx="3" fill="url(#hatch)" stroke="#ccd6e2"/>
    <text x="788" y="127">损耗 / 用不上</text>
  </g>

  <!-- ================= 1. 服务器 ================= -->
  <g>
    <text x="60" y="176" font-size="20" font-weight="700" fill="#16233a">服务器</text>
    <text x="60" y="200" font-size="13" fill="#8593a8">CPU 利用率</text>

    <text x="880" y="176" text-anchor="end" font-size="14" fill="#8d9bb0">标称 100%</text>
    <text x="880" y="198" text-anchor="end" font-size="14" font-weight="600" fill="#3b82f6">可用 ≈ 82%</text>

    <rect x="60" y="216" width="760" height="48" rx="8" fill="url(#hatch)" stroke="#dde4ee"/>
    <rect x="60" y="216" width="623" height="48" rx="8" fill="#3b82f6" filter="url(#softShadow)"/>
    <text x="86" y="246" font-size="15" font-weight="600" fill="#ffffff">真正承接业务的算力</text>

    <line x1="683" y1="206" x2="683" y2="274" stroke="#3b82f6" stroke-width="1.6" stroke-dasharray="5 5"/>
    <text x="700" y="246" font-size="13" fill="#7a879b">留给尖峰、慢查询</text>
    <text x="700" y="265" font-size="13" fill="#7a879b">和一次发布的额外开销</text>
  </g>

  <line x1="60" y1="306" x2="980" y2="306" stroke="#e2e8f1" stroke-width="1.5"/>

  <!-- ================= 2. JVM ================= -->
  <g>
    <text x="60" y="352" font-size="20" font-weight="700" fill="#16233a">JVM 堆</text>
    <text x="60" y="376" font-size="13" fill="#8593a8">-Xmx 16G</text>

    <text x="880" y="352" text-anchor="end" font-size="14" fill="#8d9bb0">标称 16G</text>
    <text x="880" y="374" text-anchor="end" font-size="14" font-weight="600" fill="#d97706">可用 ≈ 11G</text>

    <rect x="60" y="392" width="760" height="48" rx="8" fill="url(#hatch)" stroke="#dde4ee"/>
    <rect x="60" y="392" width="517" height="48" rx="8" fill="#f59e0b" filter="url(#softShadow)"/>
    <text x="86" y="422" font-size="15" font-weight="600" fill="#ffffff">真正存对象的空间</text>

    <line x1="577" y1="382" x2="577" y2="450" stroke="#d97706" stroke-width="1.6" stroke-dasharray="5 5"/>
    <text x="594" y="422" font-size="13" fill="#7a879b">收集器自身 + 对象头</text>
    <text x="594" y="441" font-size="13" fill="#7a879b">+ 反复分配留下的碎片</text>
  </g>

  <line x1="60" y1="482" x2="980" y2="482" stroke="#e2e8f1" stroke-width="1.5"/>

  <!-- ================= 3. 上下文 ================= -->
  <g>
    <text x="60" y="528" font-size="20" font-weight="700" fill="#16233a">上下文窗口</text>
    <text x="60" y="552" font-size="13" fill="#8593a8">200K tokens</text>

    <text x="880" y="528" text-anchor="end" font-size="14" fill="#8d9bb0">标称 200K</text>
    <text x="880" y="550" text-anchor="end" font-size="14" font-weight="600" fill="#059669">有效 ≈ 50K</text>

    <rect x="60" y="568" width="760" height="48" rx="8" fill="url(#hatch)" stroke="#dde4ee"/>
    <rect x="60" y="568" width="228" height="48" rx="8" fill="#10b981" filter="url(#softShadow)"/>
    <text x="86" y="598" font-size="15" font-weight="600" fill="#ffffff">真被读进去的部分</text>

    <line x1="288" y1="558" x2="288" y2="626" stroke="#059669" stroke-width="1.6" stroke-dasharray="5 5"/>
    <text x="305" y="590" font-size="13" fill="#7a879b">无关注释稀释注意力</text>
    <text x="305" y="609" font-size="13" fill="#7a879b">＋中段内容被系统性略过</text>
    <text x="305" y="628" font-size="13" fill="#7a879b">＋重复示例让指令变得模糊</text>
  </g>

  <!-- 底部结论 -->
  <g>
    <rect x="60" y="654" width="920" height="46" rx="10" fill="#16233a"/>
    <text x="520" y="683" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">把标称调大，损耗不会消失，只会往后挪一步 —— 从每天几次小停顿，换成半年一次全局停顿</text>
  </g>
</svg>
