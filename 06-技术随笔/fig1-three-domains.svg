<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" width="1240" height="720" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Hiragino Sans GB',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcfdff"/>
      <stop offset="1" stop-color="#eef2f8"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#1b2a41" flood-opacity="0.08"/>
    </filter>
    <filter id="barShadow" x="-10%" y="-40%" width="120%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#1b2a41" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1240" height="720" fill="url(#bg)"/>

  <!-- 标题 -->
  <text x="620" y="66" text-anchor="middle" font-size="32" font-weight="700" fill="#16233a">同一道题：在不够用的前提下，把事办成</text>
  <text x="620" y="102" text-anchor="middle" font-size="15" fill="#71809a">三个领域看起来毫不相干，剥掉行话之后，剩下的是同一个约束</text>
  <line x1="500" y1="120" x2="740" y2="120" stroke="#cfd9e6" stroke-width="2" stroke-linecap="round"/>

  <!-- ===== 卡片 1：运维 ===== -->
  <g>
    <rect x="40" y="146" width="360" height="424" rx="16" fill="#ffffff" stroke="#e3e9f2" filter="url(#cardShadow)"/>
    <rect x="40" y="162" width="5" height="392" rx="2.5" fill="#3b82f6"/>

    <text x="70" y="204" font-size="26" font-weight="700" fill="#16233a">运维工程</text>
    <text x="70" y="232" font-size="13" fill="#8593a8">看得见的资源</text>
    <text x="70" y="262" font-size="15" fill="#41506a">CPU 核数、内存、带宽、</text>
    <text x="70" y="288" font-size="15" fill="#41506a">磁盘吞吐、连接数</text>

    <line x1="70" y1="316" x2="370" y2="316" stroke="#edf1f7" stroke-width="1.5"/>

    <text x="70" y="348" font-size="13" fill="#8593a8">真正稀缺的</text>
    <text x="70" y="380" font-size="18" font-weight="700" fill="#3b82f6">余量</text>
    <text x="70" y="410" font-size="15" fill="#41506a">不是"用满"，而是"留多少"</text>
    <text x="70" y="436" font-size="15" fill="#41506a">去接住那些没预料到的事</text>

    <line x1="70" y1="464" x2="370" y2="464" stroke="#edf1f7" stroke-width="1.5"/>

    <text x="70" y="496" font-size="13" fill="#8593a8">最容易走错的</text>
    <text x="70" y="526" font-size="14" fill="#c2413f">把机器长期顶在 85%，</text>
    <text x="70" y="550" font-size="14" fill="#c2413f">以为省下的是成本</text>
  </g>

  <!-- ===== 卡片 2：JVM ===== -->
  <g>
    <rect x="440" y="146" width="360" height="424" rx="16" fill="#ffffff" stroke="#e3e9f2" filter="url(#cardShadow)"/>
    <rect x="440" y="162" width="5" height="392" rx="2.5" fill="#f59e0b"/>

    <text x="470" y="204" font-size="26" font-weight="700" fill="#16233a">Java / JVM</text>
    <text x="470" y="232" font-size="13" fill="#8593a8">看得见的资源</text>
    <text x="470" y="262" font-size="15" fill="#41506a">堆大小、元空间、线程数、</text>
    <text x="470" y="288" font-size="15" fill="#41506a">收集器类型</text>

    <line x1="470" y1="316" x2="770" y2="316" stroke="#edf1f7" stroke-width="1.5"/>

    <text x="470" y="348" font-size="13" fill="#8593a8">真正稀缺的</text>
    <text x="470" y="380" font-size="18" font-weight="700" fill="#d97706">停顿预算</text>
    <text x="470" y="410" font-size="15" fill="#41506a">决定体验的不是堆有多大，</text>
    <text x="470" y="436" font-size="15" fill="#41506a">而是能卡几次、每次多久</text>

    <line x1="470" y1="464" x2="770" y2="464" stroke="#edf1f7" stroke-width="1.5"/>

    <text x="470" y="496" font-size="13" fill="#8593a8">最容易走错的</text>
    <text x="470" y="526" font-size="14" fill="#c2413f">把 -Xmx 调大，当成</text>
    <text x="470" y="550" font-size="14" fill="#c2413f">治内存问题的办法</text>
  </g>

  <!-- ===== 卡片 3：上下文 ===== -->
  <g>
    <rect x="840" y="146" width="360" height="424" rx="16" fill="#ffffff" stroke="#e3e9f2" filter="url(#cardShadow)"/>
    <rect x="840" y="162" width="5" height="392" rx="2.5" fill="#10b981"/>

    <text x="870" y="204" font-size="26" font-weight="700" fill="#16233a">上下文工程</text>
    <text x="870" y="232" font-size="13" fill="#8593a8">看得见的资源</text>
    <text x="870" y="262" font-size="15" fill="#41506a">token 数量、窗口大小、</text>
    <text x="870" y="288" font-size="15" fill="#41506a">调用成本</text>

    <line x1="870" y1="316" x2="1170" y2="316" stroke="#edf1f7" stroke-width="1.5"/>

    <text x="870" y="348" font-size="13" fill="#8593a8">真正稀缺的</text>
    <text x="870" y="380" font-size="18" font-weight="700" fill="#059669">注意力</text>
    <text x="870" y="410" font-size="15" fill="#41506a">塞进去不等于读进去，</text>
    <text x="870" y="436" font-size="15" fill="#41506a">中间那一段最容易被略过</text>

    <line x1="870" y1="464" x2="1170" y2="464" stroke="#edf1f7" stroke-width="1.5"/>

    <text x="870" y="496" font-size="13" fill="#8593a8">最容易走错的</text>
    <text x="870" y="526" font-size="14" fill="#c2413f">把窗口开到最大，</text>
    <text x="870" y="550" font-size="14" fill="#c2413f">指望它装下一切</text>
  </g>

  <!-- 底部结论条 -->
  <g>
    <rect x="40" y="606" width="1160" height="78" rx="14" fill="#16233a" filter="url(#barShadow)"/>
    <text x="620" y="640" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">资源总是不够，需求总是涨得更快</text>
    <text x="620" y="666" text-anchor="middle" font-size="14" fill="#9fb0c9">于是所有优化都在回答两个问题：边界在哪，以及怎么在边界里多办事</text>
  </g>
</svg>
